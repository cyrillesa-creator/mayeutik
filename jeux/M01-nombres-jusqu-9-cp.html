<script>
(function () {
  'use strict';

  const donnees = JSON.parse(document.getElementById('donnees-jeu').textContent);

  /* ---------- Utilitaires génériques ---------- */

  function nombreAleatoire(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function choisir(tableau) { return tableau[Math.floor(Math.random() * tableau.length)]; }
  function melanger(tableau) {
    const copie = [...tableau];
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }
  const maj = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------- Étoiles : stockage sûr (mémoire + localStorage best-effort) ---------- */

  const CLE_STOCKAGE = 'mayeutik-m01-jardin-etoiles';
  let memoireEtoiles = null;

  function lireEtoiles() {
    if (memoireEtoiles === null) {
      memoireEtoiles = {};
      try {
        const brut = window.localStorage.getItem(CLE_STOCKAGE);
        if (brut) memoireEtoiles = JSON.parse(brut);
      } catch (e) {
        memoireEtoiles = {};
      }
    }
    return memoireEtoiles;
  }
  function enregistrerEtoiles(jeuId, valeur) {
    const tout = lireEtoiles();
    tout[jeuId] = Math.max(tout[jeuId] || 0, valeur);
    memoireEtoiles = tout;
    try {
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : les étoiles restent valables pour la session en cours.
    }
  }
  function creerEtoiles(valeur, max) {
    max = max || 3;
    const cont = document.createElement('span');
    cont.className = 'etoiles';
    for (let i = 1; i <= max; i++) {
      const s = document.createElement('span');
      s.className = 'etoile' + (i <= valeur ? ' pleine' : '');
      s.textContent = '★';
      cont.appendChild(s);
    }
    return cont;
  }
  function calculerEtoiles(score, total) {
    const pct = score / total;
    if (pct >= 1) return 3;
    if (pct >= 0.66) return 2;
    if (pct >= 0.33) return 1;
    return 0;
  }

  /* ---------- Sessions : contrat de données v1 (CHARTE.md, section 11) ---------- */
  // Implémentation de référence copiée de M17, avec MODULE_ID adapté.

  const CLE_SESSIONS = 'mayeutik-sessions';
  const CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';
  const MODULE_ID = 'M01';
  const MAX_SESSIONS_PAR_PROFIL = 500;

  let memoireProfilActif = null;
  let memoireSessions = null;

  function lireProfilActif() {
    if (memoireProfilActif === null) {
      memoireProfilActif = 'p1';
      try {
        const brut = window.localStorage.getItem(CLE_PROFIL_ACTIF);
        if (brut) memoireProfilActif = brut;
      } catch (e) {
        memoireProfilActif = 'p1';
      }
    }
    return memoireProfilActif;
  }
  function lireSessions() {
    if (memoireSessions === null) {
      memoireSessions = [];
      try {
        const brut = window.localStorage.getItem(CLE_SESSIONS);
        if (brut) memoireSessions = JSON.parse(brut);
      } catch (e) {
        memoireSessions = [];
      }
    }
    return memoireSessions;
  }
  function enregistrerSession(competence, score, total, duree) {
    const profilId = lireProfilActif();
    const toutes = lireSessions();
    toutes.push({ profilId, module: MODULE_ID, competence, score, total, date: new Date().toISOString(), duree });
    let compteur = 0;
    for (let i = toutes.length - 1; i >= 0; i--) {
      if (toutes[i].profilId === profilId) {
        compteur++;
        if (compteur > MAX_SESSIONS_PAR_PROFIL) toutes.splice(i, 1);
      }
    }
    memoireSessions = toutes;
    try {
      window.localStorage.setItem(CLE_SESSIONS, JSON.stringify(toutes));
    } catch (e) {
      // localStorage indisponible : la session reste valable pour la session en cours.
    }
  }

  /* ---------- Confettis (CHARTE.md, section 4) ---------- */

  function lancerConfettis() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const conteneur = document.getElementById('confettis-conteneur');
    const couleurs = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];
    const total = 36;
    for (let i = 0; i < total; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.backgroundColor = couleurs[Math.floor(Math.random() * couleurs.length)];
      p.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      p.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      conteneur.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
      setTimeout(() => p.remove(), 2500);
    }
  }

  /* ---------- Feedback sonore (Web Audio) ---------- */

  let contexteAudio = null;
  function obtenirContexteAudio() {
    if (!contexteAudio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      contexteAudio = new Ctx();
    }
    if (contexteAudio.state === 'suspended') contexteAudio.resume();
    return contexteAudio;
  }
  function jouerSon(type) {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const maintenant = ctx.currentTime;
    if (type === 'tic') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, maintenant);
      gain.gain.exponentialRampToValueAtTime(0.12, maintenant + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, maintenant + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start(maintenant); osc.stop(maintenant + 0.09);
      return;
    }
    const notes = type === 'bravo' ? [523.25, 659.25, 783.99, 1046.5] : [392.0, 293.66];
    const duree = type === 'bravo' ? 0.11 : 0.17;
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const debut = maintenant + i * duree;
      gain.gain.setValueAtTime(0.0001, debut);
      gain.gain.exponentialRampToValueAtTime(0.22, debut + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
      osc.connect(gain).connect(ctx.destination);
      osc.start(debut); osc.stop(debut + duree + 0.02);
    });
  }

  /* ---------- Consigne lue à voix haute (SpeechSynthesis, CP non-lecteurs) ---------- */

  /* Choix de la voix. Sans voix explicitement demandée, le navigateur prend la
     voix PAR DÉFAUT de la langue — presque toujours la plus basique, au rendu
     très mécanique. Or la plupart des appareils embarquent aussi des voix de
     bien meilleure facture, gratuites et DÉJÀ INSTALLÉES : « Enhanced » et
     « Premium » sur iOS/macOS, « Neural »/« Natural » sur Windows et Android.
     On les repère à leur nom et on les préfère. Tout reste local : rien n'est
     téléchargé, aucun service distant n'est appelé (cf. autonomie des jeux). */
  const VOIX_QUALITE = /(enhanced|premium|neural|natural|siri|wavenet|studio)/i;
  // Voix françaises réputées les plus agréables selon les plateformes, quand
  // aucun marqueur de qualité n'apparaît dans le nom.
  const VOIX_FR_SOIGNEES = /(am[ée]lie|thomas|audrey|aur[ée]lie|c[ée]line|marie)/i;

  /* Débit légèrement ralenti : la consigne s'adresse à un enfant qui ne lit pas
     encore, et un débit posé fait plus pour le naturel perçu que n'importe quel
     autre réglage. La HAUTEUR reste à sa valeur naturelle (1) : la déplacer est
     appliqué comme une transformation par-dessus la voix, et c'est le réglage
     qui risque le plus de réintroduire le côté métallique qu'on cherche
     justement à supprimer. Les deux valeurs sont ici pour être ajustées d'un
     seul endroit si l'oreille en décide autrement. */
  const DEBIT_VOIX = 0.92;
  const HAUTEUR_VOIX = 1;

  let voixRetenue = null;

  function scoreVoix(voix) {
    const nom = voix.name || '';
    let score = 0;
    if (VOIX_QUALITE.test(nom)) score += 8;       // voix haut de gamme annoncée
    if (VOIX_FR_SOIGNEES.test(nom)) score += 3;   // voix française réputée
    if (/^fr[-_]fr$/i.test(voix.lang || '')) score += 2; // accent de France
    if (voix.localService) score += 1;            // embarquée : marche hors ligne
    if (voix.default) score += 0.5;               // départage
    return score;
  }

  /* La liste des voix se remplit de façon ASYNCHRONE sur plusieurs navigateurs :
     un premier appel peut renvoyer une liste vide. On recalcule donc à chaque
     lecture (et à chaque `voiceschanged`), en conservant la meilleure voix déjà
     trouvée tant que la liste est momentanément vide. */
  function voixFrancaises() {
    if (!window.speechSynthesis || !window.speechSynthesis.getVoices) return [];
    const toutes = window.speechSynthesis.getVoices() || [];
    return toutes.filter((v) => /^fr([-_]|$)/i.test(v.lang || ''));
  }

  function voixPreferee() {
    try {
      const francaises = voixFrancaises();
      if (!francaises.length) return voixRetenue; // liste pas encore chargée
      const meilleure = francaises.slice().sort((a, b) => scoreVoix(b) - scoreVoix(a))[0];
      if (meilleure) voixRetenue = meilleure;
      return voixRetenue;
    } catch (e) {
      return voixRetenue; // aucune voix exploitable : on laissera le navigateur choisir
    }
  }

  /* Meilleure voix EMBARQUÉE (sans réseau). Certaines des plus belles voix sont
     servies en ligne (« … Online (Natural) » sous Windows) : excellentes quand
     la connexion est là, muettes sans elle. On garde donc sous la main de quoi
     relire hors ligne — les jeux doivent rester utilisables sans réseau. */
  function voixLocale() {
    try {
      const locales = voixFrancaises().filter((v) => v.localService);
      if (!locales.length) return null;
      return locales.slice().sort((a, b) => scoreVoix(b) - scoreVoix(a))[0];
    } catch (e) {
      return null;
    }
  }

  try {
    if (window.speechSynthesis) {
      voixPreferee(); // amorce le chargement là où getVoices() le déclenche
      if ('onvoiceschanged' in window.speechSynthesis) {
        window.speechSynthesis.addEventListener('voiceschanged', voixPreferee);
      }
    }
  } catch (e) { /* synthèse vocale indisponible : rien à préparer */ }

  function lireAVoixHaute(texte) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      // Aucune voix française trouvée : on s'en remet au navigateur via `lang`,
      // exactement comme avant — la consigne reste lue, sans erreur.
      const voix = voixPreferee();
      if (voix) {
        u.voice = voix;
        if (voix.lang) u.lang = voix.lang;
      }
      u.rate = DEBIT_VOIX;
      u.pitch = HAUTEUR_VOIX;
      // Voix distante injoignable (hors ligne) : on relit UNE fois avec la
      // meilleure voix embarquée. On ignore les erreurs d'interruption, qui
      // signalent seulement qu'une lecture a été coupée par la suivante.
      if (voix && voix.localService === false) {
        u.onerror = (ev) => {
          const cause = ev && ev.error;
          if (cause === 'canceled' || cause === 'interrupted') return;
          const secours = voixLocale();
          if (!secours) return;
          try {
            const u2 = new SpeechSynthesisUtterance(texte);
            u2.voice = secours;
            u2.lang = secours.lang || 'fr-FR';
            u2.rate = DEBIT_VOIX;
            u2.pitch = HAUTEUR_VOIX;
            window.speechSynthesis.speak(u2);
          } catch (e2) { /* on renonce : la consigne reste lisible à l'écran */ }
        };
      }
      window.speechSynthesis.speak(u);
    } catch (e) {
      // synthèse vocale indisponible : la consigne reste lisible à l'écran.
    }
  }
  function creerBlocConsigne(texte, texteVoix) {
    const cont = document.createElement('div');
    cont.className = 'bloc-consigne';
    const p = document.createElement('p');
    p.className = 'consigne';
    p.textContent = texte;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bouton-son';
    btn.setAttribute('aria-label', 'Écouter la consigne');
    btn.textContent = '🔊';
    const texteALire = texteVoix || texte;
    btn.addEventListener('click', () => lireAVoixHaute(texteALire));
    cont.appendChild(p);
    cont.appendChild(btn);
    lireAVoixHaute(texteALire);
    return cont;
  }

  /* ---------- Glisser-déposer tactile générique (constituer / ranger) ---------- */

  /* Gel du défilement pendant un glisser-déposer.
     Le geste de l'enfant est lent et hésitant : le navigateur finit souvent par
     l'interpréter comme un défilement, ce qui fait DÉFILER la page sous ses
     doigts et, pire, lui envoie un `pointercancel` qui abandonne le geste en
     cours de route. On fige donc la page le temps du geste, et seulement ce
     temps-là : hors glissement, le défilement reste entièrement normal (l'enfant
     doit pouvoir faire défiler pour voir un élément hors champ avant de le
     saisir).
     Le compteur autorise plusieurs glissements simultanés (deux doigts) sans que
     le premier relâché ne dégèle pour l'autre. */
  let glissementsEnCours = 0;
  let defilementGele = null;

  function bloquerToucher(e) { e.preventDefault(); }

  function gelerDefilement() {
    glissementsEnCours++;
    if (glissementsEnCours > 1) return;
    defilementGele = { x: window.scrollX, y: window.scrollY };
    document.documentElement.classList.add('glisse-en-cours');
    // Filet supplémentaire : certains navigateurs entament le défilement avant
    // d'avoir pris en compte `touch-action`. Écouteur NON passif, sans quoi
    // preventDefault serait ignoré.
    document.addEventListener('touchmove', bloquerToucher, { passive: false });
  }

  function degelerDefilement() {
    glissementsEnCours = Math.max(0, glissementsEnCours - 1);
    if (glissementsEnCours > 0) return;
    document.documentElement.classList.remove('glisse-en-cours');
    document.removeEventListener('touchmove', bloquerToucher, { passive: false });
    // `overflow:hidden` peut avoir ramené la page en haut : on rétablit la
    // position exacte qu'elle avait au début du geste.
    if (defilementGele) {
      window.scrollTo(defilementGele.x, defilementGele.y);
      defilementGele = null;
    }
  }

  /* Décide si un élément lâché « compte » comme déposé sur une cible.
     Le pointeur seul ne suffit pas : l'enfant vise l'OBJET, pas son doigt, et
     l'objet peut recouvrir largement le panier alors que le doigt est déjà
     quelques pixels en dehors. On accepte donc le dépôt si le doigt est dans la
     cible OU si l'objet la recouvre franchement. Renvoie un score (0 = pas
     déposé) pour pouvoir départager plusieurs cibles voisines. */
  const PART_RECOUVREMENT_MIN = 0.3;

  function scoreDepot(rectLache, x, y, cible) {
    const r = cible.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return Infinity;
    if (!rectLache) return 0;
    const largeur = Math.max(0, Math.min(rectLache.right, r.right) - Math.max(rectLache.left, r.left));
    const hauteur = Math.max(0, Math.min(rectLache.bottom, r.bottom) - Math.max(rectLache.top, r.top));
    const aire = largeur * hauteur;
    const aireObjet = rectLache.width * rectLache.height;
    return aireObjet > 0 && aire >= aireObjet * PART_RECOUVREMENT_MIN ? aire : 0;
  }

  function meilleureCible(rectLache, x, y, cibles) {
    let gagnante = null, meilleur = 0;
    cibles.forEach((cible) => {
      const s = scoreDepot(rectLache, x, y, cible);
      if (s > meilleur) { meilleur = s; gagnante = cible; }
    });
    return gagnante;
  }

  function activerDrag(element, options) {
    element.style.touchAction = 'none';
    element.addEventListener('pointerdown', (e) => {
      if (element.disabled) return;
      e.preventDefault();
      const rectDepart = element.getBoundingClientRect();
      const decalX = e.clientX - rectDepart.left;
      const decalY = e.clientY - rectDepart.top;
      let dernierX = e.clientX, dernierY = e.clientY;
      let termine = false;
      try { element.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      gelerDefilement();
      element.classList.add('en-glisse');
      element.style.position = 'fixed';
      element.style.zIndex = '500';
      element.style.width = rectDepart.width + 'px';
      element.style.left = rectDepart.left + 'px';
      element.style.top = rectDepart.top + 'px';

      const bouger = (ev) => {
        dernierX = ev.clientX; dernierY = ev.clientY;
        element.style.left = (ev.clientX - decalX) + 'px';
        element.style.top = (ev.clientY - decalY) + 'px';
      };
      /* Fin du geste — quelle qu'en soit la cause. Un `pointercancel` (le
         navigateur reprend la main) ou une capture perdue laissaient l'objet
         EN L'AIR, en `position:fixed`, jamais déposé : c'est ce qui donnait
         l'impression qu'il « refusait de se fixer » dans le panier. On termine
         donc toujours de la même façon, et on dépose à la dernière position
         connue du doigt. */
      const terminer = (ev) => {
        if (termine) return;
        termine = true;
        if (ev && typeof ev.clientX === 'number' && (ev.clientX || ev.clientY)) {
          dernierX = ev.clientX; dernierY = ev.clientY;
        }
        element.removeEventListener('pointermove', bouger);
        element.removeEventListener('pointerup', terminer);
        element.removeEventListener('pointercancel', terminer);
        element.removeEventListener('lostpointercapture', terminer);
        // Position réellement occupée par l'objet au moment du lâcher : elle
        // disparaît dès qu'on lui rend sa mise en page normale, il faut donc la
        // relever AVANT.
        const rectLache = element.getBoundingClientRect();
        element.classList.remove('en-glisse');
        element.style.position = '';
        element.style.zIndex = '';
        element.style.width = '';
        element.style.left = '';
        element.style.top = '';
        degelerDefilement();
        options.onDepose(dernierX, dernierY, element, rectLache);
      };
      element.addEventListener('pointermove', bouger);
      element.addEventListener('pointerup', terminer);
      element.addEventListener('pointercancel', terminer);
      element.addEventListener('lostpointercapture', terminer);
    });
  }

  /* ---------- État global ---------- */

  let etat = { jeuId: null, index: 0, score: 0, verrouille: false, demarreLe: 0 };
  const configJeux = donnees.jeux;

  function plageActuelle() {
    return etat.index <= 3 ? { min: 1, max: 5 } : { min: 1, max: 9 };
  }

  /* ---------- Écran d'accueil ---------- */

  /* Remonte en haut à chaque changement d'écran (CHARTE §17) : sans cela, le
     nouvel écran hérite du défilement de l'écran précédent — l'enfant qui
     vient de valider en bas de page se retrouverait au milieu de la manche
     suivante. Repositionnement instantané (jamais « smooth » : un glissement
     animé pendant une transition est parasite). */
  function remonterEnHaut() {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) {
      window.scrollTo(0, 0); // navigateurs sans l'API à options
    }
  }

  /* Correction après une MAUVAISE réponse (CHARTE §18) : ce que l'enfant a
     répondu en rouge, ce qu'il fallait répondre en vert. N'est jamais appelée
     sur une bonne réponse (elle brouillerait la récompense). */
  function afficherCorrection(zone, donnee, attendue) {
    const bloc = document.createElement('p');
    bloc.className = 'bloc-correction';
    if (donnee !== null && donnee !== undefined && donnee !== '') {
      const d = document.createElement('span');
      d.className = 'correction-donnee';
      d.textContent = 'Ta réponse : ' + donnee;
      bloc.appendChild(d);
      bloc.appendChild(document.createTextNode(' — '));
    }
    const a = document.createElement('span');
    a.className = 'correction-attendue';
    a.textContent = 'La bonne réponse : ' + attendue;
    bloc.appendChild(a);
    zone.appendChild(bloc);
    return bloc;
  }

  function construireAccueil() {
    document.getElementById('sous-titre-accueil').textContent = donnees.sousTitre;
    const grille = document.getElementById('grille-jeux');
    grille.innerHTML = '';
    configJeux.forEach((cfg) => {
      const carte = document.createElement('button');
      carte.className = 'carte-jeu carte-' + cfg.couleur;
      carte.dataset.jeu = cfg.id;

      const icone = document.createElement('div');
      icone.className = 'icone';
      icone.textContent = cfg.icone;

      const titre = document.createElement('h2');
      titre.textContent = cfg.titre;

      const desc = document.createElement('p');
      desc.textContent = cfg.description;

      const tout = lireEtoiles();
      const etoiles = creerEtoiles(tout[cfg.id] || 0);

      carte.appendChild(icone);
      carte.appendChild(titre);
      carte.appendChild(desc);
      carte.appendChild(etoiles);
      carte.addEventListener('click', () => demarrerJeu(cfg.id));
      grille.appendChild(carte);
    });
  }

  function retourAccueil() {
    if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    document.getElementById('ecran-jeu').hidden = true;
    document.getElementById('ecran-accueil').hidden = false;
    construireAccueil();
    remonterEnHaut();
  }

  /* ---------- Contrôleur de jeu ---------- */

  function trouverConfig(jeuId) { return configJeux.find((j) => j.id === jeuId); }

  function demarrerJeu(jeuId) {
    etat = { jeuId, index: 0, score: 0, verrouille: false, demarreLe: Date.now() };
    document.getElementById('ecran-accueil').hidden = true;
    document.getElementById('ecran-jeu').hidden = false;
    document.getElementById('titre-jeu-courant').textContent = trouverConfig(jeuId).titre;
    questionSuivante();
    remonterEnHaut();
  }

  function majProgression() {
    const cfg = trouverConfig(etat.jeuId);
    document.getElementById('progression-jeu').textContent = 'Question ' + etat.index + ' / ' + cfg.nbQuestions;
  }

  function questionSuivante() {
    const cfg = trouverConfig(etat.jeuId);
    if (etat.index >= cfg.nbQuestions) { afficherResultats(cfg); return; }
    etat.index++;
    etat.verrouille = false;
    majProgression();
    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    document.getElementById('zone-feedback').textContent = '';
    document.getElementById('zone-feedback').className = 'feedback';
    document.getElementById('bouton-suivant').hidden = true;
    if (cfg.id === 'denombrer') genererDenombrer(zone, cfg);
    else if (cfg.id === 'etiqueter') genererEtiqueter(zone, cfg);
    else if (cfg.id === 'comparer') genererComparer(zone, cfg);
    else if (cfg.id === 'constituer') genererConstituer(zone, cfg);
    else if (cfg.id === 'autant-que') genererAutantQue(zone, cfg);
    else if (cfg.id === 'ranger') genererRanger(zone, cfg);
    remonterEnHaut();
  }

  /* `correction` (facultatif) = { donnee, attendue } : affiché uniquement en cas
     d'erreur, sous le message de feedback (CHARTE §18). */
  function validerReponse(estCorrecte, correction) {
    if (etat.verrouille) return;
    etat.verrouille = true;
    const zoneFeedback = document.getElementById('zone-feedback');
    if (estCorrecte) {
      etat.score++;
      zoneFeedback.textContent = choisir(donnees.messagesFeedback.bravo);
      zoneFeedback.className = 'feedback feedback-succes';
      lancerConfettis();
      jouerSon('bravo');
    } else {
      zoneFeedback.textContent = choisir(donnees.messagesFeedback.rate);
      zoneFeedback.className = 'feedback feedback-erreur';
      jouerSon('rate');
      if (correction) afficherCorrection(zoneFeedback, correction.donnee, correction.attendue);
    }
    document.getElementById('bouton-suivant').hidden = false;
  }

  function afficherResultats(cfg) {
    document.getElementById('progression-jeu').textContent = 'Résultats';
    document.getElementById('bouton-suivant').hidden = true;
    document.getElementById('zone-feedback').textContent = '';
    const etoilesGagnees = calculerEtoiles(etat.score, cfg.nbQuestions);
    enregistrerEtoiles(cfg.id, etoilesGagnees);
    const dureeSecondes = Math.max(0, Math.round((Date.now() - etat.demarreLe) / 1000));
    enregistrerSession(cfg.id, etat.score, cfg.nbQuestions, dureeSecondes);

    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    const bloc = document.createElement('div');
    bloc.className = 'bloc-resultats';

    const titre = document.createElement('h3');
    titre.textContent = 'Fin du jeu !';

    const score = document.createElement('p');
    score.className = 'score-texte';
    score.textContent = etat.score + ' / ' + cfg.nbQuestions + ' bonnes réponses';

    const etoiles = creerEtoiles(etoilesGagnees);

    const boutons = document.createElement('div');
    boutons.className = 'boutons-resultats';

    const rejouer = document.createElement('button');
    rejouer.className = 'bouton-principal';
    rejouer.textContent = 'Rejouer';
    rejouer.addEventListener('click', () => demarrerJeu(cfg.id));

    const accueilBtn = document.createElement('button');
    accueilBtn.className = 'bouton-secondaire';
    accueilBtn.textContent = "Retour à l'accueil";
    accueilBtn.addEventListener('click', retourAccueil);

    boutons.appendChild(rejouer);
    boutons.appendChild(accueilBtn);

    bloc.appendChild(titre);
    bloc.appendChild(etoiles);
    bloc.appendChild(score);
    bloc.appendChild(boutons);
    zone.appendChild(bloc);

    if (etoilesGagnees === 3) {
      lancerConfettis();
      jouerSon('bravo');
    }
    remonterEnHaut();
  }

  /* ---------- Mini-jeu 1 : Compte les petites bêtes (dénombrer — tap) ---------- */

  function positionsGrille(n) {
    const cols = 3;
    const rows = Math.ceil(n / cols);
    const cellules = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cellules.push({ r, c });
    const melangees = melanger(cellules);
    const largeurCellule = 100 / cols;
    const hauteurCellule = 100 / rows;
    return melangees.slice(0, n).map(({ r, c }) => ({
      x: c * largeurCellule + largeurCellule * (0.22 + Math.random() * 0.56),
      y: r * hauteurCellule + hauteurCellule * (0.22 + Math.random() * 0.56)
    }));
  }

  function genererDenombrer(zone, cfg) {
    const plage = plageActuelle();
    // Évite de reposer la même question (même nombre, même espèce) que la
    // manche précédente — la plage étant étroite en début de partie (1 à 5),
    // le risque de répétition immédiate serait sinon non négligeable (CHARTE §13).
    let n, especeId;
    do {
      n = nombreAleatoire(plage.min, plage.max);
      especeId = choisir(Object.keys(donnees.especes));
    } while (etat.dernierDenombrer && n === etat.dernierDenombrer.n && especeId === etat.dernierDenombrer.especeId);
    etat.dernierDenombrer = { n, especeId };
    const espece = donnees.especes[especeId];

    const consigneTexte = n === 1
      ? `Tape sur ${espece.laLe} du jardin pour la compter !`
      : `Tape sur chaque ${espece.singulier} du jardin pour les compter !`;
    zone.appendChild(creerBlocConsigne(consigneTexte));

    const scene = document.createElement('div');
    scene.className = 'zone-jardin';
    const positions = positionsGrille(n);
    // Aucun compteur affiché : le "pop" de chaque bête confirme juste qu'elle
    // est déjà comptée (pour ne pas la recompter), mais le total ne doit
    // jamais apparaître avant que l'enfant ne le saisisse lui-même.
    let compte = 0;

    const zonePave = document.createElement('div');
    zonePave.id = 'zone-pave';

    for (let i = 0; i < n; i++) {
      const bete = document.createElement('button');
      bete.type = 'button';
      bete.className = 'bete-jardin';
      bete.textContent = espece.emoji;
      bete.style.left = positions[i].x + '%';
      bete.style.top = positions[i].y + '%';
      bete.addEventListener('click', () => {
        if (bete.classList.contains('comptee')) return;
        bete.classList.add('comptee');
        bete.disabled = true;
        compte++;
        jouerSon('tic');
        if (compte === n) setTimeout(afficherPaveNumerique, 350);
      });
      scene.appendChild(bete);
    }
    zone.appendChild(scene);
    zone.appendChild(zonePave);

    function afficherPaveNumerique() {
      zonePave.innerHTML = '';
      const motCompte = n === 1 ? espece.singulier : espece.pluriel;
      const consigne2 = n === 1
        ? `As-tu compté ${motCompte} ? Appuie sur le bon nombre.`
        : `Combien de ${motCompte} as-tu comptées ? Appuie sur le bon nombre.`;
      zonePave.appendChild(creerBlocConsigne(consigne2, consigne2));
      const pave = document.createElement('div');
      pave.className = 'pave-numerique';
      for (let d = plage.min; d <= plage.max; d++) {
        const touche = document.createElement('button');
        touche.type = 'button';
        touche.className = 'touche-chiffre';
        touche.textContent = String(d);
        touche.addEventListener('click', () => {
          if (etat.verrouille) return;
          Array.from(pave.children).forEach((b) => (b.disabled = true));
          const estCorrecte = d === n;
          touche.classList.add(estCorrecte ? 'correct' : 'incorrect');
          if (!estCorrecte) {
            const bonneTouche = Array.from(pave.children).find((b) => b.textContent === String(n));
            if (bonneTouche) bonneTouche.classList.add('correct');
          }
          validerReponse(estCorrecte);
        });
        pave.appendChild(touche);
      }
      zonePave.appendChild(pave);
    }
  }

  /* ---------- Mini-jeu 2 : La bonne étiquette (associer — relier) ---------- */

  const PIPS_DE = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function creerDe(n) {
    const de = document.createElement('div');
    de.className = 'de-points';
    const motifs = PIPS_DE[n] || [];
    for (let i = 0; i < 9; i++) {
      const point = document.createElement('span');
      point.className = 'point-de' + (motifs.includes(i) ? ' actif' : '');
      de.appendChild(point);
    }
    return de;
  }
  function creerMiniCollection(especeId, n) {
    const espece = donnees.especes[especeId];
    const cont = document.createElement('div');
    cont.className = 'mini-collection';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.textContent = espece.emoji;
      cont.appendChild(s);
    }
    return cont;
  }
  function dessinerTrait(svg, elA, elB, conteneur, couleur) {
    const rectConteneur = conteneur.getBoundingClientRect();
    const rectA = elA.getBoundingClientRect();
    const rectB = elB.getBoundingClientRect();
    const ligne = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ligne.setAttribute('x1', String(rectA.right - rectConteneur.left));
    ligne.setAttribute('y1', String(rectA.top + rectA.height / 2 - rectConteneur.top));
    ligne.setAttribute('x2', String(rectB.left - rectConteneur.left));
    ligne.setAttribute('y2', String(rectB.top + rectB.height / 2 - rectConteneur.top));
    ligne.setAttribute('class', 'trait-connexion');
    ligne.setAttribute('stroke', couleur);
    svg.appendChild(ligne);
    return ligne;
  }
  const PALETTE_LIENS = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];

  function genererEtiqueter(zone, cfg) {
    const plage = plageActuelle();
    const valeurs = melanger(Array.from({ length: plage.max - plage.min + 1 }, (_, i) => plage.min + i)).slice(0, 4);

    zone.appendChild(creerBlocConsigne("Relie chaque collection à son étiquette-nombre, puis valide !"));

    const cartesGauche = valeurs.map((n) => {
      const utiliserDe = n <= 6 && Math.random() < 0.35;
      if (utiliserDe) return { n, type: 'de' };
      return { n, type: 'collection', especeId: choisir(Object.keys(donnees.especes)) };
    });
    const gaucheAffiche = melanger(cartesGauche.map((c, i) => ({ ...c, id: i, couleur: PALETTE_LIENS[i % PALETTE_LIENS.length] })));
    const droiteAffiche = melanger(valeurs.map((n, i) => ({ n, id: i })));

    const zoneMatch = document.createElement('div');
    zoneMatch.className = 'zone-etiquetage';
    const colGauche = document.createElement('div');
    colGauche.className = 'colonne-etiquetage';
    const colDroite = document.createElement('div');
    colDroite.className = 'colonne-etiquetage';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'traits-connexion');

    const gauches = {}; // id -> { n, couleur, btn, droiteId, ligne }
    const droites = {}; // id -> { n, btn, gaucheId }
    let selectionGaucheId = null;

    function deconnecter(gaucheId) {
      const g = gauches[gaucheId];
      if (g.droiteId !== null) {
        const d = droites[g.droiteId];
        d.gaucheId = null;
        d.btn.classList.remove('liee');
        d.btn.style.removeProperty('--couleur-lien');
      }
      if (g.ligne) { g.ligne.remove(); g.ligne = null; }
      g.droiteId = null;
      g.btn.classList.remove('liee');
      g.btn.style.removeProperty('--couleur-lien');
    }

    function majBoutonValider() {
      boutonValider.hidden = !Object.values(gauches).every((g) => g.droiteId !== null);
    }

    function connecter(gaucheId, droiteId) {
      const g = gauches[gaucheId];
      const d = droites[droiteId];
      if (g.droiteId !== null && g.droiteId !== droiteId) deconnecter(gaucheId);
      if (d.gaucheId !== null && d.gaucheId !== gaucheId) deconnecter(d.gaucheId);
      // Refaire le MÊME lien ne passe par aucune des deux déconnexions
      // ci-dessus : sans ce nettoyage, l'ancien trait resterait orphelin dans le
      // SVG et un second se dessinerait par-dessus. C'est le cas dès qu'on
      // relie deux fois la même paire, et à chaque révélation de la solution
      // (CHARTE §18), qui rappelle connecter() sur les paires déjà justes.
      if (g.ligne) { g.ligne.remove(); g.ligne = null; }
      g.droiteId = droiteId;
      d.gaucheId = gaucheId;
      g.btn.classList.add('liee');
      g.btn.style.setProperty('--couleur-lien', g.couleur);
      d.btn.classList.add('liee');
      d.btn.style.setProperty('--couleur-lien', g.couleur);
      g.ligne = dessinerTrait(svg, g.btn, d.btn, zoneMatch, g.couleur);
      jouerSon('tic');
      majBoutonValider();
    }

    /* Deux façons de relier, toutes deux actives :
         - le TAP SÉQUENTIEL (toucher un bocal, puis son étiquette) ;
         - le TRACÉ CONTINU (partir d'un bocal et glisser sans relâcher jusqu'à
           l'étiquette), avec un trait qui suit le doigt en temps réel.
       Le geste se décide au relâchement : en dessous de SEUIL_TRACE_PX, c'est un
       appui simple et on retombe sur la sélection ; au-delà, c'est un tracé. */
    const SEUIL_TRACE_PX = 8;
    let trace = null; // { gaucheId, ligne, cible }

    function pointDansZone(clientX, clientY) {
      const r = zoneMatch.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }

    function etiquetteSous(clientX, clientY) {
      const el = document.elementFromPoint(clientX, clientY);
      const btn = el && el.closest ? el.closest('.etiquette-nombre') : null;
      return btn && !btn.disabled ? btn : null;
    }

    function survoler(btn) {
      if (trace && trace.cible === btn) return;
      if (trace && trace.cible) trace.cible.classList.remove('cible-survolee');
      if (trace) trace.cible = btn;
      if (btn) btn.classList.add('cible-survolee');
    }

    function terminerTrace() {
      if (!trace) return;
      if (trace.cible) trace.cible.classList.remove('cible-survolee');
      if (trace.ligne) trace.ligne.remove();
      gauches[trace.gaucheId].btn.classList.remove('trace-depart');
      trace = null;
      degelerDefilement();
    }

    gaucheAffiche.forEach((carte) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'carte-etiquetage';
      btn.appendChild(carte.type === 'de' ? creerDe(carte.n) : creerMiniCollection(carte.especeId, carte.n));
      gauches[carte.id] = { n: carte.n, couleur: carte.couleur, btn, droiteId: null, ligne: null };

      function selectionner() {
        if (btn.disabled) return;
        if (selectionGaucheId !== null) gauches[selectionGaucheId].btn.classList.remove('selectionnee');
        selectionGaucheId = carte.id;
        btn.classList.add('selectionnee');
      }
      // `click` ne sert plus qu'au clavier (detail === 0) : au doigt, c'est
      // `pointerup` qui tranche entre appui simple et tracé, sinon un tracé
      // terminé ailleurs déclencherait aussi une sélection parasite.
      btn.addEventListener('click', (e) => { if (e.detail === 0) selectionner(); });

      let departX = 0, departY = 0;
      btn.addEventListener('pointerdown', (e) => {
        if (btn.disabled || etat.verrouille) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (trace) return; // un tracé est déjà en cours : on ignore ce doigt
        e.preventDefault();
        departX = e.clientX; departY = e.clientY;
        try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        gelerDefilement();
        const depart = pointDansZone(
          btn.getBoundingClientRect().right,
          btn.getBoundingClientRect().top + btn.getBoundingClientRect().height / 2
        );
        const ligne = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        ligne.setAttribute('x1', String(depart.x));
        ligne.setAttribute('y1', String(depart.y));
        ligne.setAttribute('x2', String(depart.x));
        ligne.setAttribute('y2', String(depart.y));
        ligne.setAttribute('class', 'trait-en-cours');
        ligne.setAttribute('stroke', carte.couleur);
        svg.appendChild(ligne);
        btn.classList.add('trace-depart');
        trace = { gaucheId: carte.id, ligne, cible: null };
      });

      btn.addEventListener('pointermove', (e) => {
        if (!trace || trace.gaucheId !== carte.id) return;
        e.preventDefault();
        const p = pointDansZone(e.clientX, e.clientY);
        trace.ligne.setAttribute('x2', String(p.x));
        trace.ligne.setAttribute('y2', String(p.y));
        survoler(etiquetteSous(e.clientX, e.clientY));
      });

      function relacher(e) {
        if (!trace || trace.gaucheId !== carte.id) return;
        const distance = Math.hypot(e.clientX - departX, e.clientY - departY);
        const cible = distance >= SEUIL_TRACE_PX ? etiquetteSous(e.clientX, e.clientY) : null;
        const idCible = cible ? Number(cible.dataset.droiteId) : null;
        terminerTrace();
        if (distance < SEUIL_TRACE_PX) { selectionner(); return; } // appui simple
        // Relâché en dehors d'une étiquette : le tracé est simplement abandonné,
        // sans liaison ni sélection en suspens.
        if (idCible === null || Number.isNaN(idCible)) return;
        if (selectionGaucheId !== null) {
          gauches[selectionGaucheId].btn.classList.remove('selectionnee');
          selectionGaucheId = null;
        }
        connecter(carte.id, idCible);
      }
      btn.addEventListener('pointerup', relacher);
      btn.addEventListener('pointercancel', () => terminerTrace());
      btn.addEventListener('lostpointercapture', () => { if (trace) terminerTrace(); });

      colGauche.appendChild(btn);
    });

    droiteAffiche.forEach((etq) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'etiquette-nombre';
      btn.textContent = String(etq.n);
      btn.dataset.droiteId = String(etq.id); // retrouvé par le tracé au doigt
      droites[etq.id] = { n: etq.n, btn, gaucheId: null };
      btn.addEventListener('click', () => {
        if (btn.disabled || selectionGaucheId === null) return;
        const idASelectionner = selectionGaucheId;
        gauches[idASelectionner].btn.classList.remove('selectionnee');
        selectionGaucheId = null;
        connecter(idASelectionner, etq.id);
      });
      colDroite.appendChild(btn);
    });

    zoneMatch.appendChild(svg);
    zoneMatch.appendChild(colGauche);
    zoneMatch.appendChild(colDroite);
    zone.appendChild(zoneMatch);

    // Rien n'est corrigé au fur et à mesure : l'enfant peut refaire ses
    // liens tant qu'il n'a pas appuyé sur Valider (cf. CHARTE.md — la
    // correction groupée laisse le droit à l'essai-erreur sans pénaliser
    // chaque lien pris isolément).
    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider';
    boutonValider.hidden = true;
    boutonValider.addEventListener('click', () => {
      if (etat.verrouille) return;
      let tousCorrects = true;
      Object.values(gauches).forEach((g) => {
        const d = g.droiteId !== null ? droites[g.droiteId] : null;
        const bon = !!d && d.n === g.n;
        g.btn.disabled = true;
        g.btn.classList.add(bon ? 'appariee' : 'non-appariee');
        if (d) { d.btn.disabled = true; d.btn.classList.add(bon ? 'appariee' : 'non-appariee'); }
        if (!bon) tousCorrects = false;
      });
      boutonValider.disabled = true;
      boutonValider.hidden = true;
      if (!tousCorrects) {
        // CHARTE §18 : après avoir montré en rouge les liens faux, on refait
        // sous ses yeux le bon appariement, entièrement en vert.
        setTimeout(() => {
          if (!zoneMatch.isConnected) return; // manche déjà quittée
          const libres = Object.keys(droites);
          Object.keys(gauches).forEach((gid) => {
            const k = libres.findIndex((did) => droites[did].n === gauches[gid].n);
            if (k === -1) return;
            connecter(gid, libres.splice(k, 1)[0]);
          });
          Object.values(gauches).concat(Object.values(droites)).forEach((e) => {
            e.btn.classList.remove('non-appariee');
            e.btn.classList.add('appariee');
          });
          boutonValider.hidden = true; // connecter() rappelle majBoutonValider()
        }, 900);
      }
      validerReponse(tousCorrects);
    });
    zone.appendChild(boutonValider);
  }

  /* ---------- Mini-jeu 3 : Plus, moins, autant (comparer — entourer) ---------- */

  function genererComparer(zone, cfg) {
    const plage = plageActuelle();
    const univers = choisir(donnees.universComparer);
    const motCle = choisir(['PLUS', 'MOINS', 'AUTANT']);

    let contenants;
    if (motCle === 'AUTANT') {
      const reference = nombreAleatoire(plage.min, plage.max);
      let incorrecte;
      do { incorrecte = nombreAleatoire(plage.min, plage.max); } while (incorrecte === reference);
      const candidats = melanger([
        { n: reference, estCorrecte: true },
        { n: incorrecte, estCorrecte: false }
      ]);
      contenants = [{ n: reference, estReference: true }, ...candidats];
    } else {
      const valeurs = new Set();
      while (valeurs.size < 3) valeurs.add(nombreAleatoire(plage.min, plage.max));
      const tableau = Array.from(valeurs);
      const cible = motCle === 'PLUS' ? Math.max(...tableau) : Math.min(...tableau);
      contenants = melanger(tableau.map((n) => ({ n, estCorrecte: n === cible })));
    }

    const consigneTexte = motCle === 'AUTANT'
      ? `Entoure ${univers.article} ${univers.contenant} qui a AUTANT de ${univers.mot} que le modèle !`
      : `Entoure ${univers.article} ${univers.contenant} qui a LE ${motCle} de ${univers.mot} !`;
    zone.appendChild(creerBlocConsigne(consigneTexte));

    const SYMBOLES_MOT_CLE = { PLUS: '+', MOINS: '−', AUTANT: '=' };
    const badge = document.createElement('div');
    badge.className = 'badge-mot-cle';
    badge.textContent = SYMBOLES_MOT_CLE[motCle];
    badge.setAttribute('aria-label', motCle);
    zone.appendChild(badge);

    const rangee = document.createElement('div');
    rangee.className = 'rangee-contenants';
    let boutonCorrect = null;

    contenants.forEach((c) => {
      const boite = document.createElement('div');
      boite.className = 'contenant-comparaison' + (c.estReference ? ' reference' : '');
      if (c.estReference) {
        const tag = document.createElement('span');
        tag.className = 'tag-modele';
        tag.textContent = 'modèle';
        boite.appendChild(tag);
      }
      const contenu = document.createElement('div');
      contenu.className = 'contenu-contenant';
      for (let i = 0; i < c.n; i++) {
        const s = document.createElement('span');
        s.textContent = univers.emoji;
        contenu.appendChild(s);
      }
      boite.appendChild(contenu);

      if (c.estReference) {
        rangee.appendChild(boite);
        return;
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bouton-contenant';
      btn.appendChild(boite);
      if (c.estCorrecte) boutonCorrect = btn;
      btn.addEventListener('click', () => {
        if (etat.verrouille) return;
        Array.from(rangee.querySelectorAll('.bouton-contenant')).forEach((b) => (b.disabled = true));
        btn.classList.add(c.estCorrecte ? 'entoure-correct' : 'entoure-incorrect');
        if (!c.estCorrecte && boutonCorrect) boutonCorrect.classList.add('entoure-correct');
        validerReponse(c.estCorrecte);
      });
      rangee.appendChild(btn);
    });
    zone.appendChild(rangee);
  }

  /* ---------- Mini-jeu 4 : Le compte est juste (constituer — drag & drop) ---------- */

  function genererConstituer(zone, cfg) {
    const plage = plageActuelle();
    // Même précaution que genererDenombrer : évite de reposer la même
    // question (même nombre, même contenant) que la manche précédente (CHARTE §13).
    let n, choix;
    do {
      n = nombreAleatoire(plage.min, plage.max);
      choix = choisir(donnees.contenantsConstituer);
    } while (etat.dernierConstituer && n === etat.dernierConstituer.n && choix.especeId === etat.dernierConstituer.especeId);
    etat.dernierConstituer = { n, especeId: choix.especeId };
    const espece = donnees.especes[choix.especeId];
    const supplement = nombreAleatoire(2, 4);
    const total = Math.min(n + supplement, 12);

    const motEspece = n > 1 ? espece.pluriel : espece.singulier;
    zone.appendChild(creerBlocConsigne(`Fais glisser exactement ${n} ${motEspece} dans ${choix.nomContenant} !`));

    const zoneDrag = document.createElement('div');
    zoneDrag.className = 'zone-constituer';
    const contenantCible = document.createElement('div');
    contenantCible.className = 'contenant-cible';
    const etiquetteContenant = document.createElement('div');
    etiquetteContenant.className = 'etiquette-contenant';
    etiquetteContenant.textContent = maj(choix.nomContenant);
    const grilleCible = document.createElement('div');
    grilleCible.className = 'grille-cible';
    contenantCible.appendChild(etiquetteContenant);
    contenantCible.appendChild(grilleCible);

    const reserve = document.createElement('div');
    reserve.className = 'reserve-drag';

    for (let i = 0; i < total; i++) {
      const bete = document.createElement('div');
      bete.className = 'bete-draggable';
      bete.textContent = espece.emoji;
      reserve.appendChild(bete);
      activerDrag(bete, {
        onDepose(x, y, el, rectLache) {
          const dansZone = scoreDepot(rectLache, x, y, grilleCible) > 0;
          if (dansZone && bete.parentElement !== grilleCible) grilleCible.appendChild(bete);
          else if (!dansZone && bete.parentElement === grilleCible) reserve.appendChild(bete);
        }
      });
    }

    zoneDrag.appendChild(contenantCible);
    zoneDrag.appendChild(reserve);
    zone.appendChild(zoneDrag);

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider';
    boutonValider.addEventListener('click', () => {
      if (etat.verrouille) return;
      const place = grilleCible.querySelectorAll('.bete-draggable').length;
      const estCorrecte = place === n;
      Array.from(reserve.children).forEach((b) => { b.style.pointerEvents = 'none'; });
      Array.from(grilleCible.children).forEach((b) => { b.style.pointerEvents = 'none'; });
      boutonValider.disabled = true;
      boutonValider.hidden = true;
      // CHARTE §18 : le contenant vire au vert ou au rouge, et le bon nombre
      // est rappelé sous le feedback.
      contenantCible.classList.add(estCorrecte ? 'contenant-correct' : 'contenant-incorrect');
      validerReponse(estCorrecte, estCorrecte ? null
        : { donnee: place + (place > 1 ? ' bêtes' : ' bête'), attendue: n + (n > 1 ? ' bêtes' : ' bête') });
    });
    zone.appendChild(boutonValider);
  }

  /* ---------- Mini-jeu 5 : Autant que le modèle (comparaison constructive — tap) ---------- */

  function genererAutantQue(zone, cfg) {
    const plage = plageActuelle();
    // Même précaution que genererDenombrer : la boucle ci-dessous garantit
    // déjà une combinaison VALIDE ; elle rejette en plus toute combinaison
    // IDENTIQUE à la manche précédente (même modèle, relation et espèce), pour
    // éviter de reposer la même question dans une même partie (CHARTE §13).
    let modele = plage.min;
    let relation = 'autant';
    let especeId = donnees.especesAutantQue[0];
    for (let t = 0; t < 30; t++) {
      modele = nombreAleatoire(plage.min, plage.max);
      relation = choisir(['autant', 'plus-un', 'moins-un']);
      especeId = choisir(donnees.especesAutantQue);
      if (relation === 'moins-un' && modele < 2) continue;
      if (relation === 'plus-un' && modele > plage.max - 1) continue;
      if (etat.dernierAutantQue && modele === etat.dernierAutantQue.modele &&
        relation === etat.dernierAutantQue.relation && especeId === etat.dernierAutantQue.especeId) continue;
      break;
    }
    etat.dernierAutantQue = { modele, relation, especeId };
    const cible = relation === 'autant' ? modele : relation === 'plus-un' ? modele + 1 : modele - 1;
    const espece = donnees.especes[especeId];

    const phraseRelation = relation === 'autant' ? 'AUTANT de' : relation === 'plus-un' ? 'UN DE PLUS que' : 'UN DE MOINS que';
    zone.appendChild(creerBlocConsigne(`Touche pour qu'il y ait ${phraseRelation} le modèle !`));

    const rangeeModele = document.createElement('div');
    rangeeModele.className = 'rangee-modele';
    const etiqModele = document.createElement('div');
    etiqModele.className = 'etiquette-rangee';
    etiqModele.textContent = 'Modèle';
    const colonnes = Math.max(1, Math.min(5, Math.max(modele, cible)));
    const collModele = document.createElement('div');
    collModele.className = 'collection-modele';
    collModele.style.gridTemplateColumns = `repeat(${colonnes}, 1fr)`;
    for (let i = 0; i < modele; i++) {
      const s = document.createElement('span');
      s.textContent = espece.emoji;
      collModele.appendChild(s);
    }
    rangeeModele.appendChild(etiqModele);
    rangeeModele.appendChild(collModele);
    zone.appendChild(rangeeModele);

    const rangeeCible = document.createElement('div');
    rangeeCible.className = 'rangee-modele';
    const etiqCible = document.createElement('div');
    etiqCible.className = 'etiquette-rangee';
    etiqCible.textContent = 'À toi';
    const collCible = document.createElement('div');
    collCible.className = 'collection-cible';
    collCible.style.gridTemplateColumns = `repeat(${colonnes}, 1fr)`;
    rangeeCible.appendChild(etiqCible);
    rangeeCible.appendChild(collCible);
    zone.appendChild(rangeeCible);

    let compte = 0;
    const MAX_AJOUT = 10;
    const rangeeBoutons = document.createElement('div');
    rangeeBoutons.className = 'rangee-boutons-cible';
    const boutonAjouter = document.createElement('button');
    boutonAjouter.type = 'button';
    boutonAjouter.className = 'bouton-ajouter';
    boutonAjouter.textContent = '+ Ajouter';
    const boutonRetirer = document.createElement('button');
    boutonRetirer.type = 'button';
    boutonRetirer.className = 'bouton-retirer';
    boutonRetirer.textContent = '− Retirer';
    boutonRetirer.disabled = true;
    boutonAjouter.addEventListener('click', () => {
      if (compte >= MAX_AJOUT) return;
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'element-cible';
      s.textContent = espece.emoji;
      s.addEventListener('click', () => { s.remove(); compte--; boutonRetirer.disabled = compte <= 0; });
      collCible.appendChild(s);
      compte++;
      boutonRetirer.disabled = false;
    });
    boutonRetirer.addEventListener('click', () => {
      if (compte <= 0) return;
      collCible.lastElementChild.remove();
      compte--;
      boutonRetirer.disabled = compte <= 0;
    });
    rangeeBoutons.appendChild(boutonAjouter);
    rangeeBoutons.appendChild(boutonRetirer);
    zone.appendChild(rangeeBoutons);

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider';
    boutonValider.addEventListener('click', () => {
      if (etat.verrouille) return;
      const estCorrecte = compte === cible;
      boutonAjouter.disabled = true;
      boutonAjouter.hidden = true;
      boutonRetirer.disabled = true;
      boutonRetirer.hidden = true;
      Array.from(collCible.children).forEach((el) => (el.disabled = true));
      boutonValider.disabled = true;
      boutonValider.hidden = true;
      // CHARTE §18 : la collection construite vire au vert ou au rouge, et le
      // nombre attendu est rappelé sous le feedback.
      collCible.classList.add(estCorrecte ? 'contenant-correct' : 'contenant-incorrect');
      validerReponse(estCorrecte, estCorrecte ? null
        : { donnee: compte + (compte > 1 ? ' bêtes' : ' bête'), attendue: cible + (cible > 1 ? ' bêtes' : ' bête') });
    });
    zone.appendChild(boutonValider);
  }

  /* ---------- Mini-jeu 6 : La parade des escargots (ranger — glisser-déposer) ---------- */

  function creerElementParade(valeur, type) {
    const el = document.createElement('div');
    el.className = type === 'chiffre' ? 'carte-parade parade-escargot' : 'carte-parade parade-feuille';
    el.dataset.slot = '';
    el.dataset.valeur = String(valeur);
    if (type === 'chiffre') {
      const fond = document.createElement('span');
      fond.className = 'fond-escargot';
      fond.textContent = '🐌';
      const num = document.createElement('span');
      num.className = 'numero-escargot';
      num.textContent = String(valeur);
      el.appendChild(fond);
      el.appendChild(num);
    } else {
      const fond = document.createElement('span');
      fond.className = 'fond-feuille';
      fond.textContent = '🍃';
      el.appendChild(fond);
      el.appendChild(creerMiniCollection('coccinelle', valeur));
    }
    return el;
  }

  function genererRanger(zone, cfg) {
    const plage = plageActuelle();
    const K = etat.index <= 1 ? 3 : etat.index <= 3 ? 4 : 5;
    const valeurs = melanger(Array.from({ length: plage.max - plage.min + 1 }, (_, i) => plage.min + i)).slice(0, K);
    const sens = choisir(['croissant', 'decroissant']);
    const ordreCorrect = sens === 'croissant' ? [...valeurs].sort((a, b) => a - b) : [...valeurs].sort((a, b) => b - a);
    const ordreAffiche = melanger(valeurs);
    const variante = choisir(['quantite', 'chiffre', 'mixte']);
    const typesParValeur = {};
    valeurs.forEach((v) => { typesParValeur[v] = variante === 'mixte' ? choisir(['quantite', 'chiffre']) : variante; });

    const phraseSens = sens === 'croissant' ? 'du plus petit au plus grand' : 'du plus grand au plus petit';
    zone.appendChild(creerBlocConsigne(`Range la parade sur le chemin du jardin, ${phraseSens} !`));

    const zoneRanger = document.createElement('div');
    zoneRanger.className = 'zone-ranger';
    const reserve = document.createElement('div');
    reserve.className = 'reserve-drag';
    const bande = document.createElement('div');
    bande.className = 'bande-support';

    const slots = [];
    for (let i = 0; i < K; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot-rang';
      slot.dataset.index = String(i);
      slots.push(slot);
      bande.appendChild(slot);
    }

    const elements = {};
    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider';
    boutonValider.hidden = true;

    function verifierRemplissage() {
      const rempli = slots.every((s) => s.querySelector('.carte-parade'));
      boutonValider.hidden = !rempli;
    }

    ordreAffiche.forEach((val) => {
      const el = creerElementParade(val, typesParValeur[val]);
      reserve.appendChild(el);
      elements[val] = el;

      activerDrag(el, {
        onDepose(x, y, elem, rectLache) {
          const slotCible = meilleureCible(rectLache, x, y, slots);
          if (!slotCible) {
            if (el.dataset.slot !== '') { reserve.appendChild(el); el.dataset.slot = ''; }
            verifierRemplissage();
            return;
          }
          const occupantActuel = slotCible.querySelector('.carte-parade');
          if (occupantActuel && occupantActuel !== el) {
            if (el.dataset.slot !== '') {
              const ancienSlot = slots[Number(el.dataset.slot)];
              ancienSlot.appendChild(occupantActuel);
              occupantActuel.dataset.slot = el.dataset.slot;
            } else {
              reserve.appendChild(occupantActuel);
              occupantActuel.dataset.slot = '';
            }
          }
          slotCible.appendChild(el);
          el.dataset.slot = slotCible.dataset.index;
          verifierRemplissage();
        }
      });
    });

    // La bande (cible fixe) est placée avant la réserve (source, dont le
    // remplissage varie) afin que sa position ne bouge jamais pendant la
    // partie, même quand la réserve se vide et change de nombre de lignes.
    zoneRanger.appendChild(bande);
    zoneRanger.appendChild(reserve);
    zone.appendChild(zoneRanger);

    boutonValider.addEventListener('click', () => {
      if (etat.verrouille) return;
      const ordreActuel = slots.map((s) => {
        const e = s.querySelector('.carte-parade');
        return e ? Number(e.dataset.valeur) : null;
      });
      const estCorrecte = ordreActuel.every((v, i) => v === ordreCorrect[i]);
      if (estCorrecte) {
        slots.forEach((s, i) => {
          s.classList.add('rang-correct');
          const e = s.querySelector('.carte-parade');
          if (e) { e.style.animationDelay = (i * 0.08) + 's'; e.classList.add('anim-parade'); }
        });
        Object.values(elements).forEach((e) => { e.style.pointerEvents = 'none'; });
        boutonValider.disabled = true;
        boutonValider.hidden = true;
        validerReponse(true);
        return;
      }
      /* Réponse fausse : on applique le standard de la série (CHARTE §18) —
         chaque case passe au vert ou au rouge selon SON contenu, puis la
         solution vient s'y ranger d'elle-même, tout en vert. La manche est
         validée (donc comptée) et l'enfant passe à la suivante : le même
         classement ne lui est plus reproposé à corriger sur place. */
      Object.values(elements).forEach((e) => { e.style.pointerEvents = 'none'; });
      boutonValider.disabled = true;
      boutonValider.hidden = true;
      slots.forEach((s, i) => {
        const e = s.querySelector('.carte-parade');
        s.classList.add(e && Number(e.dataset.valeur) === ordreCorrect[i] ? 'rang-correct' : 'rang-incorrect');
      });
      setTimeout(() => {
        if (!slots[0].isConnected) return; // manche déjà quittée
        ordreCorrect.forEach((valeur, i) => {
          const carte = elements[valeur];
          if (carte && carte.parentElement !== slots[i]) slots[i].appendChild(carte);
          slots[i].classList.remove('rang-incorrect');
          slots[i].classList.add('rang-correct');
        });
      }, 900);
      validerReponse(false, {
        donnee: ordreActuel.map((v) => (v === null ? '?' : v)).join(' – '),
        attendue: ordreCorrect.join(' – ')
      });
    });
    zone.appendChild(boutonValider);
  }

  /* ---------- Initialisation ---------- */

  document.getElementById('bouton-retour').addEventListener('click', retourAccueil);
  document.getElementById('bouton-suivant').addEventListener('click', questionSuivante);

  construireAccueil();
})();
</script>
<script>
  /* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7).
     Script isolé du moteur de jeu : il n'agit que sur les éléments statiques
     de la page (le « ← Menu » ne s'affiche que sur l'écran d'accueil). */
  (function () {
    var bouton = document.getElementById('bouton-menu');
    var modale = document.getElementById('modale-menu');
    if (!bouton || !modale) return;
    function fermer() { modale.hidden = true; }
    bouton.addEventListener('click', function () { modale.hidden = false; });
    document.getElementById('modale-menu-rester').addEventListener('click', fermer);
    document.getElementById('modale-menu-revenir').addEventListener('click', function () {
      window.location.href = '../index.html';
    });
    modale.addEventListener('click', function (e) { if (e.target === modale) fermer(); });
  })();
</script>
</body>
