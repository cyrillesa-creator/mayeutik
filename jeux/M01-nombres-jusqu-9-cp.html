<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>Le Jardin des Petites Bêtes – Mayeutik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --couleur-fond: #FFF8EF;
    --couleur-encre: #2B2B2B;
    --couleur-mandarine: #FF8C42;
    --couleur-menthe: #4ECDC4;
    --couleur-corail: #FF6B6B;
    --couleur-soleil: #FFD93D;
    color-scheme: light only;
  }
  @media (prefers-color-scheme: dark) {
    html { background-color: var(--couleur-fond); }
    body { background-color: var(--couleur-fond); color: var(--couleur-encre); }
    input, select, textarea, button { background-color: #FFFFFF; color: var(--couleur-encre); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--couleur-fond); color:var(--couleur-encre); overflow-x:hidden; }
  body { font-family:'Fredoka', system-ui, sans-serif; min-height:100vh; padding-bottom:2rem; }
  button { font-family:inherit; cursor:pointer; }
  h1,h2,h3{ font-weight:700; margin:0 0 .4rem; }

  #ecran-accueil { max-width:640px; margin:0 auto; padding:1.2rem 1rem 2rem; }
  .entete-accueil { text-align:center; margin-bottom:1.2rem; }
  .entete-accueil h1 { font-size:1.6rem; color:var(--couleur-mandarine); }
  .entete-accueil p { margin:0; font-size:1rem; font-weight:500; opacity:.85; }
  .grille-jeux { display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem; }
  @media (max-width:360px){ .grille-jeux{ grid-template-columns:1fr; } }
  .carte-jeu {
    --c: var(--couleur-mandarine);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center; gap:.3rem;
    background: color-mix(in srgb, var(--c) 16%, white);
    border:3px solid var(--c); border-radius:20px; padding:.8rem .6rem;
    max-height:34vh; min-height:9.5rem;
    box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, black 6%);
  }
  .carte-jeu:active { transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, black 6%); }
  .carte-jeu.carte-menthe{ --c:var(--couleur-menthe); }
  .carte-jeu.carte-corail{ --c:var(--couleur-corail); }
  .carte-jeu.carte-soleil{ --c:var(--couleur-soleil); }
  .carte-jeu .icone{ font-size:1.9rem; line-height:1; }
  .carte-jeu h2{ font-size:1rem; }
  .carte-jeu p{ font-size:.76rem; font-weight:400; margin:0; opacity:.85; }
  .etoiles{ display:inline-flex; gap:2px; font-size:1.1rem; letter-spacing:-1px; }
  .etoile{ color:rgba(43,43,43,.2); }
  .etoile.pleine{ color:var(--couleur-soleil); text-shadow:0 0 1px rgba(43,43,43,.35); }

  #ecran-jeu{ max-width:640px; margin:0 auto; padding:.8rem 1rem 2.5rem; }
  .entete-jeu{ display:flex; align-items:center; gap:.6rem; margin-bottom:.8rem; }
  .bouton-retour{
    flex:0 0 auto; min-height:44px; min-width:44px; border-radius:14px; border:none;
    background:var(--couleur-encre); color:var(--couleur-fond); font-size:1.2rem; font-weight:600; padding:0 .9rem;
    touch-action:manipulation;
  }
  .entete-jeu-titres{ flex:1; min-width:0; }
  .entete-jeu-titres h2{ font-size:1.1rem; color:var(--couleur-mandarine); }
  .entete-jeu-titres .progression{ font-size:.85rem; font-weight:500; opacity:.75; }
  #zone-jeu{
    background:#ffffff; border-radius:20px;
    border:3px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
    padding:1.1rem .9rem; min-height:40vh;
  }
  .consigne{ text-align:center; font-size:1.08rem; font-weight:600; margin:0; }
  .legende{ text-align:center; font-size:.9rem; font-weight:400; opacity:.85; margin-top:.9rem; }

  .bloc-consigne{ display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .bouton-son{
    min-width:44px; min-height:44px; border-radius:50%;
    border:2.5px solid var(--couleur-mandarine); background:#ffffff;
    font-size:1.3rem; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    touch-action:manipulation;
  }
  .bouton-son:active{ transform:translateY(2px); }

  .grille-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-top:.5rem; }
  .bouton-option{
    min-height:3.4rem; border-radius:16px; border:2.5px solid var(--couleur-encre); background:#ffffff;
    display:flex; align-items:center; justify-content:center; padding:.4rem; touch-action:manipulation;
  }
  .bouton-option:disabled{ opacity:.6; }
  .bouton-option.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .bouton-option.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }

  .bouton-principal{
    display:block; margin:.8rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; padding:0 1.3rem;
    touch-action:manipulation;
  }
  .bouton-secondaire{
    display:block; margin:0 auto; min-height:44px; border-radius:14px; border:2.5px solid var(--couleur-encre);
    background:#ffffff; padding:0 1.1rem; font-weight:500; touch-action:manipulation;
  }

  /* Retour à la coquille (CHARTE §7) : bouton discret + confirmation */
  .barre-accueil{ display:flex; margin-bottom:.6rem; }
  .bouton-menu{
    min-height:44px; border-radius:14px; padding:0 .9rem;
    border:2px solid color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:#ffffff; color:var(--couleur-encre); font-weight:600; font-size:.95rem;
    display:inline-flex; align-items:center; gap:.35rem; touch-action:manipulation;
  }
  .bouton-menu:active{ transform:translateY(2px); }
  .modale-fond{
    position:fixed; inset:0; z-index:1000; padding:1.2rem;
    background:color-mix(in srgb, var(--couleur-encre) 55%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .modale-boite{
    background:#ffffff; border-radius:20px; padding:1.4rem 1.2rem; max-width:20rem; width:100%;
    text-align:center; box-shadow:0 12px 34px rgba(43,43,43,.28);
  }
  .modale-boite p{ font-size:1.05rem; font-weight:600; margin:0 0 1.1rem; }
  .modale-boutons{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .modale-boutons .bouton-principal, .modale-boutons .bouton-secondaire{ margin:0; }

  .feedback{ text-align:center; font-weight:700; font-size:1.05rem; min-height:1.6rem; margin:.8rem 0 .2rem; }
  .feedback-succes{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }
  .feedback-erreur{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .bouton-suivant{
    display:block; margin:.6rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; font-size:1rem; padding:0 1.4rem;
    touch-action:manipulation;
  }

  .bloc-resultats{ text-align:center; }
  .bloc-resultats .etoiles{ font-size:2.6rem; margin:.6rem 0; }
  .bloc-resultats .score-texte{ font-size:1.1rem; font-weight:500; margin-bottom:1rem; }
  .boutons-resultats{ display:flex; justify-content:center; gap:.7rem; flex-wrap:wrap; margin-top:.6rem; }

  /* Correction affichée après une MAUVAISE réponse (CHARTE §18) : la réponse
     donnée en rouge, la bonne en vert. Mêmes teintes que .feedback-succes /
     .feedback-erreur, assombries pour rester lisibles sur blanc. */
  .bloc-correction{ text-align:center; font-weight:700; font-size:.98rem; margin:.7rem 0 .2rem; }
  .correction-donnee{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .correction-attendue{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }

  /* jardin — dénombrer */
  .zone-jardin{
    position:relative; height:11rem; border-radius:20px;
    border:3px solid color-mix(in srgb, var(--couleur-menthe) 40%, var(--couleur-encre) 10%);
    background:color-mix(in srgb, var(--couleur-menthe) 16%, var(--couleur-fond));
    margin:.6rem 0; overflow:hidden;
  }
  .bete-jardin{
    position:absolute; transform:translate(-50%,-50%);
    font-size:2.2rem; line-height:1; background:none; border:none; padding:.2rem;
    border-radius:50%; min-width:44px; min-height:44px;
  }
  .bete-jardin.comptee{ animation:pop-bete .35s ease; opacity:.35; filter:grayscale(.6); }
  @keyframes pop-bete{ 0%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.5);} 100%{transform:translate(-50%,-50%) scale(1);} }

  /* pavé numérique diégétique */
  .pave-numerique{
    display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; max-width:16rem; margin:.8rem auto 0;
    padding:.8rem; border-radius:18px; border:5px solid var(--couleur-mandarine);
    background:repeating-linear-gradient(180deg,
      color-mix(in srgb, var(--couleur-mandarine) 10%, var(--couleur-fond)) 0px,
      color-mix(in srgb, var(--couleur-mandarine) 10%, var(--couleur-fond)) 13px,
      color-mix(in srgb, var(--couleur-mandarine) 18%, var(--couleur-fond)) 13px,
      color-mix(in srgb, var(--couleur-mandarine) 18%, var(--couleur-fond)) 15px);
    box-shadow:0 4px 0 color-mix(in srgb, var(--couleur-mandarine) 55%, black 6%);
  }
  .touche-chiffre{
    min-height:3.2rem; border-radius:14px; border:2.5px solid var(--couleur-encre);
    background:#ffffff; font-size:1.4rem; font-weight:700; color:var(--couleur-encre);
    touch-action:manipulation;
  }
  .touche-chiffre.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .touche-chiffre.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }

  /* étiqueter */
  .zone-etiquetage{ position:relative; display:flex; gap:1.2rem; margin-top:.6rem; }
  .colonne-etiquetage{ flex:1; display:flex; flex-direction:column; gap:.6rem; }
  .traits-connexion{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .trait-connexion{ stroke-width:4; stroke-linecap:round; }
  /* Trait en cours de tracé : légèrement transparent et pointillé, pour se
     distinguer d'un lien déjà établi tant que le doigt n'a pas relâché. */
  .trait-en-cours{ stroke-width:4; stroke-linecap:round; opacity:.75; stroke-dasharray:7 5; }
  /* Étiquette survolée pendant un tracé : l'enfant voit où son trait va se
     poser avant de relâcher. */
  .etiquette-nombre.cible-survolee{ transform:scale(1.06); border-color:var(--couleur-mandarine);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--couleur-mandarine) 35%, transparent); }
  /* `touch-action:none` sur les seules cartes de gauche : c'est de là que part
     le tracé au doigt, et le navigateur ne doit pas le confondre avec un
     défilement (cf. gelerDefilement). Les étiquettes de droite, elles, restent
     un point de départ de défilement normal. */
  .carte-etiquetage{ touch-action:none; }
  /* Carte d'où part le tracé en cours. */
  .carte-etiquetage.trace-depart{ border-color:var(--couleur-mandarine); }
  .carte-etiquetage, .etiquette-nombre{
    min-height:3.6rem; border-radius:16px; border:2.5px solid var(--couleur-encre); background:#ffffff;
    display:flex; align-items:center; justify-content:center; padding:.4rem;
  }
  .carte-etiquetage.selectionnee{ border-color:var(--couleur-mandarine); box-shadow:0 0 0 3px color-mix(in srgb, var(--couleur-mandarine) 35%, transparent); }
  /* Un lien tracé colore ses deux extrémités avec la couleur qui lui est propre (--couleur-lien, posée en ligne par JS). */
  .carte-etiquetage.liee, .etiquette-nombre.liee{
    border-color: var(--couleur-lien); background: color-mix(in srgb, var(--couleur-lien) 22%, white);
  }
  .contenant-correct{ outline:3px solid var(--couleur-menthe); outline-offset:3px; border-radius:14px;
    background:color-mix(in srgb, var(--couleur-menthe) 18%, transparent); }
  .contenant-incorrect{ outline:3px solid var(--couleur-corail); outline-offset:3px; border-radius:14px;
    background:color-mix(in srgb, var(--couleur-corail) 16%, transparent); }
  .carte-etiquetage.appariee, .etiquette-nombre.appariee{
    border-color:var(--couleur-menthe); border-width:4px; box-shadow:0 0 0 3px color-mix(in srgb, var(--couleur-menthe) 30%, transparent);
  }
  .carte-etiquetage.non-appariee, .etiquette-nombre.non-appariee{
    border-color:var(--couleur-corail); border-width:4px; box-shadow:0 0 0 3px color-mix(in srgb, var(--couleur-corail) 30%, transparent);
  }
  .etiquette-nombre{ font-size:1.6rem; font-weight:700; }
  .mini-collection{ display:flex; flex-wrap:wrap; gap:2px; max-width:5rem; justify-content:center; font-size:1.1rem; }
  .de-points{ display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:3px; width:2.6rem; height:2.6rem; }
  .point-de{ border-radius:50%; background:transparent; }
  .point-de.actif{ background:var(--couleur-encre); }

  /* comparer */
  .badge-mot-cle{
    display:flex; align-items:center; justify-content:center;
    width:3.2rem; height:3.2rem; margin:.4rem auto .8rem; border-radius:50%;
    background:var(--couleur-soleil); color:var(--couleur-encre); font-weight:700; font-size:2rem;
    border:3px solid color-mix(in srgb, var(--couleur-soleil) 60%, black 10%);
  }
  .rangee-contenants{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .bouton-contenant{ border:none; background:none; padding:0; border-radius:18px; }
  .contenant-comparaison{
    min-width:6rem; min-height:6rem; border-radius:18px; border:3px solid var(--couleur-encre); background:#ffffff;
    padding:.5rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem;
  }
  .contenant-comparaison.reference{ border-style:dashed; background:color-mix(in srgb, var(--couleur-soleil) 15%, white); }
  .tag-modele{ font-size:.7rem; font-weight:700; color:var(--couleur-encre); opacity:.7; }
  .contenu-contenant{ display:flex; flex-wrap:wrap; gap:2px; max-width:4.6rem; justify-content:center; font-size:1.15rem; }
  .bouton-contenant.entoure-correct .contenant-comparaison{
    border-color:var(--couleur-menthe); border-width:5px; box-shadow:0 0 0 4px color-mix(in srgb, var(--couleur-menthe) 30%, transparent);
  }
  .bouton-contenant.entoure-incorrect .contenant-comparaison{ border-color:var(--couleur-corail); border-width:5px; }

  /* drag & drop commun (constituer / ranger) */
  .zone-constituer, .zone-ranger{ display:flex; flex-direction:column; gap:.8rem; margin-top:.6rem; }
  .contenant-cible{
    border-radius:20px; border:3px dashed var(--couleur-mandarine);
    background:color-mix(in srgb, var(--couleur-mandarine) 10%, var(--couleur-fond));
    padding:.6rem; min-height:6rem;
  }
  .etiquette-contenant{ text-align:center; font-weight:700; margin-bottom:.3rem; color:color-mix(in srgb, var(--couleur-mandarine) 70%, black 15%); }
  .grille-cible{ display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; min-height:3.2rem; }
  .reserve-drag{
    display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; padding:.6rem; border-radius:16px;
    background:#ffffff; border:2.5px solid color-mix(in srgb, var(--couleur-encre) 15%, white); min-height:3.6rem;
  }
  .bete-draggable{
    font-size:2rem; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:grab; user-select:none; border-radius:50%;
  }
  .bete-draggable.en-glisse{ cursor:grabbing; filter:drop-shadow(0 6px 6px rgba(43,43,43,.25)); }
  /* Page figée le temps d'un glisser-déposer (cf. gelerDefilement). */
  html.glisse-en-cours, html.glisse-en-cours body{ overflow:hidden; touch-action:none; overscroll-behavior:none; }
  .carte-parade{
    position:relative; width:4.2rem; height:4.2rem;
    touch-action:none; cursor:grab; user-select:none;
  }
  .carte-parade.en-glisse{ cursor:grabbing; filter:drop-shadow(0 6px 6px rgba(43,43,43,.25)); }
  .parade-escargot .fond-escargot{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
  .parade-escargot .numero-escargot{
    position:absolute; bottom:-2px; right:-2px; background:var(--couleur-soleil); color:var(--couleur-encre);
    font-size:1rem; font-weight:700; min-width:1.4rem; height:1.4rem; border-radius:50%;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--couleur-fond);
  }
  .parade-feuille .fond-feuille{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.6rem; opacity:.85; }
  .parade-feuille .mini-collection{
    position:absolute; inset:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    align-content:center; gap:0; font-size:.62rem; line-height:1; max-width:100%; padding:.3rem;
  }
  .anim-parade{ animation:bond-parade .5s ease; }
  @keyframes bond-parade{ 0%{transform:translateY(0);} 40%{transform:translateY(-10px);} 100%{transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){ .anim-parade{ animation:none; } }

  /* autant que le modèle */
  .rangee-modele{
    display:flex; align-items:center; gap:.6rem; margin:.6rem 0; padding:.6rem; border-radius:16px;
    background:#ffffff; border:2.5px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
  }
  .etiquette-rangee{ font-weight:700; font-size:.8rem; min-width:3.4rem; color:color-mix(in srgb, var(--couleur-encre) 70%, white); }
  .collection-modele, .collection-cible{ display:grid; gap:3px; flex:1; font-size:1.5rem; min-height:2.4rem; align-content:start; }
  .element-cible{ border:none; background:none; padding:0; font-size:inherit; line-height:1; cursor:pointer; min-width:44px; min-height:44px; }
  .rangee-boutons-cible{ display:flex; gap:.6rem; justify-content:center; margin:.6rem 0; }
  .bouton-ajouter, .bouton-retirer{
    display:block; min-height:44px; border-radius:16px; border:none;
    color:#fff; font-weight:700; padding:0 1.2rem;
  }
  .bouton-ajouter{
    background:var(--couleur-menthe);
    box-shadow:0 4px 0 color-mix(in srgb, var(--couleur-menthe) 60%, black 10%);
  }
  .bouton-retirer{
    background:var(--couleur-corail);
    box-shadow:0 4px 0 color-mix(in srgb, var(--couleur-corail) 60%, black 10%);
  }
  .bouton-ajouter:disabled, .bouton-retirer:disabled{ opacity:.45; box-shadow:none; }

  /* ranger */
  .bande-support{
    display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; padding:.6rem; border-radius:16px;
    background:color-mix(in srgb, var(--couleur-menthe) 12%, var(--couleur-fond));
    border:3px solid color-mix(in srgb, var(--couleur-menthe) 45%, var(--couleur-encre) 8%);
    min-height:5rem;
  }
  .slot-rang{
    width:4.6rem; height:4.6rem; border-radius:14px; border:2.5px dashed color-mix(in srgb, var(--couleur-encre) 30%, white);
    background:#ffffff; display:flex; align-items:center; justify-content:center;
  }
  .slot-rang.rang-correct{ border-style:solid; border-color:var(--couleur-menthe); background:color-mix(in srgb, var(--couleur-menthe) 30%, white); }
  .slot-rang.rang-incorrect{ border-style:solid; border-color:var(--couleur-corail); background:color-mix(in srgb, var(--couleur-corail) 25%, white); }

  /* confettis */
  #confettis-conteneur{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
  .confetti{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
    animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards; }
  @keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
  @media (prefers-reduced-motion:reduce){ .confetti{ display:none; animation:none; } }

  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="confettis-conteneur" aria-hidden="true"></div>

<main id="ecran-accueil">
  <div class="barre-accueil">
    <button type="button" class="bouton-menu" id="bouton-menu">← Menu</button>
  </div>
  <div class="entete-accueil">
    <h1>Le Jardin des Petites Bêtes 🐞</h1>
    <p id="sous-titre-accueil"></p>
  </div>
  <div class="grille-jeux" id="grille-jeux"></div>
