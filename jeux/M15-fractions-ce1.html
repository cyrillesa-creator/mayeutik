<script>
(function () {
  'use strict';

  const donnees = JSON.parse(document.getElementById('donnees-jeu').textContent);
  const D = donnees.denominateursAutorises;
  const configJeux = donnees.jeux;
  const CLE_STOCKAGE = 'mayeutik-m15-fractions-ce1-etoiles';

  /* ---------- Utilitaires génériques ---------- */

  function nombreAleatoire(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }
  function choisir(tableau) {
    return tableau[Math.floor(Math.random() * tableau.length)];
  }
  function melanger(tableau) {
    const copie = [...tableau];
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }
  function melangerOptions(options, indexCorrect) {
    const enveloppes = options.map((valeur, i) => ({ valeur, estCorrecte: i === indexCorrect }));
    const melangees = melanger(enveloppes);
    return {
      options: melangees.map((e) => e.valeur),
      indexCorrect: melangees.findIndex((e) => e.estCorrecte)
    };
  }

  const preferesMouvementReduit = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Animation générique au rAF : les attributs SVG (niveau de la bouteille)
     ne se transitionnent pas partout en CSS, on pilote donc à la main. */
  function animer(duree, onFrame, onFini) {
    if (preferesMouvementReduit() || duree <= 0) {
      onFrame(1);
      if (onFini) onFini();
      return;
    }
    const debut = performance.now();
    function frame(t) {
      const p = Math.min(1, (t - debut) / duree);
      onFrame(p * (2 - p));
      if (p < 1) { requestAnimationFrame(frame); return; }
      if (onFini) onFini();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Fractions en mots (consignes lues à voix haute) ---------- */

  const NOMBRES_EN_LETTRES = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix'];

  function fractionEnMots(n, d) {
    const courant = donnees.nomsCourants[n + '/' + d];
    if (courant) return courant;
    const ord = donnees.nomsOrdinaux[String(d)];
    if (!ord) return n + ' sur ' + d;
    return NOMBRES_EN_LETTRES[n] + ' ' + (n > 1 ? ord[1] : ord[0]);
  }

  /* ---------- Étoiles : stockage sûr (mémoire + localStorage best-effort) ---------- */

  let memoireEtoiles = null;

  function lireEtoiles() {
    if (memoireEtoiles === null) {
      memoireEtoiles = {};
      try {
        const brut = window.localStorage.getItem(CLE_STOCKAGE);
        if (brut) memoireEtoiles = JSON.parse(brut);
      } catch (e) {
        memoireEtoiles = {};
      }
    }
    return memoireEtoiles;
  }
  function enregistrerEtoiles(jeuId, valeur) {
    const tout = lireEtoiles();
    tout[jeuId] = Math.max(tout[jeuId] || 0, valeur);
    memoireEtoiles = tout;
    try {
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : les étoiles restent valables pour la session en cours.
    }
  }
  function creerEtoiles(valeur, max) {
    max = max || 3;
    const cont = document.createElement('span');
    cont.className = 'etoiles';
    for (let i = 1; i <= max; i++) {
      const s = document.createElement('span');
      s.className = 'etoile' + (i <= valeur ? ' pleine' : '');
      s.textContent = '★';
      cont.appendChild(s);
    }
    return cont;
  }
  function calculerEtoiles(score, total) {
    const pct = score / total;
    if (pct >= 1) return 3;
    if (pct >= 0.66) return 2;
    if (pct >= 0.33) return 1;
    return 0;
  }

  /* ---------- Sessions : contrat de données v1 (CHARTE.md, section 11) ---------- */

  const CLE_SESSIONS = 'mayeutik-sessions';
  const CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';
  const MODULE_ID = 'M15';
  const MAX_SESSIONS_PAR_PROFIL = 500;

  let memoireProfilActif = null;
  let memoireSessions = null;

  function lireProfilActif() {
    if (memoireProfilActif === null) {
      memoireProfilActif = 'p1';
      try {
        const brut = window.localStorage.getItem(CLE_PROFIL_ACTIF);
        if (brut) memoireProfilActif = brut;
      } catch (e) {
        memoireProfilActif = 'p1';
      }
    }
    return memoireProfilActif;
  }

  function lireSessions() {
    if (memoireSessions === null) {
      memoireSessions = [];
      try {
        const brut = window.localStorage.getItem(CLE_SESSIONS);
        if (brut) memoireSessions = JSON.parse(brut);
      } catch (e) {
        memoireSessions = [];
      }
    }
    return memoireSessions;
  }

  function enregistrerSession(competence, score, total, duree) {
    const profilId = lireProfilActif();
    const toutes = lireSessions();
    toutes.push({ profilId, module: MODULE_ID, competence, score, total, date: new Date().toISOString(), duree });
    let compteur = 0;
    for (let i = toutes.length - 1; i >= 0; i--) {
      if (toutes[i].profilId === profilId) {
        compteur++;
        if (compteur > MAX_SESSIONS_PAR_PROFIL) toutes.splice(i, 1);
      }
    }
    memoireSessions = toutes;
    try {
      window.localStorage.setItem(CLE_SESSIONS, JSON.stringify(toutes));
    } catch (e) {
      // localStorage indisponible : la session reste valable pour la session en cours.
    }
  }

  /* ---------- Confettis ---------- */

  function lancerConfettis() {
    if (preferesMouvementReduit()) return;
    const conteneur = document.getElementById('confettis-conteneur');
    const couleurs = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];
    for (let i = 0; i < 36; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.backgroundColor = couleurs[Math.floor(Math.random() * couleurs.length)];
      p.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      p.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      conteneur.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
      setTimeout(() => p.remove(), 2500);
    }
  }

  /* ---------- Composant sonore partagé (CHARTE §5) ----------
     Mêmes sons dans toute la série, générés à l’oscillateur : aucun fichier
     audio, donc aucune dépendance réseau. */

  let contexteAudio = null;
  function obtenirContexteAudio() {
    if (!contexteAudio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      contexteAudio = new Ctx();
    }
    if (contexteAudio.state === 'suspended') contexteAudio.resume();
    return contexteAudio;
  }

  function jouerNote(ctx, freq, debut, duree, volume, forme) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = forme || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, debut);
    gain.gain.exponentialRampToValueAtTime(volume, debut + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
    osc.connect(gain).connect(ctx.destination);
    osc.start(debut);
    osc.stop(debut + duree + 0.02);
  }

  const NOTES_BONNE_REPONSE = [523.25, 659.25, 783.99, 1046.5]; // do5 mi5 sol5 do6

  function sonBonneReponse() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    NOTES_BONNE_REPONSE.forEach((f, i) => jouerNote(ctx, f, t0 + i * 0.11, 0.11, 0.22));
  }

  const NOTES_NIVEAU_PARFAIT = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98];
  const ACCORD_NIVEAU_PARFAIT = [523.25, 659.25, 783.99, 1046.5]; // do majeur tenu

  function sonNiveauParfait() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    const pas = 0.1;
    NOTES_NIVEAU_PARFAIT.forEach((f, i) => jouerNote(ctx, f, t0 + i * pas, 0.12, 0.2));
    const tAccord = t0 + NOTES_NIVEAU_PARFAIT.length * pas + 0.04;
    ACCORD_NIVEAU_PARFAIT.forEach((f) => jouerNote(ctx, f, tAccord, 0.75, 0.12, 'triangle'));
  }

  function sonErreur() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    [392.0, 293.66].forEach((f, i) => jouerNote(ctx, f, t0 + i * 0.17, 0.17, 0.22));
  }

  function sonTic() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    jouerNote(ctx, 880, ctx.currentTime, 0.08, 0.12);
  }

  function jouerSon(type) {
    if (type === 'bravo') return sonBonneReponse();
    if (type === 'parfait') return sonNiveauParfait();
    if (type === 'tic') return sonTic();
    return sonErreur();
  }

  /* ---------- Consigne lue à voix haute (SpeechSynthesis) ---------- */

  /* Choix de la voix : on préfère les voix de qualité déjà installées
     (« Enhanced », « Premium », « Neural »...) à la voix par défaut, très
     mécanique. Tout reste local, aucun service distant n’est appelé. */
  const VOIX_QUALITE = /(enhanced|premium|neural|natural|siri|wavenet|studio)/i;
  const VOIX_FR_SOIGNEES = /(am[ée]lie|thomas|audrey|aur[ée]lie|c[ée]line|marie)/i;
  const DEBIT_VOIX = 0.92;
  const HAUTEUR_VOIX = 1;

  let voixRetenue = null;

  function scoreVoix(voix) {
    const nom = voix.name || '';
    let score = 0;
    if (VOIX_QUALITE.test(nom)) score += 8;
    if (VOIX_FR_SOIGNEES.test(nom)) score += 3;
    if (/^fr[-_]fr$/i.test(voix.lang || '')) score += 2;
    if (voix.localService) score += 1;
    if (voix.default) score += 0.5;
    return score;
  }

  function voixFrancaises() {
    if (!window.speechSynthesis || !window.speechSynthesis.getVoices) return [];
    const toutes = window.speechSynthesis.getVoices() || [];
    return toutes.filter((v) => /^fr([-_]|$)/i.test(v.lang || ''));
  }

  function voixPreferee() {
    try {
      const francaises = voixFrancaises();
      if (!francaises.length) return voixRetenue;
      const meilleure = francaises.slice().sort((a, b) => scoreVoix(b) - scoreVoix(a))[0];
      if (meilleure) voixRetenue = meilleure;
      return voixRetenue;
    } catch (e) {
      return voixRetenue;
    }
  }

  function voixLocale() {
    try {
      const locales = voixFrancaises().filter((v) => v.localService);
      if (!locales.length) return null;
      return locales.slice().sort((a, b) => scoreVoix(b) - scoreVoix(a))[0];
    } catch (e) {
      return null;
    }
  }

  try {
    if (window.speechSynthesis) {
      voixPreferee();
      if ('onvoiceschanged' in window.speechSynthesis) {
        window.speechSynthesis.addEventListener('voiceschanged', voixPreferee);
      }
    }
  } catch (e) { /* synthèse vocale indisponible : rien à préparer */ }

  function lireAVoixHaute(texte) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      const voix = voixPreferee();
      if (voix) {
        u.voice = voix;
        if (voix.lang) u.lang = voix.lang;
      }
      u.rate = DEBIT_VOIX;
      u.pitch = HAUTEUR_VOIX;
      if (voix && voix.localService === false) {
        u.onerror = (ev) => {
          const cause = ev && ev.error;
          if (cause === 'canceled' || cause === 'interrupted') return;
          const secours = voixLocale();
          if (!secours) return;
          try {
            const u2 = new SpeechSynthesisUtterance(texte);
            u2.voice = secours;
            u2.lang = secours.lang || 'fr-FR';
            u2.rate = DEBIT_VOIX;
            u2.pitch = HAUTEUR_VOIX;
            window.speechSynthesis.speak(u2);
          } catch (e2) { /* on renonce : la consigne reste lisible à l’écran */ }
        };
      }
      window.speechSynthesis.speak(u);
    } catch (e) {
      // synthèse vocale indisponible : la consigne reste lisible à l’écran.
    }
  }

  function creerBlocConsigne(texte, texteVoix) {
    const cont = document.createElement('div');
    cont.className = 'bloc-consigne';
    const p = document.createElement('p');
    p.className = 'consigne';
    p.textContent = texte;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bouton-son';
    btn.setAttribute('aria-label', 'Écouter la consigne');
    btn.textContent = '🔊';
    const texteALire = texteVoix || texte;
    btn.addEventListener('click', () => lireAVoixHaute(texteALire));
    cont.appendChild(p);
    cont.appendChild(btn);
    lireAVoixHaute(texteALire);
    return cont;
  }

  /* ---------- Navigation (CHARTE §17) et correction (CHARTE §18) ---------- */

  function remonterEnHaut() {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
  }

  /* Navigation automatique après un délai (CHARTE §20) : 2 s après l’affichage
     du bouton « Suivant », on avance sans attendre le clic de l’enfant. Un
     clic manuel ou une sortie du jeu annulent ce minuteur. */
  const DELAI_AUTO_SUIVANT = 2000;
  let minuteurAutoSuivant = null;
  function armerAutoSuivant() {
    clearTimeout(minuteurAutoSuivant);
    const bouton = document.getElementById('bouton-suivant');
    minuteurAutoSuivant = setTimeout(() => {
      if (bouton.hidden || bouton.disabled || !bouton.isConnected) return;
      bouton.click();
    }, DELAI_AUTO_SUIVANT);
  }
  function desarmerAutoSuivant() {
    clearTimeout(minuteurAutoSuivant);
  }

  function afficherCorrection(zone, donnee, attendue) {
    const bloc = document.createElement('p');
    bloc.className = 'bloc-correction';
    if (donnee !== null && donnee !== undefined && donnee !== '') {
      const d = document.createElement('span');
      d.className = 'correction-donnee';
      d.textContent = 'Ta réponse : ' + donnee;
      bloc.appendChild(d);
      bloc.appendChild(document.createTextNode(' — '));
    }
    const a = document.createElement('span');
    a.className = 'correction-attendue';
    a.textContent = 'La bonne réponse : ' + attendue;
    bloc.appendChild(a);
    zone.appendChild(bloc);
    return bloc;
  }

  /* ================================================================
     Formes du pique-nique — composants visuels partagés
     ================================================================ */

  const SVGNS = 'http://www.w3.org/2000/svg';

  function elSvg(nom, attrs) {
    const el = document.createElementNS(SVGNS, nom);
    Object.keys(attrs || {}).forEach((k) => el.setAttribute(k, attrs[k]));
    return el;
  }

  /*
   * Barre de chocolat. `options` :
   *  - inegal : tableau de largeurs relatives (parts INÉGALES, jeu du partage) ;
   *  - interactive : les carrés sont des boutons (colorier/décolorier) ;
   *  - teinte : 'a' | 'b' — carrés pris colorés mandarine/menthe (duels, calculs).
   * Rend { el, remplies(), setRemplies(k), verrouiller() }.
   */
  function creerBandeChocolat(denom, numRempli, options) {
    const opts = options || {};
    const cont = document.createElement('div');
    cont.className = 'bande-choco';
    const cases = [];
    let verrouille = false;
    for (let i = 0; i < denom; i++) {
      const el = document.createElement(opts.interactive ? 'button' : 'div');
      if (opts.interactive) el.type = 'button';
      el.className = 'carre-choco';
      if (opts.inegal) el.style.flexGrow = String(opts.inegal[i]);
      if (i < numRempli) el.classList.add('rempli');
      if (opts.teinte) el.classList.add('teinte-' + opts.teinte);
      if (opts.interactive) {
        el.setAttribute('aria-label', 'Part ' + (i + 1));
        el.addEventListener('click', () => {
          if (verrouille) return;
          el.classList.toggle('rempli');
          if (opts.teinte) el.classList.toggle('teinte-' + opts.teinte, el.classList.contains('rempli'));
          jouerSon('tic');
        });
      }
      cases.push(el);
      cont.appendChild(el);
    }
    return {
      el: cont,
      remplies: () => cases.filter((c) => c.classList.contains('rempli')).length,
      setRemplies: (k) => cases.forEach((c, i) => {
        c.classList.toggle('rempli', i < k);
        if (opts.teinte) c.classList.toggle('teinte-' + opts.teinte, i < k);
      }),
      verrouiller: () => { verrouille = true; cases.forEach((c) => { if (c.disabled !== undefined) c.disabled = true; }); }
    };
  }

  /*
   * Tarte SVG : croûte dorée + parts en quartiers. `options` :
   *  - angles : liste d’angles en degrés (parts INÉGALES ; somme = 360) ;
   *  - rotation : angle de départ (représentation « tournée », toujours valide) ;
   *  - interactive : parts cliquables ;
   *  - mangees : indices de parts grisées (soustractions).
   * Rend { el, remplies(), setRemplies(k), verrouiller() }.
   */
  function creerTarte(denom, numRempli, options) {
    const opts = options || {};
    const svg = elSvg('svg', { viewBox: '0 0 120 120', class: 'tarte-svg' });
    svg.setAttribute('aria-hidden', 'true');
    svg.appendChild(elSvg('circle', { cx: 60, cy: 60, r: 56, class: 'croute' }));

    const angles = opts.angles || new Array(denom).fill(360 / denom);
    const depart = opts.rotation || 0;
    const R = 48;
    const parts = [];
    const baies = [];
    let verrouille = false;
    let a0 = depart - 90;
    for (let i = 0; i < denom; i++) {
      const a1 = a0 + angles[i];
      const rad0 = a0 * Math.PI / 180;
      const rad1 = a1 * Math.PI / 180;
      const x0 = 60 + R * Math.cos(rad0), y0 = 60 + R * Math.sin(rad0);
      const x1 = 60 + R * Math.cos(rad1), y1 = 60 + R * Math.sin(rad1);
      const grand = angles[i] > 180 ? 1 : 0;
      const path = elSvg('path', {
        d: 'M60 60 L' + x0.toFixed(2) + ' ' + y0.toFixed(2)
          + ' A' + R + ' ' + R + ' 0 ' + grand + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z',
        class: 'part-tarte'
      });
      if (i < numRempli) path.classList.add('rempli');
      if (opts.mangees && opts.mangees.indexOf(i) !== -1) { path.classList.remove('rempli'); path.classList.add('mangee'); }
      if (opts.interactive) {
        path.classList.add('cliquable');
        path.addEventListener('click', () => {
          if (verrouille) return;
          path.classList.toggle('rempli');
          majBaies();
          jouerSon('tic');
        });
      }
      // La baie au centre de la part garnie : c’est la garniture qui dit
      // « cette part est prise », en plus de la couleur.
      const aMid = (a0 + a1) / 2 * Math.PI / 180;
      const baie = elSvg('circle', {
        cx: (60 + 0.55 * R * Math.cos(aMid)).toFixed(2),
        cy: (60 + 0.55 * R * Math.sin(aMid)).toFixed(2),
        r: 5, class: 'baie'
      });
      parts.push(path);
      baies.push(baie);
      svg.appendChild(path);
      svg.appendChild(baie);
      a0 = a1;
    }
    function majBaies() {
      parts.forEach((p, i) => { baies[i].style.display = p.classList.contains('rempli') ? '' : 'none'; });
    }
    majBaies();
    return {
      el: svg,
      remplies: () => parts.filter((p) => p.classList.contains('rempli')).length,
      setRemplies: (k) => { parts.forEach((p, i) => p.classList.toggle('rempli', i < k)); majBaies(); },
      verrouiller: () => { verrouille = true; }
    };
  }

  /* Plateau de brownies : la grille la plus carrée possible pour `denom`. */
  function creerBrownie(denom, numRempli, options) {
    const opts = options || {};
    const colonnes = Math.ceil(Math.sqrt(denom));
    const lignes = Math.ceil(denom / colonnes);
    const cont = document.createElement('div');
    cont.className = 'plateau-brownie';
    cont.style.gridTemplateColumns = 'repeat(' + colonnes + ',1fr)';
    cont.style.gridTemplateRows = 'repeat(' + lignes + ',1fr)';
    const cases = [];
    let verrouille = false;
    for (let i = 0; i < denom; i++) {
      const el = document.createElement(opts.interactive ? 'button' : 'div');
      if (opts.interactive) el.type = 'button';
      el.className = 'part-brownie' + (i < numRempli ? ' rempli' : '');
      if (opts.interactive) {
        el.setAttribute('aria-label', 'Part ' + (i + 1));
        el.addEventListener('click', () => {
          if (verrouille) return;
          el.classList.toggle('rempli');
          jouerSon('tic');
        });
      }
      cases.push(el);
      cont.appendChild(el);
    }
    return {
      el: cont,
      remplies: () => cases.filter((c) => c.classList.contains('rempli')).length,
      setRemplies: (k) => cases.forEach((c, i) => c.classList.toggle('rempli', i < k)),
      verrouiller: () => { verrouille = true; cases.forEach((c) => { if (c.disabled !== undefined) c.disabled = true; }); }
    };
  }

  function creerForme(type, denom, numRempli, options) {
    if (type === 'tarte') return creerTarte(denom, numRempli, options);
    if (type === 'brownie') return creerBrownie(denom, numRempli, options);
    return creerBandeChocolat(denom, numRempli, options);
  }

  /* Bande neutre (calculs, corrections) — même gabarit que M17. */
  function creerBandeNeutre(denom, numRempli, numB) {
    const cont = document.createElement('div');
    cont.className = 'forme-bande';
    for (let i = 0; i < denom; i++) {
      const seg = document.createElement('div');
      seg.className = 'segment-bande';
      if (i < numRempli) seg.classList.add('rempli');
      else if (numB && i < numRempli + numB) seg.classList.add('rempli', 'part-b');
      cont.appendChild(seg);
    }
    return cont;
  }

  function creerFractionLabel(n, d, grande) {
    const el = document.createElement('span');
    el.className = 'fraction-affichage' + (grande ? ' grande' : '');
    const num = document.createElement('span');
    num.textContent = n;
    const barre = document.createElement('span');
    barre.className = 'fr-barre';
    const den = document.createElement('span');
    den.textContent = d;
    el.appendChild(num);
    el.appendChild(barre);
    el.appendChild(den);
    return el;
  }

  /* ================================================================
     La bouteille de limonade (SVG) — contenances du programme
     ================================================================ */

  /* Géométrie du corps : la zone graduée va de ZONE_HAUT à ZONE_BAS ; le
     niveau k/d remplit k parts de cette hauteur. Les épaules et le goulot ne
     comptent pas — la « bouteille » du jeu, c’est son corps gradué. */
  const BTL_HAUT = 82;
  const BTL_BAS = 238;
  const BTL_X = 33;
  const BTL_LARG = 54;

  /*
   * Rend { el (wrapper animable), svg, niveau(), setNiveau(k, anime, onFini) }.
   * `denom` fixe les graduations ; niveau initial en nombre de parts.
   */
  function creerBouteille(denom, niveauInitial) {
    const wrap = document.createElement('div');
    wrap.className = 'bouteille-wrap';
    const svg = elSvg('svg', { viewBox: '0 0 120 250', class: 'bouteille-svg' });
    svg.setAttribute('aria-hidden', 'true');

    // Liquide d’abord (sous le verre de la bouteille, translucide par-dessus).
    const zoneH = BTL_BAS - BTL_HAUT;
    let niveau = (niveauInitial === undefined) ? denom : niveauInitial;
    const liquide = elSvg('rect', { x: BTL_X, y: 0, width: BTL_LARG, height: 0, fill: 'var(--limonade)' });
    // Le COMPLÉMENT (mini-jeu « Les comptes du goûter ») : une seconde teinte,
    // posée par-dessus le niveau initial, qui monte jusqu’au bouchon pour
    // montrer que a/d + manque/d = d/d = 1 — la bouteille se voit se remplir
    // entièrement, dans une couleur qui n’est pas celle du niveau de départ.
    const complement = elSvg('rect', { x: BTL_X, y: BTL_BAS, width: BTL_LARG, height: 0, fill: 'var(--couleur-mandarine)', opacity: 0.85 });
    const vague = elSvg('ellipse', { cx: 60, cy: 0, rx: BTL_LARG / 2, ry: 4, fill: 'color-mix(in srgb, var(--limonade) 70%, white)' });
    svg.appendChild(liquide);
    svg.appendChild(complement);
    svg.appendChild(vague);

    // Graduations : d-1 traits discrets — les repères du partage.
    for (let i = 1; i < denom; i++) {
      const y = BTL_BAS - (i / denom) * zoneH;
      svg.appendChild(elSvg('line', {
        x1: BTL_X, y1: y, x2: BTL_X + BTL_LARG, y2: y,
        stroke: 'var(--couleur-encre)', 'stroke-width': 1.4, 'stroke-dasharray': '4 4', opacity: 0.35
      }));
    }

    // Le corps en verre, par-dessus le liquide.
    svg.appendChild(elSvg('path', {
      d: 'M48 22 L48 55 C48 63 30 68 30 80 L30 230 Q30 242 42 242 L78 242 Q90 242 90 230 L90 80 C90 68 72 63 72 55 L72 22 Z',
      fill: 'rgba(255,255,255,0.28)',
      stroke: 'color-mix(in srgb, var(--couleur-encre) 45%, white)', 'stroke-width': 3
    }));
    // Le bouchon.
    svg.appendChild(elSvg('rect', { x: 45, y: 8, width: 30, height: 15, rx: 4, fill: 'color-mix(in srgb, var(--couleur-encre) 70%, white)' }));

    function poserNiveau(valeur) {
      const h = Math.max(0, valeur / denom) * zoneH;
      liquide.setAttribute('y', (BTL_BAS - h).toFixed(1));
      liquide.setAttribute('height', h.toFixed(1));
      vague.setAttribute('cy', (BTL_BAS - h).toFixed(1));
      vague.style.display = valeur > 0 ? '' : 'none';
    }
    poserNiveau(niveau);

    function setNiveau(k, anime, onFini) {
      const depart = niveau;
      niveau = k;
      if (!anime) { poserNiveau(k); if (onFini) onFini(); return; }
      animer(420, (p) => poserNiveau(depart + (k - depart) * p), onFini);
    }

    function poserComplement(bas, haut) {
      const yHaut = BTL_BAS - (Math.max(0, haut) / denom) * zoneH;
      const yBas = BTL_BAS - (Math.max(0, bas) / denom) * zoneH;
      complement.setAttribute('y', yHaut.toFixed(1));
      complement.setAttribute('height', Math.max(0, yBas - yHaut).toFixed(1));
    }
    poserComplement(0, 0);

    // Fait monter le complément de `bas` (le niveau déjà là) à `haut` parts —
    // typiquement jusqu’au bouchon (denom), pour la manche du complément à 1.
    function animerComplement(bas, haut, onFini) {
      animer(550, (p) => poserComplement(bas, bas + (haut - bas) * p), onFini);
    }

    wrap.appendChild(svg);
    return { el: wrap, svg, niveau: () => niveau, setNiveau, animerComplement };
  }

  /* Un verre : plein ou vide, la transition est en CSS. */
  function creerVerre(onClic) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'verre-btn';
    btn.setAttribute('aria-label', 'Verre');
    const svg = elSvg('svg', { viewBox: '0 0 60 70', class: 'verre-svg' });
    svg.setAttribute('aria-hidden', 'true');
    const liquide = elSvg('path', { d: 'M13 30 L47 30 L43.5 62 L16.5 62 Z', class: 'verre-liquide' });
    svg.appendChild(liquide);
    svg.appendChild(elSvg('path', {
      d: 'M8 6 L52 6 L46 64 L14 64 Z',
      fill: 'rgba(255,255,255,0.4)', stroke: 'color-mix(in srgb, var(--couleur-encre) 45%, white)', 'stroke-width': 3,
      'stroke-linejoin': 'round'
    }));
    btn.appendChild(svg);
    if (onClic) btn.addEventListener('click', onClic);
    return {
      el: btn,
      estPlein: () => btn.classList.contains('plein'),
      setPlein: (plein) => btn.classList.toggle('plein', !!plein)
    };
  }

  /* ================================================================
     Saisie au pavé : nombre seul, ou fraction en deux cases
     ================================================================ */

  /* Les 12 touches du pavé diégétique partagé (l'« écran » varie selon
     l’usage : case de comptage, cases numérateur/dénominateur). */
  function creerTouchesPave(onTouche) {
    const conteneur = document.createElement('div');
    conteneur.className = 'pave-numerique';
    const grille = document.createElement('div');
    grille.className = 'pave-grille';
    ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'C', '0', '✓'].forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'touche-pave';
      b.textContent = t;
      if (t === '✓') b.classList.add('touche-valider');
      if (t === 'C') b.classList.add('touche-effacer');
      b.addEventListener('click', () => onTouche(t));
      grille.appendChild(b);
    });
    conteneur.appendChild(grille);
    return { el: conteneur, verrouiller: (v) => grille.querySelectorAll('button').forEach((b) => { b.disabled = v; }) };
  }

  /*
   * Saisie d’une fraction : deux cases (numérateur, dénominateur) et le pavé.
   * `options` :
   *  - denominateurFixe : le dénominateur est affiché, seule la case du haut se remplit ;
   *  - legendes : affiche le vocabulaire officiel en face de chaque case ;
   *  - onValider(n, d) : appelé quand les deux cases sont remplies et ✓ touché.
   * Rend { el, verrouiller(), marquer(nJuste, dJuste) }.
   */
  function creerSaisieFraction(options) {
    const opts = options || {};
    const cont = document.createElement('div');

    const ligne = document.createElement('div');
    ligne.className = 'saisie-fraction';

    const slots = document.createElement('div');
    slots.className = 'fraction-slots';
    const slotN = document.createElement('div');
    slotN.className = 'slot-frac actif';
    slotN.textContent = '?';
    const barre = document.createElement('div');
    barre.className = 'barre-frac';
    const slotD = document.createElement('div');
    slotD.className = 'slot-frac';
    slotD.textContent = '?';
    if (opts.denominateurFixe) {
      slotD.className = 'slot-frac fixe';
      slotD.textContent = String(opts.denominateurFixe);
    }
    slots.appendChild(slotN);
    slots.appendChild(barre);
    slots.appendChild(slotD);
    ligne.appendChild(slots);

    if (opts.legendes) {
      const vocab = document.createElement('div');
      vocab.className = 'vocab-cotes';
      const l1 = document.createElement('span');
      l1.textContent = 'numérateur : les parts prises';
      const l2 = document.createElement('span');
      l2.textContent = 'dénominateur : toutes les parts';
      vocab.appendChild(l1);
      vocab.appendChild(l2);
      ligne.appendChild(vocab);
    }
    cont.appendChild(ligne);

    const valeurs = { n: '', d: opts.denominateurFixe ? String(opts.denominateurFixe) : '' };
    let actif = 'n';

    function slotDe(cle) { return cle === 'n' ? slotN : slotD; }
    function rafraichir() {
      slotN.textContent = valeurs.n === '' ? '?' : valeurs.n;
      if (!opts.denominateurFixe) slotD.textContent = valeurs.d === '' ? '?' : valeurs.d;
      slotN.classList.toggle('actif', actif === 'n');
      if (!opts.denominateurFixe) slotD.classList.toggle('actif', actif === 'd');
    }

    // Toucher une case la rend active : on peut corriger le numérateur après
    // avoir commencé le dénominateur.
    slotN.addEventListener('click', () => { if (!fige) { actif = 'n'; rafraichir(); } });
    if (!opts.denominateurFixe) slotD.addEventListener('click', () => { if (!fige) { actif = 'd'; rafraichir(); } });

    let fige = false;
    const pave = creerTouchesPave((t) => {
      if (fige) return;
      if (t === 'C') { valeurs[actif] = ''; rafraichir(); jouerSon('tic'); return; }
      if (t === '✓') {
        if (valeurs.n !== '' && valeurs.d !== '') {
          opts.onValider(parseInt(valeurs.n, 10), parseInt(valeurs.d, 10));
        }
        return;
      }
      // Un chiffre REMPLACE toujours celui déjà saisi dans la case active :
      // jamais de nombre à deux chiffres au pavé (toutes les valeurs du
      // module tiennent en un seul chiffre, 0 à 9).
      valeurs[actif] = t;
      rafraichir();
      jouerSon('tic');
      // Sélection automatique du dénominateur une fois le numérateur rempli —
      // seulement la première fois (d encore vide), pour ne pas gêner une
      // correction ultérieure du numérateur. Toucher l’une ou l’autre case
      // reste possible à tout moment pour la corriger (cf. écouteurs de clic
      // sur slotN/slotD ci-dessus).
      if (actif === 'n' && !opts.denominateurFixe && valeurs.d === '') { actif = 'd'; rafraichir(); }
    });
    cont.appendChild(pave.el);

    return {
      el: cont,
      verrouiller: () => { fige = true; pave.verrouiller(true); slotN.classList.remove('actif'); slotD.classList.remove('actif'); },
      marquer: (nJuste, dJuste) => {
        slotN.classList.add(nJuste ? 'correct' : 'incorrect');
        if (!opts.denominateurFixe) slotD.classList.add(dJuste ? 'correct' : 'incorrect');
      }
    };
  }

  /* Saisie d’un nombre seul (compter des parts). */
  function creerSaisieNombre(onValider) {
    const cont = document.createElement('div');
    const ligne = document.createElement('div');
    ligne.className = 'saisie-fraction';
    const slot = document.createElement('div');
    slot.className = 'slot-frac actif';
    slot.textContent = '?';
    ligne.appendChild(slot);
    cont.appendChild(ligne);
    let valeur = '';
    let fige = false;
    const pave = creerTouchesPave((t) => {
      if (fige) return;
      if (t === 'C') { valeur = ''; slot.textContent = '?'; jouerSon('tic'); return; }
      if (t === '✓') { if (valeur !== '') onValider(parseInt(valeur, 10)); return; }
      // Un chiffre REMPLACE le précédent (pas de nombre à deux chiffres).
      valeur = t;
      slot.textContent = valeur;
      jouerSon('tic');
    });
    cont.appendChild(pave.el);
    return {
      el: cont,
      verrouiller: () => { fige = true; pave.verrouiller(true); slot.classList.remove('actif'); },
      marquer: (juste) => slot.classList.add(juste ? 'correct' : 'incorrect')
    };
  }

  /* ================================================================
     Accueil et contrôleur de jeu
     ================================================================ */

  let etat = null;

  function construireAccueil() {
    document.getElementById('sous-titre-accueil').textContent = donnees.sousTitre;
    const grille = document.getElementById('grille-jeux');
    grille.innerHTML = '';
    configJeux.forEach((cfg) => {
      const carte = document.createElement('button');
      carte.className = 'carte-jeu carte-' + cfg.couleur;
      carte.dataset.jeu = cfg.id;
      const icone = document.createElement('div');
      icone.className = 'icone';
      icone.textContent = cfg.icone;
      const titre = document.createElement('h2');
      titre.textContent = cfg.titre;
      const desc = document.createElement('p');
      desc.textContent = cfg.description;
      const tout = lireEtoiles();
      const etoiles = creerEtoiles(tout[cfg.id] || 0);
      carte.appendChild(icone);
      carte.appendChild(titre);
      carte.appendChild(desc);
      carte.appendChild(etoiles);
      carte.addEventListener('click', () => demarrerJeu(cfg.id));
      grille.appendChild(carte);
    });
  }

  function retourAccueil() {
    desarmerAutoSuivant();
    if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    document.getElementById('ecran-jeu').hidden = true;
    document.getElementById('ecran-accueil').hidden = false;
    construireAccueil();
    remonterEnHaut();
  }

  function trouverConfig(jeuId) {
    return configJeux.find((j) => j.id === jeuId);
  }

  function demarrerJeu(jeuId) {
    etat = { jeuId, index: 0, score: 0, verrouille: false, demarreLe: Date.now(), memoire: {} };
    document.getElementById('ecran-accueil').hidden = true;
    document.getElementById('ecran-jeu').hidden = false;
    document.getElementById('titre-jeu-courant').textContent = trouverConfig(jeuId).titre;
    mancheSuivante();
    remonterEnHaut();
  }

  function majProgression() {
    const cfg = trouverConfig(etat.jeuId);
    document.getElementById('progression-jeu').textContent = 'Manche ' + etat.index + ' / ' + cfg.nbQuestions;
  }

  function mancheSuivante() {
    desarmerAutoSuivant();
    const cfg = trouverConfig(etat.jeuId);
    if (etat.index >= cfg.nbQuestions) {
      afficherResultats(cfg);
      return;
    }
    etat.index++;
    etat.verrouille = false;
    majProgression();
    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    document.getElementById('zone-feedback').textContent = '';
    document.getElementById('zone-feedback').className = 'feedback';
    document.getElementById('bouton-suivant').hidden = true;
    if (cfg.id === 'partage-egal') genererPartage(zone, cfg);
    else if (cfg.id === 'lire-ecrire') genererLireEcrire(zone, cfg);
    else if (cfg.id === 'contenances') genererContenances(zone, cfg);
    else if (cfg.id === 'representations') genererRepresentations(zone, cfg);
    else if (cfg.id === 'comparer-ce1') genererComparer(zone, cfg);
    else if (cfg.id === 'calculer-ce1') genererCalculer(zone, cfg);
    remonterEnHaut();
  }

  /* `correction` (facultatif) = { donnee, attendue } : affiché uniquement en
     cas d’erreur, sous le message de feedback (CHARTE §18).
     `options` (facultatif) = { message, silencieux } :
       - message : remplace le message tiré au hasard dans messagesFeedback,
         utile quand un mini-jeu veut commenter une combinaison précise
         (ex. « bon partage, mauvais compte ») plutôt qu’un bravo générique ;
       - silencieux : n’émet ni son ni confettis ici — utilisé par les
         mini-jeux à DEUX sous-réponses (ex. Le bon partage), qui ont déjà
         donné leur propre retour sonore/visuel à chaque sous-étape et ne
         veulent pas le rejouer une seconde fois à la validation finale. */
  function validerReponse(estCorrecte, correction, options) {
    if (etat.verrouille) return;
    etat.verrouille = true;
    const opts = options || {};
    const zoneFeedback = document.getElementById('zone-feedback');
    if (estCorrecte) {
      etat.score++;
      zoneFeedback.textContent = opts.message || choisir(donnees.messagesFeedback.bravo);
      zoneFeedback.className = 'feedback feedback-succes';
      if (!opts.silencieux) { lancerConfettis(); jouerSon('bravo'); }
    } else {
      zoneFeedback.textContent = opts.message || choisir(donnees.messagesFeedback.rate);
      zoneFeedback.className = 'feedback feedback-erreur';
      if (!opts.silencieux) jouerSon('rate');
      if (correction) afficherCorrection(zoneFeedback, correction.donnee, correction.attendue);
    }
    document.getElementById('bouton-suivant').hidden = false;
    armerAutoSuivant();
  }

  function afficherResultats(cfg) {
    document.getElementById('progression-jeu').textContent = 'Résultats';
    document.getElementById('bouton-suivant').hidden = true;
    document.getElementById('zone-feedback').textContent = '';
    const etoilesGagnees = calculerEtoiles(etat.score, cfg.nbQuestions);
    enregistrerEtoiles(cfg.id, etoilesGagnees);
    const dureeSecondes = Math.max(0, Math.round((Date.now() - etat.demarreLe) / 1000));
    enregistrerSession(cfg.id, etat.score, cfg.nbQuestions, dureeSecondes);
    if (etoilesGagnees === 3) sonNiveauParfait();

    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    const bloc = document.createElement('div');
    bloc.className = 'bloc-resultats';
    const titre = document.createElement('h3');
    titre.textContent = 'Fin du jeu !';
    const score = document.createElement('p');
    score.className = 'score-texte';
    score.textContent = etat.score + ' / ' + cfg.nbQuestions + ' manches réussies';
    const etoiles = creerEtoiles(etoilesGagnees);
    const boutons = document.createElement('div');
    boutons.className = 'boutons-resultats';
    const rejouer = document.createElement('button');
    rejouer.className = 'bouton-principal';
    rejouer.textContent = 'Rejouer';
    rejouer.addEventListener('click', () => demarrerJeu(cfg.id));
    const accueilBtn = document.createElement('button');
    accueilBtn.className = 'bouton-secondaire';
    accueilBtn.textContent = "Retour à l’accueil";
    accueilBtn.addEventListener('click', retourAccueil);
    boutons.appendChild(rejouer);
    boutons.appendChild(accueilBtn);
    bloc.appendChild(titre);
    bloc.appendChild(etoiles);
    bloc.appendChild(score);
    bloc.appendChild(boutons);
    zone.appendChild(bloc);
    if (etoilesGagnees === 3) lancerConfettis();
    remonterEnHaut();
  }

  /* ================================================================
     Mini-jeu 1 : Le bon partage — parts égales, puis dénominateur
     ================================================================ */

  /* Une découpe INÉGALE de d parts : largeurs (bande) ou angles (tarte)
     visiblement différents — l’écart minimal entre la plus petite et la plus
     grande part est imposé, sinon l’inégalité ne se voit pas à l'œil. */
  function decoupeInegale(d, total) {
    for (let essai = 0; essai < 60; essai++) {
      let poids = [];
      let somme = 0;
      for (let i = 0; i < d; i++) {
        const p = 0.5 + Math.random() * 1.6;
        poids.push(p);
        somme += p;
      }
      poids = poids.map((p) => p / somme * total);
      const mini = Math.min(...poids);
      const maxi = Math.max(...poids);
      if (maxi / mini >= 1.9 && mini >= total * 0.06) return poids;
    }
    // Repli déterministe, toujours visiblement inégal.
    const poids = new Array(d).fill(total / d);
    poids[0] = total / d * 0.5;
    poids[d - 1] = total / d * 1.5;
    return poids;
  }

  function genererPartage(zone, cfg) {
    // Progression fixe par position : petits dénominateurs d’abord.
    const d = etat.index <= 2 ? choisir([2, 3, 4]) : choisir([5, 6, 8]);
    const type = choisir(['bande', 'tarte']);
    // Nombre de parts du second piège : proche de d mais différent.
    let dAutre = d + choisir([-1, 1, 2]);
    if (dAutre < 2) dAutre = d + 1;

    zone.appendChild(creerBlocConsigne(
      'Touche le partage en parts égales.',
      'Regarde les trois partages. Touche celui où toutes les parts sont égales, exactement pareilles.'
    ));

    // Une bonne découpe, deux découpes inégales (dont une avec un autre nombre
    // de parts) : la bonne réponse est UNIQUE par construction.
    function formePartage(nbParts, inegal) {
      if (type === 'tarte') {
        return creerTarte(nbParts, 0, inegal ? { angles: decoupeInegale(nbParts, 360) } : {}).el;
      }
      return creerBandeChocolat(nbParts, 0, inegal ? { inegal: decoupeInegale(nbParts, nbParts) } : {}).el;
    }
    const cartes = melanger([
      { correcte: true, el: formePartage(d, false) },
      { correcte: false, el: formePartage(d, true) },
      { correcte: false, el: formePartage(dAutre, true) }
    ]);

    const grille = document.createElement('div');
    grille.className = 'grille-partages';
    let phase1Juste = null;

    cartes.forEach((carte) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'carte-partage';
      btn.appendChild(carte.el);
      btn.addEventListener('click', () => {
        if (phase1Juste !== null || etat.verrouille) return;
        phase1Juste = carte.correcte;
        cartes.forEach((c) => {
          const b = c.btnRef;
          b.disabled = true;
          if (c.correcte) b.classList.add('correct');
          else if (c === carte) b.classList.add('incorrect');
        });
        if (carte.correcte) {
          // Petite récompense propre à CETTE sous-réponse, indépendante du
          // verdict final de la manche (qui dépend aussi du comptage).
          jouerSon('bravo');
          lancerConfettis();
          ouvrirComptage();
        } else {
          // CHARTE §18 : la découpe fautive en rouge, la bonne en vert, et
          // l’explication de ce qui cloche. On enchaîne quand même sur le
          // comptage, à faire sur la BONNE découpe.
          jouerSon('rate');
          explication.textContent = 'Regarde : dans ce partage, les parts ne sont pas toutes pareilles. Le partage vert, lui, est équitable.';
          ouvrirComptage();
        }
      });
      carte.btnRef = btn;
      grille.appendChild(btn);
    });
    zone.appendChild(grille);

    const explication = document.createElement('p');
    explication.className = 'legende';
    zone.appendChild(explication);

    const zoneComptage = document.createElement('div');
    zone.appendChild(zoneComptage);

    function ouvrirComptage() {
      const invite = document.createElement('p');
      invite.className = 'legende-forte';
      invite.textContent = 'Combien de parts égales dans le partage vert ?';
      zoneComptage.appendChild(invite);
      const saisie = creerSaisieNombre((valeur) => {
        saisie.verrouiller();
        const phase2Juste = valeur === d;
        saisie.marquer(phase2Juste);
        // Là encore, la sous-réponse a son propre retour immédiat.
        if (phase2Juste) {
          jouerSon('bravo');
          lancerConfettis();
          const vocab = document.createElement('p');
          vocab.className = 'legende';
          vocab.textContent = 'Ce nombre de parts, c’est le DÉNOMINATEUR de la fraction !';
          zoneComptage.appendChild(vocab);
        } else {
          jouerSon('rate');
        }
        // La manche n’est acquise que si LES DEUX sous-réponses sont justes,
        // mais le commentaire final distingue les deux cas de réussite
        // partielle plutôt que de les noyer dans un « rate » générique — les
        // sons/confettis ont déjà été joués par sous-réponse, on ne les
        // rejoue donc pas ici (options.silencieux).
        let message = null;
        if (phase1Juste && !phase2Juste) {
          message = 'Bon choix de partage ! Mais recompte bien les parts la prochaine fois.';
        } else if (!phase1Juste && phase2Juste) {
          message = 'Le partage n’était pas le bon, mais bien compté !';
        }
        validerReponse(phase1Juste && phase2Juste,
          (phase1Juste && phase2Juste) ? null : {
            donnee: phase2Juste ? null : String(valeur),
            attendue: d + ' parts égales'
          },
          { message, silencieux: true });
      });
      zoneComptage.appendChild(saisie.el);
      lireAVoixHaute('Maintenant, compte : combien de parts égales dans le bon partage ?');
    }
  }

  /* ================================================================
     Mini-jeu 2 : La part du pique-nique — lire, écrire, colorier
     ================================================================ */

  function genererLireEcrire(zone, cfg) {
    // Progression fixe par position (CHARTE §13 : la difficulté ne dépend pas
    // du tirage) : unitaires d’abord, puis non unitaires, grands dénominateurs
    // en fin de partie. Le TYPE d’activité alterne : écrire, mot, colorier.
    const ordreTypes = ['ecrire', 'mot', 'colorier', 'ecrire', 'colorier'];
    const typeActivite = ordreTypes[etat.index - 1];
    const forme = choisir(['bande', 'tarte', 'brownie']);
    const objet = donnees.objets[forme];

    let d, n;
    if (etat.index === 1) { d = choisir([2, 3, 4, 5]); n = 1; }
    else if (etat.index === 2) { d = null; n = null; } // choisi dans la banque des noms courants
    else if (etat.index <= 4) { d = choisir([3, 4, 5, 6]); n = nombreAleatoire(2, d - 1); }
    else { d = choisir([6, 8, 10]); n = nombreAleatoire(2, d - 1); }

    if (typeActivite === 'colorier') {
      zone.appendChild(creerBlocConsigne(
        'Colorie ' + n + '/' + d + ' ' + objet.de + '.',
        'Colorie ' + fractionEnMots(n, d) + ' ' + objet.de + ' : touche les parts pour les prendre.'
      ));
      const rangee = document.createElement('div');
      rangee.className = 'rangee-forme';
      rangee.appendChild(creerFractionLabel(n, d, true));
      zone.appendChild(rangee);

      const formeJeu = creerForme(forme, d, 0, { interactive: true });
      const rangeeJeu = document.createElement('div');
      rangeeJeu.className = 'rangee-forme';
      rangeeJeu.appendChild(formeJeu.el);
      zone.appendChild(rangeeJeu);

      const bouton = document.createElement('button');
      bouton.type = 'button';
      bouton.className = 'bouton-principal';
      bouton.textContent = 'Valider';
      bouton.addEventListener('click', () => {
        if (etat.verrouille) return;
        formeJeu.verrouiller();
        bouton.disabled = true;
        const remplies = formeJeu.remplies();
        const juste = remplies === n;
        if (!juste) {
          // CHARTE §18 : la bonne réponse MONTRÉE — la forme passe au bon
          // coloriage, et la correction chiffrée est rappelée dessous.
          formeJeu.setRemplies(n);
          validerReponse(false, { donnee: remplies + '/' + d, attendue: n + '/' + d });
        } else {
          validerReponse(true);
        }
      });
      zone.appendChild(bouton);
      return;
    }

    if (typeActivite === 'mot') {
      // La fraction se dit avec des mots : la moitié, un quart, trois quarts...
      const cles = Object.keys(donnees.nomsCourants);
      const cle = choisir(cles);
      const morceaux = cle.split('/');
      const nMot = parseInt(morceaux[0], 10);
      const dMot = parseInt(morceaux[1], 10);
      zone.appendChild(creerBlocConsigne(
        'Quelle part ' + objet.de + ' est coloriée ?',
        'Regarde la part coloriée. Comment la dit-on avec des mots ?'
      ));
      const rangee = document.createElement('div');
      rangee.className = 'rangee-forme';
      zone.appendChild(rangee);
      rangee.appendChild(creerForme(forme, dMot, nMot).el);

      // Distracteurs : d’autres noms de la banque, tous distincts.
      const autres = melanger(cles.filter((c) => c !== cle)).slice(0, 3);
      const brutes = [donnees.nomsCourants[cle]].concat(autres.map((c) => donnees.nomsCourants[c]));
      const { options, indexCorrect } = melangerOptions(brutes, 0);
      const grille = document.createElement('div');
      grille.className = 'grille-options';
      options.forEach((texte, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bouton-option';
        btn.textContent = texte;
        btn.addEventListener('click', () => {
          if (etat.verrouille) return;
          grille.querySelectorAll('button').forEach((b, k) => {
            b.disabled = true;
            if (k === indexCorrect) b.classList.add('correct');
            else if (b === btn) b.classList.add('incorrect');
          });
          validerReponse(i === indexCorrect,
            i === indexCorrect ? null : { donnee: texte, attendue: options[indexCorrect] + ' (' + cle + ')' });
        });
        grille.appendChild(btn);
      });
      zone.appendChild(grille);
      return;
    }

    // typeActivite === 'ecrire'
    zone.appendChild(creerBlocConsigne(
      'Écris la fraction ' + objet.de + ' qui est coloriée.',
      'Compte les parts prises et toutes les parts, puis écris la fraction avec le pavé : d’abord le numérateur, en haut, puis le dénominateur, en bas.'
    ));
    const rangee = document.createElement('div');
    rangee.className = 'rangee-forme';
    rangee.appendChild(creerForme(forme, d, n).el);
    zone.appendChild(rangee);

    const saisie = creerSaisieFraction({
      legendes: true,
      onValider: (nSaisi, dSaisi) => {
        if (etat.verrouille) return;
        saisie.verrouiller();
        const juste = nSaisi === n && dSaisi === d;
        saisie.marquer(nSaisi === n, dSaisi === d);
        validerReponse(juste, juste ? null : { donnee: nSaisi + '/' + dSaisi, attendue: n + '/' + d });
      }
    });
    zone.appendChild(saisie.el);
  }

  /* ================================================================
     Mini-jeu 3 : La bouteille de limonade — contenances, n/n = 1
     ================================================================ */

  function genererContenances(zone, cfg) {
    /* Types de manche par position : verser (guidé puis libre), lire la
       fraction versée, lire la fraction restante, et la manche finale qui
       installe n/n = 1 en versant toute la bouteille. */
    const manche = etat.index;
    let d, cible;
    /* Manche 1 (« la moitié ») : partager la bouteille en SEULEMENT deux
       verres ferait tenir la moitié entière dans un seul verre — une portion
       énorme, peu réaliste pour un verre. On partage donc en quatre verres
       plus petits et on demande d’en remplir deux sur quatre : le volume
       versé reste exactement la moitié de la bouteille, mais réparti dans des
       verres de taille crédible. */
    if (manche === 1) { d = 4; cible = 2; }
    else if (manche === 2) { d = choisir([3, 4]); cible = nombreAleatoire(1, d - 1); }
    else if (manche === 3) { d = choisir([3, 4]); cible = nombreAleatoire(1, d - 1); }
    else if (manche === 4) { d = choisir([3, 4, 6]); cible = nombreAleatoire(1, d - 1); }
    else { d = choisir([3, 4]); cible = d; }

    const modeVerser = manche === 1 || manche === 2 || manche === 5;
    const dejaVerse = modeVerser ? 0 : cible;

    if (manche === 1) {
      zone.appendChild(creerBlocConsigne(
        'Verse la moitié (1/2) de la bouteille dans les verres.',
        'La bouteille est partagée en quatre verres égaux. Touche les verres pour verser. '
        + 'Verse deux verres sur les quatre : c’est la moitié de la bouteille. Puis valide.'
      ));
    } else if (manche === 2) {
      zone.appendChild(creerBlocConsigne(
        'Verse ' + cible + '/' + d + ' de la bouteille.',
        'La bouteille est partagée en ' + NOMBRES_EN_LETTRES[d] + ' parts égales. Verse ' + fractionEnMots(cible, d) + ' de la bouteille, puis valide.'
      ));
    } else if (manche === 3) {
      zone.appendChild(creerBlocConsigne(
        'Quelle fraction de la bouteille a-t-on versée ?',
        'Regarde les verres pleins et les graduations de la bouteille, puis écris la fraction versée avec le pavé.'
      ));
    } else if (manche === 4) {
      zone.appendChild(creerBlocConsigne(
        'Quelle fraction de limonade reste-t-il dans la bouteille ?',
        'On a déjà versé des verres. Regarde ce qui reste dans la bouteille, puis écris la fraction restante.'
      ));
    } else {
      zone.appendChild(creerBlocConsigne(
        'Verse TOUTE la bouteille dans les verres !',
        'Verse toute la bouteille, verre après verre. Que se passe-t-il quand toutes les parts sont versées ?'
      ));
    }

    const scene = document.createElement('div');
    scene.className = 'scene-limonade';
    const bouteille = creerBouteille(d, d - dejaVerse);
    scene.appendChild(bouteille.el);

    const rangee = document.createElement('div');
    rangee.className = 'rangee-verres';
    const verres = [];
    let animationEnCours = false;
    let questionPosee = false;

    function nbPleins() { return verres.filter((v) => v.estPlein()).length; }

    for (let i = 0; i < d; i++) {
      const verre = creerVerre(() => {
        if (etat.verrouille || animationEnCours || !modeVerser) return;
        if (verre.estPlein()) {
          // Reprendre un verre : la limonade retourne dans la bouteille — le
          // geste d’annulation le plus naturel qui soit pour un enfant.
          animationEnCours = true;
          verre.setPlein(false);
          bouteille.setNiveau(bouteille.niveau() + 1, true, () => { animationEnCours = false; });
          jouerSon('tic');
        } else {
          if (bouteille.niveau() <= 0) return;
          animationEnCours = true;
          bouteille.el.classList.add('verse');
          verre.setPlein(true);
          bouteille.setNiveau(bouteille.niveau() - 1, true, () => {
            bouteille.el.classList.remove('verse');
            animationEnCours = false;
            jouerSon('tic');
            if (manche === 5 && nbPleins() === d && !questionPosee) {
              // La bouteille est vide : les verres se figent, la question
              // n/n = 1 se pose UNE fois.
              questionPosee = true;
              verres.forEach((v) => { v.el.disabled = true; });
              questionFinale();
            }
          });
        }
      });
      if (i < dejaVerse) verre.setPlein(true);
      if (!modeVerser) verre.el.disabled = true;
      verres.push(verre);
      rangee.appendChild(verre.el);
    }
    scene.appendChild(rangee);
    zone.appendChild(scene);

    const zoneReponse = document.createElement('div');
    zone.appendChild(zoneReponse);

    if (modeVerser && manche !== 5) {
      const bouton = document.createElement('button');
      bouton.type = 'button';
      bouton.className = 'bouton-principal';
      bouton.textContent = 'C’est versé !';
      bouton.addEventListener('click', () => {
        if (etat.verrouille || animationEnCours) return;
        const verse = nbPleins();
        const juste = verse === cible;
        bouton.disabled = true;
        if (!juste) {
          // CHARTE §18 : on MONTRE le bon état — les verres et la bouteille
          // rejoignent d’eux-mêmes la bonne réponse.
          verres.forEach((v, i) => v.setPlein(i < cible));
          bouteille.setNiveau(d - cible, true);
          validerReponse(false, { donnee: verse + '/' + d, attendue: cible + '/' + d });
        } else {
          validerReponse(true);
        }
      });
      zoneReponse.appendChild(bouton);
      return;
    }

    if (manche === 3 || manche === 4) {
      const attenduN = manche === 3 ? cible : d - cible;
      const saisie = creerSaisieFraction({
        onValider: (nSaisi, dSaisi) => {
          if (etat.verrouille) return;
          saisie.verrouiller();
          const juste = nSaisi === attenduN && dSaisi === d;
          saisie.marquer(nSaisi === attenduN, dSaisi === d);
          validerReponse(juste, juste ? null : { donnee: nSaisi + '/' + dSaisi, attendue: attenduN + '/' + d });
        }
      });
      zoneReponse.appendChild(saisie.el);
      if (manche === 4) {
        const indice = document.createElement('p');
        indice.className = 'legende';
        indice.textContent = 'Fraction versée + fraction restante = la bouteille entière.';
        zoneReponse.appendChild(indice);
      }
      return;
    }

    // Manche 5 : une fois tout versé, la question qui installe n/n = 1.
    function questionFinale() {
      const invite = document.createElement('p');
      invite.className = 'legende-forte';
      invite.textContent = 'Tu as versé ' + d + '/' + d + ' de la bouteille. C’est…';
      zoneReponse.appendChild(invite);
      lireAVoixHaute('Tu as versé ' + NOMBRES_EN_LETTRES[d] + ' ' + (donnees.nomsOrdinaux[String(d)] || ['parts', 'parts'])[1] + ' sur ' + NOMBRES_EN_LETTRES[d] + '. Qu’est-ce que cela fait ?');
      const brutes = ['1 bouteille entière', 'une seule part', d + ' bouteilles'];
      const { options, indexCorrect } = melangerOptions(brutes, 0);
      const grille = document.createElement('div');
      grille.className = 'grille-options';
      options.forEach((texte, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bouton-option';
        btn.textContent = texte;
        btn.addEventListener('click', () => {
          if (etat.verrouille) return;
          grille.querySelectorAll('button').forEach((b, k) => {
            b.disabled = true;
            if (k === indexCorrect) b.classList.add('correct');
            else if (b === btn) b.classList.add('incorrect');
          });
          if (i === indexCorrect) {
            const morale = document.createElement('p');
            morale.className = 'legende-forte';
            morale.textContent = d + '/' + d + ' = 1 : toutes les parts, c’est le tout entier !';
            zoneReponse.appendChild(morale);
          }
          validerReponse(i === indexCorrect,
            i === indexCorrect ? null : { donnee: texte, attendue: '1 bouteille entière (' + d + '/' + d + ' = 1)' });
        });
        grille.appendChild(btn);
      });
      zoneReponse.appendChild(grille);
    }
  }

  /* ================================================================
     Mini-jeu 4 : Les portraits de la fraction — représentations multiples
     ================================================================ */

  function genererRepresentations(zone, cfg) {
    const d = etat.index <= 2 ? choisir([3, 4]) : choisir([4, 5, 6, 8]);
    const n = nombreAleatoire(1, d - 1);

    zone.appendChild(creerBlocConsigne(
      'Touche TOUTES les images qui montrent ' + n + '/' + d + '.',
      'La fraction cherchée est ' + fractionEnMots(n, d) + '. Touche toutes les images qui la montrent, puis valide. Attention : les parts doivent être égales !'
    ));
    const rangee = document.createElement('div');
    rangee.className = 'rangee-forme';
    rangee.appendChild(creerFractionLabel(n, d, true));
    zone.appendChild(rangee);

    /* Construction des 6 cartes : 2 ou 3 bonnes (formes variées, dont parfois
       une tarte TOURNÉE — toujours valide, la fraction ne dépend pas de
       l’orientation), 1 piège « parts inégales » (n parts prises sur d parts
       inégales : ce n’est PAS n/d), et des fractions différentes pour remplir. */
    const nbBonnes = choisir([2, 3]);
    const formesBonnes = melanger(['bande', 'tarte', 'brownie', 'tarte-tournee']).slice(0, nbBonnes);
    const cartes = [];

    formesBonnes.forEach((f) => {
      if (f === 'tarte-tournee') {
        cartes.push({ correcte: true, raison: '', el: creerTarte(d, n, { rotation: nombreAleatoire(25, 335) }).el });
      } else {
        cartes.push({ correcte: true, raison: '', el: creerForme(f, d, n).el });
      }
    });

    // Le piège des parts inégales — le concept du jeu 1 revient en embuscade.
    const formePiege = choisir(['bande', 'tarte']);
    cartes.push({
      correcte: false,
      raison: 'parts inégales !',
      el: formePiege === 'tarte'
        ? creerTarte(d, n, { angles: decoupeInegale(d, 360) }).el
        : creerBandeChocolat(d, n, { inegal: decoupeInegale(d, d) }).el
    });

    // Fractions différentes — jamais ÉGALES EN VALEUR à la cible (2/4 pour
    // 1/2 serait une équivalence, notion de CE2, donc un piège déloyal ici).
    const dejaVues = new Set([n + '/' + d]);
    while (cartes.length < 6) {
      const d2 = choisir(D.filter((x) => x <= 8));
      const n2 = nombreAleatoire(1, d2 - 1);
      if (dejaVues.has(n2 + '/' + d2)) continue;
      if (n2 * d === n * d2) continue; // même valeur : exclue
      dejaVues.add(n2 + '/' + d2);
      cartes.push({
        correcte: false,
        raison: 'c’est ' + n2 + '/' + d2,
        el: creerForme(choisir(['bande', 'tarte', 'brownie']), d2, n2).el
      });
    }

    const grille = document.createElement('div');
    grille.className = 'grille-portraits';
    const melangees = melanger(cartes);
    melangees.forEach((carte) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'carte-portrait';
      btn.appendChild(carte.el);
      const badge = document.createElement('span');
      badge.className = 'badge-portrait';
      btn.appendChild(badge);
      btn.addEventListener('click', () => {
        if (etat.verrouille) return;
        btn.classList.toggle('choisie');
        jouerSon('tic');
      });
      carte.btnRef = btn;
      carte.badgeRef = badge;
      grille.appendChild(btn);
    });
    zone.appendChild(grille);

    const bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'bouton-principal';
    bouton.textContent = 'Valider';
    bouton.addEventListener('click', () => {
      if (etat.verrouille) return;
      bouton.disabled = true;
      let juste = true;
      melangees.forEach((carte) => {
        const choisie = carte.btnRef.classList.contains('choisie');
        carte.btnRef.disabled = true;
        carte.btnRef.classList.remove('choisie');
        if (carte.correcte && choisie) {
          carte.btnRef.classList.add('correct');
        } else if (carte.correcte && !choisie) {
          juste = false;
          carte.btnRef.classList.add('oubliee');
          carte.badgeRef.textContent = 'à prendre aussi';
        } else if (!carte.correcte && choisie) {
          juste = false;
          carte.btnRef.classList.add('incorrect');
          carte.badgeRef.textContent = carte.raison;
        }
      });
      validerReponse(juste, juste ? null : {
        donnee: null,
        attendue: 'les images vertes — et seulement elles'
      });
    });
    zone.appendChild(bouton);
  }

  /* ================================================================
     Mini-jeu 5 : La plus grande part — comparer (M16, CE1)
     ================================================================ */

  function genererComparer(zone, cfg) {
    /* Manches 1-3 : même dénominateur (on compare les numérateurs).
       Manches 4-5 : fractions UNITAIRES (plus le dénominateur est grand, plus
       la part est petite — le cas contre-intuitif visé par le programme).
       Une manche d’ÉGALITÉ est garantie par partie : son numéro est tiré au
       début et mémorisé dans l’état du jeu. */
    if (!etat.memoire.mancheEgalite) etat.memoire.mancheEgalite = nombreAleatoire(1, cfg.nbQuestions);
    const egalite = etat.index === etat.memoire.mancheEgalite;
    const unitaire = etat.index >= 4;

    let fa, fb;
    if (unitaire) {
      if (egalite) {
        const d = choisir([3, 4, 5, 6]);
        fa = { n: 1, d };
        fb = { n: 1, d };
      } else {
        const paire = melanger(D.filter((x) => x <= 8));
        fa = { n: 1, d: paire[0] };
        fb = { n: 1, d: paire[1] };
      }
    } else {
      const d = choisir([4, 5, 6, 8]);
      if (egalite) {
        const n = nombreAleatoire(1, d - 1);
        fa = { n, d };
        fb = { n, d };
      } else {
        let n1 = nombreAleatoire(1, d - 1);
        let n2 = nombreAleatoire(1, d - 1);
        while (n2 === n1) n2 = nombreAleatoire(1, d - 1);
        fa = { n: n1, d };
        fb = { n: n2, d };
      }
    }

    const persos = melanger(donnees.personnages).slice(0, 2);
    zone.appendChild(creerBlocConsigne(
      'Qui a la plus grande part de chocolat ?',
      persos[0].prenom + ' a ' + fractionEnMots(fa.n, fa.d) + ' de sa barre. '
      + persos[1].prenom + ' a ' + fractionEnMots(fb.n, fb.d) + ' de la sienne. '
      + 'Les deux barres sont pareilles. Qui a la plus grande part ? Si les parts sont pareilles, touche « pareil ».'
    ));

    const duel = document.createElement('div');
    duel.className = 'duel';
    [{ perso: persos[0], f: fa, teinte: 'a' }, { perso: persos[1], f: fb, teinte: 'b' }].forEach((cote) => {
      const carte = document.createElement('div');
      carte.className = 'carte-perso';
      const emoji = document.createElement('span');
      emoji.className = 'perso-emoji';
      emoji.textContent = cote.perso.emoji;
      const nom = document.createElement('span');
      nom.className = 'perso-nom';
      nom.textContent = cote.perso.prenom;
      carte.appendChild(emoji);
      carte.appendChild(nom);
      carte.appendChild(creerBandeChocolat(cote.f.d, cote.f.n, { teinte: cote.teinte }).el);
      carte.appendChild(creerFractionLabel(cote.f.n, cote.f.d));
      duel.appendChild(carte);
    });
    zone.appendChild(duel);

    const valA = fa.n / fa.d;
    const valB = fb.n / fb.d;
    const bonne = valA > valB ? 'a' : (valB > valA ? 'b' : 'egal');

    const reponses = document.createElement('div');
    reponses.className = 'reponses-duel';
    [
      { cle: 'a', texte: persos[0].prenom },
      { cle: 'egal', texte: 'Parts égales !' },
      { cle: 'b', texte: persos[1].prenom }
    ].forEach((rep) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bouton-option';
      btn.textContent = rep.texte;
      btn.addEventListener('click', () => {
        if (etat.verrouille) return;
        reponses.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        const juste = rep.cle === bonne;
        btn.classList.add(juste ? 'correct' : 'incorrect');
        if (!juste) {
          const bonBtn = Array.from(reponses.querySelectorAll('button'))[['a', 'egal', 'b'].indexOf(bonne)];
          bonBtn.classList.add('correct');
        }
        montrerSuperposition();
        const attendueTexte = bonne === 'egal'
          ? 'les parts sont égales'
          : (bonne === 'a' ? persos[0].prenom : persos[1].prenom) + ' a la plus grande part';
        validerReponse(juste, juste ? null : { donnee: rep.texte, attendue: attendueTexte });
      });
      reponses.appendChild(btn);
    });
    zone.appendChild(reponses);

    /* LA PREUVE PAR SUPERPOSITION (note du backlog : « parts superposables »).
       Les deux parts se posent l’une au-dessus de l’autre, alignées à gauche,
       à la même échelle : on VOIT laquelle dépasse — ou qu’aucune ne dépasse. */
    function montrerSuperposition() {
      const bloc = document.createElement('div');
      bloc.className = 'zone-superposition';
      const titre = document.createElement('p');
      titre.className = 'legende-petite';
      titre.textContent = 'On pose les deux parts l’une sur l’autre :';
      bloc.appendChild(titre);
      [{ f: fa, cls: 'part-a', prenom: persos[0].prenom }, { f: fb, cls: 'part-b', prenom: persos[1].prenom }].forEach((cote) => {
        const barre = document.createElement('div');
        barre.className = 'barre-superposee ' + cote.cls;
        const etiquette = document.createElement('span');
        etiquette.className = 'etiquette-superposee';
        etiquette.textContent = cote.prenom + ' : ' + cote.f.n + '/' + cote.f.d;
        barre.appendChild(etiquette);
        bloc.appendChild(barre);
        // Largeur finale après insertion : la transition CSS fait le trajet.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { barre.style.width = (cote.f.n / cote.f.d * 80) + '%'; });
        });
      });
      const conclusion = document.createElement('p');
      conclusion.className = 'legende-petite';
      conclusion.textContent = bonne === 'egal'
        ? 'Les deux parts sont exactement pareilles.'
        : 'La part de ' + (bonne === 'a' ? persos[0].prenom : persos[1].prenom) + ' est plus grande.';
      bloc.appendChild(conclusion);
      zone.appendChild(bloc);
    }
  }

  /* ================================================================
     Mini-jeu 6 : Les comptes du goûter — +, −, compléments à 1 (M16, CE1)
     ================================================================ */

  function genererCalculer(zone, cfg) {
    /* Les types de manche sont tirés UNE fois par partie puis consommés dans
       l’ordre : deux additions, une soustraction, deux compléments — mélangés
       (CHARTE §13), donc jamais le même déroulé deux parties de suite. */
    if (!etat.memoire.typesCalcul) {
      etat.memoire.typesCalcul = melanger(['addition', 'soustraction', 'complement', 'addition', 'complement']);
    }
    const typeCalcul = etat.memoire.typesCalcul[etat.index - 1];
    const persos = melanger(donnees.personnages).slice(0, 2);

    if (typeCalcul === 'addition') {
      const d = choisir([4, 5, 6, 8]);
      const a = nombreAleatoire(1, d - 2);
      const b = nombreAleatoire(1, d - a); // a + b ≤ d : le résultat ne dépasse jamais 1
      const total = a + b;

      const enonce = persos[0].prenom + ' mange ' + a + '/' + d + ' de la barre de chocolat. '
        + persos[1].prenom + ' en mange ' + b + '/' + d + '. Quelle fraction de la barre a été mangée en tout ?';
      zone.appendChild(creerBlocConsigne(enonce,
        persos[0].prenom + ' mange ' + fractionEnMots(a, d) + ' de la barre. '
        + persos[1].prenom + ' en mange ' + fractionEnMots(b, d) + '. '
        + 'Quelle fraction de la barre a été mangée en tout ?'));

      const apercu = document.createElement('div');
      apercu.className = 'apercu-calcul';
      apercu.appendChild(creerBandeNeutre(d, a, b));
      zone.appendChild(apercu);
      const rappel = document.createElement('div');
      rappel.className = 'rappel-calcul';
      rappel.appendChild(creerFractionLabel(a, d));
      const plus = document.createElement('span');
      plus.className = 'symbole-calcul';
      plus.textContent = '+';
      rappel.appendChild(plus);
      rappel.appendChild(creerFractionLabel(b, d));
      const egal = document.createElement('span');
      egal.className = 'symbole-calcul';
      egal.textContent = '=';
      rappel.appendChild(egal);
      rappel.appendChild(document.createTextNode('?'));
      zone.appendChild(rappel);

      const saisie = creerSaisieFraction({
        denominateurFixe: d,
        onValider: (nSaisi) => {
          if (etat.verrouille) return;
          saisie.verrouiller();
          const juste = nSaisi === total;
          saisie.marquer(juste, true);
          if (juste && total === d) {
            const morale = document.createElement('p');
            morale.className = 'legende-forte';
            morale.textContent = d + '/' + d + ' = 1 : toute la barre a été mangée !';
            zone.appendChild(morale);
          }
          validerReponse(juste, juste ? null : { donnee: nSaisi + '/' + d, attendue: total + '/' + d });
        }
      });
      zone.appendChild(saisie.el);
      return;
    }

    if (typeCalcul === 'soustraction') {
      const d = choisir([4, 5, 6, 8]);
      const a = nombreAleatoire(2, d - 1);
      const b = nombreAleatoire(1, a - 1);
      const reste = a - b;

      const enonce = 'Il restait ' + a + '/' + d + ' de la tarte. On mange ' + b + '/' + d + '. Quelle fraction de la tarte reste-t-il ?';
      zone.appendChild(creerBlocConsigne(enonce,
        'Il restait ' + fractionEnMots(a, d) + ' de la tarte. On mange ' + fractionEnMots(b, d) + '. Quelle fraction reste-t-il ?'));

      // Les parts mangées se distinguent des parts restantes : la tarte montre
      // a parts garnies dont b déjà croquées (estompées).
      const rangee = document.createElement('div');
      rangee.className = 'rangee-forme';
      const mangees = [];
      for (let i = reste; i < a; i++) mangees.push(i);
      rangee.appendChild(creerTarte(d, a, { mangees }).el);
      zone.appendChild(rangee);
      const legende = document.createElement('p');
      legende.className = 'legende-petite';
      legende.textContent = 'Les parts pâles viennent d’être mangées.';
      zone.appendChild(legende);

      const saisie = creerSaisieFraction({
        denominateurFixe: d,
        onValider: (nSaisi) => {
          if (etat.verrouille) return;
          saisie.verrouiller();
          const juste = nSaisi === reste;
          saisie.marquer(juste, true);
          validerReponse(juste, juste ? null : { donnee: nSaisi + '/' + d, attendue: reste + '/' + d });
        }
      });
      zone.appendChild(saisie.el);
      return;
    }

    // Complément à 1 : la bouteille remplie à a/d — que manque-t-il ?
    const d = choisir([3, 4, 5, 6, 8]);
    const a = nombreAleatoire(1, d - 1);
    const manque = d - a;

    const enonce = 'La bouteille est remplie à ' + a + '/' + d + '. Quelle fraction manque pour la remplir en entier ?';
    zone.appendChild(creerBlocConsigne(enonce,
      'La bouteille est remplie à ' + fractionEnMots(a, d) + '. Quelle fraction de limonade manque-t-il pour la remplir en entier ?'));

    const scene = document.createElement('div');
    scene.className = 'scene-limonade';
    const bouteille = creerBouteille(d, a);
    scene.appendChild(bouteille.el);
    zone.appendChild(scene);
    const rappel = document.createElement('div');
    rappel.className = 'rappel-calcul';
    rappel.appendChild(creerFractionLabel(a, d));
    const plus = document.createElement('span');
    plus.className = 'symbole-calcul';
    plus.textContent = '+';
    rappel.appendChild(plus);
    rappel.appendChild(document.createTextNode('?'));
    const egal = document.createElement('span');
    egal.className = 'symbole-calcul';
    egal.textContent = '=';
    rappel.appendChild(egal);
    rappel.appendChild(document.createTextNode('1'));
    zone.appendChild(rappel);

    const zoneLegende = document.createElement('div');
    zone.appendChild(zoneLegende);

    const saisie = creerSaisieFraction({
      denominateurFixe: d,
      onValider: (nSaisi) => {
        if (etat.verrouille) return;
        saisie.verrouiller();
        const juste = nSaisi === manque;
        saisie.marquer(juste, true);
        // La bouteille se remplit entièrement à la validation : le complément
        // (la vraie valeur, pas la réponse de l’enfant) monte dans une AUTRE
        // couleur jusqu’au bouchon, pour VOIR que a/d + manque/d = d/d = 1.
        bouteille.animerComplement(a, d, () => {
          const legende = document.createElement('p');
          legende.className = 'legende';
          legende.textContent = a + '/' + d + ' (jaune) + ' + manque + '/' + d + ' (orange) = ' + d + '/' + d + ' = 1 bouteille pleine.';
          zoneLegende.appendChild(legende);
        });
        validerReponse(juste, juste ? null : { donnee: nSaisi + '/' + d, attendue: manque + '/' + d + ' (car ' + a + '/' + d + ' + ' + manque + '/' + d + ' = ' + d + '/' + d + ' = 1)' });
      }
    });
    zone.appendChild(saisie.el);
  }

  /* ---------- Initialisation ---------- */

  document.getElementById('bouton-retour').addEventListener('click', retourAccueil);
  document.getElementById('bouton-suivant').addEventListener('click', mancheSuivante);

  construireAccueil();
})();
</script>
<script>
  /* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7).
     Script isolé du moteur de jeu : il n’agit que sur les éléments statiques
     de la page. */
  (function () {
    var bouton = document.getElementById('bouton-menu');
    var modale = document.getElementById('modale-menu');
    if (!bouton || !modale) return;
    function fermer() { modale.hidden = true; }
    bouton.addEventListener('click', function () { modale.hidden = false; });
    document.getElementById('modale-menu-rester').addEventListener('click', fermer);
    document.getElementById('modale-menu-revenir').addEventListener('click', function () {
      window.location.href = '../index.html';
    });
    modale.addEventListener('click', function (e) { if (e.target === modale) fermer(); });
  })();
</script>
