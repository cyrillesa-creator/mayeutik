<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>Fractions CE1 – Mayeutik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     Protections tactiles obligatoires (CHARTE §19)
     Deux comportements natifs du navigateur parasitent l’usage tactile d’un
     jeu : le zoom au double-tap (deux appuis rapprochés sont un geste NORMAL
     ici — colorier puis décolorier une part, verser puis reprendre un verre)
     et la sélection native (surbrillance bleue, menu « copier / enregistrer
     l’image » au maintien du doigt). On les neutralise à l’échelle de
     l’interface, une bonne fois, plutôt qu’élément par élément.
     ================================================================ */

  /* `touch-action` ne s’hérite PAS : le sélecteur universel est le seul moyen
     de couvrir toute l’interface. `manipulation` supprime le zoom au
     double-tap tout en laissant le défilement et le pincement. */
  * { touch-action: manipulation; }

  /* Empêche iOS de grossir les textes en paysage, ce qui casserait les
     mises en page calculées au pixel (figures SVG). */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  /* `user-select` et `-webkit-touch-callout`, eux, s’héritent : les poser sur
     body suffit à couvrir consignes, boutons, illustrations. */
  body {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Pas de « fantôme » d’image traîné à la souris. */
  img, svg, canvas { -webkit-user-drag: none; }

  /* Les champs de saisie gardent sélection, curseur et menu d’édition. */
  input, textarea, select, [contenteditable="true"] {
    -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }

  :root {
    --couleur-fond: #FFF8EF;
    --couleur-encre: #2B2B2B;
    --couleur-mandarine: #FF8C42;
    --couleur-menthe: #4ECDC4;
    --couleur-corail: #FF6B6B;
    --couleur-soleil: #FFD93D;
    /* Teintes propres à l’univers du pique-nique */
    --choco-fonce: #6C3E21;
    --choco-clair: #8A5432;
    --choco-bord: #8A5A2B;
    --emballage: #F7EAD8;
    --croute: #E8B963;
    --croute-bord: #C08A3E;
    --limonade: #F5D34D;
    color-scheme: light only;
  }

  @media (prefers-color-scheme: dark) {
    html { background-color: var(--couleur-fond); }
    body { background-color: var(--couleur-fond); color: var(--couleur-encre); }
    input, select, textarea, button { background-color: #FFFFFF; color: var(--couleur-encre); }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: var(--couleur-fond); color: var(--couleur-encre); overflow-x: hidden; }
  body { font-family: 'Fredoka', system-ui, sans-serif; min-height: 100vh; padding-bottom: 2rem; }
  button { font-family: inherit; cursor: pointer; }
  h1, h2, h3 { font-weight: 700; margin: 0 0 0.4rem; }

  /* ---------- Écran d’accueil ---------- */

  #ecran-accueil { max-width: 640px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
  .entete-accueil { text-align: center; margin-bottom: 1.2rem; }
  .entete-accueil h1 { font-size: 1.7rem; color: var(--couleur-mandarine); }
  .entete-accueil p { margin: 0; font-size: 1rem; font-weight: 500; opacity: 0.85; }

  .grille-jeux { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
  @media (max-width: 360px) { .grille-jeux { grid-template-columns: 1fr; } }

  .carte-jeu {
    --c: var(--couleur-mandarine);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; gap: 0.3rem;
    background: color-mix(in srgb, var(--c) 16%, white);
    border: 3px solid var(--c); border-radius: 20px; padding: 0.8rem 0.6rem;
    max-height: 34vh; min-height: 9.5rem;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, black 6%);
  }
  .carte-jeu:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 55%, black 6%); }
  .carte-jeu.carte-menthe { --c: var(--couleur-menthe); }
  .carte-jeu.carte-corail { --c: var(--couleur-corail); }
  .carte-jeu.carte-soleil { --c: var(--couleur-soleil); }
  .carte-jeu .icone { font-size: 1.9rem; line-height: 1; }
  .carte-jeu h2 { font-size: 1.02rem; }
  .carte-jeu p { font-size: 0.78rem; font-weight: 400; margin: 0; opacity: 0.85; }

  .etoiles { display: inline-flex; gap: 2px; font-size: 1.1rem; letter-spacing: -1px; }
  .etoile { color: rgba(43,43,43,0.2); }
  .etoile.pleine { color: var(--couleur-soleil); text-shadow: 0 0 1px rgba(43,43,43,0.35); }

  /* ---------- Écran de jeu ---------- */

  #ecran-jeu { max-width: 640px; margin: 0 auto; padding: 0.8rem 1rem 2.5rem; }
  .entete-jeu { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; }
  .bouton-retour {
    flex: 0 0 auto; min-height: 44px; min-width: 44px; border-radius: 14px; border: none;
    background: var(--couleur-encre); color: var(--couleur-fond);
    font-size: 1.2rem; font-weight: 600; padding: 0 0.9rem;
  }
  .entete-jeu-titres { flex: 1; min-width: 0; }
  .entete-jeu-titres h2 { font-size: 1.15rem; color: var(--couleur-mandarine); }
  .entete-jeu-titres .progression { font-size: 0.85rem; font-weight: 500; opacity: 0.75; }

  #zone-jeu {
    background: #ffffff; border-radius: 20px;
    border: 3px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
    padding: 1.1rem 0.9rem; min-height: 40vh;
  }

  /* Consigne + lecture à voix haute (composant partagé de la série) */
  .bloc-consigne { text-align: center; margin: 0 0 0.9rem; }
  .consigne { text-align: center; font-size: 1.05rem; font-weight: 600; margin: 0 0 0.4rem; }
  .bouton-son {
    min-width: 44px; min-height: 44px; border-radius: 50%;
    border: 2.5px solid var(--couleur-mandarine); background: #ffffff; font-size: 1.15rem;
  }
  .bouton-son:active { transform: translateY(1px); }

  .legende, .legende-petite { text-align: center; font-size: 0.9rem; font-weight: 400; opacity: 0.85; margin-top: 0.9rem; }
  .legende-petite { font-size: 0.8rem; margin-bottom: 0.4rem; }
  .legende-forte { text-align: center; font-size: 0.95rem; font-weight: 700; margin-top: 0.7rem; }

  /* ---------- Formes du pique-nique ---------- */

  .rangee-forme { display: flex; justify-content: center; margin: 0 0 0.6rem; }

  /* Barre de chocolat : carrés sécables dans leur emballage. Les carreaux
     PRIS sont en chocolat, les autres montrent l’emballage clair — la part
     prise est toujours la part saturée, sur toutes les formes du jeu. */
  .bande-choco {
    display: flex; width: 100%; max-width: 20rem; height: 2.6rem;
    border-radius: 10px; overflow: hidden;
    border: 2.5px solid var(--choco-bord); background: var(--emballage); margin: 0 auto;
  }
  .carre-choco { flex: 1; border-right: 2px solid var(--choco-bord); background: var(--emballage); position: relative; padding: 0; }
  .carre-choco:last-child { border-right: none; }
  .carre-choco.rempli { background: linear-gradient(135deg, var(--choco-clair), var(--choco-fonce)); }
  /* Reflet du carré de chocolat — c’est lui qui « fait vrai ». */
  .carre-choco.rempli::after {
    content: ''; position: absolute; left: 14%; top: 14%; width: 36%; height: 22%;
    border-radius: 40%; background: rgba(255,255,255,0.26);
  }
  /* Teintes de duel et de calcul : deux contributions distinctes. */
  .carre-choco.rempli.teinte-a { background: var(--couleur-mandarine); }
  .carre-choco.rempli.teinte-b { background: var(--couleur-menthe); }
  button.carre-choco { cursor: pointer; }

  /* Tarte SVG : croûte dorée, parts garnies. */
  .tarte-svg { display: block; margin: 0 auto; width: 8.2rem; height: 8.2rem; }
  .croute { fill: var(--croute); stroke: var(--croute-bord); stroke-width: 2.5; }
  .part-tarte { fill: #FFF9F0; stroke: var(--couleur-encre); stroke-width: 2; }
  .part-tarte.rempli { fill: var(--couleur-mandarine); }
  .part-tarte.mangee { fill: color-mix(in srgb, var(--couleur-mandarine) 22%, white); }
  .baie { fill: #C0392B; pointer-events: none; }
  .part-tarte.cliquable { cursor: pointer; }

  /* Plateau de brownies : quadrillage. */
  .plateau-brownie {
    display: grid; gap: 3px; width: 9.5rem; margin: 0 auto;
    border: 2.5px solid var(--choco-bord); background: var(--emballage); padding: 4px; border-radius: 10px;
  }
  .part-brownie { background: var(--emballage); border: 1.5px solid #B98A55; border-radius: 4px; min-height: 1.7rem; padding: 0; }
  .part-brownie.rempli { background: var(--choco-clair); }

  /* Bande neutre (calculs et superpositions), reprise de M17. */
  .forme-bande {
    display: flex; width: 100%; max-width: 20rem; height: 2.4rem;
    border-radius: 10px; overflow: hidden; border: 2px solid var(--couleur-encre); margin: 0 auto;
  }
  .segment-bande { flex: 1; border-right: 2px solid var(--couleur-encre); background: #ffffff; }
  .segment-bande:last-child { border-right: none; }
  .segment-bande.rempli { background: var(--couleur-mandarine); }
  .segment-bande.rempli.part-b { background: var(--couleur-menthe); }
  .bande-correction { margin: 0.5rem auto 0; max-width: 20rem; }
  .bande-correction .forme-bande { border-color: var(--couleur-menthe); }
  .bande-correction .segment-bande.rempli { background: var(--couleur-menthe); }
  .bande-correction .legende-petite { margin: 0 0 0.25rem; font-weight: 700; }

  /* Fraction affichée n/d */
  .fraction-affichage { display: inline-flex; flex-direction: column; align-items: center; font-weight: 600; line-height: 1.1; font-size: 1.15rem; }
  .fraction-affichage .fr-barre { width: 1.5em; height: 2px; background: currentColor; margin: 2px 0; }
  .fraction-affichage.grande { font-size: 1.6rem; }

  /* ---------- Saisie de fraction (pavé + cases numérateur/dénominateur) ---------- */

  .saisie-fraction { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 0.6rem 0 0.2rem; flex-wrap: wrap; }
  .fraction-slots { display: inline-flex; flex-direction: column; align-items: center; }
  .slot-frac {
    min-width: 3.1rem; min-height: 2.6rem; border: 2.5px solid color-mix(in srgb, var(--couleur-encre) 30%, white);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1.45rem; font-weight: 700; background: #ffffff; padding: 0 0.4rem;
  }
  .slot-frac.actif { border-color: var(--couleur-mandarine); border-style: dashed; background: color-mix(in srgb, var(--couleur-mandarine) 10%, white); }
  .slot-frac.fixe { border-color: transparent; background: transparent; }
  .slot-frac.correct { border-color: var(--couleur-menthe); border-style: solid; background: color-mix(in srgb, var(--couleur-menthe) 35%, white); }
  .slot-frac.incorrect { border-color: var(--couleur-corail); border-style: solid; background: color-mix(in srgb, var(--couleur-corail) 30%, white); }
  .barre-frac { width: 3.4rem; height: 3px; background: var(--couleur-encre); margin: 5px 0; border-radius: 2px; }
  /* Vocabulaire officiel à côté des cases : le mot en face de la case qu’il nomme. */
  .vocab-cotes { display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; text-align: left; padding: 0.2rem 0; }
  .vocab-cotes span { font-size: 0.72rem; font-weight: 600; opacity: 0.8; max-width: 9.5rem; }

  /* Pavé numérique diégétique — composant partagé de la série. */
  .pave-numerique { max-width: 250px; margin: 0.7rem auto 0; }
  .pave-grille { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 8px; }
  .touche-pave {
    min-height: 48px; border: none; border-radius: 12px; font-size: 1.25rem; font-weight: 700;
    background: color-mix(in srgb, var(--couleur-soleil) 22%, white); color: var(--couleur-encre);
    box-shadow: 0 3px 0 color-mix(in srgb, var(--couleur-encre) 20%, white); touch-action: manipulation;
  }
  .touche-pave:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--couleur-encre) 20%, white); }
  .touche-pave:disabled { opacity: 0.6; }
  .touche-valider { background: var(--couleur-menthe); color: #ffffff; box-shadow: 0 3px 0 color-mix(in srgb, var(--couleur-menthe) 60%, black 10%); }
  .touche-effacer { background: var(--couleur-corail); color: #ffffff; box-shadow: 0 3px 0 color-mix(in srgb, var(--couleur-corail) 60%, black 10%); }

  /* Options QCM */
  .grille-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-top: 0.5rem; }
  .bouton-option {
    min-height: 3.4rem; border-radius: 16px; border: 2.5px solid var(--couleur-encre); background: #ffffff;
    display: flex; align-items: center; justify-content: center; padding: 0.4rem; font-size: 0.98rem; font-weight: 600;
  }
  .bouton-option:disabled { opacity: 0.6; }
  .bouton-option.correct { background: color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color: var(--couleur-menthe); }
  .bouton-option.incorrect { background: color-mix(in srgb, var(--couleur-corail) 35%, white); border-color: var(--couleur-corail); }

  /* ---------- Jeu 1 : Le bon partage ---------- */

  .grille-partages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-top: 0.4rem; }
  @media (max-width: 420px) { .grille-partages { grid-template-columns: 1fr; } }
  .carte-partage {
    border: 2.5px solid color-mix(in srgb, var(--couleur-encre) 20%, white); border-radius: 14px;
    background: #ffffff; padding: 0.7rem 0.35rem; display: flex; align-items: center; justify-content: center;
    min-height: 6.2rem;
  }
  .carte-partage:disabled { opacity: 0.75; }
  .carte-partage.correct { border-color: var(--couleur-menthe); background: color-mix(in srgb, var(--couleur-menthe) 22%, white); }
  .carte-partage.incorrect { border-color: var(--couleur-corail); background: color-mix(in srgb, var(--couleur-corail) 18%, white); }
  .carte-partage .bande-choco { max-width: 100%; height: 2rem; }
  .carte-partage .tarte-svg { width: 5.4rem; height: 5.4rem; }

  /* ---------- Jeu 3 : La bouteille de limonade ---------- */

  .scene-limonade { display: flex; gap: 1.1rem; align-items: flex-end; justify-content: center; margin: 0.4rem 0 0.6rem; flex-wrap: wrap; }
  .bouteille-wrap { transition: transform 0.35s ease; transform-origin: 20% 92%; }
  .bouteille-wrap.verse { transform: rotate(-9deg); }
  @media (prefers-reduced-motion: reduce) { .bouteille-wrap { transition: none; } }
  .bouteille-svg { display: block; width: 6rem; height: auto; }
  .verre-goutte { fill: var(--couleur-encre); opacity: 0.35; }
  .rangee-verres { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; max-width: 14.5rem; align-items: flex-end; }
  .verre-btn { background: none; border: none; padding: 2px; border-radius: 8px; }
  .verre-btn:disabled { cursor: default; }
  .verre-svg { display: block; width: 3rem; height: auto; }
  .verre-liquide {
    transform-origin: 50% 100%; transform: scaleY(0); opacity: 0;
    transition: transform 0.4s ease, opacity 0.3s ease; transform-box: fill-box;
    fill: var(--limonade);
  }
  .verre-btn.plein .verre-liquide { transform: scaleY(1); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .verre-liquide { transition: none; } }

  /* ---------- Jeu 4 : Les portraits de la fraction ---------- */

  .grille-portraits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-top: 0.4rem; }
  @media (max-width: 420px) { .grille-portraits { grid-template-columns: repeat(2, 1fr); } }
  .carte-portrait {
    border: 2.5px solid color-mix(in srgb, var(--couleur-encre) 20%, white); border-radius: 14px;
    background: #ffffff; padding: 0.55rem 0.3rem; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.3rem; min-height: 6.4rem;
  }
  .carte-portrait.choisie { border-color: var(--couleur-mandarine); box-shadow: 0 0 0 3px color-mix(in srgb, var(--couleur-mandarine) 30%, transparent); }
  .carte-portrait.correct { border-color: var(--couleur-menthe); background: color-mix(in srgb, var(--couleur-menthe) 20%, white); }
  .carte-portrait.incorrect { border-color: var(--couleur-corail); background: color-mix(in srgb, var(--couleur-corail) 16%, white); }
  .carte-portrait.oubliee { border-color: var(--couleur-menthe); border-style: dashed; }
  .carte-portrait:disabled { opacity: 0.85; }
  .badge-portrait { font-size: 0.66rem; font-weight: 700; line-height: 1.15; text-align: center; }
  .carte-portrait.incorrect .badge-portrait { color: color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .carte-portrait.correct .badge-portrait, .carte-portrait.oubliee .badge-portrait { color: color-mix(in srgb, var(--couleur-menthe) 70%, black 25%); }
  .carte-portrait .bande-choco { height: 1.45rem; max-width: 100%; }
  .carte-portrait .tarte-svg { width: 4.5rem; height: 4.5rem; }
  .carte-portrait .plateau-brownie { width: 5.6rem; padding: 3px; gap: 2px; }
  .carte-portrait .part-brownie { min-height: 0.85rem; border-radius: 3px; }

  /* ---------- Jeu 5 : La plus grande part ---------- */

  .duel { display: flex; gap: 0.7rem; justify-content: center; align-items: stretch; margin-top: 0.3rem; }
  .carte-perso {
    flex: 1; max-width: 15rem; border: 2.5px solid color-mix(in srgb, var(--couleur-encre) 20%, white);
    border-radius: 16px; padding: 0.6rem 0.4rem; background: #ffffff;
    display: flex; flex-direction: column; gap: 0.45rem; align-items: center;
  }
  .carte-perso .perso-nom { font-weight: 700; font-size: 0.95rem; }
  .carte-perso .perso-emoji { font-size: 1.7rem; line-height: 1; }
  .carte-perso .bande-choco { height: 1.9rem; }
  .reponses-duel { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.8rem; flex-wrap: wrap; }
  .reponses-duel .bouton-option { min-width: 6.2rem; }
  /* Superposition des deux parts : preuves alignées à gauche, même unité. */
  .zone-superposition { max-width: 20rem; margin: 0.9rem auto 0; }
  .barre-superposee {
    height: 1.5rem; border-radius: 8px; border: 2px solid var(--couleur-encre);
    width: 0%; transition: width 0.7s ease; margin: 0.3rem 0; position: relative;
  }
  @media (prefers-reduced-motion: reduce) { .barre-superposee { transition: none; } }
  .barre-superposee.part-a { background: var(--couleur-mandarine); }
  .barre-superposee.part-b { background: var(--couleur-menthe); }
  .etiquette-superposee { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); font-size: 0.8rem; font-weight: 700; white-space: nowrap; }

  /* ---------- Jeu 6 : Les comptes du goûter ---------- */

  .enonce-calcul { text-align: center; font-size: 1rem; font-weight: 600; margin: 0 0 0.7rem; }
  .apercu-calcul { display: flex; justify-content: center; margin-bottom: 0.6rem; }
  .rappel-calcul { display: flex; align-items: center; justify-content: center; gap: 0.55rem; margin: 0.5rem 0 0.2rem; flex-wrap: wrap; }
  .symbole-calcul { font-size: 1.3rem; font-weight: 700; color: var(--couleur-mandarine); }

  /* Correction affichée après une MAUVAISE réponse (CHARTE §18). */
  .bloc-correction { text-align: center; font-weight: 700; font-size: 0.98rem; margin: 0.7rem 0 0.2rem; }
  .correction-donnee { color: color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .correction-attendue { color: color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }

  /* Feedback + navigation */
  .feedback { text-align: center; font-weight: 600; font-size: 1.05rem; min-height: 1.6rem; margin: 0.8rem 0 0.2rem; }
  .feedback-succes { color: color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }
  .feedback-erreur { color: color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .bouton-suivant {
    display: block; margin: 0.6rem auto 0; min-height: 44px; border-radius: 14px; border: none;
    background: var(--couleur-mandarine); color: #ffffff; font-weight: 600; font-size: 1rem; padding: 0 1.4rem;
  }
  .bouton-principal {
    display: block; margin: 0.9rem auto 0; min-height: 44px; border-radius: 14px; border: none;
    background: var(--couleur-mandarine); color: #ffffff; font-weight: 600; font-size: 1rem; padding: 0 1.2rem;
  }
  .bouton-principal:disabled { opacity: 0.45; }
  .bouton-secondaire {
    display: block; margin: 0 auto; min-height: 44px; border-radius: 14px;
    border: 2.5px solid var(--couleur-encre); background: #ffffff; padding: 0 1.1rem; font-weight: 500;
  }

  /* Résultats */
  .bloc-resultats { text-align: center; }
