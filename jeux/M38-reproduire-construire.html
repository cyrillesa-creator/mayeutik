/* ============================================================
   GÉNÉRATEURS DE MANCHES
   ------------------------------------------------------------
   Une manche décrit ce qu’il y a À PRODUIRE, jamais comment le dessiner :
   support, modèle éventuel, amorce éventuelle, solutions acceptables,
   instruments disponibles. Tout le rendu en découle.
   ============================================================ */
function mancheBase(o){
  return Object.assign({
    mode:'poser', support:'quadrille', libre:true,
    modele:null, modeleCercles:null, amorce:null,
    solutions:[], cercles:null, instruments:[], sous:'', enonce:null
  }, o);
}

/* CE QU’UNE MANCHE MONTRE, lu sur la GÉOMÉTRIE et non sur l’intention du
   générateur : nombre de sommets et longueurs de côtés arrondies, triées.
   Deux manches de même signature montrent la même figure, où qu’elle soit
   posée sur le panneau. C’est la dimension de contenu du module (§13 bis). */
function signatureFigure(contours){
  if (!contours || !contours.length) return '-';
  return contours.map(c => c.length + ':' + c.map((p, i) => {
    const q = c[(i + 1) % c.length];
    return Math.round(Math.hypot(q[0] - p[0], q[1] - p[1]));
  }).sort((a, b) => a - b).join(',')).sort().join(' | ');
}

/* ============================================================
   LES DIMENSIONS DE CONTENU D’UNE MANCHE (CHARTE §13 bis)
   ------------------------------------------------------------
   Ici tout se ramène à UNE dimension — la figure montrée —, lue sur sa
   géométrie par `signatureFigure`. Les consignes sont fixes par mini-jeu et
   le support suit une progression écrite (quadrillé, pointé, uni) : ni l’une
   ni l’autre n’est un tirage. `ferme` marque les files dont la composition
   est imposée et dit pourquoi.
   ============================================================ */
const DIMENSIONS_CONTENU = {
  'cp-reproduire':[{nom:'figure à reproduire', de:q => signatureFigure(q.modele)}],
  'cp-completer':[{nom:'figure à compléter', de:q => signatureFigure(q.solutions[0]),
    ferme:'la COMPOSITION est imposée — trois rectangles et trois carrés, les deux cas que le programme donne mot pour mot —, mais les formats se tirent sans remise dans deux stocks, dix-sept rectangles et quatre carrés'}],
  'cp-assembler':[{nom:'assemblage à monter', de:q => signatureFigure(q.modele)}],
  'ce1-reproduire':[{nom:'figure à reproduire', de:q => signatureFigure(q.modele),
    ferme:'la file EST la progression du CE1 — 45° d’abord, puis les pentes 2/1 et 3/1, dans cet ordre et une fois chacune'}],
  'ce1-completer':[{nom:'figure à compléter', de:q => signatureFigure(q.solutions[0]),
    ferme:'la progression est écrite — fermer, puis placer le sommet, puis passer au papier uni — et ne se réordonne pas ; ce sont les FIGURES qui varient, tirées sans remise dans leurs stocks'}],
  'ce1-construire':[{nom:'figure commandée', de:q => signatureFigure(q.solutions[0]),
    ferme:'trois commandes, une par construction que le programme nomme au CE1 : rectangle et cercle, carré et cercle au milieu, triangle rectangle'}],
  'ce2-reproduire':[{nom:'figure à reproduire', de:q => signatureFigure(q.modele)}],
  'ce2-construire-uni':[{nom:'figure commandée', de:q => signatureFigure(q.solutions[0]),
    ferme:'les trois exemples de réussite du programme, mot pour mot — en inventer un quatrième sortirait du texte'}],
  'ce2-rosace':[{nom:'figure construite', de:q => signatureFigure(q.solutions && q.solutions[0]),
    ferme:'une seule manche de synthèse : il n’y a rien à faire tourner'}]
};

/* ---- La consigne de reproduction, calculée ----
   LES TROIS PALIERS DEMANDENT LA MÊME CHOSE — copier le modèle — et portent
   donc le même nom. Mais ils ne le demandent ni avec le même geste ni sur le
   même papier : au CP et au CE1 on trace au doigt, au CE2 on pointe les
   sommets ; le quadrillage devient un semis de points aux dernières manches
   de chaque partie. Écrire la consigne trois fois, ce serait la voir mentir
   dès qu’une manche change de support — et le nombre de pièces, qui décide du
   pluriel, n’est connu que de la donnée. Elle se calcule donc, comme tout ce
   que la figure sait déjà dire d’elle-même. */
/* LA CONSIGNE TIENT EN DEUX LIGNES, ET C’EST UNE CONTRAINTE DE FOND. Écrite
   au long, elle repoussait le plan sous la ligne de flottaison : l’enfant
   devait faire défiler pour voir le panneau qu’on lui demande de regarder.
   Une consigne qu’il faut quitter des yeux pour travailler ne sert plus à
   rien. Elle dit donc le geste et le repère, et rien d’autre — le détail
   appartient à l’écran, pas au texte.
   AUCUN ACCORD À CALCULER ICI, et c’est le geste qui l’a réglé : la consigne
   a porté un « les sommets de la figure / des figures » tant que le CE2
   posait ses sommets, parce qu’une de ses figures en compte deux. Le CE2
   trace désormais au doigt comme les deux autres, la consigne ne nomme plus
   d’objet à compter, et l’accord qui la guettait n’a plus lieu d’être. On
   retire donc le calcul plutôt que de le garder « au cas où » : du code qui
   ne peut plus se tromper ne protège de rien. */
const Q_REPRODUIRE = 'Copie le modèle.';
function sousReproduire(support, obliques){
  const geste = obliques
    ? 'Glisse ton doigt d’un coin à l’autre, bien droit.'
    : 'Glisse ton doigt le long des côtés, ou pointe les sommets.';
  const repere = support === 'quadrille' ? ' Aide-toi du quadrillage.'
               : support === 'pointe' ? ' Aide-toi des points.' : '';
  return geste + repere;
}

/* ---- CP : reproduire ---- */
/* TOUS LES CÔTÉS SONT TRAÇABLES AU GLISSEMENT, orthogonaux ou à 45° : c’est
   la condition pour que le geste naturel — suivre les lignes du carton d’un
   nœud au voisin — suffise à faire la figure entière. `triangleRect(4, 2)`
   en sortait : sa pente 2/1 ne relie pas deux voisins, elle ne se pose qu’en
   tapant ses deux bouts, un geste qu’un enfant de CP n’a aucune raison de
   découvrir seul. Les obliques sont d’ailleurs le saut du CE1, pas du CP —
   le texte demande ici des côtés qui suivent le quadrillage. Remplacée par un
   second triangle à 45°, la banque garde ses six figures pour cinq manches. */
const FIGURES_CP = [
  () => carre(3), () => carre(2), () => rectangle(4, 2), () => rectangle(3, 2),
  () => triangleRect(3, 3), () => triangleRect(4, 4)
];
function qCpReproduire(){
  const liste = [];
  /* La figure à reproduire se tirait par `pioche`, avec remise : 207
     répétitions immédiates pour 300 files, et jusqu’à trois fois le même
     carré dans une partie de cinq manches. Six figures pour cinq manches,
     le stock est plus grand que la file (§13 bis). */
  const figures = tirerSansRepetition('cp-figures', FIGURES_CP, 5);
  /* LES TROIS MANCHES AU POCHOIR SONT SUPPRIMÉES, et c’est une correction de
     fond, pas un allègement. Elles étaient INFAILLIBLES : la forme était
     donnée par le carton, l’orientation figée — il ne tournait pas —, et la
     position n’était pas jugée, la comparaison étant invariante par
     translation. Mesuré : une pièce déposée une maille plus bas et une maille
     plus à droite que la solution était validée. Aucun placement ne pouvait
     échouer tant que le carton restait dans le panneau, si bien que trois
     manches sur cinq ne demandaient aucune décision.
     Elles s’autorisaient d’une mention du programme — « l’élève TRACE des
     figures simples À L’AIDE DE gabarits et de pochoirs » —, mais elles en
     trahissaient le verbe : un gabarit ne dessine pas à la place de l’enfant,
     il l’empêche de déraper pendant qu’il dessine. Déposer un carton n’est pas
     tracer avec. Reste donc cinq manches où l’enfant PRODUIT la figure ; la
     progression du support, quadrillé puis pointé, est conservée. */
  for (let i = 0; i < 5; i++) {
    const f = figures[i]();
    const support = i < 3 ? 'quadrille' : 'pointe';
    liste.push(mancheBase({
      mode:'tracer', support,
      modele:poserDansZone(ZONE_MODELE, [f]),
      solutions:[poserDansZone(ZONE_TRAVAIL, [f])],
      q:Q_REPRODUIRE,
      sous:sousReproduire(support, false)
    }));
  }
  return liste;
}

/* ---- CP : compléter ---- */
/* LES FORMATS SONT UN STOCK, pas deux tirages continus. Une première version
   tirait la longueur dans {4,5} et la hauteur dans {2,3} : quatre rectangles
   possibles, et le même carré de 3 à chaque fois. Mesuré, cela donnait UNE
   SEULE SÉRIE sur 300 parties. Le stock est maintenant assez grand pour que
   deux parties ne se ressemblent pas, et il se tire sans remise (§13 bis).
   LE RECTANGLE NE DOIT JAMAIS SORTIR CARRÉ : l’inclusion carré ⊂ rectangle
   est hors programme au cycle 2, et M34 l’évite activement — un « complète ce
   rectangle » dont la solution est un carré rouvrirait la question par la
   bande. C’est la seule paire interdite. */
const FORMATS_RECTANGLE = (() => {
  const t = [];
  for (let l = 3; l <= 7; l++) for (let h = 2; h <= 5; h++) if (l !== h) t.push([l, h]);
  return t;
})();
const COTES_CARRE = [2, 3, 4, 5];

function qCpCompleter(){
  const liste = [];
  /* Les deux cas sont donnés mot pour mot par le programme. */
  tirerSansRepetition('cp-completer-rect', FORMATS_RECTANGLE, 3).forEach(([l, h]) => {
    const c0 = poserDansZone(ZONE_PLEINE, [rectangle(l, h)])[0];
    /* QUELS DEUX CÔTÉS SONT DONNÉS change d’une manche à l’autre : l’amorce
       partait toujours du même coin, si bien que l’enfant reconnaissait la
       forme du L avant même de lire. On fait tourner le point de départ du
       contour — la figure attendue est la même, le problème posé aussi, mais
       le dessin sur le panneau n’est plus le même. */
    const r = Math.floor(entre(0, 4));
    const c = c0.slice(r).concat(c0.slice(0, r));
    liste.push(mancheBase({
      mode:'tracer', libre:false, zone:'pleine',
      amorce:[[c[3], c[0], c[1]]],           // deux côtés consécutifs déjà tracés
      sommetsFixes:[c[3], c[0], c[1]],
      solutions:[[c]],
      q:'Complète ce rectangle.',
      sous:'Deux côtés sont déjà tracés : trace les deux qui manquent au doigt.'
    }));
  });
  tirerSansRepetition('cp-completer-carre', COTES_CARRE, 3).forEach(cote => {
    /* LES DEUX CARRÉS DOIVENT TENIR DANS LE PANNEAU, pas seulement celui qu’on
       a construit : l’enfant a le droit de fermer d’un côté ou de l’autre, et
       une solution qui sort du quadrillage n’est pas traçable. On place donc
       le côté donné en lui laissant `cote` mailles de part et d’autre — d’où
       le choix de l’orientation parmi celles qui le permettent. */
    const z = ZONE_PLEINE, sens = [];
    if (2 * cote <= z.ny) sens.push('h');
    if (2 * cote <= z.nx) sens.push('v');
    const horizontal = pioche(sens) === 'h';
    const gi = Math.round(entre(0, (horizontal ? z.nx - cote : z.nx - 2*cote)));
    const gj = Math.round(entre(0, (horizontal ? z.ny - 2*cote : z.ny - cote)));
    const a = horizontal ? versScene(z, gi, gj + cote) : versScene(z, gi + cote, gj);
    const b = horizontal ? versScene(z, gi + cote, gj + cote) : versScene(z, gi + cote, gj + cote);
    const dx = b[0]-a[0], dy = b[1]-a[1];
    /* Un seul côté tracé laisse DEUX carrés possibles, un de chaque côté
       du segment. Les refuser reviendrait à valider une géométrie fausse :
       les deux sont acceptés, sans commentaire — l’enfant a construit un
       carré, c’est ce qui était demandé. */
    const haut = [a, b, [b[0]-dy, b[1]+dx], [a[0]-dy, a[1]+dx]];
    const bas  = [a, b, [b[0]+dy, b[1]-dx], [a[0]+dy, a[1]-dx]];
    liste.push(mancheBase({
      mode:'tracer', libre:false, zone:'pleine',
      amorce:[[a, b]], sommetsFixes:[a, b],
      solutions:[[haut], [bas]],
      q:'Complète ce carré.',
      sous:'Un seul côté est tracé. Trace les trois autres au doigt, d’un côté ou de l’autre.'
    }));
  });
  /* ON RÉORDONNE SUR LA FIGURE, PAS SUR LA CONSIGNE, et c’est la correction
     de fond : le module DÉCLARE que la dimension de contenu de ce mini-jeu est
     la figure (`DIMENSIONS_CONTENU`), mais la file se réordonnait sur le texte
     de la consigne. Deux vérités pour un même fait — et la plus grossière
     gagnait : avec trois « rectangle » et deux « carré », une seule
     disposition évite deux consignes identiques d’affilée, d’où la série
     unique mesurée sur 300 parties. Deux rectangles de formats différents ne
     sont pas une répétition de contenu ; deux fois la même figure, si. */
  const ordonnee = sansDeuxDeSuite(melanger(liste), m => signatureFigure(m.solutions[0]));
  /* La progression du support suit la PLACE dans la file, pas l’ordre de
     fabrication : le pointé arrive à la fin, quoi qu’il ait été tiré. */
  ordonnee.forEach((m, i) => { m.support = i < 4 ? 'quadrille' : 'pointe'; });
  return ordonnee;
}

/* ---- CP : assembler ---- */
/* LA BANQUE EST AU NIVEAU DU MODULE, pas dans la fonction. Reconstruite à
   chaque appel, elle produisait des fermetures NEUVES à chaque partie : le
   tirage sans remise, qui compare par identité, ne reconnaissait plus rien —
   sa mémoire gardait celles de la partie précédente et les resservait en
   tête. Un stock doit être stable pour qu’on puisse l’épuiser. */
const MODELES_ASSEMBLAGE = [
  () => [rectangle(4,2), translater(rectangle(4,2), 0, 2)],
  () => [carre(2), translater(carre(2), 2, 0), translater(rectangle(4,2), 0, 2)],
  /* Un CARRÉ coupé en deux triangles par sa diagonale : la relation même que
     M34 faisait DÉCRIRE en `cp-relations`, et qu’on produit ici. Le rectangle
     4×3 d’une première version donnait une diagonale de pente 4/3, hors
     d’atteinte du glissement — elle n’aurait pu se poser qu’en tapant ses
     deux bouts, geste qu’un enfant de CP n’a aucune raison de découvrir
     seul. Le carré préserve la relation entière : M34 découpe déjà des
     carrés de cette façon, et « coupé par sa diagonale, ça fait deux
     triangles » ne dit rien de moins. */
  () => [[[0,0],[4,0],[4,4]], [[0,0],[4,4],[0,4]]],
  /* Un carré coiffé d’un triangle. Ses côtés de 3 et 2 donnaient une pente
     3/2, hors d’atteinte pour la même raison : le triangle est isocèle, donc
     à 45°, et le toit devient traçable d’un seul glissement. */
  () => [carre(3), [[0,3],[3,3],[0,6]]],
  () => [rectangle(3,2), translater(carre(2), 3, 0), translater(rectangle(5,2), 0, 2)],
  /* Sixième modèle : la §13 bis demande un stock STRICTEMENT plus grand que la
     file, sans quoi chaque partie rejoue le même matériel dans un autre ordre.
     Il doit être VRAIMENT nouveau — deux carrés empilés contre un rectangle
     debout, essayés d’abord, ne sont que le deuxième modèle tourné d’un quart
     de tour, et se reconnaissent comme tel. Il doit aussi rester à deux ou
     trois pièces, comme les cinq autres : une version à quatre carrés, tentée
     ensuite, sortait de ce cadre. Deux rectangles empilés coiffés d’un carré :
     une composition qu’aucun autre ne reprend. */
  () => [rectangle(4,2), translater(rectangle(4,2), 0, 2), translater(carre(2), 0, 4)]
];

function qCpAssembler(){
  /* Les pièces d’un vitrail se JOIGNENT : elles partagent un côté entier et
     ne se chevauchent jamais. Deux modèles d’une première version étaient
     fautifs — deux triangles qui se recouvraient, et un triangle accroché
     au carré par un seul point, ce qui ne fait pas un assemblage. */
  /* La banque compte six modèles, la partie en joue CINQ : c’est l’écart qui
     fait qu’une partie ne rejoue pas la précédente. */
  return tirerSansRepetition('assembler-modeles', MODELES_ASSEMBLAGE, 5).map((f, i) => {
    const contours = f();
    return mancheBase({
      mode:'tracer', support: i < 3 ? 'quadrille' : 'pointe',
      modele:poserDansZone(ZONE_MODELE, contours, 0, 0),
      solutions:[poserDansZone(ZONE_TRAVAIL, contours, 1, 1)],
      q:'Monte ce petit vitrail.',
      sous:'Trace les côtés au doigt : celui que deux pièces partagent ne se trace qu’une fois.'
    });
  });
}

/* ---- CE1 : reproduire, avec des côtés obliques ---- */
function qCe1Reproduire(){
  /* Progression lente : 45° d’abord, puis les pentes 2/1 et 3/1. C’est le
     vrai saut du CE1 et le point de décrochage du sous-thème. */
  const suite = [
    {f:() => carreOblique(1,1), s:'quadrille'},
    {f:() => carreOblique(2,2), s:'quadrille'},
    {f:() => carreOblique(2,1), s:'quadrille'},
    {f:() => rectangleOblique(2,1,2), s:'pointe'},
    {f:() => carreOblique(3,1), s:'pointe'}
  ];
  return suite.map(({f, s}) => {
    const c = [f()];
    return mancheBase({
      mode:'tracer', support:s,
      modele:poserDansZone(ZONE_MODELE, c),
      solutions:[poserDansZone(ZONE_TRAVAIL, c)],
      q:Q_REPRODUIRE,
      /* LE BIAIS EST DIT PAR LE GESTE LUI-MÊME, en une phrase au lieu de
         deux : le moteur n’écrit une oblique que si le doigt y est allé
         DROIT, et un enfant qui zigzague n’obtient rien sans que rien ne le
         lui dise. « D’un coin à l’autre, bien droit » est ce mode d’emploi,
         et il tient sur la même ligne que la consigne. */
      sous:sousReproduire(s, true)
    });
  });
}

/* ---- CE1 : compléter, jusqu’au papier uni ---- */
/* Les cathètes du triangle à fermer, et les formats du rectangle sur papier
   uni : deux stocks, parce que deux valeurs codées en dur donnaient la même
   partie à chaque fois. */
/* PAIRES NON ORDONNÉES : (3,4) et (4,3) donnent deux triangles superposables,
   donc la MÊME signature — les mettre tous deux au stock faisait sortir deux
   fois le même contenu d’affilée, ce que le §13 bis interdit et qu’un test a
   attrapé. L’orientation, elle, se tire à part : elle change ce qu’on voit
   sans changer la figure, comme la position. */
const CATHETES_CE1 = [[2,2],[2,3],[2,4],[2,5],[3,3],[3,4],[3,5],[4,4],[4,5],[5,5]];
const FORMATS_UNI_CE1 = [[5,3],[6,3],[7,3],[6,4],[7,4],[5,4],[8,3],[8,4]];
function sommetsAngleDroit(z, a, b){
  /* Tous les nœuds du quadrillage qui voient le segment sous un angle
     droit. Il y en a TOUJOURS au moins deux — les deux coins du rectangle
     dont [a b] est la diagonale — et prétendre le contraire produirait une
     correction fausse : on les accepte donc tous, exactement comme les
     deux carrés du CP. C’est le lieu du cercle de diamètre [a b], que le
     cycle 2 n’étudie pas mais dont l’équerre fait apparaître les points
     entiers un à un. */
  const cands = [];
  for (let i = 0; i <= z.nx; i++) for (let j = 0; j <= z.ny; j++) {
    const c = versScene(z, i, j);
    if (dist(c, a) < 4 || dist(c, b) < 4) continue;
    const u = [a[0]-c[0], a[1]-c[1]], v = [b[0]-c[0], b[1]-c[1]];
    if (Math.abs(u[0]*v[0] + u[1]*v[1]) < 1e-6) cands.push(c);
  }
  return cands;
}
function qCe1Completer(){
  const liste = [];
  /* Deux côtés de l’angle droit tracés : il ne reste qu’à fermer
     le grand côté. C’est le cas d’entrée, volontairement facile.
     LE MOT « HYPOTÉNUSE » NE PARAÎT NULLE PART : il n’est pas au programme du
     cycle 2, et nommer ce qu’on ne sait pas nommer ne fait pas apprendre. On
     le désigne par ce que l’enfant voit — le grand côté, celui d’en face de
     l’angle droit. */
  /* LES CATHÈTES SONT UN STOCK. Elles valaient (3,3) puis (4,3), toujours dans
     cet ordre : deux triangles, les mêmes à chaque partie. Le tracé du trait
     droit ayant ouvert toutes les pentes, plus rien n’oblige à les restreindre. */
  tirerSansRepetition('ce1-fermer', CATHETES_CE1, 2).forEach(([p, q2]) => {
    const [b, hh] = Math.random() < 0.5 ? [p, q2] : [q2, p];
    const t = poserDansZone(ZONE_PLEINE, [triangleRect(b, hh)])[0];
    liste.push(mancheBase({
      mode:'tracer', support: liste.length === 0 ? 'quadrille' : 'pointe', libre:false, zone:'pleine',
      amorce:[[t[1], t[0], t[2]]], sommetsFixes:[t[1], t[0], t[2]],
      solutions:[[t]],
      q:'Ferme ce triangle rectangle.',
      sous:'Il ne manque que le grand côté opposé à l’angle droit : pose le doigt sur un bout et va droit jusqu’à l’autre.'
    }));
  });
  /* Le grand côté est tracé : il faut PLACER le sommet de l’angle droit.
     Nettement plus dur, et l’équerre y devient utile. */
  {
    /* L’ordre de ce mini-jeu est une PROGRESSION voulue — fermer, puis placer,
       puis passer au papier uni — donc on ne réordonne pas : on écarte le
       tirage qui redirait le triangle de la manche précédente. Sans cela, la
       manche « place le sommet » retombait sur le 3-4-5 qu’on venait de
       fermer, trois fois sur cent. */
    let precedent = signatureFigure(liste[liste.length - 1].solutions[0]);
    for (let n = 0; n < 2; n++) {
    let item = null;
    for (let essai = 0; essai < 200 && !item; essai++) {
      const dx = 2 + Math.floor(entre(0, 4)), dy = 2 + Math.floor(entre(0, 3));
      const gx = Math.floor(entre(0, ZONE_PLEINE.nx - dx)), gy = Math.floor(entre(0, ZONE_PLEINE.ny - dy));
      const a = versScene(ZONE_PLEINE, gx, gy), b = versScene(ZONE_PLEINE, gx + dx, gy + dy);
      const c = sommetsAngleDroit(ZONE_PLEINE, a, b);
      /* On écarte les tirages qui en offriraient une nuée : deux ou trois
         nœuds font un exercice, huit en feraient une loterie. */
      if (c.length < 2 || c.length > 3) continue;
      if (signatureFigure([[a, b, c[0]]]) === precedent) continue;
      item = {a, b, c};
    }
    if (item) {
      liste.push(mancheBase({
        mode:'tracer', support: n === 0 ? 'quadrille' : 'pointe', libre:false, zone:'pleine',
        amorce:[[item.a, item.b]], sommetsFixes:[item.a, item.b],
        solutions:item.c.map(c => [[item.a, item.b, c]]),
        instruments:['equerre'],
        q:'Place le sommet de l’angle droit.',
        sous:'Le grand côté opposé à l’angle droit est tracé. Pose l’équerre pour trouver le nœud, puis trace les deux côtés.'
      }));
      precedent = signatureFigure([[item.a, item.b, item.c[0]]]);
    }
    }
  }
  /* Premier passage au PAPIER UNI : plus d’aimantation, l’instrument
     devient le seul moyen d’être exact. */
  tirerSansRepetition('ce1-uni', FORMATS_UNI_CE1, 2).forEach(([lu, hu]) => {
    const l = lu * PX_PAR_UNITE, h = hu * PX_PAR_UNITE;
    /* La figure ne se posait plus jamais ailleurs qu’au même endroit : sur
       papier uni il n’y a pas de nœud où l’aimanter, mais rien n’oblige à la
       clouer. On la place au hasard dans ce que le panneau laisse. */
    const x0 = ZONE_PLEINE_UNI.x0 + 16 + Math.round(entre(0, Math.max(0, ZONE_PLEINE_UNI.l - l - 32)));
    const y0 = ZONE_PLEINE_UNI.y0 + 24 + Math.round(entre(0, Math.max(0, ZONE_PLEINE_UNI.h - h - 48)));
    const c = [[x0,y0],[x0+l,y0],[x0+l,y0+h],[x0,y0+h]];
    const fixes = [c[3], c[0], c[1]];
    /* COMBIEN DE SOMMETS MANQUENT SE COMPTE, il ne s’écrit pas : c’est la
       figure et l’amorce qui le disent. « le ou les sommets manquants » évite
       la question au lieu de la résoudre — et la charte demande l’accord
       calculé sur la donnée, jamais figé. */
    const n = c.length - fixes.length;
    liste.push(mancheBase({
      support:'uni', libre:false, zone:'pleine',
      amorce:[fixes], sommetsFixes:fixes,
      solutions:[[c]],
      instruments:['regle','equerre'],
      q:'Complète la figure en plaçant ' + (n > 1 ? 'les ' + n + ' sommets manquants' : 'le sommet manquant') + '.',
      sous:'Plus de repères : aide-toi de la règle et de l’équerre, puis reviens sur le premier coin pour fermer.'
    }));
  });
  return liste;
}

/* ---- CE1 : construire d’après un énoncé ----
   L’ÉNONCÉ DIT TOUTES LES MESURES QUE LE VERDICT EXIGE. Deux de ces trois
   commandes annonçaient « un rectangle » ou « un carré » sans dire lequel,
   pendant que la validation réclamait 7 sur 4 et un côté de 5 : la figure
   attendue existait, mais nulle part dans la consigne — l’enfant ne pouvait
   la trouver qu’en devinant. Aucun réglage de tolérance ne répare cela, il
   ne fait que rendre la devinette plus facile.
   Et c’est bien `q` qui doit les porter : `enonce` n’est que le texte LU à
   voix haute, `q` le texte AFFICHÉ. Mettre la mesure dans le seul énoncé la
   réservait à qui appuie sur le haut-parleur. Le CE2 le faisait déjà ainsi. */
function qCe1Construire(){
  const z = ZONE_PLEINE_UNI;
  const cx = z.x0 + z.l/2, cy = z.y0 + z.h/2;
  const items = [
    () => {
      const l = 7*PX_PAR_UNITE, h = 4*PX_PAR_UNITE;
      const c = [[cx-l/2,cy-h/2],[cx+l/2,cy-h/2],[cx+l/2,cy+h/2],[cx-l/2,cy+h/2]];
      return mancheBase({
        support:'uni', libre:true, zone:'pleine',
        solutions:[[c]],
        /* « Sur un de ses coins » : les quatre coins étaient énumérés à la
           main, sur la figure de référence. La relation les énumère toute
           seule, sur la figure de l’enfant. */
        cercles:[{relation:'sommet'}],
        instruments:['regle','equerre'], compas:'passant',
        q:'Un rectangle de 7 sur 4, et un cercle dans un de ses coins.',
        enonce:'Construis un rectangle de 7 sur 4, puis un cercle centré sur un de ses coins.',
        sous:'Les grands côtés mesurent 7, les petits 4. Pose les quatre coins, ferme le rectangle, puis prends le compas.'
      });
    },
    () => {
      const c0 = 5*PX_PAR_UNITE;
      const c = [[cx-c0/2,cy-c0/2],[cx+c0/2,cy-c0/2],[cx+c0/2,cy+c0/2],[cx-c0/2,cy+c0/2]];
      return mancheBase({
        support:'uni', libre:true, zone:'pleine',
        solutions:[[c]],
        cercles:[{relation:'centre'}],
        instruments:['regle','equerre'], compas:'passant',
        q:'Un carré de côté 5, et un cercle en son milieu.',
        enonce:'Construis un carré de côté 5, puis un cercle centré au milieu du carré.',
        sous:'Ferme d’abord le carré. Le centre du cercle est au croisement des diagonales.'
      });
    },
    () => {
      const a = 6*PX_PAR_UNITE, b = 4*PX_PAR_UNITE;
      const s = [cx - a/2, cy + b/2];
      const c = [s, [s[0]+a, s[1]], [s[0], s[1]-b]];
      return mancheBase({
        support:'uni', libre:true, zone:'pleine',
        solutions:[[c]],
        instruments:['regle','equerre'],
        q:'Un triangle rectangle, côtés de l’angle droit 6 et 4.',
        enonce:'Construis un triangle rectangle dont les côtés de l’angle droit mesurent 6 et 4.',
        sous:'Pose l’équerre pour l’angle droit, la règle pour les longueurs, puis reviens sur le premier coin pour fermer.'
      });
    }
  ];
  return melanger(items).map(f => f());
}

/* ---- CE2 : reproduire, à main levée ou à la règle ---- */
/* Même hissage qu’au petit vitrail : un stock reconstruit à chaque partie
   n’est pas un stock. */
const FIGURES_CE2_REPRO = [
  () => [carre(3)], () => [rectangle(5,3)], () => [carreOblique(2,1)],
  () => [rectangle(3,2), translater(carre(2), 3, 0)], () => [carreOblique(2,2)],
  /* Sixième figure, même raison qu’au petit vitrail : cinq figures pour cinq
     manches, c’était la même partie à chaque fois. La pente 3/1 est déjà celle
     du CE1 — elle se réinvestit ici à main levée. */
  () => [carreOblique(3,1)]
];
/* LE CE2 REPRODUIT AU DOIGT, COMME LE CP ET LE CE1. Il était resté le seul à
   poser ses sommets un par un, si bien que le même verbe — reproduire — se
   jouait de deux façons selon le palier : l’enfant qui montait d’un niveau
   changeait de geste sans que rien ne l’annonce, et le geste qu’il venait
   d’acquérir ne lui servait plus. Le mode opératoire s’aligne donc, et la
   progression du support avec lui — quadrillé, puis pointé.
   CE QUI RESTE PROPRE AU CE2, ce sont les figures — obliques et assemblages —
   et LE CHOIX entre croquer et tracer exactement. Ce choix change de sens en
   changeant de geste, et il fallait le lui rendre : sur quadrillage, le doigt
   accroche les nœuds, donc il n’y a plus de coordonnée imprécise à tolérer.
   Ce qui distingue alors un croquis d’un tracé exact, c’est ce qu’on
   REGARDE — le croquis juge la FIGURE, et laisse passer un trait de
   construction resté en travers ; le tracé exact juge les TRAITS, et
   n’en tolère aucun en trop. « Seule la tolérance change » reste vrai, mais
   elle porte sur les bavures au lieu de porter sur les millimètres. */
function qCe2Reproduire(){
  return tirerSansRepetition('ce2-repro-figures', FIGURES_CE2_REPRO, 5).map((f, i) => {
    const c = f();
    const support = i < 3 ? 'quadrille' : 'pointe';
    return mancheBase({
      mode:'tracer', support, esquissePossible:true,
      modele:poserDansZone(ZONE_MODELE, c),
      solutions:[poserDansZone(ZONE_TRAVAIL, c)],
      q:Q_REPRODUIRE,
      /* La phrase sur les deux façons de faire reste : deux boutons attendent
         une réponse, et les retirer du texte laisserait l’enfant devant un
         choix que rien n’explique. */
      sous:sousReproduire(support, false) + ' Croquis ou exact ?'
    });
  });
}

/* ---- CE2 : construire sur papier uni, aux mesures données ---- */
function qCe2ConstruireUni(){
  const z = ZONE_PLEINE_UNI;
  const cx = z.x0 + z.l/2, cy = z.y0 + z.h/2;
  const U = PX_PAR_UNITE;
  /* Les trois exemples de réussite du programme, mot pour mot. */
  const rect = () => {
    const l = 7*U, h = 3*U;
    const c = [[cx-l/2,cy-h/2],[cx+l/2,cy-h/2],[cx+l/2,cy+h/2],[cx-l/2,cy+h/2]];
    return mancheBase({
      support:'uni', libre:true, zone:'pleine', solutions:[[c]],
      instruments:['regle','equerre'],
      q:'Un rectangle : longueur 7, largeur 3.',
      enonce:'Construis un rectangle de longueur 7 et de largeur 3.',
      /* Le vocabulaire longueur / largeur, introduit dans M34, se
         réinvestit ici : intervertir les deux produit une figure fausse. */
      sous:'La longueur est le grand côté, la largeur le petit. Pose les quatre coins, puis reviens sur le premier pour fermer.'
    });
  };
  const carreCercle = () => {
    const c0 = 6*U;
    const c = [[cx-c0/2,cy-c0/2],[cx+c0/2,cy-c0/2],[cx+c0/2,cy+c0/2],[cx-c0/2,cy+c0/2]];
    return mancheBase({
      support:'uni', libre:true, zone:'pleine', solutions:[[c]],
      /* Le rayon, lui, EST dicté par l’énoncé du CE2 : il reste jugé.
         Seul le rattachement se calcule sur la figure produite. */
      cercles:[{relation:'sommet', r:4*U}],
      instruments:['regle','equerre'], compas:'rayon', rayonDemande:4,
      q:'Un carré de côté 6, un cercle de rayon 4 sur un sommet.',
      enonce:'Construis un carré de côté 6, puis un cercle de rayon 4 centré sur un de ses sommets.',
      sous:'Ferme d’abord le carré, puis règle l’écartement du compas sur 4.'
    });
  };
  const triRect = () => {
    const a = 10*U, b = 4*U;
    const s = [cx - a/2, cy + b/2];
    const c = [s, [s[0]+a, s[1]], [s[0], s[1]-b]];
    return mancheBase({
      support:'uni', libre:true, zone:'pleine', solutions:[[c]],
      instruments:['regle','equerre'],
      q:'Un triangle rectangle, côtés de l’angle droit 10 et 4.',
      enonce:'Construis un triangle rectangle dont les côtés de l’angle droit mesurent 10 et 4.',
      sous:'L’équerre donne l’angle droit, la règle les longueurs. Reviens sur le premier coin pour fermer.'
    });
  };
  return [rect(), carreCercle(), triRect()];
}

/* ---- CE2 : la rosace ----
   Géométrie RECOPIÉE de M34 (`construireRosace`) : la charte impose des
   fichiers autonomes, donc duplication assumée — toute retouche là-bas est
   à reporter ici. L’enfant construit ce qu’il a appris à nommer en M34 et
   à vérifier en M35, en trois étapes cumulatives.
   ============================================================ */
function geometrieRosace(){
  const R = 108, cx = ZONE_PLEINE_UNI.x0 + ZONE_PLEINE_UNI.l/2, cy = ZONE_PLEINE_UNI.y0 + ZONE_PLEINE_UNI.h/2, n = 6;
  const hex = [], pointes = [];
  for (let i = 0; i < n; i++) {
    const th = -Math.PI/2 + i * TAU / n;
    hex.push([cx + Math.cos(th) * R * 0.42, cy + Math.sin(th) * R * 0.42]);
  }
  for (let i = 0; i < n; i++) {
    const th = -Math.PI/2 + (i + 0.5) * TAU / n;
    pointes.push([cx + Math.cos(th) * R * 0.93, cy + Math.sin(th) * R * 0.93]);
  }
  /* Le pétale de M34 : le sommet de l’hexagone, un point de gonfle, la
     pointe, le sommet suivant. La gonfle se DÉDUIT — l’enfant ne pose que
     la pointe. */
  const petale = (i) => {
    const a = hex[i], b = hex[(i+1) % n], loin = pointes[i];
    return [a, [(a[0]+loin[0])/2 - (b[1]-a[1])*0.16, (a[1]+loin[1])/2 + (b[0]-a[0])*0.16], loin, b];
  };
  return {R, cx, cy, hex, pointes, petale};
}
/* ============================================================
   CE2 — LA ROSACE, construite au compas
   ============================================================
   MANCHE DE SYNTHÈSE. L’enfant construit ce qu’il a appris à nommer en M34 et
   à vérifier en M35. Le fait mathématique qu’elle doit faire DÉCOUVRIR : à
   écartement constant, le rayon se reporte EXACTEMENT SIX FOIS sur le cercle.
   Ni cinq, ni sept.

   Il ne l’apprend pas par une consigne — c’est pour cela que le nombre six
   n’est écrit nulle part, ni dans l’énoncé, ni dans l’item. La version
   précédente demandait de poser six points sur un cercle avec
   `nbPointsAttendu: 6` : le six était DONNÉ, et il n’y avait plus rien à
   découvrir. Ici l’enfant enchaîne les arcs et constate que le sixième
   retombe sur son point de départ.

   TROIS CONSÉQUENCES DE CONCEPTION, qui découlent toutes de ce fait :

     • LE VERROUILLAGE EST NON NÉGOCIABLE. Si l’écartement peut changer entre
       deux arcs, la figure ne se referme pas et la propriété disparaît. Il se
       verrouille donc tout seul dès le premier cercle tracé.

     • L’AIMANTATION NE DOIT JAMAIS FABRIQUER LA FERMETURE. Elle accroche les
       intersections DÉJÀ CONSTRUITES, à une fraction du rayon et non à un
       nombre de pixels — sinon sa force dépendrait de l’échelle. Trop
       généreuse, elle refermerait la rosace à la place de l’enfant et
       détruirait le fait à découvrir.

     • LE PREMIER RAYON EST LIBRE MAIS BORNÉ. La rosace entière tient dans un
       disque de rayon 2r : au-delà, les pétales sortiraient du panneau. On
       borne donc l’ouverture plutôt que de recadrer après coup, pour que ce
       que l’enfant trace soit ce qu’il voit.
   ============================================================ */
const ROSACE_TOL = 0.11;          // fraction du rayon : aimant et jugement

function centreDuPanneau(){
  return [ZONE_PLEINE_UNI.x0 + ZONE_PLEINE_UNI.l / 2, ZONE_PLEINE_UNI.y0 + ZONE_PLEINE_UNI.h / 2];
}
/* Rayon maximal pour que la rosace entière — un disque de rayon 2r — tienne
   dans le panneau, marge comprise. */
function rayonMaxRosace(){
  return Math.floor((Math.min(ZONE_PLEINE_UNI.l, ZONE_PLEINE_UNI.h) / 2 - 12) / 2);
}
/* Les intersections de deux cercles de MÊME rayon r, centrés en a et b. Elles
   n’existent que si les centres sont à moins de 2r l’un de l’autre. */
function intersections(a, b, r){
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
  if (d < 1e-6 || d > 2 * r) return [];
  const h = Math.sqrt(Math.max(0, r * r - (d / 2) * (d / 2)));
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  return [[mx - dy / d * h, my + dx / d * h], [mx + dy / d * h, my - dx / d * h]];
}

function qCe2Rosace(){
  return [mancheBase({
    mode:'rosace', support:'uni', zone:'pleine', libre:false, solutions:[],
    q:'Construis la rosace au compas.',
    enonce:'Trace un premier cercle, puis reporte le même écartement tout autour.',
    sous:'Plante la pointe sur le point marqué et ouvre le compas.'
  })];
}

function rendreRosace(q){
  fondScene(q);
  const svg = scene();
  chantier = nouveauChantier(q);
  const O = centreDuPanneau();
  const rMax = rayonMaxRosace();
  q._O = O;
  q._centres = [];          // les centres des pétales, dans l’ordre où ils viennent
  q._r = 0;

  svg.insertAdjacentHTML('beforeend',
    `<circle class="sommet fixe" cx="${O[0]}" cy="${O[1]}" r="5"/>`);

  const gFig = document.createElementNS(NS, 'g');
  gFig.setAttribute('id', 'figureRosace');
  svg.appendChild(gFig);

  const barre = $('barreOutils');
  barre.hidden = false; barre.innerHTML = '';
  const btnFini = document.createElement('button');
  btnFini.type = 'button'; btnFini.className = 'outil';
  btnFini.textContent = '✓ j’ai fini';
  btnFini.hidden = true;
  btnFini.addEventListener('click', () => juger(false));
  barre.appendChild(btnFini);

  /* Les points sur lesquels la pointe peut retomber EXACTEMENT : le départ,
     et les intersections des cercles déjà tracés avec le cercle de base. */
  function ancres(){
    const pts = q._centres.slice();
    for (let i = 0; i < q._centres.length; i++)
      intersections(O, q._centres[i], q._r).forEach(p => pts.push(p));
    return pts;
  }

  function juger(ferme){
    if (verrouille) return;
    verrouille = true;
    compasRosace.figer();
    btnFini.hidden = true;
    if (ferme && !hexagoneRegulier(q._centres.slice(0, 6), O, q._r)) ferme = false;
    if (ferme) {
      /* LE MOMENT DE VÉRITÉ : le sixième arc est retombé sur le départ. Les
         six centres sont alors les sommets d’un hexagone régulier — celui-là
         même que M34 fait nommer sur cette rosace. On le montre, et on le
         NOMME : le mot cesse d’être une étiquette, l’enfant voit d’où il
         vient. */
      const hex = q._centres.slice(0, 6);
      gFig.innerHTML = petalesSvg(hex, O, q._r) + `<polygon class="hexagone-final" points="${
        hex.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
      chantier.contours = [hex];
      chantier.cerclesPoses = [{c:O, r:q._r}].concat(q._centres.map(c => ({c, r:q._r})));
      /* L’instrument se retire de la figure achevée : il a fait son travail,
         et ses branches barraient la rosace. */
      compasRosace.detruire();
      terminerManche(true, null);
      $('feedback').textContent = 'Six fois exactement ! Tes six centres forment un hexagone.';
      return;
    }
    /* §18 : on montre ce qu’il fallait voir, sans jamais colorer en rouge la
       bonne réponse. L’enfant a pu aller au bout de sa figure. */
    const r = q._r || rMax * 0.6;
    const juste = Array.from({length:6}, (_, i) => {
      const th = (q._centres.length ? Math.atan2(q._centres[0][1]-O[1], q._centres[0][0]-O[0]) : -Math.PI/2)
        + i * TAU / 6;
      return [O[0] + Math.cos(th) * r, O[1] + Math.sin(th) * r];
    });
    setTimeout(() => {
      if (!svg.isConnected) return;
      compasRosace.detruire();
      gFig.innerHTML = juste.map(c => cercleSvg(c, r, 'attendu')).join('')
        + `<polygon class="hexagone-final" points="${juste.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
    }, DELAI_REVELATION);
    terminerManche(false,
      'Le même écartement se reporte SIX fois autour du cercle : regarde.');
  }

  const compasRosace = MoteurCompas.creerCompas(svg, {
    zone:{x0:ZONE_PLEINE_UNI.x0 - 6, y0:ZONE_PLEINE_UNI.y0 - 6,
          x1:ZONE_PLEINE_UNI.x0 + ZONE_PLEINE_UNI.l + 6, y1:ZONE_PLEINE_UNI.y0 + ZONE_PLEINE_UNI.h + 6},
    /* Premier temps : la pointe ne peut se planter QUE sur le point marqué —
       une rosace a un centre, et le chercher n’est pas la tâche. */
    aimants:[O], pointeLibre:false, etiquette:false,
    surPointe: () => sonClic(),
    surTrace: (e) => {
      if (verrouille) return;
      if (!compasRosace.estVerrouille()) {
        /* Le premier cercle donne l’écartement, et le fige : sans cela la
           figure ne pourrait pas se refermer. */
        q._r = e.r;
        compasRosace.verrouiller();
        compasRosace.configurer({aimants:[], guide:{c:O, r:q._r}, pointeLibre:false});
        $('sousConsigne').textContent =
          'L’écartement est gardé. Replante la pointe sur le cercle et retrace.';
        return;
      }
      const c = e.centre.slice();
      /* Fermeture : la pointe est retombée sur le tout premier pétale. */
      const tol = ROSACE_TOL * q._r;
      if (q._centres.length >= 6 && dist(c, q._centres[0]) <= tol) { juger(true); return; }
      q._centres.push(c);
      compasRosace.configurer({aimants:ancres()});
      btnFini.hidden = q._centres.length < 2;
      $('sousConsigne').textContent = q._centres.length === 1
        ? 'Encore. La pointe s’accroche aux croisements que tu viens de créer.'
        : 'Continue tout autour.';
      if (q._centres.length >= 6 && dist(q._centres[q._centres.length-1], q._centres[0]) > tol) {
        /* Six pétales posés sans retomber sur le départ : la figure ne se
           refermera pas. On laisse ALLER JUSQU’AU BOUT — c’est en constatant
           que l’enfant apprend — mais on ne l’enferme pas non plus. */
        if (q._centres.length >= 8) juger(false);
      }
    }
  });
  /* Le premier cercle est libre, mais borné : au-delà, les pétales
     sortiraient du panneau. */
  compasRosace.configurer({rayonMax:rMax});
}

/* Les six pétales de M34, déduits des centres construits : l’intersection de
   deux cercles voisins donne la pointe, et le cercle de base la base. */
/* SIX CENTRES NE FONT PAS UNE ROSACE. Retomber sur le point de départ ne
   prouve rien en soi : la pointe peut se poser n’importe où sur le cercle de
   base — c’est ce que `guide` autorise —, si bien qu’un enfant qui place six
   points au hasard puis revient au départ déclencherait la fermeture sans
   avoir rien construit. On RELIT donc la figure : les six centres sont-ils
   à égale distance du centre, et régulièrement espacés de soixante degrés ?
   La réponse se calcule sur les points posés, elle ne se déduit pas du
   nombre de clics. */
function hexagoneRegulier(centres, O, r){
  if (centres.length !== 6) return false;
  const tol = ROSACE_TOL * r;
  if (centres.some(c => Math.abs(dist(c, O) - r) > tol)) return false;
  const angles = centres.map(c => Math.atan2(c[1] - O[1], c[0] - O[0]))
    .map(a => (a + TAU) % TAU).sort((x, y) => x - y);
  const ecartTol = ROSACE_TOL * TAU / 6;   // même tolérance, exprimée en angle
  for (let i = 0; i < 6; i++) {
    const d = (angles[(i + 1) % 6] - angles[i] + TAU) % TAU;
    if (Math.abs(d - TAU / 6) > ecartTol) return false;
  }
  return true;
}

/* Les cercles tracés sont ceux du COMPAS : on n’ajoute que les pétales, sans
   les redoubler d’un second jeu de cercles. */
function petalesSvg(centres, O, r){
  let s = '';
  for (let i = 0; i < centres.length; i++) {
    const a = centres[i], b = centres[(i + 1) % centres.length];
    const pts = intersections(a, b, r);
    if (pts.length < 2) continue;
    const loin = dist(pts[0], O) > dist(pts[1], O) ? pts[0] : pts[1];
    s += `<path class="petale" d="M ${a[0].toFixed(1)} ${a[1].toFixed(1)}`
      + ` A ${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${loin[0].toFixed(1)} ${loin[1].toFixed(1)}`
      + ` A ${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)} Z"/>`;
  }
  return s;
}

/* ============================================================
   LE CHANTIER — poser des points, pas dessiner
   ============================================================ */
const scene = () => $('scene');
let chantier = null;

function nouveauChantier(q){
  const z = zoneDe(q);
  const sup = SUPPORTS[q.support];
  return {
    q, z, sup,
    sommets: (q.sommetsFixes || []).slice(),
    nbFixes: (q.sommetsFixes || []).length,
    contours: [],            // contours fermés par l’enfant
    cerclesPoses: [],
    posables: [],
    tol: q.support === 'uni' ? tolerancePapierUni(q) : TOL_GRILLE
  };
}
/* La tolérance sur papier uni se calcule sur la longueur de référence de
   la figure attendue — 6 % d’un grand rectangle n’est pas 6 % d’un petit —
   puis se plafonne, parce qu’au-delà de la demi-unité elle confondrait deux
   mesures entières voisines (cf. TOL_UNI). */
function tolerancePapierUni(q, taux){
  return Math.min((taux || TOL_UNI) * longueurReference(q), PLAFOND_TOL_UNI);
}
function longueurReference(q){
  const pts = (q.solutions[0] ? tousLesPoints(q.solutions[0]) : []);
  if (!pts.length) return 40;
  const b = bbox(pts);
  return Math.max(b.x1 - b.x0, b.y1 - b.y0);
}

function ancresCourantes(){
  return chantier.posables.reduce((s, p) => s.concat(p.ancres()), []);
}
/* Sur le cercle de construction de la rosace, un point ne peut que
   glisser : c’est son écartement angulaire qui est en jeu, pas sa
   distance au centre. */
function surGuide(p, g){
  const th = Math.atan2(p[1]-g.c[1], p[0]-g.c[0]);
  return [g.c[0] + Math.cos(th)*g.r, g.c[1] + Math.sin(th)*g.r];
}

function poserSommet(p){
  if (verrouille) return;
  const q = chantier.q;
  let pt;
  if (q.guideCercle) pt = surGuide(p, q.guideCercle);
  else pt = aimanterPoint(p, chantier.sup, chantier.z, ancresCourantes());
  if (!pt) return;
  const s = chantier.sommets;
  /* Revenir sur le PREMIER sommet ferme le contour ; revenir sur le
     DERNIER le retire. Le retour arrière avant validation est
     indispensable au doigt, et n’a rien à voir avec l’essai-erreur
     interdit après validation (CHARTE §18). */
  if (s.length >= 3 && dist(pt, s[0]) < 12) { fermerContour(); return; }
  if (s.length > chantier.nbFixes && dist(pt, s[s.length-1]) < 12) {
    s.pop(); sonClic(); dessinerChantier(); majBoutons(); return;
  }
  if (s.some(x => dist(pt, x) < 6)) return;
  s.push(pt); sonClic();
  /* Sur la rosace, on pose un NOMBRE CONNU de points sur un cercle de
     construction : il n’y a pas de contour à refermer à la main, et
     demander de revenir sur le premier point n’aurait aucun sens. */
  if (q.nbPointsAttendu && s.length === q.nbPointsAttendu) { fermerContour(); return; }
  dessinerChantier(); majBoutons();
}
function fermerContour(){
  if (verrouille) return;
  const s = chantier.sommets;
  if (s.length < 3) return;
  chantier.contours.push(s.slice());
  chantier.sommets = [];
  chantier.nbFixes = 0;
  sonClic();
  dessinerChantier(); majBoutons();
}
function annuler(){
  if (verrouille) return;
  const c = chantier;
  if (c.sommets.length > c.nbFixes) c.sommets.pop();
  else if (c.cerclesPoses.length) c.cerclesPoses.pop();
  else if (c.contours.length) {
    /* On rouvre le dernier contour plutôt que de l’effacer : l’enfant
       reprend son travail là où il l’a laissé. */
    c.sommets = c.contours.pop();
    c.nbFixes = 0;
  }
  dessinerChantier(); majBoutons();
}

/* ---------- Dessin ---------- */
function contourD(pts, ferme){
  return 'M ' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ') + (ferme ? ' Z' : '');
}
const cercleSvg = (c, r, cl) => `<circle class="${cl}" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${r.toFixed(1)}"/>`;

function dessinerChantier(){
  const g = scene().getElementById('chantier');
  if (!g) return;
  const c = chantier, q = c.q;
  let s = '';
  /* Les pièces achevées se remplissent de verre : la couleur est la
     récompense de ce que l’enfant a produit lui-même. */
  if (!q.petalesDe) c.contours.forEach((ct, i) => {
    s += `<path class="piece-faite" d="${contourD(ct, true)}" fill="${verreDe(pos + i)}" fill-opacity=".55"/>`;
  });
  /* Les pétales de la rosace se déduisent des pointes posées : l’enfant
     place la pointe, la gonfle du pétale suit (géométrie de M34). On lit
     les pointes dans le chantier EN COURS ou dans le contour fermé — sans
     quoi les pétales s’évanouiraient à la seconde où la pièce se ferme,
     remplacés par le polygone brut des six pointes. */
  if (q.petalesDe) {
    const g6 = q.petalesDe;
    const pointes = c.sommets.length ? c.sommets : (c.contours[0] || []);
    pointes.forEach((p, i) => {
      const a = g6.hex[i % 6], b = g6.hex[(i+1) % 6];
      const pet = [a, [(a[0]+p[0])/2 - (b[1]-a[1])*0.16, (a[1]+p[1])/2 + (b[0]-a[0])*0.16], p, b];
      s += `<path class="piece-faite" d="${contourD(pet, true)}" fill="${verreDe(pos + i)}" fill-opacity=".55"/>`;
    });
  }
  c.cerclesPoses.forEach(ce => { s += cercleSvg(ce.c, ce.r, 'cercle-fait'); });
  /* La ligne de l’enfant part du DERNIER point de l’amorce : repasser en
     orange par-dessus les côtés déjà tracés les ferait passer pour son
     travail, alors qu’ils lui sont donnés. */
  const debut = Math.max(0, c.nbFixes - 1);
  if (c.sommets.length - debut > 1 && !q.petalesDe)
    s += `<path class="segment" d="${contourD(c.sommets.slice(debut), false)}"/>`;
  c.sommets.forEach((p, i) => {
    /* Le sommet qui FERME la pièce est signalé même s’il vient de
       l’amorce : c’est la cible du dernier geste, l’enfant doit la voir. */
    const ferme = i === 0 && c.sommets.length >= 3;
    const cl = ferme ? 'sommet premier' : (i < c.nbFixes ? 'sommet fixe' : 'sommet');
    s += `<circle class="${cl}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${ferme ? 8 : 6}"/>`;
    /* LE REPÈRE DE FERMETURE SE NOMME. Un rond blanc cerclé d’orange ne dit
       rien de lui-même — signalé au test : « que représente-t-il ? ». Or c’est
       de lui que dépend le bouton « Vérifier », qui ne s’allume qu’une fois la
       pièce fermée : ne pas le comprendre, c’est croire qu’on a fini alors que
       la figure est encore ouverte. Il ne paraît qu’au moment où fermer est
       possible, donc l’étiquette n’encombre jamais le début du tracé. */
    if (ferme) s += `<text class="etiquette-fermer" x="${p[0].toFixed(1)}" y="${(p[1] - 14).toFixed(1)}">ferme ici</text>`;
  });
  g.innerHTML = s;
}

function majBoutons(){
  const c = chantier, q = c.q;
  const b = $('btnValider');
  const assez = q.cercles
    ? (c.contours.length >= (q.solutions.length ? 1 : 0) && c.cerclesPoses.length >= 1)
    : c.contours.length >= 1;
  b.disabled = !assez;
  const ann = document.querySelector('#barreOutils .outil-annuler');
  /* En tracé, on peut défaire dès le premier TRAIT — attendre qu’une pièce
     soit fermée laisserait l’enfant sans recours devant un trait de travers. */
  if (ann) ann.disabled = c.trace ? c.trace.traces.size === 0
    : !(c.sommets.length > c.nbFixes || c.contours.length || c.cerclesPoses.length);
}

/* ============================================================
   RENDU D’UNE MANCHE
   ============================================================ */
function manche(){
  desarmerAutoSuivant(); stopperVoix();
  const q = file[pos];
  verrouille = false;
  $('feedback').textContent = ''; $('feedback').className = '';
  $('btnNext').style.display = 'none';
  $('btnValider').style.display = 'none';
  $('barreOutils').hidden = true; $('barreOutils').innerHTML = '';
  $('sousConsigne').textContent = q.sous || '';
  majDots();
  majVitrail();
  poserConsigne(q.q, q.enonce);
  if (q.mode === 'rosace') rendreRosace(q);
  else if (q.mode === 'tracer') rendreTracer(q);
  else rendrePoser(q);
}

function fondScene(q){
  /* Un nouvel écran ne fait rien d’un tap tant qu’il n’a pas dit ce qu’il en
     fait : sans cette remise à zéro, un mini-jeu ouvert depuis le menu
     hériterait du geste du précédent, et un tap sur la rosace poserait des
     sommets. Le moteur de tracé, lui, RETIRE ses écouteurs — il en a les
     moyens, `detacher` existe — au lieu de compter sur un drapeau. */
  surTapScene = null;
  if (chantier && chantier.trace) { chantier.trace.detacher(); chantier.trace = null; }
  const avecModele = !!q.modele;
  const zt = zoneDe(q);
  const sup = SUPPORTS[q.support];
  const H = hauteurPlan(zt);
  let s = '';
  if (avecModele) {
    s += sup.fond(ZONE_MODELE);
    s += `<text class="etiquette-zone" x="${ZONE_MODELE.x0}" y="${ZONE_MODELE.y0 - 4}">le modèle</text>`;
    (q.modele || []).forEach(ct => { s += `<path class="modele" d="${contourD(ct, true)}"/>`; });
    (q.modeleCercles || []).forEach(ce => { s += cercleSvg(ce.c, ce.r, 'modele-cercle'); });
    s += `<line class="maille" x1="10" y1="${(ZONE_MODELE.y1 + zt.y0)/2}" x2="390" y2="${(ZONE_MODELE.y1 + zt.y0)/2}" stroke-dasharray="4 6"/>`;
  }
  /* En mode TRACÉ, le papier de travail et l’amorce appartiennent au moteur :
     il les redessine à chaque trait, et les dessiner ici en double ferait
     deux vérités pour une seule grille. */
  if (q.mode !== 'tracer') s += sup.fond(zt);
  s += `<text class="etiquette-zone" x="${zt.x0}" y="${zt.y0 - 4}">ton panneau</text>`;
  /* Le décor : ce que les étapes précédentes ont déjà construit (rosace). */
  if (q.decor) {
    (q.decor.cercles || []).forEach(ce => { s += cercleSvg(ce.c, ce.r, 'modele-cercle'); });
    (q.decor.contours || []).forEach(ct => { s += `<path class="modele" d="${contourD(ct, true)}"/>`; });
  }
  if (q.guideCercle) s += cercleSvg(q.guideCercle.c, q.guideCercle.r, 'attendu');
  if (q.centreImpose) s += `<circle class="sommet fixe" cx="${q.centreImpose[0]}" cy="${q.centreImpose[1]}" r="5"/>`;
  if (q.mode !== 'tracer') (q.amorce || []).forEach(ct => { s += `<path class="amorce" d="${contourD(ct, false)}"/>`; });
  scene().setAttribute('viewBox', '0 0 400 ' + H);
  /* L’ordre de dessin est un ordre de LECTURE : le papier, puis
     l’instrument posé dessus, puis ses graduations, puis le travail de
     l’enfant par-dessus tout. Les posables étant ajoutés au fil des clics,
     leur groupe doit être réservé ICI — ajoutés à la fin du SVG, ils
     recouvriraient les ancres qu’ils publient.
     LE TRACÉ, LUI, PASSE DESSOUS, et c’est une exception qui se justifie : sa
     surface de capture couvre toute la vue, si bien qu’au-dessus elle volerait
     ses appuis à l’équerre. Une équerre posée sur une feuille cache d’ailleurs
     ce qu’elle recouvre — et l’enfant peut la déplacer pour voir. */
  /* LA CIBLE DE POSE PASSE EN PREMIER, donc TOUT EN DESSOUS. Ajoutée en
     dernier, elle était au-dessus de tout et avalait chaque appui : les
     INSTRUMENTS N’ONT JAMAIS PU ÊTRE DÉPLACÉS, alors qu’ils sont le seul
     moyen d’être exact sur papier uni. Le défaut est antérieur à la reprise du
     moteur, vérifié sur la version d’avant. Elle n’a besoin d’être qu’au
     fond : son rôle est de rendre saisissables les points VIDES du panneau —
     sous un point vide d’un `<svg>`, la cible désignée dépend du moteur de
     rendu —, et un point vide n’a par définition rien au-dessus de lui. */
  scene().innerHTML =
    `<rect id="zonePose" x="${zt.x0 - 10}" y="${zt.y0 - 10}" width="${zt.l + 20}" height="${zt.h + 20}" class="cible-pose"/>`
    + s
    + `<g id="tracage"></g><g id="instruments"></g><g id="ancres"></g><g id="chantier"></g><g id="correction"></g>`;
  $('plan').hidden = false;
  return zt;
}

/* La pose se distingue du DÉFILEMENT par un seuil de déplacement, jamais
   par une temporisation : un tap qui glisse de trois pixels doit rester un
   tap, et un défilement volontaire ne doit rien poser.

   UN SEUL JEU D’ÉCOUTEURS, POUR TOUJOURS. `#scene` est un élément PERMANENT :
   `fondScene` ne remplace que son contenu. Chaque manche rebranchait donc ses
   écouteurs sur le même élément, sans jamais retirer les précédents, et le
   compte montait d’une manche à l’autre. Un seul tap appelait alors
   `poserSommet` autant de fois qu’il y avait de manches jouées — et comme
   revenir sur le dernier sommet le RETIRE, le deuxième appel défaisait le
   premier : à la deuxième manche, plus rien ne se posait, l’enfant restait
   bloqué devant un panneau qui ne répondait plus et le bouton « Vérifier »
   ne s’activait jamais. C’est le défaut derrière « les jeux ne fonctionnent
   pas ou pas bien », et il ne se voyait dans aucun test parce que tous
   n’éprouvaient QUE LA PREMIÈRE MANCHE.
   Ce que fait un tap est donc une VARIABLE qu’on remplace, jamais un écouteur
   qu’on ajoute : le geste est branché une fois pour toutes, et chaque écran
   dit ce qu’il en fait. Un écran qui ne pose rien — la rosace — le remet à
   `null` en dessinant son fond, plutôt que d’hériter du précédent. */
let surTapScene = null;
function brancherPose(svg, surTap){
  surTapScene = surTap;
  if (svg.__poseBranchee) return;
  svg.__poseBranchee = true;
  let bas = null;
  svg.addEventListener('pointerdown', (e) => {
    if (verrouille) return;
    bas = {x:e.clientX, y:e.clientY, bouge:false};
  });
  svg.addEventListener('pointermove', (e) => {
    if (!bas) return;
    if (Math.hypot(e.clientX - bas.x, e.clientY - bas.y) > SEUIL_GLISSEMENT) bas.bouge = true;
  });
  svg.addEventListener('pointerup', (e) => {
    const b = bas; bas = null;
    if (!b || b.bouge || verrouille || !surTapScene) return;
    const p = versSVG(svg, e.clientX, e.clientY);
    surTapScene([p.x, p.y]);
  });
  svg.addEventListener('pointercancel', () => { bas = null; });
}

function dessinerAncres(){
  const g = scene().getElementById('ancres');
  if (!g) return;
  g.innerHTML = ancresCourantes().map(a =>
    `<circle class="ancre" cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="3.4"/>`).join('');
}

function rendrePoser(q){
  fondScene(q);
  const svg = scene();
  chantier = nouveauChantier(q);
  dessinerChantier();

  const barre = $('barreOutils');
  const outils = [];
  (q.instruments || []).forEach(nom => outils.push(nom));
  if (q.compas) outils.push('compas');
  if (q.esquissePossible) outils.push('mode');
  outils.push('annuler');
  barre.hidden = false;
  barre.innerHTML = '';

  brancherInstruments(q, barre, svg);
  if (q.compas) brancherCompas(q, barre, svg);
  {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'outil outil-annuler'; b.textContent = '↶ annuler';
    b.addEventListener('click', () => { if (!verrouille) { annuler(); sonClic(); } });
    barre.appendChild(b);
  }

  brancherPose(svg, (p) => {
    if (chantier.enAttenteCentre) { poserCercle(p); return; }
    poserSommet(p);
  });

  $('btnValider').style.display = 'block';
  $('btnValider').textContent = 'Vérifier ✓';
  $('btnValider').onclick = () => validerManche(q);
  majBoutons();
}

/* LES POINTS SUR LESQUELS UN INSTRUMENT S’AIMANTE : ce qui est DONNÉ et ce
   que l’enfant a DÉJÀ PRODUIT, jamais la solution — aimanter l’équerre sur la
   réponse la donnerait. Lus sur l’état du chantier, quel que soit le geste :
   les sommets posés, les points de l’amorce, et les bouts des traits en mode
   tracé. */
function pointsRemarquables(){
  const c = chantier;
  if (!c) return [];
  const pts = [];
  (c.q.amorce || []).forEach(ligne => ligne.forEach(p => pts.push(p)));
  (c.sommets || []).forEach(p => pts.push(p));
  (c.contours || []).forEach(ct => ct.forEach(p => pts.push(p)));
  if (c.trace) [...c.trace.pre, ...c.trace.traces].forEach(k =>
    boutsSeg(k).forEach(g => pts.push(c.trace.versScene(g))));
  const vus = new Set(), sortie = [];
  pts.forEach(p => {
    const cle = p[0].toFixed(1) + ',' + p[1].toFixed(1);
    if (vus.has(cle)) return;
    vus.add(cle); sortie.push(p);
  });
  return sortie;
}

/* Les instruments sont les MÊMES qu’on pose des sommets ou qu’on trace : ce
   sont des objets qu’on promène sur le papier, et leur bouton ne dépend pas
   de ce que l’enfant produit. Un seul endroit pour les deux rendus. */
function brancherInstruments(q, barre, svg){
  (q.instruments || []).forEach(nom => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'outil';
    b.textContent = nom === 'regle' ? '📏 règle graduée' : '📐 équerre';
    b.addEventListener('click', () => {
      if (verrouille || b.disabled) return;
      b.disabled = true; b.classList.add('on');
      const zt = chantier.z;
      const skin = nom === 'regle' ? REGLE_GRADUEE(12) : EQUERRE_GRADUEE(7);
      const p = creerPosable(svg.getElementById('instruments'), Object.assign(skin,
        {x: nom === 'regle' ? zt.x0 + zt.l/2 : zt.x0 + 24,
         y: zt.y1 - skin.encombrement, angle: 0,
         aimants: pointsRemarquables,
         surChangement: () => dessinerAncres()}));
      chantier.posables.push(p);
      dessinerAncres(); sonClic();
    });
    barre.appendChild(b);
  });
}

/* ---------- Le compas ----------
   Deux gestes distincts, exactement ceux de M35 : au CE1 le cercle de
   centre donné PASSANT PAR un point donné (l’écartement est dérivé des
   deux appuis, pas réglé) ; au CE2 le rayon se règle d’abord. */
function brancherCompas(q, barre, svg){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'outil outil-compas'; b.textContent = '🧭 compas';
  b.addEventListener('click', () => {
    if (verrouille) return;
    chantier.enAttenteCentre = true;
    chantier.centreProvisoire = null;
    b.classList.add('on');
    $('sousConsigne').textContent = q.compas === 'rayon'
      ? 'Touche le centre du cercle : l’écartement est réglé sur ' + q.rayonDemande + '.'
      : 'Touche le centre, puis un point par lequel le cercle doit passer.';
    sonClic();
  });
  barre.appendChild(b);
  if (q.compas === 'rayon') {
    /* Le réglage de l’écartement passe par des boutons larges au doigt ;
       l’échelle, elle, reste à 14 px par unité — celle de M35 et de M23. */
    const rang = document.createElement('div');
    q._ecartement = null;
    for (let u = 2; u <= 9; u++) {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'outil outil-ecart'; x.textContent = String(u);
      x.addEventListener('click', () => {
        if (verrouille) return;
        q._ecartement = u;
        barre.querySelectorAll('.outil-ecart').forEach(y => y.classList.toggle('on', y === x));
        sonClic();
      });
      barre.appendChild(x);
    }
  }
}
function poserCercle(p){
  if (verrouille) return;
  const q = chantier.q;
  if (q.compas === 'rayon') {
    if (!q._ecartement) { $('sousConsigne').textContent = 'Règle d’abord l’écartement du compas.'; return; }
    const c = q.centreImpose && dist(p, q.centreImpose) < 26 ? q.centreImpose : p;
    chantier.cerclesPoses.push({c, r:q._ecartement * PX_PAR_UNITE});
    chantier.enAttenteCentre = false;
    document.querySelector('#barreOutils .outil-compas').classList.remove('on');
    $('sousConsigne').textContent = q.sous || '';
    sonClic(); dessinerChantier(); majBoutons();
    return;
  }
  if (!chantier.centreProvisoire) {
    /* Le centre s’accroche à un sommet déjà construit : « centré sur un de
       ses coins » se joue là, et à la main libre on n’y arriverait pas. */
    const cands = tousLesPoints(chantier.contours).concat(chantier.sommets);
    let c = p, d0 = 18;
    cands.forEach(x => { const d = dist(p, x); if (d < d0) { d0 = d; c = x; } });
    chantier.centreProvisoire = c;
    $('sousConsigne').textContent = 'Et maintenant, un point par lequel le cercle passe.';
    sonClic(); dessinerChantier();
    const g = scene().getElementById('chantier');
    g.insertAdjacentHTML('beforeend', `<circle class="sommet" cx="${c[0]}" cy="${c[1]}" r="6"/>`);
    return;
  }
  const c = chantier.centreProvisoire;
  chantier.cerclesPoses.push({c, r:dist(c, p)});
  chantier.centreProvisoire = null;
  chantier.enAttenteCentre = false;
  document.querySelector('#barreOutils .outil-compas').classList.remove('on');
  $('sousConsigne').textContent = q.sous || '';
  sonClic(); dessinerChantier(); majBoutons();
}

/* ---------- Le tracé au doigt ----------
   CE QUE L’ENFANT PRODUIT CHANGE DE NATURE : il ne pose plus des sommets qui
   se relient, il TRACE des côtés. Ce qu’il a fait n’est donc plus une liste
   de contours qu’on lui a fait fermer, mais l’ensemble des traits — et les
   pièces sont les FACES de leur arrangement, calculées.
   Une seule vérité pour « ce que l’enfant a produit » : les mêmes faces
   colorient le verre et servent à juger. Elles remplissent `chantier.contours`,
   si bien que la validation, le vitrail cumulatif et la révélation différée
   du §18 ne changent pas d’une ligne. */
/* LE CHOIX DU CE2 : CE QU’ON REGARDE, PAS DE COMBIEN ON TOLÈRE.
   Croquer vite une figure juste est une compétence à part entière, et le
   texte met les deux façons de faire sur le même plan — même nombre de
   points. En pose de sommets, la différence était une tolérance de
   coordonnées ; au doigt sur quadrillage, le trait accroche les nœuds et il
   n’y a plus de millimètre à tolérer. Ce qui sépare alors les deux, c’est
   l’objet du jugement : le CROQUIS regarde la FIGURE et laisse passer un
   trait de construction resté en travers, le TRACÉ EXACT regarde les TRAITS
   et n’en tolère aucun en trop. */
/* UN SEUL BOUTON, QUI DIT L’ÉTAT — et c’est la place qui l’impose, pas le
   goût : deux boutons de plus faisaient passer la barre d’outils à deux
   rangées, ce qui repousse le plan sous la ligne de flottaison. Le choix
   reste visible et réversible à tout moment, c’est ce qui compte ; il part
   sur « exact », le plus strict, pour que ne rien choisir ne soit jamais
   une facilité. */
function brancherModeCE2(q, barre){
  if (!q.esquissePossible) return;
  q._mode = 'exact';
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'outil outil-mode';
  /* PAS D’ÉMOJI ICI, et ce n’est pas qu’une question de largeur : le 📏 de
     l’ancien « à la règle » désignait un instrument, et il n’y en a plus —
     le doigt trace. Un pictogramme qui montre ce qui n’existe pas est pire
     qu’un mot seul. */
  const libelle = () => q._mode === 'esquisse' ? 'croquis' : 'exact';
  b.textContent = libelle();
  b.addEventListener('click', () => {
    if (verrouille) return;
    q._mode = q._mode === 'esquisse' ? 'exact' : 'esquisse';
    b.textContent = libelle();
    b.classList.toggle('on', q._mode === 'esquisse');
    sonClic();
  });
  barre.appendChild(b);
}

function rendreTracer(q){
  const zt = fondScene(q);
  const svg = scene();
  chantier = nouveauChantier(q);
  const sup = SUPPORTS[q.support];

  const trace = creerTraceQuadrillage({
    svg, groupe:svg.getElementById('tracage'), zone:zt,
    pre:segmentsDonnes(q.amorce, zt),
    fondGrille:(z) => sup.fond(z),
    verre:(i) => verreDe(pos + i),
    surChangement:(api) => {
      chantier.contours = api.faces().map(f => simplifierPoly(f.poly).map(g => api.versScene(g)));
      majBoutons();
    }
  });
  chantier.trace = trace;
  chantier.contours = trace.faces().map(f => simplifierPoly(f.poly).map(g => trace.versScene(g)));

  const barre = $('barreOutils');
  barre.hidden = false;
  barre.innerHTML = '';
  /* Deux outils, et l’outil est FIGÉ à l’appui : un geste garde le sens
     qu’il avait en commençant. */
  const outils = [];
  [['crayon', '✏️ crayon'], ['gomme', '🧽 gomme']].forEach(([nom, lib]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'outil outil-trace' + (nom === 'crayon' ? ' on' : '');
    b.textContent = lib;
    b.addEventListener('click', () => {
      if (verrouille) return;
      trace.outil = nom;
      outils.forEach(x => x.classList.toggle('on', x === b));
      sonClic();
    });
    outils.push(b); barre.appendChild(b);
  });
  brancherModeCE2(q, barre);
  /* L’instrument reste disponible en tracé : sur « place le sommet de l’angle
     droit », c’est l’équerre qui fait trouver le nœud, le quadrillage ne
     faisant que rendre le trait exact une fois le nœud choisi. */
  brancherInstruments(q, barre, svg);
  /* « Annuler » défait le DERNIER TRAIT, pas le dernier pas : l’enfant a tracé
     un côté d’un geste, il s’attend à le retirer d’un geste. */
  const ann = document.createElement('button');
  ann.type = 'button'; ann.className = 'outil outil-annuler'; ann.textContent = '↶ annuler';
  ann.addEventListener('click', () => { if (!verrouille) trace.defaire(); });
  barre.appendChild(ann);

  $('btnValider').style.display = 'block';
  $('btnValider').textContent = 'Vérifier ✓';
  $('btnValider').onclick = () => validerManche(q);
  majBoutons();
}

/* ============================================================
   VALIDATION ET CORRECTION (CHARTE §18)
   ============================================================ */
function validerManche(q){
  if (verrouille) return;
  verrouille = true;
  $('btnValider').style.display = 'none';
  chantier.posables.forEach(p => p.verrouiller());
  document.querySelectorAll('#barreOutils .outil').forEach(b => b.disabled = true);

  const tol = chantier.tol;
  let bon = true, motif = null;

  if (q.solutions.length) {
    const attenduPoints = q.tolAngulaire;
    if (attenduPoints) {
      /* Rosace : ce sont des POINTS répartis sur un cercle, pas un contour
         à parcourir. On compare l’ensemble, à un décalage de rang près. */
      bon = chantier.contours.length === 1
        && memeContour(chantier.contours[0], q.solutions[0][0], tol);
      if (!bon) motif = 'Les six points devaient être régulièrement répartis.';
    } else if (q.mode === 'tracer') {
      /* En tracé, ce sont les TRAITS qui font foi (voir `memesTraces`) : les
         seules faces laissaient passer les traits en trop. */
      const produites = [...chantier.trace.pre, ...chantier.trace.traces];
      const traitsJustes = q.solutions.some(sol =>
        memesTraces(produites, segmentsDeSolution(sol, chantier.z), q.libre));
      const figureJuste = figureAcceptee(chantier.contours, q.solutions, tol, q.libre);
      /* EN CROQUIS, C’EST LA FIGURE QUI COMPTE et non la propreté du trait :
         un trait de construction resté en travers ne défait pas un croquis
         juste. En tracé exact, il le défait — c’est tout ce qui sépare les
         deux façons de faire, et c’est le CE2 qui choisit laquelle il joue. */
      bon = traitsJustes || (q._mode === 'esquisse' && figureJuste);
      if (!bon) {
        /* La bonne pièce ET des traits qui ne collent pas : ce sont des
           traits en trop, et le dire vaut mieux que « regarde en vert »,
           qui montrerait une figure que l’enfant a pourtant faite. */
        motif = figureJuste
          ? 'La pièce est juste, mais il reste des traits en trop : gomme-les'
            + (q.esquissePossible ? ', ou choisis le croquis.' : '.')
          : chantier.contours.length !== q.solutions[0].length
            ? 'Il fallait ' + q.solutions[0].length + ' pièce' + (q.solutions[0].length > 1 ? 's' : '') + '.'
            : 'Regarde la figure attendue, en vert.';
      }
    } else {
      bon = figureAcceptee(chantier.contours, q.solutions, tol, q.libre, jugeParMesures(q));
      if (!bon) motif = chantier.contours.length !== q.solutions[0].length
        ? 'Il fallait ' + q.solutions[0].length + ' pièce' + (q.solutions[0].length > 1 ? 's' : '') + '.'
        : 'Regarde la figure attendue, en vert.';
    }
  }
  if (bon && q.cercles) {
    /* Le cercle se juge sur la figure QUE L’ENFANT VIENT DE FERMER — à
       défaut, sur celle qui était attendue (il n’y a alors rien d’autre à
       quoi le rattacher). */
    const support = chantier.contours[0] || (q.solutions[0] && q.solutions[0][0]);
    bon = chantier.cerclesPoses.length === 1
      && cercleAccepte(chantier.cerclesPoses[0], q.cercles[0], support, tol);
    if (!bon) motif = 'Le cercle n’était pas au bon endroit.';
  }

  if (!bon) montrerAttendu(q);
  terminerManche(bon, motif);
}

function montrerAttendu(q){
  clearTimeout(minuteurRevel);
  const svg = scene();
  const g = svg.getElementById('correction');
  if (!g) return;
  /* Révélation différée (§18) : l’enfant voit d’abord SON travail, puis la
     figure attendue vient se superposer en fantôme vert. Le rouge ne
     désigne jamais la bonne réponse. */
  minuteurRevel = setTimeout(() => {
    if (!g.isConnected) return;
    let s = '';
    const sol = q.solutions[0];
    let montre = null;                    // la solution TELLE QU’ELLE EST DESSINÉE
    if (sol) {
      /* On montre la solution LÀ OÙ l’enfant a travaillé quand la position
         est libre : superposer au milieu du panneau une figure juste mais
         décalée laisserait croire que la position était fausse. */
      let d = [0, 0];
      if (q.libre && chantier.contours.length) {
        const cp = centre(tousLesPoints(chantier.contours)), cs = centre(tousLesPoints(sol));
        d = [cp[0]-cs[0], cp[1]-cs[1]];
      }
      montre = decaler(sol, d);
      montre.forEach(ct => {
        s += `<path class="attendu" d="${contourD(ct, true)}"/>`;
        ct.forEach(p => { s += `<circle class="sommet-attendu" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5"/>`; });
      });
    }
    /* Le fantôme du cercle s’accroche à la figure VERTE, celle qu’on vient de
       dessiner : la relation sait s’y prendre là comme elle s’y prenait sur
       la figure de l’enfant. On en montre UNE position — la première ancre —
       parce qu’en montrer quatre laisserait croire qu’il en fallait quatre. */
    if (q.cercles && q.cercles[0] && montre && montre[0]) {
      const ce = q.cercles[0];
      const ancres = ancresCercle(ce.relation, montre[0]);
      if (ancres.length) s += cercleSvg(ancres[0], ce.r != null ? ce.r : 2 * PX_PAR_UNITE, 'attendu');
    }
    g.innerHTML = s;
  }, DELAI_REVELATION);
}

function terminerManche(bon, motif){
  const q = file[pos];
  q._ok = bon;
  if (bon) {
    score += PTS_MANCHE;
    /* Le vitrail est CUMULATIF : chaque pièce réussie rejoint le panneau,
       qui s’illumine d’une manche à l’autre et se retrouve en grand sur
       l’écran de fin. */
    vitrail.push({contours:chantier.contours.slice(), cercles:chantier.cerclesPoses.slice(),
                  /* La couleur suit la pièce : c’est la seule façon que le
                     panneau montre ce que l’enfant vient de remplir. */
                  verres:chantier.contours.map((_, j) => verreDe(pos + j)),
                  petalesDe:q.petalesDe || null, sommets:q.petalesDe ? chantier.contours[0] : null});
    sonBonneReponse(); lancerConfettis(28);
    /* Même une félicitation est un contenu : trois manches réussies et le
       même « Belle pièce ! » trois fois, l’encouragement devient un bruit. */
    message(tirerSansRepetition('felicitations',
      ['Belle pièce !', 'Le verre est en place !', 'Montage impeccable !'], 1)[0], 'bon');
  } else {
    sonErreur();
    message('Presque ! ', 'mauvais', motif || '');
  }
  majDots(); majVitrail();
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  $('btnNext').onclick = () => { pos++; if (pos < file.length) manche(); else fin(); };
  armerAutoSuivant();
}

/* ============================================================
   LE PANNEAU DE VITRAIL — cumulatif
   ============================================================ */
function dessinerVitrail(svg, larg, haut){
  const n = file.length;
  const casePx = larg / n;
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = i * casePx;
    s += `<rect x="${x+2}" y="2" width="${casePx-4}" height="${haut-4}" rx="6"
            fill="${i < vitrail.length ? 'rgba(255,255,255,.6)' : 'rgba(90,107,125,.06)'}"
            stroke="#D9CDBA" stroke-width="1.4"/>`;
    const v = vitrail[i];
    if (!v) continue;
    /* La pièce réussie est remise à l’échelle de sa case : le panneau
       montre CE QUE L’ENFANT A CONSTRUIT, pas une vignette générique. */
    const pts = tousLesPoints(v.contours).concat((v.cercles || []).map(c => c.c));
    if (!pts.length) continue;
    const b = bbox(pts);
    const rc = (v.cercles || []).reduce((m, c) => Math.max(m, c.r), 0);
    const bx0 = b.x0 - rc, bx1 = b.x1 + rc, by0 = b.y0 - rc, by1 = b.y1 + rc;
    const k = Math.min((casePx - 14) / Math.max(1, bx1-bx0), (haut - 14) / Math.max(1, by1-by0));
    const ox = x + casePx/2 - (bx0 + bx1)/2 * k, oy = haut/2 - (by0 + by1)/2 * k;
    const T = (p) => [p[0]*k + ox, p[1]*k + oy];
    v.contours.forEach((ct, j) => {
      s += `<path d="${contourD(ct.map(T), true)}" fill="${(v.verres && v.verres[j]) || verreDe(i + j)}"
              fill-opacity=".75" stroke="var(--plomb)" stroke-width="1.6" stroke-linejoin="round"/>`;
    });
    (v.cercles || []).forEach(ce => {
      const c = T(ce.c);
      s += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${(ce.r*k).toFixed(1)}"
              fill="none" stroke="var(--plomb)" stroke-width="1.6"/>`;
    });
  }
  svg.setAttribute('viewBox', `0 0 ${larg} ${haut}`);
  svg.innerHTML = s;
}
function majVitrail(){
  /* Cinq cases vides au-dessus du plan ne disent rien à l’enfant et
     mangent la hauteur utile : le panneau n’apparaît qu’avec sa première
     pièce, et devient alors une récompense qui grandit. */
  const b = $('vitrail');
  b.hidden = vitrail.length === 0;
  if (!b.hidden) dessinerVitrail($('vitrailSvg'), 400, 62);
}

/* ============================================================
   FIN DE PARTIE
   ============================================================ */
function fin(){
  desarmerAutoSuivant(); stopperVoix();
  const ratio = total ? score / total : 0;
  const n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  enregistrerEtoiles(miniJeuCourant.cfg.id, n);
  enregistrerSession(miniJeuCourant.cfg.id, score, total, Math.round((Date.now() - demarreLe)/1000));
  $('hdrTitle').textContent = 'Résultat';
  $('endStars').innerHTML = '⭐'.repeat(n).split('').map(s => `<span>${s}</span>`).join('');
  /* ON NE FÉLICITE QUE DE CE QUI A ÉTÉ FAIT. « Vitrail terminé » et « Beau
     panneau » désignaient l’ASSEMBLAGE, que l’enfant n’a pas monté : il a
     produit des PIÈCES, une par manche, et le vitrail les rassemble sans
     être pour autant achevé. Le compte disait déjà vrai, c’est la
     félicitation qui promettait un objet fini. */
  $('endMsg').textContent = n === 3 ? 'Toutes les pièces sont terminées !'
    : n === 2 ? 'Beau travail de verrier !' : 'Continue, ton vitrail avance !';
  /* Accord calculé sur le nombre, jamais figé : « 1 pièce du vitrail
     terminée », « 5 pièces du vitrail terminées ». */
  const s = score > 1 ? 's' : '';
  $('endScore').textContent = score + ' pièce' + s + ' du vitrail terminée' + s + ' sur ' + total + '.';
  $('endVitrail').hidden = false;
  dessinerVitrail($('endVitrailSvg'), 400, 150);
  if (n === 3) sonNiveauParfait(); else sonBonneReponse();
  lancerConfettis(n === 3 ? 90 : 40);
  montreEcran('end');
}
$('bRejouer').addEventListener('click', () => lance(miniJeuCourant.cfg.id));
$('bMenu').addEventListener('click', retourAccueil);

/* ============================================================
   DÉMARRAGE
   ============================================================ */
construireAccueil();
montreEcran('home');

/* Lancement paramétré (CHARTE §16) : un paramètre inconnu est ignoré en
   silence — ce n’est qu’un raccourci d’entrée. */
(function(){
  const d = parametreURL('competence');
  if (!d) return;
  const t = trouverMiniJeu(d);
  if (!t) return;
  etatPalierAffiche = t.palierNom;
  construireAccueil();
  lance(d);
})();

/* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7). */
(function(){
  const b = $('bouton-menu'), m = $('modale-menu');
  if (!b || !m) return;
  const fermer = () => { m.hidden = true; };
  b.addEventListener('click', () => { m.hidden = false; });
  $('modale-menu-rester').addEventListener('click', fermer);
  $('modale-menu-revenir').addEventListener('click', () => { fermer(); location.href = '../index.html'; });
})();
</script>
