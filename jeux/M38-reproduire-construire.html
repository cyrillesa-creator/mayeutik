      return s;
    }
  },
  pointe: {
    /* Papier POINTÉ : le programme le nomme explicitement à côté du
       quadrillé. L’aimantation y est identique — c’est le regard qui
       travaille davantage, les lignes ne guidant plus l’œil d’un nœud à
       l’autre. */
    nom:'pointé', aimanteGrille:true,
    fond(z){
      let s = '';
      for (let i = 0; i <= z.nx; i++)
        for (let j = 0; j <= z.ny; j++) s += `<circle class="noeud" cx="${z.x0+i*z.pas}" cy="${z.y0+j*z.pas}" r="1.9"/>`;
      return s;
    }
  },
  uni: {
    /* Papier UNI : plus aucun repère. L’exactitude ne vient plus du
       support mais de l’INSTRUMENT — c’est en posant un point contre une
       graduation que l’enfant devient juste. */
    nom:'uni', aimanteGrille:false,
    fond(z){ return `<rect class="cadre-zone" x="${z.x0}" y="${z.y0}" width="${z.l}" height="${z.h}" rx="8"/>`; }
  }
};

function aimanterPoint(p, sup, z, ancres){
  if (sup.aimanteGrille) {
    const gx = Math.round((p[0] - z.x0) / z.pas), gy = Math.round((p[1] - z.y0) / z.pas);
    if (gx < 0 || gy < 0 || gx > z.nx || gy > z.ny) return null;
    return versScene(z, gx, gy);
  }
  if (p[0] < z.x0 - 4 || p[0] > z.x1 + 4 || p[1] < z.y0 - 4 || p[1] > z.y1 + 4) return null;
  let meilleur = null, d0 = AIMANT_ANCRE;
  (ancres || []).forEach(a => { const d = dist(p, a); if (d < d0) { d0 = d; meilleur = a; } });
  return meilleur || p;
}

/* ============================================================
   MOTEUR DE TRACÉ SUR QUADRILLAGE — JUMEAU VOLONTAIRE DE M41
   ------------------------------------------------------------
   Moteur jumeau dans `jeux/M41-symetrie.html`, VOLONTAIREMENT DUPLIQUÉ —
   voir `docs/corrections/CORRECTIONS-M38-moteur-quadrillage.md` §4. Toute
   correction de comportement est à examiner dans les deux.

   Pourquoi dupliqué et non partagé : M38 doit tracer des OBLIQUES 2/1 et
   3/1, que M41 refuse par conception, et son intérieur se calcule
   autrement (voir plus bas). Un moteur commun accumulerait les drapeaux
   des deux usages, comme `moteur-compas.js` a fini par en porter sept.

   CE QUI CHANGE PAR RAPPORT À M41, et pourquoi :

   1. DEUX FAÇONS DE POSER UN SEGMENT, choisies par le segment et non par la
      manche. Glisser le long d’un chemin de nœuds pose les pas courts — les
      huit voisins, le geste du crayon que M41 a validé à l’appareil. Taper
      deux nœuds pose le segment entre eux, QUELLE QUE SOIT SA PENTE.
      La règle des huit voisins ne peut pas s’étendre : un doigt qui glisse
      droit le long d’une pente 3/1 passe à 0,316 maille du nœud
      intermédiaire, et à 0,200 maille sur une 4/3 — sous le rayon
      d’accrochage. Il serait capturé en route et poserait un segment court
      illégal. Descendre le rayon sous 0,200 maille (6 px ici) rendrait les
      nœuds inatteignables. Le tap à deux nœuds contourne le calcul au lieu
      de le forcer, et il colle à la consigne déjà écrite du CE1 : « compte
      les déplacements, tant de côté et tant vers le haut ».

   2. LA MAILLE EST PLUS PETITE : 35 unités de scène ici, soit 30,3 px à
      l’écran, contre 39,3 px chez M41 — et c’est le MAXIMUM ici, parce que
      M38 empile deux panneaux quand M41 n’en montre qu’un (voir `MAILLE`).
      Les rayons se recalibrent donc en PIXELS et ne se recopient pas « en
      mailles ». C’est aussi pourquoi les tests des deux modules restent
      indépendants.

   3. L’INTÉRIEUR SE CALCULE AUTREMENT. M41 découpe chaque cellule en quatre
      quarts par ses diagonales : cela capture exactement ses murs
      possibles, mais une oblique 2/1 ne suit aucune diagonale de cellule.
      Et M38 a besoin de PLUS que M41 — non pas d’un aplat unique, mais de
      chaque pièce séparément, puisque le vitrail donne à chacune sa
      couleur de verre. On calcule donc les FACES DE L’ARRANGEMENT des
      segments tracés (voir `facesDeSegments`).
   ============================================================ */

/* Rayons exprimés en MAILLES, convertis en unités de scène à l’usage.
   Le rayon d’accrochage d’un nœud reste sous une demi-maille : au-delà,
   les zones de deux nœuds voisins se recouvriraient et le doigt serait
   capturé par l’un ou l’autre selon l’arrondi. */
const RAYON_NOEUD_M = 0.45;      // 0,45 maille = 15,8 unités = ~13,6 px à l’écran
const RAYON_GOMME_M = 0.30;
const RAYON_TAP_M = 0.70;        // le tap n’a pas de trajectoire : il peut viser large
const SEUIL_TRACE = SEUIL_GLISSEMENT;   // px écran — un seuil, jamais une durée (§19)

/* Une clé de segment est canonique, en coordonnées de GRILLE : le plus
   petit bout d’abord, pour que (a,b) et (b,a) soient le même segment. */
function cleSeg(a, b){
  const [p, q] = (a[0] < b[0] || (a[0] === b[0] && a[1] <= b[1])) ? [a, b] : [b, a];
  return p[0] + ',' + p[1] + '|' + q[0] + ',' + q[1];
}
const boutsSeg = (k) => k.split('|').map(s => s.split(',').map(Number));
const memeNoeud = (a, b) => !!a && !!b && a[0] === b[0] && a[1] === b[1];
/* Les huit voisins, et rien d’autre, pour le GLISSEMENT. */
const voisinsGrille = (a, b) => {
  const dx = Math.abs(a[0]-b[0]), dy = Math.abs(a[1]-b[1]);
  return dx <= 1 && dy <= 1 && dx + dy > 0;
};

function distanceAuSegment(p, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx + dy*dy;
  if (L2 < 1e-9) return dist(p, a);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0]-a[0]-dx*t, p[1]-a[1]-dy*t);
}

/* ------------------------------------------------------------
   LES FACES DE L’ARRANGEMENT — « dedans », calculé et non déclaré
   ------------------------------------------------------------
   On découpe chaque segment à ses intersections avec les autres, on double
   chaque arête en deux demi-arêtes, on trie les sortantes de chaque sommet
   par angle, et l’on parcourt les cycles : chaque cycle est une face. La
   face non bornée sort avec l’aire de signe opposé aux autres, ce qui la
   désigne sans avoir à chercher l’infini.

   Ce que cela donne de plus qu’un remplissage par inondation : les faces
   SÉPARÉMENT. Au petit vitrail, un côté partagé est un seul segment tracé
   une fois, et les deux pièces sont deux faces séparées par lui — le
   chevauchement et le contact par un point cessent d’être exprimables, et
   chaque pièce garde sa couleur.
   ------------------------------------------------------------ */
function facesDeSegments(segs){
  const EPS = 1e-9;
  const pts = [], index = new Map();
  const clePt = (p) => p[0].toFixed(6) + ',' + p[1].toFixed(6);
  const ajouterPt = (p) => {
    const c = clePt(p);
    if (!index.has(c)) { index.set(c, pts.length); pts.push([+p[0].toFixed(6), +p[1].toFixed(6)]); }
    return index.get(c);
  };
  /* 1. Où chaque segment est coupé — ses deux bouts, et toute intersection
        avec un autre. Deux segments colinéaires sont laissés tels quels :
        leurs bouts communs sont déjà des sommets. */
  const coupes = segs.map(() => [0, 1]);
  for (let i = 0; i < segs.length; i++)
    for (let j = i + 1; j < segs.length; j++) {
      const [a, b] = segs[i], [c, d] = segs[j];
      const r = [b[0]-a[0], b[1]-a[1]], t = [d[0]-c[0], d[1]-c[1]];
      const den = r[0]*t[1] - r[1]*t[0];
      if (Math.abs(den) < EPS) continue;
      const u = ((c[0]-a[0])*t[1] - (c[1]-a[1])*t[0]) / den;
      const v = ((c[0]-a[0])*r[1] - (c[1]-a[1])*r[0]) / den;
      if (u > EPS && u < 1-EPS && v > -EPS && v < 1+EPS) coupes[i].push(u);
      if (v > EPS && v < 1-EPS && u > -EPS && u < 1+EPS) coupes[j].push(v);
    }
  /* 2. Les arêtes élémentaires, dédoublonnées. */
  const aretes = [], vues = new Set();
  segs.forEach((s, i) => {
    const ts = [...new Set(coupes[i].map(t => +t.toFixed(9)))].sort((x, y) => x - y);
    for (let k = 0; k + 1 < ts.length; k++) {
      const sur = (t) => [s[0][0] + (s[1][0]-s[0][0])*t, s[0][1] + (s[1][1]-s[0][1])*t];
      const ip = ajouterPt(sur(ts[k])), iq = ajouterPt(sur(ts[k+1]));
      if (ip === iq) continue;
      const c = Math.min(ip, iq) + '-' + Math.max(ip, iq);
      if (vues.has(c)) continue;
      vues.add(c); aretes.push([ip, iq]);
    }
  });
  if (!aretes.length) return [];
  /* 3. Demi-arêtes, triées par angle autour de chaque sommet. */
  const demi = [], sortantes = new Map();
  const ajouterDemi = (de, vers) => {
    const i = demi.length;
    demi.push({de, vers, jumelle:-1, face:-1,
      angle:Math.atan2(pts[vers][1]-pts[de][1], pts[vers][0]-pts[de][0])});
    if (!sortantes.has(de)) sortantes.set(de, []);
    sortantes.get(de).push(i);
    return i;
  };
  aretes.forEach(([a, b]) => {
    const h1 = ajouterDemi(a, b), h2 = ajouterDemi(b, a);
    demi[h1].jumelle = h2; demi[h2].jumelle = h1;
  });
  const rang = new Map();
  sortantes.forEach(l => {
    l.sort((x, y) => demi[x].angle - demi[y].angle);
    l.forEach((h, i) => rang.set(h, i));
  });
  /* 4. La suivante d’une demi-arête dans sa face : au sommet d’arrivée, on
        prend la sortante qui PRÉCÈDE la jumelle dans l’ordre angulaire.
        C’est le « virage le plus à gauche », qui referme les faces. */
  const suivante = (h) => {
    const t = demi[h].jumelle, l = sortantes.get(demi[t].de), i = rang.get(t);
    return l[(i - 1 + l.length) % l.length];
  };
  const faces = [];
  for (let h = 0; h < demi.length; h++) {
    if (demi[h].face !== -1) continue;
    const cycle = [];
    let cur = h;
    do { demi[cur].face = faces.length; cycle.push(cur); cur = suivante(cur); } while (cur !== h);
    const poly = cycle.map(x => pts[demi[x].de]);
    let a2 = 0;
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i+1) % poly.length];
      a2 += p[0]*q[1] - q[0]*p[1];
    }
    faces.push({poly, aire:a2/2});
  }
  /* La face non bornée porte l’aire de signe opposé : on garde les autres,
     et l’on écarte les cycles dégénérés (une arête pendante, parcourue
     aller et retour, n’enferme rien). */
  return faces.filter(f => f.aire > 1e-6);
}

/* ------------------------------------------------------------
   LE MOTEUR : un quadrillage, des segments, deux gestes
   ------------------------------------------------------------
   `creerTraceQuadrillage` prend une zone et rend un objet qui dessine son
   propre quadrillage, sa propre surface tactile, et tient les segments
   posés. Il dessine SON quadrillage à lui : ainsi la grille affichée est
   exactement celle qui accroche, et non une seconde vérité à garder en
   accord avec la première.
   ------------------------------------------------------------ */
function fondMailleParDefaut(z){
  let s = '';
  for (let i = 0; i <= z.nx; i++)
    s += `<line class="trace-maille" x1="${z.x0+i*z.pas}" y1="${z.y0}" x2="${z.x0+i*z.pas}" y2="${z.y1}"/>`;
  for (let j = 0; j <= z.ny; j++)
    s += `<line class="trace-maille" x1="${z.x0}" y1="${z.y0+j*z.pas}" x2="${z.x1}" y2="${z.y0+j*z.pas}"/>`;
  return s;
}
function creerTraceQuadrillage(o){
  const z = o.zone;
  const svg = o.svg;
  const groupe = o.groupe;
  const api = {
    zone:z,
    /* MÊME LE DONNÉ EST RANGÉ EN PAS PRIMITIFS, et c’est le moteur qui s’en
       charge : l’invariant « tout segment que je tiens est un pas primitif »
       ne doit pas dépendre de la politesse de l’appelant. */
    pre:new Set(canoniser(o.pre || [])),
    traces:new Set(),
    outil:'crayon',
    attente:null,          // nœud tapé qui attend son second
    apercu:null,           // trait en cours, montré tant que le doigt est posé
    gommages:0
  };
  const versGrille = (p) => [(p[0] - z.x0) / z.pas, (p[1] - z.y0) / z.pas];
  const versScene2 = (g) => [z.x0 + g[0]*z.pas, z.y0 + g[1]*z.pas];
  api.versGrille = versGrille; api.versScene = versScene2;
  const noeudProche = (p, rayon) => {
    const g = versGrille(p);
    const i = Math.round(g[0]), j = Math.round(g[1]);
    if (i < 0 || j < 0 || i > z.nx || j > z.ny) return null;
    return Math.hypot(g[0]-i, g[1]-j) <= rayon ? [i, j] : null;
  };
  api.noeudProche = noeudProche;

  /* ---- Ce qui est posé ---- */
  /* TOUT SEGMENT STOCKÉ EST UN PAS PRIMITIF. Un trait long est donc rangé en
     morceaux nœud à nœud. Sans cela, un côté DONNÉ — rangé en pas — et le
     même côté retracé d’un seul geste coexisteraient comme deux segments
     colinéaires superposés : l’arrangement ne sait pas trancher ce cas et
     rendait zéro pièce. Le rangement en pas rend aussi le `pre` reconnaissable
     (on ne réécrit pas ce qui est donné) et la comparaison canonique par
     construction. `poser` rend LA LISTE de ce qu’il a réellement écrit. */
  api.journal = [];        // les traits, dans l’ordre, pour défaire le dernier
  api.poser = function(k){
    if (verrouille || !k) return [];
    const ecrits = [];
    pasPrimitifs(...boutsSeg(k)).forEach(x => {
      if (api.pre.has(x) || api.traces.has(x)) return;      // ni le donné, ni le déjà-là
      api.traces.add(x); ecrits.push(x);
    });
    if (!ecrits.length) return [];
    api.journal.push(ecrits);
    sonClic();
    api.rendre();
    if (o.surChangement) o.surChangement(api);
    return ecrits;
  };
  /* Retirer ce que LE GESTE EN COURS vient de poser. On ne l’appelle que sur
     des pas dont `poser` a signalé qu’il les avait écrits. */
  api.retirerDuGeste = function(cles){
    if (verrouille) return;
    const l = Array.isArray(cles) ? cles : [cles];
    let n = 0;
    l.forEach(k => { if (api.traces.delete(k)) n++; });
    if (!n) return;
    const i = api.journal.findIndex(t => t.length === l.length && t.every((x, j) => x === l[j]));
    if (i >= 0) api.journal.splice(i, 1);
    sonClic();
    api.rendre();
    if (o.surChangement) o.surChangement(api);
  };
  /* Défaire le DERNIER TRAIT, et non le dernier pas : l’enfant a tracé un
     côté d’un geste, il s’attend à le retirer d’un geste. */
  api.defaire = function(){
    const t = api.journal.pop();
    if (!t) return;
    t.forEach(k => api.traces.delete(k));
    sonClic();
    api.rendre();
    if (o.surChangement) o.surChangement(api);
  };
  /* LA GOMME FROTTE : tout trait qu’elle croise s’en va. Le danger qui
     interdisait la proximité au crayon — le doigt qui traverse une cellule
     y trouve une diagonale — n’existe pas ici : la gomme ne peut toucher
     que ce que l’enfant a lui-même tracé, et un trait effacé se retrace. */
  api.frotter = function(p){
    if (verrouille) return;
    const g = versGrille(p);
    const partis = [];
    api.traces.forEach(k => {
      const [a, b] = boutsSeg(k);
      if (distanceAuSegment(g, a, b) <= RAYON_GOMME_M) partis.push(k);
    });
    if (!partis.length) return;
    partis.forEach(k => api.traces.delete(k));
    api.journal = api.journal.map(t => t.filter(k => api.traces.has(k))).filter(t => t.length);
    api.gommages += partis.length;
    sonClic();
    api.rendre();
    if (o.surChangement) o.surChangement(api);
  };

  /* ---- Ce qui est dedans ---- */
  api.faces = function(){
    const segs = [];
    [...api.pre, ...api.traces].forEach(k => { const [a, b] = boutsSeg(k); segs.push([a, b]); });
    return facesDeSegments(segs);
  };

  /* ---- Le dessin ---- */
  const segD = (k) => {
    const [a, b] = boutsSeg(k).map(versScene2);
    return `x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"`;
  };
  api.rendre = function(){
    const vb = (svg.getAttribute('viewBox') || '0 0 400 498').split(/\s+/).map(Number);
    /* UNE SURFACE EXPLICITE couvre toute la vue. Sous un point VIDE d’un
       `<svg>` racine, la cible désignée dépend du moteur de rendu : WebKit
       et Blink n’y répondent pas pareil, et le geste redevenait un
       défilement. `pointer-events:all` fait de ce rectangle une cible quel
       que soit son remplissage, sans rien peindre. Leçon de M41, payée sur
       appareil et non reproductible sous Chromium. */
    let s = `<rect class="trace-surface" x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}"/>`;
    /* LE PAPIER EST DESSINÉ ICI, par le même rendu que les traits, parce que
       c’est la seule façon que la grille MONTRÉE soit celle qui ACCROCHE
       (propriété 9). Ce qu’on y voit — des lignes ou des points — dépend du
       support et lui appartient : le pointé n’est pas un quadrillé, et un
       moteur qui imposerait ses lignes le transformerait en quadrillé sous
       les yeux de l’enfant. Le support ne décide donc que du DESSIN, jamais
       de l’accrochage, qui reste le même pour les deux. */
    s += (o.fondGrille || fondMailleParDefaut)(z);
    /* Les pièces, chacune de son verre : ce sont les faces de l’arrangement,
       calculées et non déclarées. */
    api.faces().forEach((f, i) => {
      const d = 'M ' + f.poly.map(p => versScene2(p).map(v => v.toFixed(1)).join(' ')).join(' L ') + ' Z';
      s += `<path class="trace-face" d="${d}" fill="${(o.verre || verreDe)(i)}" fill-opacity=".55"/>`;
    });
    api.pre.forEach(k => { s += `<line class="trace-pre" ${segD(k)}/>`; });
    api.traces.forEach(k => { s += `<line class="trace-trait" ${segD(k)}/>`; });
    /* L’APERÇU DU TRAIT EN COURS. « Un peu aidé » veut d’abord dire : voir ce
       qu’on est en train de tracer avant de lever le doigt. */
    if (api.apercu) {
      const [a, b] = api.apercu.map(versScene2);
      s += `<line class="trace-apercu" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}"`
         + ` x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
    }
    if (api.attente) {
      const p = versScene2(api.attente);
      s += `<circle class="trace-noeud" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6"/>`;
    }
    groupe.innerHTML = s;
  };

  /* ---- Le geste ------------------------------------------------------
     LE TRAIT SUIT UN CHEMIN DE NŒUDS au glissement : on part d’un nœud, on
     ne va qu’à un nœud VOISIN, et un doigt qui dérive au milieu d’une
     cellule ne trace rien tant qu’il n’a pas atteint un nœud. Leçon de
     M41 : allumer le segment le plus proche noyait le trait voulu sous une
     résille de diagonales, parce qu’un enfant ne tape pas case par case,
     il GLISSE.

     ET UN TAP SUR DEUX NŒUDS pose le segment entre eux, quelle que soit sa
     pente : c’est par là que les obliques 2/1 et 3/1 passent. Le tap se
     distingue du glissement par un SEUIL DE DÉPLACEMENT, jamais par une
     temporisation. */
  /* LE TRAIT SUIT LA MAIN QUAND ELLE VA DROIT, et non le quadrillage nœud par
     nœud. C’est ce qui ouvre les OBLIQUES du CE1, et le calcul dit pourquoi
     rien d’autre ne marchait : sur une pente 2/1, le nœud parasite est à
     0,447 maille de la corde et le rayon d’accrochage vaut 0,45 — un enfant
     qui trace parfaitement droit est capturé d’un cheveu. Baisser le rayon
     sous 0,316 (la pente 3/1) rendrait les nœuds inatteignables.
     La règle n’est donc plus « à quel nœud suis-je ? » mais « ai-je tourné ? » :
     tant que le chemin parcouru depuis l’ancre reste dans une bande étroite
     autour de la droite ancre→doigt, c’est UN SEUL TRAIT, quelle que soit sa
     pente et quels que soient les nœuds survolés. Dès que la main tourne, le
     trait se ferme au dernier nœud survolé et un nouveau part de là.
     Ce que l’enfant gagne, au-delà des obliques : sa main tremblée est
     redressée, et un côté de quatre s’écrit d’un seul geste. C’est le sens du
     « tracé un peu aidé ». */
  /* 0,50 MAILLE, ET C’EST MESURÉ, PAS CHOISI. Balayé de 0,30 à 0,85 : la
     tolérance au tremblement monte avec cette valeur (0,15 maille à 0,30 ;
     0,28 à 0,50 ; 0,40 à 0,70), et la reconnaissance des virages descend.
     0,50 est le point où le tremblement toléré atteint ±0,28 maille — le
     standard que M41 a fixé à l’appareil — sans rien perdre sur les virages à
     angle droit, les seuls que le contenu contienne.
     CE QU’ON PERD, et il faut le savoir : au-delà de 0,55 les virages TRÈS
     DOUX cessent d’être vus (un côté horizontal suivi d’une pente 3/1, soit
     un angle d’une vingtaine de degrés, se lit comme un seul trait). Aucune
     figure du module n’en contient — carrés et rectangles obliques n’ont que
     des angles droits — et un enfant lève le doigt à chaque coin. */
  const TOL_DROITE = 0.50;          // en mailles : au-delà, la main a tourné
  let actif = false, bouge = false, surOutil = false, outilDuGeste = 'crayon';
  let depart = null, dernier = null, noeud = null, poses = [];
  let course = [], survole = null;
  const repartirDe = (n) => { noeud = n; course = []; survole = null; poses = []; };
  /* Écart maximal des points parcourus à la droite ancre→cible, en mailles.
     `cible` est un POINT DE SCÈNE : ce qui décide qu’on a tourné, c’est le
     doigt, pas un nœud choisi d’avance. */
  const ecartCourse = (b) => {
    if (!noeud) return 0;
    const a = versScene2(noeud);
    const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
    if (L < 1e-6) return 0;
    let m = 0;
    course.forEach(p => {
      const d = Math.abs((p[0]-a[0])*(b[1]-a[1]) - (p[1]-a[1])*(b[0]-a[0])) / L;
      if (d > m) m = d;
    });
    return m / z.pas;
  };
  /* Ferme le trait en cours sur `n` et repart de là.
     PAS DE RETOUR ARRIÈRE À EFFACER ICI, et ce n’est pas un oubli : rien ne
     s’écrit tant que le doigt va droit, si bien que revenir sur ses pas
     RACCOURCIT le trait AVANT qu’il n’existe. Un aller-retour complet ne
     trace rien du tout. Il n’y a donc jamais de pas à retirer en chemin —
     c’était le mécanisme de M41, où chaque nœud franchi écrivait aussitôt.
     Défaire ce qui est déjà écrit relève d’« annuler », qui retire un TRAIT
     entier en lisant le journal, et ne peut donc toucher ni le donné ni un
     trait antérieur. */
  const poserJusqua = (n) => {
    if (!noeud || !n || memeNoeud(noeud, n)) return;
    poses.push(api.poser(cleSeg(noeud, n)));
    noeud = n; course = []; survole = null;
  };
  const traiter = (p) => {
    if (!noeud) {
      const n = noeudProche(p, RAYON_NOEUD_M);
      if (n) { repartirDe(n); api.apercu = null; }
      return;
    }
    /* LA MAIN A-T-ELLE TOURNÉ ? Le doigt seul en décide : on mesure l’écart du
       chemin déjà parcouru à la droite qui joint l’ancre au doigt. Tant qu’il
       reste dans la bande, le trait continue — c’est ce qui laisse passer une
       oblique sans se faire capturer par ses nœuds intermédiaires. */
    course.push(p);
    if (ecartCourse(p) > TOL_DROITE) {
      /* On ferme au dernier nœud atteint EN LIGNE DROITE. Sans lui, un virage
         pris entre deux nœuds ne saurait pas où couper. */
      if (survole) { poserJusqua(survole); course = [p]; }
      else { course = [p]; }          // rien de posable : on repart du doigt
      api.apercu = null;
      return;
    }
    const n = noeudProche(p, RAYON_NOEUD_M);
    if (n && !memeNoeud(n, noeud) && ecartCourse(versScene2(n)) <= TOL_DROITE) {
      /* Nœud atteint en ligne droite : cible possible. ON NE POSE PAS ENCORE —
         le doigt ira peut-être plus loin sur la même droite, et c’est
         précisément ce qui sauve les obliques. */
      survole = n;
      api.apercu = [noeud, n];
    }
  };
  const auSvg = (e) => { const q = versSVG(svg, e.clientX, e.clientY); return [q.x, q.y]; };

  /* UN GESTE QUI COMMENCE SUR UN INSTRUMENT APPARTIENT À L’INSTRUMENT, et
     seul un TAP en redescend jusqu’ici. Deux raisons, et la seconde est
     invisible : d’abord glisser une règle en travers de la feuille n’est pas
     tracer — on la déplace ; ensuite `setPointerCapture` est EXCLUSIF, si
     bien que capturer ici volait le pointeur à l’instrument, qui restait
     figé sous le doigt. Le seuil est le même des deux côtés, donc un seul
     des deux agit : en dessous le tap ouvre un segment sur la graduation
     visée, au-dessus l’instrument se déplace et rien ne s’écrit. */
  const surBas = (e) => {
    if (verrouille) return;
    actif = true; bouge = false;
    surOutil = !!(e.target && e.target.closest && e.target.closest('#instruments'));
    outilDuGeste = api.outil;          // l’outil est FIGÉ à l’appui
    depart = [e.clientX, e.clientY];
    dernier = auSvg(e);
    repartirDe(noeudProche(dernier, RAYON_NOEUD_M));
    if (!surOutil) {
      if (outilDuGeste === 'gomme') api.frotter(dernier);
      try { svg.setPointerCapture(e.pointerId); } catch(err){}
    }
    e.preventDefault();
  };
  const surBouge = (e) => {
    if (!actif) return;
    const p = auSvg(e);
    if (!bouge && Math.hypot(e.clientX - depart[0], e.clientY - depart[1]) < SEUIL_TRACE) return;
    bouge = true;
    /* Au-delà du seuil, le geste parti d’un instrument est un déplacement :
       il n’écrit rien, et il n’ouvrira pas non plus de segment au relâché,
       puisque `bouge` est désormais vrai. */
    if (surOutil) return;
    /* Un doigt rapide franchit plusieurs nœuds entre deux événements : on
       échantillonne le chemin pour ne manquer aucun passage. */
    if (dernier) {
      const d = [p[0]-dernier[0], p[1]-dernier[1]];
      const n = Math.max(1, Math.ceil(Math.hypot(d[0], d[1]) / (z.pas * 0.2)));
      const pas = outilDuGeste === 'gomme' ? api.frotter : traiter;
      for (let i = 1; i <= n; i++) pas([dernier[0] + d[0]*i/n, dernier[1] + d[1]*i/n]);
    }
    dernier = p;
    e.preventDefault();
  };
  const surHaut = (e) => {
    if (!actif) return;
    actif = false;
    try { svg.releasePointerCapture(e.pointerId); } catch(err){}
    const p = auSvg(e);
    if (!bouge) {
      /* L’APPUI SIMPLE est le geste de précision, et il ne dérape pas : il
         n’a pas de trajectoire. Chez M41 il accrochait le segment le plus
         proche ; ici il OUVRE un segment, puis le referme sur un second
         nœud. C’est la seule des douze propriétés qui change de sens à la
         copie, et elle change parce que ce que l’enfant produit change. */
      const n = noeudProche(p, RAYON_TAP_M);
      if (outilDuGeste === 'gomme') {
        if (n) api.frotter(versScene2(n));
      } else if (n) {
        if (!api.attente) api.attente = n;
        else if (memeNoeud(api.attente, n)) api.attente = null;   // on annule le départ
        else { const k = cleSeg(api.attente, n); api.attente = null; api.poser(k); }
      }
    } else if (surOutil) {
      /* On a déplacé un instrument, pas tracé : rien ne s’écrit, et le
         départ en attente n’est pas perdu — caler la règle entre deux
         appuis fait partie du geste, ce n’est pas un renoncement. */
    } else {
      api.attente = null;           // un glissement annule un départ en attente
      /* LE TRAIT SE FERME AU RELÂCHEMENT sur le dernier nœud atteint en ligne
         droite : sans cela, une oblique tracée d’un seul geste — le cas même
         du CE1 — ne s’écrirait jamais, puisqu’on ne pose plus en chemin. */
      if (outilDuGeste !== 'gomme') {
        const fin = noeudProche(p, RAYON_NOEUD_M);
        if (fin && ecartCourse(versScene2(fin)) <= TOL_DROITE) {
          /* LE TRAIT S’ARRÊTE OÙ LE DOIGT SE LÈVE, et pas au nœud le plus loin
             qu’il ait survolé : un enfant qui dépasse puis revient a corrigé,
             il n’a pas tracé jusqu’au bout. S’il revient jusqu’à son point de
             départ, il n’a rien tracé — et il faut que ce soit vrai, car un
             DEMI-TOUR EST COLINÉAIRE, donc invisible au test de virage.
             `survole` ne sert plus que si le doigt se lève loin de tout nœud. */
          if (!memeNoeud(fin, noeud)) poserJusqua(fin);
        } else if (survole) poserJusqua(survole);
      }
    }
    api.apercu = null;
    repartirDe(null);
    api.rendre();
  };
  svg.addEventListener('pointerdown', surBas);
  svg.addEventListener('pointermove', surBouge);
  svg.addEventListener('pointerup', surHaut);
  svg.addEventListener('pointercancel', surHaut);
  api.detacher = function(){
    svg.removeEventListener('pointerdown', surBas);
    svg.removeEventListener('pointermove', surBouge);
    svg.removeEventListener('pointerup', surHaut);
    svg.removeEventListener('pointercancel', surHaut);
    $('plan').classList.remove('plan-trace');
  };
  /* `touch-action:none` sur LA CARTE ENTIÈRE, marge comprise, et pas
     seulement sur le SVG : un geste qui commence dans le rembourrage ne
     doit pas davantage faire défiler la page. La classe le porte, pour ne
     rien changer aux mini-jeux qui n’utilisent pas ce moteur. */
  $('plan').classList.add('plan-trace');
  api.rendre();
  return api;
}

/* Un côté DONNÉ se décompose en pas de nœud à nœud quand sa pente le
   permet, plutôt que d’être gardé d’un bloc. Deux raisons : un enfant qui
   repasse sur l’amorce retombe alors exactement sur les mêmes clés, donc
   rien ne se dédouble ; et l’arrangement n’a jamais à démêler deux segments
   colinéaires qui se recouvrent, cas dégénéré qu’il ne sait pas trancher.
   Une pente que les huit voisins n’atteignent pas — les obliques du CE1 —
   reste un segment unique, ce qui est correct puisque rien ne peut la
   recouvrir partiellement. */
const pgcdEntier = (a, b) => b ? pgcdEntier(b, a % b) : a;
/* UN CÔTÉ VAUT LA MÊME CHOSE QUEL QUE SOIT LE DÉCOUPAGE DU GESTE : on le
   ramène toujours à ses PAS PRIMITIFS, les plus petits qui le composent en
   passant par des nœuds. Un côté horizontal de 4 vaut quatre pas de 1, qu’il
   ait été tracé d’un trait ou en quatre ; un côté de pente 2/4 vaut deux pas
   de 1/2 ; une pente 2/1 ne se divise pas et reste un pas unique.
   Sans cette forme canonique, la comparaison dépendrait de l’endroit où
   l’enfant a levé le doigt, ce qui n’est pas une propriété de la figure. */
function pasPrimitifs(a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const g = pgcdEntier(Math.abs(dx), Math.abs(dy)) || 1;
  const px = dx / g, py = dy / g, cles = [];
  for (let k = 0; k < g; k++)
    cles.push(cleSeg([a[0] + px*k, a[1] + py*k], [a[0] + px*(k+1), a[1] + py*(k+1)]));
  return cles;
}
const canoniser = (cles) => {
  const out = [];
  cles.forEach(k => { const [a, b] = boutsSeg(k); pasPrimitifs(a, b).forEach(x => out.push(x)); });
  return out;
};
function segmentsDonnes(amorce, z){
  const cles = [];
  (amorce || []).forEach(ligne => {
    for (let i = 0; i + 1 < ligne.length; i++) {
      const a = [Math.round((ligne[i][0] - z.x0) / z.pas), Math.round((ligne[i][1] - z.y0) / z.pas)];
      const b = [Math.round((ligne[i+1][0] - z.x0) / z.pas), Math.round((ligne[i+1][1] - z.y0) / z.pas)];
      pasPrimitifs(a, b).forEach(k => cles.push(k));
    }
  });
  return cles;
}

/* CE QUI EST JUGÉ EN MODE TRACÉ, CE SONT LES TRAITS, et pas seulement les
   pièces qu’ils enferment. Juger sur les seules faces laissait passer les
   traits en trop : une antenne, un trait resté en travers du panneau
   n’enferment rien, donc ne changeaient aucune face, et la manche était
   validée sur une figure que personne n’aurait acceptée sur le papier.
   On compare donc l’ENSEMBLE DES SEGMENTS — le donné plus le tracé — à celui
   de la figure attendue. Le critère devient exact dans les deux sens : il ne
   manque rien et il n’y a rien de trop. La façon d’y arriver reste libre,
   puisque deux tracés du même côté produisent la même clé.
   Quand la position est libre, on recale les deux ensembles sur leur coin
   supérieur gauche : c’est la translation, et rien d’autre, qui est tolérée. */
function clesNormalisees(cles){
  const bouts = cles.map(k => boutsSeg(k));
  let mi = Infinity, mj = Infinity;
  bouts.forEach(([a, b]) => { mi = Math.min(mi, a[0], b[0]); mj = Math.min(mj, a[1], b[1]); });
  if (!isFinite(mi)) return new Set();
  return new Set(bouts.map(([a, b]) => cleSeg([a[0]-mi, a[1]-mj], [b[0]-mi, b[1]-mj])));
}
function memesTraces(produites, attendues, libre){
  /* On ne canonise pas ici : le moteur ne tient QUE des pas primitifs, donné
     compris, et `segmentsDeSolution` en produit aussi. Le refaire serait une
     seconde vérité sur la même forme — et une mutation l’a montré inutile en
     restant aveugle. L’invariant, lui, est éprouvé par son propre test. */
  const A = libre ? clesNormalisees(produites) : new Set(produites);
  const B = libre ? clesNormalisees(attendues) : new Set(attendues);
  if (A.size !== B.size) return false;
  for (const k of A) if (!B.has(k)) return false;
  return true;
}
/* Les côtés d’une solution, refermée, dans la même écriture que le tracé. */
function segmentsDeSolution(sol, z){
  return segmentsDonnes(sol.map(ct => ct.concat([ct[0]])), z);
}

/* UNE FACE EST UN POLYGONE DE L’ARRANGEMENT, donc elle porte un sommet à
   chaque nœud traversé : un rectangle tracé pas à pas en compte douze, et
   non quatre. La comparaison de figures, elle, parle de CÔTÉS. On retire
   donc les sommets alignés — c’est une lecture de la figure produite, pas
   une correction de la façon dont l’enfant l’a tracée. */
function simplifierPoly(poly){
  const n = poly.length;
  if (n < 3) return poly.slice();
  const garde = [];
  for (let i = 0; i < n; i++) {
    const a = poly[(i - 1 + n) % n], b = poly[i], c = poly[(i + 1) % n];
    const v = (b[0]-a[0]) * (c[1]-b[1]) - (b[1]-a[1]) * (c[0]-b[0]);
    if (Math.abs(v) > 1e-9) garde.push(b);
  }
  return garde.length >= 3 ? garde : poly.slice();
}

/* ============================================================
   COMPARAISON DE FIGURES
   ------------------------------------------------------------
   Une solution est une LISTE de contours. On en accepte plusieurs par
   manche : le carré dont un seul côté est tracé en admet deux, une de
   chaque côté du segment, et refuser l’une serait mathématiquement faux.
   ============================================================ */
const centre = (pts) => {
  const n = pts.length;
  return [pts.reduce((s,p)=>s+p[0],0)/n, pts.reduce((s,p)=>s+p[1],0)/n];
};
/* Un contour ne dépend ni du sommet de départ ni du sens de parcours :
   commencer le carré par un autre coin, ou tourner dans l’autre sens, est
   le même carré. */
function memeContour(a, b, tol){
  if (a.length !== b.length) return false;
  const n = a.length;
  for (const sens of [a, [a[0], ...a.slice(1).reverse()]])
    for (let d = 0; d < n; d++)
      if (sens.every((p, i) => dist(p, b[(i + d) % n]) <= tol)) return true;
  return false;
}
/* Appariement bijectif des contours posés et des contours attendus. Les
   assemblages n’en comptent jamais plus de quatre : l’essai exhaustif est
   à la fois simple et suffisant. */
function memeAssemblage(poses, attendus, tol, memeUn){
  if (poses.length !== attendus.length) return false;
  const identiques = memeUn || memeContour;
  const pris = new Array(attendus.length).fill(false);
  const rec = (i) => {
    if (i === poses.length) return true;
    for (let j = 0; j < attendus.length; j++) {
      if (pris[j] || !identiques(poses[i], attendus[j], tol)) continue;
      pris[j] = true;
      if (rec(i + 1)) return true;
      pris[j] = false;
    }
    return false;
  };
  return rec(0);
}
const decaler = (contours, d) => contours.map(c => c.map(p => [p[0]+d[0], p[1]+d[1]]));
const tousLesPoints = (contours) => contours.reduce((s, c) => s.concat(c), []);

/* ============================================================
   SUR PAPIER UNI, ON JUGE DES MESURES — PAS DES COORDONNÉES
   ------------------------------------------------------------
   « Construis un rectangle de 7 sur 4 » ne dit ni où le poser ni comment
   l’orienter, et le papier uni ne le dit pas non plus : il n’a ni ligne ni
   nœud. Comparer sommet à sommet avec une figure de référence droite
   refusait donc un rectangle PARFAITEMENT JUSTE dessiné de travers, et
   punissait au passage la dérive accumulée — quatre côtés un peu longs, et
   le dernier sommet est loin, alors qu’aucune mesure n’est fausse.
   On compare donc ce que l’énoncé énonce : les LONGUEURS DES CÔTÉS et les
   ANGLES, dans le même ordre cyclique, au sens de parcours près. C’est
   invariant par translation, par rotation et par retournement — les trois
   libertés que le papier uni laisse réellement — et chaque mesure se juge
   pour elle-même, sans que les erreurs s’additionnent.
   Cela ne relâche pas l’exigence : une figure dont un côté est faux d’une
   unité reste refusée. Cela cesse de mesurer ce qui n’était pas demandé.
   ============================================================ */
function mesuresContour(c){
  const n = c.length, cotes = [], angles = [];
  for (let i = 0; i < n; i++) {
    cotes.push(dist(c[i], c[(i+1) % n]));
    const a = c[(i-1+n) % n], b = c[i], d = c[(i+1) % n];
    const u = Math.atan2(a[1]-b[1], a[0]-b[0]), v = Math.atan2(d[1]-b[1], d[0]-b[0]);
    let t = Math.abs(u - v);
    if (t > Math.PI) t = TAU - t;
    angles.push(t);                       // angle NON orienté au sommet i
  }
  return {cotes, angles};
}
function memesMesures(produit, attendu, tol){
  if (produit.length !== attendu.length) return false;
  const cible = mesuresContour(attendu), n = produit.length;
  /* Le parcours inverse se compare en RETOURNANT le contour, pas en jonglant
     avec les indices : une figure retournée est la même figure, et refaire
     le calcul sur le contour retourné évite l’erreur de décalage que le
     jonglage invite. */
  for (const c of [produit, produit.slice().reverse()]) {
    const m = mesuresContour(c);
    for (let d = 0; d < n; d++) {
      let ok = true;
      for (let i = 0; i < n && ok; i++)
        ok = Math.abs(m.cotes[(i+d) % n] - cible.cotes[i]) <= tol
          && Math.abs(m.angles[(i+d) % n] - cible.angles[i]) <= TOL_ANGLE_UNI;
      if (ok) return true;
    }
  }
  return false;
}

function figureAcceptee(poses, solutions, tol, libre, parMesures){
  for (const sol of solutions) {
    if (poses.length !== sol.length) continue;
    /* Les mesures sont déjà invariantes par translation : rien à recaler. */
    if (parMesures) {
      if (memeAssemblage(poses, sol, tol, memesMesures)) return true;
      continue;
    }
    /* Invariance par TRANSLATION seulement, et seulement là où elle a un
       sens : en reproduction et en construction libre, poser la pièce à
       gauche ou à droite est également juste ; en complétion, l’amorce
       fixe la position, il n’y a rien à recaler. Jamais d’invariance par
       rotation : le texte CP impose que les côtés suivent le quadrillage.  */
    let d = [0, 0];
    if (libre) {
      const cp = centre(tousLesPoints(poses)), cs = centre(tousLesPoints(sol));
      d = [cs[0]-cp[0], cs[1]-cp[1]];
    }
    if (memeAssemblage(decaler(poses, d), sol, tol)) return true;
  }
  return false;
}

/* ============================================================
   LE CERCLE SE RATTACHE À LA FIGURE, PAS À UNE COORDONNÉE
   ------------------------------------------------------------
   « Un cercle centré sur un de ses coins » ne dit pas OÙ le cercle va, il dit
   À QUOI il s’accroche. Les positions admissibles étaient pourtant écrites
   d’avance, lues sur la figure de référence : un enfant dont le rectangle
   était accepté mais posé un peu ailleurs voyait son cercle refusé parce
   qu’il l’avait mis au coin de SON rectangle et non au coin du nôtre. Les
   deux imprécisions s’additionnaient contre une coordonnée absolue, et
   c’était la figure la plus cohérente qu’on punissait.
   Le cercle se juge donc sur la figure QUE L’ENFANT A FAITE — les ancres
   admissibles s’y calculent, « un de ses coins » les énumérant toutes — et
   l’écart toléré s’y calcule aussi : LA MOITIÉ DE LA DISTANCE À L’ANCRE
   CONCURRENTE LA PLUS PROCHE, c’est-à-dire le plus grand écart qui ne puisse
   jamais faire prendre un coin pour un autre. Sur un rectangle de 7 sur 4,
   cela vaut deux unités, où la tolérance de mesure en vaut moins d’une
   demie : on ne mesure pas un rattachement, on le reconnaît. */
/* QUAND JUGE-T-ON SUR LES MESURES ? Là où rien n’impose la position ni
   l’orientation : le papier UNI, en construction LIBRE. Sur quadrillage les
   côtés doivent suivre les lignes — le programme le demande — et en
   complétion l’amorce fixe la figure ; dans les deux cas les coordonnées ont
   un sens. La condition se lit donc sur la manche, elle ne s’y déclare pas. */
function jugeParMesures(q){
  return q.support === 'uni' && !!q.libre;
}

function ancresCercle(relation, contour){
  if (!contour || !contour.length) return [];
  return relation === 'centre' ? [centre(contour)] : contour.map(p => p.slice());
}
/* TOUTES LES ANCRES QUE LA FIGURE PROPOSE, quelle que soit la relation
   demandée : ses coins et son milieu. Ce sont les seuls endroits qu’un
   énoncé de ce module désigne, donc les seuls candidats entre lesquels il
   faut trancher. */
function ancresPossibles(contour){
  return contour.map(p => p.slice()).concat([centre(contour)]);
}
/* ON N’AJUSTE PLUS UN RAYON DE TOLÉRANCE : ON ATTRIBUE LE POINT.
   Le cercle posé est rattaché à l’ancre dont il est LE PLUS PROCHE, parmi
   toutes celles que la figure propose ; la manche est réussie si cette ancre
   est de celles que l’énoncé demandait. C’est la plus large acceptation
   possible qui ne confonde encore rien — la cellule de Voronoï de l’ancre —
   et elle a la forme du problème plutôt que celle d’un cercle.
   L’écart consenti n’est donc plus le même dans toutes les directions, et
   c’est précisément ce qu’il fallait : viser le milieu d’un carré sans en
   tracer les diagonales est difficile, et un rayon unique devait rester
   sous la demi-diagonale pour ne pas mordre sur les coins — il bridait donc
   aussi les directions où rien ne concurrençait le milieu. Sur un carré de
   5, on passe de 44 px consentis partout à 62 px vers le milieu des côtés,
   soit la moitié du carré : on peut viser à vue. Vers un coin, la frontière
   reste à mi-chemin, et un cercle posé au coin n’est jamais pris pour un
   cercle posé au milieu. */
function ancreAttribuee(point, contour){
  const cands = ancresPossibles(contour);
  let meilleure = null, d0 = Infinity;
  cands.forEach(a => { const d = dist(point, a); if (d < d0) { d0 = d; meilleure = a; } });
  return meilleure;
}
/* L’ATTRIBUTION NE SUFFIT PAS SEULE, et il a fallu la mesurer pour le voir :
   les cellules des quatre coins PAVENT la figure, si bien qu’un cercle posé
   en plein milieu d’un rectangle serait attribué à un coin — et « au coin »
   accepterait alors n’importe où. L’attribution dit à QUELLE ancre le point
   se rapporte ; il reste à demander qu’il en soit VISIBLEMENT proche, et ce
   « proche » n’a pas la même forme selon la relation :
   — UN COIN est cerné par les autres coins : à moins d’un demi-côté, on est
     à ce coin-là et cela se voit ;
   — LE MILIEU est cerné par les CÔTÉS, pas par une distance : y être, c’est
     être DANS la figure et plus près du milieu que d’un coin. Sur un carré
     de 5, cela va jusqu’au bord au droit des côtés — 62 px, la moitié du
     carré — là où un rayon unique devait s’arrêter à 44 pour ne pas mordre
     sur les coins. Viser le milieu à vue, sans tracer les diagonales,
     redevient possible. */
function dansContour(p, c){
  let dedans = false;
  for (let i = 0, j = c.length - 1; i < c.length; j = i++) {
    const yi = c[i][1], yj = c[j][1];
    if ((yi > p[1]) === (yj > p[1])) continue;
    const x = c[i][0] + (p[1] - yi) / (yj - yi) * (c[j][0] - c[i][0]);
    if (p[0] < x) dedans = !dedans;
  }
  return dedans;
}
function assezPres(relation, point, ancre, contour){
  if (relation === 'centre') return dansContour(point, contour);
  let court = Infinity;
  for (let i = 0; i < contour.length; i++)
    court = Math.min(court, dist(contour[i], contour[(i+1) % contour.length]));
  return dist(point, ancre) <= court / 2;
}
/* Ce que cela vaut EN DISTANCE dans la direction la plus contrainte : lu,
   jamais déclaré — les tests s’en servent pour montrer l’ordre de grandeur,
   le verdict ne s’en sert pas. */
function toleranceRattachement(relation, contour){
  const voulues = ancresCercle(relation, contour);
  const autres = ancresPossibles(contour).filter(a => !voulues.some(v => dist(v, a) < 1e-6));
  let d = Infinity;
  voulues.forEach(v => autres.forEach(a => { d = Math.min(d, dist(v, a)); }));
  return d === Infinity ? PX_PAR_UNITE : d / 2;
}
/* Un rayon LIBRE n’a pas de bonne valeur : l’énoncé n’en donne pas. Il doit
   seulement rester un cercle qu’on voit, et ne pas avaler la figure à
   laquelle il se rattache — deux bornes que la figure elle-même fournit. */
function cercleAccepte(pose, spec, contour, tol){
  if (!pose || !spec) return false;
  const ancres = ancresCercle(spec.relation, contour);
  if (!ancres.length) return false;
  const attribuee = ancreAttribuee(pose.c, contour);
  const bonCentre = !!attribuee && ancres.some(a => dist(a, attribuee) < 1e-6)
    && assezPres(spec.relation, pose.c, attribuee, contour);
  const b = bbox(contour);
  const rMax = Math.max(b.x1 - b.x0, b.y1 - b.y0);
  const bonRayon = spec.r != null
    ? Math.abs(pose.r - spec.r) <= tol
    : (pose.r >= 0.5 * PX_PAR_UNITE && pose.r <= rMax);
  return bonCentre && bonRayon;
}

/* ============================================================
   MOTEUR D’OBJETS POSABLES (repris de M35, inchangé)
   ------------------------------------------------------------
   Le corps translate, une POIGNÉE en bout fait tourner. Jamais de rotation
   à deux doigts — indécouvrable pour un enfant et incompatible avec le
   défilement de la page. La conversion écran → SVG passe par l’inverse de
   getScreenCTM() : un delta de pixels serait faux dès que le viewBox est
   mis à l’échelle, ce qui est le cas sur tout téléphone.

   AJOUT PROPRE À M38 : l’instrument publie des ANCRES, ses graduations
   exprimées dans le repère de la scène. Sur papier uni, elles sont ce qui
   rend la précision atteignable — poser un point contre le trait du 7,
   exactement comme sur la table de l’atelier.
   ============================================================ */
function versSVG(svg, clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const m = svg.getScreenCTM();
  if (!m) return {x:clientX, y:clientY};
  const q = pt.matrixTransform(m.inverse());
  return {x:q.x, y:q.y};
}
function creerPosable(hote, spec){
  /* `hote` peut être un groupe : la conversion écran → SVG, elle, vise
     toujours l’élément <svg> racine. */
  const svg = hote.ownerSVGElement || hote;
  let x = spec.x, y = spec.y, a = spec.angle || 0;
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'posable');
  const po = spec.poignee;
  g.innerHTML = spec.corps
    + (po ? `<circle class="poignee-halo" cx="${po[0]}" cy="${po[1]}" r="24"/>`
          + `<circle class="poignee" cx="${po[0]}" cy="${po[1]}" r="11"/>`
          + `<path class="poignee-fleche" d="M ${po[0]-5} ${po[1]-1.5} a 5 5 0 1 1 1.7 3.6"/>` : '');
  hote.appendChild(g);

  /* LE PIVOT N’EST PAS LE MILIEU DE L’INSTRUMENT — c’est le point par lequel
     il est TENU. `rotate()` tourne autour de l’origine locale de l’habillage,
     et la règle, dessinée de −L/2 à +L/2, tournait donc autour de son milieu :
     posée par son 0 sur un sommet, elle en glissait dès le premier degré, et
     le calage qu’on venait de faire était perdu. Deux règles, dans cet ordre :
     — si une graduation est AIMANTÉE sur un point dessiné, c’est ELLE le
       pivot : on cale la règle sur un coin, puis on la fait tourner autour ;
       c’est le geste réel, et c’est ce qui rend le calage utile ;
     — sinon, l’instrument pivote par le point que son habillage désigne —
       une EXTRÉMITÉ pour la règle, le coin pour l’équerre —, jamais par un
       milieu que rien ne matérialise. */
  let pivotLocal = ((spec.pivotParDefaut || [0, 0])).slice();
  const versMonde = (p, ax, ay, aa) => {
    const co = Math.cos(aa), si = Math.sin(aa);
    return [ax + p[0]*co - p[1]*si, ay + p[0]*si + p[1]*co];
  };
  const pivotMonde = () => versMonde(pivotLocal, x, y, a);
  const etat = () => ({x, y, angle:a, pivot:pivotMonde()});
  function appliquer(){
    g.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${(a*180/Math.PI).toFixed(2)})`);
    if (spec.surChangement) spec.surChangement(etat(), g);
  }
  /* Les ancres locales de l’habillage, transportées dans le repère de la
     scène par la transformation courante. */
  function ancres(){
    const co = Math.cos(a), si = Math.sin(a);
    return (spec.ancresLocales || []).map(p => [x + p[0]*co - p[1]*si, y + p[0]*si + p[1]*co]);
  }

  /* UN INSTRUMENT NE CONSOMME QUE LES GLISSEMENTS, jamais les taps. Il
     couvre une large part du panneau, et c’est précisément là qu’on veut
     poser des points : sur une graduation, à la longueur qu’on vient de
     mesurer. Tant que l’instrument coupait la propagation dès le
     `pointerdown`, tout tap tombant sur son corps était perdu — le sommet
     n’apparaissait pas, sans que rien ne l’explique, et la règle ne servait
     plus qu’à regarder. « Placer un point sur n’importe quelle mesure de
     l’équerre » n’est donc pas une fonctionnalité à ajouter : c’est ce que
     l’aimantation aux ancres fait déjà, à condition que le tap ARRIVE.
     UN SEUL SEUIL DÉPARTAGE les deux gestes, `SEUIL_GLISSEMENT`, le même que
     `brancherPose` — deux seuils différents rouvriraient la zone grise où
     l’instrument bouge ET un point se pose. En dessous : personne ne bouge,
     le tap traverse, le point s’aimante sur la graduation la plus proche.
     Au-dessus : l’instrument prend la main, et `brancherPose` a vu passer
     les mêmes mouvements, donc renonce de lui-même. Rien n’est intercepté :
     c’est l’accord des deux seuils qui garantit qu’un seul agit. */
  let mode = null, depart = null, attente = null;
  const surDown = (e) => {
    if (g.dataset.verrouille === '1') return;
    const p = versSVG(svg, e.clientX, e.clientY);
    const surPoignee = /^poignee/.test(e.target.getAttribute('class') || '');
    mode = null;
    attente = {
      mode: surPoignee ? 'rot' : 'trans',
      cx: e.clientX, cy: e.clientY,
      depart: surPoignee
        ? (() => { const P = pivotMonde();
            return {a0: a, ang0: Math.atan2(p.y - P[1], p.x - P[0])}; })()
        : {dx: p.x - x, dy: p.y - y}
    };
    /* La capture est prise tout de suite : elle ne coupe pas la propagation
       (l’événement continue de remonter jusqu’au <svg>), elle garantit
       seulement que le glissement suivra le doigt même s’il quitte
       l’instrument. */
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  };
  /* L’INSTRUMENT S’AIMANTE AUX POINTS DÉJÀ DESSINÉS. Sans cela il ne sert à
     rien : une équerre dont le coin tombe à trois pixels du sommet ne dit pas
     si l’angle est droit, elle donne une impression. C’est le geste réel — on
     cale l’instrument SUR un point, on ne le pose pas à côté.
     N’IMPORTE QUELLE GRADUATION s’aimante, pas seulement l’origine : poser le
     7 de la règle sur un sommet est aussi légitime que d’y poser le 0, et
     c’est ainsi qu’on mesure. On retient le rapprochement le plus court, et
     l’aimantation ne joue qu’en TRANSLATION — pendant une rotation, l’enfant
     cherche une direction, pas une position. */
  function aimanter(){
    const cibles = (spec.aimants && spec.aimants()) || [];
    if (!cibles.length) return;
    const co = Math.cos(a), si = Math.sin(a);
    let meilleur = null, meilleurLoc = null, d0 = AIMANT_INSTRUMENT;
    (spec.ancresLocales || []).forEach(loc => {
      const w = [x + loc[0]*co - loc[1]*si, y + loc[0]*si + loc[1]*co];
      cibles.forEach(c => {
        const d = Math.hypot(c[0]-w[0], c[1]-w[1]);
        if (d < d0) { d0 = d; meilleur = [c[0]-w[0], c[1]-w[1]]; meilleurLoc = loc; }
      });
    });
    /* La graduation qui accroche devient le pivot ; si rien n’accroche, on
       revient au point de tenue de l’habillage. Le pivot suit donc le
       CALAGE, il n’est jamais une propriété figée de l’instrument. */
    if (meilleur) { x += meilleur[0]; y += meilleur[1]; pivotLocal = meilleurLoc.slice(); }
    else pivotLocal = ((spec.pivotParDefaut || [0, 0])).slice();
  }
  /* EN ROTATION, C’EST L’ANGLE QUI S’AIMANTE, pas la position — et c’est bien
     un autre mécanisme. Déplacer l’instrument pendant qu’on l’oriente le
     ferait sauter sous le doigt ; en revanche, chercher à l’œil l’instant où
     son bord passe pile par un sommet est impossible au degré près. On aligne
     donc un BORD sur un point déjà dessiné : c’est le geste réel — on fait
     pivoter l’équerre jusqu’à ce que son côté tombe sur le coin d’en face.
     Les directions des bords se lisent sur les ancres, comme les positions :
     l’instrument n’a pas à déclarer deux fois sa forme. */
  function directionsLocales(){
    const vues = new Set(), dirs = [];
    /* Les bords se lisent DEPUIS LE PIVOT : c’est autour de lui que tout
       tourne, donc c’est de lui que partent les directions qu’on aligne. */
    (spec.ancresLocales || []).forEach(l0 => {
      const l = [l0[0] - pivotLocal[0], l0[1] - pivotLocal[1]];
      const n = Math.hypot(l[0], l[1]);
      if (n < 1e-6) return;
      const u = [l[0]/n, l[1]/n];
      const cle = u[0].toFixed(3) + ',' + u[1].toFixed(3);
      if (vues.has(cle)) return;
      vues.add(cle); dirs.push(Math.atan2(u[1], u[0]));
    });
    return dirs;
  }
  function aimanterAngle(brut, P){
    const cibles = (spec.aimants && spec.aimants()) || [];
    const dirs = directionsLocales();
    if (!cibles.length || !dirs.length) return brut;
    let meilleur = brut, d0 = AIMANT_ANGLE;
    cibles.forEach(c => {
      const vers = Math.atan2(c[1] - P[1], c[0] - P[0]);
      if (Math.hypot(c[0] - P[0], c[1] - P[1]) < 1e-6) return;
      dirs.forEach(u => {
        /* L’angle qu’il faudrait pour que ce bord pointe sur ce point. */
        let cand = vers - u;
        let ecart = cand - brut;
        while (ecart > Math.PI) { cand -= 2*Math.PI; ecart -= 2*Math.PI; }
        while (ecart < -Math.PI) { cand += 2*Math.PI; ecart += 2*Math.PI; }
        if (Math.abs(ecart) < d0) { d0 = Math.abs(ecart); meilleur = cand; }
      });
    });
    return meilleur;
  }
  const surMove = (e) => {
    if (!mode) {
      if (!attente) return;
      if (Math.hypot(e.clientX - attente.cx, e.clientY - attente.cy) <= SEUIL_GLISSEMENT) return;
      mode = attente.mode; depart = attente.depart;
      g.classList.add('saisi');
    }
    const p = versSVG(svg, e.clientX, e.clientY);
    if (mode === 'trans') { x = p.x - depart.dx; y = p.y - depart.dy; aimanter(); }
    else {
      /* Le pivot est le seul point qui NE BOUGE PAS : on note où il est,
         on tourne, puis on rattrape la translation que la rotation autour
         de l’origine lui a fait subir. Sans ce rattrapage, tourner
         déplacerait la graduation qu’on venait de caler sur un sommet. */
      const P = pivotMonde();
      const brut = depart.a0 + (Math.atan2(p.y - P[1], p.x - P[0]) - depart.ang0);
      a = aimanterAngle(brut, P);
      const apres = versMonde(pivotLocal, x, y, a);
      x += P[0] - apres[0]; y += P[1] - apres[1];
    }
    appliquer();
    e.preventDefault();
  };
  const surUp = (e) => {
    mode = null; attente = null; g.classList.remove('saisi');
    try { g.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  g.addEventListener('pointerdown', surDown);
  g.addEventListener('pointermove', surMove);
  g.addEventListener('pointerup', surUp);
  g.addEventListener('pointercancel', surUp);

  appliquer();
  return {
    g, etat, ancres,
    verrouiller(){ g.dataset.verrouille = '1'; g.style.cursor = 'default'; }
  };
}

/* ---- Habillages. Corps ET poignée vont ensemble : un instrument sans
   poignée ne peut être que translaté, donc jamais orienté, donc jamais
   posé. ---- */
const REGLE_GRADUEE = (nbUnites) => {
  const L = nbUnites * PX_PAR_UNITE;
  let g = '', anc = [];
  for (let u = 0; u <= nbUnites; u++) {
    const px = -L/2 + u*PX_PAR_UNITE;
    g += `<line class="grad" x1="${px}" y1="0" x2="${px}" y2="${u % 5 === 0 ? 13 : 8}"/>`;
    if (u % 5 === 0) g += `<text class="grad-txt" x="${px}" y="24" text-anchor="middle">${u}</text>`;
    anc.push([px, 0]);
  }
  return {
    corps: `<rect class="corps" x="${-L/2}" y="0" width="${L}" height="30" rx="4"/>`
         + `<line class="bord" x1="${-L/2}" y1="0" x2="${L/2}" y2="0"/>` + g,
    poignee: [L/2 - 26, 46],
    ancresLocales: anc,
    /* LE POINT DE TENUE DE LA RÈGLE EST SON ZÉRO, à l’autre bout de la
       poignée : on tient la règle par une extrémité et on balaie avec
       l’autre. Dessinée de −L/2 à +L/2, son origine locale tombait en son
       milieu, et elle tournait donc autour d’un point que rien ne montre. */
    pivotParDefaut: [-L/2, 0],
    /* Encombrement sous l’origine, poignée et son halo compris : sans lui,
       l’instrument se gare à cheval sur le bord et arrive tronqué. */
    encombrement: 74, demiLargeur: L/2
  };
};
const EQUERRE_GRADUEE = (nbUnites) => {
  const L = nbUnites * PX_PAR_UNITE;
  let g = '', anc = [];
  for (let u = 0; u <= nbUnites; u++) {
    const d = u*PX_PAR_UNITE;
    g += `<line class="grad" x1="${d}" y1="0" x2="${d}" y2="6"/>`
       + `<line class="grad" x1="0" y1="${d}" x2="6" y2="${d}"/>`;
    anc.push([d, 0], [0, d]);
  }
  return {
    corps: `<path class="corps" d="M 0 0 L ${L} 0 L 0 ${L} Z"/>`
         + `<line class="bord" x1="0" y1="0" x2="${L}" y2="0"/>`
         + `<line class="bord" x1="0" y1="0" x2="0" y2="${L}"/>` + g,
    poignee: [L*0.36, L*0.36],
    ancresLocales: anc,
    encombrement: L + 6, demiLargeur: L/2
  };
};

/* ============================================================
   FIGURES — décrites en MAILLES (CP, CE1) ou en UNITÉS (CE2 uni)
   ============================================================ */
const carre = (c) => [[0,0],[c,0],[c,c],[0,c]];
const rectangle = (l, h) => [[0,0],[l,0],[l,h],[0,h]];
const triangleRect = (a, b) => [[0,0],[a,0],[0,b]];
const triangle = (a, b, sx, sy) => [[0,0],[a,0],[sx,sy]];
/* Carré posé de biais : son côté est le vecteur (p, q). p=q donne 45°,
   (2,1) et (3,1) les pentes que le CE1 doit apprendre à compter. */
const carreOblique = (p, q) => [[0,0],[p,q],[p-q,q+p],[-q,p]];
const rectangleOblique = (p, q, k) => [[0,0],[p,q],[p-k*q,q+k*p],[-k*q,k*p]];

const translater = (c, dx, dy) => c.map(p => [p[0]+dx, p[1]+dy]);
const versSceneContour = (z, c) => c.map(p => versScene(z, p[0], p[1]));
const bbox = (pts) => ({
  x0:Math.min(...pts.map(p=>p[0])), x1:Math.max(...pts.map(p=>p[0])),
  y0:Math.min(...pts.map(p=>p[1])), y1:Math.max(...pts.map(p=>p[1]))
});
/* Place un assemblage décrit en mailles dans une zone, à une position
   tirée au sort mais ENTIÈREMENT CONTENUE — y compris quand l’appelant
   impose l’offset. Un offset écrit à la main a été calibré sur la taille
   qu’avait la zone ce jour-là : `cp-assembler` posait son assemblage en
   (1,1), ce qui débordait d’une maille dès que le panneau est passé de sept
   rangées à six. La zone est seule à connaître sa taille, c’est donc elle
   qui borne, et un débordement silencieux cesse d’être exprimable. */
function poserDansZone(z, contours, gx, gy){
  const b = bbox(tousLesPoints(contours));
  const jeu = (n, taille) => Math.max(0, n - taille);
  const cadrer = (g, n, taille) => Math.max(0, Math.min(g, jeu(n, taille)));
  const w = b.x1 - b.x0, h = b.y1 - b.y0;
  const dx = (gx === undefined ? Math.round(entre(0, jeu(z.nx, w))) : cadrer(gx, z.nx, w)) - b.x0;
  const dy = (gy === undefined ? Math.round(entre(0, jeu(z.ny, h))) : cadrer(gy, z.ny, h)) - b.y0;
  return contours.map(c => versSceneContour(z, translater(c, dx, dy)));
}

   STOCKAGE (CHARTE §9, §11, §15)

const CLE_STOCKAGE = 'mayeutik-m38-montage-etoiles';

  if (memoireEtoiles === null) {

    try { const b = localStorage.getItem(CLE_STOCKAGE); if (b) memoireEtoiles = JSON.parse(b); } catch(e){ memoireEtoiles = {}; }
  }

}
function enregistrerEtoiles(id, v){
  const t = lireEtoiles(); t[id] = Math.max(t[id] || 0, v); memoireEtoiles = t;
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(t)); } catch(e){}
}
const CLE_BONUS_REVELE = 'mayeutik-m38-bonus-revele';

const CLE_PROFILS = 'mayeutik-profils', CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';

const CLE_SESSIONS = 'mayeutik-sessions', MODULE_ID = 'M38', MAX_SESSIONS = 500;

function enregistrerSession(comp, score, total, duree){

  t.push({profilId:pid, module:MODULE_ID, competence:comp, score, total, date:new Date().toISOString(), duree});
  let n = 0;
  for (let i = t.length - 1; i >= 0; i--) if (t[i].profilId === pid) { n++; if (n > MAX_SESSIONS) t.splice(i, 1); }
  memoireSessions = t;
  try { localStorage.setItem(CLE_SESSIONS, JSON.stringify(t)); } catch(e){}
}
const SEUIL_MAITRISE = 0.8;
function palierMaitrise(nom){
  const p = CONTENU.paliers[nom];
  if (!p) return false;
  const pid = lireProfilActifId();
  const s = lireSessions().filter(x => x.profilId === pid && x.module === MODULE_ID);
  return p.miniJeux.every(mj => {
    const l = s.filter(x => x.competence === mj.id);
    if (!l.length) return false;
    const d = l[l.length - 1];
    return d.total > 0 && d.score / d.total >= SEUIL_MAITRISE;
  });
}
function palierSuivant(nom){

}

    o.connect(g); g.connect(actx.destination);

  } catch(e){}
}
