   ============================================================ */
function segSvg(k, classe, couleurTrait){
  const [a, b] = bouts(k);
  return '<line class="' + classe + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"'
    + (couleurTrait ? ' stroke="' + couleurTrait + '"' : '') + '/>';
}
let segmentVise = null, colorierDedans = false;

/* L’intérieur colorié, en SVG. La couleur part de l’axe : le retard de
   chaque triangle croît avec sa distance à l’axe, donc la teinte se répand
   vers les bords à mesure que le pli se rouvre. */
function dedansSvg(q){
  const murs = new Set([...q.pre, ...traces.keys()]);
  const tris = trianglesInterieurs(murs);
  if (!tris.length) return '';
  const vertical = q.fig.axe === 'v';
  const dist = (t) => {
    const c = (t[0][vertical?0:1] + t[1][vertical?0:1] + t[2][vertical?0:1]) / 3;
    return Math.abs(c - (vertical ? AXE_V : AXE_H));
  };
  const dMax = Math.max(1e-6, ...tris.map(dist));
  return '<g class="dedans">' + tris.map(t =>
    '<polygon points="' + t.map(p => p[0] + ',' + p[1]).join(' ')
    + '" fill-opacity=".34" style="animation-delay:' + (dist(t) / dMax * ECLOSION_ETALEMENT_MS / 1000).toFixed(3) + 's"/>'
  ).join('') + '</g>';
}

/* `garder` choisit les traits à encrer. Le plan les prend tous ; le calque
   du rabat ne prend que ceux de la moitié de référence. Un seul dessinateur
   pour les deux : deux rendus indépendants finiraient par diverger. */
function dessinPlan(q, garder){
  let s = '';
  for (let i = 0; i <= NX; i++) s += '<line class="maille" x1="' + i + '" y1="0" x2="' + i + '" y2="' + NY + '"/>';
  for (let j = 0; j <= NY; j++) s += '<line class="maille" x1="0" y1="' + j + '" x2="' + NX + '" y2="' + j + '"/>';
  if (colorierDedans) s += dedansSvg(q);
  /* L’AXE COURT SUR TOUTE LA VUE, pas seulement sur le quadrillage : un axe
     de symétrie est une DROITE, et l’arrêter au bord du plan le fait lire
     comme un segment appartenant à la figure. */
  const [vx, vy, vl, vh] = VUE;
  s += q.fig.axe === 'v'
    ? '<line class="axe" x1="' + AXE_V + '" y1="' + vy + '" x2="' + AXE_V + '" y2="' + (vy+vh) + '"/>'
    : '<line class="axe" x1="' + vx + '" y1="' + AXE_H + '" x2="' + (vx+vl) + '" y2="' + AXE_H + '"/>';
  if (segmentVise && !mancheFinie && garder(segmentVise)) s += segSvg(segmentVise, 'vise');
  [...q.pre].forEach(k => { if (garder(k)) s += segSvg(k, 'pre'); });
  traces.forEach((c, k) => { if (garder(k)) s += segSvg(k, 'trace', c); });
  return s;
}

function rendrePlan(){
  const q = file[pos];
  $('grille').innerHTML = dessinPlan(q, () => true);
  /* LE CALQUE N’EMPORTE QUE SON ENCRE. Lui donner l’image entière et la
     rogner au CSS ne suffit pas : les traits ont des bouts arrondis qui
     DÉBORDENT de l’axe, si bien que le calque gardait un croissant de la
     couleur d’en face — rabattu, ce croissant retombait par-dessus tout, et
     l’on croyait à un mauvais recouvrement. Le filtre coupe par segment, là
     où la découpe CSS coupe par pixel. */
  const r = $('rabat');
  if (r.getAttribute('viewBox') !== VUE.join(' ')) r.setAttribute('viewBox', VUE.join(' '));
  const axe = q.fig.axe;
  r.innerHTML = dessinPlan(q, (k) =>
    /* Un segment POSÉ SUR L’AXE est son propre miroir : il appartient aux
       deux moitiés, et le calque l’emporte aussi — sinon il se montrerait
       en demi-épaisseur pendant tout le pli. */
    estDuCoteReference(k, axe) || reflechirSeg(k, axe) === k);
}

/* ============================================================
   LE GESTE : LE DOIGT DÉSIGNE, IL NE DESSINE PAS
   ------------------------------------------------------------
   À chaque position du doigt on cherche le segment LÉGAL le plus proche,
   et c’est ce segment idéal qui s’inscrit — jamais la trajectoire. La
   précision de la main n’entre donc pas dans la figure obtenue.

   Le tracé se distingue d’un simple appui par un SEUIL DE DÉPLACEMENT,
   jamais par une temporisation : un appui pose un segment, un glissement
   en pose une suite.
   ============================================================ */
const SEUIL_GESTE = 6;          // px écran
const RAYON_ACCROCHE = 0.42;    // en mailles, pour l’appui simple
const RAYON_NOEUD = 0.40;       // en mailles, pour atteindre un nœud

function distanceAuSegment(p, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx + dy*dy;
  if (L2 < 1e-9) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0]-a[0]-dx*t, p[1]-a[1]-dy*t);
}
/* LE CENTRE D’UNE CELLULE EST À DISTANCE NULLE DE SES DEUX DIAGONALES : la
   seule distance ne peut donc pas trancher là, et le doigt qui passe au
   milieu obtiendrait une diagonale au hasard. Quand le geste a une
   DIRECTION — c’est-à-dire dès qu’on glisse —, on départage les candidats
   à égalité par celui qui lui est le plus parallèle : on trace la diagonale
   qu’on suit, pas sa jumelle. Un appui simple n’a pas de direction ; il
   reste ambigu au centre exact, et nulle part ailleurs. */
const EGALITE = 0.02;
function segmentLePlusProche(p, dir){
  let d0 = Infinity;
  const proches = [];
  for (const k of SEGMENTS) {
    const [a, b] = bouts(k);
    /* Rejet rapide : inutile de mesurer un segment à l’autre bout du plan. */
    if (Math.min(a[0],b[0]) - p[0] > 1 || p[0] - Math.max(a[0],b[0]) > 1) continue;
    if (Math.min(a[1],b[1]) - p[1] > 1 || p[1] - Math.max(a[1],b[1]) > 1) continue;
    const d = distanceAuSegment(p, a, b);
    if (d < d0 - EGALITE) { d0 = d; proches.length = 0; proches.push(k); }
    else if (d <= d0 + EGALITE) { d0 = Math.min(d0, d); proches.push(k); }
  }
  if (d0 > RAYON_ACCROCHE || !proches.length) return null;
  if (proches.length === 1 || !dir) return proches[0];
  const n = Math.hypot(dir[0], dir[1]) || 1;
  let meilleur = proches[0], score = -Infinity;
  proches.forEach(k => {
    const [a, b] = bouts(k);
    const L = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1;
    const cos = Math.abs(((b[0]-a[0])*dir[0] + (b[1]-a[1])*dir[1]) / (L*n));
    if (cos > score) { score = cos; meilleur = k; }
  });
  return meilleur;
}
function versPlan(clientX, clientY){
  const svg = $('grille'), m = svg.getScreenCTM();
  if (!m) return null;
  const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
  const q = pt.matrixTransform(m.inverse());
  return [q.x, q.y];
}

/* Renvoie `true` quand le segment vient RÉELLEMENT d’être posé — le retour
   arrière du geste s’appuie là-dessus pour n’effacer que ce qu’il a écrit,
   jamais du pré-rempli ni un trait déjà là avant le geste. */
/* ------------------------------------------------------------
   LA GOMME FROTTE, LE FEUTRE SUIT LES NŒUDS
   ------------------------------------------------------------
   Le crayon avance de nœud en nœud : c’est ce qui rend le tracé sûr. Mais
   la gomme empruntait le même chemin, et il fallait donc REPASSER un trait
   pour l’effacer. Ce n’est pas ainsi qu’on gomme : l’enfant frotte, en
   rayures perpendiculaires à ce qu’il veut faire disparaître.

   La gomme travaille donc par PROXIMITÉ — tout trait qu’elle croise s’en
   va. Le danger qui interdisait la proximité au crayon (le doigt qui
   traverse une cellule ramasse ses diagonales) n’existe pas ici : la gomme
   ne peut toucher que ce que l’enfant a lui-même tracé, et un trait effacé
   par mégarde se retrace. Deux outils, deux gestes, comme les vrais.
   ------------------------------------------------------------ */
const RAYON_GOMME = 0.28;      // en mailles
function frotter(p){
  if (mancheFinie) return;
  const q = file[pos];
  const partis = [];
  /* Le pré-rempli n’a pas à être écarté ici : il n’entre jamais dans
     `traces`, `appliquer` étant le seul à y écrire et le refusant. Une
     seconde garde à cet endroit serait une seconde vérité, invérifiable. */
  traces.forEach((c, k) => {
    const [a, b] = bouts(k);
    if (distanceAuSegment(p, a, b) <= RAYON_GOMME) partis.push(k);
  });
  if (!partis.length) return;
  partis.forEach(k => { traces.delete(k); });
  gommages += partis.length;
  sonGomme();
  rendrePlan();
  verifierComplete();
}

function appliquer(k){
  const q = file[pos];
  if (!k || mancheFinie) return false;
  if (q.pre.has(k)) return false;           // le pré-rempli n’est ni effaçable ni redessinable
  if (outil === 'gomme') {
    if (traces.has(k)) { traces.delete(k); gommages++; sonGomme(); rendrePlan(); verifierComplete(); }
    return false;
  }
  if (traces.has(k)) return false;          // déjà tracé : on ne repasse pas
  traces.set(k, couleur);
  sonTrait();
  rendrePlan();
  verifierComplete();
  return true;
}
/* Retirer un segment que le geste en cours vient de poser. On n’appelle
   ceci que sur un pas dont `appliquer` a signalé qu’il avait écrit : la
   clé est donc présente, inutile de le revérifier. */
function retirerDuGeste(k){
  if (mancheFinie) return;
  traces.delete(k);
  sonGomme();
  rendrePlan();
}

/* ------------------------------------------------------------
   MOTEUR JUMEAU DANS `jeux/M38-reproduire-construire.html`, VOLONTAIREMENT
   DUPLIQUÉ — voir `docs/corrections/CORRECTIONS-M38-moteur-quadrillage.md`
   §4. Toute correction de comportement est à examiner dans les deux.

   Ce qui diverge là-bas : M38 doit tracer des obliques 2/1 et 3/1, que le
   chemin de nœuds refuse par conception, et son intérieur se calcule sur
   les faces de l’arrangement au lieu des quarts de cellule. Sa maille est
   aussi plus petite (30,3 px contre 39,3 ici — il y empile deux panneaux, le
   modèle et le travail), donc ses rayons ne sont pas les mêmes nombres. Les
   tests des deux modules sont indépendants.
   ------------------------------------------------------------ */

/* ------------------------------------------------------------
   LE TRAIT SUIT UN CHEMIN DE NŒUDS, il ne ramasse pas ce qu’il frôle.
   ------------------------------------------------------------
   Première version : à chaque position du doigt on allumait le segment le
   plus proche. Testée à l’appareil, elle s’est révélée fausse — un enfant
   ne tape pas case par case, il GLISSE. Or un doigt qui glisse traverse
   l’intérieur des cellules, et là le segment le plus proche est une
   diagonale : le trait voulu arrivait noyé sous une résille de croix.

   Le bon modèle est celui du crayon sur papier quadrillé : on part d’un
   nœud, et on ne peut aller qu’à un nœud VOISIN — les huit voisins sont
   exactement les segments légaux. Le doigt qui dérive au milieu d’une
   cellule ne trace donc rien tant qu’il n’a pas atteint un nœud, et le
   tracé reste un trait continu au lieu d’un ramassage.
   ------------------------------------------------------------ */
function noeudProche(p){
  const x = Math.round(p[0]), y = Math.round(p[1]);
  if (x < 0 || x > NX || y < 0 || y > NY) return null;
  return Math.hypot(p[0]-x, p[1]-y) <= RAYON_NOEUD ? [x, y] : null;
}
const memeNoeud = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];
const voisins = (a, b) => {
  const dx = Math.abs(a[0]-b[0]), dy = Math.abs(a[1]-b[1]);
  return dx <= 1 && dy <= 1 && dx + dy > 0;
};

(function brancherTrace(){
  const svg = $('grille');
  let actif = false, depart = null, bouge = false, dernier = null, noeud = null;
  /* L’outil est figé à l’appui : un geste garde le sens qu’il avait en
     commençant, comme dans l’autre mini-jeu. */
  let outilDuGeste = 'feutre';
  /* Le chemin parcouru depuis le début du geste, et pour chaque pas si ce
     pas a posé un segment. C’est ce qui permet le RETOUR ARRIÈRE : revenir
     sur ses pas efface ce que l’on vient d’écrire, sans changer d’outil.
     On n’efface qu’un pas dont on est l’auteur — d’où le drapeau, et non
     une simple recherche dans `traces`. */
  let chemin = [], poses = [];
  const repartirDe = (n) => { noeud = n; chemin = n ? [n] : []; poses = []; };
  const traiter = (p) => {
    const n = noeudProche(p);
    if (!n) return;
    if (!noeud) { repartirDe(n); return; }
    if (memeNoeud(n, noeud)) return;
    /* Un nœud non voisin veut dire que le doigt a sauté — on s’y replace
       sans rien tracer plutôt que d’inventer un segment. */
    if (!voisins(noeud, n)) { repartirDe(n); return; }
    if (chemin.length >= 2 && memeNoeud(n, chemin[chemin.length - 2])) {
      if (poses.pop()) retirerDuGeste(cle(noeud, n));
      chemin.pop();
    } else {
      poses.push(appliquer(cle(noeud, n)));
      chemin.push(n);
    }
    noeud = n;
  };
  svg.addEventListener('pointerdown', (e) => {
    if (mancheFinie) return;
    actif = true; bouge = false;
    outilDuGeste = outil;
    depart = [e.clientX, e.clientY];
    dernier = versPlan(e.clientX, e.clientY);
    repartirDe(dernier ? noeudProche(dernier) : null);
    if (outilDuGeste === 'gomme' && dernier) frotter(dernier);
    try { svg.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove', (e) => {
    if (!actif) return;
    const p = versPlan(e.clientX, e.clientY);
    if (!p) return;
    if (!bouge && Math.hypot(e.clientX - depart[0], e.clientY - depart[1]) < SEUIL_GESTE) {
      /* Sous le seuil, on ne trace pas encore : on montre seulement ce qu’on
         viserait. Le seuil, et non une durée, sépare l’appui du glissement. */
      const k = segmentLePlusProche(p, null);
      if (k !== segmentVise) { segmentVise = k; rendrePlan(); }
      return;
    }
    bouge = true;
    /* Un doigt rapide franchit plusieurs nœuds entre deux événements : on
       échantillonne le chemin pour ne manquer aucun passage. */
    if (dernier) {
      const dx = p[0]-dernier[0], dy = p[1]-dernier[1];
      const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.2));
      const pas = outilDuGeste === 'gomme' ? frotter : traiter;
      for (let i = 1; i <= n; i++) pas([dernier[0] + dx*i/n, dernier[1] + dy*i/n]);
    }
    dernier = p;
    e.preventDefault();
  });
  const relacher = (e) => {
    if (!actif) return;
    actif = false;
    const p = versPlan(e.clientX, e.clientY);
    /* L’appui SIMPLE garde l’accrochage au segment le plus proche : c’est le
       recours de précision quand un seul trait manque, et il n’a pas de
       trajectoire qui puisse déraper. */
    /* L’appui SIMPLE garde l’accrochage au segment le plus proche, pour les
       deux outils : c’est le recours de précision quand un seul trait est
       en cause. */
    if (!bouge && p) { const k = segmentLePlusProche(p, null); if (k) appliquer(k); }
    repartirDe(null); segmentVise = null;
    rendrePlan();
    try { svg.releasePointerCapture(e.pointerId); } catch(err){}
  };
  svg.addEventListener('pointerup', relacher);
  svg.addEventListener('pointercancel', relacher);
})();

/* ============================================================
   DÉTECTION DE LA COMPLÉTION (pas de bouton Valider)
   ------------------------------------------------------------
   La figure est complète quand l’ensemble tracé est EXACTEMENT
   l’ensemble attendu — ni moins, ni plus. Un segment en trop empêche
   donc la complétion : c’est à cela que sert la gomme, et c’est
   cohérent avec le §18, le retour arrière AVANT validation étant
   légitime — ici il n’y a pas d’après.

   LA COULEUR NE PORTE AUCUN SENS : un segment tracé en vert ou en rose
   compte comme un segment tracé. On ne compare que des clés.
   ============================================================ */
/* LA FIGURE EST ACHEVÉE QUAND ELLE EST SYMÉTRIQUE, non quand elle est
   CONFORME AU MODÈLE. La première règle exigeait l’ensemble attendu
   exactement, ni plus ni moins : un enfant qui ajoutait deux traits de part
   et d’autre de l’axe se voyait refuser une figure pourtant symétrique. Or
   c’est la symétrie qui était demandée, pas la ressemblance à un modèle
   qu’il n’a jamais vu.

   Deux conditions. Le tracé contient TOUT CE QUI MANQUAIT — le minimum —,
   et l’ensemble dessiné est STABLE PAR LA RÉFLEXION. La seconde suffirait
   aujourd’hui à impliquer la première, puisque aucune paire miroir n’est
   effacée des deux côtés à la fabrication ; on énonce quand même les deux,
   parce que c’est ce que l’on exige et que cela tiendra si la fabrication
   change. Un contrôle vérifie que l’implication est bien vraie. */
function verifierComplete(){
  const q = file[pos];
  for (const k of q.aTracer) if (!traces.has(k)) return false;
  const dessin = new Set([...q.pre, ...traces.keys()]);
  for (const k of dessin) if (!dessin.has(reflechirSeg(k, q.fig.axe))) return false;
  reussir();
  return true;
}

/* ============================================================
   LA FÊTE DE LA RÉUSSITE, EN TROIS TEMPS
   ------------------------------------------------------------
   La moitié se rabat, elle reste POSÉE sur sa jumelle le temps qu’on voie
   la superposition, puis elle revient — et c’est à son retour, pas à une
   date calculée depuis le début du mouvement, que l’intérieur se colorie.
   Les trois temps s’enchaînent sur `animationend` : le code attend un
   ÉVÉNEMENT, il ne compte pas les millisecondes du CSS en parallèle.

   POURQUOI CE N’EST PAS QU’UNE QUESTION DE JOLIESSE : le §20 arme l’avance
   automatique « 2 s après l’affichage du bouton Suivant », en s’appuyant
   sur le fait que l’enfant a DÉJÀ vu son résultat quand le bouton paraît.
   Ici c’est faux : au moment où le bouton paraît, la récompense commence.
   On compte donc les 2 secondes du §20 à partir de la FIN de la fête. Le
   clic manuel, lui, reste disponible et immédiat dès le premier instant :
   l’enfant garde la main sur le rythme, exactement comme le §20 le veut.
   ============================================================ */
const POSE_MS = 620;                  // temps où la moitié reste posée
const ECLOSION_ETALEMENT_MS = 450;    // retard du triangle le plus éloigné de l’axe
const MS_CSS = (v) => { v = String(v).trim(); return parseFloat(v) * (/ms$/.test(v) ? 1 : 1000); };
const dureeCss = (nom) => MS_CSS(getComputedStyle(document.documentElement).getPropertyValue(nom));
const mouvementReduit = () => window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let minuteriesPli = [];
function arreterPli(){
  minuteriesPli.forEach(clearTimeout);
  minuteriesPli = [];
  $('rabat').onanimationend = null;   // un seul emplacement : rien ne s’accumule
  $('plan').classList.remove('rabat-v', 'rabat-h', 'aller', 'retour');
}

function reussir(){
  mancheFinie = true;
  score += 2;
  file[pos]._ok = true;
  segmentVise = null;
  rendrePlan();
  const plan = $('plan'), rabat = $('rabat');
  const pli = file[pos].fig.axe === 'v' ? 'rabat-v' : 'rabat-h';
  arreterPli();
  sonBonneReponse(); lancerConfettis(30);
  message('La figure est complète !', 'bon');
  majDots();
  finirManche(true);                  // le bouton paraît, le minuteur attend

  /* Mouvement réduit : aucune animation ne se joue, donc aucun
     `animationend` ne viendra jamais. On donne directement l’état d’arrivée
     — intérieur colorié — et on arme l’avance sans faire attendre. */
  if (mouvementReduit()) { colorierDedans = true; rendrePlan(); armerAutoSuivant(); return; }

  plan.classList.add('reussi', pli, 'aller');
  rabat.onanimationend = () => {
    /* 1er temps fini : la moitié est posée. On la laisse voir. */
    rabat.onanimationend = null;
    minuteriesPli.push(setTimeout(() => {
      /* 2e temps fini : elle repart, et l’intérieur se colorie avec elle. */
      colorierDedans = true; rendrePlan();
      plan.classList.remove('aller');
      void rabat.offsetWidth;         // reflow : sans lui, l’animation ne repart pas
      plan.classList.add('retour');
      /* La fête se termine sur le DERNIER triangle colorié, pas sur le
         retour du calque : l’éclosion, partie en même temps que lui, dure
         plus longtemps. C’est de là qu’on compte les 2 s du §20. */
      minuteriesPli.push(setTimeout(armerAutoSuivant,
        ECLOSION_ETALEMENT_MS + dureeCss('--eclosion')));
      rabat.onanimationend = () => {
        rabat.onanimationend = null;
        plan.classList.remove(pli, 'retour');
      };
    }, POSE_MS));
  };
}

function passer(){
  if (mancheFinie) return;
  mancheFinie = true;
  file[pos]._ok = false;
  /* §18 : on montre ce qu’il fallait tracer, sans le compter juste. */
  file[pos].aTracer.forEach(k => { if (!traces.has(k)) traces.set(k, '#9AA9BE'); });
  segmentVise = null;
  rendrePlan();
  sonErreur();
  message('Voici ce qu’il manquait.', 'mauvais');
  majDots();
  finirManche();
}
$('btnPasser').addEventListener('click', () => {
  if (miniJeuCourant && miniJeuCourant.mode === 'reconnaitre') return passer1();
  passer();
});

/* `differer` : le bouton paraît tout de suite — le clic manuel reste
   prioritaire et immédiat (§20) — mais le minuteur, lui, attend la fin de
   la fête. Voir le commentaire de `reussir`. */
function finirManche(differer){
  $('btnPasser').hidden = true;
  $('outils').hidden = true;
  $('palette').hidden = true;
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  if (!differer) armerAutoSuivant();
}
$('btnNext').addEventListener('click', () => {
  desarmerAutoSuivant();
  pos++;
  if (pos < file.length) manche(); else fin();
});

function message(txt, cl){
  const f = $('feedback');
  f.textContent = txt || '';
  f.className = cl || '';
}
function majDots(){
  $('dots').innerHTML = file.map((q, i) =>
    '<span class="dot ' + (i < pos || (i === pos && mancheFinie) ? (q._ok ? 'ok' : 'ko')
      : (i === pos ? 'cur' : '')) + '"></span>').join('');
}

/* ============================================================
   BARRE D’OUTILS : feutre, palette (appui long), gomme
   ============================================================ */
function construireOutils(){
  const b = $('outils');
  b.hidden = false;
  b.innerHTML =
    '<button type="button" class="outil on" id="btnFeutre" aria-label="Feutre">'
    + '<span class="pastille" id="pastilleFeutre"></span>✏️</button>'
    + '<button type="button" class="outil" id="btnGomme" aria-label="Gomme">🧽</button>';
  $('pastilleFeutre').style.background = couleur;
  const majOutil = () => {
    $('btnFeutre').classList.toggle('on', outil === 'feutre');
    $('btnGomme').classList.toggle('on', outil === 'gomme');
  };
  $('btnGomme').addEventListener('click', () => { outil = 'gomme'; majOutil(); });

  /* Appui long sur le feutre → palette. Le menu contextuel et la sélection
     iOS sont neutralisés (`-webkit-touch-callout`, `user-select`), sans quoi
     la palette entrerait en conflit avec le comportement natif. */
  const feutre = $('btnFeutre');
  let minuteur = null, longPress = false;
  feutre.addEventListener('contextmenu', e => e.preventDefault());
  feutre.addEventListener('pointerdown', () => {
    longPress = false;
    clearTimeout(minuteur);
    minuteur = setTimeout(() => { longPress = true; ouvrirPalette(); }, 450);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    feutre.addEventListener(ev, () => clearTimeout(minuteur)));
  feutre.addEventListener('click', () => {
    if (longPress) { longPress = false; return; }
    outil = 'feutre'; majOutil();
  });
  majOutil();
}
function ouvrirPalette(){
  const p = $('palette');
  p.hidden = false;
  p.innerHTML = COULEURS_FEUTRE.map(c =>
    '<button type="button" data-c="' + c + '" style="background:' + c + '"'
    + (c === couleur ? ' class="on"' : '') + ' aria-label="Couleur"></button>').join('');
  p.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    couleur = b.dataset.c;
    outil = 'feutre';
    $('pastilleFeutre').style.background = couleur;
    $('btnFeutre').classList.add('on'); $('btnGomme').classList.remove('on');
    p.hidden = true;
  }));
}

/* ============================================================
   JEU #1 — LA SCÈNE, LE GESTE, LE CALQUE
   ============================================================ */
const VUE1 = [-6, -6, 112, 112];
const TOL_BALAYAGE = 7;        // en unités de figure : le doigt révèle large
const PAS_MORCEAU = 3;         // longueur d’un morceau de contour à révéler
/* LA TOLÉRANCE DU VERDICT SE DÉDUIT DU DESSIN, elle n’est plus un chiffre
   posé à côté. Une première version acceptait jusqu’à 3° d’écart — et le
   calque, lui, montrait fidèlement le décalage que ces 3° produisent : une
   dizaine de pixels, parfaitement visibles. L’outil de vérification
   démentait donc le verdict, alors que tout le mini-jeu repose sur le fait
   qu’ils disent la même chose.

   Le critère est maintenant celui de l’œil : un axe est juste quand le
   décalage qu’il produit au report TIENT DANS L’ÉPAISSEUR DU TRAIT. « Bon
   axe » et « ça se superpose » deviennent alors la même phrase. Comme
   l’erreur se mesure en fraction du diamètre, la tolérance dépend de la
   figure — une petite figure pardonne moins en absolu, autant en apparence.

   Ce que cela coûte à la main : environ 1,7° d’inclinaison ou 3,5 px de
   visée. L’enfant n’est pas laissé seul avec cette exigence — son trait
   s’affiche pendant qu’il le pose, il peut l’effacer et le refaire autant
   qu’il veut, et le calque lui montre l’écart AVANT qu’il ne valide. */
const EPAISSEUR_TRAIT = 2;      // unités de figure : le trait de 6 px à l’écran
const toleranceDe = (fig) => EPAISSEUR_TRAIT / (fig._diam || diametreDe(fig) || 1);

let etape1 = 'tracer';         // tracer | calque | verdict | fini
let ligne1 = null;             // la droite que l’enfant vient de tracer
let trouves1 = [];             // les axes déjà validés dans cette manche
let morceaux1 = [];            // le contour à révéler, morceau par morceau
/* LE BALAYAGE NE SE REDEMANDE PAS DEUX FOIS POUR LA MÊME FIGURE. Repasser
   le contour sert à parcourir la forme et à en voir le détail ; une fois
   ce travail fait, le refaire à chaque essai n’apprend plus rien et ne
   fait que punir l’ajustement — or ajuster est exactement ce que le calque
   demande. Aux essais suivants, le contour se montre déjà révélé et la
   bascule s’enchaîne. */
let dejaBalaye = false;
let montrerVrais = false;      // §18 : après un échec, on montre les axes réels

function ligneSvg(L, classe){
  const T = 400;
  return '<line class="' + classe
    + '" x1="' + (L.p[0] - T*L.d[0]) + '" y1="' + (L.p[1] - T*L.d[1])
    + '" x2="' + (L.p[0] + T*L.d[0]) + '" y2="' + (L.p[1] + T*L.d[1]) + '"/>';
}
function segSvg1(s, classe, style){
  return '<line class="' + classe + '" x1="' + s[1][0] + '" y1="' + s[1][1]
    + '" x2="' + s[2][0] + '" y2="' + s[2][1] + '"'
    + (style ? ' style="' + style + '"' : '') + '/>';
}

/* Le quadrillage en filigrane, dans la même teinte que le plan de l’autre
   mini-jeu — c’est le même objet, il doit se lire pareil. */
function grilleSvg(){
  let s = '';
  for (let v = NOEUD_MIN; v <= NOEUD_MAX; v += PAS_GRILLE) {
    s += '<line class="maille" x1="' + v + '" y1="' + NOEUD_MIN + '" x2="' + v + '" y2="' + NOEUD_MAX + '"/>';
    s += '<line class="maille" x1="' + NOEUD_MIN + '" y1="' + v + '" x2="' + NOEUD_MAX + '" y2="' + v + '"/>';
  }
  return s;
}

function rendreFigure(){
  const q = file[pos];
  /* Au succès, la couleur gagne la figure EN PARTANT DE L’AXE : le retard
     de chaque trait croît avec sa distance à la droite trouvée. L’effet
     redit ce que l’enfant vient de démontrer. */
  const ref = trouves1[0] || ligne1;
  const dTrait = (u) => ref ? Math.abs(cote(u[1], ref) + cote(u[2], ref)) / 2 : 0;
  const dMax = Math.max(1e-6, ...q.fig.prims.map(dTrait));
  let s = '<rect class="surface" x="' + VUE1[0] + '" y="' + VUE1[1]
    + '" width="' + VUE1[2] + '" height="' + VUE1[3] + '"/>';
  s += grilleSvg();
  s += q.fig.prims.map(u =>
    segSvg1(u, 'trait-fig', 'transition-delay:' + (dTrait(u) / dMax * 0.4).toFixed(3) + 's')).join('');
  if (montrerVrais) q.fig._axes.forEach(L => { s += ligneSvg(L, 'axe-vrai'); });
  trouves1.forEach(L => { s += ligneSvg(L, 'axe-ok'); });
  if (ligne1 && etape1 !== 'fini') {
    s += ligneSvg(ligne1, 'axe-trace');
    /* Les deux nœuds sont montrés : l’enfant voit exactement d’où à où
       passe le trait qui sera jugé, et peut le compter sur la grille. */
    (ligne1.noeuds || []).forEach(n =>
      { s += '<circle class="noeud-axe" cx="' + n[0] + '" cy="' + n[1] + '" r="2.6"/>'; });
  }
  $('figure').innerHTML = s;
}
/* `hidden` N’EST PAS UNE PROPRIÉTÉ DES ÉLÉMENTS SVG : `element.hidden = false`
   y pose une propriété JavaScript quelconque et laisse l’ATTRIBUT en place,
   donc la règle `[hidden]{display:none}` continue de s’appliquer. Le calque
   restait invisible tout en se déclarant visible — et un contrôle qui
   n’interrogeait que le DOM n’y voyait rien. On passe donc par l’attribut. */
function montrerCalque(visible){
  const c = $('calque');
  if (visible) c.removeAttribute('hidden'); else c.setAttribute('hidden', '');
}
function rendreCalque(){
  $('calque').innerHTML = morceaux1.map(m =>
    segSvg1(m.s, m.vu ? 'revele' : 'guide')).join('');
}

/* ------------------------------------------------------------
   LA RÉGULARISATION DU TRAIT — ET CE QU’ELLE NE FAIT PAS
   ------------------------------------------------------------
   Le trait à main levée devient une droite par MOINDRES CARRÉS
   ORTHOGONAUX : la droite qui minimise la distance des points relevés à
   elle-même. C’est le vecteur propre principal de la matrice de
   covariance, et il se lit en une ligne d’arc-tangente.

   Ce qui compte est ce que cette formule IGNORE : elle ne connaît ni les
   axes vrais de la figure, ni la verticale, ni l’horizontale. Elle ne
   reçoit que les points du doigt. Un axe tracé de travers reste donc de
   travers, et le calque le révèle — c’est tout l’enjeu du mini-jeu. Une
   aimantation vers la bonne réponse ferait de la vérification un théâtre.

   Elle refuse en revanche un geste qui n’est pas un trait : un point, un
   gribouillis rond n’ont pas de direction, et en inventer une reviendrait
   à répondre au hasard. On redemande alors le geste.
   ------------------------------------------------------------ */
const LONGUEUR_MIN_GESTE = 18;      // en unités de figure
const ELONGATION_MIN = 3;           // rapport des deux inerties principales
function droiteDuGeste(pts){
  if (pts.length < 2) return null;
  const c = centreDe(pts);
  let sxx = 0, sxy = 0, syy = 0;
  pts.forEach(p => {
    const dx = p[0] - c[0], dy = p[1] - c[1];
    sxx += dx*dx; sxy += dx*dy; syy += dy*dy;
  });
  const n = pts.length;
  sxx /= n; sxy /= n; syy /= n;
  const tr = sxx + syy;
  const det = sxx*syy - sxy*sxy;
  const racine = Math.sqrt(Math.max(0, tr*tr/4 - det));
  const l1 = tr/2 + racine, l2 = tr/2 - racine;
  if (Math.sqrt(Math.max(l1, 0)) * 3.4 < LONGUEUR_MIN_GESTE) return null;   // trait trop court
  if (l2 > 1e-9 && l1 / l2 < ELONGATION_MIN) return null;                   // geste sans direction
  const th = 0.5 * Math.atan2(2*sxy, sxx - syy);
  const L = droite(c, [Math.cos(th), Math.sin(th)]);
  /* LA DIRECTION VIENT DE TOUT LE GESTE, LES BOUTS VIENNENT DE LA GRILLE.
     On projette les points extrêmes du doigt sur la droite ajustée — donc
     sans se fier au seul endroit où le doigt s’est posé ou levé —, puis on
     accroche ces deux bouts aux nœuds les plus proches. Le trait jugé passe
     ainsi exactement par deux nœuds : il n’y a plus de « presque ». */
  let tMin = Infinity, tMax = -Infinity;
  pts.forEach(p => {
    const t = (p[0]-L.p[0])*L.d[0] + (p[1]-L.p[1])*L.d[1];
    tMin = Math.min(tMin, t); tMax = Math.max(tMax, t);
  });
  const bout = (t) => [accrocherNoeud(L.p[0] + t*L.d[0]), accrocherNoeud(L.p[1] + t*L.d[1])];
  const a1 = bout(tMin), a2 = bout(tMax);
  if (a1[0] === a2[0] && a1[1] === a2[1]) return null;      // les deux bouts au même nœud
  const D = droite(a1, [a2[0]-a1[0], a2[1]-a1[1]]);
  D.noeuds = [a1, a2];
  return D;
}

/* ------------------------------------------------------------
   LE CALQUE : LE DOIGT RÉVÈLE, IL NE DESSINE PAS
   ------------------------------------------------------------
   Repasser au doigt le contour d’un cœur sur un téléphone est une tâche
   MOTRICE. Si le calque reproduisait les écarts de la main, un axe juste
   donnerait une mauvaise superposition et l’enfant serait puni pour son
   doigt. Le contour IDÉAL est donc découpé d’avance en morceaux, montrés
   en pointillé pâle ; le doigt qui passe à leur portée les allume. Le
   geste garde son sens — il force à parcourir la forme et à en voir le
   détail — sans entrer dans le jugement.

   La moitié à repasser est découpée par LA DROITE DE L’ENFANT, pas par un
   axe vrai : c’est ce qui permet au calque de démentir un axe faux.
   ------------------------------------------------------------ */
function demiFigure(fig, L){
  const out = [];
  fig.prims.forEach(u => {
    const a = cote(u[1], L), b = cote(u[2], L);
    if (a >= 0 && b >= 0) { out.push(u); return; }
    if (a <= 0 && b <= 0) return;
    const t = a / (a - b);
    const m = [u[1][0] + t*(u[2][0]-u[1][0]), u[1][1] + t*(u[2][1]-u[1][1])];
    out.push(a > 0 ? ['S', u[1], m] : ['S', m, u[2]]);
  });
  return out;
}
function decouperEnMorceaux(segs){
  const out = [];
  segs.forEach(u => {
    const L = dist2p(u[1], u[2]);
    const n = Math.max(1, Math.round(L / PAS_MORCEAU));
    for (let i = 0; i < n; i++) {
      const t0 = i/n, t1 = (i+1)/n;
      out.push({vu:false, s:['S',
        [u[1][0] + t0*(u[2][0]-u[1][0]), u[1][1] + t0*(u[2][1]-u[1][1])],
        [u[1][0] + t1*(u[2][0]-u[1][0]), u[1][1] + t1*(u[2][1]-u[1][1])]]});
    }
  });
  return out;
}
function revelerAutour(p){
  if (etape1 !== 'calque') return;      // la bascule est passée : plus rien à révéler
  let change = false;
  morceaux1.forEach(m => {
    if (m.vu) return;
    const c = [(m.s[1][0]+m.s[2][0])/2, (m.s[1][1]+m.s[2][1])/2];
    if (dist2p(p, c) <= TOL_BALAYAGE) { m.vu = true; change = true; }
  });
  if (!change) return;
  rendreCalque();
  if (morceaux1.every(m => m.vu)) { dejaBalaye = true; basculerCalque(); }
}

/* La bascule : le calque tourne d’un demi-tour AUTOUR DE LA DROITE TRACÉE,
   quelle que soit son inclinaison — `rotate3d` accepte n’importe quel axe
   dans le plan. L’origine est le point de la droite le plus proche du
   centre de la scène, pour que le mouvement reste centré. */
function basculerCalque(){
  if (etape1 !== 'calque') return;
  etape1 = 'verdict';
  const c = $('calque');
  const t = (50 - ligne1.p[0]) * ligne1.d[0] + (50 - ligne1.p[1]) * ligne1.d[1];
  const px = ligne1.p[0] + t*ligne1.d[0], py = ligne1.p[1] + t*ligne1.d[1];
  /* L’origine se pose en POURCENTAGES et non en pixels : sur un élément
     `<svg>`, la boîte de référence d’une transformation CSS est sa propre
     `viewBox`, et « 150px » s’y lit en unités utilisateur, pas en pixels
     d’écran. Le pourcentage, lui, veut dire la même chose des deux côtés. */
  c.style.transformOrigin =
    ((px - VUE1[0]) / VUE1[2] * 100).toFixed(4) + '% ' +
    ((py - VUE1[1]) / VUE1[3] * 100).toFixed(4) + '%';
  c.style.setProperty('--ax', ligne1.d[0]);
  c.style.setProperty('--ay', ligne1.d[1]);
  c.classList.add('bascule');
  sonTrait();
  message('Le calque est retourné. Les deux moitiés se superposent-elles ?', '');
  majActions1();
}

/* ------------------------------------------------------------
   LE GESTE SUR LA SCÈNE
   ------------------------------------------------------------ */
function versFigure(clientX, clientY){
  const svg = $('figure'), m = svg.getScreenCTM();
  if (!m) return null;
  const pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
  const q = pt.matrixTransform(m.inverse());
  return [q.x, q.y];
}
(function brancherScene(){
  const svg = $('figure');
  /* UN GESTE GARDE LE SENS QU’IL AVAIT EN COMMENÇANT. Sans ce `mode`
     figé à l’appui, le doigt qui finissait de révéler le contour voyait la
     bascule se déclencher SOUS LUI : l’étape passait à « verdict », et la
     suite du même mouvement retombait dans la branche de tracé — elle
     remplaçait alors en silence l’axe de l’enfant par une droite calculée
     sur son balayage, et c’est cette droite-là qui aurait été jugée. */
  let actif = false, mode = null, points = [], dernier = null;
  svg.addEventListener('pointerdown', (e) => {
    if (etape1 !== 'tracer' && etape1 !== 'calque') return;
    const p = versFigure(e.clientX, e.clientY);
    if (!p) return;
    actif = true; mode = etape1; points = [p]; dernier = p;
    if (mode === 'calque') revelerAutour(p);
    try { svg.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove', (e) => {
    if (!actif) return;
    const p = versFigure(e.clientX, e.clientY);
    if (!p) return;
    if (mode === 'calque') {
      /* Un doigt rapide saute plusieurs morceaux entre deux événements :
         on échantillonne le chemin, sinon le contour se révèle en pointillé. */
      const dx = p[0]-dernier[0], dy = p[1]-dernier[1];
      const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (PAS_MORCEAU/2)));
      for (let i = 1; i <= n; i++) revelerAutour([dernier[0]+dx*i/n, dernier[1]+dy*i/n]);
    } else {
      points.push(p);
      const L = droiteDuGeste(points);
      if (L) { ligne1 = L; rendreFigure(); }
    }
    dernier = p;
    e.preventDefault();
  });
  const relacher = (e) => {
    if (!actif) return;
    actif = false;
    try { svg.releasePointerCapture(e.pointerId); } catch(err){}
    if (mode !== 'tracer') return;
    const L = droiteDuGeste(points);
    if (!L) { message('Trace un trait bien droit, d’un bord à l’autre.', ''); return; }
    ligne1 = L;
    message('');
    rendreFigure(); majActions1();
  };
  svg.addEventListener('pointerup', relacher);
  svg.addEventListener('pointercancel', relacher);
})();

/* ------------------------------------------------------------
   LES BOUTONS DE LA MANCHE, SELON L’ÉTAPE
   ------------------------------------------------------------ */
function majActions1(){
  const b = $('actions1');
  if (etape1 === 'fini') { b.hidden = true; b.innerHTML = ''; return; }
  b.hidden = false;
  if (etape1 === 'tracer') {
    /* Sur une figure à plus de deux axes, on a dit à l’enfant qu’il y en a
       plusieurs : lui laisser le bouton « aucun autre axe » reviendrait à
       lui tendre une réponse qu’on vient de démentir. */
    const nie = !(trouves1.length && file[pos].fig._axes.length > 2);
    b.innerHTML = (ligne1
        ? '<button type="button" class="act" id="b1Effacer">Effacer le trait</button>'
        : nie ? '<button type="button" class="act" id="b1Aucun">'
          + (trouves1.length ? 'Aucun autre axe' : 'Aucun axe') + '</button>' : '')
      + '<button type="button" class="act primaire" id="b1Verifier"'
      + (ligne1 ? '' : ' disabled') + '>Vérifier au calque 🔎</button>';
    /* Tant qu’un trait est posé, c’est l’effacer qu’on propose : « aucun
       axe » n’aurait plus de sens à côté d’un axe tracé, et refaire son
       trait ne doit pas dépendre de deviner qu’un second geste remplace le
       premier. */
    if (ligne1) $('b1Effacer').addEventListener('click', effacerTrait);
    else if ($('b1Aucun')) $('b1Aucun').addEventListener('click', () => verdict1(true));
    $('b1Verifier').addEventListener('click', ouvrirCalque);
  } else if (etape1 === 'calque') {
    b.innerHTML = '<span class="act-info">'
      + (dejaBalaye ? 'On revérifie…' : 'Repasse le contour de cette moitié.') + '</span>';
  } else {
    b.innerHTML = '<button type="button" class="act" id="b1Recommencer">Je recommence</button>'
      + '<button type="button" class="act primaire" id="b1Bon">C’est bon !</button>';
    $('b1Recommencer').addEventListener('click', recommencer1);
    $('b1Bon').addEventListener('click', () => verdict1(false));
  }
}
/* UNE DROITE QUI NE TRAVERSE PAS LA FIGURE NE PEUT PAS EN ÊTRE UN AXE — la
   réflexion enverrait la figure sur un côté où elle n’est pas. Et surtout,
   il n’y a alors RIEN À REPASSER : le calque s’ouvrait sur un contour
   inexistant, aucun morceau ne pouvait être révélé, la bascule ne venait
   jamais, et la manche n’avait plus d’autre issue que « Passer ». Toutes
   les figures avaient de telles droites — cent soixante-seize pour la
   lettre A. On le dit à l’enfant et on reste au tracé.

   Le garde-fou ne peut pas refuser une bonne réponse : un axe vrai a
   toujours de la figure des deux côtés, et le contrôle de données le
   vérifie pour chaque axe de chaque figure, dans toutes ses positions. */
function traverseLaFigure(fig, L){
  return demiFigure(fig, L).length > 0
      && demiFigure(fig, droite(L.p, [-L.d[0], -L.d[1]])).length > 0;
}

function effacerTrait(){
  if (etape1 !== 'tracer') return;
  ligne1 = null;
  message('');
  rendreFigure(); majActions1();
}
function ouvrirCalque(){
  if (!ligne1) return;
  if (!traverseLaFigure(file[pos].fig, ligne1)) {
    message('Ton trait passe à côté de la figure : trace-le en travers.', '');
    return;
  }
  etape1 = 'calque';
  morceaux1 = decouperEnMorceaux(demiFigure(file[pos].fig, ligne1));
  if (dejaBalaye) morceaux1.forEach(m => { m.vu = true; });
  const c = $('calque');
  c.classList.remove('bascule'); montrerCalque(true);
  rendreCalque(); majActions1();
  message('');
  if (dejaBalaye) {
    minuteriesPli.push(setTimeout(basculerCalque, 400));
    return;
  }
  lire('Repasse au doigt le contour de cette moitié.');
}
function recommencer1(){
  etape1 = 'tracer';
  ligne1 = null; morceaux1 = [];
  const c = $('calque');
  c.classList.remove('bascule'); montrerCalque(false); c.innerHTML = '';
  message('');
  rendreFigure(); majActions1();
}

/* ------------------------------------------------------------
   LE VERDICT
   ------------------------------------------------------------
   « Une et non l’axe » : sur une figure à deux axes, les deux sont
   acceptés, et le premier trouvé n’épuise pas la manche — la consigne
   enchaîne sur « il y en a un autre ». Le second ne peut pas être le
   premier redit autrement, d’où la comparaison des droites déjà trouvées.
   ------------------------------------------------------------ */
function memeDroite(A, B){
  const a = Math.abs(A.d[0]*B.d[1] - A.d[1]*B.d[0]);          // |sin de l’écart|
  return a < 0.26 && Math.abs(cote(A.p, B)) < 12;              // ~15° et 12 unités
}
function verdict1(aucunAxe){
  if (etape1 === 'fini') return;
  const q = file[pos], fig = q.fig, vrais = fig._axes;
  const ecart = (aucunAxe || !ligne1) ? Infinity : erreurDeSymetrie(fig, ligne1);
  /* DEUX TEMPS DÈS QU’IL Y A UN AXE : en trouver un, puis dire s’il y en a
     un AUTRE. La question ne se pose pas qu’aux figures à deux axes —
     sinon l’entendre poser vaudrait réponse, et l’enfant apprendrait le
     signal au lieu de la géométrie. Sur une figure à un seul axe, la bonne
     réponse au second temps est « aucun autre axe ».

     « Aucun (autre) axe » est juste quand tous les axes vrais ont DÉJÀ été
     trouvés — une seule phrase couvre les deux temps. */
  /* UNE FIGURE À PLUS DE DEUX AXES NE SE TRAITE PAS COMME LES AUTRES. Le
     panneau stop en a quatre. Lui demander de dire « aucun autre axe »
     après en avoir trouvé deux serait un piège — la réponse serait fausse
     alors qu’il aurait bien travaillé —, et les lui faire tracer tous les
     quatre ferait durer la manche cinq fois plus que les cinq autres. On
     s’en tient donc au minimum que le programme demande (« il LES trace »,
     jamais un compte exact, comme la règle A2 de M34), et surtout ON LE
     DIT : la consigne annonce qu’il y en a plusieurs et le bouton « aucun
     autre axe » disparaît, puisqu’il n’aurait plus de sens. */
  const plusieurs = vrais.length > 2;
  const etapes = vrais.length === 0 ? 1 : 2;
  const parEtape = 2 / etapes;
  let juste;
  if (aucunAxe) juste = vrais.length === trouves1.length;
  else juste = trouves1.length < vrais.length
    && ecart <= toleranceDe(fig)
    && !trouves1.some(L => memeDroite(L, ligne1));

  const c = $('calque');
  c.classList.remove('bascule'); montrerCalque(false); c.innerHTML = '';

  if (!juste) {
    montrerVrais = true;
    q._points = q._points || 0;
    q._ok = false;
    ligne1 = null;
    rendreFigure();
    sonErreur();
    /* « Presque » n’est pas « juste », mais ce n’est pas non plus « à côté » :
       le dire évite de renvoyer dos à dos un trait de travers de deux
       degrés et un trait posé n’importe où. */
    const presque = !aucunAxe && vrais.length > 0 && ecart <= toleranceDe(fig) * 4;
    message(vrais.length === 0
      ? 'Cette figure n’a aucun axe de symétrie.'
      : aucunAxe ? (trouves1.length ? 'Il y en avait un autre : le voici.'
                                    : 'Il y avait un axe : le voici.')
      : presque ? 'Presque ! Ton trait est un peu de travers.'
      : trouves1.length ? 'Ce n’est pas un axe. Voici les axes de la figure.'
      : 'Cet axe n’en est pas un. Voici le ou les axes.', 'mauvais');
    finirManche1();
    return;
  }

  /* « Aucun axe » est une réponse juste SANS droite : rien à mémoriser.
     Pousser un `null` ici faisait planter le rendu de la récompense. */
  if (ligne1) trouves1.push(ligne1);
  ligne1 = null;
  q._points = (q._points || 0) + parEtape;
  score += parEtape;

  if (!aucunAxe && trouves1.length < etapes) {
    /* Un axe trouvé : reste à dire s’il y en a un autre. La question est
       posée SANS en donner la réponse. */
    etape1 = 'tracer';
    /* LE CALQUE SE REFAIT POUR LE SECOND AXE. Le balayage n’était sauté que
       pour ne pas punir l’enfant qui AJUSTE le même trait ; un axe nouveau
       est une vérification nouvelle, et la moitié à repasser n’est pas la
       même. */
    dejaBalaye = false;
    rendreFigure(); majActions1();
    sonBonneReponse();
    message(plusieurs ? 'Bravo ! Cette figure en a plusieurs : trouve-en un autre.'
                      : 'Bravo ! Et maintenant : y en a-t-il un autre ?', 'bon');
    poserConsigne(plusieurs
      ? 'Cette figure a plusieurs axes. Trouve-en un autre !'
      : 'Y a-t-il un autre axe ? Trace-le, ou dis qu’il n’y en a pas.');
    return;
  }
  q._ok = true;
  reussir1();
}

function reussir1(){
  const scene = $('scene');
  scene.classList.add('reussi');
  rendreFigure();
  sonBonneReponse(); lancerConfettis(30);
  message(file[pos]._points === 2 ? 'Bien vu !' : 'Bien vu !', 'bon');
  finirManche1(true);
}

/* La récompense dure le temps que la couleur gagne toute la figure : les
   2 s du §20 se comptent à partir de là, comme dans l’autre mini-jeu. */
const ETALEMENT_COULEUR_MS = 400;
function finirManche1(fete){
  etape1 = 'fini';
  mancheFinie = true;
  majActions1(); majDots();
  $('btnPasser').hidden = true;
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  if (fete && !mouvementReduit()) {
    minuteriesPli.push(setTimeout(armerAutoSuivant,
      ETALEMENT_COULEUR_MS + dureeCss('--eclosion')));
  } else {
    armerAutoSuivant();
  }
}
function passer1(){
  if (etape1 === 'fini') return;
  const q = file[pos];
  q._points = q._points || 0;
  q._ok = false;
  montrerVrais = true;
  ligne1 = null;
  const c = $('calque'); c.classList.remove('bascule'); montrerCalque(false); c.innerHTML = '';
  rendreFigure();
  sonErreur();
  message(q.fig._axes.length === 0
    ? 'Cette figure n’a aucun axe de symétrie.'
    : 'Voici le ou les axes de cette figure.', 'mauvais');
  finirManche1();
}

/* ------------------------------------------------------------
   LA FILE (CHARTE §13 bis)
   ------------------------------------------------------------
   Trois stocks séparés — sans axe, un axe, deux axes — tirés chacun sans
   remise. La PROPORTION (deux figures sans axe sur six) n’est pas tirée :
   c’est une proportion voulue, l’une des trois exclusions du §13 bis. Ce
   qui se tire, c’est quelle figure occupe chaque place, et l’ordre des six.
   ------------------------------------------------------------ */
/* Les trois familles se disent par un PRÉDICAT et non par un nombre exact :
   « plusieurs axes » veut dire deux OU PLUS. Écrit `=== 2`, le panneau stop
   et ses quatre axes ne tombaient dans aucune famille — il était dans la
   banque et ne sortait jamais. Un contrôle exige désormais que chaque
   figure appartienne à exactement une famille. */
const REPARTITION1 = [
  {nom:'aucun axe',      n:2, prend:(f) => f._axes.length === 0},
  {nom:'un axe',         n:3, prend:(f) => f._axes.length === 1},
  {nom:'plusieurs axes', n:1, prend:(f) => f._axes.length >= 2}
];
function engendrerFile1(cfg){
  let tirees = [];
  REPARTITION1.forEach((r, i) => {
    const stock = FIGURES1.filter(r.prend);
    tirees = tirees.concat(tirerSansRepetition('fig1-' + i, stock, r.n));
  });
  return melanger(tirees).slice(0, cfg.nbQuestions)
    .map(fig => ({fig:poserFigure(fig, pioche(fig._decalages)), _points:0, _ok:false}));
}

function manche1(){
  desarmerAutoSuivant(); stopperVoix(); arreterPli();
  const q = file[pos];
  etape1 = 'tracer'; ligne1 = null; trouves1 = []; morceaux1 = [];
  montrerVrais = false; mancheFinie = false; dejaBalaye = false;
  $('scene').classList.remove('reussi');
  preparerEcran('reconnaitre');
  $('btnPasser').hidden = false;
  $('btnNext').style.display = 'none';
  const c = $('calque'); c.classList.remove('bascule'); montrerCalque(false); c.innerHTML = '';
  [$('figure'), c].forEach(e => {
    if (e.getAttribute('viewBox') !== VUE1.join(' ')) e.setAttribute('viewBox', VUE1.join(' '));
  });
  message('');
  $('hdrTitle').textContent = 'Symboles miroirs';
  poserConsigne('Trace UN axe de symétrie — ou dis qu’il n’y en a aucun.');
  $('sousConsigne').textContent = 'Ici : ' + q.fig.nom + '. Glisse le doigt en travers.';
  rendreFigure(); majActions1(); majDots();
  montreEcran('game');
}

/* ============================================================
   DÉROULÉ
   ============================================================ */
function lance(id){
  const cfg = CONTENU.miniJeux.find(m => m.id === id);
  if (!cfg || cfg.aVenir) return;
  miniJeuCourant = cfg;
  file = cfg.mode === 'reconnaitre' ? engendrerFile1(cfg) : engendrerFile(cfg);
  pos = 0; score = 0;
  total = file.length * 2;      // demi-points entiers (CHARTE §11), comme M35
  demarreLe = Date.now();
  manche();
}
/* CE QUI APPARTIENT À UN MINI-JEU DISPARAÎT AVEC LUI. Chaque manche montrait
   ses propres éléments et laissait à l’autre le soin de ranger les siens :
   personne ne rangeait. On a donc vu la barre du jeu des axes — « Aucun
   axe », « Vérifier au calque » — rester posée sur le quadrillage de l’autre
   mini-jeu. La mise en place se fait maintenant en UN SEUL endroit, à partir
   du mode : ce qui n’est pas au mode courant est caché, sans qu’une manche
   ait à connaître l’autre. */
function preparerEcran(mode){
  const dessine = mode === 'completer';
  $('plan').hidden = !dessine;
  $('outils').hidden = !dessine;
  $('scene').hidden = dessine;
  $('actions1').hidden = dessine;
  if (dessine) $('actions1').innerHTML = '';
  $('palette').hidden = true;
}

/* Les deux mini-jeux partagent la coquille — consigne, pastilles, bouton
   Suivant, avance automatique — et rien d’autre : chacun a sa manche. */
function manche(){
  if (miniJeuCourant.mode === 'reconnaitre') return manche1();
  return manche2();
}
function manche2(){
  desarmerAutoSuivant(); stopperVoix();
  const q = file[pos];
  preparerEcran('completer');
  traces = new Map(); gommages = 0; mancheFinie = false;
  outil = 'feutre'; segmentVise = null; colorierDedans = false;
  arreterPli();
  $('plan').classList.remove('reussi');
  $('palette').hidden = true;
  $('btnPasser').hidden = false;
  $('btnNext').style.display = 'none';
  message('');
  $('hdrTitle').textContent = 'Le monde à moitié effacé';
  const consigne = q.mode === 'report'
    ? 'Complète ' + q.fig.nom + ' de l’autre côté de l’axe.'
    : 'Les deux moitiés sont incomplètes : réunis-les.';
  poserConsigne(consigne);
  $('sousConsigne').textContent = q.mode === 'report'
    ? 'Glisse le doigt sur le quadrillage pour tracer les traits qui manquent.'
    : 'Ce que porte un côté doit apparaître de l’autre — et réciproquement.';
  construireOutils();
  majDots();
  rendrePlan();
  montreEcran('game');
}
function poserConsigne(texte){
  $('qText').innerHTML = '';
  const s = document.createElement('span'); s.textContent = texte;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn-voix'; b.setAttribute('aria-label', 'Écouter la consigne');
  b.textContent = '🔊';
  b.addEventListener('click', () => lire(texte));
  $('qText').append(s, b);
  lire(texte);
}

function fin(){
  desarmerAutoSuivant(); stopperVoix();
  const ratio = total ? score / total : 0;
  const n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  enregistrerEtoiles(miniJeuCourant.id, n);
  enregistrerSession(miniJeuCourant.id, score, total, Math.round((Date.now() - demarreLe)/1000));
  $('hdrTitle').textContent = 'Résultat';
  $('endStars').innerHTML = '⭐'.repeat(n).split('').map(s => '<span>' + s + '</span>').join('');
  $('endMsg').textContent = n === 3 ? 'Le monde a réapparu !' : n === 2 ? 'Bien joué !' : 'Continue, tu progresses !';
  const reussies = file.filter(q => q._ok).length;
  const fait = miniJeuCourant.mode === 'reconnaitre' ? 'réussie' : 'complétée';
  $('endScore').textContent = reussies + ' figure' + (reussies > 1 ? 's' : '')
    + ' sur ' + file.length + ' ' + fait + (reussies > 1 ? 's' : '') + '.';
  if (n === 3) sonNiveauParfait(); else sonBonneReponse();
  lancerConfettis(n === 3 ? 90 : 40);
  montreEcran('end');
}
$('bRejouer').addEventListener('click', () => lance(miniJeuCourant.id));
$('bMenu').addEventListener('click', retourAccueil);

/* ============================================================
   DÉMARRAGE
   ============================================================ */
construireAccueil();
montreEcran('home');

/* Lancement paramétré (CHARTE §16) : un paramètre inconnu est ignoré en
   silence — ce n’est qu’un raccourci d’entrée. */
(function(){
  const d = parametreURL('competence');
  if (!d) return;
  const cfg = CONTENU.miniJeux.find(m => m.id === d);
  if (!cfg || cfg.aVenir) return;
  lance(d);
})();

/* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7). */
(function(){
  const modale = $('modale-menu');
  const ouvrir = () => { modale.hidden = false; };
  const fermer = () => { modale.hidden = true; };
  $('bouton-menu').addEventListener('click', ouvrir);
  $('modale-menu-rester').addEventListener('click', fermer);
  $('modale-menu-revenir').addEventListener('click', () => {
    fermer();
    try { window.location.href = '../index.html'; } catch(e){}
  });
})();
</script>
