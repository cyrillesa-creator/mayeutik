<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Symétrie — Mayeutik</title>
<!-- ============================================================
     M41 — SYMÉTRIE AXIALE (CE2)
     ------------------------------------------------------------
     Fichier unique et autonome (CHARTE) : aucune dépendance réseau,
     SVG pur. CE2 SEUL — donc pas de paliers, pas d’onglets, pas de
     paquet cadeau : ce module est plus simple que ses trois voisins
     du sous-thème, et sa coquille doit l’être aussi.

     Ce fichier porte pour l’instant le SEUL mini-jeu « Le monde à
     moitié effacé » (ce2-symetrie-completer). Le second, « Symboles
     miroirs », viendra sur le même socle une fois le geste de tracé
     validé sur appareil — c’est lui qui en dépend, pas l’inverse.
     ============================================================ -->
<style>
:root{
  color-scheme: light only;
  --ciel:#EAF2FC; --carte:#FFFFFF; --encre:#1D3354; --encre2:#41577A;
  --mandarine:#FF8A3D; --mandarine-f:#E5701F;
  --menthe:#2EC4A6; --menthe-t:#0B8A70; --corail:#FF5D5D; --corail-t:#D93636; --soleil:#FFC93C;
  --plomb:#2B3A55;
  --r:20px; --ombre:0 4px 0 rgba(29,51,84,.12);
  /* Durées de la fête de réussite. Déclarées ICI et nulle part ailleurs :
     le JS les relit au lieu d’en garder une copie. */
  --pli:.8s; --eclosion:.55s;
  font-size:16px;
}

/* ---------- Protections tactiles (CHARTE §19) ----------
   `touch-action` ne s’hérite PAS : le sélecteur universel est le seul
   moyen de couvrir toute l’interface, et la zone de tracé doit le
   redéclarer sur elle-même ET sur ses enfants. */
*{ box-sizing:border-box; touch-action:pan-y; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--ciel); color-scheme:light only; }
html,body{margin:0; padding:0; min-height:100%;}
body{
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  font-family:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  background:var(--ciel); color:var(--encre);
  background-image:radial-gradient(rgba(29,51,84,.05) 1.5px, transparent 1.5px);
  background-size:26px 26px;
  display:flex; justify-content:center;
}
img, svg{ -webkit-user-drag:none; }
#app{width:100%; max-width:520px; min-height:100dvh; display:flex; flex-direction:column; padding:10px 14px 18px;}

/* ---------- Header ---------- */
header{display:flex; align-items:center; gap:10px; padding:6px 0 10px; min-height:54px;}
#btnBack{
  width:42px; height:42px; border-radius:14px; border:none; flex:none;
  background:var(--carte); color:var(--encre); font-size:20px; font-weight:700;
  box-shadow:var(--ombre); cursor:pointer;
}
#btnBack:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(29,51,84,.12);}
#hdrTitle{font-weight:600; font-size:1.15rem; flex:1; line-height:1.1;}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:46%;}
.dot{width:10px; height:10px; border-radius:50%; background:#C9D6E8;}
.dot.ok{background:var(--menthe);} .dot.ko{background:var(--corail);} .dot.cur{background:var(--mandarine);}

/* ---------- Accueil ---------- */
#home h1{font-size:1.7rem; margin:4px 0 2px; font-weight:700;}
#home .sub{color:var(--encre2); margin:0 0 12px; font-size:.95rem;}
.cards{display:grid; grid-template-columns:1fr; gap:12px;}
.card{
  background:var(--carte); border:none; border-radius:var(--r); padding:16px 12px 14px;
  box-shadow:var(--ombre); cursor:pointer; text-align:center;
  font-family:inherit; color:var(--encre);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform .08s;
}
.card:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(29,51,84,.12);}
.card .ico{font-size:2rem; line-height:1;}
.card .ico-dessin{display:block; width:2.6rem; height:2.6rem;}
.card .ico-dessin svg{display:block; width:100%; height:100%;}
.card .nom{font-weight:600; font-size:1.02rem;}
.card .det{font-size:.78rem; color:var(--encre2); white-space:pre-line;}
.card .stars{font-size:.85rem; letter-spacing:2px; min-height:1.1em;}
.card[disabled]{opacity:.55; cursor:not-allowed;}

/* ---------- Écran de jeu ---------- */
#qText{
  font-size:1.05rem; font-weight:600; text-align:center; margin:4px 4px 3px;
  line-height:1.35; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
}
.sous-consigne{text-align:center; font-size:.85rem; color:var(--encre2); margin:0 0 8px; line-height:1.35;}
.btn-voix{
  border:none; background:var(--carte); box-shadow:var(--ombre); border-radius:12px;
  min-width:40px; min-height:40px; font-size:1.05rem; cursor:pointer; font-family:inherit; padding:0 10px;
}
.btn-voix:active{transform:translateY(2px);}

/* ---------- Le plan quadrillé ----------
   `touch-action:none` sur la zone de tracé ET sur ses enfants : sans le
   second sélecteur, le universel plus haut remettrait chaque trait en
   `pan-y` et le doigt ferait défiler la page au lieu de dessiner. */
.plan{background:var(--carte); border-radius:var(--r); box-shadow:var(--ombre); padding:8px; margin-bottom:10px; position:relative;}

#grille, #grille *{touch-action:none;}
.maille{stroke:#D8E2F0; stroke-width:1; vector-effect:non-scaling-stroke;}
.axe{stroke:var(--mandarine); stroke-width:3; stroke-dasharray:8 5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.pre{stroke:var(--plomb); stroke-width:6; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.trace{stroke-width:6; stroke-linecap:round; vector-effect:non-scaling-stroke;}
/* Le segment sous le doigt : un repère, pas une réponse. */
.vise{stroke:rgba(255,138,61,.45); stroke-width:8; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.noeud{fill:#C9D6E8;}
/* Réussite : les traits noirs se colorient. */
.plan.reussi .pre{stroke:var(--menthe-t); transition:stroke .5s ease;}
.plan.reussi .trace{transition:stroke .5s ease;}

/* ---------- Barre d’outils ---------- */
.outils{display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
.outil{
  min-height:46px; min-width:52px; border-radius:16px; border:2.5px solid transparent;
  background:var(--carte); box-shadow:var(--ombre); cursor:pointer; font-family:inherit;
  font-size:1.25rem; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  -webkit-touch-callout:none; user-select:none;
}
.outil.on{border-color:var(--mandarine);}
.outil:active{transform:translateY(2px);}
.pastille{width:22px; height:22px; border-radius:50%; border:2px solid rgba(29,51,84,.25); display:inline-block;}
.palette{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 8px;}
.palette button{
  width:40px; height:40px; border-radius:50%; border:3px solid transparent;
  cursor:pointer; box-shadow:var(--ombre);
}
.palette button.on{border-color:var(--encre);}
#btnPasser{
  display:block; margin:2px auto 0; border:2px solid color-mix(in srgb, var(--encre) 25%, white);
  border-radius:14px; background:transparent; color:var(--encre2); font-family:inherit;
  font-weight:700; font-size:.85rem; padding:7px 18px; cursor:pointer; min-height:40px;
}
#feedback{text-align:center; font-weight:700; margin:6px 0 0; min-height:1.4em;}
#feedback.bon{color:var(--menthe-t);} #feedback.mauvais{color:var(--corail-t);}
#btnNext{
  display:none; margin:9px auto 0; border:none; border-radius:18px;
  padding:11px 32px; font-family:inherit; font-size:1.05rem; font-weight:700;
  color:#fff; background:var(--mandarine); box-shadow:0 4px 0 var(--mandarine-f); cursor:pointer;
}
#btnNext:active{transform:translateY(3px);}

/* ---------- L’effet de fin : LA MOITIÉ SE RABAT SUR L’AUTRE ----------
   Le pli doit tomber sur l’axe de symétrie, sinon l’animation raconte autre
   chose que ce qu’on vient de faire. Une première version pivotait sur le
   BORD GAUCHE de la carte, comme une page de livre : joli, mais sans rapport
   avec la figure. Une deuxième faisait tourner le plan ENTIER autour de
   l’axe : le pli tombait au bon endroit, mais une feuille qui pivote n’est
   pas une feuille qui se plie — rien ne se superposait.

   Ici, un CALQUE — `#rabat` — porte une copie du plan découpée à la moitié
   de référence, et c’est lui seul qui tourne, d’un demi-tour, autour de
   l’axe. Pendant ce temps le plan du dessous est découpé à l’autre moitié :
   la moitié de référence quitte réellement sa place, traverse, et vient se
   poser sur sa jumelle. C’est le geste du papier plié.

   L’axe passe par le centre de la vue — la `viewBox` déborde également des
   deux côtés — donc l’origine du pli est le centre de l’élément, dans les
   deux orientations. Seul l’AXE DE ROTATION change : on tourne autour de la
   verticale quand l’axe est vertical, autour de l’horizontale sinon. */
/* ---------- LE CADRE : UNE SEULE BOÎTE POUR LE PLAN ET SON CALQUE ----------
   Le calque déduisait sa boîte de son côté : largeur donnée par les bords,
   HAUTEUR laissée à `auto`, donc tirée du rapport de la `viewBox` par le
   moteur. Deux façons d’obtenir la même boîte, c’est encore deux vérités
   pour un seul fait — et il suffit qu’un moteur résolve autrement la taille
   intrinsèque d’un `<svg>` positionné pour que le calque prenne une boîte
   légèrement différente. La `viewBox` s’y recentre alors, et TOUT LE DESSIN
   se retrouve décalé, avant même le moindre pliage.

   Un cadre porte donc les deux : le plan, dans le flux, lui donne sa taille ;
   le calque, par-dessus, la prend en POURCENTAGE — cent pour cent de la
   boîte du plan, sans plus rien à déduire. Quoi qu’un moteur décide de la
   hauteur du plan, le calque le suit exactement. */
.cadre{position:relative;}
.cadre > svg{display:block; width:100%; height:auto;}
#rabat, #calque{position:absolute; left:0; top:0; width:100%; height:100%;}
#rabat{
  transform-origin:50% 50%;
  display:none; pointer-events:none; backface-visibility:visible;
  /* UNE FEUILLE EST OPAQUE. Sans fond, la moitié posée laisse transparaître,
     au bord de chaque trait, la couleur de celui qu’elle recouvre : deux
     disques identiques superposés se bordent d’un liseré de l’un sous
     l’autre. Le fond de la carte règle cela d’un coup, et rend le geste plus
     juste — du papier qui se rabat cache ce qu’il y a dessous. */
  background:var(--carte);
}
.plan.rabat-v #rabat, .plan.rabat-h #rabat{display:block;}
/* Découpes complémentaires : le calque emporte la moitié de référence
   (gauche ou haut), le plan garde l’autre.

   LES QUELQUES PIXELS EN PLUS NE SONT PAS UN À-PEU-PRÈS. Les traits ont des
   bouts ARRONDIS qui dépassent de la moitié de leur épaisseur : un segment
   qui meurt sur l’axe déborde donc de l’autre côté. Coupé pile à 50 %, le
   calque perd ces bouts-là, le plan garde les siens, et la moitié posée
   laisse voir sous elle un liseré de la couleur du dessous — on croit à un
   décalage alors que la géométrie tombe juste au centième de pixel. On donne
   au calque de quoi couvrir ce dépassement ; une fois rabattu, ce surplus
   tombe de l’autre côté de l’axe, sur la même figure, et ne se voit pas. */
.plan.rabat-v #rabat{clip-path:inset(0 calc(50% - 4px) 0 0);}
.plan.rabat-h #rabat{clip-path:inset(0 0 calc(50% - 4px) 0);}
.plan.rabat-v #grille{clip-path:inset(0 0 0 50%);}
.plan.rabat-h #grille{clip-path:inset(50% 0 0 0);}
/* TROIS TEMPS, ET NON UNE SEULE ANIMATION À PALIERS : la moitié se rabat,
   elle RESTE POSÉE le temps qu’on voie la superposition, puis elle revient.
   Découper ainsi n’est pas cosmétique — c’est ce qui permet au reste du code
   d’attendre un ÉVÉNEMENT (`animationend`) au lieu d’une date calculée à la
   main depuis le début du mouvement. Le retour se joue sur les mêmes images
   clés, lues à l’envers.

   PERSPECTIVE LOINTAINE : de près, la rotation déforme fortement le calque
   en trapèze, et les deux moitiés paraissent alors mal se recouvrir alors
   même qu’elles tombent juste au bout. On éloigne donc le point de vue : le
   pli garde son relief, la fuite ne caricature plus la moitié en vol. */
.plan.rabat-v.aller  #rabat{animation:plier-v var(--pli) ease-in-out forwards;}
.plan.rabat-v.retour #rabat{animation:plier-v var(--pli) ease-in-out reverse;}
.plan.rabat-h.aller  #rabat{animation:plier-h var(--pli) ease-in-out forwards;}
.plan.rabat-h.retour #rabat{animation:plier-h var(--pli) ease-in-out reverse;}
@keyframes plier-v{
  from{ transform:perspective(2200px) rotateY(0deg); }
  to  { transform:perspective(2200px) rotateY(180deg); }
}
@keyframes plier-h{
  from{ transform:perspective(2200px) rotateX(0deg); }
  to  { transform:perspective(2200px) rotateX(-180deg); }
}
/* Au RETOUR du rabat, l’intérieur de la figure se colorie — la couleur
   part de l’axe et gagne les bords, dans le sens où le pli se rouvre.
   Le retard de chaque triangle est posé en ligne, calculé sur sa distance
   à l’axe. */
/* Aucun contour sur les triangles : le découpage en quarts est un moyen de
   CALCUL, pas un motif à montrer. Cerclés, ils dessinaient une résille. */
/* L’éclosion joue sur la SEULE opacité. Une version précédente faisait
   aussi grandir chaque triangle depuis son centre : joli sur le papier,
   mais pendant la seconde que dure l’animation les triangles rapetissés
   laissent voir leurs intervalles, et l’intérieur se montre en mosaïque de
   croix — précisément le découpage qu’on ne veut pas donner à voir. */
.dedans polygon{ fill:var(--menthe); stroke:none; animation:eclore var(--eclosion) ease-out backwards; }
@keyframes eclore{ from{opacity:0;} to{opacity:1;} }
/* Sous `prefers-reduced-motion`, le signal de réussite ne dépend d’AUCUNE
   animation : il reste le changement de couleur, franc. L’intérieur, lui,
   s’affiche d’emblée — d’où une éclosion en `backwards` et non `forwards` :
   animation coupée, le triangle reste dans son état naturel, donc visible. */
@media (prefers-reduced-motion:reduce){
  .plan.rabat-v #rabat, .plan.rabat-h #rabat{display:none;}
  .plan.rabat-v #grille, .plan.rabat-h #grille{clip-path:none;}
}

/* ---------- Jeu #1 : la scène, la figure, le calque ----------
   Même dispositif que le plan quadrillé : une carte, un SVG qui prend
   toute la largeur, et un calque en surimpression exactement calé
   dessus. `touch-action:none` sur la zone de tracé ET sur ses enfants —
   la propriété ne s’hérite pas (§19). */
.scene{background:var(--carte); border-radius:var(--r); box-shadow:var(--ombre);
  padding:8px; margin-bottom:10px; position:relative;}
/* TOUTE LA CARTE EST UNE SURFACE DE DESSIN, pas seulement le SVG : un
   geste qui commence dans les 8 px de marge ne doit pas davantage faire
   défiler la page. `touch-action` ne s’héritant pas, il faut le dire aussi
   pour les descendants (§19). */
.scene, .scene *{touch-action:none;}
/* LA ZONE DE TRACÉ DOIT ÊTRE UNE SURFACE, PAS SEULEMENT DE L’ENCRE.
   Le quadrillage de l’autre mini-jeu couvre tout son plan de traits : où
   que le doigt se pose, il touche un élément à `touch-action:none`. Ici la
   figure ne peint qu’une petite partie de la scène, et le vide autour
   dépend du comportement du moteur — WebKit et Blink ne désignent pas la
   même cible sous un point vide d’un `<svg>` racine. On pose donc une
   surface explicite qui couvre toute la vue : `pointer-events:all` la rend
   cible quel que soit son remplissage, sans rien peindre. */
.surface{fill:none; pointer-events:all;}
#calque{
  pointer-events:none; backface-visibility:visible;
  /* `transform-box` EXPLICITE. Sur un élément `<svg>`, la boîte de
     référence d’une transformation est par défaut sa `viewBox` : une
     origine posée en pourcentage s’y résout en unités utilisateur, pas en
     pixels d’écran, et le calque retombe à côté. On demande donc
     franchement la boîte CSS, la même que celle que l’on mesure. */
  transform-box:border-box;}
.trait-fig{stroke:var(--plomb); stroke-width:6; stroke-linecap:round; stroke-linejoin:round;
  fill:none; vector-effect:non-scaling-stroke; transition:stroke .45s ease;}
.scene.reussi .trait-fig{stroke:var(--menthe-t);}
/* Le trait de l’enfant, et — après coup seulement — les axes réels (§18).
   Le rouge ne désigne jamais la bonne réponse : les axes vrais se montrent
   en menthe, la couleur de ce qui est juste. */
.axe-trace{stroke:var(--mandarine); stroke-width:5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.axe-ok{stroke:var(--menthe); stroke-width:5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.axe-vrai{stroke:var(--menthe-t); stroke-width:4; stroke-dasharray:8 6; stroke-linecap:round;
  vector-effect:non-scaling-stroke;}
.noeud-axe{fill:var(--mandarine-f); stroke:var(--carte); stroke-width:1.5; vector-effect:non-scaling-stroke;}
/* Le contour à révéler : pâle tant qu’il attend le doigt, franc ensuite. */
.guide{stroke:#C2D2E6; stroke-width:3; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.revele{stroke:var(--mandarine); stroke-width:5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
/* La bascule du calque tourne autour de la DROITE TRACÉE, quelle que soit
   son inclinaison : `rotate3d` accepte n’importe quel axe du plan, et les
   deux composantes arrivent en variables CSS posées par le script. */
#calque.bascule{animation:basculer-calque var(--pli) ease-in-out forwards;}
@keyframes basculer-calque{
  from{transform:perspective(2200px) rotate3d(var(--ax,1),var(--ay,0),0,0deg);}
  to  {transform:perspective(2200px) rotate3d(var(--ax,1),var(--ay,0),0,180deg);}
}
@media (prefers-reduced-motion:reduce){
  #calque.bascule{transform:perspective(2200px) rotate3d(var(--ax,1),var(--ay,0),0,180deg);}
}
.actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;}
.act{border:none; border-radius:14px; padding:12px 16px; font-family:inherit; font-size:.98rem;
  font-weight:600; background:var(--carte); color:var(--encre); box-shadow:var(--ombre); cursor:pointer;}
.act.primaire{background:var(--mandarine); color:#fff;}
.act:active{transform:translateY(2px);}
.act[disabled]{opacity:.5; cursor:not-allowed;}
.act-info{font-size:.9rem; color:var(--encre2); align-self:center;}

/* ---------- Fin ---------- */
#end{text-align:center; padding-top:8vh;}
#endStars{font-size:3.4rem; letter-spacing:8px; margin:10px 0;}
#endStars span{display:inline-block; animation:pop .5s backwards;}
#endStars span:nth-child(2){animation-delay:.25s;} #endStars span:nth-child(3){animation-delay:.5s;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
#endMsg{font-size:1.3rem; font-weight:700;}
#endScore{color:var(--encre2); margin:6px 0 22px;}
#end .actions-fin{display:flex; gap:12px; justify-content:center;}
#end .actions-fin button{
  border:none; border-radius:18px; padding:13px 26px; font-family:inherit;
  font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:var(--ombre); min-height:44px;
}
#bRejouer{background:var(--mandarine); color:#fff; box-shadow:0 4px 0 var(--mandarine-f);}
#bMenu{background:var(--carte); color:var(--encre);}

/* ---------- Retour à la coquille (CHARTE §7) ---------- */
.barre-accueil{display:flex; margin:0 0 8px;}
.bouton-menu{
  min-height:44px; border-radius:14px; padding:0 14px; cursor:pointer; font-family:inherit;
  border:2px solid color-mix(in srgb, var(--encre) 25%, white);
  background:var(--carte); color:var(--encre); font-weight:600; font-size:.95rem;
  display:inline-flex; align-items:center; gap:6px;
}
.bouton-menu:active{transform:translateY(2px);}
.modale-fond{
  position:fixed; inset:0; z-index:1000; padding:1.2rem;
  background:color-mix(in srgb, var(--encre) 55%, transparent);
  display:flex; align-items:center; justify-content:center;
}
.modale-boite{
  background:var(--carte); border-radius:20px; padding:22px 18px; max-width:20rem; width:100%;
  text-align:center; box-shadow:0 12px 34px rgba(29,51,84,.3);
}
.modale-boite p{font-size:1.05rem; font-weight:600; margin:0 0 18px; color:var(--encre);}
.modale-boutons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.modale-boutons button{
  border:none; border-radius:16px; padding:12px 20px; font-family:inherit;
  font-size:1rem; font-weight:700; cursor:pointer; min-height:44px;
}
.modale-boutons .m-rester{background:var(--carte); color:var(--encre); border:2px solid var(--encre);}
.modale-boutons .m-revenir{background:var(--mandarine); color:#fff; box-shadow:0 4px 0 var(--mandarine-f);}

/* ---------- Confettis (CHARTE §4) ---------- */
#confettis-conteneur{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
.confetti{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
  animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards;}
@keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
@media (prefers-reduced-motion:reduce){ .confetti{display:none; animation:none;} }

[hidden]{display:none !important;}
@media (prefers-color-scheme: dark){
  html, body{background:var(--ciel) !important; color:var(--encre) !important;}
  .card, .plan, .outil, #btnBack{background:var(--carte) !important; color:var(--encre) !important;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ============================================================
   LE PLAN : UN QUADRILLAGE, ET UN ENSEMBLE FINI DE SEGMENTS
   ------------------------------------------------------------
   Le tracé suit les lignes et les diagonales du quadrillage. L’ensemble
   des segments possibles est donc FINI — c’est ce qui rend le geste au
   doigt praticable : le doigt balaie, le segment le plus proche s’allume,
   et la précision de la main n’entre jamais dans la géométrie obtenue.
   ============================================================ */
const NX = 8, NY = 10;          // cellules
const AXE_V = NX / 2, AXE_H = NY / 2;
/* LA VUE DÉBORDE LE QUADRILLAGE D’UNE DEMI-MAILLE. Sans cette marge, les
   segments du BORD — le bout de la queue du poisson, par exemple — tombent
   sur l’arête exacte de la surface tactile : le doigt les manque, et la
   figure devient impossible à finir. La marge n’est pas décorative.

   Elle est DÉCLARÉE ICI et reprise dans l’attribut `viewBox` : l’axe s’y
   étend, et le centre de la vue tombe exactement sur l’axe de symétrie —
   c’est ce qui permet au pli de l’animation de tomber sur l’axe. */
const MARGE = 0.4;
const VUE = [-MARGE, -MARGE, NX + 2*MARGE, NY + 2*MARGE];

/* Une clé de segment est canonique : le plus petit bout d’abord, pour que
   (a,b) et (b,a) soient le même segment. */
function cle(a, b){
  const [p, q] = (a[0] < b[0] || (a[0] === b[0] && a[1] <= b[1])) ? [a, b] : [b, a];
  return p[0] + ',' + p[1] + '|' + q[0] + ',' + q[1];
}
const bouts = k => k.split('|').map(s => s.split(',').map(Number));

/* Tous les segments légaux : côtés de maille et diagonales de cellule. */
function segmentsPossibles(){
  const out = [];
  for (let j = 0; j <= NY; j++) for (let i = 0; i < NX; i++) out.push(cle([i,j],[i+1,j]));
  for (let i = 0; i <= NX; i++) for (let j = 0; j < NY; j++) out.push(cle([i,j],[i,j+1]));
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
    out.push(cle([i,j],[i+1,j+1]));
    out.push(cle([i+1,j],[i,j+1]));
  }
  return out;
}
const SEGMENTS = segmentsPossibles();
const EST_LEGAL = new Set(SEGMENTS);

const reflechirPoint = ([x,y], axe) => axe === 'v' ? [NX - x, y] : [x, NY - y];
const reflechirSeg = (k, axe) => {
  const [a, b] = bouts(k);
  return cle(reflechirPoint(a, axe), reflechirPoint(b, axe));
};

/* ============================================================
   L’INTÉRIEUR DE LA FIGURE, CALCULÉ ET NON DÉCLARÉ
   ------------------------------------------------------------
   Colorier « dedans » suppose de savoir ce qui est dedans. Un remplissage
   par CASES ne suffit pas : une diagonale coupe sa cellule en deux, et la
   moitié gauche peut être dehors quand la droite est dedans.

   On découpe donc chaque cellule en QUATRE QUARTS par ses deux diagonales —
   nord, est, sud, ouest. Les traits deviennent alors des murs entre quarts
   voisins, et « dedans » se lit comme ce que l’on n’atteint pas depuis
   l’extérieur : un simple parcours en largeur depuis le dehors, et tout ce
   qui reste est l’intérieur. Aucune liste de cellules à écrire à la main,
   et cela vaut pour n’importe quelle figure de la banque.
   ============================================================ */
const QUARTS = 4;   // 0 nord, 1 est, 2 sud, 3 ouest
function trianglesInterieurs(murs){
  const dedans = (i, j) => i >= 0 && i < NX && j >= 0 && j < NY;
  const idx = (i, j, q) => (j * NX + i) * QUARTS + q;
  const mur = (a, b) => murs.has(cle(a, b));
  const vus = new Uint8Array(NX * NY * QUARTS);
  const pile = [];
  /* On entre par le bord : un quart du pourtour communique avec le dehors
     tant que le côté du plan qui le borde n’est pas tracé. */
  for (let i = 0; i < NX; i++) {
    if (!mur([i,0],[i+1,0])) { pile.push(idx(i,0,0)); }
    if (!mur([i,NY],[i+1,NY])) { pile.push(idx(i,NY-1,2)); }
  }
  for (let j = 0; j < NY; j++) {
    if (!mur([0,j],[0,j+1])) { pile.push(idx(0,j,3)); }
    if (!mur([NX,j],[NX,j+1])) { pile.push(idx(NX-1,j,1)); }
  }
  pile.forEach(k => { vus[k] = 1; });
  while (pile.length) {
    const k = pile.pop();
    const q = k % QUARTS, cellule = (k - q) / QUARTS;
    const i = cellule % NX, j = (cellule - i) / NX;
    const d1 = cle([i,j],[i+1,j+1]);        // diagonale « \ »
    const d2 = cle([i+1,j],[i,j+1]);        // diagonale « / »
    const voisins = [];
    /* À l’intérieur de la cellule : les deux diagonales séparent les quarts. */
    if (!murs.has(d1)) { voisins.push(idx(i,j,(q===0)?3:(q===3)?0:(q===1)?2:1)); }
    if (!murs.has(d2)) { voisins.push(idx(i,j,(q===0)?1:(q===1)?0:(q===2)?3:2)); }
    /* D’une cellule à l’autre : c’est le côté du quadrillage qui sépare. */
    if (q === 0 && dedans(i, j-1) && !mur([i,j],[i+1,j])) voisins.push(idx(i,j-1,2));
    if (q === 2 && dedans(i, j+1) && !mur([i,j+1],[i+1,j+1])) voisins.push(idx(i,j+1,0));
    if (q === 3 && dedans(i-1, j) && !mur([i,j],[i,j+1])) voisins.push(idx(i-1,j,1));
    if (q === 1 && dedans(i+1, j) && !mur([i+1,j],[i+1,j+1])) voisins.push(idx(i+1,j,3));
    voisins.forEach(v => { if (!vus[v]) { vus[v] = 1; pile.push(v); } });
  }
  const out = [];
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) for (let q = 0; q < QUARTS; q++) {
    if (vus[idx(i,j,q)]) continue;
    const c = [i+0.5, j+0.5];
    const coins = [[[i,j],[i+1,j]], [[i+1,j],[i+1,j+1]], [[i+1,j+1],[i,j+1]], [[i,j+1],[i,j]]][q];
    out.push([coins[0], coins[1], c]);
  }
  return out;
}

/* ============================================================
   BANQUE DE DEMI-FIGURES
   ------------------------------------------------------------
   Chaque figure ne donne QUE sa moitié de référence — à gauche pour un
   axe vertical, en haut pour un axe horizontal. La figure complète est
   `demi ∪ σ(demi)` : elle est symétrique PAR CONSTRUCTION, jamais par
   déclaration, et le contrôle de données le relit.

   Un stock de sept pour une file de six (CHARTE §13 bis) : deux parties
   de suite ne rejouent pas le même matériel.
   ============================================================ */
const FIGURES = [
  {nom:'la maison', axe:'v', demi:[
    [4,2,3,3],[3,3,2,4],[2,4,1,5],
    [1,5,1,6],[1,6,1,7],[1,7,1,8],
    [1,8,2,8],[2,8,3,8],[3,8,4,8],
    [3,8,3,7],[3,7,3,6],[3,6,4,6]]},
  {nom:'le sapin', axe:'v', demi:[
    [4,1,3,2],[3,2,4,2],
    [4,2,3,3],[3,3,2,4],[2,4,3,4],[3,4,4,4],
    [4,4,3,5],[3,5,2,6],[2,6,3,6],[3,6,4,6],
    [3,6,3,7],[3,7,3,8],[3,8,4,8]]},
  {nom:'la fusée', axe:'v', demi:[
    [4,1,3,2],
    [3,2,3,3],[3,3,3,4],[3,4,3,5],[3,5,3,6],
    [3,6,2,7],[2,7,1,8],[1,8,2,8],[2,8,3,8],
    [3,6,3,7],[3,7,3,8],
    [3,3,4,3]]},
  {nom:'la couronne', axe:'v', demi:[
    [1,7,2,7],[2,7,3,7],[3,7,4,7],
    [1,7,1,6],[1,6,1,5],
    [1,5,2,6],[2,6,3,5],[3,5,4,6]]},
  {nom:'le papillon', axe:'v', demi:[
    [4,4,4,5],
    [4,4,3,3],[3,3,2,3],[2,3,1,4],[1,4,2,5],[2,5,3,5],[3,5,4,4],
    [4,5,3,6],[3,6,2,6],[2,6,1,7],[1,7,2,8],[2,8,3,8],[3,8,4,7]]},
  {nom:'le poisson', axe:'h', demi:[
    [1,5,2,4],[2,4,3,3],[3,3,4,3],[4,3,5,3],[5,3,6,4],[6,4,7,5],
    [7,5,8,4],[8,4,8,5],
    /* L’œil s’accroche au corps en (3,3) : posé en (3,4)-(4,4) il flottait,
       et la figure complète n’était plus connexe. */
    [3,3,3,4]]},
  {nom:'le cerf-volant', axe:'h', demi:[
    [4,1,3,2],[3,2,2,3],[2,3,1,4],[1,4,0,5],
    [4,1,5,2],[5,2,6,3],[6,3,7,4],[7,4,8,5],
    /* La traverse se découpe en segments d’UNE maille : un trait de deux
       mailles n’est pas un segment légal du quadrillage. */
    [2,3,3,3],[3,3,4,3],[4,3,5,3],[5,3,6,3]]}
];

/* ============================================================
   LA FIGURE CIBLE, ET LES DEUX MANIÈRES DE L’EFFACER
   ------------------------------------------------------------
   Bloc 1 — LE REPORT : une moitié complète, l’autre vide.
   Bloc 2 — LA FUSION : les deux moitiés sont incomplètes, et

       la figure cible est l’UNION DES DEUX MOITIÉS RABATTUES.

   Ce que porte la gauche doit apparaître à droite, et réciproquement.
   Aucune moitié n’est le modèle ; le modèle est leur réunion — c’est ce
   qui fait la valeur du second bloc, et ce qui le rend nettement plus
   riche qu’un report.

   D’où la règle de génération qui décide de tout : POUR CHAQUE PAIRE
   MIROIR {s, σ(s)}, AU PLUS UN DES DEUX PEUT ÊTRE EFFACÉ. Effacer les
   deux rendrait le segment irrécupérable — l’union ne le contiendrait
   plus — et la manche deviendrait insoluble. Les segments portés par
   l’axe sont leur propre miroir : ils ne s’effacent jamais.
   ============================================================ */
function cibleDe(fig){
  const T = new Set();
  fig.demi.forEach(([a,b,c,d]) => { const k = cle([a,b],[c,d]); T.add(k); T.add(reflechirSeg(k, fig.axe)); });
  return T;
}
/* Les paires miroir, et les segments qui sont leur propre miroir. */
function pairesDe(fig, T){
  const paires = [], surAxe = [], vus = new Set();
  [...T].forEach(k => {
    if (vus.has(k)) return;
    const m = reflechirSeg(k, fig.axe);
    vus.add(k); vus.add(m);
    if (m === k) surAxe.push(k); else paires.push([k, m]);
  });
  return {paires, surAxe};
}
/* Le côté de référence : gauche pour un axe vertical, haut pour un axe
   horizontal. Sert à répartir les effacements des deux côtés. */
function estDuCoteReference(k, axe){
  const [a, b] = bouts(k);
  return axe === 'v' ? (a[0] + b[0]) / 2 < AXE_V : (a[1] + b[1]) / 2 < AXE_H;
}

function construireManche(fig, mode){
  const T = cibleDe(fig);
  const {paires, surAxe} = pairesDe(fig, T);
  const pre = new Set(surAxe);          // l’axe est toujours donné
  if (mode === 'report') {
    /* Une moitié entière est donnée, l’autre est à reporter. */
    paires.forEach(([k, m]) => pre.add(estDuCoteReference(k, fig.axe) ? k : m));
  } else {
    /* On efface des paires DES DEUX CÔTÉS, jamais les deux moitiés d’une
       même paire, et au moins une de chaque côté — sans quoi il n’y aurait
       rien à ajouter d’un côté et le niveau retomberait sur un report. */
    const melangees = melanger(paires);
    const aEffacer = Math.max(2, Math.round(melangees.length * 0.45));
    melangees.forEach(([k, m], i) => {
      const ref = estDuCoteReference(k, fig.axe) ? k : m;
      const autre = ref === k ? m : k;
      if (i >= aEffacer) { pre.add(ref); pre.add(autre); return; }
      /* i pair : on efface du côté miroir ; i impair : du côté référence. */
      pre.add(i % 2 === 0 ? ref : autre);
    });
  }
  const aTracer = new Set([...T].filter(k => !pre.has(k)));
  return {fig, mode, cible:T, pre, aTracer};
}

/* ============================================================
   CONTENU (CHARTE §6) — CE2 seul, deux mini-jeux annoncés
   ============================================================ */
/* L’ordre des deux mini-jeux suit celui du programme : on reconnaît un axe
   avant d’avoir à s’en servir pour compléter. */
const CONTENU = {
  sousTitre: 'Trouve les axes cachés, puis fais réapparaître le monde que le mage a effacé !',
  miniJeux: [
    {id:'ce2-symetrie-reconnaitre', mode:'reconnaitre', titre:'Symboles miroirs',
     icone:'🂱', iconeSvg:'<path d="M 11 4 L 29 4 L 29 36 L 11 36 Z" fill="#FFFFFF"/><g fill="#E5484D"><path d="M 20 11 L 26.5 20 L 20 29 L 13.5 20 Z"/><path d="M 15 6 L 17.2 9 L 15 12 L 12.8 9 Z"/><path d="M 25 6 L 27.2 9 L 25 12 L 22.8 9 Z"/><path d="M 15 28 L 17.2 31 L 15 34 L 12.8 31 Z"/><path d="M 25 28 L 27.2 31 L 25 34 L 22.8 31 Z"/></g><path d="M 11 4 L 29 4 L 29 36 L 11 36 Z" fill="none" stroke="#2B3A55" stroke-width="2.4" stroke-linejoin="round"/>',
     description:'Trace un axe de symétrie — ou dis qu’il n’y en a aucun.', nbQuestions:6},
    {id:'ce2-symetrie-completer', mode:'completer', titre:'Le monde à moitié effacé', icone:'🪄',
     description:'Complète la figure de l’autre côté de l’axe.', nbQuestions:6}
  ]
};
/* On désigne un mini-jeu par son IDENTIFIANT, jamais par son rang : l’ordre
   d’affichage est une décision de présentation, et rien d’autre ne doit en
   dépendre. */
const jeu = (id) => CONTENU.miniJeux.find(m => m.id === id);

/* ============================================================
   TIRAGES DE CONTENU (CHARTE §13 bis)
   ------------------------------------------------------------
   Sans remise, jamais deux fois de suite, et au remélange ce qui vient
   d’être servi repart en fin de pioche.
   ============================================================ */
function melanger(t){
  const c = [...t];
  for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [c[i], c[j]] = [c[j], c[i]]; }
  return c;
}
const pioche = a => a[Math.floor(Math.random()*a.length)];
const memoireTirages = {}, memoireDernier = {};
function tirerSansRepetition(cleStock, stock, n){
  let reste = memoireTirages[cleStock];
  let precedent = memoireDernier[cleStock];
  const sortie = [];
  for (let i = 0; i < n; i++) {
    if (!reste || !reste.length) {
      /* Chaque cycle est une PERMUTATION du stock : y concaténer tout ce
         qui a été servi ferait accumuler des doublons dans la pile. */
      const recents = sortie.slice(-Math.max(1, stock.length - 1));
      reste = melanger(stock.filter(x => recents.indexOf(x) === -1))
        .concat(melanger(stock.filter(x => recents.indexOf(x) !== -1)));
    }
    let k = 0;
    while (k < reste.length && reste[k] === precedent) k++;
    if (k === reste.length) k = 0;
    precedent = reste.splice(k, 1)[0];
    sortie.push(precedent);
  }
  memoireTirages[cleStock] = reste;
  memoireDernier[cleStock] = precedent;
  return sortie;
}

/* LES DIMENSIONS DE CONTENU (CHARTE §13 bis) : ce dont la répétition se
   voit. La FIGURE en est une. Le MODE — report puis fusion — n’en est pas
   une : c’est une progression écrite, jouée dans cet ordre. */
const DIMENSIONS_CONTENU = {
  completer:[{nom:'figure à compléter', de:q => q.fig.nom}]
};
const PROGRESSIONS_DECLAREES = {
  mode:'les trois manches de report précèdent toujours les trois de fusion : '
     + 'la fusion demande de lire les DEUX moitiés, ce qui n’a de sens qu’une '
     + 'fois le report acquis'
};

function engendrerFile(cfg){
  const figures = tirerSansRepetition('figures', FIGURES, cfg.nbQuestions);
  return figures.map((fig, i) => construireManche(fig, i < 3 ? 'report' : 'fusion'));
}

/* ============================================================
   JEU #1 — « SYMBOLES MIROIRS » (ce2-symetrie-reconnaitre)
   ------------------------------------------------------------
   LA GÉOMÉTRIE D’ABORD. Une figure n’est qu’une liste de SEGMENTS —
   rien d’autre, pas même un cercle : une courbe s’écrit ici en polygone.
   Ce choix n’est pas une économie de code, c’est ce qui permet de
   RECALCULER les axes de chaque figure depuis son dessin au lieu de les
   croire déclarés (§2.5 de la spec). Le nombre annoncé dans la banque ne
   sert qu’au contrôle de données : c’est un commentaire qui a des dents.
   ============================================================ */
const chemin = (pts) => pts.slice(0, -1).map((p, i) => ['S', p, pts[i + 1]]);
const contour = (pts) => chemin(pts.concat([pts[0]]));
/* Un disque s’écrit en polygone à nombre PAIR de côtés, échantillonné à
   partir de l’angle zéro : l’ensemble des sommets est alors stable par
   θ → −θ et par θ → π−θ, donc le lobe est symétrique comme le vrai cercle
   qu’il représente. Un échantillonnage quelconque inventerait ou
   supprimerait des axes. */
const echantillonDisque = (cx, cy, r, n) => Array.from({length: n}, (_, k) => {
  const a = 2 * Math.PI * k / n;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});
/* LA RÉUNION DE PLUSIEURS LOBES, et non leurs contours empilés. Dessinés
   séparément, les trois lobes du trèfle se lisent comme trois anneaux qui
   se chevauchent : ce sont leurs arcs INTÉRIEURS qui trahissent. On ne
   garde donc que les points hors des autres lobes, et on les recoud dans
   l’ordre angulaire — la réunion de trois disques ainsi disposés est
   étoilée depuis son centre, chaque rayon n’en coupant le bord qu’une fois.
   La construction ne casse pas la symétrie : partant d’un jeu de points
   symétrique, elle rend un jeu de segments symétrique. */
function reunionDeLobes(lobes, n){
  const pts = [];
  lobes.forEach((L, i) => echantillonDisque(L[0], L[1], L[2], n).forEach(p => {
    const dedansUnAutre = lobes.some((M, j) =>
      j !== i && Math.hypot(p[0]-M[0], p[1]-M[1]) < M[2] - 1e-9);
    if (!dedansUnAutre) pts.push(p);
  }));
  const c = centreDe(pts);
  pts.sort((a, b) =>
    Math.atan2(a[1]-c[1], a[0]-c[0]) - Math.atan2(b[1]-c[1], b[0]-c[0]));
  return contour(pts);
}

const dist2p = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function sommetsDe(fig){
  const out = [];
  fig.prims.forEach(s => { out.push(s[1]); out.push(s[2]); });
  return out;
}
function centreDe(pts){
  let x = 0, y = 0;
  pts.forEach(p => { x += p[0]; y += p[1]; });
  return [x / pts.length, y / pts.length];
}
function diametreDe(fig){
  const p = sommetsDe(fig);
  let d = 0;
  for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) d = Math.max(d, dist2p(p[i], p[j]));
  return d;
}

/* Une droite : un point et une direction UNITAIRE. */
function droite(p, d){
  const n = Math.hypot(d[0], d[1]) || 1;
  return {p: [p[0], p[1]], d: [d[0] / n, d[1] / n]};
}
function refletPoint(p, L){
  const t = (p[0] - L.p[0]) * L.d[0] + (p[1] - L.p[1]) * L.d[1];
  const px = L.p[0] + t * L.d[0], py = L.p[1] + t * L.d[1];
  return [2 * px - p[0], 2 * py - p[1]];
}
const cote = (p, L) => (p[0] - L.p[0]) * L.d[1] - (p[1] - L.p[1]) * L.d[0];   // distance signée

/* Écart entre deux segments NON ORIENTÉS : on essaie les deux appariements
   de bouts et on garde le meilleur — (a,b) et (b,a) sont le même trait. */
function ecartSegments(u, v){
  return Math.min(
    Math.max(dist2p(u[1], v[1]), dist2p(u[2], v[2])),
    Math.max(dist2p(u[1], v[2]), dist2p(u[2], v[1])));
}
/* L’ERREUR DE SYMÉTRIE d’une droite pour une figure, rapportée au diamètre
   de la figure : 0 si la droite est un axe exact, et d’autant plus grande
   que la droite s’en éloigne — en ANGLE comme en POSITION, les deux à la
   fois, sans avoir à les séparer.

   UNE SEULE FONCTION POUR DEUX USAGES : le contrôle de données l’appelle
   avec une tolérance infime pour établir les axes vrais, et le verdict
   l’appelle avec une tolérance d’enfant. Deux mesures différentes de « être
   un axe » finiraient par se contredire. */
function erreurDeSymetrie(fig, L){
  const D = fig._diam || diametreDe(fig) || 1;
  let pire = 0;
  fig.prims.forEach(u => {
    const r = ['S', refletPoint(u[1], L), refletPoint(u[2], L)];
    let d0 = Infinity;
    fig.prims.forEach(v => { d0 = Math.min(d0, ecartSegments(r, v)); });
    pire = Math.max(pire, d0);
  });
  return pire / D;
}

/* LES AXES, RECALCULÉS.
   Un axe de symétrie passe forcément par le centre des sommets — la
   réflexion permute les sommets, donc fixe leur moyenne. Et il envoie le
   sommet LE PLUS ÉLOIGNÉ du centre sur un sommet aussi éloigné : les
   candidats sont donc les bissectrices des rayons (centre→V0, centre→Vk)
   pour les seuls Vk à la même distance. Il y en a au plus autant que de
   sommets, et la liste est complète — aucune recherche à l’aveugle sur
   360 degrés, aucun pas d’échantillonnage qui manquerait un axe oblique. */
const TOL_AXE_EXACT = 1e-6;
function axesDe(fig, tol){
  const pts = sommetsDe(fig);
  const c = centreDe(pts);
  let d0 = 0;
  pts.forEach(p => { d0 = Math.max(d0, dist2p(p, c)); });
  if (d0 < 1e-9) return [];
  const angles = [];
  const t0 = pts.filter(p => Math.abs(dist2p(p, c) - d0) <= d0 * 1e-9);
  const theta0 = Math.atan2(t0[0][1] - c[1], t0[0][0] - c[0]);
  t0.forEach(p => {
    const th = Math.atan2(p[1] - c[1], p[0] - c[0]);
    angles.push((theta0 + th) / 2, (theta0 + th) / 2 + Math.PI / 2);
  });
  const vus = [], axes = [];
  angles.forEach(a0 => {
    const a = ((a0 % Math.PI) + Math.PI) % Math.PI;
    if (vus.some(b => Math.abs(a - b) < 1e-7 || Math.abs(Math.abs(a - b) - Math.PI) < 1e-7)) return;
    vus.push(a);
    const L = droite(c, [Math.cos(a), Math.sin(a)]);
    if (erreurDeSymetrie(fig, L) <= (tol === undefined ? TOL_AXE_EXACT : tol)) axes.push(L);
  });
  return axes;
}

/* ------------------------------------------------------------
   LE PAPIER QUADRILLÉ, ET POURQUOI L’ACCROCHE N’EST PAS UNE AIDE
   ------------------------------------------------------------
   Le trait libre a un défaut que la mesure a confirmé : pour que le report
   au calque se superpose vraiment, il faut viser à quatre pixels près, ce
   qu’un doigt d’enfant ne fait qu’une fois sur trois. Le trait était donc
   toujours « un peu incertain ».

   La grille lève cette incertitude sans rien répondre à la place de
   l’enfant. C’est le point qui décide, et il tient à un mot : la grille est
   FIXE. Elle ne connaît pas la figure, elle est la même pour toutes, et un
   axe faux s’y accroche aussi fermement qu’un axe juste — un nœud de
   travers donne un trait de travers, franchement, sans demi-teinte. Rien à
   voir avec une aimantation vers l’axe vrai, qui répondrait à la place de
   l’enfant (§2.2). C’est un papier quadrillé posé sous le dessin, et c’est
   déjà le modèle de l’autre mini-jeu.

   Effet secondaire recherché : il n’y a plus de « presque ». Le trait tombe
   sur un axe ou visiblement à côté, et le calque le montre franchement.
   ------------------------------------------------------------ */
const PAS_GRILLE = 10;
const NOEUD_MIN = 0, NOEUD_MAX = 100;
const accrocherNoeud = (v) =>
  Math.max(NOEUD_MIN, Math.min(NOEUD_MAX, Math.round(v / PAS_GRILLE) * PAS_GRILLE));

/* ------------------------------------------------------------
   LA FIGURE NE SE POSE PAS TOUJOURS AU MILIEU
   ------------------------------------------------------------
   Toutes les figures étant centrées, leur axe tombait invariablement sur la
   colonne ou la ligne du milieu — et le quadrillage, qui rend cette
   médiane très lisible, aurait fait du « où » une évidence. On décale donc
   la figure d’un nombre entier de mailles : l’axe reste sur la grille,
   donc traçable, mais il faut le CHERCHER. Le jugement « y a-t-il un axe »
   n’est pas touché ; c’est le « lequel » qui redevient une question.

   Le décalage est un paramètre de mise en place, pas un contenu : il tombe
   sous la deuxième exclusion du §13 bis et ne se tire donc pas par cycle. */
function decalagesPossibles(fig){
  const pts = sommetsDe(fig);
  const bx = [Math.min(...pts.map(p => p[0])), Math.max(...pts.map(p => p[0]))];
  const by = [Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1]))];
  const ok = [];
  [-PAS_GRILLE, 0, PAS_GRILLE].forEach(dx => [-PAS_GRILLE, 0, PAS_GRILLE].forEach(dy => {
    if (bx[0]+dx >= NOEUD_MIN - 4 && bx[1]+dx <= NOEUD_MAX + 4
     && by[0]+dy >= NOEUD_MIN - 4 && by[1]+dy <= NOEUD_MAX + 4) ok.push([dx, dy]);
  }));
  return ok;
}
FIGURES1.forEach(f => { f._decalages = decalagesPossibles(f); });
function poserFigure(fig, d){
  const t = (p) => [p[0]+d[0], p[1]+d[1]];
  return {nom:fig.nom, axes:fig.axes, _diam:fig._diam,
    prims:fig.prims.map(u => ['S', t(u[1]), t(u[2])]),
    _axes:fig._axes.map(L => droite(t(L.p), L.d))};
}

let actx = null;
function jouerNote(freq, debut, duree, volume, forme){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = forme || 'sine'; o.frequency.value = freq;
    const t = actx.currentTime + debut;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + duree + 0.02);
  }catch(e){}
}
