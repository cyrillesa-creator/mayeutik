/* ---------- Construction des files ---------- */
/* ============================================================
   VALIDATION PARTAGÉE DES ITEMS
   ------------------------------------------------------------
   Le même dispositif qu’en M34, généralisé ici : il n’avait pas été porté,
   et le défaut est revenu sous une autre forme — trois pointes dont une
   dévie ne désignent pas d’intruse unique, les trois sont non alignées
   entre elles. Deux invariants, vérifiés sur la FIGURE réellement
   engendrée :
     1. la réponse attendue est UNIQUE, ou l’ensemble complet des réponses
        acceptables est déclaré ;
     2. rien de ce qui est annoncé ne contredit ce qui est dessiné.
   Chaque item passe ici à la génération, et un auto-test en engendre des
   centaines par mini-jeu.
   ============================================================ */
const VALIDATEURS = {
  etabli(q){
    const pb = [];
    if (q.points.length !== 4) pb.push('la désignation exige quatre pointes, pas ' + q.points.length);
    const an = analyseEtabli(q.points);
    if (!an.resteAligne) pb.push('aucune pointe ne laisse les trois autres alignées : l’intruse n’est pas unique');
    if (an.fautive !== q.fautive) pb.push('la pointe annoncée fautive n’est pas celle qui sort du rang');
    if (an.ecart < ECART_EVIDENT[0] - 1)
      pb.push('l’écart n’est pas visible à l’œil, alors qu’aucun instrument n’est offert');
    return pb;
  },
  alignement(q){
    const pb = [];
    const [a, c, b] = q.points;
    const d = Math.abs(ecartDroite(c, a, b));
    if (q.aligne && d > 0.5) pb.push('annoncé aligné, mais l’écart vaut ' + d.toFixed(1));
    if (!q.aligne && d < 1) pb.push('annoncé non aligné, mais les points le sont');
    if (q.requiert !== !q.evident) pb.push('l’exigence d’instrument ne suit pas l’évidence du cas');
    if (q.evident && d < ECART_EVIDENT[0] - 1) pb.push('cas dit évident dont l’écart ne se voit pas');
    return pb;
  },
  tracer(q){ return []; },
  angles(q){
    const pb = [];
    const vrai = angleEn(q.sommet, q.a, q.b);
    const attendu = Math.abs(vrai - 90) <= TOL_ANGLE_DROIT ? 'droit' : (vrai < 90 ? 'aigu' : 'obtus');
    if (attendu !== q.reponse) pb.push('la classe annoncée ne correspond pas à l’angle dessiné');
    return pb;
  },
  anglesPoly(q){
    const pb = [];
    q.angles.forEach((ang, i) => {
      const e = Math.abs(ang - 90);
      const attendu = e <= TOL_ANGLE_DROIT ? 'droit' : (ang < 90 ? 'aigu' : 'obtus');
      if (attendu !== q.reponses[i]) pb.push('angle ' + (i+1) + ' mal étiqueté');
      if (e < 12 && !q.douteux[i]) pb.push('angle ' + (i+1) + ' proche du droit sans être annoncé douteux');
      if (e >= 12 && q.douteux[i]) pb.push('angle ' + (i+1) + ' franc annoncé douteux');
    });
    const attenduSomme = (q.angles.length - 2) * 180;
    const somme = q.angles.reduce((x, y) => x + y, 0);
    if (Math.abs(somme - attenduSomme) > 0.5)
      pb.push('les angles ne somment pas à ' + attenduSomme + '°');
    if (q.angles.length < 4 || q.angles.length > 5)
      pb.push(q.angles.length + ' angles : la manche en veut 4 ou 5');
    const nbDouteux = q.douteux.filter(Boolean).length;
    if (nbDouteux < 1 || nbDouteux > 2) pb.push(nbDouteux + ' angles douteux : le dosage voulu est 1 ou 2');
    return pb;
  },
  priseEnMain(q){ return []; },
  compasPassant(q){ return []; },
  pliage(q){ return []; },
  compasRayon(q){
    const pb = [];
    if (q.rayonUnites * PX_PAR_UNITE > MoteurCompas.R_MAX)
      pb.push('rayon hors de portée du compas');
    return pb;
  },
  report(q){ return []; },
  codage1(q){
    const pb = [];
    const n = q.pts.length;
    q.droits.forEach(i => {
      const ang = angleEn(q.pts[i], q.pts[(i-1+n)%n], q.pts[(i+1)%n]);
      if (Math.abs(ang - 90) > 1) pb.push('sommet ' + i + ' annoncé droit sans l’être');
    });
    /* Au CE1, le programme ne prévoit QUE le code des angles droits : le
       codage des égalités de longueur est une compétence CE2. Une notation
       peut se montrer à DEUX moments, et il faut les surveiller tous les deux
       — la version précédente ne regardait que la palette, et interrogeait de
       surcroît un champ que rien n’écrivait : elle ne pouvait pas se
       déclencher, y compris pendant que le défaut était là. */
    pb.push(...horsProgramme(q, 'codage1'));
    return pb;
  },
  codage2(q){
    const pb = [];
    const n = q.pts.length;
    const L = q.pts.map((p, i) => Math.hypot(q.pts[(i+1)%n][0]-p[0], q.pts[(i+1)%n][1]-p[1]));
    q.droits.forEach(i => {
      const ang = angleEn(q.pts[i], q.pts[(i-1+n)%n], q.pts[(i+1)%n]);
      if (Math.abs(ang - 90) > 1) pb.push('sommet ' + i + ' annoncé droit sans l’être');
    });
    q.groupes.forEach(g => {
      const m = L[g[0]];
      g.forEach(i => { if (Math.abs(L[i] - m) / m > 0.02) pb.push('côtés annoncés égaux sans l’être'); });
    });
    const marques = new Set(q.groupes.reduce((a, b) => a.concat(b), []));
    L.forEach((l, i) => {
      if (marques.has(i)) return;
      q.groupes.forEach(g => {
        if (Math.abs(l - L[g[0]]) / L[g[0]] < 0.02) pb.push('un côté égal à un côté marqué reste sans marque');
      });
    });
    pb.push(...horsProgramme(q, 'codage2'));
    return pb;
  }
};

/* Aucune notation ne doit apparaître hors du palier qui l’enseigne, NI EN
   SAISIE NI EN CORRECTION. Les deux moments se contrôlent de la même façon,
   sur ce que le rendu a réellement posé — `_tamponsOfferts` pour la palette,
   `_codeAffiche` relu sur le dessin de correction. Avant le rendu ces deux
   champs sont absents et le contrôle se tait : il porte sur l’affichage, pas
   sur la figure, et une figure qui possède des égalités reste légitime au CE1
   — on ne les code simplement pas. */
const CODE_DU_TAMPON = {droit:'droit', simple:'egalite', double:'egalite'};
function horsProgramme(q, mode){
  const permis = new Set(NOTATIONS[mode].map(t => CODE_DU_TAMPON[t]));
  const pb = [];
  (q._tamponsOfferts || []).forEach(t => {
    if (!permis.has(CODE_DU_TAMPON[t]))
      pb.push('le tampon « ' + t +' » est proposé hors de son palier');
  });
  (q._codeAffiche || []).forEach(c => {
    if (!permis.has(c))
      pb.push('la correction affiche le codage « ' + c + ' », qui n’est pas au programme de ce palier');
  });
  return pb;
}
/* ============================================================
   LES DIMENSIONS DE CONTENU D’UNE MANCHE (CHARTE §13 bis)
   ------------------------------------------------------------
   Ce dont la répétition SE VOIT, déclaré ici et non dans la suite de tests :
   c’est le module qui sait ce qu’il montre. `de(q)` lit la valeur sur la
   manche engendrée ; `ferme` marque un stock qu’aucun élargissement ne peut
   agrandir, et doit alors dire pourquoi.
   ============================================================ */
const DIMENSIONS_CONTENU = {
  tracer:[
    {nom:'orientation de la droite', de:q => q.orientation,
     ferme:'une droite se pose horizontalement, verticalement ou en biais — il n’y a pas de quatrième façon'}
  ],
  anglesPoly:[
    {nom:'nombre de côtés', de:q => String(q.pts.length),
     ferme:'le mini-jeu alterne quadrilatère et pentagone : au-delà, la revue de tous les angles devient mécanique'}
  ],
  codage1:[
    {nom:'figure à coder', de:q => q.type,
     ferme:'trois figures du palier portent des angles droits à coder ; le losange et l’isocèle n’en ont aucun'}
  ],
  codage2:[
    {nom:'figure à coder', de:q => q.type,
     ferme:'la progression du CE2 est écrite — du carré au triangle isocèle, chaque figure une fois et dans cet ordre'}
  ],
  compasRayon:[
    {nom:'rayon demandé', de:q => String(q.rayonUnites),
     ferme:'les rayons vont de deux à quatre unités, une manche chacun'}
  ]
};

/* LES MODES QUI N’ONT AUCUNE DIMENSION DE CONTENU, et pourquoi. Les déclarer
   vaut mieux que les omettre : un mode absent des deux listes est un mode
   qu’on a oublié d’examiner, et l’auto-test le dit. */
const MODES_SANS_CONTENU = {
  alignement:'la représentation (établi puis plan) et la part d’écarts évidents sont des progressions déclarées, pas des tirages ; la position des pointes est un paramètre continu',
  etabli:'même chose : les pointes se tirent dans un intervalle continu',
  angles:'la classe de l’angle EST la réponse cherchée, et le mini-jeu demande justement de la vérifier au gabarit puis à l’équerre — la faire tourner l’offrirait à qui compte les manches',
  report:'le verdict — égaux, l’un plus long — est la réponse cherchée ; la part de cas « proches » est un dosage voulu, pas un cycle',
  priseEnMain:'manche d’essai unique, hors file notée',
  compasPassant:'le cercle passant par deux points se construit sur des points tirés dans un intervalle continu',
  pliage:'une seule figure, pliée : rien à faire tourner'
};

function verifierItem(q){
  const f = VALIDATEURS[q.mode];
  return f ? f(q) : [];
}
function verifierFile(f){
  return f.map((q, i) => ({i, mode:q.mode, pb:verifierItem(q)})).filter(x => x.pb.length);
}

function engendrerFile(cfg){
  const n = cfg.nbQuestions;
  if (cfg.mode === 'alignement') {
    const nEtabli = cfg.etabli || 0;
    const surPlan = n - nEtabli;
    const nEvidents = Math.round(surPlan * (cfg.dosageEvident || 0));
    const items = melanger(
      Array.from({length: surPlan}, (_, i) => itemAlignement(i < nEvidents))
    ).map((it, i) => Object.assign(it, {
      mode:'alignement', note:true,
      /* Au CE1, l’enfant doit parfois PLACER un point pour qu’il soit
         aligné, et non plus seulement juger. */
      placer: !!cfg.placer && i === surPlan - 1
    }));
    /* Le premier temps est physique : des pointes plantées dans l’établi,
       vues de biais. Le second reprend LES MÊMES emplacements vus de
       dessus. Ce basculement de représentation est ce que le texte
       demande — pas un changement d’exercice. */
    /* Sur l’établi, l’enfant n’a AUCUN instrument : la pointe fautive doit
       donc se voir, et il doit y en avoir une. Un tirage « non évident »
       donnait tantôt un écart de 2 px, indécidable, tantôt trois pointes
       réellement alignées — et la consigne « une pointe n’est pas dans le
       rang » désignait alors une pointe qui l’était. */
    /* QUATRE pointes, pas trois. Avec trois pointes dont une dévie, les
       trois sont « non alignées » entre elles et n’importe laquelle peut
       passer pour l’intruse : l’item n’a pas de réponse unique. Trois
       alignées et une seule à l’écart, et l’intruse le devient. Le jugement
       « sont-elles alignées ? » n’a pas cette exigence : trois y suffisent. */
    const etabli = Array.from({length: nEtabli}, () =>
      Object.assign(itemEtabli(), {mode:'etabli', note:true, requiert:false}));
    return etabli.concat(items);
  }
  if (cfg.mode === 'tracer')
    /* L’orientation était une SUITE ÉCRITE EN DUR, donc identique à chaque
       partie — et elle plaçait deux obliques côte à côte (§13 bis, clause 2).
       Trois orientations pour cinq manches : le stock est fermé par nature,
       il n’existe pas de quatrième façon de poser une droite ici. */
    return tirerSansRepetition('tracer-orientation',
      ['horizontale','verticale','oblique'], n)
      .map(orientation => ({mode:'tracer', note:true, requiert:true, orientation}));
  if (cfg.mode === 'angles')
    return Array.from({length:n}, (_, i) =>
      Object.assign(itemAngle(true), {mode:'angles', note:true, outil: i < 3 ? 'gabarit' : 'equerre'}));
  if (cfg.mode === 'anglesPoly')
    /* Le NOMBRE DE CÔTÉS est un contenu : trois quadrilatères d’affilée
       installent la routine que le pentagone est justement là pour empêcher.
       Il se tirait à pile ou face — 288 répétitions immédiates pour 300
       files. La réponse, elle, reste imprévisible : c’est la figure qui
       tourne, pas le verdict. */
    return tirerSansRepetition('poly-cotes', [4, 5], n)
      .map(cotes => Object.assign(itemPolygone(cotes), {mode:'anglesPoly', note:true, requiert:true}));
  if (cfg.mode === 'compas1')
    return [
      /* La prise en main n’est plus ici : `construireFile` la pose devant la
         file, une seule fois par profil et pour les quatre instruments (A2).
         La manche qu’elle occupait revient au cercle, qui est la compétence
         annoncée — le mini-jeu retrouve ses cinq manches notées. */
      {mode:'compasPassant', note:true, requiert:true},
      {mode:'compasPassant', note:true, requiert:true},
      {mode:'compasPassant', note:true, requiert:true},
      {mode:'pliage', note:true, requiert:true},
      {mode:'pliage', note:true, requiert:true}
    ];
  if (cfg.mode === 'compas2')
    return [
      {mode:'compasRayon', note:true, requiert:true, rayonUnites:2},
      {mode:'compasRayon', note:true, requiert:true, rayonUnites:3},
      {mode:'report', note:true, requiert:true},
      {mode:'report', note:true, requiert:true},
      {mode:'compasRayon', note:true, requiert:true, rayonUnites:4}
    ];
  if (cfg.mode === 'codage1')
    /* La liste portait des DOUBLONS pour pondérer — « carre » et
       « rectangle » deux fois —, ce que le §13 bis interdit : les doublons
       s’épuisent ensemble et deux figures identiques se suivaient une fois
       sur deux. Trois figures du palier portent des angles droits à coder ;
       le stock est fermé par nature. */
    return tirerSansRepetition('codage1-figures', ['carre','rectangle','triangleRect'], n)
      .map(t => Object.assign(figureCodage(t), {mode:'codage1', note:true, requiert:false}));
  /* CE2 : la progression des figures EST le raisonnement à construire —
     du carré (une seule marque répétée) au rectangle (deux groupes, deux
     notations : l’exemple de réussite officiel), puis les cas limites. */
  return ['carre','rectangle','losange','triangleRect','isocele']
    .map(t => Object.assign(figureCodage(t), {mode:'codage2', note:true}));
}
/* Aucune partie ne démarre sur un item que la validation refuse. En
   pratique les fabriques sont écrites pour ne pas en produire ; ce filet
   existe pour qu’un scénario ajouté demain ne réintroduise pas en silence
   un item mal posé. */
function construireFile(cfg){
  let f = engendrerFile(cfg);
  for (let essai = 0; essai < 25 && verifierFile(f).length; essai++) f = engendrerFile(cfg);
  const restants = verifierFile(f);
  if (restants.length) console.warn('M35 : items non conformes', restants);
  /* La manche d’essai se pose DEVANT la file, une seule fois dans la vie du
     profil, et n’entre ni dans le score (`note:false`) ni dans les pastilles
     (`essai`). */
  const outil = instrumentDuMiniJeu(cfg);
  if (outil && !instrumentDejaVu(lireProfilActifId(), outil))
    f.unshift({mode:'priseEnMain', outil, note:false, essai:true});
  return f;
}

function pointsManche(q){ return q.note === false ? 0 : PTS_PLEIN; }

/* ---------- Lancement ---------- */
function trouverMiniJeu(id){
  for (const nom of ORDRE_PALIERS) {
    const p = CONTENU.paliers[nom];
    if (!p) continue;
    const cfg = p.miniJeux.find(m => m.id === id);
    if (cfg) return {cfg, palier:p, palierNom:nom};
  }
  return null;
}
function lance(id){
  const t = trouverMiniJeu(id);
  if (!t) return;
  miniJeuCourant = t;
  file = construireFile(t.cfg);
  pos = 0; score = 0;
  total = file.reduce((s, q) => s + pointsManche(q), 0);
  demarreLe = Date.now();
  $('hdrTitle').textContent = t.cfg.titre;
  montreEcran('game');
  question();
}
function majDots(){
  /* Une manche d’ESSAI n’avance à rien : elle ne prend pas de pastille, sans
     quoi « pas de progression » serait démenti par la barre elle-même. Tant
     qu’on y est, c’est la première manche notée qui porte le repère. */
  const notees = file.map((q, i) => ({q, i})).filter(x => !x.q.essai);
  const courant = (file[pos] && file[pos].essai)
    ? (notees.find(x => x.i > pos) || {i: -1}).i
    : pos;
  $('dots').innerHTML = notees.map(({q, i}) => {
    let c = '';
    if (i < pos) c = q._pts === PTS_PLEIN ? 'ok' : q._pts === PTS_SANS_VERIF ? 'demi' : (q.note === false ? 'ok' : 'ko');
    else if (i === courant) c = 'cur';
    return `<span class="dot ${c}"></span>`;
  }).join('');
}
function message(t, cl, corr){
  const f = $('feedback');
  f.textContent = t || ''; f.className = cl || '';
  if (corr) {
    const s = document.createElement('span');
    s.className = 'correction-attendue'; s.textContent = ' ' + corr;
    f.appendChild(s);
  }
}
function poserConsigne(t){
  $('qText').innerHTML = '';
  const s = document.createElement('span'); s.textContent = t;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn-voix'; b.textContent = '🔊';
  b.setAttribute('aria-label', 'Écouter la consigne');
  b.addEventListener('click', () => lireAVoixHaute(t));
  $('qText').append(s, b);
  lireAVoixHaute(t);
}
function scene(){ return $('scene'); }
function poserScene(inner, viewBox){
  const s = scene();
  s.setAttribute('viewBox', viewBox || '0 0 400 300');
  s.innerHTML = inner;
  $('plan').hidden = false;
  return s;
}
const croix = (p, cl) => `<g class="${cl||'point-croix'}"><line x1="${p[0]-7}" y1="${p[1]-7}" x2="${p[0]+7}" y2="${p[1]+7}"/><line x1="${p[0]-7}" y1="${p[1]+7}" x2="${p[0]+7}" y2="${p[1]-7}"/></g>`;

/* ---------- Le tour de jeu ---------- */
function question(){
  desarmerAutoSuivant(); stopperVoix();
  const q = file[pos];
  if (compasCourant) { compasCourant.detruire(); compasCourant = null; }
  verrouille = false; posableCourant = null; selection = new Set();
  $('feedback').textContent = ''; $('feedback').className = '';
  $('btnNext').style.display = 'none';
  $('btnValider').style.display = 'none';
  $('answers').innerHTML = ''; $('answers').className = '';
  $('barreOutils').hidden = true; $('barreOutils').innerHTML = '';
  $('plan').hidden = true;
  $('sousConsigne').textContent = '';
  majDots();
  const rendus = {
    etabli:rendreEtabli, alignement:rendreAlignement, tracer:rendreTracer,
    angles:rendreAngles, anglesPoly:rendreAnglesPoly,
    priseEnMain:rendrePriseEnMain,
    compasPassant:rendreCompasPassant, pliage:rendrePliage,
    compasRayon:rendreCompasRayon, report:rendreReport,
    codage1:rendreCodage1, codage2:rendreCodage2
  };
  rendus[q.mode](q);
}

/* QCM générique — options mélangées (§13), bonne réponse montrée même si
   elle n’a pas été touchée (§18). */
function rendreQcm(opts, ans, apres, classe){
  const zone = $('answers');
  zone.className = classe || (opts.length === 3 ? 'trio' : opts.length === 2 ? 'duo' : '');
  melanger(opts).forEach(o => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'rep'; b.textContent = o;
    b.dataset.val = o;
    b.addEventListener('click', () => {
      if (verrouille) return;
      verrouille = true;
      const bon = o === ans;
      zone.querySelectorAll('.rep').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
      b.classList.add(bon ? 'ok' : 'ko');
      if (!bon) {
        const c = [...zone.querySelectorAll('.rep')].find(x => x.dataset.val === ans);
        if (c) { c.classList.remove('dim'); c.classList.add('ok'); }
      }
      apres(bon);
    });
    zone.appendChild(b);
  });
}

/* ============================================================
   CP — 1er temps : l’établi (objet réel avant sa représentation)
   ============================================================ */
function rendreEtabli(q){
  poserConsigne('Une pointe n’est pas dans le rang. Touche-la !');
  $('sousConsigne').textContent = 'Le verrier plante des pointes pour caler le verre : si l’une dévie, la pièce coince.';
  const pts = q.points;
  /* L’indice de la pointe déviée est CALCULÉ par la fabrique sur les points
     réellement produits — il n’est plus supposé d’après l’ordre de
     construction, qui n’a aucune raison d’être stable. */
  const fautive = q.fautive;
  const sol = `<rect x="0" y="132" width="400" height="168" fill="var(--bois)"/>`
    + `<rect x="0" y="132" width="400" height="7" fill="var(--bois-f)"/>`;
  /* Le plateau est vu de biais : l’écart PERPENDICULAIRE à la rangée se
     lit en profondeur, donc sur l’axe vertical. Une première projection
     l’écrasait au dixième — un défaut de 20 px devenait un défaut de 2 px,
     invisible, alors que c’est tout ce que l’enfant a pour répondre. */
  const projetes = pts.map(p => [p[0], 206 + (p[1] - 140) * 0.68]);
  poserScene(sol + projetes.map((p, i) =>
    `<g class="pointe" data-i="${i}">`
    + `<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1]-46}" stroke="var(--trait)" stroke-width="5" stroke-linecap="round"/>`
    + `<circle cx="${p[0]}" cy="${p[1]-50}" r="8" fill="var(--mine)"/>`
    + `<circle class="cible-tactile" cx="${p[0]}" cy="${p[1]-30}" r="20"/></g>`).join(''));
  scene().querySelectorAll('.pointe').forEach(g => {
    g.addEventListener('click', () => {
      if (verrouille) return;
      verrouille = true;
      const bon = +g.dataset.i === fautive;
      /* La tête est un disque REMPLI : la colorer demande `fill`, pas
         `stroke` — sans quoi la bonne pointe reste noire et la §18 n’est
         pas tenue. */
      const teindre = (grp, c) => {
        grp.querySelectorAll('line').forEach(e => e.setAttribute('stroke', c));
        grp.querySelectorAll('circle:not(.cible-tactile)').forEach(e => e.setAttribute('fill', c));
      };
      if (!bon) {
        const c = scene().querySelector(`.pointe[data-i="${fautive}"]`);
        if (c) teindre(c, 'var(--menthe-t)');
      }
      teindre(g, bon ? 'var(--menthe-t)' : 'var(--corail)');
      terminerManche(bon, bon ? PTS_PLEIN : 0,
        bon ? 'La pièce de verre se cale : elle tient !' : null,
        bon ? null : 'C’est la pointe verte qui sortait du rang.');
    });
  });
}

/* ============================================================
   ALIGNEMENT — le cœur du module
   ============================================================ */
function rendreAlignement(q){
  if (q.placer) return rendrePlacer(q);
  poserConsigne('Ces trois points sont-ils alignés ?');
  $('sousConsigne').textContent = q.requiert
    ? 'Pose la règle sur les points pour en être sûr : à l’œil, on ne peut pas trancher.'
    : 'Ici, un coup d’œil peut suffire. La règle reste à ta disposition.';
  poserScene(q.points.map(p => croix(p)).join(''));
  const svg = scene();
  const centre = milieu(q.points[0], q.points[2]);
  posableCourant = creerPosable(svg, {
    x: centre[0], y: centre[1] + 62, angle: entre(-0.25, 0.25),
    ...REGLE(330),
    pointsAimant: q.points,
    surChangement: (e) => {
      /* L’instrument est réputé POSÉ dès que son bord rencontre deux des
         trois points — et c’est le posable lui-même qui le dit désormais,
         puisque c’est lui qui allume les points rencontrés. */
      if (e.surBord.length >= 2) q._instrumentPose = true;
    }
  });
  rendreQcm(['Alignés', 'Pas alignés'], q.aligne ? 'Alignés' : 'Pas alignés', (bon) => {
    posableCourant.verrouiller();
    const manque = q.requiert && !q._instrumentPose;
    const pts = !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN);
    /* Révélation différée (§18) : la règle rejoint la droite exacte des
       deux points extrêmes ; l’écart du point du milieu se voit alors. */
    clearTimeout(minuteurRevel);
    minuteurRevel = setTimeout(() => {
      if (!posableCourant || !posableCourant.g.isConnected) return;
      const a = q.points[0], b = q.points[2];
      /* L’origine de la règle est le MILIEU de son bord : la poser sur le
         premier point ferait déborder la moitié gauche hors du plan et
         laisserait le troisième point au-delà de son extrémité. */
      const m = milieu(a, b);
      posableCourant.placerExact(m[0], m[1], Math.atan2(b[1]-a[1], b[0]-a[0]));
    }, DELAI_REVELATION);
    let corr = null;
    if (!bon) corr = q.aligne ? 'Ils étaient bien alignés : la règle le montre.'
                              : 'Ils ne l’étaient pas — regarde l’écart sous la règle.';
    else if (manque) corr = 'Mais ici, l’œil ne suffisait pas : il fallait poser la règle.';
    terminerManche(bon, pts, bon && !manque ? (q.evident ? 'Bien vu — ici, l’œil suffisait.' : 'Bien vérifié !') : null, corr);
  });
}

/* CE1 : placer un point pour qu’il soit aligné avec deux autres. */
function rendrePlacer(q){
  poserConsigne('Place la troisième pointe entre les deux autres, dans leur alignement.');
  /* DEUX TEMPS DISTINCTS. La pointe se posait au RELÂCHEMENT de la règle :
     l’enfant n’avait pas la main, et le simple fait de lâcher l’instrument
     valait réponse. On cale d’abord, puis on appuie sur le bord — et
     relâcher l’instrument ne fait jamais rien. */
  $('sousConsigne').textContent = 'D’abord cale la règle sur les deux pointes. Ensuite, appuie sur son bord à l’endroit voulu.';
  const a = q.points[0], b = q.points[2];
  poserScene(croix(a) + croix(b));
  const svg = scene();
  posableCourant = creerPosable(svg, {
    x: milieu(a, b)[0], y: milieu(a, b)[1] + 58, angle: entre(-0.25, 0.25),
    ...REGLE(330), pointsAimant:[a, b],
    surChangement:(e) => {
      if (e.surBord.length >= 2) {
        q._instrumentPose = true;
        $('sousConsigne').textContent = 'La règle est calée : appuie maintenant sur son bord, entre les deux pointes.';
      }
    },
    /* Le toucher ne compte QUE sur une règle calée sur les deux pointes :
       sinon on placerait un point d’après une règle posée n’importe où. */
    surTap:(p) => {
      if (verrouille) return;
      if (!q._instrumentPose) {
        $('sousConsigne').textContent = 'Cale d’abord la règle sur les deux pointes.';
        return;
      }
      verrouille = true;
      const ecart = Math.abs(ecartDroite(p, a, b));
      const dedans = p[0] > Math.min(a[0],b[0]) - 20 && p[0] < Math.max(a[0],b[0]) + 20;
      const bon = ecart <= 8 && dedans;
      posableCourant.verrouiller();
      svg.insertAdjacentHTML('beforeend', croix(p, bon ? 'trace-fait' : 'point-croix'));
      if (!bon) svg.insertAdjacentHTML('beforeend',
        `<line class="trace-fait" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-dasharray="7 6"/>`);
      terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Pile dans l’alignement !' : null,
        bon ? null : 'La pointe devait tomber sur la ligne verte, entre les deux autres.');
    }
  });
}

/* ============================================================
   CP — tracer une droite par deux points (seule production admise)
   ============================================================ */
function rendreTracer(q){
  /* « Tracer le plomb » ne veut rien dire pour un enfant de six ans, et le
     programme emploie justement les mots justes : « tracer une droite
     passant par deux points ». */
  poserConsigne('Trace une droite qui passe par ces deux points.');
  $('sousConsigne').textContent = 'Cale la règle sur les deux points, puis valide sa position.';
  let a, b;
  if (q.orientation === 'horizontale') { const y = entre(110, 190); a = [70, y]; b = [330, y]; }
  else if (q.orientation === 'verticale') { const x = entre(140, 260); a = [x, 50]; b = [x, 250]; }
  else { a = [entre(60, 110), entre(60, 110)]; b = [entre(280, 340), entre(190, 250)]; }
  q._a = a; q._b = b;
  poserScene(croix(a) + croix(b));
  const svg = scene();
  const c = milieu(a, b);
  posableCourant = creerPosable(svg, {
    x:c[0], y:c[1] + 60, angle:entre(-0.3, 0.3), ...REGLE(330), pointsAimant:[a, b],
    surChangement:(e) => {
      const ok = e.surBord.length >= 2;
      q._alignee = ok; q._instrumentPose = q._instrumentPose || ok;
    },
    /* LE TRACÉ SE FAIT EN DEUX TEMPS. On appuie sur le bord pour tracer —
       c’est le geste réel, et un bouton « tracer » l’aurait remplacé par une
       déclaration. Mais poser une règle demande plusieurs reprises : on la
       glisse, on la tourne, on la reglisse. Or un appui sans déplacement est
       lu comme un toucher, si bien qu’un simple recalage valait tracé, et la
       manche se terminait au milieu du placement.
       D’où un cran intermédiaire : tant que la position n’est pas validée, le
       bord ne trace pas. Une fois validée, la règle est FIGÉE — elle ne peut
       plus bouger, donc l’appui suivant ne peut plus être qu’un tracé. */
    surTap:() => { if (!verrouille && q._calee) tracerLaDroite(); }
  });
  /* §18 : valider la POSITION n’est pas répondre — on ne juge rien ici, et
     aucune position n’est refusée. C’est l’enfant qui dit « j’ai fini de
     placer », pas le jeu qui approuve. */
  const btnCaler = $('btnValider');
  btnCaler.style.display = 'block';
  btnCaler.textContent = '📏 Ma règle est bien placée';
  btnCaler.onclick = () => {
    if (verrouille || q._calee) return;
    q._calee = true;
    sonClic();
    posableCourant.figer();
    btnCaler.style.display = 'none';
    $('sousConsigne').textContent = 'Appuie maintenant sur le bord de la règle pour tracer le trait.';
  };
  const tracerLaDroite = () => {
    if (verrouille) return;
    verrouille = true;
    posableCourant.verrouiller();
    const bon = !!q._alignee;
    if (bon) svg.insertAdjacentHTML('beforeend', droiteSvg(a, b, 'trace-fait'));
    else {
      clearTimeout(minuteurRevel);
      minuteurRevel = setTimeout(() => {
        if (!posableCourant || !posableCourant.g.isConnected) return;
        const m = milieu(a, b);
        posableCourant.placerExact(m[0], m[1], Math.atan2(b[1]-a[1], b[0]-a[0]));
        if (svg.isConnected) svg.insertAdjacentHTML('beforeend', droiteSvg(a, b, 'trace-fait', '7 6'));
      }, DELAI_REVELATION);
    }
    terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Belle droite !' : null,
      bon ? null : 'La règle devait passer par les deux points — regarde.');
  };
}

/* Une DROITE, pas un segment : le trait DÉPASSE des deux points, de chaque
   côté. C’est le mot du programme au CP, et la distinction se construit
   ici, visuellement. */
function droiteSvg(a, b, classe, tirets){
  const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy) || 1;
  const e = 46;                       // débord de part et d’autre
  const p1 = [a[0] - dx/L*e, a[1] - dy/L*e];
  const p2 = [b[0] + dx/L*e, b[1] + dy/L*e];
  return `<line class="${classe}" x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}"`
    + ` x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}"`
    + (tirets ? ` stroke-dasharray="${tirets}"` : '') + `/>`;
}

/* ============================================================
   CE1 / CE2 — angles au gabarit puis à l’équerre
   ============================================================ */
function rendreAngles(q){
  const outil = q.outil || 'gabarit';
  poserConsigne('Cet angle est-il droit, aigu ou obtus ?');
  /* Le bouton de rotation n’est pas découvrable seul : la consigne décrit
     les deux temps du geste. */
  $('sousConsigne').textContent = outil === 'gabarit'
    ? 'Cale le coin du gabarit sur le coin de la figure, puis tire le bouton orange pour le faire pivoter.'
    : 'Même geste avec l’équerre : cale son coin, puis tire le bouton orange.';
  /* Le plan gagne une BANDE DE RANGEMENT sous la figure : l’instrument y
     attend entièrement visible. Garé à côté du sommet, il débordait du
     plan et se présentait tronqué. */
  poserScene(
    `<line class="fig-trait" x1="${q.sommet[0]}" y1="${q.sommet[1]}" x2="${q.a[0]}" y2="${q.a[1]}"/>`
    + `<line class="fig-trait" x1="${q.sommet[0]}" y1="${q.sommet[1]}" x2="${q.b[0]}" y2="${q.b[1]}"/>`
    + `<circle class="repere" cx="${q.sommet[0]}" cy="${q.sommet[1]}" r="4"/>`
    + `<line x1="20" y1="250" x2="380" y2="250" stroke="var(--trait)" stroke-width="1.4" stroke-dasharray="5 6" opacity=".5"/>`,
    '0 0 400 370');
  const svg = scene();
  posableCourant = creerPosable(svg, {
    x:54, y:258, angle:entre(-0.4, 0.4),
    ...(outil === 'gabarit' ? GABARIT(90) : EQUERRE(92)),
    pointsAimant:[q.sommet],
    /* B4 : les deux côtés issus du sommet, lus sur la figure dessinée. */
    directionsAimant:[Math.atan2(q.a[1]-q.sommet[1], q.a[0]-q.sommet[0]),
                      Math.atan2(q.b[1]-q.sommet[1], q.b[0]-q.sommet[0])],
    surChangement:(e) => {
      /* Le gabarit est réputé posé quand son COIN s’est ancré sur le
         sommet : c’est l’ancrage lui-même qui le dit, et c’est autour de ce
         point que l’instrument pivote ensuite. */
      if (e.ancre !== null) q._instrumentPose = true;
    }
  });
  rendreQcm(['droit','aigu','obtus'], q.reponse, (bon) => {
    posableCourant.verrouiller();
    const manque = q.requiert && !q._instrumentPose;
    const pts = !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN);
    clearTimeout(minuteurRevel);
    minuteurRevel = setTimeout(() => {
      if (!posableCourant || !posableCourant.g.isConnected) return;
      /* On repose l’outil EXACTEMENT dans le sommet, aligné sur le premier
         côté : l’écart avec le second saute alors aux yeux. */
      posableCourant.placerExact(q.sommet[0], q.sommet[1],
        Math.atan2(q.a[1]-q.sommet[1], q.a[0]-q.sommet[0]));
    }, DELAI_REVELATION);
    terminerManche(bon, pts, bon && !manque ? 'Bien vérifié !' : null,
      !bon ? 'C’était un angle ' + q.reponse + ' — regarde le gabarit se poser.'
           : (manque ? 'Mais il fallait poser l’instrument : à 3° près, l’œil se trompe.' : null));
  });
}

/* CE2 : ce n’est plus un angle isolé mais un POLYGONE à passer en revue. */
function rendreAnglesPoly(q){
  const i = (q._sommet = q._sommet || 0);
  poserConsigne('Angle ' + (i+1) + ' sur ' + q.pts.length + ' : droit, aigu, obtus ?');
  $('sousConsigne').textContent = q.douteux[i]
    ? 'Celui-ci est douteux : pose l’équerre.'
    : 'Celui-ci se voit à l’œil — l’équerre reste possible.';
  const d = 'M ' + q.pts.map(p => p.join(' ')).join(' L ') + ' Z';
  poserScene(`<path class="fig-remplie" d="${d}"/>`
    + `<circle class="sommet-actif" cx="${q.pts[i][0]}" cy="${q.pts[i][1]}" r="16"/>`
    + `<line x1="20" y1="250" x2="380" y2="250" stroke="var(--trait)" stroke-width="1.4" stroke-dasharray="5 6" opacity=".5"/>`,
    '0 0 400 370');
  const svg = scene();
  const s = q.pts[i];
  const n = q.pts.length;
  const voisins = [q.pts[(i-1+n)%n], q.pts[(i+1)%n]];
  posableCourant = creerPosable(svg, {
    x:54, y:258, angle:entre(-0.3, 0.3), ...EQUERRE(88), pointsAimant:[s],
    /* B4 : les deux côtés du polygone qui partent du sommet examiné. */
    directionsAimant:[voisins[0], voisins[1]].map(v => Math.atan2(v[1]-s[1], v[0]-s[0])),
    surChangement:(e) => { if (e.ancre !== null) q._instrumentPose = true; }
  });
  rendreQcm(['droit','aigu','obtus'], q.reponses[i], (bon) => {
    posableCourant.verrouiller();
    const manque = q.douteux[i] && !q._instrumentPose;
    q._bons = (q._bons || 0) + (bon && !manque ? 1 : bon ? 0.5 : 0);
    if (i + 1 < q.pts.length) {
      /* On enchaîne les sommets dans la même manche : c’est le polygone
         entier qui est passé en revue, pas un angle isolé. */
      message(bon ? 'Oui.' : 'Non : ' + q.reponses[i] + '.', bon ? 'bon' : 'mauvais');
      $('btnNext').style.display = 'block';
      $('btnNext').textContent = 'Angle suivant ➜';
      $('btnNext').onclick = () => {
        q._sommet = i + 1; q._instrumentPose = false; verrouille = false;
        $('answers').innerHTML = ''; $('btnNext').style.display = 'none'; message('');
        rendreAnglesPoly(q);
      };
      armerAutoSuivant();
      return;
    }
    const ratio = q._bons / q.pts.length;
    const pts = ratio >= 0.999 ? PTS_PLEIN : ratio >= 0.7 ? PTS_SANS_VERIF : 0;
    terminerManche(ratio >= 0.999, pts,
      ratio >= 0.999 ? 'Polygone entièrement contrôlé !' : null,
      ratio >= 0.999 ? null : 'Certains angles t’ont échappé : ' + q.reponses.join(', ') + '.');
  });
}

/* ============================================================
   PRISE EN MAIN — la manche d’essai, une fois par instrument (A2)
   ============================================================ */
/* Ce qu’on montre est le GESTE, pas la tâche : une figure quelconque, sur
   laquelle il n’y a rien à réussir, et de quoi manipuler. Un instrument
   qu’on n’a pas encore tenu ne s’explique pas par une consigne — c’est le
   constat qui a motivé A2 ; on ne remplace donc pas la consigne, on lui
   donne d’abord un objet à décrire. */
const PRISE_EN_MAIN = {
  regle: {
    titre: 'La règle',
    geste: 'Glisse la règle pour la déplacer. Tire un bouton orange : elle pivote autour de son AUTRE bout.',
    aide: 'Approche une extrémité d’une croix : le point s’allume, la règle s’y accroche.'
  },
  gabarit: {
    titre: 'Le gabarit',
    geste: 'Glisse le gabarit, puis cale son coin sur le coin de la figure.',
    aide: 'Une fois calé, tire le bouton orange : il pivote autour du coin.'
  },
  equerre: {
    titre: 'L’équerre',
    geste: 'Glisse l’équerre, puis cale son coin sur le coin de la figure.',
    aide: 'Une fois calée, tire le bouton orange : elle pivote autour du coin.'
  },
  compas: {
    titre: 'Le compas',
    geste: 'Plante la pointe, puis glisse sans lever le doigt pour l’ouvrir.',
    aide: 'Quand tu relâches, le compas trace son cercle tout seul.'
  }
};

function rendrePriseEnMain(q){
  const d = PRISE_EN_MAIN[q.outil] || PRISE_EN_MAIN.regle;
  poserConsigne(d.titre + ' — essaie-le, rien n’est compté.');
  $('sousConsigne').textContent = d.geste + ' ' + d.aide;

  if (q.outil === 'compas') {
    const svg = poserScene(
      `<text class="compas-invite" x="200" y="${ZONE_TRACE.y0 - 14}" text-anchor="middle">Appuie n’importe où, puis glisse sans lever le doigt.</text>`,
      VB_COMPAS);
    compasCourant = MoteurCompas.creerCompas(svg, {
      zone: ZONE_TRACE,
      surPointe: () => { const t = svg.querySelector('.compas-invite'); if (t) t.remove(); sonClic(); },
      /* On n’efface RIEN entre deux essais : voir ses cercles s’accumuler,
         c’est voir ce que l’instrument fait. */
      surTrace: () => sonClic()
    });
  } else {
    /* Une figure sans enjeu : trois croix pour la règle, un coin pour le
       gabarit et l’équerre — de quoi éprouver l’accrochage sans qu’il y ait
       quoi que ce soit à trouver. */
    const s = [150, 130], a = [300, 130], b = [150, 246];
    const points = q.outil === 'regle'
      ? [[70, 96], [200, 140], [330, 184]]
      : [s];
    poserScene(
      (q.outil === 'regle'
        ? points.map(p => croix(p)).join('')
        : `<line class="fig-trait" x1="${s[0]}" y1="${s[1]}" x2="${a[0]}" y2="${a[1]}"/>`
          + `<line class="fig-trait" x1="${s[0]}" y1="${s[1]}" x2="${b[0]}" y2="${b[1]}"/>`
          + `<circle class="repere" cx="${s[0]}" cy="${s[1]}" r="4"/>`)
      + `<line x1="20" y1="250" x2="380" y2="250" stroke="var(--trait)" stroke-width="1.4" stroke-dasharray="5 6" opacity=".5"/>`,
      '0 0 400 370');
    const svg = scene();
    posableCourant = q.outil === 'regle'
      ? creerPosable(svg, {x:200, y:300, angle:entre(-0.2, 0.2), ...REGLE(330), pointsAimant:points})
      : creerPosable(svg, {x:54, y:258, angle:entre(-0.4, 0.4),
          ...(q.outil === 'gabarit' ? GABARIT(90) : EQUERRE(92)), pointsAimant:[s]});
  }

  /* AUCUNE VALIDATION, et pas de passage automatique (§20) : l’enfant sort
     quand IL a fini. Le bouton est là dès la première seconde. */
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = 'J’ai compris, on commence ➜';
  $('btnNext').onclick = () => {
    marquerInstrumentVu(lireProfilActifId(), q.outil);
    pos++; if (pos < file.length) question(); else fin();
  };
}

/* ============================================================
   COMPAS — CE1 : deux appuis ; CE2 : écartement mesuré
   ============================================================ */
/* Le texte dit « cercle de centre un point donné ET PASSANT PAR un autre
   point donné » : l’écartement n’est pas réglé, il est DÉRIVÉ des deux
   appuis. Le problème du réglage disparaît, et c’est la formulation
   officielle exacte. */
function rendreCompasPassant(q){
  const c = [entre(150, 250), entre(ZONE_TRACE.y0 + 50, ZONE_TRACE.y1 - 60)];
  const angle = entre(0, TAU);
  const rAttendu = entre(52, 92);
  const p = [c[0] + Math.cos(angle) * rAttendu, c[1] + Math.sin(angle) * rAttendu];
  q._c = c; q._p = p;
  poserConsigne('Trace le cercle de centre le point noir, passant par le point orange.');
  $('sousConsigne').textContent = 'Plante la pointe sur le point noir, puis glisse jusqu’au point orange.';
  /* La consigne dit « le point NOIR » et « le point ORANGE » : les deux
     doivent l’être franchement, avec un halo qui les désigne comme cibles. */
  const svg = poserScene(
    `<circle cx="${c[0]}" cy="${c[1]}" r="16" fill="rgba(29,51,84,.12)"/>`
    + `<circle cx="${c[0]}" cy="${c[1]}" r="6.5" fill="var(--mine)"/>`
    + `<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="rgba(255,138,61,.20)"/>`
    + `<circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="var(--mandarine)"/>`,
    VB_COMPAS);
  compasCourant = MoteurCompas.creerCompas(svg, {
    zone: ZONE_TRACE,
    /* La pointe s’accroche au point noir, mais rien n’oblige à l’y planter :
       se tromper de centre reste possible, et c’est une des deux décisions
       que la manche évalue. */
    aimants: [c],
    surPointe: () => sonClic(),
    surTrace: (e) => {
      if (verrouille) return;
      verrouille = true;
      compasCourant.figer();
      const bonCentre = dist(e.centre, c) <= 16;
      const bonRayon = Math.abs(e.r - rAttendu) <= 9;
      const bon = bonCentre && bonRayon;
      if (!bon) {
        /* Le cercle tracé passe au rouge : sans cela, le sien et celui
           qu’on lui montre seraient tous deux verts, et on ne saurait plus
           lequel est lequel. Le rouge marque SA production, jamais la
           bonne réponse (§18). */
        compasCourant.marquerFaux();
        /* Révélation différée (§18) : le cercle attendu vient se superposer
           en vert pointillé, et le compas se repose à l’écartement juste. */
        clearTimeout(minuteurRevel);
        minuteurRevel = setTimeout(() => {
          if (!svg.isConnected) return;
          compasCourant.montrerAttendu(c, rAttendu);
          compasCourant.placer(c, rAttendu);
        }, DELAI_REVELATION);
      }
      terminerManche(bon, bon ? PTS_PLEIN : 0,
        bon ? 'Le cercle passe pile par le point !' : null,
        bon ? null : (bonCentre ? 'Le bon écartement est en vert pointillé.'
                                : 'La pointe devait se planter sur le point noir.'));
    }
  });
}

/* Le texte dit « par pliage » — ni compas, ni règle graduée. L’enfant place
   son estimation, le PLI tranche : le segment se replie sur lui-même. */
function rendrePliage(q){
  const y = entre(120, 190);
  const a = [entre(50, 80), y], b = [entre(320, 350), y];
  q._a = a; q._b = b;
  const L = dist(a, b);
  poserConsigne('Où est le milieu de ce segment ? Touche-le, le pli vérifiera.');
  $('sousConsigne').textContent = 'On plie le calque : le segment se replie sur lui-même.';
  poserScene(`<line class="fig-trait" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`
    + croix(a) + croix(b)
    + `<rect id="zoneClic" x="0" y="0" width="400" height="300" fill="transparent"/>`);
  const svg = scene();
  svg.querySelector('#zoneClic').addEventListener('click', (ev) => {
    if (verrouille) return;
    verrouille = true;
    q._instrumentPose = true;
    const p = versSVG(svg, ev.clientX, ev.clientY);
    const m = milieu(a, b);
    const ecart = Math.abs(p.x - m[0]);
    const bon = ecart <= TOL_PLIAGE * L && Math.abs(p.y - y) < 40;
    svg.insertAdjacentHTML('beforeend', `<circle cx="${p.x}" cy="${y}" r="7" fill="${bon ? 'var(--menthe-t)' : 'var(--corail)'}"/>`);
    /* Le pli : on montre le rabattement, puis la marque du milieu. */
    clearTimeout(minuteurRevel);
    minuteurRevel = setTimeout(() => {
      if (!svg.isConnected) return;
      svg.insertAdjacentHTML('beforeend',
        `<line class="trace-fait" x1="${m[0]}" y1="${y-34}" x2="${m[0]}" y2="${y+34}" stroke-dasharray="6 5"/>`
        + `<circle class="repere" cx="${m[0]}" cy="${y}" r="6"/>`);
    }, DELAI_REVELATION);
    terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Le pli tombe juste sur ta marque !' : null,
      bon ? null : 'Le pli marque le vrai milieu, en pointillé.');
  });
}

/* CE2 : cette fois il FAUT fixer une longueur. L’échelle est celle du moteur,
   partagée avec M38 — mais elle ne prétend à aucune grandeur réelle : on parle
   d’unités, pas de centimètres. */
function rendreCompasRayon(q){
  /* LA SÉQUENCE DU CE2, INVERSE DE CELLE DU CE1. Au CE1 le rayon est DÉRIVÉ
     d’un point de passage : on plante et on ouvre jusqu’au point. Au CE2 il
     est MESURÉ D’ABORD — « un cercle de rayon 4 » — donc on règle l’écartement
     sur la règle graduée, puis on porte le compas sur la feuille. La différence
     est pédagogique et non cosmétique (SPEC-M35 §2), et elle se joue tout
     entière dans l’ORDRE des deux gestes.

     Une première version faisait choisir l’écartement par des BOUTONS
     numérotés. Un bouton n’est pas un compas : il donne la mesure au lieu de
     la faire prendre, et la règle graduée n’était plus qu’une illustration. */
  const c = [entre(168, 258), entre(128, 158)];
  q._c = c;
  /* LA RÈGLE PORTE JUSTE CE QU’ON PEUT DEMANDER, EN PLUS GRAND. Dix
     graduations à 14 px faisaient une réglette de 140 px qu’on visait au
     pixel ; les rayons demandés ne dépassent pas 4, une règle qui monte à 6
     suffit donc largement — et l’unité passée à 20 px lui donne 120 px de
     graduations dans un corps deux fois plus haut, avec des chiffres lisibles.
     L’ÉCHELLE N’EST PAS UN CHOIX DE DESSIN : la règle et le cercle lisent la
     même unité. L’agrandir ici, c’est l’agrandir partout — c’est pour cela
     qu’elle est changée dans le moteur et nulle part ailleurs. */
  const U_MAX = 6, X0 = 200 - U_MAX * PX_PAR_UNITE / 2, YR = 344;
  const DEBORD = 34;   // la règle déborde de ses graduations, comme un vrai objet
  const rAttendu = q.rayonUnites * PX_PAR_UNITE;
  const ZONE_REGLE = {x0:X0 - DEBORD, y0:YR - 50, x1:X0 + U_MAX*PX_PAR_UNITE + DEBORD, y1:YR + 22};
  const ZONE_PLAN  = {x0:26, y0:58, x1:374, y1:272};

  poserConsigne('Trace un cercle de rayon ' + q.rayonUnites + ', centré sur le point.');
  $('sousConsigne').textContent =
    'D’abord l’écartement : plante la pointe sur le 0 et ouvre jusqu’au ' + q.rayonUnites + '.';

  /* LA RÈGLE ET LE CERCLE LISENT LA MÊME UNITÉ. Une première version traçait
     la règle à double échelle tout en dessinant le cercle à l’échelle simple :
     la règle mentait sur ce qu’elle mesurait. C’est aussi pourquoi agrandir
     la règle passe par l’unité du moteur, et non par un facteur local. */
  const grad = [];
  for (let u = 0; u <= U_MAX; u++) {
    const x = X0 + u * PX_PAR_UNITE;
    /* Les demi-unités ne sont pas graduées : l’écartement s’accroche à
       l’unité entière, une graduation qu’on ne peut pas atteindre ne ferait
       qu’encombrer. */
    grad.push(`<line x1="${x}" y1="${YR}" x2="${x}" y2="${YR - 20}" stroke="var(--encre2)" stroke-width="2.4"/>`
      + `<text x="${x}" y="${YR - 27}" font-size="16" font-weight="700" text-anchor="middle" fill="var(--encre)">${u}</text>`);
  }
  poserScene(
    /* Le centre est une CIBLE : une croix comme partout ailleurs dans le
       module, pas un point gris de 6 px qu’on cherche des yeux. */
    `<circle cx="${c[0]}" cy="${c[1]}" r="15" fill="rgba(90,180,220,.16)"/>`
    + croix(c) + `<circle class="repere" cx="${c[0]}" cy="${c[1]}" r="3.5"/>`
    + `<text x="${c[0]}" y="${c[1] + 34}" font-size="12" text-anchor="middle" fill="var(--encre2)">centre</text>`
    /* Le CORPS de la règle déborde largement de sa partie graduée — c’est ce
       qu’est une vraie règle, et c’est ce qui la rend grande à l’écran sans
       toucher à l’échelle, laquelle est partagée avec le cercle. */
    + `<rect x="${X0 - DEBORD}" y="${YR - 48}" width="${U_MAX*PX_PAR_UNITE + 2*DEBORD}" height="66" rx="9"
             fill="rgba(120,140,160,.18)" stroke="var(--trait)" stroke-width="2"/>`
    + `<line x1="${X0}" y1="${YR}" x2="${X0 + U_MAX*PX_PAR_UNITE}" y2="${YR}" stroke="var(--encre)" stroke-width="3.4"/>`
    + grad.join('')
    /* L’AFFICHEUR, dans un coin que ni la main ni le compas n’occupent. Le
       doigt masque forcément la graduation qu’il vise — une main est plus
       large qu’un cran. Le nombre se lit donc ailleurs, en grand. */
    + `<text x="52" y="86" font-size="13" font-weight="600" fill="var(--encre2)">écartement</text>`
    + `<text id="valEcart" x="52" y="126" font-size="34" font-weight="800" fill="var(--encre)">0</text>`,
    '0 0 400 380');
  const svg = scene();

  compasCourant = MoteurCompas.creerCompas(svg, {
    /* Sur la règle, la pointe ne se plante QUE sur le zéro : mesurer, c’est
       partir de l’origine. Et l’écartement s’accroche au centimètre entier —
       l’enfant lit une graduation, il ne vise pas au pixel. */
    zone: ZONE_REGLE, aimants: [[X0, YR]], pointeLibre: false,
    /* CRANTÉ, pas seulement aimanté. L’écartement demandé est un nombre
       ENTIER d’unités : le compas passe donc de cran en cran, et viser 2 est
       aussi simple que viser 5. Avec la simple aimantation, la course utile
       d’un rayon de 2 tenait dans la largeur d’un doigt. */
    rayonCrante: true,
    /* PAS DE LOUPE SUR LA RÈGLE, et ce n’est pas un renoncement : essayée,
       mesurée, écartée. À grossissement 2 elle ne montre que ±21 unités
       autour du doigt, or les chiffres de la règle sont à 27 — elle
       agrandissait des traits SANS les nombres, c’est-à-dire tout sauf ce
       qu’on cherchait à lire. Ce que l’enfant a besoin de savoir ici n’est
       pas « quelle graduation est sous mon doigt » mais « à combien suis-je
       ouvert » : c’est un AFFICHEUR qu’il faut, pas une loupe. */
    loupe: false,
    surApercu: (e) => {
      const t = svg.getElementById('valEcart');
      if (t) t.textContent = Math.round(e.r / PX_PAR_UNITE);
    },
    surPointe: () => sonClic(),
    surReglage: (e) => {
      const u = Math.round(e.r / PX_PAR_UNITE);
      q._ecartUnites = u;
      q._instrumentPose = true;
      /* L’écartement pris se lit dans la SOUS-CONSIGNE, hors du plan. Une
         étiquette posée dans le dessin chevauchait les branches du compas, et
         doublonnait avec ce que la sous-consigne dit déjà — l’ouverture en
         cours, elle, s’affiche à côté de la pointe pendant le glissement. */
      /* Le compas quitte la règle pour la feuille, sans rien perdre de sa
         mesure : c’est le même objet, c’est tout l’intérêt. */
      compasCourant.configurer({zone: ZONE_PLAN, aimants: [c], pointeLibre: true, loupe: true});
      $('sousConsigne').textContent =
        'Écartement pris : ' + u + '. Plante maintenant la pointe sur le centre.';
      sonClic();
    },
    surTrace: (e) => {
      if (verrouille) return;
      verrouille = true;
      compasCourant.figer();
      const bonCentre = dist(e.centre, c) <= 16;
      const bonRayon = Math.abs(e.r - rAttendu) <= 7;
      const bon = bonCentre && bonRayon;
      if (!bon) {
        compasCourant.marquerFaux();
        clearTimeout(minuteurRevel);
        minuteurRevel = setTimeout(() => {
          if (!svg.isConnected) return;
          compasCourant.montrerAttendu(c, rAttendu);
        }, DELAI_REVELATION);
      }
      terminerManche(bon, bon ? PTS_PLEIN : 0,
        bon ? 'Rayon exact et bien centré !' : null,
        bon ? null : (!bonRayon ? 'Il fallait ' + q.rayonUnites + ' d’écartement : le cercle attendu est en vert.'
                                : 'La pointe devait se planter sur le centre.'));
    }
  });
}

/* Report de longueur : prendre l’écartement sur un segment et le
   transporter sur un autre pour les COMPARER sans mesurer. Ce geste
   alimente directement le codage des égalités. */
function rendreReport(q){
  /* LE REPORT DE LONGUEUR SE FAIT AU COMPAS, PAS EN TOUCHANT DEUX SEGMENTS.
     La première version simulait le geste : un tap sur le segment 1 « prenait »
     l’écartement, un tap sur le segment 2 le « reportait », et le jeu dessinait
     la comparaison. L’enfant regardait une démonstration au lieu de la faire.
     Or c’est EXACTEMENT le geste que le programme demande au CE2, et le seul
     moyen honnête de comparer deux longueurs SANS les mesurer.

     Le geste réel, en deux temps : on plante la pointe sur un bout du premier
     segment, on ouvre jusqu’à l’autre bout — l’arc se trace et l’écartement se
     VERROUILLE —, puis on replante sur le second segment et l’arc dit lui-même
     si la longueur retombe avant, sur, ou après son extrémité. */
  const y1 = 108, y2 = 206;
  const L1 = entre(110, 165);
  /* Trois cas, et l’égalité en fait PARTIE : un tirage qui ne produirait
     jamais deux segments égaux ferait de « Ils sont égaux » une réponse
     toujours fausse, et le report ne servirait plus à rien. Le seuil de
     15 % sépare ce que l’œil tranche de ce qui demande le compas. */
  const cas = pioche(['egaux', 'proche', 'proche', 'franc']);
  const L2 = cas === 'egaux' ? L1
           : cas === 'proche' ? L1 * (1 + entre(0.04, 0.12) * signeAleatoire())
           : L1 * (1 + entre(0.22, 0.40) * signeAleatoire());
  const a1 = [66, y1], b1 = [66 + L1, y1], a2 = [66, y2], b2 = [66 + L2, y2];
  q._segs = [[a1,b1],[a2,b2]];
  /* Réponse et exigence de vérification relues sur les segments DESSINÉS. */
  const ecartRelatif = Math.abs(L1 - L2) / Math.max(L1, L2);
  q._exigeVerif = ecartRelatif < SEUIL_LONGUEUR_FRANCHE;
  q._rep = ecartRelatif < 0.005 ? 'Ils sont égaux'
         : (L1 > L2 ? 'Le segment 1 est plus long' : 'Le segment 2 est plus long');
  poserConsigne('Ces deux segments ont-ils la même longueur ?');
  $('sousConsigne').textContent = q._exigeVerif
    ? 'Trop proches pour l’œil : prends la longueur du 1 au compas, puis reporte-la sur le 2.'
    : 'L’écart se voit ici, mais tu peux quand même le vérifier au compas.';
  const etiquette = (n, p) =>
    `<circle cx="38" cy="${p}" r="13" fill="var(--ciel)"/>`
    + `<text x="38" y="${p+5}" font-size="15" font-weight="700" text-anchor="middle" fill="var(--encre)">${n}</text>`;
  const svg = poserScene(
    `<line class="fig-trait" x1="${a1[0]}" y1="${y1}" x2="${b1[0]}" y2="${y1}"/>` + croix(a1) + croix(b1)
    + etiquette(1, y1)
    + `<line class="fig-trait" x1="${a2[0]}" y1="${y2}" x2="${b2[0]}" y2="${y2}"/>` + croix(a2) + croix(b2)
    + etiquette(2, y2),
    VB_COMPAS);

  let reports = 0;
  compasCourant = MoteurCompas.creerCompas(svg, {
    /* La pointe ne se plante QUE sur un bout de segment, et la mine s’accroche
       aux mêmes points : reporter une longueur, c’est aller d’une extrémité à
       une autre. Sans l’accrochage de la MINE, un enfant qui ouvre à quelques
       pixels près reporterait une longueur fausse — et sur deux segments qui
       diffèrent de moins de 15 %, l’imprécision du geste dépasserait l’écart
       qu’on lui demande de juger. */
    aimants: [a1, b1, a2, b2], aimantsMine: [a1, b1, a2, b2], pointeLibre: false,
    /* Un ARC, pas un tour complet : c’est ce que fait la main quand elle
       reporte, et deux cercles entiers superposés noieraient l’endroit précis
       qu’on demande de regarder. */
    arc: radians(64),
    /* Aucun nombre : comparer sans mesurer, c’est tout l’objet de la manche. */
    etiquette: false,
    surPointe: () => sonClic(),
    surTrace: () => {
      if (verrouille) return;
      reports++;
      if (!compasCourant.estVerrouille()) {
        compasCourant.verrouiller();
        $('sousConsigne').textContent =
          'Écartement gardé : replante la pointe sur le second segment pour comparer.';
        return;
      }
      /* Le deuxième arc est celui qui COMPARE : c’est lui, et pas la simple
         prise d’écartement, qui vaut vérification. */
      q._instrumentPose = true;
      $('sousConsigne').textContent = 'Regarde où l’arc retombe, puis réponds.';
    }
  });

  rendreQcm(['Ils sont égaux','Le segment 1 est plus long','Le segment 2 est plus long'], q._rep, (bon) => {
    if (compasCourant) compasCourant.figer();
    const manque = q._exigeVerif && !q._instrumentPose;
    terminerManche(bon, !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN),
      bon && !manque ? 'Report bien mené !' : null,
      !bon ? 'La bonne réponse : ' + q._rep.toLowerCase() + '.'
           : (manque ? 'Mais il fallait reporter l’écartement au compas pour en être sûr.' : null));
  }, 'pile');
}

/* ============================================================
   CODAGE — le tampon, jamais le tracé
   ============================================================ */
/* LES NOTATIONS QU’UN PALIER ENSEIGNE, ÉCRITES UNE SEULE FOIS. Le CE1 ne
   connaît que le carré d’angle droit ; la marque d’égalité de longueur est
   une notation CE2 (BO : « le codage d’un angle droit ET celui qui indique
   que des segments ont la même longueur »).

   Cette liste commande TOUT ce qui laisse voir une notation : la palette de
   tampons, les cibles actives — et la figure de correction. C’est ce dernier
   point qui manquait : la correction dessinait les égalités de la figure sans
   regarder le palier, si bien qu’au CE1 l’enfant ne pouvait pas poser ces
   marques mais les voyait apparaître à la validation. Ne pas pouvoir écrire
   un signe qu’on vous montre, c’est l’apprendre de travers. */
const NOTATIONS = {codage1:['droit'], codage2:['droit','simple','double']};
const TAMPONS_EGALITE = ['simple','double'];
const codeLesEgalites = tampons => tampons.some(t => TAMPONS_EGALITE.includes(t));

function marqueAngleDroit(pts, i){
  const n = pts.length, s = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
  const u = [(a[0]-s[0]), (a[1]-s[1])], v = [(b[0]-s[0]), (b[1]-s[1])];
  const lu = Math.hypot(...u), lv = Math.hypot(...v), d = 17;
  const p1 = [s[0] + u[0]/lu*d, s[1] + u[1]/lu*d];
  const p2 = [s[0] + v[0]/lv*d, s[1] + v[1]/lv*d];
  const p3 = [p1[0] + v[0]/lv*d, p1[1] + v[1]/lv*d];
  /* `data-code` nomme la notation portée par la marque. Un contrôle qui
     recalculerait ce qui « devrait » être dessiné partagerait l’hypothèse du
     dessin et validerait donc ses erreurs ; en lisant cet attribut il relit
     le résultat. */
  return `<path class="marque" data-code="droit" fill="none" stroke="var(--corail)" stroke-width="3"
            d="M ${p1[0]} ${p1[1]} L ${p3[0]} ${p3[1]} L ${p2[0]} ${p2[1]}"/>`;
}
/* La marque d’égalité s’oriente seule : perpendiculaire au côté, en son
   milieu. Un ou deux traits selon le groupe — deux groupes distincts
   appellent deux notations distinctes. */
function marqueEgalite(pts, i, nbTraits){
  const n = pts.length, a = pts[i], b = pts[(i+1)%n];
  const m = milieu(a, b);
  const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy);
  const nx = -dy/L, ny = dx/L, e = 9;
  let s = '';
  for (let k = 0; k < nbTraits; k++) {
    const off = (k - (nbTraits-1)/2) * 7;
    const cx = m[0] + dx/L*off, cy = m[1] + dy/L*off;
    s += `<line class="marque" data-code="egalite" x1="${cx - nx*e}" y1="${cy - ny*e}" x2="${cx + nx*e}" y2="${cy + ny*e}" stroke="var(--mandarine)" stroke-width="3.2" stroke-linecap="round"/>`;
  }
  return s;
}

function rendreCodage1(q){
  poserConsigne('Marque tous les angles droits de cette figure — et seulement eux.');
  $('sousConsigne').textContent = 'Choisis le tampon, puis touche un sommet.';
  dessinerCodage(q, NOTATIONS.codage1);
}
/* La figure est ANNONCÉE avant la tâche. Coder, c’est écrire ce qu’on sait
   d’une figure qu’on a déjà reconnue : demander « certifie ce plan » devant
   une forme anonyme mélange deux compétences, la reconnaissance (M34) et le
   codage (ici), et l’enfant qui échoue ne sait plus laquelle lui a manqué. */
const NOM_FIGURE = {carre:'un carré', rectangle:'un rectangle', losange:'un losange',
                    triangleRect:'un triangle rectangle', isocele:'un triangle isocèle'};

function rendreCodage2(q){
  poserConsigne('Voici ' + (NOM_FIGURE[q.type] || 'cette figure')
    + '. Certifie le plan : angles droits et côtés de même longueur.');
  const aVerifier = q.type === 'rectangle' || q.type === 'isocele';
  $('sousConsigne').textContent = aVerifier
    ? 'Ici les longueurs se ressemblent : prends le compas pour les comparer avant de marquer.'
    : 'Choisis un tampon, puis touche un sommet ou un côté.';
  q._exigeVerif = aVerifier;
  dessinerCodage(q, NOTATIONS.codage2);
}

function dessinerCodage(q, tampons){
  const n = q.pts.length;
  const d = 'M ' + q.pts.map(p => p.join(' ')).join(' L ') + ' Z';
 let cibles = '', indices = '';
  /* UNE SEULE LECTURE DU PALIER pour les trois moments où l’égalité de
     longueur peut se montrer : les cibles de côté, l’attente à la validation,
     et la figure de correction. Trois conditions séparées, c’était trois
     occasions d’en oublier une — et c’est exactement ce qui était arrivé à la
     correction. */
  const egalitesAuProgramme = codeLesEgalites(tampons);
  const cotesActifs = egalitesAuProgramme;
  q.pts.forEach((p, i) => {
    cibles  += `<circle class="cible-tactile" data-t="a${i}" cx="${p[0]}" cy="${p[1]}" r="20"/>`;
    indices += `<circle class="indice-cible" data-i="a${i}" cx="${p[0]}" cy="${p[1]}" r="11"/>`;
    if (!cotesActifs) return;
    const b = q.pts[(i+1)%n], m = milieu(p, b);
    cibles  += `<circle class="cible-tactile" data-t="c${i}" cx="${m[0]}" cy="${m[1]}" r="20"/>`;
    indices += `<circle class="indice-cible" data-i="c${i}" cx="${m[0]}" cy="${m[1]}" r="9"/>`;
  });
  poserScene(`<path class="fig-remplie" d="${d}"/>` + indices + `<g id="marques"></g>` + cibles);
  const svg = scene();

  const nomsTampon = {droit:'angle droit', simple:'trait simple', double:'trait double'};
  const apercu = {
    droit:`<svg viewBox="0 0 26 22"><path d="M4 4 L18 4 L18 18" fill="none" stroke="#FF5D5D" stroke-width="3"/></svg>`,
    simple:`<svg viewBox="0 0 26 22"><line x1="13" y1="4" x2="13" y2="18" stroke="#FF8A3D" stroke-width="3.2"/></svg>`,
    double:`<svg viewBox="0 0 26 22"><line x1="10" y1="4" x2="10" y2="18" stroke="#FF8A3D" stroke-width="3.2"/><line x1="17" y1="4" x2="17" y2="18" stroke="#FF8A3D" stroke-width="3.2"/></svg>`
  };
  /* UN SEUL OUTIL EN MAIN, ET UNE SEULE VARIABLE POUR LE DIRE. Le compas et
     les tampons étaient deux états séparés — `choisi` d’un côté, `compasActif`
     de l’autre — et ils divergeaient : choisir un tampon éteignait le BOUTON
     du compas (la boucle de classes le balayait avec les autres) sans éteindre
     le compas lui-même. Il restait installé et captait le pointeur, si bien
     qu’après un report plus aucune marque ne se posait, alors que le tampon
     s’allumait normalement. Deux vérités pour un seul fait, c’est la panne
     garantie ; il n’y en a plus qu’une. */
  const barre = $('barreOutils');
  barre.hidden = false;
  barre.innerHTML = tampons.map(t =>
    `<button type="button" class="outil${t === tampons[0] ? ' on' : ''}" data-t="${t}">${apercu[t]}${nomsTampon[t]}</button>`).join('')
    + (q._exigeVerif ? `<button type="button" class="outil" id="btnCompas" data-t="compas">🧭 compas</button>` : '');
  let outil = tampons[0];
  const btnC = $('btnCompas');
  barre.querySelectorAll('.outil[data-t]').forEach(b =>
    b.addEventListener('click', () => choisirOutil(b.dataset.t)));

  function choisirOutil(nom){
    if (verrouille) return;
    sonClic();
    outil = nom;
    barre.querySelectorAll('.outil[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === nom));
    if (nom !== 'compas') {
      /* Reprendre un tampon RANGE le compas : c’est le même geste qu’à
         l’établi, on ne tient qu’un outil à la fois. */
      if (compasCourant) { compasCourant.detruire(); compasCourant = null; }
      $('sousConsigne').textContent = 'Choisis un tampon, puis touche un sommet ou un côté.';
      return;
    }
    if (compasCourant) return;                 // déjà en main
    $('sousConsigne').textContent = 'Plante la pointe sur un sommet et ouvre jusqu’au voisin.';
    compasCourant = ouvrirCompasDeCodage(svg, q);
  }

  /* LE REPORT DE LONGUEUR EST UN INSTRUMENT, PAS UN BOUTON. « Reporter »
     était un bouton sans effet visible : il déclarait la vérification faite
     au lieu de la faire faire, alors que c’est précisément le geste que le
     programme demande au CE2 — et le seul moyen honnête de trancher entre
     deux côtés qui se ressemblent avant de les coder (SPEC-M35 §5.4).
     Le vrai geste : on plante la pointe sur un sommet, on ouvre jusqu’au
     sommet voisin — l’écartement se VERROUILLE — puis on replante ailleurs et
     l’arc dit lui-même si la longueur retombe juste.
     Le compas s’allume et s’éteint, parce qu’il capte le pointeur : tant
     qu’il est là, les tampons ne se posent pas, et c’est le bouton qui dit
     lequel des deux outils on tient. */
  function ouvrirCompasDeCodage(svg, q){
    return MoteurCompas.creerCompas(svg, {
      /* La pointe ne se plante que sur un SOMMET : reporter une longueur,
         c’est aller d’un sommet à un autre, pas mesurer au hasard. */
      aimants: q.pts, pointeLibre: false,
      /* AUCUN NOMBRE ICI. Reporter une longueur, c’est justement comparer
         SANS mesurer : afficher « 15,4 » à côté du compas donnerait la
         réponse dans une unité qui ne veut rien dire sur cette figure. */
      etiquette: false,
      /* UN ARC, PAS UN TOUR COMPLET — même geste, même dessin qu’au report de
         longueur : la main qui compare donne un coup d’arc là où la
         comparaison se lit. Un cercle entier par côté vérifié recouvrait la
         figure qu’on demande justement de coder, et les traits du codage
         devenaient illisibles sous les traits du contrôle. */
      arc: radians(64),
      surPointe: () => sonClic(),
      surTrace: () => {
        q._instrumentPose = true;
        if (compasCourant && !compasCourant.estVerrouille()) {
          compasCourant.verrouiller();
          $('sousConsigne').textContent =
            'Écartement gardé : replante la pointe sur un autre sommet pour comparer.';
        }
      }
    });
  }

  const posees = {};   // clé de cible -> type de tampon
  svg.querySelectorAll('.cible-tactile').forEach(c => c.addEventListener('click', () => {
    if (verrouille || outil === 'compas') return;
    const k = c.dataset.t;
    if (posees[k]) { delete posees[k]; }
    else if (k[0] === 'a' && outil !== 'droit') return;   // un trait ne se pose pas sur un sommet
    else if (k[0] === 'c' && outil === 'droit') return;   // un carré d’angle ne se pose pas sur un côté
    else { posees[k] = outil; sonClic(); }
    redessinerMarques();
  }));
  function redessinerMarques(){
    const g = svg.getElementById('marques');
    g.innerHTML = Object.keys(posees).map(k => {
      const i = +k.slice(1);
      return k[0] === 'a' ? marqueAngleDroit(q.pts, i)
        : marqueEgalite(q.pts, i, posees[k] === 'double' ? 2 : 1);
    }).join('');
    /* L’indice s’efface là où une marque a pris sa place. */
    svg.querySelectorAll('.indice-cible').forEach(e =>
      e.classList.toggle('pris', !!posees[e.dataset.i]));
  }

  $('btnValider').style.display = 'block';
  $('btnValider').textContent = 'Certifier ✓';
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    /* Le compas se range à la certification : §18, on ne revient pas dessus. */
    if (compasCourant) { compasCourant.detruire(); compasCourant = null; }
    if (btnC) { btnC.classList.remove('on'); btnC.disabled = true; }
    const attenduAngles = new Set(q.droits.map(i => 'a' + i));
    const posesAngles = new Set(Object.keys(posees).filter(k => k[0] === 'a'));
    const anglesOk = attenduAngles.size === posesAngles.size && [...attenduAngles].every(k => posesAngles.has(k));

    /* Une marque d’égalité est RELATIONNELLE : elle ne dit pas « ce côté
       mesure quelque chose », elle dit « ce côté est égal à celui qui porte
       la même marque ». D’où deux exigences : au moins deux marques
       identiques pour qu’un codage ait un sens, et deux notations
       distinctes pour deux groupes distincts. */
    let egalitesOk = true, motif = null;
    if (egalitesAuProgramme) {
      const parType = {};
      Object.keys(posees).filter(k => k[0] === 'c').forEach(k => {
        (parType[posees[k]] = parType[posees[k]] || []).push(+k.slice(1));
      });
      const groupesPoses = Object.values(parType).map(l => l.slice().sort((x,y) => x-y).join(','));
      const groupesAttendus = q.groupes.map(g => g.slice().sort((x,y) => x-y).join(','));
      const isolee = Object.values(parType).some(l => l.length === 1);
      if (isolee) { egalitesOk = false; motif = 'Une marque toute seule ne dit rien : il en faut au moins deux pareilles.'; }
      else if (groupesPoses.length !== groupesAttendus.length
        || !groupesAttendus.every(g => groupesPoses.includes(g))) {
        egalitesOk = false;
        motif = q.groupes.length === 2
          ? 'Deux groupes de côtés égaux : il fallait deux notations différentes.'
          : (q.groupes.length === 0 ? 'Cette figure n’a aucune égalité de côtés à marquer.'
                                    : 'Les côtés de même longueur devaient tous porter la même marque.');
      }
    }
    const bon = anglesOk && egalitesOk;
    const manque = bon && q._exigeVerif && !q._instrumentPose;
    /* Correction : on montre le codage attendu (§18) — mais AU PALIER. Les
       égalités de la figure ne s’affichent que si le palier les enseigne :
       sans ce garde, le carré et le rectangle du CE1 (quatre items sur cinq)
       exhibaient une notation que l’enfant n’avait aucun moyen de poser. */
    const g = svg.getElementById('marques');
    svg.querySelectorAll('.indice-cible').forEach(e => e.classList.add('pris'));
    g.innerHTML = q.droits.map(i => marqueAngleDroit(q.pts, i)).join('')
      + (egalitesAuProgramme
          ? q.groupes.map((grp, gi) => grp.map(i => marqueEgalite(q.pts, i, gi + 1)).join('')).join('')
          : '');
    /* Ce que la correction montre EFFECTIVEMENT, relu sur le dessin fini et
       consigné sur l’item : le validateur n’a plus à deviner l’intention du
       rendu, il lit son résultat. */
    q._codeAffiche = [...new Set([...g.querySelectorAll('[data-code]')].map(e => e.dataset.code))].sort();
    q._tamponsOfferts = tampons.slice();
    /* Le contrôle s’exécute pour de vrai, à chaque manche jouée : un garde-fou
       qui n’est appelé que par la suite de tests finit par ne plus rien garder.
       Toute violation devient une erreur de console, que les tests refusent. */
    const pbCodage = verifierItem(q);
    if (pbCodage.length) console.error('codage — ' + pbCodage.join(' ; '));
    terminerManche(bon, !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN),
      bon && !manque ? 'Plan certifié !' : null,
      !bon ? (motif || 'Voici le codage attendu.')
           : 'Mais il fallait reporter l’écartement avant de marquer les égalités.');
  };
}

/* ---------- Fin de manche ---------- */
function terminerManche(bon, pts, motBravo, correction){
  const q = file[pos];
  q._pts = pts; q._ok = bon;
  score += pts;
  if (bon && pts === PTS_PLEIN) { sonBonneReponse(); lancerConfettis(28); message(motBravo || 'Bravo !', 'bon'); }
  else if (bon) { sonBonneReponse(); message('Juste, ', 'demi', correction || ''); }
  else { sonErreur(); message('Presque ! ', 'mauvais', correction || ''); }
  majDots();
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  $('btnNext').onclick = () => { pos++; if (pos < file.length) question(); else fin(); };
  armerAutoSuivant();
}

function fin(){
  desarmerAutoSuivant(); stopperVoix();
  const ratio = total ? score / total : 0;
  const n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  enregistrerEtoiles(miniJeuCourant.cfg.id, n);
  enregistrerSession(miniJeuCourant.cfg.id, score, total, Math.round((Date.now() - demarreLe)/1000));
  $('hdrTitle').textContent = 'Résultat';
  $('endStars').innerHTML = '⭐'.repeat(n).split('').map(s => `<span>${s}</span>`).join('');
  $('endMsg').textContent = n === 3 ? 'Contrôle impeccable !' : n === 2 ? 'Bon travail !' : 'Continue, tu progresses !';
  $('endScore').textContent = score + ' point' + (score > 1 ? 's' : '') + ' sur ' + total + '.';
  if (n === 3) sonNiveauParfait(); else sonBonneReponse();
  lancerConfettis(n === 3 ? 90 : 40);
  montreEcran('end');
}
$('bRejouer').addEventListener('click', () => lance(miniJeuCourant.cfg.id));
$('bMenu').addEventListener('click', retourAccueil);

/* ============================================================
   DÉMARRAGE
   ============================================================ */
construireAccueil();
montreEcran('home');

/* Lancement paramétré (CHARTE §16) : un paramètre inconnu est ignoré en
   silence — ce n’est qu’un raccourci d’entrée. */
(function(){
  const d = parametreURL('competence');
  if (!d) return;
  const t = trouverMiniJeu(d);
  if (!t) return;
  etatPalierAffiche = t.palierNom;
  construireAccueil();
  lance(d);
})();

/* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7). */
(function(){
  const b = $('bouton-menu'), m = $('modale-menu');
  if (!b || !m) return;
  const fermer = () => { m.hidden = true; };
  b.addEventListener('click', () => { m.hidden = false; });
  $('modale-menu-rester').addEventListener('click', fermer);
  $('modale-menu-revenir').addEventListener('click', () => { fermer(); location.href = '../index.html'; });
})();
</script>
