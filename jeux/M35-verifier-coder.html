<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>L’atelier de contrôle — Mayeutik</title>
<!-- ============================================================
     JEU M35 — Vérifier et coder (CP, CE1, CE2)
     Backlog : pilotage/backlog.json — sous-thème « La géométrie plane »
     Univers : l’atelier de contrôle du vitrail. Plan technique, trait noir
     sur calque, palette DÉSATURÉE — on n’est plus dans le verre coloré de
     M34, on est dans le plan.

     Ce que le module fait : poser un instrument sur une figure et lire ce
     qu’il tranche, puis annoter ce qu’on a établi. Ce qu’il ne fait pas :
     reproduire ou construire une figure (M38), nommer ou justifier par
     propriété (M34). Seule exception assumée, sans quoi une compétence CP
     resterait orpheline : tracer une droite par deux points à la règle,
     comme CONCLUSION du mini-jeu d’alignement.

     LA RÈGLE D’OR : le texte dit d’utiliser l’instrument « dans les cas où
     la réponse n’est pas perceptible de façon évidente ». Les items
     ambigus doivent donc l’être VRAIMENT — un écart de 2 à 4 px, un angle
     à 87°. Si le défaut se voit à l’œil, l’instrument devient décoratif et
     l’enfant apprend à l’ignorer. Chaque palier mélange délibérément des
     items évidents et des items indécidables : savoir quand l’œil suffit
     est le véritable apprentissage transversal du module.

     HONNÊTETÉ SUR LE GESTE : un écran ne peut pas entraîner la main sur un
     vrai compas et ne doit pas prétendre le faire. On vise la couche
     conceptuelle — ce que l’instrument permet de conclure, et quand il
     faut y recourir. Aucun pincement à deux doigts, aucune simulation de
     crayon longeant une réglette.
     ============================================================ -->
<style>
:root{
  color-scheme: light only;
  --ciel:#EAF2FC; --carte:#FFFFFF; --encre:#1D3354; --encre2:#41577A;
  --mandarine:#FF8A3D; --mandarine-f:#E5701F;
  --menthe:#2EC4A6; --menthe-t:#0B8A70; --corail:#FF5D5D; --corail-t:#D93636; --soleil:#FFC93C;
  /* Palette désaturée propre à l’atelier de contrôle : calque, mine de
     plomb, bois de l’établi. */
  --calque:#F4F6F8; --mine:#33404F; --trait:#5A6B7D; --bois:#B99A72; --bois-f:#8E7350;
  --r:20px; --ombre:0 4px 0 rgba(29,51,84,.12);
  font-size:16px;
}

/* ---------- Protections tactiles (CHARTE §19) ----------
   `touch-action` ne s’hérite PAS : le sélecteur universel est le seul moyen
   de couvrir toute l’interface. `pan-y` préserve le défilement vertical de
   la page ; les instruments, eux, déclarent `none` sur eux-mêmes (§19
   autorise la déclaration plus spécifique) — sans quoi tirer une règle vers
   le bas ferait défiler la page au lieu de déplacer l’outil. */
*{ box-sizing:border-box; touch-action:pan-y; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--ciel); color-scheme:light only; }
html,body{margin:0; padding:0; min-height:100%;}
body{
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  font-family:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  background:var(--ciel); color:var(--encre);
  background-image:radial-gradient(rgba(29,51,84,.05) 1.5px, transparent 1.5px);
  background-size:26px 26px;
  display:flex; justify-content:center;
}
img, svg{ -webkit-user-drag:none; }
#app{width:100%; max-width:520px; min-height:100dvh; display:flex; flex-direction:column; padding:10px 14px 18px;}

header{display:flex; align-items:center; gap:10px; padding:6px 0 10px; min-height:54px;}
#btnBack{
  width:42px; height:42px; border-radius:14px; border:none; flex:none;
  background:var(--carte); color:var(--encre); font-size:20px; font-weight:700;
  box-shadow:var(--ombre); cursor:pointer;
}
#btnBack:active{transform:translateY(2px);}
#hdrTitle{font-weight:600; font-size:1.15rem; flex:1; line-height:1.1;}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:46%;}
.dot{width:10px; height:10px; border-radius:50%; background:#C9D6E8;}
.dot.ok{background:var(--menthe);} .dot.ko{background:var(--corail);} .dot.cur{background:var(--mandarine);}
.dot.demi{background:var(--soleil);}

/* ---------- Accueil ---------- */
#home h1{font-size:1.7rem; margin:4px 0 2px; font-weight:700;}
#home .sub{color:var(--encre2); margin:0 0 12px; font-size:.95rem;}
.rangee-paliers{display:flex; justify-content:center; gap:8px; margin:6px 0 8px; flex-wrap:wrap;}
.puce-palier{
  min-height:40px; padding:6px 18px; border-radius:999px; font-family:inherit;
  font-weight:700; font-size:.92rem; cursor:pointer;
  border:2.5px solid color-mix(in srgb, var(--encre) 22%, white); background:var(--carte); color:var(--encre);
}
.puce-palier.actif{background:var(--mandarine); border-color:var(--mandarine); color:#fff;}
/* Palier verrouillé (CHARTE §15) : au-delà du niveau du profil actif, tant
   que son paquet cadeau n’a pas été ouvert une première fois. */
.puce-palier.verrouille{opacity:.5; cursor:not-allowed;}
.note-palier{text-align:center; font-size:.82rem; color:var(--encre2); opacity:.85; margin:0 0 12px;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.card{
  background:var(--carte); border:none; border-radius:var(--r); padding:16px 12px 14px;
  box-shadow:var(--ombre); cursor:pointer; text-align:center; font-family:inherit; color:var(--encre);
  display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .08s;
}
.card:active{transform:translateY(3px);}
.card .ico{font-size:2rem; line-height:1;}
.card .nom{font-weight:600; font-size:1.02rem;}
.card .det{font-size:.78rem; color:var(--encre2);}
.card .stars{font-size:.85rem; letter-spacing:2px; min-height:1.1em;}

.bloc-bonus{
  margin-top:18px; border-radius:var(--r); padding:14px 12px;
  border:3px dashed var(--soleil); background:color-mix(in srgb, var(--soleil) 14%, white);
}
.bloc-bonus h3{text-align:center; font-size:1rem; margin:0 0 2px; color:color-mix(in srgb, var(--soleil) 55%, black 30%);}
.bloc-bonus .note-palier{margin:2px 0 10px;}
.paquet-cadeau{
  display:flex; flex-direction:column; align-items:center; gap:.7rem;
  width:100%; border:none; background:transparent; padding:1rem .5rem; cursor:pointer;
  min-height:44px; font-family:inherit;
}
.paquet-cadeau-boite{
  position:relative; width:5.6rem; height:4.6rem; border-radius:14px;
  background:linear-gradient(180deg, var(--corail), color-mix(in srgb, var(--corail) 70%, black 15%));
  border:3px solid color-mix(in srgb, var(--corail) 55%, black 20%);
  box-shadow:0 5px 0 color-mix(in srgb, var(--corail) 50%, black 25%);
  transition:transform .15s ease, box-shadow .15s ease;
}
.paquet-cadeau:active .paquet-cadeau-boite{transform:translateY(3px);}
.paquet-cadeau-ruban-v{position:absolute; left:50%; top:0; bottom:0; width:14px; margin-left:-7px; background:var(--soleil);}
.paquet-cadeau-ruban-h{position:absolute; top:50%; left:0; right:0; height:14px; margin-top:-7px; background:var(--soleil);}
.paquet-cadeau-noeud{position:absolute; left:50%; top:-1rem; transform:translateX(-50%); font-size:1.9rem; line-height:1;}
.paquet-cadeau-texte{font-weight:700; font-size:.88rem; text-align:center; color:color-mix(in srgb, var(--encre) 85%, white);}
@keyframes paquet-cadeau-pop{
  0%{transform:scale(1) rotate(0deg); opacity:1;}
  35%{transform:scale(1.18) rotate(-5deg); opacity:1;}
  100%{transform:scale(.25) rotate(10deg); opacity:0;}
}
.paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{animation:paquet-cadeau-pop .45s ease forwards;}
.paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-texte{opacity:0; transition:opacity .2s ease;}
@media (prefers-reduced-motion:reduce){
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{animation:none; opacity:0;}
}

/* ---------- Jeu ---------- */
#qText{
  font-size:1.08rem; font-weight:700; text-align:center; margin:6px 4px 2px;
  line-height:1.35; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
}
.sous-consigne{text-align:center; font-size:.85rem; color:var(--encre2); margin:2px 0 8px; line-height:1.35;}
.btn-voix{
  border:none; background:var(--carte); box-shadow:var(--ombre); border-radius:12px;
  min-width:40px; min-height:40px; font-size:1.05rem; cursor:pointer; font-family:inherit; padding:0 10px;
}
.btn-voix:active{transform:translateY(2px);}

/* Le plan : calque clair, trait de mine, rien de saturé. */
.plan{background:var(--calque); border:2px solid #D4DCE4; border-radius:var(--r); box-shadow:var(--ombre); padding:6px; margin-bottom:10px;}
.plan svg{display:block; width:100%; height:auto;}
.point-croix{stroke:var(--mine); stroke-width:2.6; stroke-linecap:round;}
.fig-trait{fill:none; stroke:var(--mine); stroke-width:2.6; stroke-linejoin:round;}
.fig-remplie{fill:rgba(90,107,125,.10); stroke:var(--mine); stroke-width:2.6; stroke-linejoin:round;}
.trace-fait{stroke:var(--menthe-t); stroke-width:3.2; stroke-linecap:round;}
.cible-tactile{fill:transparent; stroke:transparent; stroke-width:30; cursor:pointer;}
/* La cible tactile est large et invisible ; l’INDICE, lui, est petit et
   visible. Les deux sont distincts : une zone transparente ne s’offre pas,
   et un indice assez gros pour le doigt encombrerait la figure. */
.indice-cible{fill:none; stroke:var(--trait); stroke-width:1.7; stroke-dasharray:3.5 3.5; opacity:.6; pointer-events:none;}
.indice-cible.pris{opacity:0;}
.cible-tactile.sel{stroke:color-mix(in srgb, var(--mandarine) 55%, transparent);}
.repere{fill:rgba(29,51,84,.30); pointer-events:none;}
.sommet-actif{fill:none; stroke:var(--mandarine); stroke-width:3;}

/* L’INSTRUMENT — `touch-action:none` sur lui seul (cf. §19 en tête).
   Les enfants sont visés EXPLICITEMENT : `touch-action` ne s’hérite pas, et
   le sélecteur universel ci-dessus les remettrait sinon en `pan-y` — la
   poignée de rotation ferait alors défiler la page au lieu de tourner. */
.posable, .posable *{touch-action:none;}
.posable{cursor:grab;}
.posable.saisi{cursor:grabbing;}
.posable .corps{fill:rgba(120,140,160,.30); stroke:var(--trait); stroke-width:2.4;}
.posable .bord{stroke:var(--mine); stroke-width:3.4; stroke-linecap:round;}
.posable .poignee{fill:var(--mandarine); stroke:#fff; stroke-width:2.5;}
.posable .poignee-halo{fill:rgba(255,138,61,.20);}
.posable .poignee-fleche{fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round;}
.posable.aimante .bord{stroke:var(--menthe-t);}
.posable.exact .corps{fill:rgba(46,196,166,.22);}
.posable.exact .bord{stroke:var(--menthe-t);}

.barre-outils{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 10px;}
.outil{
  border:2.5px solid #C9D6E8; background:var(--carte); border-radius:12px;
  min-height:44px; padding:6px 12px; font-family:inherit; font-weight:700; font-size:.85rem;
  color:var(--encre); cursor:pointer; display:flex; align-items:center; gap:6px;
}
.outil.on{border-color:var(--mandarine); background:#FFF3E9;}
.outil svg{display:block; width:26px; height:22px;}

#answers{display:grid; grid-template-columns:1fr; gap:10px;}
#answers.duo{grid-template-columns:1fr 1fr;}
#answers.trio{grid-template-columns:1fr 1fr 1fr;}
#answers.pile{grid-template-columns:1fr;}
.rep{
  border:none; border-radius:16px; padding:13px 10px; font-family:inherit;
  font-size:1rem; font-weight:600; background:var(--carte); color:var(--encre);
  box-shadow:var(--ombre); cursor:pointer; min-height:44px; text-align:center;
}
.rep:active{transform:translateY(2px);}
.rep.ok{background:var(--menthe); color:#fff;}
.rep.ko{background:var(--corail); color:#fff; animation:shake .35s;}
.rep.dim{opacity:.5;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

#feedback{
  text-align:center; font-weight:700; margin-top:12px; min-height:2.4em;
  font-size:1rem; line-height:1.35; padding:0 6px;
}
#feedback.bon{color:var(--menthe-t);} #feedback.mauvais{color:var(--corail-t);}
#feedback.demi{color:#8A6D1F;}
/* CHARTE §18 : ce qu’il fallait faire reste en VERT, le rouge ne désigne
   jamais la bonne réponse. */
#feedback .correction-attendue{color:var(--menthe-t);}

#btnValider, #btnNext{
  display:none; margin:12px auto 0; border:none; border-radius:18px;
  padding:13px 34px; font-family:inherit; font-size:1.05rem; font-weight:700; color:#fff; cursor:pointer;
}
#btnValider{background:var(--menthe); box-shadow:0 4px 0 var(--menthe-t);}
#btnNext{background:var(--mandarine); box-shadow:0 4px 0 var(--mandarine-f);}
#btnValider:active, #btnNext:active{transform:translateY(3px);}

/* Fin */
#end{text-align:center; padding-top:8vh;}
#endStars{font-size:3.4rem; letter-spacing:8px; margin:10px 0;}
#endStars span{display:inline-block; animation:pop .5s backwards;}
#endStars span:nth-child(2){animation-delay:.25s;} #endStars span:nth-child(3){animation-delay:.5s;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
#endMsg{font-size:1.3rem; font-weight:700;}
#endScore{color:var(--encre2); margin:6px 0 22px;}
#end .actions-fin{display:flex; gap:12px; justify-content:center;}
#end .actions-fin button{
  border:none; border-radius:18px; padding:13px 26px; font-family:inherit;
  font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:var(--ombre); min-height:44px;
}
#bRejouer{background:var(--mandarine); color:#fff; box-shadow:0 4px 0 var(--mandarine-f);}
#bMenu{background:var(--carte); color:var(--encre);}

/* Retour coquille (CHARTE §7) */
.barre-accueil{display:flex; margin:0 0 8px;}
.bouton-menu{
  min-height:44px; border-radius:14px; padding:0 14px; cursor:pointer; font-family:inherit;
  border:2px solid color-mix(in srgb, var(--encre) 25%, white);
  background:var(--carte); color:var(--encre); font-weight:600; font-size:.95rem;
  display:inline-flex; align-items:center; gap:6px;
}
.bouton-menu:active{transform:translateY(2px);}
.modale-fond{
  position:fixed; inset:0; z-index:1000; padding:1.2rem;
  background:color-mix(in srgb, var(--encre) 55%, transparent);
  display:flex; align-items:center; justify-content:center;
}
.modale-boite{
  background:var(--carte); border-radius:20px; padding:22px 18px; max-width:20rem; width:100%;
  text-align:center; box-shadow:0 12px 34px rgba(29,51,84,.3);
}
.modale-boite p{font-size:1.05rem; font-weight:600; margin:0 0 18px;}
.modale-boutons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.modale-boutons button{
  border:none; border-radius:16px; padding:12px 20px; font-family:inherit;
  font-size:1rem; font-weight:700; cursor:pointer; min-height:44px;
}
.modale-boutons .m-rester{background:var(--carte); color:var(--encre); border:2px solid var(--encre);}
.modale-boutons .m-revenir{background:var(--mandarine); color:#fff;}

#confettis-conteneur{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
.confetti{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
  animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards;}
@keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
@media (prefers-reduced-motion:reduce){ .confetti{display:none; animation:none;} }

[hidden]{display:none !important;}
@media (prefers-color-scheme: dark){
  html, body{background:var(--ciel) !important; color:var(--encre) !important;}
  .card, .rep, .plan, .outil, #btnBack, .puce-palier, .btn-voix{background:var(--carte) !important; color:var(--encre) !important;}
  .plan{background:var(--calque) !important;}
  .puce-palier.actif{background:var(--mandarine) !important; color:#fff !important;}
  .rep.ok{background:var(--menthe) !important; color:#fff !important;}
  .rep.ko{background:var(--corail) !important; color:#fff !important;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div id="confettis-conteneur" aria-hidden="true"></div>
<div class="modale-fond" id="modale-menu" hidden>
  <div class="modale-boite" role="dialog" aria-modal="true" aria-labelledby="modale-menu-texte">
    <p id="modale-menu-texte">Revenir au menu principal ? Ta partie en cours sera perdue.</p>
    <div class="modale-boutons">
      <button type="button" class="m-rester" id="modale-menu-rester">Rester</button>
      <button type="button" class="m-revenir" id="modale-menu-revenir">Revenir au menu</button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <button id="btnBack" hidden aria-label="Retour">←</button>
    <div id="hdrTitle">L’atelier de contrôle</div>
    <div id="dots"></div>
  </header>
  <main>
    <section id="home">
      <div class="barre-accueil"><button type="button" class="bouton-menu" id="bouton-menu">← Menu</button></div>
      <h1>L’atelier de contrôle</h1>
      <p class="sub" id="sous-titre-accueil"></p>
      <div class="rangee-paliers" id="rangee-paliers"></div>
      <p class="note-palier" id="note-palier"></p>
      <div class="cards" id="grille-jeux"></div>
      <div class="bloc-bonus" id="bloc-bonus" hidden>
        <h3>Palier bonus 🎁</h3>
        <p class="note-palier" id="note-bonus"></p>
        <button type="button" class="paquet-cadeau" id="paquet-cadeau" hidden>
          <span class="paquet-cadeau-boite">
            <span class="paquet-cadeau-ruban-v"></span><span class="paquet-cadeau-ruban-h"></span>
            <span class="paquet-cadeau-noeud">🎀</span>
          </span>
          <span class="paquet-cadeau-texte">Touche le paquet pour découvrir ta récompense !</span>
        </button>
        <div class="cards" id="grille-bonus" hidden></div>
      </div>
    </section>

    <section id="game" hidden>
      <div id="qText"></div>
      <p class="sous-consigne" id="sousConsigne"></p>
      <div class="barre-outils" id="barreOutils" hidden></div>
      <div class="plan" id="plan"><svg id="scene" viewBox="0 0 400 300"></svg></div>
      <div id="answers"></div>
      <button id="btnValider" type="button">Vérifier ✓</button>
      <p id="feedback"></p>
      <button id="btnNext" type="button">Suivant ➜</button>
    </section>

    <section id="end" hidden>
      <div id="endStars"></div>
      <div id="endMsg"></div>
      <div id="endScore"></div>
      <div class="actions-fin">
        <button id="bRejouer">Rejouer</button>
        <button id="bMenu">Menu</button>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ============================================================
   CONSTANTES DE CALIBRAGE
   Les seuils qui font vivre le module sont NOMMÉS ici, pas dispersés :
   ce sont eux qu’il faudra retoucher après essai sur appareil.
   ============================================================ */
/* Échelle reprise du double-décimètre de M23 (20 unités : ⌊280/20⌋ = 14),
   pour que l’enfant retrouve le même centimètre d’un jeu à l’autre. */
const PX_PAR_CM = 14;
/* L’aimant accroche la POSITION à cette distance. Il n’accroche jamais un
   angle sur un alignement faux : il aide à poser, jamais à conclure. */
const AIMANT_PX = 14;
/* Écart d’un point à la droite des deux autres. Indécidable à l’œil, ou
   franchement visible : c’est ce curseur qui décide si l’instrument est
   nécessaire, et donc obligatoire. */
const ECART_INDECIDABLE = [2, 4], ECART_EVIDENT = [15, 26];
/* Angles douteux : proches de 90° sans y être. Un angle franc appartient
   à M34, qui le classe à l’œil. */
const ANGLES_DOUTEUX = [84, 86, 87, 93, 94, 96];
const ANGLES_FRANCS = [52, 58, 63, 118, 125, 133];
const TOL_ANGLE_DROIT = 1.0;         // en deçà, l’angle EST droit
/* Longueurs : au-delà de 15 % d’écart la différence est franche, en deçà
   elle appelle le report au compas. */
const SEUIL_LONGUEUR_FRANCHE = 0.15;
/* Milieu par pliage : ±5 % de la longueur du segment. Sur 300 px, ±15 px —
   une cible honnête au doigt, qui écarte tout de même l’« à peu près ». */
const TOL_PLIAGE = 0.05;
/* Barème en DEMI-POINTS, pour que le contrat §11 reste entier : réponse
   juste avec l’instrument requis = 2, juste sans l’avoir posé = 1,
   fausse = 0. Trop vérifier n’est jamais pénalisé. */
const PTS_PLEIN = 2, PTS_SANS_VERIF = 1;
const DELAI_REVELATION = 900;        // §18 : révélation différée

/* ============================================================
   LANGUE (cf. CLAUDE.md) — élision et accord se calculent
   ============================================================ */
function deElision(mot){
  return /^[aeiouyàâäéèêëïîôöùûü]/i.test(mot) ? 'd’' + mot : 'de ' + mot;
}
const maj = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ============================================================
   GÉOMÉTRIE
   ============================================================ */
const TAU = Math.PI * 2;
const degres = r => r * 180 / Math.PI, radians = d => d * Math.PI / 180;
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
/* Distance signée d’un point à la droite (A,B) : le signe dit de quel côté,
   la valeur absolue de combien. C’est la mesure même de l’alignement. */
function ecartDroite(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  if (L < 1e-9) return dist(p, a);
  return ((p[0] - a[0]) * dy - (p[1] - a[1]) * dx) / L;
}
function distancePointDroite(p, o, angle){
  const dx = Math.cos(angle), dy = Math.sin(angle);
  return Math.abs((p[0] - o[0]) * dy - (p[1] - o[1]) * dx);
}
function angleEn(sommet, a, b){
  const u = [a[0] - sommet[0], a[1] - sommet[1]], v = [b[0] - sommet[0], b[1] - sommet[1]];
  const cos = (u[0]*v[0] + u[1]*v[1]) / (Math.hypot(...u) * Math.hypot(...v));
  return degres(Math.acos(Math.max(-1, Math.min(1, cos))));
}
const milieu = (a, b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
/* Ramène un nuage de points dans un cadre donné, par translation puis, si
   besoin, homothétie — laquelle ne touche pas aux angles, si bien que la
   question posée reste vraie. Sans ce passage, une figure tirée au sort
   sort du plan par un bord et l’enfant répond sur ce qu’il ne voit pas. */
function cadrer(pts, x0, y0, x1, y1){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const l = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
  const k = Math.min((x1-x0) / (l || 1), (y1-y0) / (h || 1), 1);
  const mx = (Math.min(...xs) + Math.max(...xs)) / 2, my = (Math.min(...ys) + Math.max(...ys)) / 2;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return pts.map(p => [cx + (p[0] - mx)*k, cy + (p[1] - my)*k]);
}
function melanger(t){
  const c = [...t];
  for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [c[i], c[j]] = [c[j], c[i]]; }
  return c;
}
const pioche = a => a[Math.floor(Math.random()*a.length)];
const entre = (a, b) => a + Math.random() * (b - a);
const signeAleatoire = () => Math.random() < 0.5 ? -1 : 1;

/* ============================================================
   MOTEUR D’OBJETS POSABLES
   ------------------------------------------------------------
   Un état {x, y, angle} rendu en <g transform>. Deux zones de saisie : le
   CORPS translate, une POIGNÉE en bout fait tourner. Jamais de rotation à
   deux doigts — indécouvrable pour un enfant, et incompatible avec le
   défilement de la page.

   La conversion écran → SVG passe par l’inverse de getScreenCTM() : un
   simple delta de pixels serait faux dès que le viewBox est mis à
   l’échelle, ce qui est le cas sur tout téléphone.
   ============================================================ */
function versSVG(svg, clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const m = svg.getScreenCTM();
  if (!m) return {x:clientX, y:clientY};
  const q = pt.matrixTransform(m.inverse());
  return {x:q.x, y:q.y};
}

function creerPosable(svg, spec){
  /* spec : {x, y, angle, corps (markup SVG local), poignee:[px,py],
             pointsAimant:[[x,y]…], surChangement(etat)} */
  let x = spec.x, y = spec.y, a = spec.angle || 0;
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'posable');
  const po = spec.poignee;
  g.innerHTML = spec.corps
    + (po ? `<circle class="poignee-halo" cx="${po[0]}" cy="${po[1]}" r="24"/>`
          + `<circle class="poignee" cx="${po[0]}" cy="${po[1]}" r="11"/>`
          + `<path class="poignee-fleche" d="M ${po[0]-5} ${po[1]-1.5} a 5 5 0 1 1 1.7 3.6"/>` : '');
  svg.appendChild(g);

  const etat = () => ({x, y, angle:a});
  function appliquer(){
    g.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${degres(a).toFixed(2)})`);
    /* Le groupe est passé en second : `appliquer()` s’exécute une première
       fois AVANT que l’appelant n’ait pu ranger le posable dans
       `posableCourant`, qui vaut alors encore null. */
    if (spec.surChangement) spec.surChangement(etat(), g);
  }
  /* Aimantation de POSITION seulement : on rapproche l’origine de
     l’instrument d’un point remarquable. L’angle, lui, n’est jamais
     accroché — accrocher un angle reviendrait à trancher l’alignement à la
     place de l’enfant, c’est-à-dire à répondre pour lui. */
  function aimanter(){
    if (!spec.pointsAimant) return false;
    let meilleur = null, d0 = AIMANT_PX;
    spec.pointsAimant.forEach(p => {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d < d0) { d0 = d; meilleur = p; }
    });
    if (meilleur) { x = meilleur[0]; y = meilleur[1]; return true; }
    return false;
  }

  let mode = null, depart = null;
  const surDown = (e) => {
    if (g.dataset.verrouille === '1') return;
    const p = versSVG(svg, e.clientX, e.clientY);
    const surPoignee = /^poignee/.test(e.target.getAttribute('class') || '');
    mode = surPoignee ? 'rot' : 'trans';
    depart = mode === 'trans'
      ? {dx: p.x - x, dy: p.y - y}
      : {a0: a, ang0: Math.atan2(p.y - y, p.x - x)};
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    g.classList.add('saisi');
    e.preventDefault();
  };
  const surMove = (e) => {
    if (!mode) return;
    const p = versSVG(svg, e.clientX, e.clientY);
    if (mode === 'trans') { x = p.x - depart.dx; y = p.y - depart.dy; g.classList.toggle('aimante', aimanter()); }
    else a = depart.a0 + (Math.atan2(p.y - y, p.x - x) - depart.ang0);
    appliquer();
    e.preventDefault();
  };
  const surUp = (e) => {
    mode = null; g.classList.remove('saisi');
    try { g.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  g.addEventListener('pointerdown', surDown);
  g.addEventListener('pointermove', surMove);
  g.addEventListener('pointerup', surUp);
  g.addEventListener('pointercancel', surUp);

  appliquer();
  return {
    g, etat,
    verrouiller(){ g.dataset.verrouille = '1'; g.style.cursor = 'default'; },
    /* Révélation différée (§18) : l’instrument rejoint tout seul la position
       exacte, pour montrer ce qu’il fallait voir. */
    placerExact(nx, ny, na){
      g.classList.add('exact');
      x = nx; y = ny; a = na;
      g.style.transition = 'none';
      appliquer();
    }
  };
}

/* ---- Habillages des trois instruments (géométrie locale) ----
   Chaque habillage livre son CORPS et l’emplacement de sa POIGNÉE. Les deux
   vont ensemble : un instrument sans poignée ne peut être que translaté,
   donc jamais orienté — autant dire jamais posé. La poignée est toujours
   loin de l’origine (le point d’aimantation), pour que le geste « je tiens
   le coin et je fais pivoter » soit sûr même avec un doigt d’enfant. */

/* La règle : bord franc le long de l’axe local des x, corps translucide
   au-dessous — on lit l’alignement SUR le bord, jamais au milieu. */
const REGLE = (L) => ({
  corps: `<rect class="corps" x="${-L/2}" y="0" width="${L}" height="30" rx="4"/>`
       + `<line class="bord" x1="${-L/2}" y1="0" x2="${L/2}" y2="0"/>`,
  poignee: [L/2 - 34, 46]
});
/* Le gabarit : un coin de carton, pas une équerre complète. On le pose dans
   le sommet ; le côté de la figure tombe visiblement dedans ou dehors. */
const GABARIT = (L) => ({
  corps: `<path class="corps" d="M 0 0 L ${L} 0 L ${L} ${L*0.34} L ${L*0.34} ${L*0.34} L ${L*0.34} ${L} L 0 ${L} Z"/>`
       + `<line class="bord" x1="0" y1="0" x2="${L}" y2="0"/>`
       + `<line class="bord" x1="0" y1="0" x2="0" y2="${L}"/>`,
  poignee: [L*0.80, L*0.17]
});
/* L’équerre : même objet posable, habillage d’outil réel (CE2). */
const EQUERRE = (L) => ({
  corps: `<path class="corps" d="M 0 0 L ${L} 0 L 0 ${L} Z"/>`
       + `<line class="bord" x1="0" y1="0" x2="${L}" y2="0"/>`
       + `<line class="bord" x1="0" y1="0" x2="0" y2="${L}"/>`,
  poignee: [L*0.36, L*0.36]
});

  const p = CONTENU.paliers[nom];
  if (!p) return false;
  const pid = lireProfilActifId();
  const s = lireSessions().filter(x => x.profilId === pid && x.module === MODULE_ID);
  return p.miniJeux.every(mj => {
    const l = s.filter(x => x.competence === mj.id);
    if (!l.length) return false;
    const d = l[l.length - 1];
    return d.total > 0 && d.score / d.total >= SEUIL_MAITRISE;
  });

  return CONTENU.paliers[s] ? s : null;
}

let actx = null;
function jouerNote(f, d, dur, vol, forme){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = forme || 'sine'; o.frequency.value = f;
    const t = actx.currentTime + d;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}

/* ============================================================
   FABRIQUE D’ITEMS
   ============================================================ */
/* Trois points, alignés ou non. Un item ALIGNÉ est toujours indécidable à
   l’œil — un alignement exact et un quasi-alignement se ressemblent trait
   pour trait ; c’est pourquoi l’instrument y est toujours requis. Un
   désalignement FRANC, lui, se voit : l’instrument y reste facultatif. */
function itemAlignement(evident, penteMax){
  const ya = entre(70, 210);
  /* `penteMax` borne l’inclinaison de la rangée. Sans elle, les deux points
     extrêmes tirés indépendamment donnent une rangée très oblique : le
     défaut du point du milieu se lit alors comme « celui-ci est plus bas »
     et non comme « celui-ci sort du rang ». */
  const yb = penteMax
    ? Math.max(70, Math.min(210, ya + entre(-penteMax, penteMax)))
    : entre(70, 210);
  const a = [entre(50, 110), ya];
  const b = [entre(290, 350), yb];
  const t = entre(0.42, 0.58);
  const surDroite = [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
  const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy);
  const nx = -dy/L, ny = dx/L;
  let ecart = 0, aligne = false;
  if (evident) {
    ecart = entre(...ECART_EVIDENT) * signeAleatoire();     // défaut visible
  } else if (Math.random() < 0.5) {
    aligne = true;                                          // vraiment alignés
  } else {
    ecart = entre(...ECART_INDECIDABLE) * signeAleatoire(); // indécidable
  }
  const c = [surDroite[0] + nx*ecart, surDroite[1] + ny*ecart];
  return {points:[a, c, b], aligne, ecart:Math.abs(ecart), evident:!!evident,
          /* Instrument requis dès que l’œil ne peut pas trancher. */
          requiert: !evident};
}

function itemAngle(douteux){
  const sommet = [entre(150, 250), entre(170, 215)];
  const base = entre(0, TAU);
  const deg = douteux ? pioche(ANGLES_DOUTEUX) : pioche(ANGLES_FRANCS);
  const estDroit = Math.random() < (douteux ? 0.34 : 0);
  const angle = estDroit ? 90 : deg;
  const L1 = entre(92, 118), L2 = entre(92, 118);
  const a0 = [sommet[0] + Math.cos(base)*L1, sommet[1] + Math.sin(base)*L1];
  const b0 = [sommet[0] + Math.cos(base + radians(angle))*L2, sommet[1] + Math.sin(base + radians(angle))*L2];
  const [S, a, b] = cadrer([sommet, a0, b0], 34, 34, 366, 232);
  return {sommet:S, a, b, angle, douteux:!!douteux, requiert:!!douteux,
          reponse: Math.abs(angle - 90) <= TOL_ANGLE_DROIT ? 'droit' : (angle < 90 ? 'aigu' : 'obtus')};
}

/* Polygone dont on passe chaque angle en revue (CE2) : deux angles francs,
   un ou deux douteux — c’est là que s’apprend « quand l’œil suffit-il ? ».
   Un quadrilatère tiré au hasard ne donne pas ce dosage : ses quatre angles
   tombent où ils veulent, et la plupart atterrissent dans la zone grise où
   l’enfant ne peut ni voir ni décider. Les angles sont donc TIRÉS D’ABORD,
   et la figure est CONSTRUITE pour les respecter exactement. */

/* Somme imposée à 360°, chaque angle franc (≤ 75° ou ≥ 105°). */
function anglesFrancsSommant(k, somme){
  for (let essai = 0; essai < 300; essai++) {
    const a = [];
    for (let i = 0; i < k - 1; i++) a.push(pioche(ANGLES_FRANCS));
    const dernier = somme - a.reduce((s, x) => s + x, 0);
    if (dernier >= 30 && dernier <= 150 && Math.abs(dernier - 90) >= 15) return a.concat(dernier);
  }
  return null;
}

/* Contour fermé dont les angles intérieurs sont EXACTEMENT ceux demandés :
   les directions des côtés découlent des angles, deux longueurs sont tirées
   au sort et les deux autres se déduisent de la condition de fermeture. */
function contourDAngles(A){
  const n = A.length;
  const th = [entre(0, TAU)];
  for (let i = 1; i < n; i++) th.push(th[i-1] + radians(180 - A[i]));
  for (let essai = 0; essai < 60; essai++) {
    const s2 = entre(80, 150), s3 = entre(80, 150);
    const rx = -(s2*Math.cos(th[2]) + s3*Math.cos(th[3]));
    const ry = -(s2*Math.sin(th[2]) + s3*Math.sin(th[3]));
    const det = Math.cos(th[0])*Math.sin(th[1]) - Math.cos(th[1])*Math.sin(th[0]);
    if (Math.abs(det) < 1e-6) continue;
    const s0 = (rx*Math.sin(th[1]) - ry*Math.cos(th[1])) / det;
    const s1 = (ry*Math.cos(th[0]) - rx*Math.sin(th[0])) / det;
    if (s0 < 60 || s1 < 60 || s0 > 220 || s1 > 220) continue;
    const s = [s0, s1, s2, s3];
    const pts = [[0, 0]];
    for (let i = 0; i < n - 1; i++)
      pts.push([pts[i][0] + s[i]*Math.cos(th[i]), pts[i][1] + s[i]*Math.sin(th[i])]);
    /* Recentrage et mise à l’échelle : une homothétie ne touche pas aux
       angles, la commande passée plus haut reste donc vraie. */
    return cadrer(pts, 34, 34, 366, 232);
  }
  return null;
}

function itemPolygone(){
  const n = 4;
  for (let essai = 0; essai < 200; essai++) {
    const nbDouteux = Math.random() < 0.5 ? 1 : 2;
    /* Un angle « douteux » est tantôt vraiment droit, tantôt à quelques
       degrés du droit : c’est ce qui rend l’équerre indispensable. */
    const douteuxTires = Array.from({length: nbDouteux},
      () => Math.random() < 0.4 ? 90 : pioche(ANGLES_DOUTEUX));
    const francs = anglesFrancsSommant(n - nbDouteux, 360 - douteuxTires.reduce((s, x) => s + x, 0));
    if (!francs) continue;
    const A = melanger(douteuxTires.concat(francs));
    const pts = contourDAngles(A);
    if (!pts) continue;
    /* Les réponses sont relues sur la FIGURE, jamais sur la commande. */
    const angles = pts.map((p, i) => angleEn(p, pts[(i-1+n)%n], pts[(i+1)%n]));
    return {pts, angles,
      reponses: angles.map(a => Math.abs(a - 90) <= TOL_ANGLE_DROIT ? 'droit' : (a < 90 ? 'aigu' : 'obtus')),
      douteux: angles.map(a => Math.abs(a - 90) <= 8)};
  }
  /* Repli déterministe : un trapèze rectangle, deux angles droits francs. */
  const pts = cadrer([[70, 60], [70, 230], [300, 230], [250, 60]], 34, 34, 366, 232);
  const angles = pts.map((p, i) => angleEn(p, pts[(i-1+4)%4], pts[(i+1)%4]));
  return {pts, angles,
    reponses: angles.map(a => Math.abs(a - 90) <= TOL_ANGLE_DROIT ? 'droit' : (a < 90 ? 'aigu' : 'obtus')),
    douteux: angles.map(a => Math.abs(a - 90) <= 8)};
}

/* Figures du codage. `groupes` décrit les égalités de côtés attendues, et
   `droits` les angles à marquer. Le seuil de 15 % décide si la différence
   de longueurs est franche ou demande le report au compas. */
function figureCodage(type){
  const cx = 200, cy = 140, th = entre(-0.35, 0.35);
  const T = pts => pts.map(([x,y]) => [cx + x*Math.cos(th) - y*Math.sin(th), cy + x*Math.sin(th) + y*Math.cos(th)]);
  if (type === 'carre') {
    const c = 74;
    return {type, pts:T([[-c,-c],[c,-c],[c,c],[-c,c]]), groupes:[[0,1,2,3]], droits:[0,1,2,3]};
  }
  if (type === 'rectangle') {
    const l = 108, h = 62;
    return {type, pts:T([[-l,-h],[l,-h],[l,h],[-l,h]]), groupes:[[0,2],[1,3]], droits:[0,1,2,3]};
  }
  if (type === 'losange') {
    const a = 108, b = 62;
    return {type, pts:T([[0,-b],[a,0],[0,b],[-a,0]]), groupes:[[0,1,2,3]], droits:[]};
  }
  if (type === 'triangleRect') {
    return {type, pts:T([[-70,60],[80,60],[-70,-70]]), groupes:[], droits:[0]};
  }
  /* Triangle isocèle : deux côtés égaux sur trois. La marque isolée y
     devient visiblement absurde — c’est l’erreur que le jeu doit provoquer.
     La base est franchement plus courte que les deux côtés (124 contre 166,
     soit 34 % d’écart) : un premier dessin la donnait à 156 pour 155, donc
     égale aux autres à 1 % près — le triangle était équilatéral sans le
     dire, et le codage attendu devenait faux. */
  return {type:'isocele', pts:T([[-62,66],[62,66],[0,-88]]), groupes:[[1,2]], droits:[]};
}

function construireAccueil(){
  $('hdrTitle').textContent = 'L’atelier de contrôle';
  const palier = CONTENU.paliers[etatPalierAffiche];

  const rangee = $('rangee-paliers'); rangee.innerHTML = '';
  const niveauProfil = niveauDuProfilActif();
  /* Verrouillage des onglets (CHARTE §15) : un palier au-delà du niveau du
     profil reste fermé tant que son paquet cadeau n’a pas été ouvert. */
  let idx = ORDRE_PALIERS.indexOf(niveauProfil);

  const pid = lireProfilActifId();
  ORDRE_PALIERS.filter(n => CONTENU.paliers[n]).forEach(n => {
    const verr = ORDRE_PALIERS.indexOf(n) > idx && !bonusDejaRevele(pid, n);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'puce-palier' + (n === etatPalierAffiche ? ' actif' : '') + (verr ? ' verrouille' : '');
    b.textContent = verr ? n + ' 🔒' : n;
    b.disabled = verr;
    if (!verr) b.addEventListener('click', () => { etatPalierAffiche = n; construireAccueil(); });
    rangee.appendChild(b);
  });
  $('note-palier').textContent = niveauProfil
    ? 'Niveau de ' + (niveauProfil === etatPalierAffiche ? 'ton profil'
        : 'ton profil : ' + niveauProfil + ' — tu regardes le palier ' + etatPalierAffiche) : '';

  (palier ? palier.miniJeux : []).forEach(c => g.appendChild(creerCarte(c)));

  if (suivant && palierMaitrise(etatPalierAffiche)) {
    bloc.hidden = false;
    $('note-bonus').textContent = 'Tu maîtrises tout le palier ' + etatPalierAffiche

    else {
      paquet.hidden = false; paquet.disabled = false;
      paquet.classList.remove('paquet-cadeau-ouverture');
      gb.hidden = true;
      /* `onclick` et non addEventListener : bouton fixe réutilisé à chaque
         rendu, un écouteur de plus s’empilerait à chaque fois (§15). */
      paquet.onclick = () => ouvrirPaquet(pid, suivant, paquet, gb);

}

  marquerBonusRevele(pid, cible);

  paquet.classList.add('paquet-cadeau-ouverture');
  setTimeout(() => { paquet.hidden = true; gb.hidden = false; }, 480);
}

/* ---------- Construction des files ---------- */
function construireFile(cfg){
  const n = cfg.nbQuestions;
  if (cfg.mode === 'alignement') {
    const nEtabli = cfg.etabli || 0;
    const surPlan = n - nEtabli;
    const nEvidents = Math.round(surPlan * (cfg.dosageEvident || 0));
    const items = melanger(
      Array.from({length: surPlan}, (_, i) => itemAlignement(i < nEvidents))
    ).map((it, i) => Object.assign(it, {
      mode:'alignement', note:true,
      /* Au CE1, l’enfant doit parfois PLACER un point pour qu’il soit
         aligné, et non plus seulement juger. */
      placer: !!cfg.placer && i === surPlan - 1
    }));
    /* Le premier temps est physique : des pointes plantées dans l’établi,
       vues de biais. Le second reprend LES MÊMES emplacements vus de
       dessus. Ce basculement de représentation est ce que le texte
       demande — pas un changement d’exercice. */
    /* Sur l’établi, l’enfant n’a AUCUN instrument : la pointe fautive doit
       donc se voir, et il doit y en avoir une. Un tirage « non évident »
       donnait tantôt un écart de 2 px, indécidable, tantôt trois pointes
       réellement alignées — et la consigne « une pointe n’est pas dans le
       rang » désignait alors une pointe qui l’était. */
    const etabli = Array.from({length: nEtabli}, () =>
      Object.assign(itemAlignement(true, 26), {mode:'etabli', note:true, requiert:false}));
    return etabli.concat(items);
  }
  if (cfg.mode === 'tracer')
    return Array.from({length:n}, (_, i) => ({mode:'tracer', note:true, requiert:true,
      orientation:['horizontale','verticale','oblique','oblique','verticale'][i % 5]}));
  if (cfg.mode === 'angles')
    return Array.from({length:n}, (_, i) =>
      Object.assign(itemAngle(true), {mode:'angles', note:true, outil: i < 3 ? 'gabarit' : 'equerre'}));
  if (cfg.mode === 'anglesPoly')
    return Array.from({length:n}, () => Object.assign(itemPolygone(), {mode:'anglesPoly', note:true, requiert:true}));
  if (cfg.mode === 'compas1')
    return [
      {mode:'compasLibre', note:false},                    // prise en main, non notée
      {mode:'compasPassant', note:true, requiert:true},
      {mode:'compasPassant', note:true, requiert:true},
      {mode:'pliage', note:true, requiert:true},
      {mode:'pliage', note:true, requiert:true}
    ];
  if (cfg.mode === 'compas2')
    return [
      {mode:'compasRayon', note:true, requiert:true, rayonCm:3},
      {mode:'compasRayon', note:true, requiert:true, rayonCm:4},
      {mode:'report', note:true, requiert:true},
      {mode:'report', note:true, requiert:true},
      {mode:'compasRayon', note:true, requiert:true, rayonCm:5}
    ];
  if (cfg.mode === 'codage1')
    return melanger(['carre','rectangle','triangleRect','rectangle','carre'])
      .map(t => Object.assign(figureCodage(t), {mode:'codage1', note:true, requiert:false}));
  /* CE2 : la progression des figures EST le raisonnement à construire —
     du carré (une seule marque répétée) au rectangle (deux groupes, deux
     notations : l’exemple de réussite officiel), puis les cas limites. */
  return ['carre','rectangle','losange','triangleRect','isocele']
    .map(t => Object.assign(figureCodage(t), {mode:'codage2', note:true}));
}
