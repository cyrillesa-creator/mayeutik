<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>L’atelier de contrôle — Mayeutik</title>
<!-- ============================================================
     JEU M35 — Vérifier et coder (CP, CE1, CE2)
     Backlog : pilotage/backlog.json — sous-thème « La géométrie plane »
     Univers : l’atelier de contrôle du vitrail. Plan technique, trait noir
     sur calque, palette DÉSATURÉE — on n’est plus dans le verre coloré de
     M34, on est dans le plan.

     Ce que le module fait : poser un instrument sur une figure et lire ce
     qu’il tranche, puis annoter ce qu’on a établi. Ce qu’il ne fait pas :
     reproduire ou construire une figure (M38), nommer ou justifier par
     propriété (M34). Seule exception assumée, sans quoi une compétence CP
     resterait orpheline : tracer une droite par deux points à la règle,
     comme CONCLUSION du mini-jeu d’alignement.

     LA RÈGLE D’OR : le texte dit d’utiliser l’instrument « dans les cas où
     la réponse n’est pas perceptible de façon évidente ». Les items
     ambigus doivent donc l’être VRAIMENT — un écart de 2 à 4 px, un angle
     à 87°. Si le défaut se voit à l’œil, l’instrument devient décoratif et
     l’enfant apprend à l’ignorer. Chaque palier mélange délibérément des
     items évidents et des items indécidables : savoir quand l’œil suffit
     est le véritable apprentissage transversal du module.

     HONNÊTETÉ SUR LE GESTE : un écran ne peut pas entraîner la main sur un
     vrai compas et ne doit pas prétendre le faire. On vise la couche
     conceptuelle — ce que l’instrument permet de conclure, et quand il
     faut y recourir. Aucun pincement à deux doigts, aucune simulation de
     crayon longeant une réglette.
     ============================================================ -->
<style>
:root{
  color-scheme: light only;
  --ciel:#EAF2FC; --carte:#FFFFFF; --encre:#1D3354; --encre2:#41577A;
  --mandarine:#FF8A3D; --mandarine-f:#E5701F;
  --menthe:#2EC4A6; --menthe-t:#0B8A70; --corail:#FF5D5D; --corail-t:#D93636; --soleil:#FFC93C;
  /* Palette désaturée propre à l’atelier de contrôle : calque, mine de
     plomb, bois de l’établi. */
  --calque:#F4F6F8; --mine:#33404F; --trait:#5A6B7D; --bois:#B99A72; --bois-f:#8E7350;
  --r:20px; --ombre:0 4px 0 rgba(29,51,84,.12);
  font-size:16px;
}

/* ---------- Protections tactiles (CHARTE §19) ----------
   `touch-action` ne s’hérite PAS : le sélecteur universel est le seul moyen
   de couvrir toute l’interface. `pan-y` préserve le défilement vertical de
   la page ; les instruments, eux, déclarent `none` sur eux-mêmes (§19
   autorise la déclaration plus spécifique) — sans quoi tirer une règle vers
   le bas ferait défiler la page au lieu de déplacer l’outil. */
*{ box-sizing:border-box; touch-action:pan-y; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--ciel); color-scheme:light only; }
html,body{margin:0; padding:0; min-height:100%;}
body{
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  font-family:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  background:var(--ciel); color:var(--encre);
  background-image:radial-gradient(rgba(29,51,84,.05) 1.5px, transparent 1.5px);
  background-size:26px 26px;
  display:flex; justify-content:center;
}
img, svg{ -webkit-user-drag:none; }
#app{width:100%; max-width:520px; min-height:100dvh; display:flex; flex-direction:column; padding:10px 14px 18px;}

header{display:flex; align-items:center; gap:10px; padding:6px 0 10px; min-height:54px;}
#btnBack{
  width:42px; height:42px; border-radius:14px; border:none; flex:none;
  background:var(--carte); color:var(--encre); font-size:20px; font-weight:700;
  box-shadow:var(--ombre); cursor:pointer;
}
#btnBack:active{transform:translateY(2px);}
#hdrTitle{font-weight:600; font-size:1.15rem; flex:1; line-height:1.1;}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:46%;}
.dot{width:10px; height:10px; border-radius:50%; background:#C9D6E8;}
.dot.ok{background:var(--menthe);} .dot.ko{background:var(--corail);} .dot.cur{background:var(--mandarine);}
.dot.demi{background:var(--soleil);}

/* ---------- Accueil ---------- */
#home h1{font-size:1.7rem; margin:4px 0 2px; font-weight:700;}
#home .sub{color:var(--encre2); margin:0 0 12px; font-size:.95rem;}
.rangee-paliers{display:flex; justify-content:center; gap:8px; margin:6px 0 8px; flex-wrap:wrap;}
.puce-palier{
  min-height:40px; padding:6px 18px; border-radius:999px; font-family:inherit;
  font-weight:700; font-size:.92rem; cursor:pointer;
  border:2.5px solid color-mix(in srgb, var(--encre) 22%, white); background:var(--carte); color:var(--encre);
}
.puce-palier.actif{background:var(--mandarine); border-color:var(--mandarine); color:#fff;}
/* Palier verrouillé (CHARTE §15) : au-delà du niveau du profil actif, tant
   que son paquet cadeau n’a pas été ouvert une première fois. */
.puce-palier.verrouille{opacity:.5; cursor:not-allowed;}
.note-palier{text-align:center; font-size:.82rem; color:var(--encre2); opacity:.85; margin:0 0 12px;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.card{
  background:var(--carte); border:none; border-radius:var(--r); padding:16px 12px 14px;
  box-shadow:var(--ombre); cursor:pointer; text-align:center; font-family:inherit; color:var(--encre);
  display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .08s;
}
.card:active{transform:translateY(3px);}
.card .ico{font-size:2rem; line-height:1;}
.card .nom{font-weight:600; font-size:1.02rem;}
/* `pre-line` : une vignette peut porter deux lignes quand la consigne le
   demande, sans balise dans la donnée. */
.card .det{font-size:.78rem; color:var(--encre2); white-space:pre-line;}
.card .stars{font-size:.85rem; letter-spacing:2px; min-height:1.1em;}

.bloc-bonus{
  margin-top:18px; border-radius:var(--r); padding:14px 12px;
  border:3px dashed var(--soleil); background:color-mix(in srgb, var(--soleil) 14%, white);
}
.bloc-bonus h3{text-align:center; font-size:1rem; margin:0 0 2px; color:color-mix(in srgb, var(--soleil) 55%, black 30%);}
.bloc-bonus .note-palier{margin:2px 0 10px;}
.paquet-cadeau{
  display:flex; flex-direction:column; align-items:center; gap:.7rem;
  width:100%; border:none; background:transparent; padding:1rem .5rem; cursor:pointer;
  min-height:44px; font-family:inherit;
}
.paquet-cadeau-boite{
  position:relative; width:5.6rem; height:4.6rem; border-radius:14px;
  background:linear-gradient(180deg, var(--corail), color-mix(in srgb, var(--corail) 70%, black 15%));
  border:3px solid color-mix(in srgb, var(--corail) 55%, black 20%);
  box-shadow:0 5px 0 color-mix(in srgb, var(--corail) 50%, black 25%);
  transition:transform .15s ease, box-shadow .15s ease;
}
.paquet-cadeau:active .paquet-cadeau-boite{transform:translateY(3px);}
.paquet-cadeau-ruban-v{position:absolute; left:50%; top:0; bottom:0; width:14px; margin-left:-7px; background:var(--soleil);}
.paquet-cadeau-ruban-h{position:absolute; top:50%; left:0; right:0; height:14px; margin-top:-7px; background:var(--soleil);}
.paquet-cadeau-noeud{position:absolute; left:50%; top:-1rem; transform:translateX(-50%); font-size:1.9rem; line-height:1;}
.paquet-cadeau-texte{font-weight:700; font-size:.88rem; text-align:center; color:color-mix(in srgb, var(--encre) 85%, white);}
@keyframes paquet-cadeau-pop{
  0%{transform:scale(1) rotate(0deg); opacity:1;}
  35%{transform:scale(1.18) rotate(-5deg); opacity:1;}
  100%{transform:scale(.25) rotate(10deg); opacity:0;}
}
.paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{animation:paquet-cadeau-pop .45s ease forwards;}
.paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-texte{opacity:0; transition:opacity .2s ease;}
@media (prefers-reduced-motion:reduce){
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{animation:none; opacity:0;}
}

/* ---------- Jeu ---------- */
#qText{
  font-size:1.08rem; font-weight:700; text-align:center; margin:6px 4px 2px;
  line-height:1.35; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
}
.sous-consigne{text-align:center; font-size:.85rem; color:var(--encre2); margin:2px 0 8px; line-height:1.35;}
.btn-voix{
  border:none; background:var(--carte); box-shadow:var(--ombre); border-radius:12px;
  min-width:40px; min-height:40px; font-size:1.05rem; cursor:pointer; font-family:inherit; padding:0 10px;
}
.btn-voix:active{transform:translateY(2px);}

/* Le plan : calque clair, trait de mine, rien de saturé. */
.plan{background:var(--calque); border:2px solid #D4DCE4; border-radius:var(--r); box-shadow:var(--ombre); padding:6px; margin-bottom:10px;}
.plan svg{display:block; width:100%; height:auto;}
.point-croix{stroke:var(--mine); stroke-width:2.6; stroke-linecap:round;}
.fig-trait{fill:none; stroke:var(--mine); stroke-width:2.6; stroke-linejoin:round;}
.fig-remplie{fill:rgba(90,107,125,.10); stroke:var(--mine); stroke-width:2.6; stroke-linejoin:round;}
.trace-fait{stroke:var(--menthe-t); stroke-width:3.2; stroke-linecap:round;}
.cible-tactile{fill:transparent; stroke:transparent; stroke-width:30; cursor:pointer;}
/* La cible tactile est large et invisible ; l’INDICE, lui, est petit et
   visible. Les deux sont distincts : une zone transparente ne s’offre pas,
   et un indice assez gros pour le doigt encombrerait la figure. */
.indice-cible{fill:none; stroke:var(--trait); stroke-width:1.7; stroke-dasharray:3.5 3.5; opacity:.6; pointer-events:none;}
.indice-cible.pris{opacity:0;}
.cible-tactile.sel{stroke:color-mix(in srgb, var(--mandarine) 55%, transparent);}
.repere{fill:rgba(29,51,84,.30); pointer-events:none;}
.sommet-actif{fill:none; stroke:var(--mandarine); stroke-width:3;}

/* L’INSTRUMENT — `touch-action:none` sur lui seul (cf. §19 en tête).
   Les enfants sont visés EXPLICITEMENT : `touch-action` ne s’hérite pas, et
   le sélecteur universel ci-dessus les remettrait sinon en `pan-y` — la
   poignée de rotation ferait alors défiler la page au lieu de tourner. */
/* Ancrage : le point sur lequel l’extrémité s’est plantée, et les points
   que le bord rencontre. Le premier est franc, le second discret — l’un dit
   « je tourne autour d’ici », l’autre « l’alignement est trouvé ». */
.halos-ancrage{pointer-events:none;}
.halo-ancre{fill:rgba(255,138,61,.30); stroke:var(--mandarine); stroke-width:3; vector-effect:non-scaling-stroke;}
.halo-bord{fill:rgba(46,196,166,.28); stroke:var(--menthe-t); stroke-width:2.6; vector-effect:non-scaling-stroke;}
.posable, .posable *{touch-action:none;}
.posable{cursor:grab;}
.posable.saisi{cursor:grabbing;}
.posable .corps{fill:rgba(120,140,160,.30); stroke:var(--trait); stroke-width:2.4;}
.posable .bord{stroke:var(--mine); stroke-width:3.4; stroke-linecap:round;}
.posable .poignee{fill:var(--mandarine); stroke:#fff; stroke-width:2.5;}
.posable .poignee-halo{fill:rgba(255,138,61,.20);}
.posable .poignee-fleche{fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round;}
.posable.aimante .bord{stroke:var(--menthe-t);}
/* Règle calée : ses poignées de rotation s’effacent, sinon elles invitent
   encore à un geste qui n’a plus d’effet. */
.posable.calee .poignee{display:none;}
.posable.exact .corps{fill:rgba(46,196,166,.22);}
.posable.exact .bord{stroke:var(--menthe-t);}

.barre-outils{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 10px;}
.outil{
  border:2.5px solid #C9D6E8; background:var(--carte); border-radius:12px;
  min-height:44px; padding:6px 12px; font-family:inherit; font-weight:700; font-size:.85rem;
  color:var(--encre); cursor:pointer; display:flex; align-items:center; gap:6px;
}
.outil.on{border-color:var(--mandarine); background:#FFF3E9;}
.outil svg{display:block; width:26px; height:22px;}

#answers{display:grid; grid-template-columns:1fr; gap:10px;}
#answers.duo{grid-template-columns:1fr 1fr;}
#answers.trio{grid-template-columns:1fr 1fr 1fr;}
#answers.pile{grid-template-columns:1fr;}
.rep{
  border:none; border-radius:16px; padding:13px 10px; font-family:inherit;
  font-size:1rem; font-weight:600; background:var(--carte); color:var(--encre);
  box-shadow:var(--ombre); cursor:pointer; min-height:44px; text-align:center;
}
.rep:active{transform:translateY(2px);}
.rep.ok{background:var(--menthe); color:#fff;}
.rep.ko{background:var(--corail); color:#fff; animation:shake .35s;}
.rep.dim{opacity:.5;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

#feedback{
  text-align:center; font-weight:700; margin-top:12px; min-height:2.4em;
  font-size:1rem; line-height:1.35; padding:0 6px;
}
#feedback.bon{color:var(--menthe-t);} #feedback.mauvais{color:var(--corail-t);}
#feedback.demi{color:#8A6D1F;}
/* CHARTE §18 : ce qu’il fallait faire reste en VERT, le rouge ne désigne
   jamais la bonne réponse. */
#feedback .correction-attendue{color:var(--menthe-t);}

#btnValider, #btnNext{
  display:none; margin:12px auto 0; border:none; border-radius:18px;
  padding:13px 34px; font-family:inherit; font-size:1.05rem; font-weight:700; color:#fff; cursor:pointer;
}
#btnValider{background:var(--menthe); box-shadow:0 4px 0 var(--menthe-t);}
#btnNext{background:var(--mandarine); box-shadow:0 4px 0 var(--mandarine-f);}
#btnValider:active, #btnNext:active{transform:translateY(3px);}

/* Fin */
#end{text-align:center; padding-top:8vh;}
#endStars{font-size:3.4rem; letter-spacing:8px; margin:10px 0;}
#endStars span{display:inline-block; animation:pop .5s backwards;}
#endStars span:nth-child(2){animation-delay:.25s;} #endStars span:nth-child(3){animation-delay:.5s;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
#endMsg{font-size:1.3rem; font-weight:700;}
#endScore{color:var(--encre2); margin:6px 0 22px;}
#end .actions-fin{display:flex; gap:12px; justify-content:center;}
#end .actions-fin button{
  border:none; border-radius:18px; padding:13px 26px; font-family:inherit;
  font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:var(--ombre); min-height:44px;
}
#bRejouer{background:var(--mandarine); color:#fff; box-shadow:0 4px 0 var(--mandarine-f);}
#bMenu{background:var(--carte); color:var(--encre);}

/* Retour coquille (CHARTE §7) */
.barre-accueil{display:flex; margin:0 0 8px;}
.bouton-menu{
  min-height:44px; border-radius:14px; padding:0 14px; cursor:pointer; font-family:inherit;
  border:2px solid color-mix(in srgb, var(--encre) 25%, white);
  background:var(--carte); color:var(--encre); font-weight:600; font-size:.95rem;
  display:inline-flex; align-items:center; gap:6px;
}
.bouton-menu:active{transform:translateY(2px);}
.modale-fond{
  position:fixed; inset:0; z-index:1000; padding:1.2rem;
  background:color-mix(in srgb, var(--encre) 55%, transparent);
  display:flex; align-items:center; justify-content:center;
}
.modale-boite{
  background:var(--carte); border-radius:20px; padding:22px 18px; max-width:20rem; width:100%;
  text-align:center; box-shadow:0 12px 34px rgba(29,51,84,.3);
}
.modale-boite p{font-size:1.05rem; font-weight:600; margin:0 0 18px;}
.modale-boutons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.modale-boutons button{
  border:none; border-radius:16px; padding:12px 20px; font-family:inherit;
  font-size:1rem; font-weight:700; cursor:pointer; min-height:44px;
}
.modale-boutons .m-rester{background:var(--carte); color:var(--encre); border:2px solid var(--encre);}
.modale-boutons .m-revenir{background:var(--mandarine); color:#fff;}

#confettis-conteneur{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
.confetti{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
  animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards;}
@keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
@media (prefers-reduced-motion:reduce){ .confetti{display:none; animation:none;} }

[hidden]{display:none !important;}
@media (prefers-color-scheme: dark){
  html, body{background:var(--ciel) !important; color:var(--encre) !important;}
  .card, .rep, .plan, .outil, #btnBack, .puce-palier, .btn-voix{background:var(--carte) !important; color:var(--encre) !important;}
  .plan{background:var(--calque) !important;}
  .puce-palier.actif{background:var(--mandarine) !important; color:#fff !important;}
  .rep.ok{background:var(--menthe) !important; color:#fff !important;}
  .rep.ko{background:var(--corail) !important; color:#fff !important;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div id="confettis-conteneur" aria-hidden="true"></div>
<div class="modale-fond" id="modale-menu" hidden>
  <div class="modale-boite" role="dialog" aria-modal="true" aria-labelledby="modale-menu-texte">
    <p id="modale-menu-texte">Revenir au menu principal ? Ta partie en cours sera perdue.</p>
    <div class="modale-boutons">
      <button type="button" class="m-rester" id="modale-menu-rester">Rester</button>
      <button type="button" class="m-revenir" id="modale-menu-revenir">Revenir au menu</button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <button id="btnBack" hidden aria-label="Retour">←</button>
    <div id="hdrTitle">L’atelier de contrôle</div>
    <div id="dots"></div>
  </header>
  <main>
    <section id="home">
      <div class="barre-accueil"><button type="button" class="bouton-menu" id="bouton-menu">← Menu</button></div>
      <h1>L’atelier de contrôle</h1>
      <p class="sub" id="sous-titre-accueil"></p>
      <div class="rangee-paliers" id="rangee-paliers"></div>
      <p class="note-palier" id="note-palier"></p>
      <div class="cards" id="grille-jeux"></div>
      <div class="bloc-bonus" id="bloc-bonus" hidden>
        <h3>Palier bonus 🎁</h3>
        <p class="note-palier" id="note-bonus"></p>
        <button type="button" class="paquet-cadeau" id="paquet-cadeau" hidden>
          <span class="paquet-cadeau-boite">
            <span class="paquet-cadeau-ruban-v"></span><span class="paquet-cadeau-ruban-h"></span>
            <span class="paquet-cadeau-noeud">🎀</span>
          </span>
          <span class="paquet-cadeau-texte">Touche le paquet pour découvrir ta récompense !</span>
        </button>
        <div class="cards" id="grille-bonus" hidden></div>
      </div>
    </section>

    <section id="game" hidden>
      <div id="qText"></div>
      <p class="sous-consigne" id="sousConsigne"></p>
      <div class="barre-outils" id="barreOutils" hidden></div>
      <div class="plan" id="plan"><svg id="scene" viewBox="0 0 400 300"></svg></div>
      <div id="answers"></div>
      <button id="btnValider" type="button">Vérifier ✓</button>
      <p id="feedback"></p>
      <button id="btnNext" type="button">Suivant ➜</button>
    </section>

    <section id="end" hidden>
      <div id="endStars"></div>
      <div id="endMsg"></div>
      <div id="endScore"></div>
      <div class="actions-fin">
        <button id="bRejouer">Rejouer</button>
        <button id="bMenu">Menu</button>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ============================================================
   CONSTANTES DE CALIBRAGE
   Les seuils qui font vivre le module sont NOMMÉS ici, pas dispersés :
   ce sont eux qu’il faudra retoucher après essai sur appareil.
   ============================================================ */
/* <<<< MOTEUR-COMPAS — copie de outils/moteur-compas.js, ne pas éditer ici */
const MoteurCompas = (function(){
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';

  /* L’UNITÉ VIRTUELLE, définie ici et nulle part ailleurs pour M35 et M38.
     Un rayon de 4 et un côté de 7 ont ainsi la même taille apparente d’un
     module à l’autre par construction, et non par vigilance. Elle n’affirme
     aucune grandeur réelle : voir SPEC-M38 §3. */
  const UNITE = 25;
  /* LES BRANCHES SONT PROPORTIONNÉES AUX OUVERTURES RÉELLEMENT DEMANDÉES.
     À neuf unités, elles restaient presque fermées pour un rayon de 2 à 4 :
     la charnière montait alors très haut — la hauteur du triangle isocèle
     vaut √(branche² − (r/2)²), donc elle croît quand l’ouverture diminue —
     et l’instrument débordait du plan par le haut, précisément le risque
     signalé au prototype. Cinq unités donnent un compas franchement ouvert
     sur toute la plage utile, sans jamais approcher son plafond. */
  const BRANCHE = 5 * UNITE;          // longueur fixe des branches
  const R_MAX = 2 * BRANCHE;          // ouverture maximale d’un compas réel
  const R_MIN = 8;
  const DUREE_TRACE = 1150;           // ms
  const AIMANT_POINTE = 12;           // px : accrochage de la pointe
  const AIMANT_RAYON = 6;             // px : accrochage du rayon à l’unité
  /* En deçà de cette ouverture, le compas n’est pas dessiné et son côté n’est
     pas fixé : quand la mine est à quelques pixels de la pointe, incliner le
     doigt de deux pixels fait tourner la direction de vingt degrés, et une
     charnière située à 126 px balaye alors tout l’écran. Un compas fermé n’a
     de toute façon pas d’orientation. On ne montre donc que la pointe plantée
     et le rayon qui s’étire. */
  const OUVERTURE_FRANCHE = 20;
  const R_LOUPE = 42;                 // rayon de la loupe, en unités de viewBox
  const GROSSISSEMENT = 2;
  /* Décalage par défaut. Il doit être PLUS GRAND quand l’objet observé porte
     des inscriptions à lire : sur une règle graduée, une loupe trop proche
     recouvre les chiffres qu’elle est censée dégager — d’où `spec.ecartLoupe`. */
  const ECART_LOUPE = 62;
  let compteurMonde = 0;              // les identifiants doivent rester uniques

  const hyp = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const bride = (v, a, b) => Math.max(a, Math.min(b, v));
  function reduitMouvement(){
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  /* Le style du compas voyage avec le moteur : une copie n’a rien à ajouter
     dans la feuille de style de son hôte. */
  const CSS = `
.compas{pointer-events:none;}
.compas .branche{stroke:#33404F; stroke-width:5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.compas .charniere{fill:#33404F; stroke:#fff; stroke-width:2; vector-effect:non-scaling-stroke;}
.compas .pointe-fermee{fill:#33404F; stroke:#fff; stroke-width:2; vector-effect:non-scaling-stroke;}
.compas .pointe{fill:none; stroke:#33404F; stroke-width:3; stroke-linejoin:round; vector-effect:non-scaling-stroke;}
.compas .mine{fill:#FF8A3D; stroke:#33404F; stroke-width:2; vector-effect:non-scaling-stroke;}
.compas.verrouille .branche{stroke:#7C8B9C;}
.compas.verrouille .charniere{fill:#7C8B9C;}
.compas-rayon{fill:none; stroke:#FF8A3D; stroke-width:2.4; stroke-dasharray:6 5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.compas-cercle{fill:none; stroke:#0B8A70; stroke-width:3.2; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.compas-cercle.attendu{stroke-dasharray:8 6;}
/* Le cercle que l’enfant a tracé, quand il ne convient pas. Le rouge marque
   SA production, jamais la bonne réponse — laquelle reste en vert (§18). */
.compas-cercle.faux{stroke:#FF5D5D;}
.compas-etiquette{font-size:14px; font-weight:700; fill:#1D3354; paint-order:stroke; stroke:#fff; stroke-width:4;}
.compas-etiquette.grise{fill:#7C8B9C;}
.compas-invite{font-size:13px; fill:#41577A; opacity:.85;}
.compas-zone{touch-action:none;}
/* LA LOUPE. Au moment précis où l’enfant plante la pointe, son doigt couvre
   l’endroit qu’il vise : il pose à l’aveugle. La loupe montre, décalée
   au-dessus du doigt, ce qui se trouve dessous — agrandi deux fois, avec une
   croix sur le point exact où la pointe tombera. Elle ne capte aucun
   évènement : c’est une fenêtre, pas un objet. */
.compas-loupe{pointer-events:none;}
.compas-loupe .verre-loupe{fill:#fff;}
.compas-loupe .cercle-loupe{fill:none; stroke:#33404F; stroke-width:2.5; vector-effect:non-scaling-stroke;}
/* La croix est DOUBLÉE d’un halo blanc : en orange seul elle disparaissait
   sur le point orange qu’elle est censée désigner. Même correction que le
   marqueur d’angle de M34 — une marque doit se lire sur ce qu’elle marque. */
.compas-loupe .croix-halo{stroke:#fff; stroke-width:5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.compas-loupe .croix-loupe{stroke:#12233C; stroke-width:2; stroke-linecap:round; vector-effect:non-scaling-stroke;}
@media (prefers-reduced-motion:reduce){ .compas, .compas-cercle{transition:none !important;} }
`;
  function poserStyle(){
    if (document.getElementById('style-moteur-compas')) return;
    const s = document.createElement('style');
    s.id = 'style-moteur-compas';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ------------------------------------------------------------------
     creerCompas(svg, spec)
       spec.zone         {x0,y0,x1,y1} où la pointe peut se planter
       spec.branche      longueur des branches (défaut : BRANCHE)
       spec.aimants      [[x,y]…] points d’accrochage de la POINTE
       spec.aimantsMine  [[x,y]…] points d’accrochage de la MINE
       spec.guide        {c, r} : la pointe se pose SUR ce cercle
       spec.rayonMax     plafond d’ouverture propre au mini-jeu
       spec.pointeLibre  false → la pointe REFUSE de se planter ailleurs
       spec.rayonAimante true → le rayon s’accroche à l’unité entière (fenêtre)
       spec.rayonCrante  true → le rayon EST toujours un nombre entier d’unités
       spec.ecartLoupe   de combien la loupe se décale du doigt (défaut : 62)
       spec.arc          angle (rad) : trace un ARC et non un tour complet
       spec.loupe        false → pas de loupe sous le doigt (défaut : true)
       spec.surPointe    ()            pointe plantée
       spec.surApercu    ({centre,r})  pendant le glissement
       spec.surTrace     ({centre,r})  après l’animation
       spec.surReglage   ({r})         RÈGLE l’écartement au lieu de tracer
     `surReglage` renverse l’ordre du geste, et c’est toute la différence du
     CE2 : tant que l’écartement n’est pas verrouillé, relâcher le RÈGLE et le
     fige ; une fois réglé, relâcher TRACE. Au CE1 le rayon est dérivé d’un
     point de passage, au CE2 il est mesuré d’abord — voir SPEC-M35 §2.
     Le moteur ne juge JAMAIS : il trace et rend compte. C’est le mini-jeu
     qui décide si le cercle est juste, comme `creerPosable` ne décide pas
     d’un alignement.
     ------------------------------------------------------------------ */
  function creerCompas(svg, spec){
    poserStyle();
    const o = Object.assign({
      branche: BRANCHE, aimants: [], aimantsMine: [], guide: null, rayonMax: 0,
      pointeLibre: true,
      rayonAimante: false, rayonCrante: false, zone: null, etiquette: true,
      loupe: true, ecartLoupe: ECART_LOUPE
    }, spec || {});

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'compas');
    const gTrace = document.createElementNS(NS, 'g');   // les cercles déjà tracés
    let derniereTrace = null;
    const gApercu = document.createElementNS(NS, 'g');  // rayon pointillé, étiquette

    /* LE MONDE, pour que la loupe ait quelque chose à agrandir. Elle montre un
       `<use>` de ce groupe : la figure de la manche ET les cercles déjà
       tracés, mais NI le compas NI la loupe elle-même — l’instrument dans sa
       propre loupe encombrerait la vue qu’on cherche justement à dégager, et
       une loupe qui se contient elle-même boucle. Les enfants existants du
       SVG y sont déplacés au montage et remis en place à la destruction : le
       jeu hôte retrouve son DOM exactement tel qu’il l’avait laissé. */
    const gMonde = document.createElementNS(NS, 'g');
    gMonde.setAttribute('class', 'compas-monde');
    const idMonde = 'compas-monde-' + (++compteurMonde);
    gMonde.id = idMonde;
    const enfantsHote = [];
    while (svg.firstChild) { enfantsHote.push(svg.firstChild); gMonde.appendChild(svg.firstChild); }
    svg.appendChild(gMonde);
    gMonde.appendChild(gTrace);
    svg.appendChild(gApercu); svg.appendChild(g);

    /* La loupe est TOUJOURS montée ; `loupe` n’autorise que son apparition, et
       peut donc changer en cours de manche. Elle aide quand le doigt cache la
       cible, elle NUIT quand il faut lire des chiffres : sur une règle
       graduée, elle recouvrirait précisément les graduations qu’on vise. */
    const gLoupe = document.createElementNS(NS, 'g');
    gLoupe.setAttribute('class', 'compas-loupe');
    gLoupe.setAttribute('display', 'none');
    {
      const idClip = 'clip-loupe-' + compteurMonde;
      gLoupe.innerHTML =
          `<defs><clipPath id="${idClip}"><circle cx="0" cy="0" r="${R_LOUPE}"/></clipPath></defs>`
        + `<circle class="verre-loupe" cx="0" cy="0" r="${R_LOUPE}"/>`
        + `<g clip-path="url(#${idClip})"><use href="#${idMonde}"/></g>`
        + `<line class="croix-halo" x1="-10" y1="0" x2="10" y2="0"/>`
        + `<line class="croix-halo" x1="0" y1="-10" x2="0" y2="10"/>`
        + `<line class="croix-loupe" x1="-10" y1="0" x2="10" y2="0"/>`
        + `<line class="croix-loupe" x1="0" y1="-10" x2="0" y2="10"/>`
        + `<circle class="cercle-loupe" cx="0" cy="0" r="${R_LOUPE}"/>`;
      svg.appendChild(gLoupe);
    }
    svg.classList.add('compas-zone');

    /* LA CONVERSION ÉCRAN → SVG, UNE FOIS PAR GESTE. `getScreenCTM()` lit la
       géométrie de la page, que le dessin précédent vient d’invalider : appelée
       à chaque `pointermove`, elle imposait un recalcul de mise en page forcé
       par mouvement, écriture / lecture / écriture — le motif qui fait traîner
       un glissement. La matrice ne peut pas bouger pendant le geste : le doigt
       est capturé et la zone est en `touch-action:none`, donc rien ne défile ni
       ne se redimensionne. On la lit donc au `pointerdown` et on garde son
       inverse. */
    const ptSVG = svg.createSVGPoint();
    let inv = null;
    function relireRepere(){ const m = svg.getScreenCTM(); inv = m ? m.inverse() : null; }
    function versSVG(clientX, clientY){
      if (!inv) relireRepere();
      if (!inv) return [clientX, clientY];
      ptSVG.x = clientX; ptSVG.y = clientY;
      const q = ptSVG.matrixTransform(inv);
      return [q.x, q.y];
    }

    let centre = null, r = 0, angleMine = 0;
    let verrouille = false, phase = 'repos', cote = null, anim = null, detruit = false;
    /* `bloque` gèle le geste sans effacer le dessin : après validation, un
       cercle validé est validé (CHARTE §18, pas d’essai-erreur sur place). */
    let bloque = false;

    /* Le plafond peut être RESSERRÉ par le mini-jeu : une construction dont
       la figure entière dépend du premier rayon doit pouvoir le borner, plutôt
       que de recadrer après coup ce que l’enfant a tracé. */
    const rMax = () => Math.min(R_MAX, 2 * o.branche, o.rayonMax || Infinity);
    const etat = () => ({centre: centre ? centre.slice() : null, r, verrouille, phase});

    /* --- Le côté de la charnière : choisi une fois, gardé (cf. en-tête) --- */
    function normales(u){ return [[-u[1], u[0]], [u[1], -u[0]]]; }
    function choisirCote(u, d){
      if (cote !== null) return;              // déjà fixé pour ce geste
      if (d < OUVERTURE_FRANCHE) return;      // direction encore trop instable
      const n = normales(u);
      cote = n[0][1] <= n[1][1] ? 0 : 1;      // celle qui pointe le plus haut
    }
    function charniere(c, m){
      const d = hyp(c, m) || 1e-6;
      const u = [(m[0] - c[0]) / d, (m[1] - c[1]) / d];
      choisirCote(u, d);
      if (cote === null) cote = normales(u)[0][1] <= normales(u)[1][1] ? 0 : 1;
      const n = normales(u)[cote];
      /* On borne AVANT la racine : au-delà de 2·branche elle serait négative
         et la charnière deviendrait NaN — le compas s’évanouissait. */
      const demi = Math.min(d, rMax()) / 2;
      const h = Math.sqrt(Math.max(0, o.branche * o.branche - demi * demi));
      return [(c[0] + m[0]) / 2 + n[0] * h, (c[1] + m[1]) / 2 + n[1] * h];
    }
    const positionMine = () => centre
      ? [centre[0] + Math.cos(angleMine) * r, centre[1] + Math.sin(angleMine) * r] : null;

    /* --- Les nœuds du compas, créés UNE SEULE FOIS ------------------------
       Réécrire `innerHTML` à chaque `pointermove` faisait analyser cinq
       fragments de SVG et reconstruire cinq nœuds par mouvement, là où seules
       six coordonnées changent. Les éléments sont donc permanents et le dessin
       ne fait plus que poser des attributs ; ce qui n’a pas lieu d’être visible
       est masqué, jamais détruit. */
    function creer(tag, classe, parent){
      const e = document.createElementNS(NS, tag);
      e.setAttribute('class', classe);
      parent.appendChild(e);
      return e;
    }
    const elFermee   = creer('circle', 'pointe-fermee', g);
    const elBrancheP = creer('path', 'branche', g);
    const elBrancheM = creer('path', 'branche', g);
    const elPointe   = creer('path', 'pointe', g);
    const elCharn    = creer('circle', 'charniere', g);
    const elMine     = creer('circle', 'mine', g);
    const OUVERT     = [elBrancheP, elBrancheM, elPointe, elCharn, elMine];
    const elRayon    = creer('path', 'compas-rayon', gApercu);
    const elEtiq     = creer('text', 'compas-etiquette', gApercu);
    elFermee.setAttribute('r', 5);
    elCharn.setAttribute('r', 7);
    elMine.setAttribute('r', 5);
    /* `display:none` sort l’élément du rendu, contrairement à `visibility` :
       un compas fermé ne coûte alors rien du tout. */
    const montrer = (e, oui) => e.setAttribute('display', oui ? 'inline' : 'none');
    const pose = (e, k, v) => e.setAttribute(k, v.toFixed(1));

    /* --- Dessin, entièrement déduit de l’état --- */
    function dessiner(){
      if (detruit) return;
      if (!centre) {
        montrer(elFermee, false); OUVERT.forEach(e => montrer(e, false));
        return;
      }
      if (r < OUVERTURE_FRANCHE) {
        /* Pointe plantée, compas encore fermé : on ne montre que la pointe. */
        g.style.opacity = '1';
        pose(elFermee, 'cx', centre[0]); pose(elFermee, 'cy', centre[1]);
        montrer(elFermee, true); OUVERT.forEach(e => montrer(e, false));
        return;
      }
      /* L’instrument se révèle en fondu sur les vingt-cinq pixels suivants :
         apparaître d’un coup avec une charnière à 126 px ferait un saut. */
      g.style.opacity = String(Math.min(1, (r - OUVERTURE_FRANCHE) / 25));
      montrer(elFermee, false); OUVERT.forEach(e => montrer(e, true));
      const m = positionMine();
      const ch = charniere(centre, m);
      const seg = (a, b) => `M ${a[0].toFixed(1)} ${a[1].toFixed(1)} L ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
      /* La pointe sèche : un petit V. La mine : une pastille. */
      const dirP = [(centre[0] - ch[0]), (centre[1] - ch[1])];
      const lp = Math.hypot(dirP[0], dirP[1]) || 1;
      const perp = [-dirP[1] / lp, dirP[0] / lp];
      const base = [centre[0] - dirP[0] / lp * 11, centre[1] - dirP[1] / lp * 11];
      elBrancheP.setAttribute('d', seg(ch, centre));
      elBrancheM.setAttribute('d', seg(ch, m));
      elPointe.setAttribute('d',
          `M ${(base[0] + perp[0] * 5).toFixed(1)} ${(base[1] + perp[1] * 5).toFixed(1)}`
        + ` L ${centre[0].toFixed(1)} ${centre[1].toFixed(1)}`
        + ` L ${(base[0] - perp[0] * 5).toFixed(1)} ${(base[1] - perp[1] * 5).toFixed(1)}`);
      pose(elCharn, 'cx', ch[0]); pose(elCharn, 'cy', ch[1]);
      pose(elMine, 'cx', m[0]);   pose(elMine, 'cy', m[1]);
      g.classList.toggle('verrouille', verrouille);
    }
    function dessinerApercu(){
      if (detruit) return;
      if (!centre) { montrer(elRayon, false); montrer(elEtiq, false); return; }
      const m = positionMine();
      elRayon.setAttribute('d',
        `M ${centre[0].toFixed(1)} ${centre[1].toFixed(1)} L ${m[0].toFixed(1)} ${m[1].toFixed(1)}`);
      montrer(elRayon, true);
      if (!o.etiquette) { montrer(elEtiq, false); return; }
      const t = (r / UNITE);
      elEtiq.textContent = (Math.abs(t - Math.round(t)) < 0.02 ? String(Math.round(t)) : t.toFixed(1))
        + (r >= rMax() - 0.5 ? ' — grand ouvert' : '');
      elEtiq.setAttribute('class', 'compas-etiquette' + (verrouille ? ' grise' : ''));
      pose(elEtiq, 'x', centre[0] + 12); pose(elEtiq, 'y', centre[1] - 12);
      montrer(elEtiq, true);
    }

    /* La loupe se place AU-DESSUS du doigt, et passe dessous quand le doigt
       approche du haut du plan : une loupe à moitié hors du cadre ne montre
       plus rien. Le décalage la sort de sous la main sans l’éloigner du
       geste. Le contenu est recentré sur le point observé puis agrandi. */
    function majLoupe(p){
      if (!o.loupe || !p) return;
      const vb = svg.viewBox && svg.viewBox.baseVal;
      const haut = vb && vb.height ? vb.y : 0;
      const bas = vb && vb.height ? vb.y + vb.height : 400;
      const gauche = vb && vb.width ? vb.x : 0;
      const droite = vb && vb.width ? vb.x + vb.width : 400;
      const marge = R_LOUPE + 4;
      const ecart = o.ecartLoupe;
      const dessus = p[1] - ecart >= haut + marge;
      const ly = bride(dessus ? p[1] - ecart : p[1] + ecart, haut + marge, bas - marge);
      const lx = bride(p[0], gauche + marge, droite - marge);
      gLoupe.setAttribute('transform', `translate(${lx.toFixed(1)},${ly.toFixed(1)})`);
      const u = gLoupe.querySelector('use');
      if (u) u.setAttribute('transform',
        `scale(${GROSSISSEMENT}) translate(${(-p[0]).toFixed(2)},${(-p[1]).toFixed(2)})`);
      gLoupe.setAttribute('display', 'inline');
    }
    const cacherLoupe = () => { if (o.loupe) gLoupe.setAttribute('display', 'none'); };

    /* UN DESSIN PAR IMAGE, PAS UN PAR ÉVÉNEMENT. Un écran tactile envoie
       jusqu’à 120 `pointermove` par seconde là où l’écran n’en affiche que 60 :
       dessiner à chaque événement, c’est jeter la moitié du travail et prendre
       du retard sur le doigt. L’ÉTAT reste mis à jour immédiatement — `etat()`
       ne ment jamais — seul le rendu est reporté à la prochaine image. */
    let demande = 0;
    function planifier(){
      if (demande || detruit) return;
      demande = requestAnimationFrame(() => { demande = 0; dessiner(); dessinerApercu(); });
    }
    function rafraichir(){
      if (demande) { cancelAnimationFrame(demande); demande = 0; }
      dessiner(); dessinerApercu();
    }
    /* Les nœuds naissent sans coordonnées : sans ce premier passage, la pointe
       fermée s’afficherait à l’origine du plan avant le moindre geste. */
    rafraichir();

    /* --- Le tracé : la mine parcourt le cercle, le compas tourne avec --- */
    function tracer(fini){
      phase = 'trace';
      const depart = angleMine;
      const cercle = document.createElementNS(NS, 'path');
      cercle.setAttribute('class', 'compas-cercle');
      gTrace.appendChild(cercle);
      derniereTrace = cercle;
      /* UN ARC OU UN TOUR COMPLET. Reporter une longueur, on ne fait pas le
         tour : on donne un coup d’arc là où la comparaison se lit. Deux
         cercles entiers superposés encombrent le plan et noient précisément
         ce qu’on demande de regarder. L’arc est CENTRÉ sur la direction où la
         mine se trouvait au relâchement — c’est le prolongement du geste, pas
         un secteur arbitraire. */
      const etendue = o.arc || Math.PI * 2;
      const a0 = o.arc ? depart - o.arc / 2 : depart;
      const arc = (t) => {
        if (!o.arc && t >= 0.9995) return `M ${(centre[0] + r).toFixed(2)} ${centre[1].toFixed(2)}`
          + ` A ${r.toFixed(2)} ${r.toFixed(2)} 0 1 1 ${(centre[0] - r).toFixed(2)} ${centre[1].toFixed(2)}`
          + ` A ${r.toFixed(2)} ${r.toFixed(2)} 0 1 1 ${(centre[0] + r).toFixed(2)} ${centre[1].toFixed(2)}`;
        const a1 = a0 + t * etendue;
        return `M ${(centre[0] + Math.cos(a0) * r).toFixed(2)} ${(centre[1] + Math.sin(a0) * r).toFixed(2)}`
          + ` A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${t * etendue > Math.PI ? 1 : 0} 1`
          + ` ${(centre[0] + Math.cos(a1) * r).toFixed(2)} ${(centre[1] + Math.sin(a1) * r).toFixed(2)}`;
      };
      const achever = () => {
        cercle.setAttribute('d', arc(1));
        angleMine = depart;
        phase = 'pose';
        rafraichir();
        if (o.surTrace) o.surTrace({centre: centre.slice(), r});
      };
      /* §19 accessibilité : sans animation, le cercle apparaît d’un trait. */
      if (reduitMouvement()) { achever(); return; }
      const t0 = performance.now();
      /* L’ADOUCISSEMENT DU PROTOTYPE. La mine part doucement, prend de la
         vitesse, puis ralentit en arrivant — un tracé à vitesse constante
         démarre et s’arrête sec, ce qui se remarque sur un geste d’une
         seconde. C’est l’animation qui a été jugée sur appareil ; le moteur
         la reprend telle quelle plutôt qu’une approximation linéaire. */
      const adoucir = (k) => k < .5 ? 2*k*k : -1 + (4 - 2*k)*k;
      const pas = (maintenant) => {
        if (detruit || !cercle.isConnected) return;
        const t = adoucir(bride((maintenant - t0) / DUREE_TRACE, 0, 1));
        cercle.setAttribute('d', arc(t));
        angleMine = a0 + t * etendue;
        dessiner();
        /* On teste le temps ÉCOULÉ, pas la valeur adoucie : `adoucir(1)` vaut
           bien 1, mais s’arrêter sur la courbe plutôt que sur l’horloge
           inviterait une erreur d’arrondi à retenir l’animation. */
        if (maintenant - t0 < DUREE_TRACE) anim = requestAnimationFrame(pas);
        else { anim = null; achever(); }
      };
      anim = requestAnimationFrame(pas);
    }

    /* --- Le geste --- */
    function dansZone(p){
      if (!o.zone) return true;
      return p[0] >= o.zone.x0 && p[0] <= o.zone.x1 && p[1] >= o.zone.y0 && p[1] <= o.zone.y1;
    }
    function accrocherPointe(p){
      let meilleur = null, d0 = AIMANT_POINTE;
      o.aimants.forEach(a => { const d = hyp(p, a); if (d < d0) { d0 = d; meilleur = a; } });

  /* UNE POIGNÉE HORS DU PLAN N’EXISTE PLUS. Le SVG découpe ce qui dépasse de
     sa viewBox : une poignée sortie du cadre est invisible ET intouchable —
     l’appui y est reçu par le fond de page, pas par l’instrument. Les poignées
     de la règle pendent 46 px sous son bord, si bien qu’une règle posée dans
     le bas du plan naissait déjà hors d’atteinte : une sur treize au démarrage
     de « L’expertise », mesuré en demandant au navigateur qui recevait l’appui.

     BRIDER LA POSITION DE L’INSTRUMENT NE MARCHE PAS, et le mesurer l’a montré
     net : exiger que les deux poignées restent dans le cadre enferme le centre
     d’une règle de 330 dans une bande de 100 px, et 82 ancrages sur 117
     devenaient impossibles là où le code d’avant n’en ratait que 3. Une règle
     de 330 dans un plan de 400 DOIT pouvoir dépasser — c’est ce que fait une
     vraie règle sur une vraie feuille.

     C’est donc la POIGNÉE qui glisse, pas l’instrument : elle remonte le long
     de son propre bras, vers son pivot, juste assez pour rentrer dans le
     cadre. Elle reste sur l’instrument, visible et saisissable, et le pivot ne
     bouge pas d’un pixel — la rotation obtenue est exactement la même. */
  function poseePoignee(po){
    const q0 = ancrages[po.pivot] || [0, 0];        // le pivot, en local
    if (!plan) return po.p;
    const A = versScene(q0), B = versScene(po.p);
    /* La scène est une image affine du local : « rester dans le cadre » est
       donc un encadrement LINÉAIRE de t, qui se résout sans tâtonner. Les deux
       bornes comptent, pas seulement celle vers laquelle on avance : quand le
       pivot lui-même est déjà sorti du cadre — ce qu’une rotation peut très
       bien produire — c’est la borne franchie EN ARRIÈRE qui commande. */
    let lo = 0, hi = 1, possible = true;
    const borne = (a, b, min, max) => {
      const d = b - a;
      if (Math.abs(d) < 1e-9) { if (a < min || a > max) possible = false; return; }
      const t1 = (min - a) / d, t2 = (max - a) / d;
      lo = Math.max(lo, Math.min(t1, t2));
      hi = Math.min(hi, Math.max(t1, t2));
    };
    borne(A[0], B[0], plan.x0 + MARGE_POIGNEE, plan.x1 - MARGE_POIGNEE);
    borne(A[1], B[1], plan.y0 + MARGE_POIGNEE, plan.y1 - MARGE_POIGNEE);
    /* On prend le t le plus grand qui convienne : la poignée reste aussi près
       que possible de sa place naturelle. Si aucun point du bras ne rentre,
       l’instrument est de toute façon hors du plan — on garde l’idéal. */
    const t = (possible && hi >= lo && hi >= 0) ? Math.min(hi, 1) : 1;
    return [q0[0] + (po.p[0] - q0[0]) * t, q0[1] + (po.p[1] - q0[1]) * t];
  }
  /* AIMANTATION EN DEUX TEMPS (B4). Le coin s’ancre d’abord sur le sommet ;
     ENSUITE, pendant la rotation, le bord de l’instrument se cale sur l’un ou
     l’autre des côtés de la figure. Deux gestes distincts, dans cet ordre —
     c’est ce que décrit la consigne, et c’était le seul des deux qui manquait.

     CE QUI EST AIMANTÉ, ET CE QUI NE L’EST SURTOUT PAS. Seul le bord de
     RÉFÉRENCE de l’instrument — celui qui joint ses deux ancrages — se cale,
     et seulement sur les côtés RÉELS de la figure. Le second bras, lui, n’est
     jamais aidé : c’est l’écart entre lui et l’autre côté qui EST la réponse.
     Le caler reviendrait à répondre à la place de l’enfant. L’aimant aide donc
     à poser, jamais à conclure — et par construction, pas par réglage.

     La règle, elle, ne reçoit jamais de directions : accrocher son angle
     trancherait l’alignement à sa place (même raison, cf. A1). C’est pour cela
     que `directionsAimant` est fourni par l’appelant et non déduit ici. */
  const directions = spec.directionsAimant || [];
  const AIMANT_ANGLE = radians(5);   // à recalibrer sur appareil : aider, pas conclure
  function aimanterAngle(ang){
    if (!directions.length) return ang;
    let meilleur = ang, e0 = AIMANT_ANGLE;
    directions.forEach(d => {
      /* Écart ramené dans ]−π, π] : à 359° d’un côté et 1° de l’autre, on est
         à 2° l’un de l’autre, pas à 358°. */
      const e = Math.abs(Math.atan2(Math.sin(d - ang), Math.cos(d - ang)));
      if (e < e0) { e0 = e; meilleur = d; }
    });
    return meilleur;
  }

  function ancrer(){
    ancreCourante = null;
    let meilleur = null, d0 = AIMANT_PX;
    ancrages.forEach(q => {
      const s = versScene(q);
      points.forEach((p, i) => {
        const d = Math.hypot(p[0] - s[0], p[1] - s[1]);
        if (d < d0) { d0 = d; meilleur = {dx:p[0] - s[0], dy:p[1] - s[1], i}; }
      });
    });
    if (!meilleur) return false;
    x += meilleur.dx; y += meilleur.dy; ancreCourante = meilleur.i;
    return true;
  }
  function dessinerHalos(){
    const bord = pointsSurBord();
    gHalos.innerHTML = points.map((p, i) => {
      const cl = i === ancreCourante ? 'halo-ancre' : (bord.indexOf(i) >= 0 ? 'halo-bord' : null);
      return cl ? `<circle class="${cl}" cx="${p[0]}" cy="${p[1]}" r="13"/>` : '';
    }).join('');
  }
  function appliquer(){
    g.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${degres(a).toFixed(2)})`);
    g.classList.toggle('aimante', ancreCourante !== null);
    poignees.forEach((po, i) => {
      const q = poseePoignee(po);
      gPoignees[i].setAttribute('transform', `translate(${q[0].toFixed(2)},${q[1].toFixed(2)})`);
    });
    dessinerHalos();
    /* Le groupe est passé en second : `appliquer()` s’exécute une première
       fois AVANT que l’appelant n’ait pu ranger le posable dans
       `posableCourant`, qui vaut alors encore null. */
    if (spec.surChangement) spec.surChangement(etat(), g);
  }

  let mode = null, depart = null;
  const surDown = (e) => {
    if (g.dataset.verrouille === '1') return;
    const p = versSVG(svg, e.clientX, e.clientY);
    const cl = e.target.getAttribute('class') || '';
    const idx = /^poignee/.test(cl) ? +e.target.dataset.poignee : -1;
    if (idx >= 0) {
      /* Rotation AUTOUR DE L’AUTRE EXTRÉMITÉ : c’est elle le pivot, et si
         elle est ancrée sur un point, la règle tourne autour du point. */
      const po = poignees[idx];
      const local = ancrages[po.pivot] || [0, 0];
      const pivot = versScene(local);
      mode = 'rot';
      depart = {pivot, local,
        ecart: a - Math.atan2(p.y - pivot[1], p.x - pivot[0])};
    } else {
      mode = 'trans';
      depart = {dx: p.x - x, dy: p.y - y};
    }
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    g.classList.add('saisi');
    e.preventDefault();
  };
  const surMove = (e) => {
    if (!mode) return;
    /* FIGÉ ≠ VERROUILLÉ. Verrouillé, l’instrument ne répond plus du tout —
       c’est l’état de fin de manche. Figé, il ne se déplace plus mais reste
       tactile : c’est ce qu’il faut pour qu’un appui sur le bord soit un
       tracé et rien d’autre. */
    if (g.dataset.fige === '1') { e.preventDefault(); return; }
    const p = versSVG(svg, e.clientX, e.clientY);
    if (mode === 'trans') { x = p.x - depart.dx; y = p.y - depart.dy; ancrer(); }
    else {
      a = depart.ecart + Math.atan2(p.y - depart.pivot[1], p.x - depart.pivot[0]);
      /* Second temps : le bord se cale, mais SEULEMENT une fois le coin planté
         — hors ancrage, l’instrument tourne librement. */
      if (ancreCourante !== null) a = aimanterAngle(a);
      /* On recale l’origine pour que le pivot ne bouge pas d’un pixel. */
      const q = depart.local;
      x = depart.pivot[0] - (q[0]*Math.cos(a) - q[1]*Math.sin(a));
      y = depart.pivot[1] - (q[0]*Math.sin(a) + q[1]*Math.cos(a));
    }
    appliquer();
    e.preventDefault();
  };
  const surUp = (e) => {
    /* Un appui SANS déplacement sur le corps est un TOUCHER, pas un
       déplacement : c’est ainsi qu’on appuie sur le bord de la règle pour
       y poser un point. Relâcher l’instrument, en revanche, ne vaut jamais
       réponse. */
    if (mode === 'trans' && spec.surTap && depart) {
      const p = versSVG(svg, e.clientX, e.clientY);
      const bouge = Math.hypot(p.x - x - depart.dx, p.y - y - depart.dy);
      if (bouge < 6) spec.surTap([p.x, p.y], etat());
    }
    mode = null; g.classList.remove('saisi');
    try { g.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  g.addEventListener('pointerdown', surDown);
  g.addEventListener('pointermove', surMove);
  g.addEventListener('pointerup', surUp);
  g.addEventListener('pointercancel', surUp);

  appliquer();
  return {
    g, etat,
    /* Les points de la scène actuellement allumés : ancrage et bord. */
    ancre(){ return ancreCourante; },
    surBord(){ return pointsSurBord(); },
    verrouiller(){ g.dataset.verrouille = '1'; g.style.cursor = 'default'; },
    figer(){ g.dataset.fige = '1'; g.style.cursor = 'default'; g.classList.add('calee'); },
    /* Révélation différée (§18) : l’instrument rejoint tout seul la position
       exacte, pour montrer ce qu’il fallait voir. */
    placerExact(nx, ny, na){
      g.classList.add('exact');
      x = nx; y = ny; a = na;
      g.style.transition = 'none';
      appliquer();
    },
    detruire(){ gHalos.remove(); g.remove(); }
  };
}

/* Distance d’un point au SEGMENT, et non à la droite : au-delà de ses
   extrémités, la règle ne couvre plus rien. */
function distancePointSegment(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx*dx + dy*dy;
  if (L2 < 1e-9) return Math.hypot(p[0]-a[0], p[1]-a[1]);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - (a[0] + dx*t), p[1] - (a[1] + dy*t));
}

/* ---- Habillages des trois instruments (géométrie locale) ----
   Chaque habillage livre son CORPS et l’emplacement de sa POIGNÉE. Les deux
   vont ensemble : un instrument sans poignée ne peut être que translaté,
   donc jamais orienté — autant dire jamais posé. La poignée est toujours
   loin de l’origine (le point d’aimantation), pour que le geste « je tiens
   le coin et je fais pivoter » soit sûr même avec un doigt d’enfant. */

/* La règle : bord franc le long de l’axe local des x, corps translucide
   au-dessous — on lit l’alignement SUR le bord, jamais au milieu. */
const REGLE = (L) => ({
  corps: `<rect class="corps" x="${-L/2}" y="0" width="${L}" height="30" rx="4"/>`
       + `<line class="bord" x1="${-L/2}" y1="0" x2="${L/2}" y2="0"/>`,
  /* DEUX ancrages, DEUX poignées : chaque extrémité peut se planter sur un
     point, et tirer une poignée fait pivoter autour de l’autre extrémité. */
  ancrages: [[-L/2, 0], [L/2, 0]],
  poignees: [{p:[-L/2 + 30, 46], pivot:1}, {p:[L/2 - 30, 46], pivot:0}]
});
/* Le gabarit : un coin de carton, pas une équerre complète. On le pose dans
   le sommet ; le côté de la figure tombe visiblement dedans ou dehors. */
const GABARIT = (L) => ({
  corps: `<path class="corps" d="M 0 0 L ${L} 0 L ${L} ${L*0.34} L ${L*0.34} ${L*0.34} L ${L*0.34} ${L} L 0 ${L} Z"/>`
       + `<line class="bord" x1="0" y1="0" x2="${L}" y2="0"/>`
       + `<line class="bord" x1="0" y1="0" x2="0" y2="${L}"/>`,
  /* Le gabarit s’ancre par son COIN sur le sommet, puis pivote autour de lui. */
  ancrages: [[0, 0], [L, 0]],
  poignees: [{p:[L*0.80, L*0.17], pivot:0}]
});
/* L’équerre : même objet posable, habillage d’outil réel (CE2). */
const EQUERRE = (L) => ({
  corps: `<path class="corps" d="M 0 0 L ${L} 0 L 0 ${L} Z"/>`
       + `<line class="bord" x1="0" y1="0" x2="${L}" y2="0"/>`
       + `<line class="bord" x1="0" y1="0" x2="0" y2="${L}"/>`,
  ancrages: [[0, 0], [L, 0]],
  poignees: [{p:[L*0.36, L*0.36], pivot:0}]
});

/* ============================================================
   STOCKAGE (CHARTE §9, §11, §15)
   ============================================================ */
const CLE_STOCKAGE = 'mayeutik-m35-verifier-etoiles';
let memoireEtoiles = null;
function lireEtoiles(){
  if (memoireEtoiles === null) {
    memoireEtoiles = {};
    try { const b = localStorage.getItem(CLE_STOCKAGE); if (b) memoireEtoiles = JSON.parse(b); } catch(e){ memoireEtoiles = {}; }
  }
  return memoireEtoiles;
}
function enregistrerEtoiles(id, v){
  const t = lireEtoiles(); t[id] = Math.max(t[id] || 0, v); memoireEtoiles = t;
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(t)); } catch(e){}
}
/* Deux transitions (CP→CE1, CE1→CE2) : indicateur indexé par profil PUIS
   par palier cible. */
const CLE_BONUS_REVELE = 'mayeutik-m35-bonus-revele';
let memoireBonus = null;
function lireBonus(){
  if (memoireBonus === null) {
    memoireBonus = {};
    try { const b = localStorage.getItem(CLE_BONUS_REVELE); if (b) memoireBonus = JSON.parse(b); } catch(e){ memoireBonus = {}; }
  }
  return memoireBonus;
}
function bonusDejaRevele(pid, cible){
  const e = lireBonus()[pid];
  return !!(e && typeof e === 'object' && e[cible]);
}
function marquerBonusRevele(pid, cible){
  const t = lireBonus();
  if (!t[pid] || typeof t[pid] !== 'object') t[pid] = {};
  t[pid][cible] = true; memoireBonus = t;
  try { localStorage.setItem(CLE_BONUS_REVELE, JSON.stringify(t)); } catch(e){}
}
/* PRISE EN MAIN DES INSTRUMENTS (A2). Aucun instrument n’est explicable par
   une consigne seule : la règle, le gabarit, l’équerre et le compas se
   découvrent en les manipulant. À la PREMIÈRE rencontre de chacun, le
   mini-jeu s’ouvre donc sur une manche d’essai — pas de score, pas de bonne
   réponse, pas de pastille de progression — dont l’enfant sort quand il veut.
   L’indicateur est rangé par profil PUIS par instrument : sans quoi la manche
   se rejouerait à chaque session, et le petit rituel utile deviendrait un
   péage. Motif à remonter dans CHARTE.md s’il tient à l’usage, puisque M38
   réutilisera les mêmes instruments. */
const CLE_INSTRUMENTS_VUS = 'mayeutik-m35-instruments-vus';
let memoireInstruments = null;
function lireInstrumentsVus(){
  if (memoireInstruments === null) {
    memoireInstruments = {};
    try { const b = localStorage.getItem(CLE_INSTRUMENTS_VUS); if (b) memoireInstruments = JSON.parse(b); } catch(e){ memoireInstruments = {}; }
  }
  return memoireInstruments;
}
function instrumentDejaVu(pid, outil){
  const e = lireInstrumentsVus()[pid];
  return !!(e && typeof e === 'object' && e[outil]);
}
function marquerInstrumentVu(pid, outil){
  const t = lireInstrumentsVus();
  if (!t[pid] || typeof t[pid] !== 'object') t[pid] = {};
  t[pid][outil] = true; memoireInstruments = t;
  try { localStorage.setItem(CLE_INSTRUMENTS_VUS, JSON.stringify(t)); } catch(e){}
}
/* Quel instrument chaque mini-jeu met entre les mains. Un mini-jeu sans
   instrument n’a rien à faire découvrir. */
function instrumentDuMiniJeu(cfg){
  if (cfg.mode === 'alignement' || cfg.mode === 'tracer') return 'regle';
  if (cfg.mode === 'angles') return cfg.outil || 'gabarit';
  if (cfg.mode === 'anglesPoly') return 'equerre';
  if (cfg.mode === 'compas1' || cfg.mode === 'compas2') return 'compas';
  return null;
}

const CLE_PROFILS = 'mayeutik-profils', CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';
const ORDRE_PALIERS = ['CP','CE1','CE2'];
function lireProfilActifId(){ try { return localStorage.getItem(CLE_PROFIL_ACTIF) || 'p1'; } catch(e){ return 'p1'; } }
function niveauDuProfilActif(){
  try {
    const b = localStorage.getItem(CLE_PROFILS);
    if (!b) return null;
    const a = JSON.parse(b).find(p => p.id === lireProfilActifId());
    return (a && a.niveau) || null;
  } catch(e){ return null; }
}
function parametreURL(n){ try { return new URLSearchParams(location.search).get(n); } catch(e){ return null; } }
function palierDepuisURL(){
  const b = parametreURL('palier');
  if (!b) return null;
  const M = b.toUpperCase();
  return CONTENU.paliers[M] ? M : null;
}
function palierParDefaut(){
  const u = palierDepuisURL(); if (u) return u;
  const n = niveauDuProfilActif();
  if (n && CONTENU.paliers[n]) return n;
  return ORDRE_PALIERS.find(x => CONTENU.paliers[x]) || ORDRE_PALIERS[0];
}
const CLE_SESSIONS = 'mayeutik-sessions', MODULE_ID = 'M35', MAX_SESSIONS = 500;
let memoireSessions = null;
function lireSessions(){
  if (memoireSessions === null) {
    memoireSessions = [];
    try { const b = localStorage.getItem(CLE_SESSIONS); if (b) memoireSessions = JSON.parse(b); } catch(e){ memoireSessions = []; }
  }
  return memoireSessions;
}
function enregistrerSession(comp, score, total, duree){
  const pid = lireProfilActifId(), t = lireSessions();
  t.push({profilId:pid, module:MODULE_ID, competence:comp, score, total, date:new Date().toISOString(), duree});
  let n = 0;
  for (let i = t.length - 1; i >= 0; i--) if (t[i].profilId === pid) { n++; if (n > MAX_SESSIONS) t.splice(i, 1); }
  memoireSessions = t;
  try { localStorage.setItem(CLE_SESSIONS, JSON.stringify(t)); } catch(e){}
}
const SEUIL_MAITRISE = 0.8;
function palierMaitrise(nom){
  const p = CONTENU.paliers[nom];
  if (!p) return false;
  const pid = lireProfilActifId();
  const s = lireSessions().filter(x => x.profilId === pid && x.module === MODULE_ID);
  return p.miniJeux.every(mj => {
    const l = s.filter(x => x.competence === mj.id);
    if (!l.length) return false;
    const d = l[l.length - 1];
    return d.total > 0 && d.score / d.total >= SEUIL_MAITRISE;
  });
}
function palierSuivant(nom){
  const i = ORDRE_PALIERS.indexOf(nom);
  if (i === -1 || i === ORDRE_PALIERS.length - 1) return null;
  const s = ORDRE_PALIERS[i+1];
  return CONTENU.paliers[s] ? s : null;
}

/* ============================================================
   SONS (§5), CONFETTIS (§4), VOIX
   ============================================================ */
let actx = null;
function jouerNote(f, d, dur, vol, forme){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = forme || 'sine'; o.frequency.value = f;
    const t = actx.currentTime + d;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}

/* ============================================================
   FABRIQUE D’ITEMS
   ============================================================ */
/* Trois points, alignés ou non. Un item ALIGNÉ est toujours indécidable à
   l’œil — un alignement exact et un quasi-alignement se ressemblent trait
   pour trait ; c’est pourquoi l’instrument y est toujours requis. Un
   désalignement FRANC, lui, se voit : l’instrument y reste facultatif. */
function itemAlignement(evident, penteMax){
  const ya = entre(70, 210);
  /* `penteMax` borne l’inclinaison de la rangée. Sans elle, les deux points
     extrêmes tirés indépendamment donnent une rangée très oblique : le
     défaut du point du milieu se lit alors comme « celui-ci est plus bas »
     et non comme « celui-ci sort du rang ». */
  const yb = penteMax
    ? Math.max(70, Math.min(210, ya + entre(-penteMax, penteMax)))
    : entre(70, 210);
  const a = [entre(50, 110), ya];
  const b = [entre(290, 350), yb];
  const t = entre(0.42, 0.58);
  const surDroite = [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
  const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy);
  const nx = -dy/L, ny = dx/L;
  let ecart = 0, aligne = false;
  if (evident) {
    ecart = entre(...ECART_EVIDENT) * signeAleatoire();     // défaut visible
  } else if (Math.random() < 0.5) {
    aligne = true;                                          // vraiment alignés
  } else {
    ecart = entre(...ECART_INDECIDABLE) * signeAleatoire(); // indécidable
  }
  const c = [surDroite[0] + nx*ecart, surDroite[1] + ny*ecart];
  return {points:[a, c, b], aligne, ecart:Math.abs(ecart), evident:!!evident,
          /* Instrument requis dès que l’œil ne peut pas trancher. */
          requiert: !evident};
}

/* L’ÉTABLI : quatre pointes, trois sur une même droite et une seule à
   l’écart. C’est ce qui rend l’intruse unique — avec trois pointes dont une
   dévie, les trois sont non alignées entre elles et n’importe laquelle peut
   passer pour l’intruse. Le jugement « sont-elles alignées ? » n’a pas
   cette exigence : trois y suffisent. */
function itemEtabli(){
  const ya = entre(80, 200);
  const yb = Math.max(80, Math.min(200, ya + entre(-26, 26)));
  const A = [46, ya], B = [354, yb];
  const dx = B[0]-A[0], dy = B[1]-A[1], L = Math.hypot(dx, dy);
  const nx = -dy/L, ny = dx/L;
  const sur = (t) => [A[0] + dx*t, A[1] + dy*t];
  /* Quatre emplacements le long de la rangée, un seul dévié. */
  const ts = [0.06, 0.36, 0.66, 0.96];
  const k = Math.floor(Math.random() * 4);
  const ecart = entre(...ECART_EVIDENT) * signeAleatoire();
  const points = ts.map((t, i) => {
    const p = sur(t);
    return i === k ? [p[0] + nx*ecart, p[1] + ny*ecart] : p;
  });
  const an = analyseEtabli(points);
  return {points, fautive:an.fautive, ecart:an.ecart, aligne:false, evident:true};
}

/* Quelle pointe sort du rang, et de combien ? On CALCULE : pour chaque
   pointe, on trace la droite des trois autres et on mesure sa distance.
   Prendre au hasard deux points comme référence ne marche pas — l’un d’eux
   peut être justement l’intruse. */
function analyseEtabli(points){
  let fautive = -1, ecart = -1, resteAligne = false;
  points.forEach((p, i) => {
    const autres = points.filter((_, j) => j !== i);
    const d = Math.abs(ecartDroite(p, autres[0], autres[autres.length - 1]));
    const plat = autres.every(q => Math.abs(ecartDroite(q, autres[0], autres[autres.length - 1])) < 1);
    if (plat && d > ecart) { ecart = d; fautive = i; resteAligne = true; }
  });
  return {fautive, ecart, resteAligne};
}

function itemAngle(douteux){
  const sommet = [entre(150, 250), entre(170, 215)];
  const base = entre(0, TAU);
  const deg = douteux ? pioche(ANGLES_DOUTEUX) : pioche(ANGLES_FRANCS);
  const estDroit = Math.random() < (douteux ? 0.34 : 0);
  const angle = estDroit ? 90 : deg;
  const L1 = entre(92, 118), L2 = entre(92, 118);
  const a0 = [sommet[0] + Math.cos(base)*L1, sommet[1] + Math.sin(base)*L1];
  const b0 = [sommet[0] + Math.cos(base + radians(angle))*L2, sommet[1] + Math.sin(base + radians(angle))*L2];
  const [S, a, b] = cadrer([sommet, a0, b0], 34, 34, 366, 232);
  return {sommet:S, a, b, angle, douteux:!!douteux, requiert:!!douteux,
          reponse: Math.abs(angle - 90) <= TOL_ANGLE_DROIT ? 'droit' : (angle < 90 ? 'aigu' : 'obtus')};
}

/* Polygone dont on passe chaque angle en revue (CE2) : deux angles francs,
   un ou deux douteux — c’est là que s’apprend « quand l’œil suffit-il ? ».
   Un quadrilatère tiré au hasard ne donne pas ce dosage : ses quatre angles
   tombent où ils veulent, et la plupart atterrissent dans la zone grise où
   l’enfant ne peut ni voir ni décider. Les angles sont donc TIRÉS D’ABORD,
   et la figure est CONSTRUITE pour les respecter exactement. */

/* Somme imposée à 360°, chaque angle franc (≤ 75° ou ≥ 105°). */
function anglesFrancsSommant(k, somme){
  for (let essai = 0; essai < 300; essai++) {
    const a = [];
    for (let i = 0; i < k - 1; i++) a.push(pioche(ANGLES_FRANCS));
    const dernier = somme - a.reduce((s, x) => s + x, 0);
    if (dernier >= 30 && dernier <= 150 && Math.abs(dernier - 90) >= 15) return a.concat(dernier);
  }
  return null;
}

/* Contour fermé dont les angles intérieurs sont EXACTEMENT ceux demandés :
   les directions des côtés découlent des angles, deux longueurs sont tirées
   au sort et les deux autres se déduisent de la condition de fermeture. */
function contourDAngles(A){
  const n = A.length;
  const th = [entre(0, TAU)];
  for (let i = 1; i < n; i++) th.push(th[i-1] + radians(180 - A[i]));
  for (let essai = 0; essai < 60; essai++) {
    /* Tous les côtés SAUF DEUX sont tirés au sort ; les deux premiers se
       déduisent de la condition de fermeture, quel que soit le nombre de
       côtés. Une homothétie finale ramène la figure dans le plan, si bien que
       les longueurs absolues n’ont pas d’importance — seule compte la forme. */
    const libres = [];
    for (let i = 2; i < n; i++) libres.push(entre(80, 150));
    let rx = 0, ry = 0;
    for (let i = 2; i < n; i++) { rx -= libres[i-2]*Math.cos(th[i]); ry -= libres[i-2]*Math.sin(th[i]); }
    const det = Math.cos(th[0])*Math.sin(th[1]) - Math.cos(th[1])*Math.sin(th[0]);
    if (Math.abs(det) < 1e-6) continue;
    const s0 = (rx*Math.sin(th[1]) - ry*Math.cos(th[1])) / det;
    const s1 = (ry*Math.cos(th[0]) - rx*Math.sin(th[0])) / det;
    if (s0 < 55 || s1 < 55 || s0 > 300 || s1 > 300) continue;
    const s = [s0, s1].concat(libres);
    const pts = [[0, 0]];
    for (let i = 0; i < n - 1; i++)
      pts.push([pts[i][0] + s[i]*Math.cos(th[i]), pts[i][1] + s[i]*Math.sin(th[i])]);
    /* Recentrage et mise à l’échelle : une homothétie ne touche pas aux
       angles, la commande passée plus haut reste donc vraie. */
    return cadrer(pts, 34, 34, 366, 232);
  }
  return null;
}

/* QUATRE OU CINQ ANGLES, ET TROIS FIGURES SEULEMENT. Cinq quadrilatères
   faisaient vingt jugements par manche : au-delà d’une douzaine la tâche
   devient mécanique et perd son objet, qui est d’apprendre QUAND l’œil suffit,
   pas de vérifier vingt angles. Trois figures de 4 ou 5 angles font 12 à 15
   jugements, et le pentagone empêche d’installer une routine du quadrilatère. */
function itemPolygone(cotes){
  const n = cotes || (Math.random() < 0.5 ? 4 : 5);
  const sommeInterieure = (n - 2) * 180;
  for (let essai = 0; essai < 200; essai++) {
    const nbDouteux = Math.random() < 0.5 ? 1 : 2;
    /* Un angle « douteux » est tantôt vraiment droit, tantôt à quelques
       degrés du droit : c’est ce qui rend l’équerre indispensable. */
    const douteuxTires = Array.from({length: nbDouteux},
      () => Math.random() < 0.4 ? 90 : pioche(ANGLES_DOUTEUX));
    const francs = anglesFrancsSommant(n - nbDouteux, sommeInterieure - douteuxTires.reduce((s, x) => s + x, 0));
    if (!francs) continue;
    const A = melanger(douteuxTires.concat(francs));
    const pts = contourDAngles(A);
    if (!pts) continue;
    /* Les réponses sont relues sur la FIGURE, jamais sur la commande. */
    const angles = pts.map((p, i) => angleEn(p, pts[(i-1+n)%n], pts[(i+1)%n]));
    return {pts, angles,
      reponses: angles.map(a => Math.abs(a - 90) <= TOL_ANGLE_DROIT ? 'droit' : (a < 90 ? 'aigu' : 'obtus')),
      douteux: angles.map(a => Math.abs(a - 90) <= 8)};
  }
  /* Repli déterministe : un trapèze rectangle, deux angles droits francs. */
  const pts = cadrer([[70, 60], [70, 230], [300, 230], [250, 60]], 34, 34, 366, 232);
  const angles = pts.map((p, i) => angleEn(p, pts[(i-1+pts.length)%pts.length], pts[(i+1)%pts.length]));
  return {pts, angles,
    reponses: angles.map(a => Math.abs(a - 90) <= TOL_ANGLE_DROIT ? 'droit' : (a < 90 ? 'aigu' : 'obtus')),
    douteux: angles.map(a => Math.abs(a - 90) <= 8)};
}

/* Figures du codage. `groupes` décrit les égalités de côtés attendues, et
   `droits` les angles à marquer. Le seuil de 15 % décide si la différence
   de longueurs est franche ou demande le report au compas. */
function figureCodage(type){
  const cx = 200, cy = 140, th = entre(-0.35, 0.35);
  const T = pts => pts.map(([x,y]) => [cx + x*Math.cos(th) - y*Math.sin(th), cy + x*Math.sin(th) + y*Math.cos(th)]);
  if (type === 'carre') {
    const c = 74;
    return {type, pts:T([[-c,-c],[c,-c],[c,c],[-c,c]]), groupes:[[0,1,2,3]], droits:[0,1,2,3]};
  }
  if (type === 'rectangle') {
    const l = 108, h = 62;
    return {type, pts:T([[-l,-h],[l,-h],[l,h],[-l,h]]), groupes:[[0,2],[1,3]], droits:[0,1,2,3]};
  }
  if (type === 'losange') {
    const a = 108, b = 62;
    return {type, pts:T([[0,-b],[a,0],[0,b],[-a,0]]), groupes:[[0,1,2,3]], droits:[]};
  }
  if (type === 'triangleRect') {
    return {type, pts:T([[-70,60],[80,60],[-70,-70]]), groupes:[], droits:[0]};
  }
  /* Triangle isocèle : deux côtés égaux sur trois. La marque isolée y
     devient visiblement absurde — c’est l’erreur que le jeu doit provoquer.
     La base est franchement plus courte que les deux côtés (124 contre 166,
     soit 34 % d’écart) : un premier dessin la donnait à 156 pour 155, donc
     égale aux autres à 1 % près — le triangle était équilatéral sans le
     dire, et le codage attendu devenait faux. */
  return {type:'isocele', pts:T([[-62,66],[62,66],[0,-88]]), groupes:[[1,2]], droits:[]};
}
