/* QCM générique — options mélangées (§13), bonne réponse montrée même si
   elle n’a pas été touchée (§18). */
function rendreQcm(opts, ans, apres, classe){
  const zone = $('answers');
  zone.className = classe || (opts.length === 3 ? 'trio' : opts.length === 2 ? 'duo' : '');
  melanger(opts).forEach(o => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'rep'; b.textContent = o;
    b.dataset.val = o;
    b.addEventListener('click', () => {
      if (verrouille) return;
      verrouille = true;
      const bon = o === ans;
      zone.querySelectorAll('.rep').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
      b.classList.add(bon ? 'ok' : 'ko');
      if (!bon) {
        const c = [...zone.querySelectorAll('.rep')].find(x => x.dataset.val === ans);
        if (c) { c.classList.remove('dim'); c.classList.add('ok'); }
      }
      apres(bon);
    });
    zone.appendChild(b);
  });
}

/* ============================================================
   CP — 1er temps : l’établi (objet réel avant sa représentation)
   ============================================================ */
function rendreEtabli(q){
  poserConsigne('Une pointe n’est pas dans le rang. Touche-la !');
  $('sousConsigne').textContent = 'Le verrier plante des pointes pour caler le verre : si l’une dévie, la pièce coince.';
  const pts = q.points;
  const fautive = 1;   // itemAlignement place toujours le point dévié au milieu
  const sol = `<rect x="0" y="132" width="400" height="168" fill="var(--bois)"/>`
    + `<rect x="0" y="132" width="400" height="7" fill="var(--bois-f)"/>`;
  /* Le plateau est vu de biais : l’écart PERPENDICULAIRE à la rangée se
     lit en profondeur, donc sur l’axe vertical. Une première projection
     l’écrasait au dixième — un défaut de 20 px devenait un défaut de 2 px,
     invisible, alors que c’est tout ce que l’enfant a pour répondre. */
  const projetes = pts.map(p => [p[0], 206 + (p[1] - 140) * 0.68]);
  poserScene(sol + projetes.map((p, i) =>
    `<g class="pointe" data-i="${i}">`
    + `<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${p[1]-46}" stroke="var(--trait)" stroke-width="5" stroke-linecap="round"/>`
    + `<circle cx="${p[0]}" cy="${p[1]-50}" r="8" fill="var(--mine)"/>`
    + `<circle class="cible-tactile" cx="${p[0]}" cy="${p[1]-30}" r="20"/></g>`).join(''));
  scene().querySelectorAll('.pointe').forEach(g => {
    g.addEventListener('click', () => {
      if (verrouille) return;
      verrouille = true;
      const bon = +g.dataset.i === fautive;
      /* La tête est un disque REMPLI : la colorer demande `fill`, pas
         `stroke` — sans quoi la bonne pointe reste noire et la §18 n’est
         pas tenue. */
      const teindre = (grp, c) => {
        grp.querySelectorAll('line').forEach(e => e.setAttribute('stroke', c));
        grp.querySelectorAll('circle:not(.cible-tactile)').forEach(e => e.setAttribute('fill', c));
      };
      if (!bon) {
        const c = scene().querySelector(`.pointe[data-i="${fautive}"]`);
        if (c) teindre(c, 'var(--menthe-t)');
      }
      teindre(g, bon ? 'var(--menthe-t)' : 'var(--corail)');
      terminerManche(bon, bon ? PTS_PLEIN : 0,
        bon ? 'La pièce de verre se cale : elle tient !' : null,
        bon ? null : 'C’est la pointe verte qui sortait du rang.');
    });
  });
}

/* ============================================================
   ALIGNEMENT — le cœur du module
   ============================================================ */
function rendreAlignement(q){
  if (q.placer) return rendrePlacer(q);
  poserConsigne('Ces trois points sont-ils alignés ?');
  $('sousConsigne').textContent = q.requiert
    ? 'Pose la règle sur les points pour en être sûr : à l’œil, on ne peut pas trancher.'
    : 'Ici, un coup d’œil peut suffire. La règle reste à ta disposition.';
  poserScene(q.points.map(p => croix(p)).join(''));
  const svg = scene();
  const centre = milieu(q.points[0], q.points[2]);
  posableCourant = creerPosable(svg, {
    x: centre[0], y: centre[1] + 62, angle: entre(-0.25, 0.25),
    ...REGLE(330),
    pointsAimant: q.points,
    surChangement: (e) => {
      /* L’instrument est réputé POSÉ dès que son bord passe assez près de
         deux des trois points : c’est le geste réel de vérification. */
      const proches = q.points.filter(p => distancePointDroite(p, [e.x, e.y], e.angle) < 9).length;
      if (proches >= 2) q._instrumentPose = true;
    }
  });
  rendreQcm(['Alignés', 'Pas alignés'], q.aligne ? 'Alignés' : 'Pas alignés', (bon) => {
    posableCourant.verrouiller();
    const manque = q.requiert && !q._instrumentPose;
    const pts = !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN);
    /* Révélation différée (§18) : la règle rejoint la droite exacte des
       deux points extrêmes ; l’écart du point du milieu se voit alors. */
    clearTimeout(minuteurRevel);
    minuteurRevel = setTimeout(() => {
      if (!posableCourant || !posableCourant.g.isConnected) return;
      const a = q.points[0], b = q.points[2];
      /* L’origine de la règle est le MILIEU de son bord : la poser sur le
         premier point ferait déborder la moitié gauche hors du plan et
         laisserait le troisième point au-delà de son extrémité. */
      const m = milieu(a, b);
      posableCourant.placerExact(m[0], m[1], Math.atan2(b[1]-a[1], b[0]-a[0]));
    }, DELAI_REVELATION);
    let corr = null;
    if (!bon) corr = q.aligne ? 'Ils étaient bien alignés : la règle le montre.'
                              : 'Ils ne l’étaient pas — regarde l’écart sous la règle.';
    else if (manque) corr = 'Mais ici, l’œil ne suffisait pas : il fallait poser la règle.';
    terminerManche(bon, pts, bon && !manque ? (q.evident ? 'Bien vu — ici, l’œil suffisait.' : 'Bien vérifié !') : null, corr);
  });
}

/* CE1 : placer un point pour qu’il soit aligné avec deux autres. */
function rendrePlacer(q){
  poserConsigne('Place la troisième pointe entre les deux autres, dans leur alignement.');
  $('sousConsigne').textContent = 'Touche le plan à l’endroit voulu. La règle t’aide à viser.';
  const a = q.points[0], b = q.points[2];
  poserScene(croix(a) + croix(b) + `<rect id="zoneClic" x="0" y="0" width="400" height="300" fill="transparent"/>`);
  const svg = scene();
  posableCourant = creerPosable(svg, {
    x: milieu(a, b)[0], y: milieu(a, b)[1] + 58, angle: entre(-0.25, 0.25),
    ...REGLE(330), pointsAimant:[a, b],
    surChangement:(e) => { if (distancePointDroite(a, [e.x,e.y], e.angle) < 9 && distancePointDroite(b, [e.x,e.y], e.angle) < 9) q._instrumentPose = true; }
  });
  svg.querySelector('#zoneClic').addEventListener('click', (ev) => {
    if (verrouille) return;
    verrouille = true;
    const p = versSVG(svg, ev.clientX, ev.clientY);
    const ecart = Math.abs(ecartDroite([p.x, p.y], a, b));
    const dedans = p.x > Math.min(a[0],b[0]) - 20 && p.x < Math.max(a[0],b[0]) + 20;
    const bon = ecart <= 6 && dedans;
    posableCourant.verrouiller();
    svg.insertAdjacentHTML('beforeend', croix([p.x, p.y], bon ? 'trace-fait' : 'point-croix'));
    if (!bon) svg.insertAdjacentHTML('beforeend',
      `<line class="trace-fait" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-dasharray="7 6"/>`);
    terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Pile dans l’alignement !' : null,
      bon ? null : 'Le point devait tomber sur la ligne verte.');
  });
}

/* ============================================================
   CP — tracer une droite par deux points (seule production admise)
   ============================================================ */
function rendreTracer(q){
  poserConsigne('Pose la règle sur les deux points, puis touche-la pour tracer le plomb.');
  $('sousConsigne').textContent = 'Le trait doit passer exactement par les deux points.';
  let a, b;
  if (q.orientation === 'horizontale') { const y = entre(110, 190); a = [70, y]; b = [330, y]; }
  else if (q.orientation === 'verticale') { const x = entre(140, 260); a = [x, 50]; b = [x, 250]; }
  else { a = [entre(60, 110), entre(60, 110)]; b = [entre(280, 340), entre(190, 250)]; }
  q._a = a; q._b = b;
  poserScene(croix(a) + croix(b));
  const svg = scene();
  const c = milieu(a, b);
  posableCourant = creerPosable(svg, {
    x:c[0], y:c[1] + 60, angle:entre(-0.3, 0.3), ...REGLE(330), pointsAimant:[a, b],
    surChangement:(e, g) => {
      const ok = distancePointDroite(a, [e.x,e.y], e.angle) < 8 && distancePointDroite(b, [e.x,e.y], e.angle) < 8;
      q._alignee = ok; q._instrumentPose = q._instrumentPose || ok;
      g.classList.toggle('aimante', ok);
    }
  });
  $('btnValider').style.display = 'block';
  $('btnValider').textContent = 'Tracer ✎';
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    posableCourant.verrouiller();
    const bon = !!q._alignee;
    if (bon) svg.insertAdjacentHTML('beforeend',
      `<line class="trace-fait" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`);
    else {
      clearTimeout(minuteurRevel);
      minuteurRevel = setTimeout(() => {
        if (!posableCourant || !posableCourant.g.isConnected) return;
        const m = milieu(a, b);
        posableCourant.placerExact(m[0], m[1], Math.atan2(b[1]-a[1], b[0]-a[0]));
        if (svg.isConnected) svg.insertAdjacentHTML('beforeend',
          `<line class="trace-fait" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-dasharray="7 6"/>`);
      }, DELAI_REVELATION);
    }
    terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Beau trait de plomb !' : null,
      bon ? null : 'La règle devait passer par les deux points — regarde.');
  };
}

/* ============================================================
   CE1 / CE2 — angles au gabarit puis à l’équerre
   ============================================================ */
function rendreAngles(q){
  const outil = q.outil || 'gabarit';
  poserConsigne('Cet angle est-il droit, aigu ou obtus ?');
  $('sousConsigne').textContent = outil === 'gabarit'
    ? 'Pose le coin du gabarit dans le sommet : le côté tombe dedans ou dehors.'
    : 'Même geste, avec l’équerre de l’atelier.';
  /* Le plan gagne une BANDE DE RANGEMENT sous la figure : l’instrument y
     attend entièrement visible. Garé à côté du sommet, il débordait du
     plan et se présentait tronqué. */
  poserScene(
    `<line class="fig-trait" x1="${q.sommet[0]}" y1="${q.sommet[1]}" x2="${q.a[0]}" y2="${q.a[1]}"/>`
    + `<line class="fig-trait" x1="${q.sommet[0]}" y1="${q.sommet[1]}" x2="${q.b[0]}" y2="${q.b[1]}"/>`
    + `<circle class="repere" cx="${q.sommet[0]}" cy="${q.sommet[1]}" r="4"/>`
    + `<line x1="20" y1="250" x2="380" y2="250" stroke="var(--trait)" stroke-width="1.4" stroke-dasharray="5 6" opacity=".5"/>`,
    '0 0 400 370');
  const svg = scene();
  posableCourant = creerPosable(svg, {
    x:54, y:258, angle:entre(-0.4, 0.4),
    ...(outil === 'gabarit' ? GABARIT(90) : EQUERRE(92)),
    pointsAimant:[q.sommet],
    surChangement:(e) => {
      /* Le gabarit est réputé posé quand son coin est logé dans le sommet
         et qu’un de ses bords longe l’un des côtés. */
      if (Math.hypot(e.x - q.sommet[0], e.y - q.sommet[1]) < 16) q._instrumentPose = true;
    }
  });
  rendreQcm(['droit','aigu','obtus'], q.reponse, (bon) => {
    posableCourant.verrouiller();
    const manque = q.requiert && !q._instrumentPose;
    const pts = !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN);
    clearTimeout(minuteurRevel);
    minuteurRevel = setTimeout(() => {
      if (!posableCourant || !posableCourant.g.isConnected) return;
      /* On repose l’outil EXACTEMENT dans le sommet, aligné sur le premier
         côté : l’écart avec le second saute alors aux yeux. */
      posableCourant.placerExact(q.sommet[0], q.sommet[1],
        Math.atan2(q.a[1]-q.sommet[1], q.a[0]-q.sommet[0]));
    }, DELAI_REVELATION);
    terminerManche(bon, pts, bon && !manque ? 'Bien vérifié !' : null,
      !bon ? 'C’était un angle ' + q.reponse + ' — regarde le gabarit se poser.'
           : (manque ? 'Mais il fallait poser l’instrument : à 3° près, l’œil se trompe.' : null));
  });
}

/* CE2 : ce n’est plus un angle isolé mais un POLYGONE à passer en revue. */
function rendreAnglesPoly(q){
  const i = (q._sommet = q._sommet || 0);
  poserConsigne('Angle ' + (i+1) + ' sur ' + q.pts.length + ' : droit, aigu, obtus ?');
  $('sousConsigne').textContent = q.douteux[i]
    ? 'Celui-ci est douteux : pose l’équerre.'
    : 'Celui-ci se voit à l’œil — l’équerre reste possible.';
  const d = 'M ' + q.pts.map(p => p.join(' ')).join(' L ') + ' Z';
  poserScene(`<path class="fig-remplie" d="${d}"/>`
    + `<circle class="sommet-actif" cx="${q.pts[i][0]}" cy="${q.pts[i][1]}" r="16"/>`
    + `<line x1="20" y1="250" x2="380" y2="250" stroke="var(--trait)" stroke-width="1.4" stroke-dasharray="5 6" opacity=".5"/>`,
    '0 0 400 370');
  const svg = scene();
  const s = q.pts[i];
  posableCourant = creerPosable(svg, {
    x:54, y:258, angle:entre(-0.3, 0.3), ...EQUERRE(88), pointsAimant:[s],
    surChangement:(e) => { if (Math.hypot(e.x - s[0], e.y - s[1]) < 16) q._instrumentPose = true; }
  });
  rendreQcm(['droit','aigu','obtus'], q.reponses[i], (bon) => {
    posableCourant.verrouiller();
    const manque = q.douteux[i] && !q._instrumentPose;
    q._bons = (q._bons || 0) + (bon && !manque ? 1 : bon ? 0.5 : 0);
    if (i + 1 < q.pts.length) {
      /* On enchaîne les sommets dans la même manche : c’est le polygone
         entier qui est passé en revue, pas un angle isolé. */
      message(bon ? 'Oui.' : 'Non : ' + q.reponses[i] + '.', bon ? 'bon' : 'mauvais');
      $('btnNext').style.display = 'block';
      $('btnNext').textContent = 'Angle suivant ➜';
      $('btnNext').onclick = () => {
        q._sommet = i + 1; q._instrumentPose = false; verrouille = false;
        $('answers').innerHTML = ''; $('btnNext').style.display = 'none'; message('');
        rendreAnglesPoly(q);
      };
      armerAutoSuivant();
      return;
    }
    const ratio = q._bons / q.pts.length;
    const pts = ratio >= 0.999 ? PTS_PLEIN : ratio >= 0.7 ? PTS_SANS_VERIF : 0;
    terminerManche(ratio >= 0.999, pts,
      ratio >= 0.999 ? 'Polygone entièrement contrôlé !' : null,
      ratio >= 0.999 ? null : 'Certains angles t’ont échappé : ' + q.reponses.join(', ') + '.');
  });
}

/* ============================================================
   COMPAS — CE1 : deux appuis ; CE2 : écartement mesuré
   ============================================================ */
function cercleSvg(c, r, cl){ return `<circle class="${cl||'trace-fait'}" fill="none" cx="${c[0]}" cy="${c[1]}" r="${r}"/>`; }

function rendreCompasLibre(q){
  poserConsigne('Prends le compas en main : touche un centre, puis un point du cercle.');
  $('sousConsigne').textContent = 'Cette manche n’est pas comptée — c’est pour essayer.';
  /* Un plan entièrement vide ne dit pas qu’on peut le toucher : l’invite
     reste dessinée tant que la pointe n’est pas piquée. */
  poserScene(`<circle id="invite-c" cx="200" cy="140" r="46" fill="none" stroke="var(--trait)" stroke-width="1.7" stroke-dasharray="5 6" opacity=".45"/>`
    + `<text id="invite-t" x="200" y="215" font-size="14" text-anchor="middle" fill="var(--encre2)">Touche le plan où tu veux</text>`
    + `<rect id="zoneClic" x="0" y="0" width="400" height="300" fill="transparent"/>`);
  const svg = scene();
  let centre = null;
  svg.querySelector('#zoneClic').addEventListener('click', (ev) => {
    if (verrouille) return;
    const p = versSVG(svg, ev.clientX, ev.clientY);
    if (!centre) {
      centre = [p.x, p.y]; sonClic();
      ['invite-c', 'invite-t'].forEach(id => { const e = svg.getElementById(id); if (e) e.remove(); });
      svg.insertAdjacentHTML('beforeend', `<circle class="repere" cx="${p.x}" cy="${p.y}" r="5"/>`);
      $('sousConsigne').textContent = 'Maintenant, touche un point par lequel le cercle doit passer.';
      return;
    }
    verrouille = true;
    const r = Math.hypot(p.x - centre[0], p.y - centre[1]);
    svg.insertAdjacentHTML('beforeend', cercleSvg(centre, r));
    terminerManche(true, 0, 'Joli cercle ! On passe aux choses sérieuses.', null);
  });
}

/* Le texte dit « cercle de centre un point donné ET PASSANT PAR un autre
   point donné » : l’écartement n’est pas réglé, il est DÉRIVÉ des deux
   appuis. Le problème du réglage disparaît, et c’est la formulation
   officielle exacte. */
function rendreCompasPassant(q){
  const c = [entre(150, 250), entre(120, 180)];
  const p = [c[0] + entre(60, 100) * signeAleatoire(), c[1] + entre(-40, 40)];
  q._c = c; q._p = p;
  poserConsigne('Trace le cercle de centre le point noir, passant par le point orange.');
  $('sousConsigne').textContent = 'Touche d’abord le centre, puis le point de passage.';
  /* La consigne dit « le point NOIR » et « le point ORANGE » : les deux
     doivent donc être noir et orange, francs, avec un halo qui les désigne
     comme des cibles. Un `repere` gris pâle de 6 px ne tenait ni l’un ni
     l’autre. */
  poserScene(`<rect id="zoneClic" x="0" y="0" width="400" height="300" fill="transparent"/>`
    + `<circle cx="${c[0]}" cy="${c[1]}" r="16" fill="rgba(29,51,84,.12)"/>`
    + `<circle cx="${c[0]}" cy="${c[1]}" r="6.5" fill="var(--mine)"/>`
    + `<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="rgba(255,138,61,.20)"/>`
    + `<circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="var(--mandarine)"/>`);
  const svg = scene();
  let choisi = null;
  svg.querySelector('#zoneClic').addEventListener('click', (ev) => {
    if (verrouille) return;
    const m = versSVG(svg, ev.clientX, ev.clientY);
    if (!choisi) {
      choisi = [m.x, m.y]; sonClic();
      $('sousConsigne').textContent = 'Et maintenant, le point de passage.';
      svg.insertAdjacentHTML('beforeend', `<circle class="sommet-actif" cx="${m.x}" cy="${m.y}" r="12"/>`);
      return;
    }
    verrouille = true;
    q._instrumentPose = true;
    const bonCentre = Math.hypot(choisi[0]-c[0], choisi[1]-c[1]) <= 16;
    const bonPoint = Math.hypot(m.x-p[0], m.y-p[1]) <= 16;
    const bon = bonCentre && bonPoint;
    const r = Math.hypot(m.x - choisi[0], m.y - choisi[1]);
    svg.insertAdjacentHTML('beforeend', cercleSvg(choisi, r, bon ? 'trace-fait' : 'fig-trait'));
    if (!bon) svg.insertAdjacentHTML('beforeend',
      cercleSvg(c, Math.hypot(p[0]-c[0], p[1]-c[1]), 'trace-fait') );
    terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Le cercle passe pile par le point !' : null,
      bon ? null : 'Voici le cercle attendu, en vert.');
  });
}

/* Le texte dit « par pliage » — ni compas, ni règle graduée. L’enfant place
   son estimation, le PLI tranche : le segment se replie sur lui-même. */
function rendrePliage(q){
  const y = entre(120, 190);
  const a = [entre(50, 80), y], b = [entre(320, 350), y];
  q._a = a; q._b = b;
  const L = dist(a, b);
  poserConsigne('Où est le milieu de ce segment ? Touche-le, le pli vérifiera.');
  $('sousConsigne').textContent = 'On plie le calque : le segment se replie sur lui-même.';
  poserScene(`<line class="fig-trait" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`
    + croix(a) + croix(b)
    + `<rect id="zoneClic" x="0" y="0" width="400" height="300" fill="transparent"/>`);
  const svg = scene();
  svg.querySelector('#zoneClic').addEventListener('click', (ev) => {
    if (verrouille) return;
    verrouille = true;
    q._instrumentPose = true;
    const p = versSVG(svg, ev.clientX, ev.clientY);
    const m = milieu(a, b);
    const ecart = Math.abs(p.x - m[0]);
    const bon = ecart <= TOL_PLIAGE * L && Math.abs(p.y - y) < 40;
    svg.insertAdjacentHTML('beforeend', `<circle cx="${p.x}" cy="${y}" r="7" fill="${bon ? 'var(--menthe-t)' : 'var(--corail)'}"/>`);
    /* Le pli : on montre le rabattement, puis la marque du milieu. */
    clearTimeout(minuteurRevel);
    minuteurRevel = setTimeout(() => {
      if (!svg.isConnected) return;
      svg.insertAdjacentHTML('beforeend',
        `<line class="trace-fait" x1="${m[0]}" y1="${y-34}" x2="${m[0]}" y2="${y+34}" stroke-dasharray="6 5"/>`
        + `<circle class="repere" cx="${m[0]}" cy="${y}" r="6"/>`);
    }, DELAI_REVELATION);
    terminerManche(bon, bon ? PTS_PLEIN : 0, bon ? 'Le pli tombe juste sur ta marque !' : null,
      bon ? null : 'Le pli marque le vrai milieu, en pointillé.');
  });
}

/* CE2 : cette fois il FAUT fixer une longueur. Échelle graduée reprise du
   double-décimètre de M23 (14 px/cm) pour que le centimètre soit le même
   d’un jeu à l’autre. */
function rendreCompasRayon(q){
  const c = [entre(160, 240), entre(130, 175)];
  q._c = c;
  poserConsigne('Trace un cercle de rayon ' + q.rayonCm + ' cm, centré sur le point.');
  $('sousConsigne').textContent = 'Choisis l’écartement, puis touche le centre du cercle.';
  /* L’échelle est dessinée à l’ÉCHELLE VRAIE, 14 px/cm — le même
     centimètre qu’au double-décimètre de M23. Une première version la
     traçait à 28 px/cm tout en dessinant le cercle à 14 : la règle mentait
     sur ce qu’elle mesurait. Le choix de l’écartement passe donc par des
     boutons, larges au doigt, et la règle se contente de MONTRER la
     longueur choisie — un pointillé de 14 px/cm, comparable au rayon. */
  const CM_MAX = 10, X0 = 30, YR = 268;
  const grad = [];
  for (let cm = 0; cm <= CM_MAX; cm++) {
    const x = X0 + cm * PX_PAR_CM;
    grad.push(`<line x1="${x}" y1="${YR}" x2="${x}" y2="${YR - 13}" stroke="var(--encre2)" stroke-width="1.6"/>`
      + `<text x="${x}" y="${YR - 17}" font-size="10.5" text-anchor="middle" fill="var(--encre2)">${cm}</text>`);
  }
  poserScene(
    /* Le centre est une CIBLE : une croix comme partout ailleurs dans le
       module, pas un point gris de 6 px qu’on cherche des yeux. */
    `<circle cx="${c[0]}" cy="${c[1]}" r="15" fill="rgba(90,180,220,.16)"/>`
    + croix(c) + `<circle class="repere" cx="${c[0]}" cy="${c[1]}" r="3.5"/>`
    + `<text x="${c[0]}" y="${c[1] + 34}" font-size="12" text-anchor="middle" fill="var(--encre2)">centre</text>`
    /* La réglette : corps, graduations et longueur retenue, à 14 px/cm. */
    + `<rect x="${X0 - 10}" y="${YR - 30}" width="${CM_MAX*PX_PAR_CM + 20}" height="42" rx="5"
             fill="rgba(120,140,160,.14)" stroke="var(--trait)" stroke-width="1.4"/>`
    + `<line x1="${X0}" y1="${YR}" x2="${X0 + CM_MAX*PX_PAR_CM}" y2="${YR}" stroke="var(--encre2)" stroke-width="2.4"/>`
    + grad.join('')
    + `<line id="ecartVu" x1="${X0}" y1="${YR + 6}" x2="${X0}" y2="${YR + 6}" stroke="var(--mandarine)" stroke-width="6" stroke-linecap="round"/>`
    + `<text id="lblEcart" x="${X0 + CM_MAX*PX_PAR_CM + 24}" y="${YR + 4}" font-size="15" font-weight="700" fill="var(--encre)">— cm</text>`
    + `<rect id="zoneClic" x="0" y="0" width="400" height="232" fill="transparent"/>`);
  const svg = scene();
  let regle = null;
  const barre = $('barreOutils');
  barre.hidden = false;
  barre.innerHTML = '';
  for (let cm = 1; cm <= 7; cm++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'outil'; b.textContent = cm + ' cm'; b.dataset.cm = cm;
    b.addEventListener('click', () => {
      if (verrouille) return;
      regle = cm; sonClic();
      barre.querySelectorAll('.outil').forEach(x => x.classList.toggle('on', x === b));
      svg.getElementById('lblEcart').textContent = cm + ' cm';
      svg.getElementById('ecartVu').setAttribute('x2', X0 + cm * PX_PAR_CM);
    });
    barre.appendChild(b);
  }
  svg.querySelector('#zoneClic').addEventListener('click', (ev) => {
    if (verrouille || regle === null) {
      if (regle === null) $('sousConsigne').textContent = 'Choisis d’abord l’écartement, sous le plan.';
      return;
    }
    verrouille = true;
    q._instrumentPose = true;
    const p = versSVG(svg, ev.clientX, ev.clientY);
    const bonCentre = Math.hypot(p.x - c[0], p.y - c[1]) <= 18;
    const bon = bonCentre && regle === q.rayonCm;
    svg.insertAdjacentHTML('beforeend', cercleSvg(bonCentre ? c : [p.x, p.y], regle * PX_PAR_CM, bon ? 'trace-fait' : 'fig-trait'));
    if (!bon) svg.insertAdjacentHTML('beforeend', cercleSvg(c, q.rayonCm * PX_PAR_CM, 'trace-fait'));
    terminerManche(bon, bon ? PTS_PLEIN : 0,
      bon ? 'Rayon exact et bien centré !' : null,
      bon ? null : 'Le cercle attendu, de rayon ' + q.rayonCm + ' cm, est en vert.');
  });
}

/* Report de longueur : prendre l’écartement sur un segment et le
   transporter sur un autre pour les COMPARER sans mesurer. Ce geste
   alimente directement le codage des égalités. */
function rendreReport(q){
  const y1 = 110, y2 = 200;
  const L1 = entre(110, 165);
  /* Trois cas, et l’égalité en fait PARTIE : un tirage qui ne produirait
     jamais deux segments égaux ferait de « Ils sont égaux » une réponse
     toujours fausse, et le report ne servirait plus à rien. Le seuil de
     15 % sépare ce que l’œil tranche de ce qui demande le compas. */
  const cas = pioche(['egaux', 'proche', 'proche', 'franc']);
  const L2 = cas === 'egaux' ? L1
           : cas === 'proche' ? L1 * (1 + entre(0.04, 0.12) * signeAleatoire())
           : L1 * (1 + entre(0.22, 0.40) * signeAleatoire());
  const a1 = [70, y1], b1 = [70 + L1, y1], a2 = [70, y2], b2 = [70 + L2, y2];
  q._segs = [[a1,b1],[a2,b2]];
  /* Réponse et exigence de vérification relues sur les segments DESSINÉS. */
  const ecartRelatif = Math.abs(L1 - L2) / Math.max(L1, L2);
  q._exigeVerif = ecartRelatif < SEUIL_LONGUEUR_FRANCHE;
  q._rep = ecartRelatif < 0.005 ? 'Ils sont égaux'
         : (L1 > L2 ? 'Le segment 1 est plus long' : 'Le segment 2 est plus long');
  poserConsigne('Ces deux segments ont-ils la même longueur ?');
  $('sousConsigne').textContent = q._exigeVerif
    ? 'Trop proches pour l’œil : touche le premier segment pour prendre l’écartement, puis le second pour le reporter.'
    : 'L’écart se voit ici, mais tu peux quand même reporter : touche le premier segment, puis le second.';
  poserScene(
    `<line class="fig-trait" x1="${a1[0]}" y1="${y1}" x2="${b1[0]}" y2="${y1}"/>` + croix(a1) + croix(b1)
    + `<circle cx="40" cy="${y1}" r="13" fill="var(--ciel)"/><text x="40" y="${y1+5}" font-size="15" font-weight="700" text-anchor="middle" fill="var(--encre)">1</text>`
    + `<line class="fig-trait" x1="${a2[0]}" y1="${y2}" x2="${b2[0]}" y2="${y2}"/>` + croix(a2) + croix(b2)
    + `<circle cx="40" cy="${y2}" r="13" fill="var(--ciel)"/><text x="40" y="${y2+5}" font-size="15" font-weight="700" text-anchor="middle" fill="var(--encre)">2</text>`
    + `<line class="cible-tactile" data-s="0" x1="${a1[0]}" y1="${y1}" x2="${b1[0]}" y2="${y1}"/>`
    + `<line class="cible-tactile" data-s="1" x1="${a2[0]}" y1="${y2}" x2="${b2[0]}" y2="${y2}"/>`);
  const svg = scene();
  let pris = false;
  svg.querySelectorAll('.cible-tactile').forEach(l => l.addEventListener('click', () => {
    if (verrouille) return;
    if (l.dataset.s === '0' && !pris) {
      pris = true; sonClic(); q._instrumentPose = true;
      $('sousConsigne').textContent = 'Écartement pris. Touche maintenant le segment 2.';
      svg.insertAdjacentHTML('beforeend',
        `<line class="trace-fait" x1="${a1[0]}" y1="${y1-16}" x2="${b1[0]}" y2="${y1-16}" stroke-dasharray="5 4"/>`);
      return;
    }
    if (l.dataset.s === '1' && pris) {
      /* On reporte visiblement la longueur du premier sur le second : la
         différence, ou son absence, devient lisible sans aucun nombre. */
      svg.insertAdjacentHTML('beforeend',
        `<line class="trace-fait" x1="${a2[0]}" y1="${y2-16}" x2="${a2[0]+L1}" y2="${y2-16}"/>`
        + `<line class="trace-fait" x1="${a2[0]+L1}" y1="${y2-24}" x2="${a2[0]+L1}" y2="${y2+8}"/>`);
      $('sousConsigne').textContent = 'Compare, puis réponds.';
      pris = 'reporte';
    }
  }));
  /* Une colonne, pas trois : « Le second est plus long » sur trois lignes
     dans une case étroite se déchiffre au lieu de se lire. */
  rendreQcm(['Ils sont égaux','Le segment 1 est plus long','Le segment 2 est plus long'], q._rep, (bon) => {
    const manque = q._exigeVerif && !q._instrumentPose;
    terminerManche(bon, !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN),
      bon && !manque ? 'Report bien mené !' : null,
      !bon ? 'La bonne réponse : ' + q._rep.toLowerCase() + '.'
           : (manque ? 'Mais il fallait reporter l’écartement pour en être sûr.' : null));
  }, 'pile');
}

/* ============================================================
   CODAGE — le tampon, jamais le tracé
   ============================================================ */
function marqueAngleDroit(pts, i){
  const n = pts.length, s = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
  const u = [(a[0]-s[0]), (a[1]-s[1])], v = [(b[0]-s[0]), (b[1]-s[1])];
  const lu = Math.hypot(...u), lv = Math.hypot(...v), d = 17;
  const p1 = [s[0] + u[0]/lu*d, s[1] + u[1]/lu*d];
  const p2 = [s[0] + v[0]/lv*d, s[1] + v[1]/lv*d];
  const p3 = [p1[0] + v[0]/lv*d, p1[1] + v[1]/lv*d];
  return `<path class="marque" fill="none" stroke="var(--corail)" stroke-width="3"
            d="M ${p1[0]} ${p1[1]} L ${p3[0]} ${p3[1]} L ${p2[0]} ${p2[1]}"/>`;
}
/* La marque d’égalité s’oriente seule : perpendiculaire au côté, en son
   milieu. Un ou deux traits selon le groupe — deux groupes distincts
   appellent deux notations distinctes. */
function marqueEgalite(pts, i, nbTraits){
  const n = pts.length, a = pts[i], b = pts[(i+1)%n];
  const m = milieu(a, b);
  const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy);
  const nx = -dy/L, ny = dx/L, e = 9;
  let s = '';
  for (let k = 0; k < nbTraits; k++) {
    const off = (k - (nbTraits-1)/2) * 7;
    const cx = m[0] + dx/L*off, cy = m[1] + dy/L*off;
    s += `<line class="marque" x1="${cx - nx*e}" y1="${cy - ny*e}" x2="${cx + nx*e}" y2="${cy + ny*e}" stroke="var(--mandarine)" stroke-width="3.2" stroke-linecap="round"/>`;
  }
  return s;
}

function rendreCodage1(q){
  poserConsigne('Marque tous les angles droits de cette figure — et seulement eux.');
  $('sousConsigne').textContent = 'Choisis le tampon, puis touche un sommet.';
  dessinerCodage(q, ['droit']);
}
function rendreCodage2(q){
  poserConsigne('Certifie ce plan : angles droits et côtés de même longueur.');
  const aVerifier = q.type === 'rectangle' || q.type === 'isocele';
  $('sousConsigne').textContent = aVerifier
    ? 'Ici les longueurs se ressemblent : reporte l’écartement au compas avant de marquer.'
    : 'Choisis un tampon, puis touche un sommet ou un côté.';
  q._exigeVerif = aVerifier;
  dessinerCodage(q, ['droit','simple','double']);
}

function dessinerCodage(q, tampons){
  const n = q.pts.length;
  const d = 'M ' + q.pts.map(p => p.join(' ')).join(' L ') + ' Z';
 let cibles = '', indices = '';
  /* Un côté ne se marque que si un tampon d’égalité est disponible : au CE1,
     seuls les sommets sont actifs, et seuls eux s’annoncent. */
  const cotesActifs = tampons.length > 1;
  q.pts.forEach((p, i) => {
    cibles  += `<circle class="cible-tactile" data-t="a${i}" cx="${p[0]}" cy="${p[1]}" r="20"/>`;
    indices += `<circle class="indice-cible" data-i="a${i}" cx="${p[0]}" cy="${p[1]}" r="11"/>`;
    if (!cotesActifs) return;
    const b = q.pts[(i+1)%n], m = milieu(p, b);
    cibles  += `<circle class="cible-tactile" data-t="c${i}" cx="${m[0]}" cy="${m[1]}" r="20"/>`;
    indices += `<circle class="indice-cible" data-i="c${i}" cx="${m[0]}" cy="${m[1]}" r="9"/>`;
  });
  poserScene(`<path class="fig-remplie" d="${d}"/>` + indices + `<g id="marques"></g>` + cibles);
  const svg = scene();

  const nomsTampon = {droit:'angle droit', simple:'trait simple', double:'trait double'};
  const apercu = {
    droit:`<svg viewBox="0 0 26 22"><path d="M4 4 L18 4 L18 18" fill="none" stroke="#FF5D5D" stroke-width="3"/></svg>`,
    simple:`<svg viewBox="0 0 26 22"><line x1="13" y1="4" x2="13" y2="18" stroke="#FF8A3D" stroke-width="3.2"/></svg>`,
    double:`<svg viewBox="0 0 26 22"><line x1="10" y1="4" x2="10" y2="18" stroke="#FF8A3D" stroke-width="3.2"/><line x1="17" y1="4" x2="17" y2="18" stroke="#FF8A3D" stroke-width="3.2"/></svg>`
  };
  let choisi = tampons[0];
  const barre = $('barreOutils');
  barre.hidden = false;
  barre.innerHTML = tampons.map(t =>
    `<button type="button" class="outil${t === choisi ? ' on' : ''}" data-t="${t}">${apercu[t]}${nomsTampon[t]}</button>`).join('')
    + (q._exigeVerif ? `<button type="button" class="outil" id="btnCompas">🧭 reporter</button>` : '');
  barre.querySelectorAll('.outil[data-t]').forEach(b => b.addEventListener('click', () => {
    choisi = b.dataset.t;
    barre.querySelectorAll('.outil').forEach(x => x.classList.toggle('on', x === b));
  }));
  const btnC = $('btnCompas');
  if (btnC) btnC.addEventListener('click', () => {
    q._instrumentPose = true;
    btnC.classList.add('on');
    $('sousConsigne').textContent = 'Écartement reporté : tu peux marquer les égalités.';
    sonClic();
  });

  const posees = {};   // clé de cible -> type de tampon
  svg.querySelectorAll('.cible-tactile').forEach(c => c.addEventListener('click', () => {
    if (verrouille) return;
    const k = c.dataset.t;
    if (posees[k]) { delete posees[k]; }
    else if (k[0] === 'a' && choisi !== 'droit') return;   // un trait ne se pose pas sur un sommet
    else if (k[0] === 'c' && choisi === 'droit') return;   // un carré d’angle ne se pose pas sur un côté
    else { posees[k] = choisi; sonClic(); }
    redessinerMarques();
  }));
  function redessinerMarques(){
    const g = svg.getElementById('marques');
    g.innerHTML = Object.keys(posees).map(k => {
      const i = +k.slice(1);
      return k[0] === 'a' ? marqueAngleDroit(q.pts, i)
        : marqueEgalite(q.pts, i, posees[k] === 'double' ? 2 : 1);
    }).join('');
    /* L’indice s’efface là où une marque a pris sa place. */
    svg.querySelectorAll('.indice-cible').forEach(e =>
      e.classList.toggle('pris', !!posees[e.dataset.i]));
  }

  $('btnValider').style.display = 'block';
  $('btnValider').textContent = 'Certifier ✓';
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    const attenduAngles = new Set(q.droits.map(i => 'a' + i));
    const posesAngles = new Set(Object.keys(posees).filter(k => k[0] === 'a'));
    const anglesOk = attenduAngles.size === posesAngles.size && [...attenduAngles].every(k => posesAngles.has(k));

    /* Une marque d’égalité est RELATIONNELLE : elle ne dit pas « ce côté
       mesure quelque chose », elle dit « ce côté est égal à celui qui porte
       la même marque ». D’où deux exigences : au moins deux marques
       identiques pour qu’un codage ait un sens, et deux notations
       distinctes pour deux groupes distincts. */
    let egalitesOk = true, motif = null;
    if (tampons.length > 1) {
      const parType = {};
      Object.keys(posees).filter(k => k[0] === 'c').forEach(k => {
        (parType[posees[k]] = parType[posees[k]] || []).push(+k.slice(1));
      });
      const groupesPoses = Object.values(parType).map(l => l.slice().sort((x,y) => x-y).join(','));
      const groupesAttendus = q.groupes.map(g => g.slice().sort((x,y) => x-y).join(','));
      const isolee = Object.values(parType).some(l => l.length === 1);
      if (isolee) { egalitesOk = false; motif = 'Une marque toute seule ne dit rien : il en faut au moins deux pareilles.'; }
      else if (groupesPoses.length !== groupesAttendus.length
        || !groupesAttendus.every(g => groupesPoses.includes(g))) {
        egalitesOk = false;
        motif = q.groupes.length === 2
          ? 'Deux groupes de côtés égaux : il fallait deux notations différentes.'
          : (q.groupes.length === 0 ? 'Cette figure n’a aucune égalité de côtés à marquer.'
                                    : 'Les côtés de même longueur devaient tous porter la même marque.');
      }
    }
    const bon = anglesOk && egalitesOk;
    const manque = bon && q._exigeVerif && !q._instrumentPose;
    // Correction : on montre le codage attendu (§18).
    const g = svg.getElementById('marques');
    svg.querySelectorAll('.indice-cible').forEach(e => e.classList.add('pris'));
    g.innerHTML = q.droits.map(i => marqueAngleDroit(q.pts, i)).join('')
      + q.groupes.map((grp, gi) => grp.map(i => marqueEgalite(q.pts, i, gi + 1)).join('')).join('');
    terminerManche(bon, !bon ? 0 : (manque ? PTS_SANS_VERIF : PTS_PLEIN),
      bon && !manque ? 'Plan certifié !' : null,
      !bon ? (motif || 'Voici le codage attendu.')
           : 'Mais il fallait reporter l’écartement avant de marquer les égalités.');
  };
}

/* ---------- Fin de manche ---------- */
function terminerManche(bon, pts, motBravo, correction){
  const q = file[pos];
  q._pts = pts; q._ok = bon;
  score += pts;
  if (bon && pts === PTS_PLEIN) { sonBonneReponse(); lancerConfettis(28); message(motBravo || 'Bravo !', 'bon'); }
  else if (bon) { sonBonneReponse(); message('Juste, ', 'demi', correction || ''); }
  else { sonErreur(); message('Presque ! ', 'mauvais', correction || ''); }
  majDots();
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  $('btnNext').onclick = () => { pos++; if (pos < file.length) question(); else fin(); };
  armerAutoSuivant();
}

function fin(){
  desarmerAutoSuivant(); stopperVoix();
  const ratio = total ? score / total : 0;
  const n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  enregistrerEtoiles(miniJeuCourant.cfg.id, n);
  enregistrerSession(miniJeuCourant.cfg.id, score, total, Math.round((Date.now() - demarreLe)/1000));
  $('hdrTitle').textContent = 'Résultat';
  $('endStars').innerHTML = '⭐'.repeat(n).split('').map(s => `<span>${s}</span>`).join('');
  $('endMsg').textContent = n === 3 ? 'Contrôle impeccable !' : n === 2 ? 'Bon travail !' : 'Continue, tu progresses !';
  $('endScore').textContent = score + ' point' + (score > 1 ? 's' : '') + ' sur ' + total + '.';
  if (n === 3) sonNiveauParfait(); else sonBonneReponse();
  lancerConfettis(n === 3 ? 90 : 40);
  montreEcran('end');
}
$('bRejouer').addEventListener('click', () => lance(miniJeuCourant.cfg.id));
$('bMenu').addEventListener('click', retourAccueil);

/* ============================================================
   DÉMARRAGE
   ============================================================ */
construireAccueil();
montreEcran('home');

/* Lancement paramétré (CHARTE §16) : un paramètre inconnu est ignoré en
   silence — ce n’est qu’un raccourci d’entrée. */
(function(){
  const d = parametreURL('competence');
  if (!d) return;
  const t = trouverMiniJeu(d);
  if (!t) return;
  etatPalierAffiche = t.palierNom;
  construireAccueil();
  lance(d);
})();

/* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7). */
(function(){
  const b = $('bouton-menu'), m = $('modale-menu');
  if (!b || !m) return;
  const fermer = () => { m.hidden = true; };
  b.addEventListener('click', () => { m.hidden = false; });
  $('modale-menu-rester').addEventListener('click', fermer);
  $('modale-menu-revenir').addEventListener('click', () => { fermer(); location.href = '../index.html'; });
})();
