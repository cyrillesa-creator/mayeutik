<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>Tableaux et diagrammes – Mayeutik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     Protections tactiles obligatoires (CHARTE §19)
     Deux comportements natifs du navigateur parasitent l'usage tactile d'un
     jeu : le zoom au double-tap (deux appuis rapprochés sont un geste NORMAL
     ici — remplir puis vider une case, corriger une saisie) et la sélection
     native (surbrillance bleue, menu « copier / enregistrer l'image » au
     maintien du doigt). On les neutralise à l'échelle de l'interface, une
     bonne fois, plutôt qu'élément par élément.
     ================================================================ */

  /* `touch-action` ne s'hérite PAS : le sélecteur universel est le seul moyen
     de couvrir toute l'interface. `manipulation` supprime le zoom au
     double-tap tout en laissant le défilement et le pincement — les gestes à
     deux doigts pilotés en JS (rotation de la règle mobile de M23) restent
     donc intacts, d'autant qu'ils déclarent eux-mêmes `touch-action:none`,
     plus spécifique que `*`. */
  * { touch-action: manipulation; }

  /* Empêche iOS de grossir les textes en paysage, ce qui casserait les
     mises en page calculées au pixel (règles graduées, figures SVG). */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  /* `user-select` et `-webkit-touch-callout`, eux, s'héritent : les poser sur
     body suffit à couvrir consignes, boutons, illustrations et éléments
     glissables. */
  body {
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Pas de « fantôme » d'image traîné à la souris par-dessus un glisser-déposer. */
  img, svg, canvas { -webkit-user-drag: none; }

  /* Les champs de saisie gardent sélection, curseur et menu d'édition : les
     en priver rendrait la correction d'une valeur impossible. La série en
     compte deux (décomposition m/dm/cm de M23, cellule manquante de M39). */
  input, textarea, select, [contenteditable="true"] {
    -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
    -webkit-touch-callout: default;
  }

  :root {
    --couleur-fond: #FFF8EF;
    --couleur-encre: #2B2B2B;
    --couleur-mandarine: #FF8C42;
    --couleur-menthe: #4ECDC4;
    --couleur-corail: #FF6B6B;
    --couleur-soleil: #FFD93D;
    color-scheme: light only;
  }
  @media (prefers-color-scheme: dark) {
    html { background-color: var(--couleur-fond); }
    body { background-color: var(--couleur-fond); color: var(--couleur-encre); }
    input, select, textarea, button { background-color: #FFFFFF; color: var(--couleur-encre); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--couleur-fond); color:var(--couleur-encre); overflow-x:hidden; }
  body { font-family:'Fredoka', system-ui, sans-serif; min-height:100vh; padding-bottom:2rem; }
  button { font-family:inherit; cursor:pointer; }
  h1,h2,h3{ font-weight:700; margin:0 0 .4rem; }

  #ecran-accueil { max-width:640px; margin:0 auto; padding:1.2rem 1rem 2rem; }
  .entete-accueil { text-align:center; margin-bottom:.8rem; }
  .entete-accueil h1 { font-size:1.5rem; color:var(--couleur-mandarine); }
  .entete-accueil p { margin:0; font-size:1rem; font-weight:500; opacity:.85; }

  /* Sélecteur de palier (CHARTE §15 : niveau du profil actif par défaut, changement possible) */
  .rangee-paliers{ display:flex; justify-content:center; gap:.5rem; margin:.9rem 0 1rem; flex-wrap:wrap; }
  .puce-palier{
    min-height:40px; padding:.35rem 1rem; border-radius:999px; font-weight:700; font-size:.92rem;
    border:2.5px solid color-mix(in srgb, var(--couleur-encre) 22%, white); background:#ffffff; color:var(--couleur-encre);
  }
  .puce-palier.actif{ background:var(--couleur-mandarine); border-color:var(--couleur-mandarine); color:#ffffff; }
  .note-palier{ text-align:center; font-size:.82rem; opacity:.7; margin:-.3rem 0 .8rem; }

  .grille-jeux { display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem; }
  @media (max-width:360px){ .grille-jeux{ grid-template-columns:1fr; } }
  .carte-jeu {
    --c: var(--couleur-mandarine);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center; gap:.3rem;
    background: color-mix(in srgb, var(--c) 16%, white);
    border:3px solid var(--c); border-radius:20px; padding:.8rem .6rem;
    max-height:34vh; min-height:9.5rem;
    box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, black 6%);
  }
  .carte-jeu:active { transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, black 6%); }
  .carte-jeu.carte-menthe{ --c:var(--couleur-menthe); }
  .carte-jeu.carte-corail{ --c:var(--couleur-corail); }
  .carte-jeu.carte-soleil{ --c:var(--couleur-soleil); }
  .carte-jeu .icone{ font-size:1.9rem; line-height:1; }
  .carte-jeu h2{ font-size:1rem; }
  .carte-jeu p{ font-size:.76rem; font-weight:400; margin:0; opacity:.85; }
  .etoiles{ display:inline-flex; gap:2px; font-size:1.1rem; letter-spacing:-1px; }
  .etoile{ color:rgba(43,43,43,.2); }
  .etoile.pleine{ color:var(--couleur-soleil); text-shadow:0 0 1px rgba(43,43,43,.35); }

  /* Palier bonus : présenté comme une récompense, distinct visuellement (CHARTE §15) */
  .bloc-bonus{
    margin-top:1.3rem; border-radius:20px; padding:.9rem .8rem;
    border:3px dashed var(--couleur-soleil); background:color-mix(in srgb, var(--couleur-soleil) 14%, white);
  }
  .bloc-bonus h3{ text-align:center; font-size:1rem; color:color-mix(in srgb, var(--couleur-soleil) 55%, black 25%); margin-bottom:.15rem; }
  .bloc-bonus .note-palier{ margin:.1rem 0 .7rem; }

  /* Paquet cadeau : première révélation d'un palier bonus (CHARTE §15,
     pattern générique "paquet cadeau" — cf. section « Palier bonus »).
     Recouvre grille-bonus tant que l'enfant n'a pas cliqué dessus. */
  .paquet-cadeau{
    display:flex; flex-direction:column; align-items:center; gap:.7rem;
    width:100%; border:none; background:transparent; padding:1rem .5rem; cursor:pointer; min-height:44px;
  }
  .paquet-cadeau-boite{
    position:relative; width:5.6rem; height:4.6rem; border-radius:14px;
    background:linear-gradient(180deg, var(--couleur-corail), color-mix(in srgb, var(--couleur-corail) 70%, black 15%));
    border:3px solid color-mix(in srgb, var(--couleur-corail) 55%, black 20%);
    box-shadow:0 5px 0 color-mix(in srgb, var(--couleur-corail) 50%, black 25%);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .paquet-cadeau:active .paquet-cadeau-boite{
    transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--couleur-corail) 50%, black 25%);
  }
  .paquet-cadeau-ruban-v{ position:absolute; left:50%; top:0; bottom:0; width:14px; margin-left:-7px; background:var(--couleur-soleil); }
  .paquet-cadeau-ruban-h{ position:absolute; top:50%; left:0; right:0; height:14px; margin-top:-7px; background:var(--couleur-soleil); }
  .paquet-cadeau-noeud{ position:absolute; left:50%; top:-1rem; transform:translateX(-50%); font-size:1.9rem; line-height:1; }
  .paquet-cadeau-texte{ font-weight:700; font-size:.88rem; text-align:center; color:color-mix(in srgb, var(--couleur-encre) 85%, white); }
  @keyframes paquet-cadeau-pop{
    0%{ transform:scale(1) rotate(0deg); opacity:1; }
    35%{ transform:scale(1.18) rotate(-5deg); opacity:1; }
    100%{ transform:scale(.25) rotate(10deg); opacity:0; }
  }
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{ animation:paquet-cadeau-pop .45s ease forwards; }
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-texte{ opacity:0; transition:opacity .2s ease; }
  @media (prefers-reduced-motion:reduce){
    .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{ animation:none; opacity:0; transition:opacity .3s ease; }
  }

  /* Correction affichée après une MAUVAISE réponse (CHARTE §18) : la réponse
     donnée en rouge, la bonne en vert. Mêmes teintes que .feedback-succes /
     .feedback-erreur, assombries pour rester lisibles sur blanc. */
  .bloc-correction{ text-align:center; font-weight:700; font-size:.98rem; margin:.7rem 0 .2rem; }
  .correction-donnee{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .correction-attendue{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }

  #ecran-jeu{ max-width:640px; margin:0 auto; padding:.8rem 1rem 2.5rem; }
  .entete-jeu{ display:flex; align-items:center; gap:.6rem; margin-bottom:.8rem; }
  .bouton-retour{
    flex:0 0 auto; min-height:44px; min-width:44px; border-radius:14px; border:none;
    background:var(--couleur-encre); color:var(--couleur-fond); font-size:1.2rem; font-weight:600; padding:0 .9rem;
  }
  .entete-jeu-titres{ flex:1; min-width:0; }
  .entete-jeu-titres h2{ font-size:1.1rem; color:var(--couleur-mandarine); }
  .entete-jeu-titres .progression{ font-size:.85rem; font-weight:500; opacity:.75; }
  #zone-jeu{
    background:#ffffff; border-radius:20px;
    border:3px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
    padding:1.1rem .9rem; min-height:40vh;
  }
  .consigne{ text-align:center; font-size:1.05rem; font-weight:600; margin:0; }
  .legende{ text-align:center; font-size:.85rem; font-weight:400; opacity:.85; margin-top:.7rem; }

  .bloc-consigne{ display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .bouton-son{
    min-width:44px; min-height:44px; border-radius:50%;
    border:2.5px solid var(--couleur-mandarine); background:#ffffff;
    font-size:1.3rem; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .bouton-son:active{ transform:translateY(2px); }

  .bouton-principal{
    display:block; margin:.8rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; padding:0 1.3rem; font-size:1rem;
  }
  .bouton-principal:disabled{ opacity:.45; }
  .bouton-secondaire{
    display:block; margin:0 auto; min-height:44px; border-radius:14px; border:2.5px solid var(--couleur-encre);
    background:#ffffff; padding:0 1.1rem; font-weight:500;
  }

  /* Retour à la coquille (CHARTE §7) : bouton discret + confirmation */
  .barre-accueil{ display:flex; margin-bottom:.6rem; }
  .bouton-menu{
    min-height:44px; border-radius:14px; padding:0 .9rem;
    border:2px solid color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:#ffffff; color:var(--couleur-encre); font-weight:600; font-size:.95rem;
    display:inline-flex; align-items:center; gap:.35rem;
  }
  .bouton-menu:active{ transform:translateY(2px); }
  .modale-fond{
    position:fixed; inset:0; z-index:1000; padding:1.2rem;
    background:color-mix(in srgb, var(--couleur-encre) 55%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .modale-boite{
    background:#ffffff; border-radius:20px; padding:1.4rem 1.2rem; max-width:20rem; width:100%;
    text-align:center; box-shadow:0 12px 34px rgba(43,43,43,.28);
  }
  .modale-boite p{ font-size:1.05rem; font-weight:600; margin:0 0 1.1rem; }
  .modale-boutons{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .modale-boutons .bouton-principal, .modale-boutons .bouton-secondaire{ margin:0; }

  .feedback{ text-align:center; font-weight:700; font-size:1.05rem; min-height:1.6rem; margin:.8rem 0 .2rem; }
  .feedback-succes{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }
  .feedback-erreur{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .bouton-suivant{
    display:block; margin:.6rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; font-size:1rem; padding:0 1.4rem;
  }

  .bloc-resultats{ text-align:center; }
  .bloc-resultats .etoiles{ font-size:2.6rem; margin:.6rem 0; }
  .bloc-resultats .score-texte{ font-size:1.1rem; font-weight:500; margin-bottom:1rem; }
  .boutons-resultats{ display:flex; justify-content:center; gap:.7rem; flex-wrap:wrap; margin-top:.6rem; }

  /* ---- Recueil : population à compter ---- */
  .population-jardin{ display:flex; flex-wrap:wrap; gap:.35rem; justify-content:center; padding:.6rem; border-radius:16px;
    background:color-mix(in srgb, var(--couleur-menthe) 12%, var(--couleur-fond)); border:2.5px solid color-mix(in srgb, var(--couleur-menthe) 35%, white); margin:.6rem 0; }
  .bete-population{
    font-size:1.7rem; min-width:40px; min-height:40px; display:flex; align-items:center; justify-content:center;
    background:#ffffff; border-radius:50%; border:2px solid transparent;
  }
  .bete-population.comptee{ opacity:.3; filter:grayscale(.7); border-color:color-mix(in srgb, var(--couleur-encre) 15%, white); }
  .tableau-tally{ width:100%; border-collapse:collapse; margin-top:.7rem; font-size:.92rem; }
  .tableau-tally th, .tableau-tally td{ border:1.5px solid color-mix(in srgb, var(--couleur-encre) 15%, white); padding:.35rem .4rem; text-align:center; }
  .tableau-tally th{ background:color-mix(in srgb, var(--couleur-mandarine) 12%, white); }
  .tally-marques{ letter-spacing:1px; color:color-mix(in srgb, var(--couleur-mandarine) 70%, black 10%); font-weight:700; }

  /* ---- Diagramme en barres (construction et lecture) ---- */

  /* ---- Sondage du jardin : décompte manuel puis report au pavé ---- */
  /* Marques de comptage groupées par cinq : c'est le groupement qui rend le
     total dénombrable d'un coup d'œil, seul intérêt d'un tableau de décompte. */
  .tally-paquet{ display:inline-block; margin-right:.55rem; letter-spacing:2px; white-space:nowrap; }
  .tally-paquet.complet{ text-decoration:line-through; text-decoration-thickness:2px; }
  .cellule-total{ min-width:3.2rem; }
  .cellule-total.a-saisir{ cursor:pointer; background:color-mix(in srgb, var(--couleur-soleil) 25%, white);
    border:2px dashed var(--couleur-mandarine); font-weight:700; }
  .cellule-total.a-saisir.active{ background:color-mix(in srgb, var(--couleur-mandarine) 30%, white); }
  .cellule-total.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .cellule-total.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }
  .cellule-total.saisi{ background:color-mix(in srgb, var(--couleur-menthe) 18%, white);
    border:2px solid var(--couleur-menthe); font-weight:700; cursor:pointer; }

  /* ---- L'enquête avancée : le carnet du jardinier à recompléter ----
     Les totaux se distinguent des données par un fond légèrement teinté : c'est
     sur eux que s'appuient toutes les déductions, il faut les repérer d'un coup
     d'œil. Les cases à trouver sont en pointillés, comme la colonne Total du
     sondage — même vocabulaire visuel dans tout le module. */
  .tableau-deduction{ width:100%; border-collapse:collapse; margin:.7rem 0; font-size:.92rem; }
  .tableau-deduction th, .tableau-deduction td{
    border:1.5px solid color-mix(in srgb, var(--couleur-encre) 18%, white); padding:.4rem .3rem; text-align:center; }
  .tableau-deduction thead th{ background:color-mix(in srgb, var(--couleur-menthe) 14%, white); font-size:.8rem; }
  .tableau-deduction tbody th{ background:color-mix(in srgb, var(--couleur-menthe) 8%, white); font-size:.78rem; text-align:left; }
  .tableau-deduction .colonne-total, .tableau-deduction .ligne-total td{
    background:color-mix(in srgb, var(--couleur-soleil) 16%, white); font-weight:700; }
  .tableau-deduction .ligne-total th{ background:color-mix(in srgb, var(--couleur-soleil) 22%, white); font-weight:700; }
  .cellule-deduction{ min-width:2.6rem; }
  .cellule-deduction.a-trouver{ cursor:pointer; border:2px dashed var(--couleur-mandarine);
    background:color-mix(in srgb, var(--couleur-mandarine) 12%, white); font-weight:700; }
  .cellule-deduction.active{ background:color-mix(in srgb, var(--couleur-mandarine) 32%, white); }
  .cellule-deduction.saisi{ background:color-mix(in srgb, var(--couleur-menthe) 18%, white);
    border:2px solid var(--couleur-menthe); font-weight:700; cursor:pointer; }
  .cellule-deduction.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .cellule-deduction.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }
  /* Barre déjà renseignée par l'énoncé : lisible, mais pas manipulable. La
     colonne à construire, elle, s'annonce par un fond légèrement teinté et un
     liseré — c'est le seul endroit du diagramme où l'on attend un geste. */
  .colonne-construction.colonne-donnee .case-construction{ opacity:1; }
  .colonne-construction.colonne-donnee .case-construction:not(.remplie){ background:color-mix(in srgb, var(--couleur-encre) 4%, white); }
  .diagramme-avec-donnees .colonne-construction:not(.colonne-donnee) .case-construction:not(.remplie){
    background:color-mix(in srgb, var(--couleur-mandarine) 12%, white);
    border-color:color-mix(in srgb, var(--couleur-mandarine) 30%, white);
  }
  /* L'axe garde son épaisseur uniforme : un segment plus épais sous une seule
     colonne donnerait une ligne d'abscisses qui semble cassée. */
  .diagramme-avec-donnees .colonne-construction:not(.colonne-donnee) .etiquette-colonne{
    filter:drop-shadow(0 0 3px color-mix(in srgb, var(--couleur-mandarine) 60%, transparent)); }

  /* Pavé numérique diégétique — composant partagé de la série, repris à
     l'identique de jeux/M23-longueurs.html et jeux/M99-boss-des-tables.html.
     L'écran a une HAUTEUR FIXE et des chiffres à chasse constante : la saisie
     ne fait donc jamais bouger la mise en page sous les doigts de l'enfant.
     Les touches font 48 px de haut, au-dessus de la cible tactile minimale. */
  .pave-numerique{ max-width:250px; margin:.9rem auto 0; }
  .pave-ecran{
    background:color-mix(in srgb, var(--couleur-encre) 88%, black 8%);
    color:color-mix(in srgb, var(--couleur-menthe) 70%, white 20%);
    border-radius:12px; font-size:1.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:flex-end;
    height:2.9rem; padding:0 .9rem; letter-spacing:2px;
    font-variant-numeric:tabular-nums; box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
  }
  .pave-grille{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px; }
  .touche-pave{
    min-height:48px; border:none; border-radius:12px; font-size:1.25rem; font-weight:700;
    background:color-mix(in srgb, var(--couleur-soleil) 22%, white); color:var(--couleur-encre);
    box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-encre) 20%, white); touch-action:manipulation;
  }
  .touche-pave:active{ transform:translateY(2px); box-shadow:0 1px 0 color-mix(in srgb, var(--couleur-encre) 20%, white); }
  .touche-pave:disabled{ opacity:.6; }
  .touche-valider{ background:var(--couleur-menthe); color:#ffffff; box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-menthe) 60%, black 10%); }
  .touche-effacer{ background:var(--couleur-corail); color:#ffffff; box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-corail) 60%, black 10%); }

  /* ---- Diagramme à CONSTRUIRE : on clique une case pour monter la barre ----
     Deux zones distinctes et empilées, pour l'axe comme pour chaque colonne :
     la ZONE DE TRACÉ (graduations / cases, hauteur dictée par le nombre de
     cases) puis un PIED de hauteur FIXE qui accueille les légendes des
     abscisses. Les deux zones de tracé s'alignent alors par le haut et font la
     même hauteur : une graduation tombe toujours en face de sa case, quelles
     que soient la longueur des noms de catégories ou leur retour à la ligne. */
  :root{ --pied-diagramme:3.6rem; }
  /* La marge haute laisse la place au nombre le plus élevé, dont la moitié
     dépasse au-dessus de la zone de tracé depuis qu'il est posé sur son trait. */
  .diagramme-construction{ display:flex; align-items:flex-start; justify-content:center;
    margin:.9rem 0; overflow-x:auto; padding:.85rem .2rem .2rem; }
  .colonne-axe, .colonne-construction{ display:flex; flex-direction:column; align-items:center; }
  .axe-diagramme{ display:flex; flex-direction:column-reverse;
    /* Axe des ORDONNÉES : le bord droit de la colonne des graduations, donc
       exactement à la gauche de la zone de tracé et de sa hauteur. */
    border-right:1.5px solid color-mix(in srgb, var(--couleur-encre) 45%, white); }
  /* La bande garde la hauteur d'une case — c'est elle qui assure le rythme de
     l'échelle — mais le nombre est calé sur son bord HAUT, donc sur le trait
     de la graduation. */
  .axe-graduation{ position:relative; height:26px; }
  .valeur-graduation{ position:absolute; right:.3rem; top:0; transform:translateY(-50%);
    font-size:.72rem; font-weight:700; opacity:.55; line-height:1; white-space:nowrap; }
  /* Le quadrillage EST la grille des cases : bordures claires posées sur chaque
     case, donc toujours alignées avec la graduation, sans calcul de position.
     L'axe des ABSCISSES est porté par le bord HAUT du pied, et non par le bas
     de la pile : le pied a une hauteur fixe, sa bordure ne change donc rien à
     la hauteur de la zone de tracé — une bordure sur la pile, elle, ajouterait
     son épaisseur et décalerait à nouveau les cases sous les graduations.
     L'écart entre colonnes est une marge de la PILE, pas un `gap` du
     conteneur : les pieds se touchent et leurs bords forment un trait continu. */
  .pile-construction{ display:flex; flex-direction:column-reverse; margin:0 .25rem; }
  .case-construction{
    width:2.1rem; height:26px; box-sizing:border-box; padding:0; touch-action:manipulation;
    border:1px solid color-mix(in srgb, var(--couleur-encre) 10%, white);
    background:color-mix(in srgb, var(--couleur-encre) 2%, white);
  }
  .case-construction.remplie{ background:var(--c, var(--couleur-mandarine));
    border-color:color-mix(in srgb, var(--couleur-encre) 20%, transparent); }
  /* Le padding est INTÉRIEUR au pied : les légendes de deux colonnes voisines
     ne se touchent pas, alors que la bordure haute — le trait d'abscisse —
     court bien, elle, sur toute la largeur de la colonne. */
  .pied-colonne{ height:var(--pied-diagramme); flex:0 0 var(--pied-diagramme); width:100%;
    box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:.3rem 3px 0; overflow:hidden;
    border-top:1.5px solid color-mix(in srgb, var(--couleur-encre) 45%, white); }
  /* L'abscisse part de l'origine : elle ne court pas sous la colonne des
     graduations, qui est à gauche de l'axe des ordonnées. Dans le diagramme de
     LECTURE, c'est la zone de tracé (de hauteur fixée en pixels) qui porte
     l'abscisse — le pied n'en remet pas une seconde. */
  .colonne-axe .pied-colonne, .colonne-diagramme .pied-colonne{ border-top:none; }
  .colonne-construction .etiquette-colonne{ font-size:1.5rem; line-height:1.1; }
  /* ---- Diagramme de LECTURE : mêmes axes que le diagramme à construire ----
     Zone de tracé de hauteur fixe (posée en JS) + pied fixe pour les légendes.
     L'écart entre colonnes est un padding INTÉRIEUR et non un `gap` : les zones
     de tracé se touchent, et leurs bordures basses forment un axe des abscisses
     d'un seul tenant, exactement au pied des barres. */
  .diagramme{ display:flex; justify-content:center; margin:.9rem 0; overflow-x:auto; padding:.2rem 0; }
  .diagramme-corps{ display:flex; align-items:flex-start; }
  .colonne-diagramme{ display:flex; flex-direction:column; align-items:center; }
  /* `width:100%` est ce qui rend le trait continu : la colonne est parfois plus
     large que la barre (une légende un peu longue l'élargit), et une zone de
     tracé au gabarit de la seule barre laisserait autant de trous dans l'axe. */
  .zone-trace-lecture{
    width:100%; display:flex; align-items:flex-end; justify-content:center; box-sizing:border-box;
    padding:0 .55rem; border-bottom:1.5px solid color-mix(in srgb, var(--couleur-encre) 45%, white);
  }
  .zone-trace-lecture.porte-ordonnees{ border-left:1.5px solid color-mix(in srgb, var(--couleur-encre) 45%, white); }
  .pile-cases{ display:flex; flex-direction:column-reverse; gap:2px; min-height:2px; }
  .case-diagramme{
    width:1.7rem; height:14px; border-radius:3px; border:1.5px solid color-mix(in srgb, var(--couleur-encre) 20%, white);
    background:#ffffff;
  }
  .case-diagramme.remplie{ background:var(--c, var(--couleur-mandarine)); border-color:var(--c, var(--couleur-mandarine)); }
  .valeur-colonne{ font-weight:700; font-size:.95rem; min-height:1.2em; }
  .controles-colonne{ display:flex; gap:.3rem; }
  .bouton-case{
    min-width:34px; min-height:34px; border-radius:10px; border:2px solid var(--couleur-encre); background:#ffffff; font-weight:700;
  }
  .bouton-case:disabled{ opacity:.35; }
  .etiquette-colonne{ font-size:1.4rem; }
  .legende-colonne{ font-size:.68rem; opacity:.75; text-align:center; max-width:100%;
    line-height:1.05; overflow-wrap:anywhere; }

  /* ---- Tableau à double entrée ---- */
  .tableau-double{ width:100%; border-collapse:collapse; margin:.7rem 0; }
  .tableau-double th, .tableau-double td{ border:1.5px solid color-mix(in srgb, var(--couleur-encre) 15%, white); padding:.4rem; text-align:center; font-size:.9rem; }
  .tableau-double th{ background:color-mix(in srgb, var(--couleur-menthe) 14%, white); font-weight:700; }
  .tableau-double td.cellule-manquante input{
    width:3rem; min-height:2.2rem; border-radius:8px; border:2px solid var(--couleur-mandarine); text-align:center; font-family:inherit; font-size:1rem;
  }
  .tableau-double td.cellule-manquante input.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .tableau-double td.cellule-manquante input.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }

  /* ---- « Le grand tableau » : rangement libre puis correction ----
     Le tableau ne contient pas des nombres mais les OBJETS EUX-MÊMES : c'est
     ce qui permet de voir d'un coup d'œil quel objet est mal rangé, et de
     compter le contenu d'une case pour répondre à la question finale. */
  .tableau-placement{ width:100%; border-collapse:collapse; margin:.55rem 0; table-layout:fixed; }
  .tableau-placement th, .tableau-placement td{
    border:2px solid color-mix(in srgb, var(--couleur-encre) 18%, white); padding:.22rem; text-align:center; }
  .tableau-placement thead th{ background:color-mix(in srgb, var(--couleur-menthe) 14%, white); font-size:.8rem; }
  .tableau-placement tbody th{ background:color-mix(in srgb, var(--couleur-menthe) 8%, white); font-size:.72rem; width:4.4rem; }
  .entete-axe{ display:flex; flex-direction:column; align-items:center; gap:.1rem; line-height:1.15; }
  .entete-axe .objet-dessin{ width:1.8rem; height:1.8rem; }
  .nom-teinte{ font-weight:700; }
  .cellule-placement{ background:#ffffff; cursor:pointer; height:3.3rem; vertical-align:middle; }
  .cellule-placement:active{ background:color-mix(in srgb, var(--couleur-mandarine) 14%, white); }
  .contenu-cellule{ display:flex; flex-wrap:wrap; gap:2px; align-items:center; justify-content:center; min-height:2.3rem; }

  /* Le dessin porte lui-même la couleur (corps de l'oiseau, pétales de la
     fleur, chapeau du champignon) : aucune pastille n'est apposée à côté. */
  .objet-dessin{ display:block; width:1.9rem; height:1.9rem; }
  .pool-objets{ display:flex; flex-wrap:wrap; gap:.35rem; justify-content:center; padding:.45rem; border-radius:14px;
    border:2px dashed color-mix(in srgb, var(--couleur-encre) 20%, white); min-height:3.4rem; margin-bottom:.55rem;
    align-items:center; }
  .pool-objets.vide::after{ content:'Tout est rangé : vérifie ton tableau !'; font-size:.85rem; opacity:.6; }
  .jeton-objet{
    min-width:46px; min-height:46px; padding:.15rem; display:flex; align-items:center; justify-content:center;
    background:#ffffff; border-radius:13px; border:2.5px solid color-mix(in srgb, var(--couleur-encre) 15%, white); }
  .jeton-objet .objet-dessin{ width:2.1rem; height:2.1rem; }
  .jeton-objet.selectionnee{ border-color:var(--couleur-mandarine); box-shadow:0 0 0 3px color-mix(in srgb, var(--couleur-mandarine) 30%, transparent); }
  .objet-mini{ padding:1px; line-height:0; background:transparent; border:2px solid transparent; border-radius:8px; }
  .objet-mini .objet-dessin{ width:1.45rem; height:1.45rem; }
  /* CHARTE §18 : la case fautive en rouge, la case attendue en vert, et
     l'objet mal rangé lui-même entouré de rouge pour qu'on sache LEQUEL bouger. */
  .objet-mini.mal-place{ border-color:var(--couleur-corail); background:color-mix(in srgb, var(--couleur-corail) 26%, white); }
  .cellule-placement.case-fausse{ background:color-mix(in srgb, var(--couleur-corail) 20%, white);
    outline:3px solid var(--couleur-corail); outline-offset:-3px; }
  .cellule-placement.case-attendue{ background:color-mix(in srgb, var(--couleur-menthe) 26%, white);
    outline:3px solid var(--couleur-menthe); outline-offset:-3px; }
  /* Glisser-déposer : le jeton d'origine s'estompe, un fantôme suit le doigt
     (hors flux et transparent aux événements, sinon il se désignerait lui-même
     comme cible), et la case survolée s'annonce avant le relâchement. */
  .jeton-objet, .objet-mini{ touch-action:none; }
  .jeton-objet.en-glisse, .objet-mini.en-glisse{ opacity:.3; }
  .jeton-fantome{
    position:fixed; z-index:1200; pointer-events:none; transform:translate(-50%,-50%);
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));
  }
  .jeton-fantome .objet-dessin{ width:2.7rem; height:2.7rem; }
  .cellule-placement.cible-survolee{ background:color-mix(in srgb, var(--couleur-mandarine) 20%, white);
    outline:3px dashed var(--couleur-mandarine); outline-offset:-3px; }
  /* Le vivier lui aussi accepte un objet glissé — depuis le tableau, pour le
     reprendre. */
  .pool-objets.cible-survolee{ background:color-mix(in srgb, var(--couleur-mandarine) 14%, white);
    border-color:var(--couleur-mandarine); border-style:solid; }
  .tableau-placement.verrouille .cellule-placement{ cursor:default; }
  .note-rangement{ text-align:center; font-size:.88rem; font-weight:600; margin:.3rem 0 .1rem; }
  .note-rangement.erreur{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .note-rangement.reussite{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 25%); }

  /* ---- Lecture (QCM) ---- */
  .grille-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-top:.7rem; }
  @media (max-width:340px){ .grille-options{ grid-template-columns:1fr; } }
  .bouton-option{
    min-height:3.2rem; border-radius:16px; border:2.5px solid var(--couleur-encre); background:#ffffff;
    display:flex; align-items:center; justify-content:center; padding:.5rem; font-size:.95rem; font-weight:600; text-align:center;
  }
  .bouton-option:disabled{ opacity:.6; }
  .bouton-option.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .bouton-option.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }

  /* confettis */
  #confettis-conteneur{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
  .confetti{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
    animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards; }
  @keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
  @media (prefers-reduced-motion:reduce){ .confetti{ display:none; animation:none; } }

  [hidden]{ display:none !important; }
</style>

<script>
(function () {
  'use strict';

  const donnees = JSON.parse(document.getElementById('donnees-jeu').textContent);
  const ORDRE_PALIERS = ['CP', 'CE1', 'CE2'];

  /* ---------- Utilitaires génériques ---------- */

  function nombreAleatoire(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function choisir(tableau) { return tableau[Math.floor(Math.random() * tableau.length)]; }
  function melanger(tableau) {
    const copie = [...tableau];
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }
  function melangerOptions(options, indexCorrect) {
    const enveloppes = options.map((valeur, i) => ({ valeur, estCorrecte: i === indexCorrect }));
    const melangees = melanger(enveloppes);
    return {
      options: melangees.map((e) => e.valeur),
      indexCorrect: melangees.findIndex((e) => e.estCorrecte)
    };
  }
  function especesListe(n) {
    const ids = melanger(Object.keys(donnees.especes)).slice(0, n);
    return ids.map((id) => Object.assign({ id }, donnees.especes[id]));
  }
  // Élision : "de " + mot devient "d'" + mot devant une voyelle (ex. "d'abeilles").
  function deElision(mot) {
    return /^[aeiouyàâéèêëîïôöùûü]/i.test(mot) ? 'd’' + mot : 'de ' + mot;
  }

  /* Répartit `total` unités sur `nbParts` cases, chacune entre `mini` et `maxi`.
     Sert à remplir un tableau à double entrée dont l'effectif total est imposé
     par la progression (10 objets sur 4 cases, 15 sur 6) sans jamais laisser
     une case vide — une case vide rendrait la question finale triviale. */
  function repartir(total, nbParts, mini, maxi) {
    const parts = new Array(nbParts).fill(mini);
    let reste = total - mini * nbParts;
    let garde = 0;
    while (reste > 0 && garde++ < 2000) {
      const i = Math.floor(Math.random() * nbParts);
      if (parts[i] < maxi) { parts[i]++; reste--; }
    }
    return parts;
  }

  /* ---------- Étoiles : stockage sûr (mémoire + localStorage best-effort) ---------- */

  const CLE_STOCKAGE = 'mayeutik-m39-jardin-etoiles';
  let memoireEtoiles = null;

  function lireEtoiles() {
    if (memoireEtoiles === null) {
      memoireEtoiles = {};
      try {
        const brut = window.localStorage.getItem(CLE_STOCKAGE);
        if (brut) memoireEtoiles = JSON.parse(brut);
      } catch (e) {
        memoireEtoiles = {};
      }
    }
    return memoireEtoiles;
  }
  function enregistrerEtoiles(jeuId, valeur) {
    const tout = lireEtoiles();
    tout[jeuId] = Math.max(tout[jeuId] || 0, valeur);
    memoireEtoiles = tout;
    try {
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : les étoiles restent valables pour la session en cours.
    }
  }

  /* ---------- Palier bonus : révélation "paquet cadeau" (CHARTE §15, pattern
     générique réutilisable — cf. section « Palier bonus » du standard
     "Modules adaptatifs par niveau"). Une clé par module (comme les
     étoiles), un indicateur par PROFIL puis par PALIER CIBLE à l'intérieur :
     { [profilId]: { [palierCible]: true } }. Un module à 3 paliers (CP/CE1/
     CE2) a DEUX transitions bonus possibles (CP→CE1 puis CE1→CE2) : sans
     l'indexation par palier cible, ouvrir le premier paquet marquait le
     profil comme "déjà révélé" pour le module entier, et le second paquet
     (CE1→CE2) n'apparaissait plus jamais — bug corrigé ici.
     Stockage sûr (mémoire + localStorage best-effort, CHARTE §9). ---------- */
  const CLE_BONUS_REVELE = 'mayeutik-m39-bonus-revele';
  let memoireBonusRevele = null;
  function lireBonusRevele() {
    if (memoireBonusRevele === null) {
      memoireBonusRevele = {};
      try {
        const brut = window.localStorage.getItem(CLE_BONUS_REVELE);
        if (brut) memoireBonusRevele = JSON.parse(brut);
      } catch (e) {
        memoireBonusRevele = {};
      }
    }
    return memoireBonusRevele;
  }
  function bonusDejaRevele(profilId, palierCible) {
    const entree = lireBonusRevele()[profilId];
    return !!(entree && typeof entree === 'object' && entree[palierCible]);
  }
  function marquerBonusRevele(profilId, palierCible) {
    const tout = lireBonusRevele();
    if (!tout[profilId] || typeof tout[profilId] !== 'object') tout[profilId] = {};
    tout[profilId][palierCible] = true;
    memoireBonusRevele = tout;
    try {
      window.localStorage.setItem(CLE_BONUS_REVELE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : le paquet cadeau réapparaîtra à la prochaine visite.
    }
  }
  function creerEtoiles(valeur, max) {
    max = max || 3;
    const cont = document.createElement('span');
    cont.className = 'etoiles';
    for (let i = 1; i <= max; i++) {
      const s = document.createElement('span');
      s.className = 'etoile' + (i <= valeur ? ' pleine' : '');
      s.textContent = '★';
      cont.appendChild(s);
    }
    return cont;
  }
  function calculerEtoiles(score, total) {
    const pct = score / total;
    if (pct >= 1) return 3;
    if (pct >= 0.66) return 2;
    if (pct >= 0.33) return 1;
    return 0;
  }

  /* ---------- Profil actif : lecture du niveau (CHARTE §15) ---------- */
  /* Un jeu autonome ne peut pas importer js/profils.js de la coquille : il relit
     directement les mêmes clés partagées localStorage, en lecture seule. */

  const CLE_PROFILS = 'mayeutik-profils';
  const CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';

  function lireProfilActifId() {
    try {
      return window.localStorage.getItem(CLE_PROFIL_ACTIF) || 'p1';
    } catch (e) {
      return 'p1';
    }
  }
  function niveauDuProfilActif() {
    try {
      const brut = window.localStorage.getItem(CLE_PROFILS);
      if (!brut) return null;
      const profils = JSON.parse(brut);
      const actif = profils.find((p) => p.id === lireProfilActifId());
      return (actif && actif.niveau) || null;
    } catch (e) {
      return null;
    }
  }
  /* Lancement paramétré (CHARTE §16) : `?palier=ce1` dans l'URL — le niveau
     du POINT D'ENTRÉE cliqué dans la coquille (ex. carte affichée dans une
     section de niveau du menu, cf. js/app.js) prime sur le niveau du profil
     actif. Insensible à la casse ; absent, invalide, ou ne correspondant à
     aucun palier du module -> null, retombe silencieusement sur le
     comportement par défaut (jamais d'erreur visible). */
  function palierDepuisURL() {
    try {
      const brut = new URLSearchParams(window.location.search).get('palier');
      if (!brut) return null;
      const majuscule = brut.toUpperCase();
      return donnees.paliers[majuscule] ? majuscule : null;
    } catch (e) {
      return null;
    }
  }
  function palierParDefaut() {
    const palierURL = palierDepuisURL();
    if (palierURL) return palierURL;
    const niveau = niveauDuProfilActif();
    if (niveau && donnees.paliers[niveau]) return niveau;
    // Niveau absent/non couvert par ce module : on retombe sur le palier le plus bas (CHARTE §15).
    return ORDRE_PALIERS.find((n) => donnees.paliers[n]) || ORDRE_PALIERS[0];
  }

  /* ---------- Sessions : contrat de données v1 (CHARTE.md, section 11) ---------- */

  const CLE_SESSIONS = 'mayeutik-sessions';
  const MODULE_ID = 'M39';
  const MAX_SESSIONS_PAR_PROFIL = 500;

  let memoireSessions = null;

  function lireSessions() {
    if (memoireSessions === null) {
      memoireSessions = [];
      try {
        const brut = window.localStorage.getItem(CLE_SESSIONS);
        if (brut) memoireSessions = JSON.parse(brut);
      } catch (e) {
        memoireSessions = [];
      }
    }
    return memoireSessions;
  }
  function enregistrerSession(competence, score, total, duree) {
    const profilId = lireProfilActifId();
    const toutes = lireSessions();
    toutes.push({ profilId, module: MODULE_ID, competence, score, total, date: new Date().toISOString(), duree });
    let compteur = 0;
    for (let i = toutes.length - 1; i >= 0; i--) {
      if (toutes[i].profilId === profilId) {
        compteur++;
        if (compteur > MAX_SESSIONS_PAR_PROFIL) toutes.splice(i, 1);
      }
    }
    memoireSessions = toutes;
    try {
      window.localStorage.setItem(CLE_SESSIONS, JSON.stringify(toutes));
    } catch (e) {
      // localStorage indisponible : la session reste valable pour la session en cours.
    }
  }

  /*
   * Maîtrise locale d'un palier (CHARTE §15) : heuristique SIMPLIFIÉE propre à ce
   * jeu, pas le calcul officiel LSU (qui reste propriété de la coquille, cf.
   * js/statuts.js). Un mini-jeu est considéré « maîtrisé » si sa DERNIÈRE
   * session enregistrée atteint au moins 80 %. Le palier est maîtrisé quand
   * TOUS ses mini-jeux le sont.
   */
  const SEUIL_MAITRISE_LOCALE = 0.8;
  function palierMaitrise(palierNom) {
    const palier = donnees.paliers[palierNom];
    if (!palier) return false;
    const profilId = lireProfilActifId();
    const sessions = lireSessions().filter((s) => s.profilId === profilId && s.module === MODULE_ID);
    return palier.miniJeux.every((mj) => {
      const dernieres = sessions.filter((s) => s.competence === mj.id);
      if (!dernieres.length) return false;
      const derniere = dernieres[dernieres.length - 1];
      return derniere.total > 0 && (derniere.score / derniere.total) >= SEUIL_MAITRISE_LOCALE;
    });
  }
  function palierSuivant(palierNom) {
    const i = ORDRE_PALIERS.indexOf(palierNom);
    if (i === -1 || i === ORDRE_PALIERS.length - 1) return null;
    const suivant = ORDRE_PALIERS[i + 1];
    return donnees.paliers[suivant] ? suivant : null;
  }

  /* ---------- Confettis (CHARTE.md, section 4) ---------- */

  function lancerConfettis() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const conteneur = document.getElementById('confettis-conteneur');
    const couleurs = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];
    const total = 36;
    for (let i = 0; i < total; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.backgroundColor = couleurs[Math.floor(Math.random() * couleurs.length)];
      p.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      p.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      conteneur.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
      setTimeout(() => p.remove(), 2500);
    }
  }

  /* ---------- Feedback sonore (Web Audio) ---------- */

  let contexteAudio = null;
  function obtenirContexteAudio() {
    if (!contexteAudio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      contexteAudio = new Ctx();
    }
    if (contexteAudio.state === 'suspended') contexteAudio.resume();
    return contexteAudio;
  }
  /* ---------- Pavé numérique diégétique (composant de la charte) ----------
     Reprise à l'identique du composant des autres modules : jamais de champ de
     saisie brut pour un nombre, l'enfant compose sa réponse au pavé. Chaque
     appui sonne, comme dans M99, pour que le geste soit confirmé même quand la
     valeur saisie ne change pas de largeur à l'écran. */
  function creerPave(onValider, maxChiffres) {
    const cap = maxChiffres || 2;
    const conteneur = document.createElement('div');
    conteneur.className = 'pave-numerique';
    const ecran = document.createElement('div');
    ecran.className = 'pave-ecran';
    ecran.textContent = ' ';
    const grille = document.createElement('div');
    grille.className = 'pave-grille';
    let val = '';
    const maj = () => { ecran.textContent = val || ' '; };
    ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'C', '0', '✓'].forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'touche-pave'; b.textContent = t;
      if (t === '✓') b.classList.add('touche-valider');
      if (t === 'C') b.classList.add('touche-effacer');
      b.addEventListener('click', () => {
        if (t === 'C') { val = ''; maj(); jouerSon('tic'); }
        else if (t === '✓') { if (val !== '') onValider(parseInt(val, 10)); }
        else if (val.length < cap) { val += t; maj(); jouerSon('tic'); }
      });
      grille.appendChild(b);
    });
    conteneur.appendChild(ecran);
    conteneur.appendChild(grille);
    return {
      el: conteneur,
      vider: () => { val = ''; maj(); },
      verrouiller: (v) => grille.querySelectorAll('button').forEach((b) => { b.disabled = v; })
    };
  }

  /* ---------- Composant sonore partagé (CHARTE §5) ----------
     Mêmes sons dans toute la série, générés à l'oscillateur : aucun fichier
     audio, donc aucune dépendance réseau. */

  /* Une note pure, avec une attaque douce et une extinction exponentielle —
     un créneau brutal « claquerait » sur les petits haut-parleurs. */
  function jouerNote(ctx, freq, debut, duree, volume, forme) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = forme || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, debut);
    gain.gain.exponentialRampToValueAtTime(volume, debut + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
    osc.connect(gain).connect(ctx.destination);
    osc.start(debut);
    osc.stop(debut + duree + 0.02);
  }

  /* SON DE RÉFÉRENCE de la bonne réponse : arpège de do majeur, quatre notes
     brèves qui montent (~0.45 s). Court et enjoué, il accompagne les confettis
     sans les retarder. */
  const NOTES_BONNE_REPONSE = [523.25, 659.25, 783.99, 1046.5]; // do5 mi5 sol5 do6

  function sonBonneReponse() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    NOTES_BONNE_REPONSE.forEach((f, i) => jouerNote(ctx, f, t0 + i * 0.11, 0.11, 0.22));
  }

  /* FIN DE NIVEAU PARFAITE (3 étoiles) : même famille sonore, pour qu'on la
     reconnaisse, mais nettement plus ample — l'arpège monte deux notes plus
     haut, puis se pose sur un accord tenu (~1.4 s en tout). C'est la durée et
     l'accord final, plus que la hauteur, qui le rendent perceptiblement plus
     marquant que la bonne réponse ponctuelle. */
  const NOTES_NIVEAU_PARFAIT = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98];
  const ACCORD_NIVEAU_PARFAIT = [523.25, 659.25, 783.99, 1046.5]; // do majeur tenu

  function sonNiveauParfait() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    const pas = 0.1;
    NOTES_NIVEAU_PARFAIT.forEach((f, i) => jouerNote(ctx, f, t0 + i * pas, 0.12, 0.2));
    // Accord final, plus doux que les notes de l'arpège pour ne pas saturer :
    // quatre voix simultanées s'additionnent.
    const tAccord = t0 + NOTES_NIVEAU_PARFAIT.length * pas + 0.04;
    ACCORD_NIVEAU_PARFAIT.forEach((f) => jouerNote(ctx, f, tAccord, 0.75, 0.12, 'triangle'));
  }

  function sonErreur() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    [392.0, 293.66].forEach((f, i) => jouerNote(ctx, f, t0 + i * 0.17, 0.17, 0.22));
  }

  /* Clic discret de manipulation (pose d'un jeton, d'un lien...). */
  function sonTic() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    jouerNote(ctx, 880, ctx.currentTime, 0.08, 0.12);
  }

  /* Aiguillage historique conservé : les modules appellent jouerSon('bravo'),
     ('rate'), ('tic') en de nombreux endroits. */
  function jouerSon(type) {
    if (type === 'bravo') return sonBonneReponse();
    if (type === 'parfait') return sonNiveauParfait();
    if (type === 'tic') return sonTic();
    return sonErreur();
  }

  /* ---------- Consigne lue à voix haute (SpeechSynthesis, utile aussi en CE1/CE2) ---------- */

  /* Choix de la voix. Sans voix explicitement demandée, le navigateur prend la
     voix PAR DÉFAUT de la langue — presque toujours la plus basique, au rendu
     très mécanique. Or la plupart des appareils embarquent aussi des voix de
     bien meilleure facture, gratuites et DÉJÀ INSTALLÉES : « Enhanced » et
     « Premium » sur iOS/macOS, « Neural »/« Natural » sur Windows et Android.
     On les repère à leur nom et on les préfère. Tout reste local : rien n'est
     téléchargé, aucun service distant n'est appelé (cf. autonomie des jeux). */
  const VOIX_QUALITE = /(enhanced|premium|neural|natural|siri|wavenet|studio)/i;
  // Voix françaises réputées les plus agréables selon les plateformes, quand
  // aucun marqueur de qualité n'apparaît dans le nom.
  const VOIX_FR_SOIGNEES = /(am[ée]lie|thomas|audrey|aur[ée]lie|c[ée]line|marie)/i;

  /* Débit légèrement ralenti : la consigne s'adresse à un enfant qui ne lit pas
     encore, et un débit posé fait plus pour le naturel perçu que n'importe quel
     autre réglage. La HAUTEUR reste à sa valeur naturelle (1) : la déplacer est
     appliqué comme une transformation par-dessus la voix, et c'est le réglage
     qui risque le plus de réintroduire le côté métallique qu'on cherche
     justement à supprimer. Les deux valeurs sont ici pour être ajustées d'un
     seul endroit si l'oreille en décide autrement. */
  const DEBIT_VOIX = 0.92;
  const HAUTEUR_VOIX = 1;

  let voixRetenue = null;

  function scoreVoix(voix) {
    const nom = voix.name || '';
    let score = 0;
    if (VOIX_QUALITE.test(nom)) score += 8;       // voix haut de gamme annoncée
    if (VOIX_FR_SOIGNEES.test(nom)) score += 3;   // voix française réputée
    if (/^fr[-_]fr$/i.test(voix.lang || '')) score += 2; // accent de France
    if (voix.localService) score += 1;            // embarquée : marche hors ligne
    if (voix.default) score += 0.5;               // départage
    return score;
  }

  /* La liste des voix se remplit de façon ASYNCHRONE sur plusieurs navigateurs :
     un premier appel peut renvoyer une liste vide. On recalcule donc à chaque
     lecture (et à chaque `voiceschanged`), en conservant la meilleure voix déjà
     trouvée tant que la liste est momentanément vide. */
  function voixFrancaises() {
    if (!window.speechSynthesis || !window.speechSynthesis.getVoices) return [];
    const toutes = window.speechSynthesis.getVoices() || [];
    return toutes.filter((v) => /^fr([-_]|$)/i.test(v.lang || ''));
  }

  function voixPreferee() {
    try {
      const francaises = voixFrancaises();
      if (!francaises.length) return voixRetenue; // liste pas encore chargée
      const meilleure = francaises.slice().sort((a, b) => scoreVoix(b) - scoreVoix(a))[0];
      if (meilleure) voixRetenue = meilleure;
      return voixRetenue;
    } catch (e) {
      return voixRetenue; // aucune voix exploitable : on laissera le navigateur choisir
    }
  }

  /* Meilleure voix EMBARQUÉE (sans réseau). Certaines des plus belles voix sont
     servies en ligne (« … Online (Natural) » sous Windows) : excellentes quand
     la connexion est là, muettes sans elle. On garde donc sous la main de quoi
     relire hors ligne — les jeux doivent rester utilisables sans réseau. */
  function voixLocale() {
    try {
      const locales = voixFrancaises().filter((v) => v.localService);
      if (!locales.length) return null;
      return locales.slice().sort((a, b) => scoreVoix(b) - scoreVoix(a))[0];
    } catch (e) {
      return null;
    }
  }

  try {
    if (window.speechSynthesis) {
      voixPreferee(); // amorce le chargement là où getVoices() le déclenche
      if ('onvoiceschanged' in window.speechSynthesis) {
        window.speechSynthesis.addEventListener('voiceschanged', voixPreferee);
      }
    }
  } catch (e) { /* synthèse vocale indisponible : rien à préparer */ }

  function lireAVoixHaute(texte) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      // Aucune voix française trouvée : on s'en remet au navigateur via `lang`,
      // exactement comme avant — la consigne reste lue, sans erreur.
      const voix = voixPreferee();
      if (voix) {
        u.voice = voix;
        if (voix.lang) u.lang = voix.lang;
      }
      u.rate = DEBIT_VOIX;
      u.pitch = HAUTEUR_VOIX;
      // Voix distante injoignable (hors ligne) : on relit UNE fois avec la
      // meilleure voix embarquée. On ignore les erreurs d'interruption, qui
      // signalent seulement qu'une lecture a été coupée par la suivante.
      if (voix && voix.localService === false) {
        u.onerror = (ev) => {
          const cause = ev && ev.error;
          if (cause === 'canceled' || cause === 'interrupted') return;
          const secours = voixLocale();
          if (!secours) return;
          try {
            const u2 = new SpeechSynthesisUtterance(texte);
            u2.voice = secours;
            u2.lang = secours.lang || 'fr-FR';
            u2.rate = DEBIT_VOIX;
            u2.pitch = HAUTEUR_VOIX;
            window.speechSynthesis.speak(u2);
          } catch (e2) { /* on renonce : la consigne reste lisible à l'écran */ }
        };
      }
      window.speechSynthesis.speak(u);
    } catch (e) {
      // synthèse vocale indisponible : la consigne reste lisible à l'écran.
    }
  }
  function creerBlocConsigne(texte, texteVoix) {
    const cont = document.createElement('div');
    cont.className = 'bloc-consigne';
    const p = document.createElement('p');
    p.className = 'consigne';
    p.textContent = texte;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bouton-son';
    btn.setAttribute('aria-label', 'Écouter la consigne');
    btn.textContent = '🔊';
    const texteALire = texteVoix || texte;
    btn.addEventListener('click', () => lireAVoixHaute(texteALire));
    cont.appendChild(p);
    cont.appendChild(btn);
    lireAVoixHaute(texteALire);
    return cont;
  }

  /* ================================================================
     Primitives d'affichage réutilisées par plusieurs mini-jeux
     ================================================================ */

  const COULEUR_PAR_INDICE = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];

  /* ---------- Objets dessinés, colorés dans le dessin ----------
     Un tableau à double entrée « forme × couleur » ne tient debout que si la
     couleur appartient VRAIMENT à l'objet. Une pastille posée à côté du dessin
     ferait deux informations juxtaposées, et l'enfant croiserait un dessin avec
     une pastille au lieu de croiser une forme avec une couleur. Ici la teinte
     remplit le corps de l'oiseau, les pétales de la fleur, le chapeau du
     champignon ; les nuances secondaires (aile, oreille, anse) en dérivent, si
     bien que l'objet se lit comme un tout coloré. */

  const SVGNS = 'http://www.w3.org/2000/svg';

  function melangeHex(hex, vers, part) {
    const lire = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16));
    const a = lire(hex);
    const b = lire(vers);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * part).toString(16).padStart(2, '0')).join('');
  }
  const assombrir = (hex, part) => melangeHex(hex, '#000000', part);
  const eclaircir = (hex, part) => melangeHex(hex, '#ffffff', part);

  function elSvg(nom, attrs) {
    const el = document.createElementNS(SVGNS, nom);
    Object.keys(attrs).forEach((k) => el.setAttribute(k, attrs[k]));
    return el;
  }

  /* Teinte « non peinte » des en-têtes : l'en-tête désigne la SORTE d'objet,
     pas une couleur ; le dessiner en gris évite de suggérer une case. */
  const TEINTE_NEUTRE = '#B4ADA3';

  function dessinerObjet(forme, hex) {
    const svg = elSvg('svg', { viewBox: '0 0 40 40', class: 'objet-dessin', focusable: 'false' });
    svg.setAttribute('aria-hidden', 'true');
    const sombre = assombrir(hex, 0.28);
    const clair = eclaircir(hex, 0.38);
    const poser = (nom, attrs) => svg.appendChild(elSvg(nom, attrs));

    if (forme === 'oiseau') {
      poser('line', { x1: 18, y1: 31, x2: 16, y2: 37, stroke: '#C98A2E', 'stroke-width': 2, 'stroke-linecap': 'round' });
      poser('line', { x1: 23, y1: 31, x2: 25, y2: 37, stroke: '#C98A2E', 'stroke-width': 2, 'stroke-linecap': 'round' });
      poser('ellipse', { cx: 19, cy: 23, rx: 12, ry: 9, fill: hex });
      poser('circle', { cx: 29, cy: 13, r: 7, fill: hex });
      poser('ellipse', { cx: 17, cy: 23, rx: 7, ry: 4.5, fill: sombre, transform: 'rotate(-18 17 23)' });
      poser('polygon', { points: '35,12 40,15 35,17', fill: '#F2A03D' });
      poser('circle', { cx: 30, cy: 11, r: 1.7, fill: '#2B2B2B' });
    } else if (forme === 'souris') {
      poser('path', { d: 'M8 27 q-6 1 -4 8', stroke: sombre, 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round' });
      poser('circle', { cx: 29, cy: 13, r: 6.5, fill: clair });
      poser('circle', { cx: 29, cy: 13.5, r: 3.6, fill: eclaircir(hex, 0.68) });
      poser('ellipse', { cx: 18, cy: 26, rx: 12, ry: 8.5, fill: hex });
      poser('circle', { cx: 29, cy: 22, r: 7, fill: hex });
      poser('circle', { cx: 32, cy: 20, r: 1.6, fill: '#2B2B2B' });
      poser('circle', { cx: 36, cy: 23.5, r: 1.9, fill: '#E4849F' });
    } else if (forme === 'fleur') {
      poser('line', { x1: 20, y1: 18, x2: 20, y2: 37, stroke: '#4F9E4F', 'stroke-width': 2.6, 'stroke-linecap': 'round' });
      poser('ellipse', { cx: 26, cy: 29, rx: 5.5, ry: 2.8, fill: '#4F9E4F', transform: 'rotate(-22 26 29)' });
      for (let i = 0; i < 5; i++) {
        const angle = (-90 + i * 72) * Math.PI / 180;
        poser('circle', { cx: 20 + Math.cos(angle) * 7.4, cy: 16 + Math.sin(angle) * 7.4, r: 5.6, fill: hex });
      }
      poser('circle', { cx: 20, cy: 16, r: 4.4, fill: '#8A5A2B' });
    } else if (forme === 'seau') {
      // L'anse est tracée avant le seau (elle passe derrière le rebord) mais
      // doit culminer nettement au-dessus, sinon elle disparaît sous celui-ci.
      poser('path', { d: 'M11 15 Q20 -3 29 15', stroke: sombre, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' });
      poser('polygon', { points: '11,17 29,17 26,36 14,36', fill: hex });
      poser('rect', { x: 8.5, y: 13, width: 23, height: 5.4, rx: 2.4, fill: sombre });
      poser('polygon', { points: '15.5,20 18.5,20 16.5,33 14.5,33', fill: eclaircir(hex, 0.5), opacity: 0.85 });
    } else if (forme === 'papillon') {
      poser('ellipse', { cx: 11, cy: 16, rx: 9, ry: 7.5, fill: hex, transform: 'rotate(-18 11 16)' });
      poser('ellipse', { cx: 29, cy: 16, rx: 9, ry: 7.5, fill: hex, transform: 'rotate(18 29 16)' });
      poser('ellipse', { cx: 13, cy: 28, rx: 7, ry: 6, fill: clair, transform: 'rotate(-12 13 28)' });
      poser('ellipse', { cx: 27, cy: 28, rx: 7, ry: 6, fill: clair, transform: 'rotate(12 27 28)' });
      poser('circle', { cx: 10, cy: 15, r: 2.4, fill: sombre });
      poser('circle', { cx: 30, cy: 15, r: 2.4, fill: sombre });
      poser('ellipse', { cx: 20, cy: 22, rx: 2.3, ry: 10, fill: '#4A3A2A' });
      poser('path', { d: 'M20 13 q-3 -6 -8 -7', stroke: '#4A3A2A', 'stroke-width': 1.4, fill: 'none', 'stroke-linecap': 'round' });
      poser('path', { d: 'M20 13 q3 -6 8 -7', stroke: '#4A3A2A', 'stroke-width': 1.4, fill: 'none', 'stroke-linecap': 'round' });
    } else if (forme === 'champignon') {
      poser('path', { d: 'M15 21 L15 32 Q20 36 25 32 L25 21 Z', fill: '#F5E7CC', stroke: '#D9C39C', 'stroke-width': 1 });
      poser('path', { d: 'M4 23 A16 15 0 0 1 36 23 Z', fill: hex });
      poser('circle', { cx: 13, cy: 17, r: 2.6, fill: '#FFFFFF', opacity: 0.92 });
      poser('circle', { cx: 23, cy: 14, r: 2.2, fill: '#FFFFFF', opacity: 0.92 });
      poser('circle', { cx: 29, cy: 19, r: 2, fill: '#FFFFFF', opacity: 0.92 });
    }
    return svg;
  }

  /*
   * Diagramme en barres.
   * options:
   *  - colonnes: [{id, emoji, label}]
   *  - valeurs: {id: n} (comptage actuel affiché)
   *  - maxCases: hauteur maximale d'une colonne, en cases
   *  - uniteParCase: nombre d'individus représentés par une case (CE2 : peut différer de 1)
   *  - interactif: true -> boutons +/- par colonne (construction)
   *  - onChangement(id, nouvelleValeur): appelé en mode interactif
   *  - afficherValeur: true -> affiche le nombre au-dessus de chaque colonne (lecture)
   */
  /* Gabarit d'une case du diagramme de LECTURE, en pixels. La hauteur de la
     zone de tracé s'en déduit : elle doit être connue en JS pour y poser
     l'axe des abscisses, et rester identique à ce que la CSS dessine. */
  const CASE_LECTURE_H = 14;
  const CASE_LECTURE_GAP = 2;

  function construireDiagramme(options) {
    const { colonnes, valeurs, maxCases, uniteParCase, interactif, onChangement, afficherValeur } = options;
    const unite = uniteParCase || 1;
    const conteneur = document.createElement('div');
    conteneur.className = 'diagramme';

    /* Zone de tracé de HAUTEUR FIXE, commune à toutes les colonnes : c'est ce
       qui aligne le pied des barres entre elles et permet de poser un axe des
       abscisses continu. Sans cela, chaque colonne mesurait « barre + légende »
       et les bases des barres ne tombaient pas au même niveau. */
    const nbCasesMax = Math.max(1, ...colonnes.map((c) => Math.round((valeurs[c.id] || 0) / unite)));
    const hauteurTrace = nbCasesMax * (CASE_LECTURE_H + CASE_LECTURE_GAP) + CASE_LECTURE_GAP;

    const corps = document.createElement('div');
    corps.className = 'diagramme-corps';

    colonnes.forEach((col, i) => {
      const colDiv = document.createElement('div');
      colDiv.className = 'colonne-diagramme';
      colDiv.style.setProperty('--c', COULEUR_PAR_INDICE[i % COULEUR_PAR_INDICE.length]);

      const valeurTexte = document.createElement('div');
      valeurTexte.className = 'valeur-colonne';
      const valeurActuelle = valeurs[col.id] || 0;
      valeurTexte.textContent = afficherValeur ? String(valeurActuelle) : '';

      const zoneTrace = document.createElement('div');
      zoneTrace.className = 'zone-trace-lecture';
      zoneTrace.style.height = hauteurTrace + 'px';

      const pile = document.createElement('div');
      pile.className = 'pile-cases';
      const nbCases = Math.round(valeurActuelle / unite);
      for (let c = 0; c < nbCases; c++) {
        const caseEl = document.createElement('div');
        caseEl.className = 'case-diagramme remplie';
        pile.appendChild(caseEl);
      }
      if (nbCases === 0) {
        const vide = document.createElement('div');
        vide.className = 'case-diagramme';
        vide.style.visibility = 'hidden';
        pile.appendChild(vide);
      }
      zoneTrace.appendChild(pile);

      const pied = document.createElement('div');
      pied.className = 'pied-colonne';
      const etiquette = document.createElement('div');
      etiquette.className = 'etiquette-colonne';
      etiquette.textContent = col.emoji;

      const legende = document.createElement('div');
      legende.className = 'legende-colonne';
      legende.textContent = col.label;

      pied.appendChild(etiquette);
      pied.appendChild(legende);

      colDiv.appendChild(valeurTexte);
      colDiv.appendChild(zoneTrace);
      colDiv.appendChild(pied);

      if (interactif) {
        const controles = document.createElement('div');
        controles.className = 'controles-colonne';
        const moins = document.createElement('button');
        moins.type = 'button'; moins.className = 'bouton-case'; moins.textContent = '−';
        moins.setAttribute('aria-label', 'Retirer une case ' + col.label);
        const plus = document.createElement('button');
        plus.type = 'button'; plus.className = 'bouton-case'; plus.textContent = '+';
        plus.setAttribute('aria-label', 'Ajouter une case ' + col.label);
        const cap = maxCases || 20;
        function maj() {
          moins.disabled = (valeurs[col.id] || 0) <= 0;
          plus.disabled = (valeurs[col.id] || 0) >= cap;
        }
        plus.addEventListener('click', () => { valeurs[col.id] = (valeurs[col.id] || 0) + unite; onChangement(col.id, valeurs[col.id]); });
        moins.addEventListener('click', () => { valeurs[col.id] = Math.max(0, (valeurs[col.id] || 0) - unite); onChangement(col.id, valeurs[col.id]); });
        maj();
        controles.appendChild(moins);
        controles.appendChild(plus);
        colDiv.appendChild(controles);
      }

      /* Les deux axes sont des BORDURES de la zone de tracé, pas des traits
         posés par-dessus : l'abscisse est le bord bas de chaque zone, et comme
         les colonnes se touchent (l'écart est un padding intérieur, pas un
         gap), ces bords se rejoignent en une ligne continue à la hauteur exacte
         du pied des barres. L'ordonnée est le bord gauche de la première zone.
         Aucun calcul de position, donc aucun désalignement possible. */
      if (i === 0) zoneTrace.classList.add('porte-ordonnees');

      corps.appendChild(colDiv);
    });

    conteneur.appendChild(corps);
    return conteneur;
  }

  /*
   * Tableau à double entrée.
   * options:
   *  - lignes: [{id, emoji, label}], colonnes: [{id, label}]
   *  - valeurs: {ligneId: {colonneId: n}}
   *  - cellulesMasquees: Set('ligneId|colonneId') -> saisie numérique (mode complétion)
   */
  function construireTableauDouble(options) {
    const { lignes, colonnes, valeurs, cellulesMasquees } = options;
    const table = document.createElement('table');
    table.className = 'tableau-double';
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    trHead.appendChild(document.createElement('th'));
    colonnes.forEach((col) => {
      const th = document.createElement('th');
      th.textContent = col.label;
      // Une colonne de couleur s'annonce dans sa teinte, assombrie pour rester
      // lisible sur blanc — même convention que « Le grand tableau ».
      if (col.teinte) th.style.color = assombrir(col.teinte, 0.3);
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    lignes.forEach((ligne) => {
      const tr = document.createElement('tr');
      const thLigne = document.createElement('th');
      thLigne.textContent = (ligne.emoji ? ligne.emoji + ' ' : '') + ligne.label;
      tr.appendChild(thLigne);
      colonnes.forEach((col) => {
        const td = document.createElement('td');
        const cle = ligne.id + '|' + col.id;
        const valeur = (valeurs[ligne.id] && valeurs[ligne.id][col.id]) || 0;
        if (cellulesMasquees && cellulesMasquees.has(cle)) {
          td.className = 'cellule-manquante';
          const input = document.createElement('input');
          input.type = 'number';
          input.min = '0';
          input.inputMode = 'numeric';
          input.setAttribute('aria-label', 'Complète : ' + ligne.label + ' × ' + col.label);
          input.dataset.ligne = ligne.id;
          input.dataset.colonne = col.id;
          td.appendChild(input);
        } else {
          td.textContent = String(valeur);
        }
        td.dataset.ligne = ligne.id;
        td.dataset.colonne = col.id;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  /* ================================================================
     Contrôleur général de jeu
     ================================================================ */

  let etatPalierAffiche = palierParDefaut();
  let etat = null; // { miniJeuId, palier, index, score, verrouille, demarreLe }

  function trouverMiniJeu(id) {
    for (const nom of ORDRE_PALIERS) {
      const palier = donnees.paliers[nom];
      if (!palier) continue;
      const trouve = palier.miniJeux.find((mj) => mj.id === id);
      if (trouve) return { cfg: trouve, palier: nom };
    }
    return null;
  }

  function construireCarteJeu(cfg) {
    const carte = document.createElement('button');
    carte.className = 'carte-jeu carte-' + cfg.couleur;
    carte.dataset.jeu = cfg.id;
    const icone = document.createElement('div');
    icone.className = 'icone';
    icone.textContent = cfg.icone;
    const titre = document.createElement('h2');
    titre.textContent = cfg.titre;
    const desc = document.createElement('p');
    desc.textContent = cfg.description;
    const tout = lireEtoiles();
    const etoiles = creerEtoiles(tout[cfg.id] || 0);
    carte.appendChild(icone);
    carte.appendChild(titre);
    carte.appendChild(desc);
    carte.appendChild(etoiles);
    carte.addEventListener('click', () => demarrerJeu(cfg.id));
    return carte;
  }

  /* Remonte en haut à chaque changement d'écran (CHARTE §17) : sans cela, le
     nouvel écran hérite du défilement de l'écran précédent — l'enfant qui
     vient de valider en bas de page se retrouverait au milieu de la manche
     suivante. Repositionnement instantané (jamais « smooth » : un glissement
     animé pendant une transition est parasite). */
  function remonterEnHaut() {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) {
      window.scrollTo(0, 0); // navigateurs sans l'API à options
    }
  }

  /* Navigation automatique après un délai (CHARTE §20) : 2 s après l'affichage
     du bouton « Suivant », on avance sans attendre le clic de l'enfant. Un
     clic manuel ou une sortie du jeu annulent ce minuteur. */
  const DELAI_AUTO_SUIVANT = 2000;
  let minuteurAutoSuivant = null;
  function armerAutoSuivant() {
    clearTimeout(minuteurAutoSuivant);
    const bouton = document.getElementById('bouton-suivant');
    minuteurAutoSuivant = setTimeout(() => {
      if (bouton.hidden || bouton.disabled || !bouton.isConnected) return;
      bouton.click();
    }, DELAI_AUTO_SUIVANT);
  }
  function desarmerAutoSuivant() {
    clearTimeout(minuteurAutoSuivant);
  }

  /* Correction après une MAUVAISE réponse (CHARTE §18) : ce que l'enfant a
     répondu en rouge, ce qu'il fallait répondre en vert. N'est jamais appelée
     sur une bonne réponse (elle brouillerait la récompense). */
  function afficherCorrection(zone, donnee, attendue) {
    const bloc = document.createElement('p');
    bloc.className = 'bloc-correction';
    if (donnee !== null && donnee !== undefined && donnee !== '') {
      const d = document.createElement('span');
      d.className = 'correction-donnee';
      d.textContent = 'Ta réponse : ' + donnee;
      bloc.appendChild(d);
      bloc.appendChild(document.createTextNode(' — '));
    }
    const a = document.createElement('span');
    a.className = 'correction-attendue';
    a.textContent = 'La bonne réponse : ' + attendue;
    bloc.appendChild(a);
    zone.appendChild(bloc);
    return bloc;
  }

  function construireAccueil() {
    document.getElementById('sous-titre-accueil').textContent = donnees.sousTitre;

    const rangee = document.getElementById('rangee-paliers');
    rangee.innerHTML = '';
    ORDRE_PALIERS.filter((n) => donnees.paliers[n]).forEach((n) => {
      const puce = document.createElement('button');
      puce.type = 'button';
      puce.className = 'puce-palier' + (n === etatPalierAffiche ? ' actif' : '');
      puce.textContent = n;
      puce.addEventListener('click', () => { etatPalierAffiche = n; construireAccueil(); });
      rangee.appendChild(puce);
    });
    const niveauProfil = niveauDuProfilActif();
    document.getElementById('note-palier').textContent = niveauProfil
      ? 'Niveau de ' + (niveauProfil === etatPalierAffiche ? 'ton profil' : 'ton profil : ' + niveauProfil + ' — tu regardes le palier ' + etatPalierAffiche)
      : '';

    const grille = document.getElementById('grille-jeux');
    grille.innerHTML = '';
    (donnees.paliers[etatPalierAffiche] ? donnees.paliers[etatPalierAffiche].miniJeux : [])
      .forEach((cfg) => grille.appendChild(construireCarteJeu(cfg)));

    /* Palier bonus (CHARTE §15) : uniquement si le palier courant est maîtrisé
       ET qu'un palier suivant existe. Première apparition du bonus pour ce
       profil : habillé en « paquet cadeau » tant qu'il n'a pas été ouvert
       (cf. ouvrirPaquetCadeau) ; ensuite affiché normalement à chaque visite. */
    const suivant = palierSuivant(etatPalierAffiche);
    const blocBonus = document.getElementById('bloc-bonus');
    const paquetCadeau = document.getElementById('paquet-cadeau');
    const grilleBonus = document.getElementById('grille-bonus');
    if (suivant && palierMaitrise(etatPalierAffiche)) {
      blocBonus.hidden = false;
      document.getElementById('note-bonus').textContent =
        'Tu maîtrises tout le palier ' + etatPalierAffiche + ' : essaie un aperçu du palier ' + suivant + ' !';
      grilleBonus.innerHTML = '';
      donnees.paliers[suivant].miniJeux.forEach((cfg) => grilleBonus.appendChild(construireCarteJeu(cfg)));

      const profilId = lireProfilActifId();
      if (bonusDejaRevele(profilId, suivant)) {
        paquetCadeau.hidden = true;
        grilleBonus.hidden = false;
      } else {
        paquetCadeau.hidden = false;
        paquetCadeau.disabled = false;
        paquetCadeau.classList.remove('paquet-cadeau-ouverture');
        grilleBonus.hidden = true;
        paquetCadeau.onclick = () => ouvrirPaquetCadeau(profilId, suivant, paquetCadeau, grilleBonus);
      }
    } else {
      blocBonus.hidden = true;
    }
  }

  /* Ouverture du paquet cadeau (une seule fois par profil ET par palier
     cible, cf. marquerBonusRevele) : confettis + petite animation
     d'explosion douce, puis le contenu du palier bonus est révélé
     normalement. */
  function ouvrirPaquetCadeau(profilId, palierCible, paquetCadeau, grilleBonus) {
    if (paquetCadeau.disabled) return;
    paquetCadeau.disabled = true;
    marquerBonusRevele(profilId, palierCible);
    lancerConfettis();
    jouerSon('bravo');
    paquetCadeau.classList.add('paquet-cadeau-ouverture');
    setTimeout(() => {
      paquetCadeau.hidden = true;
      grilleBonus.hidden = false;
    }, 480);
  }

  function retourAccueil() {
    desarmerAutoSuivant();
    if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    document.getElementById('ecran-jeu').hidden = true;
    document.getElementById('ecran-accueil').hidden = false;
    construireAccueil();
    remonterEnHaut();
  }

  function demarrerJeu(miniJeuId) {
    const trouve = trouverMiniJeu(miniJeuId);
    if (!trouve) return;
    etat = { miniJeuId, cfg: trouve.cfg, palier: trouve.palier, index: 0, score: 0, verrouille: false, demarreLe: Date.now(), donneesTour: null };
    document.getElementById('ecran-accueil').hidden = true;
    document.getElementById('ecran-jeu').hidden = false;
    document.getElementById('titre-jeu-courant').textContent = trouve.cfg.titre;
    tourSuivant();
    remonterEnHaut();
  }

  function majProgression() {
    document.getElementById('progression-jeu').textContent = 'Manche ' + etat.index + ' / ' + etat.cfg.nbTours;
  }

  function tourSuivant() {
    desarmerAutoSuivant();
    if (etat.index >= etat.cfg.nbTours) { afficherResultats(); return; }
    etat.index++;
    etat.verrouille = false;
    majProgression();
    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    document.getElementById('zone-feedback').textContent = '';
    document.getElementById('zone-feedback').className = 'feedback';
    document.getElementById('bouton-suivant').hidden = true;
    const type = etat.cfg.type;
    if (type === 'recueil-diagramme') genererRecueilDiagramme(zone, etat.cfg);
    else if (type === 'tableau-double-entree') genererTableauDoubleEntree(zone, etat.cfg);
    else if (type === 'lecture') genererLecture(zone, etat.cfg);
    else if (type === 'probleme-combine') genererProblemeCombine(zone, etat.cfg);
    else if (type === 'diagramme-completer') genererDiagrammeACompleter(zone, etat.cfg);
    else if (type === 'tableau-deduction') genererTableauDeduction(zone, etat.cfg);
    remonterEnHaut();
  }

  /* `correction` (facultatif) = { donnee, attendue } : affiché uniquement en cas
     d'erreur, sous le message de feedback (CHARTE §18). */
  function validerTour(estCorrecte, boutonAValider, correction) {
    if (etat.verrouille) return;
    etat.verrouille = true;
    if (boutonAValider) boutonAValider.disabled = true;
    const zoneFeedback = document.getElementById('zone-feedback');
    if (estCorrecte) {
      etat.score++;
      zoneFeedback.textContent = choisir(donnees.messagesFeedback.bravo);
      zoneFeedback.className = 'feedback feedback-succes';
      lancerConfettis();
      jouerSon('bravo');
    } else {
      zoneFeedback.textContent = choisir(donnees.messagesFeedback.rate);
      zoneFeedback.className = 'feedback feedback-erreur';
      jouerSon('rate');
      if (correction) afficherCorrection(zoneFeedback, correction.donnee, correction.attendue);
    }
    document.getElementById('bouton-suivant').hidden = false;
    armerAutoSuivant();
  }

  function afficherResultats() {
    const cfg = etat.cfg;
    document.getElementById('progression-jeu').textContent = 'Résultats';
    document.getElementById('bouton-suivant').hidden = true;
    document.getElementById('zone-feedback').textContent = '';
    const etoilesGagnees = calculerEtoiles(etat.score, cfg.nbTours);
    enregistrerEtoiles(cfg.id, etoilesGagnees);
    const dureeSecondes = Math.max(0, Math.round((Date.now() - etat.demarreLe) / 1000));
    /* L'identifiant du mini-jeu EST sa compétence dans ce module : deux
       exercices aussi différents que « compléter un diagramme » et « déduire
       dans un tableau » sont donc deux mini-jeux, et non deux phases d'un
       même, faute de quoi le suivi les mêlerait sous une note unique dont on
       ne saurait plus rien conclure. */
    enregistrerSession(cfg.id, etat.score, cfg.nbTours, dureeSecondes);
    // Résultat parfait : un son plus ample que celui d'une bonne réponse
    // ponctuelle, pour souligner ce qui est rare (CHARTE §5).
    if (etoilesGagnees === 3) sonNiveauParfait();

    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    const bloc = document.createElement('div');
    bloc.className = 'bloc-resultats';

    const titre = document.createElement('h3');
    titre.textContent = 'Fin du jeu !';

    const score = document.createElement('p');
    score.className = 'score-texte';
    score.textContent = etat.score + ' / ' + cfg.nbTours + ' manches réussies';

    const etoiles = creerEtoiles(etoilesGagnees);

    const boutons = document.createElement('div');
    boutons.className = 'boutons-resultats';

    const rejouer = document.createElement('button');
    rejouer.className = 'bouton-principal';
    rejouer.textContent = 'Rejouer';
    rejouer.addEventListener('click', () => demarrerJeu(cfg.id));

    const accueilBtn = document.createElement('button');
    accueilBtn.className = 'bouton-secondaire';
    accueilBtn.textContent = "Retour à l'accueil";
    accueilBtn.addEventListener('click', retourAccueil);

    boutons.appendChild(rejouer);
    boutons.appendChild(accueilBtn);

    bloc.appendChild(titre);
    bloc.appendChild(etoiles);
    bloc.appendChild(score);
    bloc.appendChild(boutons);
    zone.appendChild(bloc);

    if (etoilesGagnees === 3) lancerConfettis();
    remonterEnHaut();
  }

  /* ================================================================
     Mini-jeu : Recueil + diagramme (CP et CE1, gabarit partagé)
