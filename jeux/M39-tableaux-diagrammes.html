     ================================================================ */

  /* Diagramme à CONSTRUIRE case par case : l'enfant clique la case à la hauteur
     voulue et la barre monte jusque-là (recliquer la case du sommet la fait
     redescendre). Le quadrillage de fond n'est pas un décor : ce sont les
     bordures des cases elles-mêmes, donc toujours alignées avec la graduation
     de gauche — aucun risque de décalage entre le repère et ce qu'on clique.
     Convention du module : 1 case = 1 individu.

     ZONE DE TRACÉ ET PIED SÉPARÉS. Les légendes des abscisses (icône + nom de
     la catégorie) vivent dans un PIED de hauteur fixe, hors de la zone de
     tracé. Sans cette séparation, la colonne mesure « cases + légende » là où
     l'axe ne mesure que « graduations » : les deux étant alignés par le bas,
     l'axe se retrouvait poussé vers le bas de toute la hauteur des légendes
     (46 px mesurés), et les chiffres ne désignaient plus les bonnes cases.
     L'axe porte donc lui aussi un pied de même hauteur, et l'ensemble s'aligne
     par le HAUT : les deux zones de tracé partent du même y et font la même
     hauteur, la coïncidence est structurelle et ne dépend plus du contenu des
     légendes (nom long, retour à la ligne, icône plus haute). */
  function construireDiagrammeConstructible(options) {
    const { colonnes, valeurs, hauteurMax, onChangement, verrouillees } = options;
    // Colonnes déjà renseignées (données de l'énoncé) : elles se lisent mais ne
    // se modifient pas, seule la barre manquante est à construire.
    const estVerrouillee = (id) => !!(verrouillees && verrouillees.has(id));
    const wrap = document.createElement('div');
    wrap.className = 'diagramme-construction';
    /* Quand une partie des barres est donnée par l'énoncé, la barre à
       construire doit se distinguer : sans cela, quatre colonnes d'apparence
       identique n'indiquent pas où l'on attend un geste. */
    if (verrouillees && verrouillees.size) wrap.classList.add('diagramme-avec-donnees');
    // Permet de redessiner les barres après coup — utile pour révéler la bonne
    // hauteur au moment de la correction.
    const rafraichisseurs = [];
    wrap.rafraichir = () => rafraichisseurs.forEach((f) => f());

    const axe = document.createElement('div');
    axe.className = 'axe-diagramme';
    /* Le nombre est posé sur le TRAIT qui borne le haut de sa case, et non au
       milieu de la case : « 3 » désigne la hauteur atteinte quand la barre
       arrive à ce trait. Centré dans sa bande, il se lisait à mi-hauteur, donc
       entre deux traits — on ne savait plus quel repère il annonçait. Le texte
       est donc sorti du flux et son centre calé sur le haut de la bande. */
    for (let n = 1; n <= hauteurMax; n++) {
      const g = document.createElement('div');
      g.className = 'axe-graduation';
      const valeur = document.createElement('span');
      valeur.className = 'valeur-graduation';
      valeur.textContent = String(n);
      g.appendChild(valeur);
      axe.appendChild(g);
    }
    const colAxe = document.createElement('div');
    colAxe.className = 'colonne-axe';
    colAxe.appendChild(axe);
    colAxe.appendChild(Object.assign(document.createElement('div'), { className: 'pied-colonne' }));
    wrap.appendChild(colAxe);

    colonnes.forEach((col, i) => {
      const colDiv = document.createElement('div');
      colDiv.className = 'colonne-construction';
      colDiv.style.setProperty('--c', COULEUR_PAR_INDICE[i % COULEUR_PAR_INDICE.length]);

      const verrou = estVerrouillee(col.id);
      if (verrou) colDiv.classList.add('colonne-donnee');

      const pile = document.createElement('div');
      pile.className = 'pile-construction';
      const cases = [];
      for (let n = 1; n <= hauteurMax; n++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case-construction';
        b.disabled = verrou;
        b.setAttribute('aria-label', (verrou ? 'Donnée : ' : '') + col.label + ' : ' + n + (n > 1 ? ' cases' : ' case'));
        if (!verrou) {
          b.addEventListener('click', () => {
            if (etat.verrouille) return;
            // Recliquer la case du sommet redescend la barre d'un cran.
            valeurs[col.id] = (valeurs[col.id] === n) ? n - 1 : n;
            rendre();
            onChangement();
          });
        }
        cases.push(b);
        pile.appendChild(b);
      }
      function rendre() {
        cases.forEach((b, k) => b.classList.toggle('remplie', k < (valeurs[col.id] || 0)));
      }
      rendre();
      rafraichisseurs.push(rendre);

      const pied = document.createElement('div');
      pied.className = 'pied-colonne';
      const etiquette = document.createElement('div');
      etiquette.className = 'etiquette-colonne';
      etiquette.textContent = col.emoji;
      const legende = document.createElement('div');
      legende.className = 'legende-colonne';
      legende.textContent = col.label;
      pied.appendChild(etiquette);
      pied.appendChild(legende);

      colDiv.appendChild(pile);
      colDiv.appendChild(pied);
      wrap.appendChild(colDiv);
    });
    return wrap;
  }

  /* ================================================================
     Mini-jeu : Sondage du jardin — DEUX écrans d'un même exercice
     Écran 1 : compter les réponses une à une (marques de décompte), PUIS
       reporter soi-même chaque total au pavé numérique. Rien ne se remplit
       tout seul : ni le total pendant le comptage, ni la colonne de droite.
       C'est le report qui fait travailler le dénombrement, l'automatiser
       reviendrait à faire l'exercice à la place de l'enfant.
     Écran 2 : le tableau CORRECT est réaffiché comme référence (même si
       l'enfant s'est trompé au report), et il construit le diagramme en
       bâtons case par case.
     La manche n'est comptée juste que si les deux écrans le sont.
     ================================================================ */

  function genererRecueilDiagramme(zone, cfg) {
    const especes = especesListe(cfg.nbEspeces);
    const valeursVraies = {};
    /* Plafond de population : au CP, dénombrer au-delà de 15 sort de la plage
       raisonnable — et « une classe de 40 élèves » ne tiendrait pas debout. On
       tire donc les effectifs puis on les rabote tant que le total dépasse. */
    const totalMax = cfg.totalMax || 15;
    especes.forEach((e) => { valeursVraies[e.id] = nombreAleatoire(2, cfg.capParEspece); });
    const total = () => especes.reduce((s, e) => s + valeursVraies[e.id], 0);
    let garde = 0;
    while (total() > totalMax && garde++ < 200) {
      // On retire une unité à l'espèce la plus nombreuse, jamais en dessous de 1.
      const plusGrande = especes.slice().sort((a, b) => valeursVraies[b.id] - valeursVraies[a.id])[0];
      if (valeursVraies[plusGrande.id] <= 1) break;
      valeursVraies[plusGrande.id]--;
    }
    const nbEleves = total();

    let population = [];
    especes.forEach((e) => { for (let i = 0; i < valeursVraies[e.id]; i++) population.push(e.id); });
    population = melanger(population);

    /* Consigne SÉQUENCÉE : à l'écran, l'énoncé se limite au contexte, et la
       tâche du moment est portée par la légende d'étape, qui change quand
       l'étape change. Six lignes de texte d'un coup ne se lisent pas au CP —
       et surtout, la moitié concernait une étape pas encore commencée. La
       version lue à voix haute, elle, garde l'explication complète. */
    zone.appendChild(creerBlocConsigne(
      'Dans une classe de ' + nbEleves + ' élèves, chacun a choisi son insecte préféré.',
      'Dans une classe de ' + nbEleves + ' élèves, chacun a choisi son insecte préféré. '
      + 'Clique sur chaque petite bête pour la compter dans le tableau. Quand tu as tout compté, '
      + 'écris toi-même le total de chaque ligne avec le pavé numérique.'
    ));

    const zonePopulation = document.createElement('div');
    zonePopulation.className = 'population-jardin';
    const comptesActuels = {};
    especes.forEach((e) => { comptesActuels[e.id] = 0; });
    let nbComptees = 0;

    const tableauTally = document.createElement('table');
    tableauTally.className = 'tableau-tally';
    const theadTally = document.createElement('thead');
    theadTally.innerHTML = '<tr><th>Bête</th><th>Décompte</th><th>Total</th></tr>';
    tableauTally.appendChild(theadTally);
    const tbodyTally = document.createElement('tbody');
    const cellulesTally = {};
    especes.forEach((e) => {
      const tr = document.createElement('tr');
      const tdBete = document.createElement('td');
      tdBete.textContent = e.emoji + ' ' + e.pluriel;
      const tdMarques = document.createElement('td');
      tdMarques.className = 'tally-marques';
      const tdTotal = document.createElement('td');
      tdTotal.className = 'cellule-total';
      tdTotal.textContent = '';
      tr.appendChild(tdBete); tr.appendChild(tdMarques); tr.appendChild(tdTotal);
      tbodyTally.appendChild(tr);
      cellulesTally[e.id] = { marques: tdMarques, total: tdTotal };
    });
    tableauTally.appendChild(tbodyTally);

    /* Marques groupées par paquets de cinq (le cinquième barre le paquet) :
       c'est le groupement qui rend le total dénombrable, sinon autant compter
       les bêtes elles-mêmes une seconde fois. */
    function redessinerMarques(especeId) {
      const n = comptesActuels[especeId];
      const cell = cellulesTally[especeId].marques;
      cell.textContent = '';
      for (let debut = 0; debut < n; debut += 5) {
        const taille = Math.min(5, n - debut);
        const paquet = document.createElement('span');
        paquet.className = 'tally-paquet' + (taille === 5 ? ' complet' : '');
        paquet.textContent = '|'.repeat(taille);
        cell.appendChild(paquet);
      }
    }

    const legendeEtape = document.createElement('p');
    legendeEtape.className = 'legende';
    legendeEtape.textContent = 'Étape 1 : clique sur chaque bête pour la compter.';

    const zoneSaisie = document.createElement('div');

    population.forEach((especeId, i) => {
      const especeInfo = donnees.especes[especeId];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bete-population';
      btn.textContent = especeInfo.emoji;
      btn.setAttribute('aria-label', 'Compter ' + especeInfo.singulier + ' ' + (i + 1));
      btn.addEventListener('click', () => {
        if (btn.classList.contains('comptee') || etat.verrouille) return;
        btn.classList.add('comptee');
        comptesActuels[especeId]++;
        nbComptees++;
        redessinerMarques(especeId);
        // Aucun total affiché ici : c'est justement ce que l'enfant doit trouver.
        if (nbComptees === population.length) ouvrirReport();
      });
      zonePopulation.appendChild(btn);
    });

    zone.appendChild(zonePopulation);
    zone.appendChild(tableauTally);
    zone.appendChild(legendeEtape);
    zone.appendChild(zoneSaisie);

    /* ---- Étape B : report des totaux, puis UNE SEULE validation ----
       Le pavé n'évalue rien : sa touche ✓ écrit la valeur dans la ligne active,
       point. Tant que le bouton « Valider mes totaux » n'a pas été touché,
       l'enfant peut revenir sur n'importe quelle case pour la corriger — une
       vérification ligne par ligne lui livrerait la réponse des lignes suivantes
       et transformerait le report en suite de mini-questions. */
    const saisies = {};
    let especeEnCours = null;

    // Espace réservé d'emblée : le pavé et le bouton apparaissent à hauteur
    // constante, sans décaler le tableau sous les doigts.
    const invite = document.createElement('p');
    invite.className = 'legende';
    const pave = creerPave((valeur) => { if (especeEnCours) inscrire(especeEnCours, valeur); }, 2);
    const boutonTotaux = document.createElement('button');
    boutonTotaux.type = 'button';
    boutonTotaux.className = 'bouton-principal';
    boutonTotaux.textContent = 'Valider mes totaux';
    boutonTotaux.disabled = true;
    boutonTotaux.addEventListener('click', () => {
      if (especes.some((e) => saisies[e.id] === undefined)) return;
      terminerEcran1();
    });

    function ouvrirReport() {
      legendeEtape.textContent = 'Étape 2 : compte les marques et écris le total de chaque ligne.';
      especes.forEach((e) => {
        const cell = cellulesTally[e.id].total;
        cell.classList.add('a-saisir');
        cell.textContent = '?';
        // Une case déjà remplie reste cliquable : c'est ce qui permet de se
        // corriger avant la validation unique.
        cell.addEventListener('click', () => {
          if (etat.verrouille) return;
          choisirLigne(e);
        });
      });
      zoneSaisie.appendChild(invite);
      zoneSaisie.appendChild(pave.el);
      zoneSaisie.appendChild(boutonTotaux);
      choisirLigne(especes[0]);
    }

    function choisirLigne(espece) {
      especeEnCours = espece;
      especes.forEach((e) => cellulesTally[e.id].total.classList.toggle('active', e.id === espece.id));
      invite.textContent = 'Combien de ' + espece.pluriel + ' ' + espece.emoji + ' as-tu comptées ?';
      pave.vider();
    }

    function inscrire(espece, valeur) {
      saisies[espece.id] = valeur;
      const cell = cellulesTally[espece.id].total;
      cell.textContent = String(valeur);
      cell.classList.remove('a-saisir');
      cell.classList.add('saisi');
      // On enchaîne sur la première ligne encore vide ; s'il n'en reste aucune,
      // on garde la ligne courante active pour qu'elle reste corrigeable.
      const restantes = especes.filter((e) => saisies[e.id] === undefined);
      if (restantes.length) {
        choisirLigne(restantes[0]);
      } else {
        pave.vider();
        invite.textContent = 'Relis tes ' + especes.length + ' totaux, puis valide. Tu peux encore les corriger.';
      }
      boutonTotaux.disabled = restantes.length > 0;
    }

    function terminerEcran1() {
      zoneSaisie.innerHTML = '';
      especeEnCours = null;
      especes.forEach((e) => cellulesTally[e.id].total.classList.remove('active', 'saisi'));
      const reportJuste = especes.every((e) => saisies[e.id] === valeursVraies[e.id]);
      // CHARTE §18 : chaque total saisi passe au vert ou au rouge, et la valeur
      // attendue remplace la valeur fausse.
      especes.forEach((e) => {
        const cell = cellulesTally[e.id].total;
        cell.classList.add(saisies[e.id] === valeursVraies[e.id] ? 'correct' : 'incorrect');
      });
      legendeEtape.textContent = reportJuste
        ? 'Bravo, tes totaux sont justes !'
        : 'Regarde bien : voici les bons totaux.';
      /* La manche n'est acquise qu'au bout des deux écrans, mais compter juste
         mérite d'être fêté ici même : sans cela, le seul retour d'une étape
         entièrement réussie serait une ligne de texte. */
      if (reportJuste) {
        lancerConfettis();
        jouerSon('bravo');
      } else {
        jouerSon('rate');
      }
      if (!reportJuste) {
        setTimeout(() => {
          if (!tableauTally.isConnected) return;
          especes.forEach((e) => {
            const cell = cellulesTally[e.id].total;
            cell.textContent = String(valeursVraies[e.id]);
            cell.classList.remove('incorrect');
            cell.classList.add('correct');
          });
        }, 900);
      }
      const suite = document.createElement('button');
      suite.type = 'button';
      suite.className = 'bouton-principal';
      suite.textContent = 'Construire le diagramme →';
      suite.addEventListener('click', () => ecranDiagramme(reportJuste));
      zoneSaisie.appendChild(suite);
    }

    /* ---- Écran 2 : construction du diagramme à partir du tableau CORRECT ---- */
    function ecranDiagramme(reportJuste) {
      zone.innerHTML = '';
      zone.appendChild(creerBlocConsigne(
        'Voici le tableau complet. Construis le diagramme : clique pour faire monter chaque barre à la bonne hauteur.',
        'Clique dans une colonne pour faire monter la barre jusqu\'au total du tableau. Une case vaut une bête.'
      ));

      // Le tableau de référence porte les VRAIS totaux : l'enfant doit pouvoir
      // construire le diagramme même s'il s'est trompé au report.
      const rappel = document.createElement('table');
      rappel.className = 'tableau-tally';
      rappel.innerHTML = '<thead><tr><th>Bête</th><th>Total</th></tr></thead>';
      const corps = document.createElement('tbody');
      especes.forEach((e) => {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        td1.textContent = e.emoji + ' ' + e.pluriel;
        const td2 = document.createElement('td');
        td2.textContent = String(valeursVraies[e.id]);
        tr.appendChild(td1); tr.appendChild(td2);
        corps.appendChild(tr);
      });
      rappel.appendChild(corps);
      zone.appendChild(rappel);

      const valeursDiagramme = {};
      especes.forEach((e) => { valeursDiagramme[e.id] = 0; });
      const hauteurMax = Math.max(...especes.map((e) => valeursVraies[e.id])) + 2;
      const boutonValider = document.createElement('button');
      boutonValider.type = 'button';
      boutonValider.className = 'bouton-principal';
      boutonValider.textContent = 'Valider mon diagramme';

      zone.appendChild(construireDiagrammeConstructible({
        colonnes: especes.map((e) => ({ id: e.id, emoji: e.emoji, label: e.pluriel })),
        valeurs: valeursDiagramme,
        hauteurMax,
        onChangement: () => {}
      }));
      zone.appendChild(Object.assign(document.createElement('p'), {
        className: 'legende', textContent: 'Rappel : une case = une bête.'
      }));

      boutonValider.addEventListener('click', () => {
        const diagrammeJuste = especes.every((e) => valeursDiagramme[e.id] === valeursVraies[e.id]);
        const enTexte = (source) => especes.map((e) => e.emoji + ' ' + source[e.id]).join('  ');
        // La manche n'est acquise que si le comptage ET le diagramme sont bons.
        validerTour(reportJuste && diagrammeJuste, boutonValider,
          diagrammeJuste
            ? (reportJuste ? null : { donnee: null, attendue: 'les totaux du tableau : ' + enTexte(valeursVraies) })
            : { donnee: enTexte(valeursDiagramme), attendue: enTexte(valeursVraies) });
      });
      zone.appendChild(boutonValider);
    }
  }

  /* ================================================================
     Mini-jeu : Le grand tableau — tableau à double entrée (CP)

     L'ERREUR EST AUTORISÉE. Une version antérieure refusait le geste tant que
     la case visée n'était pas la bonne : l'enfant ne pouvait pas se tromper,
     donc rien ne lui apprenait à croiser une ligne et une colonne — il lui
     suffisait de taper les cases jusqu'à ce que l'une accepte. Ici tout objet
     se pose où l'on veut ; c'est la VALIDATION qui trie, en marquant la case
     fautive en rouge et la case attendue en vert (CHARTE §18), puis en rendant
     au vivier les seuls objets mal rangés pour qu'ils soient replacés.

     Deux étapes forment une même manche :
       1. ranger les objets, valider, corriger si besoin ;
       2. répondre à une question sur le tableau ainsi rempli.
     La manche n'est acquise que si le rangement était juste DU PREMIER COUP
     et la question bien répondue : la correction sert à comprendre, elle ne
     rattrape pas le score.
     ================================================================ */

  function genererTableauDoubleEntree(zone, cfg) {
    /* Une paire d'objets par manche, tirée SANS REMISE : sur les trois manches
       les trois paires sortent toutes, mais dans un ordre différent à chaque
       partie — le thème ne trahit donc jamais la difficulté à venir. */
    if (!etat.deckPaires || !etat.deckPaires.length) etat.deckPaires = melanger(donnees.pairesObjets);
    const paire = etat.deckPaires.shift();
    const objets = paire.objets.map((id) => Object.assign({ id }, donnees.objets[id]));

    /* La PROGRESSION, elle, est fixe par position et indépendante de la paire :
       manche 1 → 2 couleurs, 4 cases, 10 objets ; manches 2 et 3 → 3 couleurs,
       6 cases, 15 objets. */
    const etape = cfg.progression[Math.min(etat.index - 1, cfg.progression.length - 1)];
    const teintes = melanger(donnees.teintes).slice(0, etape.nbCouleurs);

    const cles = [];
    objets.forEach((o) => teintes.forEach((t) => cles.push(o.id + '|' + t.id)));
    const parts = repartir(etape.nbObjets, cles.length, 1, etape.maxParCase);
    const attendus = {};
    cles.forEach((cle, i) => { attendus[cle] = parts[i]; });

    const objetPar = {};
    objets.forEach((o) => { objetPar[o.id] = o; });
    const teintePar = {};
    teintes.forEach((t) => { teintePar[t.id] = t; });

    /* Étiquette vocale d'un objet : la couleur s'accorde avec son genre
       (« une souris verte », « un seau vert »). C'est le seul texte que
       rencontre un lecteur d'écran, le dessin n'en portant aucun. */
    function nommer(jeton) {
      const objet = objetPar[jeton.objetId];
      const teinte = teintePar[jeton.teinteId];
      return objet.singulier + ' ' + (objet.genre === 'f' ? teinte.femSing : teinte.mascSing);
    }

    // Le vivier de départ : un jeton par objet à ranger.
    let compteur = 0;
    const jetons = [];
    cles.forEach((cle) => {
      const [objetId, teinteId] = cle.split('|');
      for (let i = 0; i < attendus[cle]; i++) jetons.push({ ref: compteur++, objetId, teinteId, cle });
    });

    const enCellule = {};
    cles.forEach((cle) => { enCellule[cle] = []; });
    let vivier = melanger(jetons);
    let premierEssaiJuste = true;
    let phase = 'rangement';
    /* Un objet est sélectionné d'office, dès le départ puis après chaque pose :
       le rangement devient une suite de clics DANS LE TABLEAU, sans aller-retour
       vers le vivier à chaque objet. */
    let selection = vivier[0] || null;

    /* Un glisser-déposer venant de se terminer produit un `click` de fin de
       geste : sans ce garde-fou, il rejouerait une sélection ou une reprise
       par-dessus la dépose qu'il vient d'effectuer. On neutralise UN clic, celui
       -là, et pas une fenêtre de temps : une fenêtre finirait par avaler le clic
       délibéré d'un enfant rapide, et il n'y a aucune durée qui distingue les
       deux de façon fiable. Le délai n'est qu'un filet, si aucun clic ne suit
       (l'élément traîné ayant été redessiné entre-temps). */
    let clicASupprimer = false;
    function noterFinDeGlisse() {
      clicASupprimer = true;
      setTimeout(() => { clicASupprimer = false; }, 120);
    }
    function sortDunGlisse() {
      if (!clicASupprimer) return false;
      clicASupprimer = false;
      return true;
    }

    // Consigne courte à l'écran (un CP ne lit pas six lignes), détail complet
    // dans la version lue à voix haute.
    zone.appendChild(creerBlocConsigne(
      'Range chaque objet dans sa case : sa sorte et sa couleur.',
      'Choisis un objet, puis pose-le dans sa case du tableau, en croisant sa sorte et sa couleur. '
      + 'Si tu changes d’avis, clique sur l’objet pour le reprendre. Quand tout est rangé, valide ton tableau.'
    ));

    /* ---- Glisser-déposer, EN PLUS du clic ----
       Les deux gestes cohabitent sans se gêner : tant que le doigt n'a pas
       parcouru le seuil, rien ne se passe et le `click` suit son cours normal
       (choisir un objet, ou le reprendre) ; au-delà du seuil, le geste devient
       un déplacement et c'est le relâchement au-dessus d'une case qui pose
       l'objet. Un enfant qui ne glisse jamais ne voit aucune différence. */
    const SEUIL_GLISSE_PX = 8;

    function cibleSous(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      // Deux sortes de cible acceptent un objet lâché : une case du tableau,
      // ou le vivier lui-même — pour reprendre un objet déjà rangé.
      return el.closest('.cellule-placement') || el.closest('.pool-objets');
    }

    function activerGlisser(el, jeton) {
      let depart = null;
      let fantome = null;
      let survolee = null;
      let glisse = false;

      const nettoyer = () => {
        if (fantome) { fantome.remove(); fantome = null; }
        if (survolee) { survolee.classList.remove('cible-survolee'); survolee = null; }
        el.classList.remove('en-glisse');
        depart = null;
      };

      el.addEventListener('pointerdown', (ev) => {
        if (phase !== 'rangement' || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
        depart = { x: ev.clientX, y: ev.clientY };
        glisse = false;
        try { el.setPointerCapture(ev.pointerId); } catch (e) { /* capture indisponible */ }
      });

      el.addEventListener('pointermove', (ev) => {
        if (!depart) return;
        if (!glisse) {
          if (Math.hypot(ev.clientX - depart.x, ev.clientY - depart.y) < SEUIL_GLISSE_PX) return;
          glisse = true;
          el.classList.add('en-glisse');
          fantome = document.createElement('div');
          fantome.className = 'jeton-fantome';
          // `pointer-events:none` en CSS : sans quoi le fantôme se désignerait
          // lui-même comme cible sous le doigt.
          fantome.appendChild(dessinerObjet(objetPar[jeton.objetId].forme, teintePar[jeton.teinteId].hex));
          document.body.appendChild(fantome);
        }
        fantome.style.left = ev.clientX + 'px';
        fantome.style.top = ev.clientY + 'px';
        const sous = cibleSous(ev.clientX, ev.clientY);
        if (sous !== survolee) {
          if (survolee) survolee.classList.remove('cible-survolee');
          survolee = sous;
          if (survolee) survolee.classList.add('cible-survolee');
        }
      });

      el.addEventListener('pointerup', (ev) => {
        if (!depart) return;
        const aGlisse = glisse;
        const cible = aGlisse ? cibleSous(ev.clientX, ev.clientY) : null;
        glisse = false;
        nettoyer();
        if (!aGlisse) return;         // simple tap : on laisse le `click` agir
        noterFinDeGlisse();
        if (!cible) return;
        if (cible.classList.contains('pool-objets')) remettreDansVivier(jeton);
        else deposer(cible.dataset.cle, jeton);
      });

      // Doigt relevé hors zone, geste interrompu par le système, capture
      // perdue : on remet tout d'aplomb sans rien déposer.
      ['pointercancel', 'lostpointercapture'].forEach((type) => {
        el.addEventListener(type, () => {
          if (glisse) noterFinDeGlisse();
          nettoyer();
        });
      });
    }

    /* ---- Vivier ---- */
    const zoneVivier = document.createElement('div');
    zoneVivier.className = 'pool-objets';

    function rendreVivier() {
      zoneVivier.innerHTML = '';
      zoneVivier.classList.toggle('vide', vivier.length === 0);
      vivier.forEach((jeton) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'jeton-objet' + (selection && selection.ref === jeton.ref ? ' selectionnee' : '');
        btn.dataset.cle = jeton.cle; // sa case correcte, au même usage que dataset.cle sur les cellules
        btn.appendChild(dessinerObjet(objetPar[jeton.objetId].forme, teintePar[jeton.teinteId].hex));
        btn.setAttribute('aria-label', nommer(jeton));
        btn.addEventListener('click', () => {
          if (phase !== 'rangement' || sortDunGlisse()) return;
          /* Toucher un objet le SÉLECTIONNE, toujours — jamais de bascule qui
             le désélectionnerait. Depuis qu'un objet est choisi d'office, une
             bascule piégeait le geste habituel « je touche l'objet puis la
             case » : le premier appui annulait la sélection, et l'appui sur la
             case ne faisait plus rien. Choisir un autre objet suffit à changer
             d'avis. */
          selection = jeton;
          rendreVivier();
        });
        activerGlisser(btn, jeton);
        zoneVivier.appendChild(btn);
      });
      boutonValider.disabled = vivier.length > 0 || phase !== 'rangement';
    }

    /* ---- Tableau : axes croisés, orientation propre à la paire ---- */
    const objetsEnLignes = paire.orientation === 'objets-en-lignes';
    const axeLignes = objetsEnLignes ? objets : teintes;
    const axeColonnes = objetsEnLignes ? teintes : objets;
    const cleDe = (ligneId, colonneId) => (objetsEnLignes ? ligneId + '|' + colonneId : colonneId + '|' + ligneId);

    // En-tête d'axe : le dessin non peint pour une sorte, le nom écrit dans sa
    // teinte pour une couleur — jamais de pastille posée à côté d'un objet.
    function enteteAxe(item) {
      const bloc = document.createElement('div');
      bloc.className = 'entete-axe';
      if (item.forme) {
        bloc.appendChild(dessinerObjet(item.forme, TEINTE_NEUTRE));
        const nom = document.createElement('span');
        nom.textContent = item.pluriel;
        bloc.appendChild(nom);
      } else {
        const nom = document.createElement('span');
        nom.className = 'nom-teinte';
        nom.textContent = item.nom;
        nom.style.color = assombrir(item.hex, 0.3);
        bloc.appendChild(nom);
      }
      return bloc;
    }

    const table = document.createElement('table');
    table.className = 'tableau-placement';
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    trHead.appendChild(document.createElement('th'));
    axeColonnes.forEach((col) => {
      const th = document.createElement('th');
      th.appendChild(enteteAxe(col));
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    const cellules = {};
    axeLignes.forEach((ligne) => {
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.appendChild(enteteAxe(ligne));
      tr.appendChild(th);
      axeColonnes.forEach((col) => {
        const cle = cleDe(ligne.id, col.id);
        const td = document.createElement('td');
        td.className = 'cellule-placement';
        td.dataset.cle = cle;
        const contenu = document.createElement('div');
        contenu.className = 'contenu-cellule';
        td.appendChild(contenu);
        td.addEventListener('click', () => { if (!sortDunGlisse()) deposer(cle); });
        cellules[cle] = { td, contenu };
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    function rendreCellule(cle) {
      const { contenu } = cellules[cle];
      contenu.innerHTML = '';
      enCellule[cle].forEach((jeton) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'objet-mini';
        btn.dataset.cle = jeton.cle; // sa case correcte, au même usage que dataset.cle sur les cellules
        btn.appendChild(dessinerObjet(objetPar[jeton.objetId].forme, teintePar[jeton.teinteId].hex));
        btn.setAttribute('aria-label', 'Reprendre ' + nommer(jeton));
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation(); // sinon la cellule traiterait le clic une seconde fois
          if (phase !== 'rangement' || sortDunGlisse()) return;
          /* Une case déjà occupée finit par être entièrement recouverte par ses
             objets : sans cette bascule, viser une case pleine reviendrait à
             vider l'un de ses objets au lieu d'en ajouter un. Un objet
             sélectionné dans le vivier lève l'ambiguïté — le geste vise à
             POSER ; sans sélection, il vise à reprendre. */
          if (selection) { deposer(cle); return; }
          enCellule[cle] = enCellule[cle].filter((j) => j !== jeton);
          vivier.push(jeton);
          // L'objet repris reste « en main » : corriger un objet mal rangé se
          // fait alors en deux gestes, le prendre puis toucher la bonne case.
          selection = jeton;
          effacerMarques();
          rendreCellule(cle);
          rendreVivier();
          jouerSon('tic');
        });
        activerGlisser(btn, jeton);
        contenu.appendChild(btn);
      });
    }

    /* Dépose LIBRE : n'importe quelle case accepte n'importe quel objet.
       `jetonForce` sert au glisser-déposer, qui désigne son propre objet sans
       passer par la sélection. */
    function deposer(cle, jetonForce) {
      if (phase !== 'rangement') return;
      const jeton = jetonForce || selection;
      if (!jeton) return;
      selection = null;
      vivier = vivier.filter((j) => j !== jeton);
      // Un objet venant d'une autre case (correction au glisser) la quitte.
      cles.forEach((k) => {
        if (enCellule[k].indexOf(jeton) !== -1) {
          enCellule[k] = enCellule[k].filter((j) => j !== jeton);
          if (k !== cle) rendreCellule(k);
        }
      });
      enCellule[cle].push(jeton);
      effacerMarques();
      rendreCellule(cle);
      /* On enchaîne : l'objet suivant du vivier est sélectionné d'office, si
         bien qu'un rangement se fait en une seule série de clics dans le
         tableau, sans revenir chercher chaque objet. */
      selection = vivier[0] || null;
      rendreVivier();
      jouerSon('tic');
    }

    /* Glisser un objet déjà posé jusqu'au vivier l'en retire — pendant du
       clic sur l'objet dans sa case (même effet, geste en plus). Sans objet
       à retirer (le jeton était déjà dans le vivier), rien ne se passe. */
    function remettreDansVivier(jeton) {
      if (phase !== 'rangement') return;
      let retire = false;
      cles.forEach((k) => {
        if (enCellule[k].indexOf(jeton) !== -1) {
          enCellule[k] = enCellule[k].filter((j) => j !== jeton);
          rendreCellule(k);
          retire = true;
        }
      });
      if (!retire) return;
      vivier.push(jeton);
      selection = jeton;
      effacerMarques();
      rendreVivier();
      jouerSon('tic');
    }

    /* Toute manipulation efface la correction affichée — et remet le bouton
       dans son rôle de validation : l'enfant qui a déjà repris lui-même ses
       objets ne doit pas pouvoir déclencher une reprise devenue caduque. */
    function effacerMarques() {
      note.textContent = '';
      note.className = 'note-rangement';
      malRanges = [];
      roleBouton = 'valider';
      boutonValider.textContent = 'Valider mon tableau';
      cles.forEach((cle) => {
        cellules[cle].td.classList.remove('case-fausse', 'case-attendue');
        cellules[cle].contenu.querySelectorAll('.mal-place').forEach((el) => el.classList.remove('mal-place'));
      });
    }

    const note = document.createElement('p');
    note.className = 'note-rangement';

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider mon tableau';
    boutonValider.disabled = true;

    const zoneQuestion = document.createElement('div');

    zone.appendChild(zoneVivier);
    zone.appendChild(table);
    zone.appendChild(note);
    zone.appendChild(boutonValider);
    zone.appendChild(zoneQuestion);
    rendreVivier();

    /* Le bouton porte deux rôles successifs — valider, puis reprendre les
       objets mal rangés. Un seul écouteur qui aiguille sur `roleBouton` : deux
       écouteurs concurrents se déclencheraient tous les deux au même clic. */
    let roleBouton = 'valider';
    let malRanges = [];

    boutonValider.addEventListener('click', () => {
      if (phase !== 'rangement') return;
      if (roleBouton === 'replacer') { reprendreMalRanges(); return; }
      if (vivier.length) return;

      // Tous les objets étant posés et chacun n'ayant qu'une case légitime,
      // « aucun intrus » équivaut à « tous les effectifs sont justes ».
      const intrus = [];
      cles.forEach((cle) => {
        enCellule[cle].forEach((jeton, i) => {
          if (jeton.cle !== cle) intrus.push({ jeton, depuis: cle, rang: i });
        });
      });

      if (intrus.length === 0) {
        phase = 'question';
        table.classList.add('verrouille');
        boutonValider.hidden = true;
        note.textContent = 'Ton tableau est juste !';
        note.className = 'note-rangement reussite';
        lancerConfettis();
        jouerSon('tic');
        poserQuestionFinale();
        return;
      }

      // CHARTE §18 : la case fautive en rouge, la case attendue en vert, et
      // l'objet fautif lui-même entouré — sinon on saurait qu'une case est
      // fausse sans savoir lequel de ses objets l'est.
      premierEssaiJuste = false;
      jouerSon('rate');
      intrus.forEach(({ jeton, depuis, rang }) => {
        cellules[depuis].td.classList.add('case-fausse');
        cellules[jeton.cle].td.classList.add('case-attendue');
        const mini = cellules[depuis].contenu.children[rang];
        if (mini) mini.classList.add('mal-place');
      });
      note.textContent = intrus.length === 1
        ? 'Cet objet n’est pas dans la bonne case : la case verte l’attend.'
        : 'Ces ' + intrus.length + ' objets ne sont pas dans la bonne case : les cases vertes les attendent.';
      note.className = 'note-rangement erreur';

      // On rend la main sur un geste explicite plutôt qu'au bout d'un délai :
      // l'enfant garde le rouge et le vert sous les yeux le temps qu'il veut.
      malRanges = intrus;
      roleBouton = 'replacer';
      boutonValider.disabled = false;
      boutonValider.textContent = 'Je replace mes objets';
    });

    function reprendreMalRanges() {
      malRanges.forEach(({ jeton, depuis }) => {
        enCellule[depuis] = enCellule[depuis].filter((j) => j !== jeton);
        vivier.push(jeton);
      });
      vivier = melanger(vivier);
      effacerMarques(); // remet aussi le bouton dans son rôle de validation
      cles.forEach(rendreCellule);
      rendreVivier();
    }

    /* ---- Étape 2 : une question sur le tableau qui vient d'être rempli ---- */
    function poserQuestionFinale() {
      const cle = choisir(cles);
      const [objetId, teinteId] = cle.split('|');
      const objet = objetPar[objetId];
      const teinte = teintePar[teinteId];
      const groupe = objet.genre === 'f' ? teinte.fem : teinte.masc;
      const enonce = 'Combien ' + deElision(objet.pluriel) + ' ' + groupe + ' y a-t-il dans le tableau ?';

      zoneQuestion.appendChild(creerBlocConsigne(enonce, enonce));
      /* La case visée n'est PAS signalée pendant la question : la désigner
         reviendrait à répondre à la moitié de la question, qui est justement
         de trouver l'intersection de la ligne et de la colonne. Elle n'est
         révélée qu'une fois la réponse validée (CHARTE §18). */

      const pave = creerPave((valeur) => {
        pave.verrouiller(true);
        phase = 'termine';
        cellules[cle].td.classList.add('case-attendue');
        const juste = valeur === attendus[cle];
        // Le rangement corrigé ne rattrape pas le score : l'erreur a déjà été
        // signalée et expliquée sur le tableau au moment où elle a eu lieu.
        validerTour(juste && premierEssaiJuste, null,
          juste ? null : { donnee: String(valeur), attendue: String(attendus[cle]) });
      }, 2);
      zoneQuestion.appendChild(pave.el);
    }
  }

  /* ================================================================
     Mini-jeu : Les effectifs du jardin (CE2) — le diagramme incomplet
     ================================================================ */

  /* ---- Le diagramme dont une barre manque ----
     Trois effectifs sont donnés en toutes lettres par le dessin, le total par
     l'énoncé : la quatrième barre s'obtient par SOUSTRACTION, pas par lecture.
     C'est le seul endroit du module où l'on construit une barre sans en
     connaître directement la valeur. */
  function genererDiagrammeACompleter(zone, cfg) {
    const coin = choisir(donnees.coinsJardin);
    const lieux = melanger(coin.lieux);
    const effectifs = {};
    lieux.forEach((l) => { effectifs[l.id] = nombreAleatoire(cfg.miniEffectif, cfg.maxiEffectif); });
    const cible = choisir(lieux);
    const total = lieux.reduce((s, l) => s + effectifs[l.id], 0);
    const attendu = effectifs[cible.id];

    const enonce = total + ' petites bêtes du jardin vivent dans ' + coin.intro + ' : '
      + lieux.map((l) => l.nom).join(', ').replace(/,([^,]*)$/, ' et$1') + '. '
      + 'Complète le diagramme avec la barre correspondant à l’effectif ' + deArticle(cible.nom) + '.';

    zone.appendChild(creerBlocConsigne(enonce,
      enonce + ' Compte les bêtes déjà placées, puis cherche combien il en manque pour arriver à '
      + total + '.'));

    const valeurs = {};
    lieux.forEach((l) => { valeurs[l.id] = effectifs[l.id]; });
    valeurs[cible.id] = 0; // la barre à trouver part de zéro
    const verrouillees = new Set(lieux.filter((l) => l.id !== cible.id).map((l) => l.id));
    const hauteurMax = Math.max(...lieux.map((l) => effectifs[l.id])) + 2;

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider mon diagramme';

    const diagramme = construireDiagrammeConstructible({
      colonnes: lieux.map((l) => ({ id: l.id, emoji: l.emoji, label: l.court })),
      valeurs,
      hauteurMax,
      verrouillees,
      onChangement: () => {}
    });
    zone.appendChild(diagramme);
    zone.appendChild(Object.assign(document.createElement('p'), {
      className: 'legende',
      textContent: 'Une case = une petite bête. Seule la barre ' + deArticle(cible.nom) + ' est à construire.'
    }));

    boutonValider.addEventListener('click', () => {
      const juste = valeurs[cible.id] === attendu;
      if (!juste) {
        // CHARTE §18 : la bonne barre est montrée, pas seulement énoncée.
        valeurs[cible.id] = attendu;
        diagramme.rafraichir();
      }
      validerTour(juste, boutonValider, juste ? null : {
        donnee: String(valeurs[cible.id] === attendu ? '' : valeurs[cible.id]),
        attendue: attendu + ' (' + total + ' − ' + lieux.filter((l) => l.id !== cible.id)
          .map((l) => effectifs[l.id]).join(' − ') + ')'
      });
    });
    zone.appendChild(boutonValider);
  }

  /* « de » + article défini : « du potager », « de la mare », « des tournesols ». */
  function deArticle(nom) {
    if (/^le /.test(nom)) return 'du ' + nom.slice(3);
    if (/^les /.test(nom)) return 'des ' + nom.slice(4);
    if (/^l’/.test(nom) || /^l'/.test(nom)) return 'de ' + nom;
    return 'de ' + nom;
  }

  /* ================================================================
     Mini-jeu : Le carnet à trous du jardinier (CE2)
     ================================================================
     Le tableau à double entrée qui se déduit de proche en proche.
     Quinze nombres : 8 données (4 lignes × 2 colonnes), 4 totaux de ligne,
     2 totaux de colonne, 1 total général. Sept sont masqués.

     LE POINT DÉLICAT est le choix de ces sept cases. Retirer sept cases au
     hasard produit très souvent un tableau que l'on ne peut plus finir sans
     poser un système à deux inconnues — hors de portée au CE2 — ou, pire, un
     tableau à plusieurs solutions. On procède donc en trois temps :
       1. fabriquer un tableau complet et cohérent ;
       2. masquer les cases UNE À UNE, en ne conservant un masquage que si le
          tableau reste entièrement retrouvable ;
       3. la vérification du point 2 est faite par un solveur qui n'applique
          qu'une seule règle, celle qu'un enfant emploie : « dans une ligne ou
          une colonne où il ne manque qu'un seul nombre, ce nombre se calcule ».
          Si le solveur ne retrouve pas TOUT, le masquage est annulé.
     Un tableau accepté est donc, par construction, résoluble par déductions
     successives — et sa solution est unique, chaque déduction ne laissant
     qu'une valeur possible. */

  const NB_COLONNES_DEDUCTION = 2;

  /* Les contraintes du tableau, sous forme de groupes de cases dont la dernière
     se déduit des autres. Une case est repérée par une clé textuelle :
       'd:i:j' donnée, 'L:i' total de ligne, 'C:j' total de colonne, 'T' général. */
  function contraintesTableau(nbLignes) {
    const c = [];
    for (let i = 0; i < nbLignes; i++) {
      const ligne = [];
      for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) ligne.push('d:' + i + ':' + j);
      ligne.push('L:' + i);
      c.push(ligne);
    }
    for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) {
      const col = [];
      for (let i = 0; i < nbLignes; i++) col.push('d:' + i + ':' + j);
      col.push('C:' + j);
      c.push(col);
    }
    const totauxLignes = [];
    for (let i = 0; i < nbLignes; i++) totauxLignes.push('L:' + i);
    c.push(totauxLignes.concat(['T']));
    const totauxColonnes = [];
    for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) totauxColonnes.push('C:' + j);
    c.push(totauxColonnes.concat(['T']));
    return c;
  }

  /* Solveur « à la main » : tant qu'une contrainte n'a qu'une seule case
     inconnue, cette case devient connue. Aucune résolution de système, aucun
     essai-erreur — exactement le raisonnement attendu de l'enfant. */
  function casesRetrouvables(connues, contraintes) {
    const su = new Set(connues);
    const ordre = []; // ordre dans lequel les cases deviennent déductibles
    let progres = true;
    while (progres) {
      progres = false;
      contraintes.forEach((groupe) => {
        const inconnues = groupe.filter((k) => !su.has(k));
        if (inconnues.length === 1) { su.add(inconnues[0]); ordre.push(inconnues[0]); progres = true; }
      });
    }
    su.ordre = ordre;
    return su;
  }

  function fabriquerTableauDeduction(cfg) {
    const nbLignes = cfg.nbLignes;
    const contraintes = contraintesTableau(nbLignes);
    const toutesCles = [];
    for (let i = 0; i < nbLignes; i++) {
      for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) toutesCles.push('d:' + i + ':' + j);
      toutesCles.push('L:' + i);
    }
    for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) toutesCles.push('C:' + j);
    toutesCles.push('T');

    for (let essai = 0; essai < 60; essai++) {
      // 1. Un tableau complet et cohérent, toutes valeurs entre 1 et 99.
      const valeurs = {};
      const donneesBrutes = [];
      for (let i = 0; i < nbLignes; i++) {
        const ligne = [];
        for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) {
          const v = nombreAleatoire(cfg.miniValeur, cfg.maxiValeur);
          ligne.push(v);
          valeurs['d:' + i + ':' + j] = v;
        }
        donneesBrutes.push(ligne);
        valeurs['L:' + i] = ligne.reduce((a, b) => a + b, 0);
      }
      for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) {
        let s = 0;
        for (let i = 0; i < nbLignes; i++) s += donneesBrutes[i][j];
        valeurs['C:' + j] = s;
      }
      valeurs.T = donneesBrutes.reduce((s, l) => s + l.reduce((a, b) => a + b, 0), 0);
      if (Object.keys(valeurs).some((k) => valeurs[k] < 1 || valeurs[k] > 99)) continue;

      // 2. Masquage un à un, chaque fois validé par le solveur.
      const cachees = new Set();
      melanger(toutesCles).forEach((cle) => {
        if (cachees.size >= cfg.nbCachees) return;
        const essaiCachees = new Set(cachees);
        essaiCachees.add(cle);
        const connues = toutesCles.filter((k) => !essaiCachees.has(k));
        // 3. Le tableau doit rester ENTIÈREMENT retrouvable.
        if (casesRetrouvables(connues, contraintes).size === toutesCles.length) {
          cachees.add(cle);
        }
      });
      if (cachees.size !== cfg.nbCachees) continue;

      /* Un tableau où l'on ne masquerait que des totaux se réduirait à « fais
         les additions » ; un tableau où l'on ne masquerait que des données se
         priverait du raisonnement sur le total général. On exige les deux. */
      const cacheesDonnees = [...cachees].filter((k) => k.charAt(0) === 'd').length;
      const cacheesTotaux = cachees.size - cacheesDonnees;
      if (cacheesDonnees < 2 || cacheesTotaux < 2) continue;

      /* Ordre dans lequel les cases deviennent déductibles : c'est celui qu'on
         proposera à l'enfant. Ouvrir sur une case encore indéductible le
         mettrait en échec d'entrée, alors que rien ne l'empêche par ailleurs de
         choisir lui-même la case qu'il veut. */
      const ordre = casesRetrouvables(toutesCles.filter((k) => !cachees.has(k)), contraintes).ordre;

      return { valeurs, cachees, contraintes, toutesCles, nbLignes, ordre };
    }
    return null;
  }

  function genererTableauDeduction(zone, cfg) {
    const modele = fabriquerTableauDeduction(cfg);
    if (!modele) { // garde-fou : on ne présente jamais un tableau non vérifié
      zone.appendChild(creerBlocConsigne('Le jardin se réorganise, passe à la manche suivante.', ''));
      validerTour(true, null);
      return;
    }
    const { valeurs, cachees, nbLignes, ordre } = modele;

    const especes = especesListe(nbLignes);
    const periode = choisir(donnees.periodesJardin);
    const colonnes = periode.colonnes;

    zone.appendChild(creerBlocConsigne(
      'Le carnet du jardinier est abîmé : ' + cachees.size + ' nombres ont disparu. '
      + 'Retrouve-les un par un grâce aux totaux.',
      'Retrouve les nombres effacés du carnet. Sers-toi des lignes et des colonnes où il ne manque '
      + 'qu’un seul nombre : celui-là, tu peux le calculer.'
    ));

    const table = document.createElement('table');
    table.className = 'tableau-deduction';
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    trHead.appendChild(document.createElement('th'));
    colonnes.forEach((c) => {
      const th = document.createElement('th');
      th.textContent = c.nom;
      trHead.appendChild(th);
    });
    const thTotal = document.createElement('th');
    thTotal.textContent = 'Total';
    trHead.appendChild(thTotal);
    thead.appendChild(trHead);
    table.appendChild(thead);

    const saisies = {};
    const cellules = {};

    function creerCellule(cle, libelle) {
      const td = document.createElement('td');
      td.dataset.cle = cle;
      if (cachees.has(cle)) {
        td.className = 'cellule-deduction a-trouver';
        td.textContent = '?';
        td.setAttribute('role', 'button');
        td.setAttribute('aria-label', 'Case à trouver : ' + libelle);
        td.dataset.libelle = libelle;
        td.addEventListener('click', () => { if (!etat.verrouille) choisirCase(cle); });
      } else {
        td.className = 'cellule-deduction donnee';
        td.textContent = String(valeurs[cle]);
      }
      cellules[cle] = td;
      return td;
    }

    const tbody = document.createElement('tbody');
    for (let i = 0; i < nbLignes; i++) {
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.textContent = especes[i].emoji + ' ' + especes[i].pluriel;
      tr.appendChild(th);
      for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) {
        tr.appendChild(creerCellule('d:' + i + ':' + j, 'les ' + especes[i].pluriel + ', ' + colonnes[j].nom));
      }
      const tdTotal = creerCellule('L:' + i, 'le total des ' + especes[i].pluriel);
      tdTotal.classList.add('colonne-total');
      tr.appendChild(tdTotal);
      tbody.appendChild(tr);
    }
    const trTotaux = document.createElement('tr');
    trTotaux.className = 'ligne-total';
    const thTot = document.createElement('th');
    thTot.textContent = 'Total';
    trTotaux.appendChild(thTot);
    for (let j = 0; j < NB_COLONNES_DEDUCTION; j++) {
      trTotaux.appendChild(creerCellule('C:' + j, 'le total pour ' + colonnes[j].nom));
    }
    const tdGeneral = creerCellule('T', 'le total général');
    tdGeneral.classList.add('colonne-total');
    trTotaux.appendChild(tdGeneral);
    tbody.appendChild(trTotaux);
    table.appendChild(tbody);
    zone.appendChild(table);

    const invite = document.createElement('p');
    invite.className = 'legende';
    zone.appendChild(invite);

    const zoneSaisie = document.createElement('div');
    zone.appendChild(zoneSaisie);

    let cleEnCours = null;
    const pave = creerPave((valeur) => { if (cleEnCours) inscrire(cleEnCours, valeur); }, 2);

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider mon carnet';
    boutonValider.disabled = true;
    boutonValider.addEventListener('click', () => {
      if ([...cachees].some((k) => saisies[k] === undefined)) return;
      terminer();
    });

    zoneSaisie.appendChild(pave.el);
    zoneSaisie.appendChild(boutonValider);

    function choisirCase(cle) {
      cleEnCours = cle;
      Object.keys(cellules).forEach((k) => cellules[k].classList.toggle('active', k === cle));
      invite.textContent = 'Case à trouver : ' + cellules[cle].dataset.libelle + '.';
      pave.vider();
    }

    function inscrire(cle, valeur) {
      saisies[cle] = valeur;
      cellules[cle].textContent = String(valeur);
      cellules[cle].classList.remove('a-trouver');
      cellules[cle].classList.add('saisi');
      const restantes = ordre.filter((k) => cachees.has(k) && saisies[k] === undefined);
      if (restantes.length) choisirCase(restantes[0]);
      else {
        cellules[cle].classList.remove('active');
        cleEnCours = null;
        pave.vider();
        invite.textContent = 'Relis ton carnet, puis valide. Tu peux encore corriger un nombre.';
      }
      boutonValider.disabled = restantes.length > 0;
    }

    function terminer() {
      pave.verrouiller(true);
      const fautives = [...cachees].filter((k) => saisies[k] !== valeurs[k]);
      // CHARTE §18 : chaque case saisie passe au vert ou au rouge, et les
      // valeurs fausses cèdent la place aux bonnes après un temps de lecture.
      cachees.forEach((k) => {
        cellules[k].classList.remove('active', 'saisi');
        cellules[k].classList.add(saisies[k] === valeurs[k] ? 'correct' : 'incorrect');
      });
      if (fautives.length) {
        setTimeout(() => {
          if (!table.isConnected) return;
          fautives.forEach((k) => {
            cellules[k].textContent = String(valeurs[k]);
            cellules[k].classList.remove('incorrect');
            cellules[k].classList.add('correct');
          });
        }, 1200);
      }
      invite.textContent = fautives.length
        ? 'Regarde bien : voici les bons nombres.'
        : 'Carnet complété sans une erreur !';
      validerTour(fautives.length === 0, boutonValider, fautives.length ? {
        donnee: fautives.length + (fautives.length > 1 ? ' nombres faux' : ' nombre faux'),
        attendue: fautives.map((k) => valeurs[k]).join('  ·  ')
      } : null);
    }

    // On ouvre sur la première case DÉDUCTIBLE, pas sur la première venue.
    choisirCase(ordre.find((k) => cachees.has(k)) || [...cachees][0]);
  }

  /* ================================================================
     Mini-jeu : Lecture de diagramme + tableau déjà construits (CE1)
     ================================================================ */

  function genererLecture(zone, cfg) {
    if (!etat.donneesTour || etat.tourGenerePour !== 'lecture-dataset') {
      const especes = especesListe(cfg.nbEspeces);
      const zones = melanger(donnees.zones).slice(0, cfg.nbZones);
      const valeurs = {};
      const parZone = {};
      especes.forEach((e) => {
        parZone[e.id] = {};
        let total = 0;
        zones.forEach((z, i) => {
          const v = nombreAleatoire(2, Math.max(3, Math.round(cfg.capParEspece / cfg.nbZones)));
          parZone[e.id][z.id] = v;
          total += v;
        });
        valeurs[e.id] = total;
      });
      etat.donneesTour = { especes, zones, valeurs, parZone };
      etat.tourGenerePour = 'lecture-dataset';
      etat.questionsPosees = [];
    }
    const { especes, zones, valeurs, parZone } = etat.donneesTour;

    // Banque de questions possibles à partir du jeu de données courant.
    const banque = [];
    const especeMax = especes.slice().sort((a, b) => valeurs[b.id] - valeurs[a.id])[0];
    const especeMin = especes.slice().sort((a, b) => valeurs[a.id] - valeurs[b.id])[0];
    // Question max/min posée seulement si la réponse est SANS AMBIGUÏTÉ (pas d'égalité).
    if (especes.every((e) => e.id === especeMax.id || valeurs[e.id] < valeurs[especeMax.id])) {
      banque.push({
        cle: 'max',
        texte: 'Quelle est la bête la plus présente dans le jardin ?',
        bonne: especeMax.pluriel,
        options: especes.map((e) => e.pluriel)
      });
    }
    if (especes.every((e) => e.id === especeMin.id || valeurs[e.id] > valeurs[especeMin.id])) {
      banque.push({
        cle: 'min',
        texte: 'Quelle est la bête la moins présente dans le jardin ?',
        bonne: especeMin.pluriel,
        options: especes.map((e) => e.pluriel)
      });
    }
    especes.forEach((e) => {
      banque.push({
        cle: 'total-' + e.id,
        texte: 'Combien ' + deElision(e.pluriel) + ' en tout dans le diagramme ?',
        bonne: String(valeurs[e.id]),
        options: [String(valeurs[e.id]), String(Math.max(0, valeurs[e.id] - 2)), String(valeurs[e.id] + 2), String(Math.max(0, valeurs[e.id] - 4))]
      });
    });
    if (zones.length >= 2) {
      especes.forEach((e) => {
        banque.push({
          cle: 'zone-' + e.id,
          texte: 'Combien ' + deElision(e.pluriel) + ' dans le ' + zones[0].nom + ' ?',
          bonne: String(parZone[e.id][zones[0].id]),
          options: [String(parZone[e.id][zones[0].id]), String(parZone[e.id][zones[1].id]), String(parZone[e.id][zones[0].id] + 2), String(Math.max(0, parZone[e.id][zones[0].id] - 2))]
        });
        // Question de comparaison posée seulement si les deux zones diffèrent (pas d'égalité ambiguë).
        if (parZone[e.id][zones[0].id] !== parZone[e.id][zones[1].id]) {
          banque.push({
            cle: 'compare-' + e.id,
            texte: 'Y a-t-il plus ' + deElision(e.pluriel) + ' dans le ' + zones[0].nom + ' ou le ' + zones[1].nom + ' ?',
            bonne: parZone[e.id][zones[0].id] > parZone[e.id][zones[1].id] ? zones[0].nom : zones[1].nom,
            options: [zones[0].nom, zones[1].nom]
          });
        }
      });
    }

    const disponibles = banque.filter((q) => etat.questionsPosees.indexOf(q.cle) === -1);
    const question = choisir(disponibles.length ? disponibles : banque);
    etat.questionsPosees.push(question.cle);

    zone.appendChild(creerBlocConsigne(question.texte, question.texte));

    const diagramme = construireDiagramme({
      colonnes: especes.map((e) => ({ id: e.id, emoji: e.emoji, label: e.pluriel })),
      valeurs,
      afficherValeur: true,
      interactif: false
    });
    zone.appendChild(diagramme);

    if (zones.length >= 2) {
      const lignesTableau = especes.map((e) => ({ id: e.id, emoji: e.emoji, label: e.pluriel }));
      const valeursTableau = {};
      especes.forEach((e) => { valeursTableau[e.id] = parZone[e.id]; });
      const table = construireTableauDouble({
        lignes: lignesTableau,
        colonnes: zones.map((z) => ({ id: z.id, label: z.nom })),
        valeurs: valeursTableau
      });
      zone.appendChild(table);
    }

    const optionsUniques = Array.from(new Set(question.options));
    const indexBonne = optionsUniques.indexOf(question.bonne);
    const { options: optionsMelangees, indexCorrect } = melangerOptions(optionsUniques, indexBonne);

    const grille = document.createElement('div');
    grille.className = 'grille-options';
    optionsMelangees.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bouton-option';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        Array.from(grille.children).forEach((b) => { b.disabled = true; });
        btn.classList.add(i === indexCorrect ? 'correct' : 'incorrect');
        if (i !== indexCorrect) grille.children[indexCorrect].classList.add('correct');
        validerTour(i === indexCorrect, btn);
      });
      grille.appendChild(btn);
    });
    zone.appendChild(grille);
  }

  /* ================================================================
     Mini-jeu : Problème combiné tableau + diagramme (CE2)
     ================================================================ */

  function genererProblemeCombine(zone, cfg) {
    const especes = especesListe(cfg.nbEspeces);
    /* Le second critère du tableau est la COULEUR de la bête, comme dans « Le
       grand tableau » : un critère qui se voit sur le dessin, là où des
       tranches d'âge (« 3-5 jours ») ne se lisent nulle part et n'étaient
       qu'une étiquette à recopier. */
    const teintes = melanger(donnees.teintes).slice(0, cfg.nbCouleurs);
    const uniteParCase = choisir([2, 3]); // échelle d'axe adaptée : pas toujours de 1 en 1 (CHARTE, énoncé M39)

    const valeursVraies = {};
    const totauxParEspece = {};
    especes.forEach((e) => {
      valeursVraies[e.id] = {};
      let total = 0;
      teintes.forEach((t) => {
        const v = nombreAleatoire(1, cfg.capParCouleur);
        valeursVraies[e.id][t.id] = v;
        total += v;
      });
      totauxParEspece[e.id] = total;
    });

    // Une seule case manquante, dans une ligne (espèce) tirée au hasard.
    const especeCachee = choisir(especes);
    const teinteCachee = choisir(teintes);
    const cleCachee = especeCachee.id + '|' + teinteCachee.id;

    zone.appendChild(creerBlocConsigne(
      'Le diagramme donne le total par bête. Trouve le nombre manquant dans le tableau.',
      'Utilise le total du diagramme et les autres cases du tableau pour trouver le nombre manquant.'
    ));

    const diagramme = construireDiagramme({
      colonnes: especes.map((e) => ({ id: e.id, emoji: e.emoji, label: e.pluriel })),
      valeurs: totauxParEspece,
      uniteParCase,
      afficherValeur: true,
      interactif: false
    });
    zone.appendChild(diagramme);
    zone.appendChild(Object.assign(document.createElement('p'), {
      className: 'legende', textContent: 'Attention : ici, une case du diagramme vaut ' + uniteParCase + ' bêtes.'
    }));

    const table = construireTableauDouble({
      lignes: especes.map((e) => ({ id: e.id, emoji: e.emoji, label: e.pluriel })),
      colonnes: teintes.map((t) => ({ id: t.id, label: t.nom, teinte: t.hex })),
      valeurs: valeursVraies,
      cellulesMasquees: new Set([cleCachee])
    });
    zone.appendChild(table);

    const input = table.querySelector('input');
    const boutonValider = document.createElement('button');
    boutonValider.type = 'button';
    boutonValider.className = 'bouton-principal';
    boutonValider.textContent = 'Valider';
    boutonValider.addEventListener('click', () => {
      const attendu = valeursVraies[especeCachee.id][teinteCachee.id];
      const saisie = parseInt(input.value, 10);
      const correct = saisie === attendu;
      // CHARTE §18 : la case saisie passe au vert ou au rouge et la valeur
      // attendue est rappelée sous le feedback.
      input.disabled = true;
      input.classList.add(correct ? 'correct' : 'incorrect');
      validerTour(correct, boutonValider, correct ? null
        : { donnee: isNaN(saisie) ? '(vide)' : String(saisie), attendue: String(attendu) });
    });
    zone.appendChild(boutonValider);
  }

  /* ---------- Initialisation ---------- */

  document.getElementById('bouton-retour').addEventListener('click', retourAccueil);
  document.getElementById('bouton-suivant').addEventListener('click', tourSuivant);

  construireAccueil();
})();
</script>
<script>
  /* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7).
     Script isolé du moteur de jeu : il n'agit que sur les éléments statiques
     de la page (le « ← Menu » ne s'affiche que sur l'écran d'accueil). */
  (function () {
    var bouton = document.getElementById('bouton-menu');
    var modale = document.getElementById('modale-menu');
    if (!bouton || !modale) return;
    function fermer() { modale.hidden = true; }
    bouton.addEventListener('click', function () { modale.hidden = false; });
    document.getElementById('modale-menu-rester').addEventListener('click', fermer);
    document.getElementById('modale-menu-revenir').addEventListener('click', function () {
      window.location.href = '../index.html';
    });
    modale.addEventListener('click', function (e) { if (e.target === modale) fermer(); });
  })();
</script>
