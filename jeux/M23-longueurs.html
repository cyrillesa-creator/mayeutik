  /* Unités dans l'ORDRE CROISSANT canonique (référence pour la correction
     de l'exercice 1 « ranger les unités »). */
  const ORDRE_UNITES_CE2 = ['mm', 'cm', 'dm', 'm', 'km'];

  /*
   * Exercice 1 « Ranger les unités » : disposition verticale à deux
   * colonnes — colonne de GAUCHE la pioche des 5 étiquettes (mm/cm/dm/m/km)
   * EN DÉSORDRE, colonne de DROITE les 5 emplacements de réponse pré-
   * marqués en pointillés. Glisser-poser depuis la pioche vers un
   * emplacement : même mécanique que l'exercice « classement » ci-dessous
   * (déposer sur un emplacement déjà occupé ÉCHANGE les deux étiquettes,
   * l'occupante reprenant la place de départ de l'étiquette déplacée,
   * plutôt que d'être éjectée). Bouton « Valider » (activé une fois les 5
   * emplacements remplis) pour la correction finale — pas de validation
   * automatique à chaque dépôt.
   */
  function genererRangerUnitesCE2(zone) {
    zone.appendChild(creerBlocConsigne(
      'Range les unités dans l\'ordre, de la plus petite à la plus grande.',
      'Fais glisser chaque étiquette de la colonne de gauche vers un emplacement de la colonne de droite, de la plus petite unité en haut jusqu\'à la plus grande en bas. Valide quand les 5 emplacements sont remplis.'
    ));

    const colonnes = document.createElement('div');
    colonnes.className = 'rangerunites-colonnes';

    const colonneGauche = document.createElement('div');
    colonneGauche.className = 'rangerunites-colonne';
    const titreGauche = document.createElement('p');
    titreGauche.className = 'rangerunites-colonne-titre'; titreGauche.textContent = 'Étiquettes';
    colonneGauche.appendChild(titreGauche);
    const plateau = document.createElement('div');
    plateau.className = 'rangerunites-colonne-pioche';
    colonneGauche.appendChild(plateau);

    const colonneDroite = document.createElement('div');
    colonneDroite.className = 'rangerunites-colonne';
    const titreDroite = document.createElement('p');
    titreDroite.className = 'rangerunites-colonne-titre'; titreDroite.textContent = 'Réponses';
    colonneDroite.appendChild(titreDroite);
    const slots = [];
    for (let i = 0; i < ORDRE_UNITES_CE2.length; i++) {
      const slot = document.createElement('div');
      slot.className = 'rangerunites-slot';
      slot.setAttribute('aria-label', 'Emplacement ' + (i + 1));
      colonneDroite.appendChild(slot);
      slots.push(slot);
    }

    colonnes.appendChild(colonneGauche);
    colonnes.appendChild(colonneDroite);
    zone.appendChild(colonnes);

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button'; boutonValider.className = 'bouton-principal'; boutonValider.textContent = 'Valider';
    boutonValider.disabled = true;

    function toutPlace() {
      return slots.every((s) => s.children.length === 1) && plateau.children.length === 0;
    }
    function majValidation() { boutonValider.disabled = !toutPlace(); }

    function rendreDeplacable(etiquette) {
      let enGlissement = false;
      let departX = 0, departY = 0;
      let origine = null; // parent DE DÉPART du geste : là où retourne l'occupante évincée (swap)
      etiquette.addEventListener('pointerdown', (e) => {
        if (etat.verrouille) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        enGlissement = true;
        departX = e.clientX; departY = e.clientY;
        origine = etiquette.parentElement;
        etiquette.classList.add('unite-etiquette-glisse');
        try { etiquette.setPointerCapture(e.pointerId); } catch (err) { /* pointeur déjà relâché : tant pis */ }
      });
      etiquette.addEventListener('pointermove', (e) => {
        if (!enGlissement) return;
        e.preventDefault();
        etiquette.style.transform = 'translate(' + (e.clientX - departX) + 'px,' + (e.clientY - departY) + 'px)';
      });
      function relacher(e) {
        if (!enGlissement) return;
        enGlissement = false;
        etiquette.style.transform = '';
        etiquette.classList.remove('unite-etiquette-glisse');
        const cible = slots.find((s) => {
          const r = s.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        });
        if (cible) {
          const occupante = cible.firstElementChild;
          if (occupante && occupante !== etiquette) origine.appendChild(occupante);
          cible.appendChild(etiquette);
        } else {
          origine.appendChild(etiquette);
        }
        majValidation();
      }
      etiquette.addEventListener('pointerup', relacher);
      etiquette.addEventListener('pointercancel', relacher);
    }

    melanger(ORDRE_UNITES_CE2.slice()).forEach((unite) => {
      const etiquette = document.createElement('div');
      etiquette.className = 'unite-etiquette';
      etiquette.dataset.unite = unite;
      etiquette.textContent = unite;
      etiquette.setAttribute('aria-label', 'Étiquette ' + unite);
      plateau.appendChild(etiquette);
      rendreDeplacable(etiquette);
    });

    boutonValider.addEventListener('click', () => {
      const correct = slots.every((s, i) => {
        const etiquette = s.firstElementChild;
        return etiquette && etiquette.dataset.unite === ORDRE_UNITES_CE2[i];
      });
      if (!correct) {
        revelerDepots(
          slots.map((el, i) => ({ el, attendu: ORDRE_UNITES_CE2[i] })),
          Array.from(zone.querySelectorAll('.unite-etiquette'))
        );
      }
      validerTour(correct, boutonValider);
    });
    zone.appendChild(boutonValider);
  }

  /*
   * Exercice 2 « Classement » : tableau de 5 colonnes d'unité
   * (mm/cm/dm/m/km) réparties sur DEUX RANGÉES très espacées (3 puis 2)
   * pour que les zones de dépôt ne se chevauchent jamais et restent
   * confortables au doigt sur mobile. 5 vignettes À GLISSER, chacune un
   * bloc SOLIDAIRE de 3 éléments empilés (nombre seul, image SVG, nom) —
   * jamais l'unité écrite dessus, elle EST la colonne cible. Glisser-poser
   * réel (pointerdown/pointermove/pointerup, translateX/Y pendant le
   * geste) : déposer sur une colonne déjà occupée ÉCHANGE les deux
   * vignettes (l'occupante reprend la place de départ de la vignette
   * déplacée) plutôt que de l'éjecter vers le plateau. L'état (qui est où)
   * est lu directement dans le DOM à la validation, jamais dans une
   * structure parallèle qui pourrait se
   * désynchroniser.
   */
  function genererClassementDecouverteCE2(zone) {
    zone.appendChild(creerBlocConsigne(
      "Fais glisser chaque vignette vers la bonne colonne d'unité.",
      "Regarde le nombre et l'image de chaque vignette, puis fais-la glisser dans la colonne de l'unité qui convient. Valide quand les 5 vignettes sont placées."
    ));

    const grille = document.createElement('div');
    grille.className = 'decouverte-grille';
    const colonnes = {};
    [['mm', 'cm', 'dm'], ['m', 'km']].forEach((uniteLigne) => {
      const rangee = document.createElement('div');
      rangee.className = 'decouverte-rangee';
      uniteLigne.forEach((u) => {
        const colonne = document.createElement('div');
        colonne.className = 'decouverte-colonne';
        const entete = document.createElement('div');
        entete.className = 'decouverte-entete'; entete.textContent = u;
        const depot = document.createElement('div');
        depot.className = 'decouverte-depot'; depot.dataset.unite = u;
        colonne.appendChild(entete); colonne.appendChild(depot);
        rangee.appendChild(colonne);
        colonnes[u] = depot;
      });
      grille.appendChild(rangee);
    });
    zone.appendChild(grille);

    const plateau = document.createElement('div');
    plateau.className = 'decouverte-plateau';
    zone.appendChild(plateau);

    const boutonValider = document.createElement('button');
    boutonValider.type = 'button'; boutonValider.className = 'bouton-principal'; boutonValider.textContent = 'Valider';
    boutonValider.disabled = true;

    function toutPlace() {
      return Object.values(colonnes).every((c) => c.children.length === 1) && plateau.children.length === 0;
    }
    function majValidation() { boutonValider.disabled = !toutPlace(); }

    function rendreDeplacable(v) {
      let enGlissement = false;
      let departX = 0, departY = 0;
      let origine = null; // parent DE DÉPART du geste : là où retourne l'occupante évincée (swap)
      v.addEventListener('pointerdown', (e) => {
        if (etat.verrouille) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        enGlissement = true;
        departX = e.clientX; departY = e.clientY;
        origine = v.parentElement;
        v.classList.add('decouverte-vignette-glisse');
        try { v.setPointerCapture(e.pointerId); } catch (err) { /* pointeur déjà relâché : tant pis */ }
      });
      v.addEventListener('pointermove', (e) => {
        if (!enGlissement) return;
        e.preventDefault();
        v.style.transform = 'translate(' + (e.clientX - departX) + 'px,' + (e.clientY - departY) + 'px)';
      });
      function relacher(e) {
        if (!enGlissement) return;
        enGlissement = false;
        v.style.transform = '';
        v.classList.remove('decouverte-vignette-glisse');
        const cible = Object.values(colonnes).find((depot) => {
          const r = depot.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        });
        if (cible) {
          // ÉCHANGE : la vignette déjà présente dans la colonne cible reprend
          // la place D'OÙ VIENT la vignette déplacée (son parent de départ,
          // qu'il s'agisse du plateau ou d'une autre colonne) — jamais
          // éjectée vers le plateau sans raison.
          const occupante = cible.firstElementChild;
          if (occupante && occupante !== v) origine.appendChild(occupante);
          cible.appendChild(v);
        } else {
          origine.appendChild(v);
        }
        majValidation();
      }
      v.addEventListener('pointerup', relacher);
      v.addEventListener('pointercancel', relacher);
    }

    melanger(ELEMENTS_DECOUVERTE_CE2.slice()).forEach((item) => {
      const v = document.createElement('div');
      v.className = 'decouverte-vignette';
      v.dataset.unite = item.unite;
      v.setAttribute('aria-label', item.nom);
      const nombre = document.createElement('div');
      nombre.className = 'decouverte-nombre'; nombre.textContent = String(item.taille);
      const image = document.createElement('div');
      image.className = 'decouverte-image'; image.innerHTML = item.svg;
      const nom = document.createElement('div');
      nom.className = 'decouverte-nom'; nom.textContent = item.nom;
      v.appendChild(nombre); v.appendChild(image); v.appendChild(nom);
      plateau.appendChild(v);
      rendreDeplacable(v);
    });

    boutonValider.addEventListener('click', () => {
      const correct = Object.entries(colonnes).every(([u, depot]) => {
        const v = depot.firstElementChild;
        return v && v.dataset.unite === u;
      });
      if (!correct) {
        revelerDepots(
          Object.entries(colonnes).map(([u, el]) => ({ el, attendu: u })),
          Array.from(zone.querySelectorAll('.decouverte-vignette'))
        );
      }
      validerTour(correct, boutonValider);
    });
    zone.appendChild(boutonValider);
  }

  /* ================================================================
     Mini-jeu 2 — « L'exploration » (calculs de conversions et mesure à la
     règle, CE2) : alterne SANS regrouper par bloc les calculs procéduraux
     (fidèles aux exemples officiels du programme, saisis au pavé
     numérique diégétique) et la mesure à la règle graduée semi-transparente
     (réponse en cm OU en mm en alternance, explicitement précisé dans
     l'énoncé).
     ================================================================ */

  function genererExplorationCE2(zone, cfg) {
    const types = ['calcul', 'mesure'];
    const dispo = types.filter((t) => t !== etat.dernierSousTypeExploration);
    const sousType = choisir(dispo.length ? dispo : types);
    etat.dernierSousTypeExploration = sousType;
    if (sousType === 'calcul') genererCalculExplorationCE2(zone);
    else genererMesureExplorationCE2(zone, cfg);
  }

  /* Sous-type « calcul » : six gabarits calqués sur les exemples officiels
     du programme (3 cm + 4 mm = 34 mm ; 6 cm = 60 mm ; 215 cm = 2 m + 1 dm
     + 5 cm ; 16 m = 1600 cm = 160 dm ; 6 km = 6000 m ; 5 km + 750 m =
     5750 m) — même STRUCTURE, valeurs tirées procéduralement à chaque
     partie. Réponse à un seul nombre : pavé numérique diégétique (comme
     les conversions CE1). Réponse en trois nombres (décomposition m/dm/cm) :
     saisie décomposée déjà établie pour ce mini-jeu (creerSaisieDecomposition).
     Anti-répétition de texte par partie (etat.calculVues), comme
     genererConversionCE1. */
  function genererCalculExplorationCE2(zone) {
    if (!etat.calculVues) etat.calculVues = [];
    let texte, texteVoix, construire;
    for (let essai = 0; essai < 20; essai++) {
      const type = choisir(['cm-mm-somme', 'cm-mm-simple', 'cm-vers-mdc', 'm-vers-cm', 'km-vers-m', 'km-m-somme']);
      if (type === 'cm-mm-somme') {
        const cm = nombreAleatoire(1, 9);
        const mm = nombreAleatoire(1, 9);
        const reponse = cm * 10 + mm;
        texte = cm + ' cm + ' + mm + ' mm = combien de mm en tout ?';
        texteVoix = texte;
        construire = () => {
          const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === reponse, null, { donnee: valeur + ' mm', attendue: reponse + ' mm' }); }, 3);
          zone.appendChild(pave.el);
        };
      } else if (type === 'cm-mm-simple') {
        const cm = nombreAleatoire(2, 9);
        const reponse = cm * 10;
        texte = cm + ' cm = combien de mm ?';
        texteVoix = texte;
        construire = () => {
          const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === reponse, null, { donnee: valeur + ' mm', attendue: reponse + ' mm' }); }, 3);
          zone.appendChild(pave.el);
        };
      } else if (type === 'cm-vers-mdc') {
        const total = nombreAleatoire(105, 987);
        const m = Math.floor(total / 100);
        const dm = Math.floor((total % 100) / 10);
        const cm = total % 10;
        texte = 'Un serpent mesure ' + total + ' cm. Écris cette longueur avec des mètres, des décimètres et des centimètres.';
        texteVoix = 'Décompose ' + total + ' centimètres en mètres, décimètres et centimètres.';
        construire = () => creerSaisieDecomposition(zone, ['m', 'dm', 'cm'], [m, dm, cm]);
      } else if (type === 'm-vers-cm') {
        const m = nombreAleatoire(2, 30);
        const reponse = m * 100;
        texte = m + ' m = combien de cm ?';
        texteVoix = texte;
        construire = () => {
          const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === reponse, null, { donnee: valeur + ' cm', attendue: reponse + ' cm' }); }, 4);
          zone.appendChild(pave.el);
        };
      } else if (type === 'km-vers-m') {
        const km = nombreAleatoire(1, 9);
        const reponse = km * 1000;
        texte = km + ' km = combien de m ?';
        texteVoix = texte;
        construire = () => {
          const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === reponse, null, { donnee: valeur + ' m', attendue: reponse + ' m' }); }, 5);
          zone.appendChild(pave.el);
        };
      } else {
        const km = nombreAleatoire(1, 8);
        const m = nombreAleatoire(1, 9) * 50;
        const reponse = km * 1000 + m;
        texte = km + ' km + ' + m + ' m = combien de m en tout ?';
        texteVoix = texte;
        construire = () => {
          const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === reponse, null, { donnee: valeur + ' m', attendue: reponse + ' m' }); }, 5);
          zone.appendChild(pave.el);
        };
      }
      if (etat.calculVues.indexOf(texte) === -1) break;
    }
    if (etat.calculVues.length > 30) etat.calculVues = [];
    etat.calculVues.push(texte);
    zone.appendChild(creerBlocConsigne(texte, texteVoix));
    zone.appendChild(Object.assign(document.createElement('p'), {
      className: 'legende', textContent: 'Rappel : 1 cm = 10 mm, 1 m = 100 cm = 1000 mm, 1 km = 1000 m.'
    }));
    construire();
  }

  /* Sous-type « mesure » : règle graduée déjà en place (comme
     genererMesurer), stylée semi-transparente (même traitement que la
     règle déplaçable des paliers précédents, cf. .regle-graduee-glissable)
     pour laisser voir le segment mesuré. Longueur toujours un nombre
     ENTIER de cm (jamais de fraction de mm) pour que la conversion en mm
     reste un calcul exact (× 10) — réponse demandée EXPLICITEMENT en cm
     (QCM) ou en mm (pavé numérique) en alternance. */
  function genererMesureExplorationCE2(zone, cfg) {
    const cap = cfg.capCm || 20;
    const longueurCm = nombreAleatoire(3, cap - 2);
    const demanderMm = Math.random() < 0.5;

    zone.appendChild(creerBlocConsigne(
      demanderMm
        ? 'Mesure ce segment. Donne ta réponse en MILLIMÈTRES.'
        : 'Mesure ce segment. Donne ta réponse en CENTIMÈTRES.',
      demanderMm
        ? 'Regarde où s\'arrête le segment sur la règle, en centimètres, puis convertis ta mesure en millimètres.'
        : 'Regarde où s\'arrête le segment sur la règle graduée, et choisis la bonne longueur en centimètres.'
    ));
    const regle = construireRegle({ longueurUnites: cap, objetLongueur: longueurCm, unite: 'cm' });
    regle.querySelector('.regle-graduee').classList.add('regle-graduee-semi-transparente');
    zone.appendChild(regle);

    if (demanderMm) {
      const reponse = longueurCm * 10;
      const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === reponse, null, { donnee: valeur + ' mm', attendue: reponse + ' mm' }); }, 3);
      zone.appendChild(pave.el);
    } else {
      const distracteurs = new Set([longueurCm]);
      let tentatives = 0;
      while (distracteurs.size < 4 && tentatives < 30) {
        tentatives++;
        const d = longueurCm + choisir([-3, -2, -1, 1, 2, 3]);
        if (d >= 1 && d <= cap) distracteurs.add(d);
      }
      const options = Array.from(distracteurs).map(String);
      const indexBonne = options.indexOf(String(longueurCm));
      const { options: optionsMelangees, indexCorrect } = melangerOptions(options, indexBonne);
      const grille = document.createElement('div');
      grille.className = 'grille-options';
      optionsMelangees.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'bouton-option'; btn.textContent = opt + ' cm';
        btn.addEventListener('click', () => {
          Array.from(grille.children).forEach((b) => { b.disabled = true; });
          const correct = i === indexCorrect;
          btn.classList.add(correct ? 'correct' : 'incorrect');
          if (!correct) grille.children[indexCorrect].classList.add('correct');
          // Les distracteurs sont voisins de la bonne valeur (±1 à ±3 cm) :
          // on transmet les deux nombres pour que « Presque ! » ne sorte que
          // sur un écart d'une unité — le marquage vert/rouge des options fait
          // déjà office de correction, d'où `afficher: false`.
          validerTour(correct, btn, correct ? null : {
            afficher: false, nombres: [Number(opt), Number(optionsMelangees[indexCorrect])]
          });
        });
        grille.appendChild(btn);
      });
      zone.appendChild(grille);
    }
  }

  function creerSaisieDecomposition(zone, unites, reponses) {
    const cont = document.createElement('div');
    cont.className = 'saisie-decomposition';
    const champs = unites.map((unite) => {
      const wrap = document.createElement('label');
      wrap.className = 'champ-decomposition';
      const input = document.createElement('input');
      input.type = 'number'; input.min = '0'; input.inputMode = 'numeric';
      input.setAttribute('aria-label', unite);
      const spanU = document.createElement('span'); spanU.textContent = unite;
      wrap.appendChild(input); wrap.appendChild(spanU);
      cont.appendChild(wrap);
      return input;
    });
    zone.appendChild(cont);
    const boutonValider = document.createElement('button');
    boutonValider.type = 'button'; boutonValider.className = 'bouton-principal'; boutonValider.textContent = 'Valider';
    boutonValider.addEventListener('click', () => {
      const saisies = champs.map((c) => parseInt(c.value, 10));
      const correct = saisies.every((v, i) => v === reponses[i]);
      // CHARTE §18 : chaque champ passe au vert ou au rouge, et la
      // décomposition attendue est rappelée en toutes lettres.
      champs.forEach((champ, i) => {
        champ.disabled = true;
        champ.classList.add(saisies[i] === reponses[i] ? 'correct' : 'incorrect');
      });
      const enTexte = (vals) => vals.map((v, i) => (isNaN(v) ? '?' : v) + ' ' + unites[i]).join(' + ');
      validerTour(correct, boutonValider, correct ? null : { donnee: enTexte(saisies), attendue: enTexte(reponses) });
    });
    zone.appendChild(boutonValider);
  }

  /* ================================================================
     Mini-jeu 3 : « La cartographie » (périmètre, CE2, ex-M31 fusionné)
     Progression fixe sur les manches d'une partie, dans l'ordre même de
     l'apprentissage officiel :
       manches 1 et 2 → COMPARER le périmètre de deux polygones SANS règle
         graduée, en reportant chaque côté AU COMPAS sur une droite (texte
         officiel : « comparer le périmètre de plusieurs polygones sans
         règle graduée, en utilisant un compas ») ;
       manche 3 → étape A, démonstration ANIMÉE : le contour d'une VRAIE
         figure (rectangle/triangle dessiné en SVG) se déplie charnière par
         charnière en un segment droit, sur lequel la règle vient se poser
         pour le mesurer (regardée, pas manipulée) ;
       manches 4 à 7 → alternance de deux manipulations, la partie se
         terminant sur une mesure au double décimètre :
         étape B (manches 4 et 6), dépliage ACTIF côté par côté (figures
           variées : rectangle, triangle, figure en L) puis lecture du
           périmètre à la règle ;
         étape C (manches 5 et 7), mesure SANS dépliage d'un rectangle avec
           une règle mobile graduée sur ses deux bords qu'on glisse ET qu'on
           pivote à 90° (pincement à deux doigts, accroche magnétique), avec
           repli « deux règles indépendantes » en cas de geste trop difficile.
     ================================================================ */

  function genererPerimetre(zone, cfg) {
    if (etat.index <= 2) { genererPerimetreCompas(zone, cfg); return; }
    if (etat.index === 3) { genererPerimetreDemo(zone, cfg); return; }
    // Ensuite, alternance dépliage actif / mesure à la règle mobile
    // (manche 4 = B, 5 = C, 6 = B, …).
    if (etat.index % 2 === 0) genererPerimetreDepliageActif(zone, cfg);
    else genererPerimetreReglesMobiles(zone, cfg);
  }

  /* Échelle et longueur de règle des exercices de dépliage. Les deux sont
     liées : le contour déplié doit tenir ENTIER à l'écran pour être mesuré
     sans faire défiler, donc périmètre × PX ≤ largeur utile (~300 px sur
     mobile). C'est ce plafond qui fixe la taille apparente des figures — on
     resserre donc les périmètres (10 à 12 cm) pour pouvoir agrandir
     franchement l'échelle, et donc les figures elles-mêmes. */
  const PX_DEPLIAGE = 22;
  const CAP_DEPLIAGE = 13;

  /*
   * Une figure à cartographier, en coordonnées ENTIÈRES de cm (y vers le
   * bas, premier côté posé horizontalement sur la « droite » du bas — le
   * sol sur lequel le contour se dépliera). `pts` est la chaîne OUVERTE du
   * contour : dernier point = premier point (le contour est « coupé » au
   * coin bas-gauche pour pouvoir se dérouler). Périmètres de 10 à 12 cm.
   */
  function figureCartographie(typesAutorises) {
    const type = choisir(typesAutorises);
    if (type === 'rectangle') {
      const [grand, petit] = choisir([[3, 2], [4, 2], [3, 3]]);
      return {
        nom: 'rectangle',
        pts: [[0, petit], [grand, petit], [grand, 0], [0, 0], [0, petit]],
        cotes: [grand, petit, grand, petit]
      };
    }
    if (type === 'triangle') {
      // Côtés [a, b, c] dans l'ordre du parcours (base a, puis b, puis c) :
      // triangles valides (inégalité triangulaire) de périmètre 10 à 12 cm.
      const [a, b, c] = choisir([[4, 3, 3], [4, 4, 3], [3, 4, 4], [4, 4, 4], [5, 4, 3], [3, 3, 4]]);
      // Sommet C par intersection de cercles : |CA| = c, |CB| = b.
      const x = (a * a + c * c - b * b) / (2 * a);
      const h = Math.sqrt(Math.max(0.5, c * c - x * x));
      return { nom: 'triangle', pts: [[0, h], [a, h], [x, 0], [0, h]], cotes: [a, b, c] };
    }
    // « figure en L » : hexagone rectiligne (rectangle L×H auquel on a
    // retiré un coin w1×h1 en haut à droite) — côtés tous entiers,
    // périmètre = 2(L+H) exactement comme le rectangle englobant.
    const [L, H] = choisir([[3, 2], [3, 3], [4, 2]]);
    const w1 = nombreAleatoire(1, L - 1);
    const h1 = nombreAleatoire(1, Math.max(1, H - 1));
    return {
      nom: 'figure en L',
      pts: [[0, H], [L, H], [L, h1], [L - w1, h1], [L - w1, 0], [0, 0], [0, H]],
      cotes: [L, H - h1, w1, h1, L - w1, H]
    };
  }

  /*
   * Moteur de dépliage GÉOMÉTRIQUE du contour (démonstration, étape A) :
   * la figure est dessinée en SVG, chaque côté est un segment coloré, et
   * le dépliage redresse la chaîne charnière par charnière — à chaque
   * étape, tout le reste du contour PIVOTE d'un bloc autour du sommet
   * courant jusqu'à ce que le côté suivant se pose sur la droite du bas.
   * Uniquement des ROTATIONS : les longueurs des côtés sont préservées à
   * chaque instant de l'animation (c'est tout l'argument pédagogique : le
   * contour déplié a la MÊME longueur que le contour de la figure).
   *
   * Rend { el, restantes(), etapeSuivante(onFini), toutDeplier(onFini),
   * poserRegleSurSegment(cap, onFini) } — `etapeSuivante` anime UNE
   * charnière et appelle onFini(toutEstDeplie) (dépliage actif, étape B),
   * `toutDeplier` les enchaîne toutes (démonstration, étape A).
   * `poserRegleSurSegment` fait GLISSER une règle semi-transparente (sans
   * barre interne : le segment déplié EST l'objet mesuré, visible par
   * transparence) depuis le bord de la scène jusque SUR le segment, son
   * zéro aligné avec le début de la ligne (même échelle px/cm que le
   * dessin), comme une main qui pose une vraie règle pour mesurer.
   */
  function creerDepliageCartographie(figure, PX) {
    const base = figure.pts.map((p) => [p[0] * PX, p[1] * PX]);
    const nbSegments = base.length - 1;

    function appliquerRotation(pts, pivot, angle) {
      const px = pts[pivot][0], py = pts[pivot][1];
      const c = Math.cos(angle), s = Math.sin(angle);
      return pts.map((p, i) => {
        if (i <= pivot) return p.slice();
        const dx = p[0] - px, dy = p[1] - py;
        return [px + dx * c - dy * s, py + dx * s + dy * c];
      });
    }

    // Pré-calcule les étapes : pour chaque charnière j (le premier côté est
    // déjà posé sur la droite), l'angle qui ramène le côté j à l'horizontale.
    const etapes = [];
    let courant = base.map((p) => p.slice());
    for (let j = 1; j < nbSegments; j++) {
      const dx = courant[j + 1][0] - courant[j][0];
      const dy = courant[j + 1][1] - courant[j][1];
      let delta = -Math.atan2(dy, dx);
      while (delta > Math.PI) delta -= 2 * Math.PI;
      while (delta <= -Math.PI) delta += 2 * Math.PI;
      etapes.push({ depart: courant.map((p) => p.slice()), pivot: j, delta });
      courant = appliquerRotation(courant, j, delta);
    }
    const finalPts = courant;

    // Dimensionne le viewBox en échantillonnant TOUTE l'animation : pendant
    // une rotation, le bout de chaîne balaie des arcs qui montent bien
    // au-dessus de la figure — sans cela, les arcs seraient rognés.
    let minX = 0, maxX = 0, minY = 0, maxY = 0;
    function etendre(pts) {
      pts.forEach((p) => {
        if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
        if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
      });
    }
    etendre(base); etendre(finalPts);
    etapes.forEach((e) => {
      for (let t = 0.1; t < 1; t += 0.1) etendre(appliquerRotation(e.depart, e.pivot, e.delta * t));
    });
    const MARGE = 8;
    const largeur = Math.ceil(maxX - minX + MARGE * 2);
    const hauteur = Math.ceil(maxY - minY + MARGE * 2);
    const ox = MARGE - minX, oy = MARGE - minY;

    const SVGNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('width', largeur);
    svg.setAttribute('height', hauteur);
    svg.setAttribute('viewBox', '0 0 ' + largeur + ' ' + hauteur);
    svg.setAttribute('aria-hidden', 'true');

    // La « droite » du bas sur laquelle le contour se déplie (pointillés).
    const droite = document.createElementNS(SVGNS, 'line');
    droite.setAttribute('x1', base[0][0] + ox); droite.setAttribute('y1', base[0][1] + oy);
    droite.setAttribute('x2', finalPts[finalPts.length - 1][0] + ox); droite.setAttribute('y2', base[0][1] + oy);
    droite.style.stroke = 'color-mix(in srgb, var(--couleur-encre) 30%, white)';
    droite.setAttribute('stroke-width', '2');
    droite.setAttribute('stroke-dasharray', '6 5');
    svg.appendChild(droite);

    // La « clairière » d'origine, en couleur CLAIRE : elle reste affichée
    // pendant tout le dépliage ET pendant la mesure, comme mémoire de la
    // forme dont on est parti — l'enfant voit ainsi en permanence que la
    // ligne droite qu'il mesure est bien le contour de CETTE figure-là.
    const fond = document.createElementNS(SVGNS, 'polygon');
    fond.setAttribute('points', base.map((p) => (p[0] + ox) + ',' + (p[1] + oy)).join(' '));
    fond.style.fill = 'color-mix(in srgb, var(--couleur-menthe) 22%, white)';
    fond.style.stroke = 'color-mix(in srgb, var(--couleur-menthe) 55%, white)';
    fond.setAttribute('stroke-width', '2');
    fond.setAttribute('stroke-dasharray', '5 4');
    svg.appendChild(fond);

    const lignes = [];
    for (let i = 0; i < nbSegments; i++) {
      const ln = document.createElementNS(SVGNS, 'line');
      ln.style.stroke = COULEURS_COTES[i % COULEURS_COTES.length];
      ln.setAttribute('stroke-width', '6');
      ln.setAttribute('stroke-linecap', 'round');
      svg.appendChild(ln);
      lignes.push(ln);
    }
    function dessiner(pts) {
      for (let i = 0; i < nbSegments; i++) {
        lignes[i].setAttribute('x1', (pts[i][0] + ox).toFixed(1));
        lignes[i].setAttribute('y1', (pts[i][1] + oy).toFixed(1));
        lignes[i].setAttribute('x2', (pts[i + 1][0] + ox).toFixed(1));
        lignes[i].setAttribute('y2', (pts[i + 1][1] + oy).toFixed(1));
      }
    }
    dessiner(base);

    const wrap = document.createElement('div');
    wrap.className = 'cartographie-scene';
    const interne = document.createElement('div');
    interne.style.position = 'relative';
    interne.style.width = largeur + 'px';
    interne.appendChild(svg);
    wrap.appendChild(interne);

    const preferesMouvementReduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let indexEtape = 0;
    let animationEnCours = false;

    function etapeSuivante(onFini) {
      if (animationEnCours || indexEtape >= etapes.length) return false;
      animationEnCours = true;
      const e = etapes[indexEtape];
      const duree = preferesMouvementReduit ? 0 : 450;
      const debut = performance.now();
      function frame(maintenant) {
        const t = duree === 0 ? 1 : Math.min(1, (maintenant - debut) / duree);
        const doux = t * (2 - t);
        dessiner(appliquerRotation(e.depart, e.pivot, e.delta * doux));
        if (t < 1) { requestAnimationFrame(frame); return; }
        indexEtape++;
        animationEnCours = false;
        if (onFini) onFini(indexEtape >= etapes.length);
      }
      requestAnimationFrame(frame);
      return true;
    }

    function toutDeplier(onToutFini) {
      etapeSuivante((fini) => {
        if (fini) { onToutFini(); return; }
        setTimeout(() => toutDeplier(onToutFini), preferesMouvementReduit ? 0 : 200);
      });
    }

    function poserRegleSurSegment(cap, onFini) {
      // Règle SANS objetLongueur : pas de barre interne dupliquée, le
      // segment déplié (visible par transparence) est l'objet mesuré.
      // `pxUnite` force la MÊME échelle que le dessin (sans quoi la règle
      // se dimensionnerait toute seule et la mesure serait fausse) et lui
      // donne au passage sa variante « grande », mieux lisible.
      const wrapRegle = construireRegle({ longueurUnites: cap, unite: 'cm', pxUnite: PX });
      const regle = wrapRegle.firstElementChild;
      regle.classList.add('regle-graduee-semi-transparente', 'cartographie-regle-posee');
      // Position finale : zéro de la règle aligné avec le début du segment
      // (le tick 0 est à 2.5px du bord de l'élément, sa bordure), et le
      // segment traversant le HAUT de la règle — à la place qu'occupe la
      // barre rouge dans les autres lectures de règle de la série.
      const cibleX = Math.max(0, base[0][0] + ox - 2.5);
      const cibleY = base[0][1] + oy - 18;
      regle.style.left = cibleX + 'px';
      regle.style.top = cibleY + 'px';
      interne.style.width = Math.max(largeur, cibleX + cap * PX + 24) + 'px';
      interne.style.height = (cibleY + 100) + 'px';
      if (preferesMouvementReduit) {
        interne.appendChild(regle);
        if (onFini) onFini();
        return;
      }
      // La règle ARRIVE sur le segment : départ décalé en bas à droite,
      // puis glissement (transform seul) jusqu'à la position de mesure.
      regle.style.transform = 'translate(80px, 46px)';
      regle.style.opacity = '0';
      interne.appendChild(regle);
      void regle.offsetWidth;
      regle.style.transition = 'transform .8s ease, opacity .35s ease';
      regle.style.transform = 'translate(0px, 0px)';
      regle.style.opacity = '';
      setTimeout(() => { if (onFini) onFini(); }, 880);
    }

    return {
      el: wrap,
      restantes: () => etapes.length - indexEtape,
      etapeSuivante,
      toutDeplier,
      poserRegleSurSegment
    };
  }

  const COULEURS_COTES = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];

  /*
   * Un bloc « polygone à reporter au compas » : le polygone dessiné en SVG
   * (côtés colorés et tactiles), une droite pointillée en dessous, et un
   * COMPAS animé qui, à chaque côté touché, vient prendre l'écartement de
   * ce côté puis le reporte bout à bout sur la droite. Aucune graduation
   * nulle part : on ne compare que des longueurs reportées, conformément au
   * texte officiel (« sans règle graduée, en utilisant un compas »).
   * `largeurCommune` est imposée par l'appelant pour que les droites des
   * deux polygones démarrent au MÊME x à l'écran, sans quoi la comparaison
   * visuelle des deux reports serait faussée.
   */
  function creerBlocCompas(lettre, figure, PX, largeurCommune, onTousReportes) {
    const SVGNS = 'http://www.w3.org/2000/svg';
    const MARGE_G = 12;
    const MARGE_HAUT = 74; // place pour que le compas déployé tienne au-dessus
    const pts = figure.pts.map((p) => [p[0] * PX + MARGE_G, p[1] * PX + MARGE_HAUT]);
    const nbCotes = pts.length - 1;
    const hauteurPolygone = Math.max.apply(null, pts.map((p) => p[1]));
    const yLigne = hauteurPolygone + 30;
    const hauteur = yLigne + 18;

    const bloc = document.createElement('div');
    bloc.className = 'compas-bloc';
    const titre = document.createElement('div');
    titre.className = 'compas-titre';
    titre.textContent = 'Clairière ' + lettre;
    bloc.appendChild(titre);

    const scene = document.createElement('div');
    scene.className = 'compas-scene';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('width', largeurCommune);
    svg.setAttribute('height', hauteur);
    svg.setAttribute('viewBox', '0 0 ' + largeurCommune + ' ' + hauteur);
    svg.setAttribute('aria-hidden', 'true');
    scene.appendChild(svg);
    bloc.appendChild(scene);

    const poly = document.createElementNS(SVGNS, 'polygon');
    poly.setAttribute('points', pts.map((p) => p[0] + ',' + p[1]).join(' '));
    poly.style.fill = 'color-mix(in srgb, var(--couleur-menthe) 20%, white)';
    svg.appendChild(poly);

    // La droite sur laquelle on reporte les côtés, bout à bout.
    const droite = document.createElementNS(SVGNS, 'line');
    droite.setAttribute('x1', MARGE_G); droite.setAttribute('y1', yLigne);
    droite.setAttribute('x2', largeurCommune - MARGE_G); droite.setAttribute('y2', yLigne);
    droite.style.stroke = 'color-mix(in srgb, var(--couleur-encre) 32%, white)';
    droite.setAttribute('stroke-width', '2');
    droite.setAttribute('stroke-dasharray', '6 5');
    svg.appendChild(droite);

    const gReports = document.createElementNS(SVGNS, 'g');
    svg.appendChild(gReports);

    // Chaque côté : un trait coloré + une zone tactile large par-dessus.
    const cotes = [];
    for (let i = 0; i < nbCotes; i++) {
      const couleur = COULEURS_COTES[i % COULEURS_COTES.length];
      // Côté PAS ENCORE reporté : trait épais, coloré, bien plein.
      const trait = document.createElementNS(SVGNS, 'line');
      trait.setAttribute('x1', pts[i][0]); trait.setAttribute('y1', pts[i][1]);
      trait.setAttribute('x2', pts[i + 1][0]); trait.setAttribute('y2', pts[i + 1][1]);
      trait.style.stroke = couleur;
      trait.setAttribute('stroke-width', '9');
      trait.setAttribute('stroke-linecap', 'round');
      svg.appendChild(trait);

      // Zone tactile : un RECTANGLE posé le long du côté (et non un trait
      // épais), pour offrir une vraie surface au doigt — un segment SVG,
      // même à stroke-width élevé, reste une boîte plate à la hauteur nulle
      // quand le côté est horizontal.
      const dxc = pts[i + 1][0] - pts[i][0], dyc = pts[i + 1][1] - pts[i][1];
      const zone = document.createElementNS(SVGNS, 'rect');
      zone.setAttribute('x', '0');
      zone.setAttribute('y', '-15');
      zone.setAttribute('width', Math.hypot(dxc, dyc).toFixed(1));
      zone.setAttribute('height', '30');
      zone.setAttribute('fill', 'transparent');
      zone.setAttribute('transform', 'translate(' + pts[i][0].toFixed(1) + ',' + pts[i][1].toFixed(1)
        + ') rotate(' + (Math.atan2(dyc, dxc) * 180 / Math.PI).toFixed(1) + ')');
      zone.setAttribute('class', 'compas-cote-zone');
      svg.appendChild(zone);

      cotes.push({ P1: pts[i], P2: pts[i + 1], trait, zone, couleur, reporte: false });
    }

    // Le compas, redessiné à chaque côté (son écartement change).
    const gCompas = document.createElementNS(SVGNS, 'g');
    gCompas.style.opacity = '0';
    gCompas.style.pointerEvents = 'none';
    svg.appendChild(gCompas);

    const ENCRE = 'color-mix(in srgb, var(--couleur-encre) 80%, white)';
    function dessinerCompas(L) {
      while (gCompas.firstChild) gCompas.removeChild(gCompas.firstChild);
      // Branches de longueur FIXE : l'angle d'ouverture suit l'écartement,
      // comme un vrai compas (plus le côté est long, plus il s'ouvre).
      const R = Math.max(48, L * 0.72);
      const h = Math.sqrt(Math.max(1, R * R - (L / 2) * (L / 2)));
      const cx = L / 2, cy = -h;
      function seg(x1, y1, x2, y2, larg) {
        const l = document.createElementNS(SVGNS, 'line');
        l.setAttribute('x1', x1.toFixed(1)); l.setAttribute('y1', y1.toFixed(1));
        l.setAttribute('x2', x2.toFixed(1)); l.setAttribute('y2', y2.toFixed(1));
        l.style.stroke = ENCRE;
        l.setAttribute('stroke-width', larg);
        l.setAttribute('stroke-linecap', 'round');
        gCompas.appendChild(l);
      }
      seg(cx, cy, 0, 0, 3.5);          // branche de la pointe sèche
      seg(cx, cy, L, 0, 3.5);          // branche de la mine
      seg(cx, cy, cx, cy - 11, 4.5);   // poignée
      const charniere = document.createElementNS(SVGNS, 'circle');
      charniere.setAttribute('cx', cx.toFixed(1)); charniere.setAttribute('cy', cy.toFixed(1));
      charniere.setAttribute('r', '4.5');
      charniere.style.fill = ENCRE;
      gCompas.appendChild(charniere);
    }

    const preferesMouvementReduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function animer(duree, onFrame, onFin) {
      if (duree <= 0) { onFrame(1); if (onFin) onFin(); return; }
      const debut = performance.now();
      function frame(maintenant) {
        const p = Math.min(1, (maintenant - debut) / duree);
        onFrame(p);
        if (p < 1) requestAnimationFrame(frame);
        else if (onFin) onFin();
      }
      requestAnimationFrame(frame);
    }

    let xCourant = 0;   // avancement du report sur la droite
    let occupe = false; // une animation à la fois

    const legende = document.createElement('p');
    legende.className = 'legende';
    function majLegende() {
      const restants = cotes.filter((c) => !c.reporte).length;
      legende.textContent = restants
        ? 'Touche un côté de la clairière ' + lettre + ' pour le reporter au compas (' + restants + ' restant' + (restants > 1 ? 's' : '') + ').'
        : 'Clairière ' + lettre + ' : tous les côtés sont reportés !';
    }
    majLegende();
    bloc.appendChild(legende);

    function reporter(idx) {
      if (occupe || etat.verrouille) return;
      const c = cotes[idx];
      if (c.reporte) return;
      occupe = true;
      c.reporte = true;

      const dx = c.P2[0] - c.P1[0], dy = c.P2[1] - c.P1[1];
      const L = Math.hypot(dx, dy);
      const angleDepart = Math.atan2(dy, dx) * 180 / Math.PI;
      // On tourne par le plus court chemin jusqu'à l'horizontale.
      let dA = -angleDepart;
      while (dA > 180) dA -= 360;
      while (dA <= -180) dA += 360;
      const xArrivee = MARGE_G + xCourant;

      dessinerCompas(L);
      function poser(x, y, a) {
        gCompas.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + a.toFixed(1) + ')');
      }
      poser(c.P1[0], c.P1[1], angleDepart);

      // 1. le compas se pose sur le côté et en prend l'écartement…
      animer(preferesMouvementReduit ? 0 : 280, (p) => { gCompas.style.opacity = String(p); }, () => {
        // 2. …il se déplace jusqu'à la droite en se redressant…
        animer(preferesMouvementReduit ? 0 : 480, (p) => {
          const doux = p * (2 - p);
          poser(c.P1[0] + (xArrivee - c.P1[0]) * doux,
                c.P1[1] + (yLigne - c.P1[1]) * doux,
                angleDepart + dA * doux);
        }, () => {
          // 3. …et y dépose le report, bout à bout avec les précédents.
          const seg = document.createElementNS(SVGNS, 'line');
          seg.setAttribute('x1', xArrivee); seg.setAttribute('y1', yLigne);
          seg.setAttribute('x2', xArrivee + L); seg.setAttribute('y2', yLigne);
          seg.style.stroke = c.couleur;
          seg.setAttribute('stroke-width', '7');
          gReports.appendChild(seg);
          xCourant += L;
          // Côté DÉJÀ reporté : on change tout à la fois (épaisseur, couleur
          // et style de trait) plutôt que la seule opacité, pour qu'un coup
          // d'œil suffise à voir ce qu'il reste à faire — un trait fin, gris
          // et pointillé ne peut pas être confondu avec un côté à reporter.
          c.trait.setAttribute('stroke-width', '3');
          c.trait.setAttribute('stroke-dasharray', '5 4');
          c.trait.style.stroke = 'color-mix(in srgb, var(--couleur-encre) 22%, white)';
          c.zone.style.cursor = 'default';
          c.zone.style.pointerEvents = 'none';
          majLegende();
          animer(preferesMouvementReduit ? 0 : 200, (p) => { gCompas.style.opacity = String(1 - p); }, () => {
            gCompas.style.opacity = '0';
            occupe = false;
            if (cotes.every((x) => x.reporte)) onTousReportes();
          });
        });
      });
    }

    cotes.forEach((c, i) => { c.zone.addEventListener('click', () => reporter(i)); });

    return { el: bloc, largeurReport: () => xCourant };
  }

  /*
   * Manches 1 et 2 — COMPARER deux polygones au compas, sans règle graduée.
   * L'enfant reporte chaque côté de chaque polygone sur une droite, puis
   * compare les deux longueurs obtenues à l'œil : c'est le report, pas la
   * mesure, qui tranche. Les deux périmètres sont volontairement PROCHES
   * (1 à 4 cm d'écart) pour qu'on ne puisse pas conclure sans reporter.
   */
  /*
   * Un polygone à comparer au compas. Contrairement aux figures du dépliage,
   * ici AUCUN côté ne descend sous 3 cm : un côté minuscule se repère mal
   * sur la figure comme une fois reporté sur la droite. Périmètres de 10 à
   * 16 cm, dessinés en grand (cf. PX ci-dessous) pour que chaque côté soit
   * franchement visible.
   */
  function polygoneCompas() {
    if (Math.random() < 0.45) {
      const [L, l] = choisir([[3, 3], [4, 3], [5, 3], [4, 4]]);
      return { nom: 'rectangle', pts: [[0, l], [L, l], [L, 0], [0, 0], [0, l]], cotes: [L, l, L, l] };
    }
    // Triangles à côtés ≥ 3 cm respectant l'inégalité triangulaire.
    const [a, b, c] = choisir([[3, 3, 4], [3, 4, 4], [4, 4, 4], [4, 4, 5], [3, 5, 5],
      [4, 5, 5], [5, 5, 5], [4, 5, 6], [5, 4, 6]]);
    const x = (a * a + c * c - b * b) / (2 * a);
    const h = Math.sqrt(Math.max(0.5, c * c - x * x));
    return { nom: 'triangle', pts: [[0, h], [a, h], [x, 0], [0, h]], cotes: [a, b, c] };
  }

  function genererPerimetreCompas(zone, cfg) {
    const PX = 18; // grande échelle : le plus petit côté fait déjà 54 px
    const perim = (f) => f.cotes.reduce((a, b) => a + b, 0);
    const figureA = polygoneCompas();
    let figureB = null;
    for (let essai = 0; essai < 60 && !figureB; essai++) {
      const candidate = polygoneCompas();
      const ecart = Math.abs(perim(figureA) - perim(candidate));
      if (ecart >= 1 && ecart <= 4) figureB = candidate;
    }
    if (!figureB) {
      // Repli (jamais atteint en pratique) : un rectangle d'écart garanti.
      const l = 3;
      const L = Math.max(3, Math.round(perim(figureA) / 2) - l + choisir([-1, 1]));
      figureB = {
        nom: 'rectangle',
        pts: [[0, l], [L, l], [L, 0], [0, 0], [0, l]],
        cotes: [L, l, L, l]
      };
    }

    const demanderPlusGrand = Math.random() < 0.5;
    const bonneLettre = demanderPlusGrand
      ? (perim(figureA) > perim(figureB) ? 'A' : 'B')
      : (perim(figureA) < perim(figureB) ? 'A' : 'B');

    zone.appendChild(creerBlocConsigne(
      'Sans les mesurer, reporte chaque côté au compas pour comparer les deux clairières.',
      'Touche un côté d\'une clairière : le compas vient en prendre l\'écartement, puis le reporte sur la ligne du dessous. Quand tous les côtés des deux clairières sont reportés, compare les deux lignes obtenues.'
    ));

    // Largeur commune aux deux scènes : les deux droites de report doivent
    // démarrer au même x, et pouvoir accueillir le plus long des deux
    // périmètres comme le plus large des deux polygones.
    const largeurUtile = Math.max(
      perim(figureA), perim(figureB),
      Math.max.apply(null, figureA.pts.map((p) => p[0])),
      Math.max.apply(null, figureB.pts.map((p) => p[0]))
    ) * PX;
    const largeurCommune = Math.round(largeurUtile) + 24;

    let blocsFinis = 0;
    const grille = document.createElement('div');
    grille.className = 'grille-options';
    grille.hidden = true;

    function unBlocDeFini() {
      blocsFinis++;
      if (blocsFinis < 2) return;
      grille.hidden = false;
      const question = document.createElement('p');
      question.className = 'legende';
      question.textContent = 'Regarde les deux lignes : quelle clairière a le périmètre le plus '
        + (demanderPlusGrand ? 'grand' : 'petit') + ' ?';
      zone.insertBefore(question, grille);
      lireAVoixHaute(question.textContent);
      ['A', 'B'].forEach((lettre) => {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'bouton-option';
        btn.textContent = 'Clairière ' + lettre;
        btn.addEventListener('click', () => {
          Array.from(grille.children).forEach((b) => { b.disabled = true; });
          const correct = lettre === bonneLettre;
          btn.classList.add(correct ? 'correct' : 'incorrect');
          if (!correct) {
            const bonneBtn = Array.from(grille.children).find((b) => b.textContent === 'Clairière ' + bonneLettre);
            if (bonneBtn) bonneBtn.classList.add('correct');
          }
          validerTour(correct, btn);
        });
        grille.appendChild(btn);
      });
    }

    zone.appendChild(creerBlocCompas('A', figureA, PX, largeurCommune, unBlocDeFini).el);
    zone.appendChild(creerBlocCompas('B', figureB, PX, largeurCommune, unBlocDeFini).el);
    zone.appendChild(grille);
  }

  /*
   * Étape A — démonstration ANIMÉE (regardée, pas manipulée) : la clairière
   * (rectangle ou triangle, dessinée en SVG) déplie toute seule son contour
   * charnière par charnière jusqu'à la ligne droite, puis la règle VIENT SE
   * POSER sur le segment pour le mesurer et conclure « le périmètre, c'est
   * la longueur du contour déplié ». Le bouton « Continuer » ne se débloque
   * qu'une fois l'animation terminée, et valide toujours (observation, pas
   * un exercice noté).
   */
  function genererPerimetreDemo(zone, cfg) {
    const cap = CAP_DEPLIAGE;
    const figure = figureCartographie(['rectangle', 'triangle']);
    const total = figure.cotes.reduce((a, b) => a + b, 0);

    zone.appendChild(creerBlocConsigne(
      'Regarde bien : le périmètre, c\'est la longueur du contour… une fois déplié !',
      'Regarde l\'animation : le contour de la clairière en forme de ' + figure.nom +
        ' se déplie, côté après côté, jusqu\'à former une seule ligne droite. La règle vient alors la mesurer : c\'est le périmètre.'
    ));

    const depliage = creerDepliageCartographie(figure, PX_DEPLIAGE);
    zone.appendChild(depliage.el);

    const legende = document.createElement('p');
    legende.className = 'legende';
    legende.textContent = 'Une clairière en forme de ' + figure.nom + '. Son contour va se déplier tout seul…';
    zone.appendChild(legende);

    const boutonContinuer = document.createElement('button');
    boutonContinuer.type = 'button'; boutonContinuer.className = 'bouton-principal'; boutonContinuer.textContent = 'J\'ai compris, continuer';
    boutonContinuer.disabled = true;
    zone.appendChild(boutonContinuer);
    boutonContinuer.addEventListener('click', () => validerTour(true, boutonContinuer));

    const preferesMouvementReduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => {
      depliage.toutDeplier(() => {
        legende.textContent = 'Le contour est déplié : la règle vient le mesurer…';
        depliage.poserRegleSurSegment(cap, () => {
          const conclusion = 'La ligne mesure ' + total + ' cm : le périmètre de cette clairière en forme de ' + figure.nom + ' est ' + total + ' cm !';
          legende.textContent = conclusion;
          lireAVoixHaute(conclusion);
          boutonContinuer.disabled = false;
        });
      });
    }, preferesMouvementReduit ? 0 : 900);
  }

  /* QCM de lecture du périmètre sur la règle (étape B) : 4 options en cm
     autour de la bonne valeur. */
  function construireQCMPerimetre(zone, bonne, cap, borneMin) {
    const distracteurs = new Set([bonne]);
    let tentatives = 0;
    while (distracteurs.size < 4 && tentatives < 30) {
      tentatives++;
      const d = bonne + choisir([-3, -2, -1, 1, 2, 3]);
      if (d >= (borneMin || 1) && d <= cap) distracteurs.add(d);
    }
    const options = Array.from(distracteurs).map(String);
    const indexBonne = options.indexOf(String(bonne));
    const { options: optionsMelangees, indexCorrect } = melangerOptions(options, indexBonne);
    const grille = document.createElement('div');
    grille.className = 'grille-options';
    optionsMelangees.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'bouton-option'; btn.textContent = opt + ' cm';
      btn.addEventListener('click', () => {
        Array.from(grille.children).forEach((b) => { b.disabled = true; });
        const correct = i === indexCorrect;
        btn.classList.add(correct ? 'correct' : 'incorrect');
        if (!correct) grille.children[indexCorrect].classList.add('correct');
        // Les distracteurs sont voisins de la bonne valeur (±1 à ±3 cm) :
        // on transmet les deux nombres pour que « Presque ! » ne sorte que
        // sur un écart d'une unité — le marquage vert/rouge des options fait
        // déjà office de correction, d'où `afficher: false`.
        validerTour(correct, btn, correct ? null : {
          afficher: false, nombres: [Number(opt), Number(optionsMelangees[indexCorrect])]
        });
      });
      grille.appendChild(btn);
    });
    zone.appendChild(grille);
  }

  /*
   * Étape B — dépliage ACTIF : cette fois c'est l'enfant qui déroule le
   * contour, un côté à la fois (tap sur le bouton OU sur la figure), sur
   * une figure variée (rectangle, triangle ou figure en L). Une fois la
   * ligne toute droite, la règle vient se poser dessus et l'enfant lit le
   * périmètre (QCM, comme les lectures de règle du mini-jeu 2).
   */
  function genererPerimetreDepliageActif(zone, cfg) {
    const cap = CAP_DEPLIAGE;
    const figure = figureCartographie(['rectangle', 'triangle', 'coin']);
    const total = figure.cotes.reduce((a, b) => a + b, 0);

    zone.appendChild(creerBlocConsigne(
      'À toi ! Déplie le contour côté par côté, puis mesure le périmètre.',
      'Touche le bouton, ou la figure, pour déplier le contour de la clairière en forme de ' + figure.nom +
        ', un côté à la fois. Quand la ligne est toute droite, la règle vient se poser dessus : lis sa longueur, c\'est le périmètre.'
    ));

    const depliage = creerDepliageCartographie(figure, PX_DEPLIAGE);
    zone.appendChild(depliage.el);

    const boutonDeplier = document.createElement('button');
    boutonDeplier.type = 'button'; boutonDeplier.className = 'bouton-principal';
    function majLibelle() {
      const restantes = depliage.restantes();
      boutonDeplier.textContent = 'Déplier le côté suivant (' + restantes + ' restant' + (restantes > 1 ? 's' : '') + ')';
    }
    majLibelle();

    const zoneLecture = document.createElement('div');

    function toutEstDeplie() {
      boutonDeplier.hidden = true;
      depliage.poserRegleSurSegment(cap, () => {
        const legende = document.createElement('p');
        legende.className = 'legende';
        legende.textContent = 'La ligne est toute droite et la règle est posée ! Combien mesure-t-elle ? C\'est le périmètre de la clairière.';
        zoneLecture.appendChild(legende);

    function deplier() {

    zone.appendChild(boutonDeplier);
    zone.appendChild(zoneLecture);
