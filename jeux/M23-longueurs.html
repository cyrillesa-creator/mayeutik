  /*
   * Composant réutilisable : règle mobile qu'on peut GLISSER (translation,
   * 1 doigt/pointeur) et FAIRE PIVOTER (pincement/rotation à deux doigts,
   * 2 pointeurs simultanés suivis par pointerId). La règle SUIT les doigts
   * en continu pendant le geste ; accroche magnétique : dès que l'angle
   * passe à moins de 12° d'un multiple de 90°, l'AFFICHAGE se verrouille
   * sur cet angle exact (bordure menthe en retour visuel) au lieu de
   * rester à la valeur approximative des doigts — et c'est cet angle
   * affiché qui est retenu quand le geste se termine dans la fenêtre
   * magnétique. `onAngleAccroche(angle)` est notifié à chaque nouvelle
   * accroche (90/270 = verticale : sert à débloquer la mesure du côté
   * vertical). `angleInitial` fige la règle dans une orientation (repli
   * « deux règles indépendantes », qui n'a pas besoin de pivoter).
   */
  function creerRegleMobile(cap, angleInitial, onAngleAccroche, depart) {
    const PX = 16;
    const regle = document.createElement('div');
    regle.className = 'regle-graduee regle-mobile';
    regle.style.width = (cap * PX + 24) + 'px';
    // Double décimètre : une graduation sur CHACUN des deux bords longs,
    // comme une vraie règle d'écolier. L'enfant lit sur le bord qui touche
    // le côté mesuré, sans avoir à retourner la règle — utile ici puisqu'elle
    // pivote pour passer d'un côté horizontal à un côté vertical.
    // Comme sur les règles du commerce, la SECONDE échelle est numérotée en
    // SENS INVERSE (cap → 0 de gauche à droite) et d'une autre couleur, pour
    // qu'on ne confonde jamais les deux séries de chiffres.
    for (let i = 0; i <= cap; i++) {
      const forte = i % 2 === 0;
      ['', ' regle-tick-haut'].forEach((bord) => {
        const tick = document.createElement('div');
        tick.className = 'regle-tick' + (forte ? ' regle-tick-forte' : '') + bord;
        tick.style.left = (i * PX) + 'px';
        regle.appendChild(tick);
      });
      if (forte) {
        const lab = document.createElement('div');
        lab.className = 'regle-label';
        lab.style.left = (i * PX) + 'px';
        lab.textContent = String(i);
        regle.appendChild(lab);

        const labHaut = document.createElement('div');
        labHaut.className = 'regle-label-haut';
        labHaut.style.left = (i * PX) + 'px';
        labHaut.textContent = String(cap - i); // numérotation inversée
        regle.appendChild(labHaut);
      }
    }

    const X0 = (depart && depart.x) || 20, Y0 = (depart && depart.y) || 20;
    let x = X0, y = Y0;
    let angleLogique = angleInitial || 0;   // l'angle « vrai » des doigts
    let angleAffiche = angleInitial || 0;   // l'angle rendu (aimanté ou libre)
    let dernierAccroche = angleInitial || 0;
    function normaliser360(a) { return ((a % 360) + 360) % 360; }
    function accrocher(a) {
      const n = normaliser360(a);
      const paliers = [0, 90, 180, 270, 360];
      for (let i = 0; i < paliers.length; i++) {
        if (Math.abs(n - paliers[i]) <= 12) return paliers[i] % 360;
      }
      return null; // pas assez proche d'un multiple de 90° : rotation libre
    }
    /* Empreinte réelle de la règle une fois TOURNÉE, exprimée depuis son
       origine de transformation (0 50%). À 0° elle est large et plate, à 90°
       haute et étroite : les bornes de déplacement doivent donc être
       recalculées à chaque application, jamais figées sur la taille au repos. */
    function empreinte() {
      const W = regle.offsetWidth, H = regle.offsetHeight;
      const a = angleAffiche * Math.PI / 180;
      const cos = Math.cos(a), sin = Math.sin(a);
      // Coins de la boîte, ramenés à l'origine de transformation (0, H/2).
      const coins = [[0, -H / 2], [W, -H / 2], [W, H / 2], [0, H / 2]];
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      coins.forEach((pt) => {
        const rx = pt[0] * cos - pt[1] * sin;
        const ry = pt[0] * sin + pt[1] * cos;
        if (rx < minX) minX = rx; if (rx > maxX) maxX = rx;
        if (ry < minY) minY = ry; if (ry > maxY) maxY = ry;
      });
      return { minX, maxX, minY, maxY, H };
    }

    /* Contrainte de position. La règle DOIT pouvoir déborder de la scène :
       pour mesurer un côté qui va jusqu'au bord, son zéro doit se poser sur ce
       bord, et le reste de la règle passe forcément au-delà. Mais la scène est
       en `overflow:hidden` : une règle entièrement sortie devient invisible ET
       insaisissable, et l'enfant est bloqué.
       On n'enferme donc pas la règle — on exige seulement qu'il en reste
       toujours de quoi la reprendre au doigt : au moins un quart de sa
       longueur, et jamais moins que PRISE_MIN_PX dans chaque direction. Le
       geste ne s'arrête qu'à cette limite-là, sans à-coup (on rogne la valeur,
       on ne la réinitialise jamais). */
    const PRISE_MIN_PX = 56;      // largeur de prise confortable au doigt
    const PART_VISIBLE_MIN = 0.25; // ...ou un quart de la dimension concernée

    function borner() {
      const parent = regle.offsetParent;
      if (!parent) return; // pas encore dans le document : rien à borner
      const dispoL = parent.clientWidth, dispoH = parent.clientHeight;
      if (!dispoL || !dispoH) return;
      const e = empreinte();
      const largeur = e.maxX - e.minX, hauteur = e.maxY - e.minY;
      // Part qui doit rester DANS la scène sur chaque axe : jamais plus que la
      // dimension elle-même (une règle plus fine que la prise minimale doit
      // rester entièrement visible en épaisseur, pas davantage).
      const visibleX = Math.min(largeur, Math.max(largeur * PART_VISIBLE_MIN, PRISE_MIN_PX));
      const visibleY = Math.min(hauteur, Math.max(hauteur * PART_VISIBLE_MIN, PRISE_MIN_PX));
      // Bord gauche de l'empreinte = x + e.minX ; bord haut = y + H/2 + e.minY.
      const bornerAxe = (bord, taille, dispo, visible) => {
        const min = visible - taille;      // débordement maximal par la gauche/le haut
        const max = dispo - visible;       // ...par la droite/le bas
        return Math.min(Math.max(bord, min), Math.max(min, max));
      };
      const decalageY = e.minY + e.H / 2;
      x = bornerAxe(x + e.minX, largeur, dispoL, visibleX) - e.minX;
      y = bornerAxe(y + decalageY, hauteur, dispoH, visibleY) - decalageY;
    }

    function appliquer() {
      borner();
      regle.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + angleAffiche + 'deg)';
    }

    // La règle que l'on saisit passe devant l'autre : sans cela, en mode
    // « 2 règles », celle du dessous resterait sous les doigts de l'enfant.
    let compteurPremierPlan = 0;
    regle.addEventListener('pointerdown', () => {
      compteurPremierPlan = (window.__mayeutikZRegle = (window.__mayeutikZRegle || 0) + 1);
      regle.style.zIndex = String(compteurPremierPlan);
    }, true);
    appliquer();
    // Une fois insérée dans la scène (donc mesurable), on borne une première
    // fois : la position de départ elle-même doit être valide.
    requestAnimationFrame(appliquer);

    /* Filet de sécurité : remet la règle à son point de départ. Utilisé par le
       bouton « Recentrer la règle », et rejoué à chaque redimensionnement /
       rotation de l'écran — sans quoi une règle valide en portrait pourrait se
       retrouver hors cadre en paysage. */
    function reinitialiser() {
      x = X0; y = Y0;
      angleLogique = angleAffiche = angleInitial || 0;
      regle.classList.remove('regle-mobile-accrochee');
      appliquer();
    }
    function surRedimensionnement() {
      if (!regle.isConnected) { window.removeEventListener('resize', surRedimensionnement); return; }
      appliquer(); // re-borne sur les nouvelles dimensions de la scène
    }
    window.addEventListener('resize', surRedimensionnement);

    if (angleInitial === undefined) {
      // Mode ROTATABLE (règle unique) : glisser à 1 doigt, pivoter à 2.
      const pointeurs = new Map();
      let dragDepart = null;
      let rotationDepart = null;
      regle.addEventListener('pointerdown', (e) => {
        if (etat.verrouille) return;
        pointeurs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { regle.setPointerCapture(e.pointerId); } catch (err) { /* pointeur déjà relâché : tant pis */ }
        if (pointeurs.size === 1) {
          dragDepart = { startX: e.clientX, startY: e.clientY, x0: x, y0: y };
          rotationDepart = null;
        } else if (pointeurs.size === 2) {
          dragDepart = null;
          const pts = Array.from(pointeurs.values());
          const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
          rotationDepart = { angleVecteur0: Math.atan2(dy, dx) * 180 / Math.PI, angleRegle0: angleLogique };
        }
      });
      regle.addEventListener('pointermove', (e) => {
        if (!pointeurs.has(e.pointerId)) return;
        pointeurs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        e.preventDefault();
        if (pointeurs.size === 1 && dragDepart) {
          x = dragDepart.x0 + (e.clientX - dragDepart.startX);
          y = dragDepart.y0 + (e.clientY - dragDepart.startY);
        } else if (pointeurs.size === 2 && rotationDepart) {
          const pts = Array.from(pointeurs.values());
          const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
          const angleVecteurActuel = Math.atan2(dy, dx) * 180 / Math.PI;
          angleLogique = rotationDepart.angleRegle0 + (angleVecteurActuel - rotationDepart.angleVecteur0);
          const accroche = accrocher(angleLogique);
          regle.classList.toggle('regle-mobile-accrochee', accroche !== null);
          angleAffiche = accroche !== null ? accroche : normaliser360(angleLogique);
          if (accroche !== null && accroche !== dernierAccroche) {
            dernierAccroche = accroche;
            if (onAngleAccroche) onAngleAccroche(accroche);
          }
        }
        appliquer();
      });
      function relever(e) {
        pointeurs.delete(e.pointerId);
        if (pointeurs.size < 2 && rotationDepart) {
          // Fin du geste de rotation : la règle reste où l'AFFICHAGE l'a
          // laissée (l'angle exact si l'aimant a accroché), et le prochain
          // geste repartira de là — pas de l'angle brut des doigts.
          rotationDepart = null;
          angleLogique = angleAffiche;
        }
        if (pointeurs.size === 1) {
          const restant = Array.from(pointeurs.values())[0];
          dragDepart = { startX: restant.x, startY: restant.y, x0: x, y0: y };
        } else if (pointeurs.size === 0) {
          dragDepart = null;
        }
      }
      regle.addEventListener('pointerup', relever);
      regle.addEventListener('pointercancel', relever);
    } else {
      // Mode FIXE en rotation (repli « deux règles ») : glisser seulement.
      let enGlissement = false;
      let departX = 0, departY = 0, x0 = 0, y0 = 0;
      regle.addEventListener('pointerdown', (e) => {
        if (etat.verrouille) return;
        enGlissement = true;
        departX = e.clientX; departY = e.clientY; x0 = x; y0 = y;
        try { regle.setPointerCapture(e.pointerId); } catch (err) { /* pointeur déjà relâché : tant pis */ }
      });
      regle.addEventListener('pointermove', (e) => {
        if (!enGlissement) return;
        e.preventDefault();
        x = x0 + (e.clientX - departX);
        y = y0 + (e.clientY - departY);
        appliquer();
      });
      function relever() { enGlissement = false; }
      regle.addEventListener('pointerup', relever);
      regle.addEventListener('pointercancel', relever);
    }

    return { el: regle, reinitialiser };
  }

  /*
   * Étape C — mesure SANS dépliage, côté par côté, avec une règle mobile
   * (rectangle uniquement : les côtés restent horizontaux/verticaux à
   * l'écran, ce qui rend le pivot à 90° réellement nécessaire pour passer
   * d'un côté horizontal à un côté vertical). L'enfant glisse la règle sur
   * le côté horizontal pour mesurer la longueur (L), doit la faire PIVOTER
   * à 90° (pincement à deux doigts, accroche magnétique) pour débloquer la
   * mesure de la largeur (l) — ou bascule sur le repli « deux règles
   * indépendantes » (perpendiculaires, sans geste de rotation) si le
   * pincement s'avère trop difficile. Une question « as-tu vraiment besoin
   * de mesurer les 4 côtés ? » précède la saisie du périmètre total, pour
   * amener l'enfant à réaliser qu'il suffit de L et l (jamais de formule
   * enseignée).
   */
  function genererPerimetreReglesMobiles(zone, cfg) {
    const cap = cfg.capCm || 16;
    const l = nombreAleatoire(3, 6);
    const L = nombreAleatoire(l + 2, Math.min(cap - 2, 13));
    const total = (L + l) * 2;

    zone.appendChild(creerBlocConsigne(
      'Mesure ce rectangle avec ta règle mobile, sans le déplier.',
      'Fais glisser la règle sur le côté horizontal pour mesurer la longueur. Pince avec deux doigts pour la faire pivoter à 90°, puis mesure le côté vertical. Si c\'est trop difficile à tourner, un bouton te donne deux règles déjà orientées.'
    ));

    const scene = document.createElement('div');
    scene.className = 'perimetre-scene';
    // La scène doit pouvoir contenir la règle DEBOUT (après pivot à 90°) :
    // sa hauteur utile vaut donc au moins la LONGUEUR de la règle, marge
    // comprise. Sans cela, la règle verticale déborderait forcément et
    // resterait à moitié rognée par l'`overflow:hidden` de la scène.
    const LONGUEUR_REGLE_PX = cap * 16 + 24;
    scene.style.minHeight = (LONGUEUR_REGLE_PX + 30) + 'px';
    const RECT_PX = 16;
    const rect = document.createElement('div');
    rect.className = 'perimetre-rectangle';
    rect.style.left = '30px'; rect.style.top = '84px';
    rect.style.width = (L * RECT_PX) + 'px'; rect.style.height = (l * RECT_PX) + 'px';
    scene.appendChild(rect);
    zone.appendChild(scene);

    const conteneurRegles = document.createElement('div');
    scene.appendChild(conteneurRegles);

    const boutonRepli = document.createElement('button');
    boutonRepli.type = 'button'; boutonRepli.className = 'bouton-secondaire';
    boutonRepli.textContent = 'Difficile à tourner ? Essaie 2 règles';

    // Filet de sécurité permanent : même si la règle se retrouvait dans un
    // état inattendu, un appui la ramène à son point de départ, à plat.
    const boutonRecentrer = document.createElement('button');
    boutonRecentrer.type = 'button'; boutonRecentrer.className = 'bouton-secondaire bouton-recentrer';
    boutonRecentrer.textContent = '⟲ Recentrer la règle';

    const zoneLongueur = document.createElement('div');
    const zoneLargeur = document.createElement('div');
    const zoneAstuce = document.createElement('div');

    let modeDouble = false;
    let reglesActives = [];
    let largeurDebloquee = false;
    let longueurRepondue = false;
    let questionLargeurAffichee = false;

    // Déblocage ÉVÉNEMENTIEL de la question « largeur » : il faut À LA FOIS
    // avoir répondu à la longueur ET avoir tourné la règle à la verticale
    // (ou basculé sur le repli 2 règles) — dans n'importe quel ordre.
    function majQuestionLargeur() {
      if (!longueurRepondue || !largeurDebloquee || questionLargeurAffichee) return;
      questionLargeurAffichee = true;
      zoneLargeur.innerHTML = '';
      construireQuestionCote(zoneLargeur, false, l, apresMesures);
    }
    function debloquerLargeur() {
      largeurDebloquee = true;
      majQuestionLargeur();
    }

    function rendreRegles() {
      conteneurRegles.innerHTML = '';
      reglesActives = [];
      if (!modeDouble) {
        const regle = creerRegleMobile(cap, undefined, (angleAccroche) => {
          if (angleAccroche === 90 || angleAccroche === 270) debloquerLargeur();
        });
        reglesActives.push(regle);
        conteneurRegles.appendChild(regle.el);
      } else {
        // Positions de départ DISJOINTES : posées au même endroit, la règle
        // verticale masquerait la moitié de l'horizontale et l'enfant ne
        // verrait qu'une seule règle.
        const rH = creerRegleMobile(cap, 0, null, { x: 12, y: 14 });
        const rV = creerRegleMobile(cap, 90, null, { x: 250, y: 96 });
        reglesActives.push(rH, rV);
        conteneurRegles.appendChild(rH.el);
        conteneurRegles.appendChild(rV.el);
        debloquerLargeur();
      }
    }
    rendreRegles();

    boutonRecentrer.addEventListener('click', () => {
      reglesActives.forEach((r) => r.reinitialiser());
    });

    boutonRepli.addEventListener('click', () => {
      modeDouble = true;
      boutonRepli.hidden = true;
      rendreRegles();
    });
    // En dehors de `scene` : les éléments POSITIONNÉS (la règle mobile,
    // absolute) peuplent une couche d'empilement au-dessus des éléments en
    // flux normal même sans z-index explicite, quel que soit l'ordre DOM —
    // un bouton en flux normal À L'INTÉRIEUR de `scene` se ferait donc
    // recouvrir (intercepter les clics) par la règle malgré son ordre DOM
    // plus tardif. En le sortant de `scene`, aucun risque de chevauchement.
    zone.appendChild(boutonRepli);
    zone.appendChild(boutonRecentrer);

    function construireQuestionCote(cont, estLongueur, cible, apres) {
      const legende = document.createElement('p');
      legende.className = 'legende';
      legende.textContent = estLongueur
        ? 'Place (ou glisse) la règle sur le côté horizontal : quelle est sa longueur (L) ?'
        : 'Place la règle verticale sur le côté vertical : quelle est sa largeur (l) ?';
      cont.appendChild(legende);
      const distracteurs = new Set([cible]);
      let tentatives = 0;
      while (distracteurs.size < 4 && tentatives < 30) {
        tentatives++;
        const d = cible + choisir([-2, -1, 1, 2]);
        if (d >= 1 && d <= cap) distracteurs.add(d);
      }
      const options = Array.from(distracteurs).map(String);
      const indexBonne = options.indexOf(String(cible));
      const { options: optionsMelangees, indexCorrect } = melangerOptions(options, indexBonne);
      const grille = document.createElement('div');
      grille.className = 'grille-options';
      optionsMelangees.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'bouton-option'; btn.textContent = opt + ' cm';
        btn.addEventListener('click', () => {
          Array.from(grille.children).forEach((b) => { b.disabled = true; });
          const correct = i === indexCorrect;
          btn.classList.add(correct ? 'correct' : 'incorrect');
          if (!correct) grille.children[indexCorrect].classList.add('correct');
          apres();
        });
        grille.appendChild(btn);
      });
      cont.appendChild(grille);
    }

    construireQuestionCote(zoneLongueur, true, L, () => {
      longueurRepondue = true;
      if (!largeurDebloquee) {
        const attente = document.createElement('p');
        attente.className = 'legende';
        attente.textContent = 'Fais pivoter la règle à 90° (pince à deux doigts) pour mesurer le côté vertical — ou touche le bouton « 2 règles » ci-dessus.';
        zoneLargeur.appendChild(attente);
      }
      majQuestionLargeur();
    });
    zone.appendChild(zoneLongueur);
    zone.appendChild(zoneLargeur);

    function apresMesures() {
      zone.appendChild(zoneAstuce);
      const legende = document.createElement('p');
      legende.className = 'legende';
      legende.textContent = 'As-tu vraiment besoin de mesurer les 4 côtés d\'un rectangle ?';
      zoneAstuce.appendChild(legende);
      const grille = document.createElement('div');
      grille.className = 'grille-options';
      ['Non, 2 suffisent', 'Oui, les 4'].forEach((texte, i) => {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'bouton-option'; btn.textContent = texte;
        btn.addEventListener('click', () => {
          Array.from(grille.children).forEach((b) => { b.disabled = true; });
          const correct = i === 0;
          btn.classList.add(correct ? 'correct' : 'incorrect');
          if (!correct) grille.children[0].classList.add('correct');
          const explication = document.createElement('p');
          explication.className = 'legende';
          explication.textContent = 'Dans un rectangle, les côtés opposés ont la même longueur : mesurer L et l suffit pour connaître les 4 côtés !';
          zoneAstuce.appendChild(explication);
          const legendeTotal = document.createElement('p');
          legendeTotal.className = 'legende';
          legendeTotal.textContent = 'Additionne les côtés : quel est le périmètre total de ce rectangle, en centimètres ?';
          zoneAstuce.appendChild(legendeTotal);
          // Saisie au pavé numérique diégétique, comme les conversions du
          // mini-jeu 2 (série CE2) — total à 2 chiffres au maximum.
          const pave = creerPave((valeur) => { pave.verrouiller(true); validerTour(valeur === total, null, { donnee: valeur + ' cm', attendue: total + ' cm' }); }, 2);
          zoneAstuce.appendChild(pave.el);
        });
        grille.appendChild(btn);
      });
      zoneAstuce.appendChild(grille);
    }
  }

  /* ================================================================
     Mini-jeu 4 : « L'arpentage » (périmètre par ADDITION des côtés, CE2)
     Prolongement du mini-jeu 3 : ici on ne mesure plus, on CALCULE. Les
     figures sont des polygones irréguliers rectilignes (tous les angles
     droits), ce qui garantit des côtés de longueur entière et un tracé
     parfaitement lisible.
       manches 1 à 3 → toutes les longueurs sont écrites sur la figure ;
         il n'y a plus qu'à les additionner. Difficulté croissante par le
         NOMBRE de côtés : 4, puis 6, puis 8.
       manches 4 et 5 → deux longueurs manquent (« ? ») sur une figure en L :
         chacune se déduit en additionnant les deux côtés opposés qui la
         composent, avant de pouvoir faire le total.
       manches 6 et 7 → problème de la clôture : le contour du terrain n'est
         PAS fermé (un côté est le portail d'entrée, avec son chemin vers la
         maison) et ne doit donc pas être compté dans la longueur de clôture.
     ================================================================ */

  const PX_ARPENTAGE = 22;

  /* Polygones irréguliers RECTILIGNES à 4, 6 ou 8 côtés, en cm entiers, tous
     les côtés valant au moins 2 cm pour rester lisibles une fois étiquetés. */
  function polygoneArpentage(nbCotes) {
    if (nbCotes === 4) {
      const L = nombreAleatoire(5, 9);
      const H = nombreAleatoire(3, 7);
      return [[0, 0], [L, 0], [L, H], [0, H]];
    }
    if (nbCotes === 6) {
      // Forme en L : rectangle L×H amputé d'un coin (w × h) en haut à droite.
      const L = nombreAleatoire(6, 10);
      const H = nombreAleatoire(5, 8);
      const w = nombreAleatoire(2, L - 2);
      const h = nombreAleatoire(2, H - 2);
      return [[0, 0], [L, 0], [L, h], [w, h], [w, H], [0, H]];
    }
    // 8 côtés : trois familles rectilignes classiques.
    const famille = choisir(['U', 'T', 'escalier']);
    if (famille === 'U') {
      const L = nombreAleatoire(8, 11);
      const H = nombreAleatoire(5, 8);
      const a = nombreAleatoire(2, Math.floor((L - 2) / 2));
      const c = nombreAleatoire(2, H - 2);
      return [[0, 0], [L, 0], [L, H], [L - a, H], [L - a, c], [a, c], [a, H], [0, H]];
    }
    if (famille === 'T') {
      const L = nombreAleatoire(8, 11);
      const H = nombreAleatoire(5, 8);
      const h = nombreAleatoire(2, H - 2);
      const m = nombreAleatoire(2, L - 4);
      const w = nombreAleatoire(2, L - m - 2);
      return [[0, 0], [L, 0], [L, h], [m + w, h], [m + w, H], [m, H], [m, h], [0, h]];
    }
    const L = nombreAleatoire(8, 11);
    const H = nombreAleatoire(6, 8);
    const a = nombreAleatoire(2, L - 4);
    const c = nombreAleatoire(a + 2, L - 2);
    const b = nombreAleatoire(2, H - 4);
    const d = nombreAleatoire(b + 2, H - 2);
    return [[0, 0], [a, 0], [a, b], [c, b], [c, d], [L, d], [L, H], [0, H]];
  }

  function cotesDuPolygone(pts) {
    return pts.map((p, i) => {
      const q = pts[(i + 1) % pts.length];
      return Math.round(Math.hypot(q[0] - p[0], q[1] - p[1]));
    });
  }

  /*
   * Dessine un polygone d'arpentage et écrit une étiquette au milieu de
   * chaque côté, POUSSÉE VERS L'EXTÉRIEUR : on oriente la normale de chaque
   * côté d'après le sens de parcours du polygone (aire signée), ce qui place
   * correctement les étiquettes y compris dans les creux d'une forme en L,
   * en U ou en T. `etiquettes[i]` vaut null pour ne rien écrire.
   * `options.coteOuvert` (facultatif) est l'indice du côté à NE PAS tracer :
   * c'est l'entrée du terrain, dessinée en portail ouvert avec son chemin.
   */
  function creerSceneArpentage(pts, etiquettes, options) {
    const opts = options || {};
    const SVGNS = 'http://www.w3.org/2000/svg';
    const PX = PX_ARPENTAGE;
    const MARGE = 30;
    const ecran = pts.map((p) => [p[0] * PX + MARGE, p[1] * PX + MARGE]);
    const largeur = Math.max.apply(null, ecran.map((p) => p[0])) + MARGE;
    const hauteur = Math.max.apply(null, ecran.map((p) => p[1])) + MARGE;

    const wrap = document.createElement('div');
    wrap.className = 'arpentage-scene';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('width', largeur);
    svg.setAttribute('height', hauteur);
    svg.setAttribute('viewBox', '0 0 ' + largeur + ' ' + hauteur);
    svg.setAttribute('aria-hidden', 'true');
    wrap.appendChild(svg);

    // Sens de parcours : l'aire signée donne le côté « extérieur ».
    let aire = 0;
    for (let i = 0; i < ecran.length; i++) {
      const p = ecran[i], q = ecran[(i + 1) % ecran.length];
      aire += p[0] * q[1] - q[0] * p[1];
    }
    const sens = aire > 0 ? 1 : -1;

    const fond = document.createElementNS(SVGNS, 'polygon');
    fond.setAttribute('points', ecran.map((p) => p[0] + ',' + p[1]).join(' '));
    fond.style.fill = 'color-mix(in srgb, var(--couleur-menthe) 18%, white)';
    svg.appendChild(fond);

    for (let i = 0; i < ecran.length; i++) {
      const p = ecran[i], q = ecran[(i + 1) % ecran.length];
      const estOuvert = opts.coteOuvert === i;
      if (!estOuvert) {
        const trait = document.createElementNS(SVGNS, 'line');
        trait.setAttribute('x1', p[0]); trait.setAttribute('y1', p[1]);
        trait.setAttribute('x2', q[0]); trait.setAttribute('y2', q[1]);
        trait.style.stroke = 'var(--couleur-mandarine)';
        trait.setAttribute('stroke-width', '5');
        trait.setAttribute('stroke-linecap', 'round');
        trait.setAttribute('class', 'arpentage-cote');
        svg.appendChild(trait);
      }
      if (etiquettes[i] == null) continue;
      const dx = q[0] - p[0], dy = q[1] - p[1];
      const norme = Math.hypot(dx, dy) || 1;
      // Normale extérieure : rotation de 90° du côté, dans le sens qui
      // s'éloigne de l'intérieur du polygone.
      const nx = (dy / norme) * sens, ny = (-dx / norme) * sens;
      const t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('x', (p[0] + dx / 2 + nx * 15).toFixed(1));
      t.setAttribute('y', (p[1] + dy / 2 + ny * 15).toFixed(1));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'middle');
      t.setAttribute('class', 'arpentage-etiquette' + (etiquettes[i] === '?' ? ' arpentage-etiquette-inconnue' : ''));
      t.textContent = etiquettes[i];
      svg.appendChild(t);
    }

    if (opts.coteOuvert != null) {
      const p = ecran[opts.coteOuvert], q = ecran[(opts.coteOuvert + 1) % ecran.length];
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const dx = q[0] - p[0], dy = q[1] - p[1];
      const norme = Math.hypot(dx, dy) || 1;
      const ux = dx / norme, uy = dy / norme;              // le long du côté
      const nx = (dy / norme) * sens, ny = (-dx / norme) * sens; // vers l'extérieur
      // Deux battants OUVERTS : ils pivotent vers l'extérieur depuis chaque
      // montant, laissant le passage libre entre eux.
      const battant = norme * 0.32;
      [[p, 1], [q, -1]].forEach(([base, signe]) => {
        const bx = base[0] + (ux * signe * battant * 0.15) + nx * battant * 0.95;
        const by = base[1] + (uy * signe * battant * 0.15) + ny * battant * 0.95;
        const b = document.createElementNS(SVGNS, 'line');
        b.setAttribute('x1', base[0]); b.setAttribute('y1', base[1]);
        b.setAttribute('x2', bx.toFixed(1)); b.setAttribute('y2', by.toFixed(1));
        b.style.stroke = 'var(--couleur-encre)';
        b.setAttribute('stroke-width', '4');
        b.setAttribute('stroke-linecap', 'round');
        b.setAttribute('class', 'arpentage-battant');
        svg.appendChild(b);
      });
      // Le chemin : du portail vers la maison, en pointillés.
      const centre = [ecran.reduce((s, e) => s + e[0], 0) / ecran.length,
        ecran.reduce((s, e) => s + e[1], 0) / ecran.length];
      const chemin = document.createElementNS(SVGNS, 'line');
      chemin.setAttribute('x1', mx.toFixed(1)); chemin.setAttribute('y1', my.toFixed(1));
      chemin.setAttribute('x2', centre[0].toFixed(1)); chemin.setAttribute('y2', centre[1].toFixed(1));
      chemin.style.stroke = 'color-mix(in srgb, var(--couleur-encre) 35%, white)';
      chemin.setAttribute('stroke-width', '4');
      chemin.setAttribute('stroke-dasharray', '7 5');
      chemin.setAttribute('class', 'arpentage-chemin');
      svg.appendChild(chemin);
      // La maison, au bout du chemin.
      const maison = document.createElementNS(SVGNS, 'g');
      maison.setAttribute('class', 'arpentage-maison');
      const cm = 26;
      const mxs = centre[0] - cm / 2, mys = centre[1] - cm / 2;
      const mur = document.createElementNS(SVGNS, 'rect');
      mur.setAttribute('x', mxs.toFixed(1)); mur.setAttribute('y', mys.toFixed(1));
      mur.setAttribute('width', cm); mur.setAttribute('height', cm);
      mur.style.fill = 'color-mix(in srgb, var(--couleur-soleil) 55%, white)';
      mur.style.stroke = 'var(--couleur-encre)';
      mur.setAttribute('stroke-width', '2');
      maison.appendChild(mur);
      const toit = document.createElementNS(SVGNS, 'polygon');
      toit.setAttribute('points', [
        (mxs - 4).toFixed(1) + ',' + mys.toFixed(1),
        (mxs + cm + 4).toFixed(1) + ',' + mys.toFixed(1),
        centre[0].toFixed(1) + ',' + (mys - 15).toFixed(1)
      ].join(' '));
      toit.style.fill = 'var(--couleur-corail)';
      toit.style.stroke = 'var(--couleur-encre)';
      toit.setAttribute('stroke-width', '2');
      maison.appendChild(toit);
      svg.appendChild(maison);
    }

    return wrap;
  }

  /* Saisie du périmètre au pavé numérique diégétique (même composant que le
     reste du palier CE2), avec un rappel du total attendu en cm. */
  function creerSaisiePerimetre(zone, reponse, texteQuestion) {
    const legende = document.createElement('p');
    legende.className = 'legende';
    legende.textContent = texteQuestion;
    zone.appendChild(legende);
    const pave = creerPave((valeur) => {
      pave.verrouiller(true);
      validerTour(valeur === reponse, null, { donnee: valeur + ' cm', attendue: reponse + ' cm' });
    }, 3);
    zone.appendChild(pave.el);
  }

  function genererArpentage(zone, cfg) {
    if (etat.index <= 3) genererArpentageAddition(zone, [4, 6, 8][etat.index - 1]);
    else if (etat.index <= 5) genererArpentageManquants(zone);
    else genererArpentageCloture(zone);
  }

  /* Manches 1 à 3 — toutes les longueurs sont données : additionner. */
  function genererArpentageAddition(zone, nbCotes) {
    const pts = polygoneArpentage(nbCotes);
    const cotes = cotesDuPolygone(pts);
    const total = cotes.reduce((a, b) => a + b, 0);

    zone.appendChild(creerBlocConsigne(
      'Fais le périmètre de la parcelle : additionne les ' + nbCotes + ' côtés.',
      'Cette parcelle a ' + nbCotes + ' côtés, et la longueur de chacun est écrite dessus. Additionne-les toutes : le résultat est le périmètre, en centimètres.'
    ));
    zone.appendChild(creerSceneArpentage(pts, cotes.map((c) => c + ' cm')));
    creerSaisiePerimetre(zone, total, 'Quel est le périmètre de cette parcelle, en centimètres ?');
  }

  /* Manches 4 et 5 — deux longueurs manquent sur une figure en L : les deux
     GRANDS côtés, chacun égal à la somme des deux côtés opposés qui lui font
     face. L'enfant doit les déduire avant de pouvoir faire le total. */
  function genererArpentageManquants(zone) {
    const pts = polygoneArpentage(6);
    const cotes = cotesDuPolygone(pts);
    const total = cotes.reduce((a, b) => a + b, 0);
    // Côtés de la forme en L : [L, h, L-w, H-h, w, H] — on masque L (indice 0)
    // et H (indice 5), qui se retrouvent en additionnant respectivement
    // (L-w)+w et h+(H-h).
    const masques = [0, 5];
    const etiquettes = cotes.map((c, i) => (masques.indexOf(i) === -1 ? c + ' cm' : '?'));

    zone.appendChild(creerBlocConsigne(
      'Deux longueurs manquent : déduis-les, puis calcule le périmètre.',
      'Sur cette parcelle, deux côtés ne sont pas mesurés : ils sont marqués d\'un point d\'interrogation. Retrouve chacun en additionnant les côtés qui lui font face, puis additionne les six côtés pour trouver le périmètre.'
    ));
    zone.appendChild(creerSceneArpentage(pts, etiquettes));
    const aide = document.createElement('p');
    aide.className = 'legende';
    aide.textContent = 'Astuce : un côté marqué « ? » est aussi long que les deux côtés qui lui font face, mis bout à bout.';
    zone.appendChild(aide);
    creerSaisiePerimetre(zone, total, 'Quel est le périmètre de cette parcelle, en centimètres ?');
  }

  /* Manches 6 et 7 — problème : la clôture entoure le terrain SAUF l'entrée.
     Toutes les longueurs sont données, y compris celle du portail : c'est à
     l'enfant de comprendre qu'il ne faut pas la compter. */
  function genererArpentageCloture(zone) {
    const pts = polygoneArpentage(choisir([4, 6]));
    const cotes = cotesDuPolygone(pts);
    const totalFerme = cotes.reduce((a, b) => a + b, 0);
    // Le portail est pris parmi les côtés les plus courts : une entrée large
    // comme un grand côté serait invraisemblable.
    const minCote = Math.min.apply(null, cotes);
    const candidats = cotes.map((c, i) => ({ c, i })).filter((x) => x.c <= minCote + 1);
    const portail = choisir(candidats).i;
    const reponse = totalFerme - cotes[portail];

    zone.appendChild(creerBlocConsigne(
      'Quelle est la longueur de la clôture qui entoure la maison ?',
      'La clôture fait tout le tour du terrain, sauf à l\'entrée : le portail est ouvert, et un chemin mène à la maison. Additionne les côtés clôturés — celui du portail ne compte pas.'
    ));
    zone.appendChild(creerSceneArpentage(pts, cotes.map((c) => c + ' cm'), { coteOuvert: portail }));
    const aide = document.createElement('p');
    aide.className = 'legende';
    aide.textContent = 'Le côté du portail (' + cotes[portail] + ' cm) n\'est pas clôturé : ne le compte pas.';
    zone.appendChild(aide);
    creerSaisiePerimetre(zone, reponse, 'Quelle longueur de clôture faut-il, en centimètres ?');
  }

  /* ---------- Initialisation ---------- */

  document.getElementById('bouton-retour').addEventListener('click', retourAccueil);
  document.getElementById('bouton-suivant').addEventListener('click', tourSuivant);

  construireAccueil();
})();
</script>
<script>
  /* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7).
     Script isolé du moteur de jeu : il n'agit que sur les éléments statiques
     de la page (le « ← Menu » ne s'affiche que sur l'écran d'accueil). */
  (function () {
    var bouton = document.getElementById('bouton-menu');
    var modale = document.getElementById('modale-menu');
    if (!bouton || !modale) return;
    function fermer() { modale.hidden = true; }
    bouton.addEventListener('click', function () { modale.hidden = false; });
    document.getElementById('modale-menu-rester').addEventListener('click', fermer);
    document.getElementById('modale-menu-revenir').addEventListener('click', function () {
      window.location.href = '../index.html';
    });
    modale.addEventListener('click', function (e) { if (e.target === modale) fermer(); });
  })();
</script>
