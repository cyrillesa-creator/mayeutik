<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>Longueurs – Mayeutik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --couleur-fond: #FFF8EF;
    --couleur-encre: #2B2B2B;
    --couleur-mandarine: #FF8C42;
    --couleur-menthe: #4ECDC4;
    --couleur-corail: #FF6B6B;
    --couleur-soleil: #FFD93D;
    color-scheme: light only;
  }
  @media (prefers-color-scheme: dark) {
    html { background-color: var(--couleur-fond); }
    body { background-color: var(--couleur-fond); color: var(--couleur-encre); }
    input, select, textarea, button { background-color: #FFFFFF; color: var(--couleur-encre); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--couleur-fond); color:var(--couleur-encre); overflow-x:hidden; }
  body { font-family:'Fredoka', system-ui, sans-serif; min-height:100vh; padding-bottom:2rem; }
  button { font-family:inherit; cursor:pointer; }
  h1,h2,h3{ font-weight:700; margin:0 0 .4rem; }

  #ecran-accueil { max-width:640px; margin:0 auto; padding:1.2rem 1rem 2rem; }
  .entete-accueil { text-align:center; margin-bottom:.8rem; }
  .entete-accueil h1 { font-size:1.5rem; color:var(--couleur-mandarine); }
  .entete-accueil p { margin:0; font-size:1rem; font-weight:500; opacity:.85; }

  /* Sélecteur de palier (CHARTE §15 : niveau du profil actif par défaut, changement possible) */
  .rangee-paliers{ display:flex; justify-content:center; gap:.5rem; margin:.9rem 0 1rem; flex-wrap:wrap; }
  .puce-palier{
    min-height:40px; padding:.35rem 1rem; border-radius:999px; font-weight:700; font-size:.92rem;
    border:2.5px solid color-mix(in srgb, var(--couleur-encre) 22%, white); background:#ffffff; color:var(--couleur-encre);
  }
  .puce-palier.actif{ background:var(--couleur-mandarine); border-color:var(--couleur-mandarine); color:#ffffff; }
  .note-palier{ text-align:center; font-size:.82rem; opacity:.7; margin:-.3rem 0 .8rem; }

  .grille-jeux { display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem; }
  @media (max-width:360px){ .grille-jeux{ grid-template-columns:1fr; } }
  .carte-jeu {
    --c: var(--couleur-mandarine);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center; gap:.3rem;
    background: color-mix(in srgb, var(--c) 16%, white);
    border:3px solid var(--c); border-radius:20px; padding:.8rem .6rem;
    max-height:34vh; min-height:9.5rem;
    box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, black 6%);
  }
  .carte-jeu:active { transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, black 6%); }
  .carte-jeu.carte-menthe{ --c:var(--couleur-menthe); }
  .carte-jeu.carte-corail{ --c:var(--couleur-corail); }
  .carte-jeu.carte-soleil{ --c:var(--couleur-soleil); }
  .carte-jeu .icone{ font-size:1.9rem; line-height:1; }
  .carte-jeu h2{ font-size:1rem; }
  .carte-jeu p{ font-size:.76rem; font-weight:400; margin:0; opacity:.85; }
  .etoiles{ display:inline-flex; gap:2px; font-size:1.1rem; letter-spacing:-1px; }
  .etoile{ color:rgba(43,43,43,.2); }
  .etoile.pleine{ color:var(--couleur-soleil); text-shadow:0 0 1px rgba(43,43,43,.35); }

  /* Palier bonus : présenté comme une récompense, distinct visuellement (CHARTE §15) */
  .bloc-bonus{
    margin-top:1.3rem; border-radius:20px; padding:.9rem .8rem;
    border:3px dashed var(--couleur-soleil); background:color-mix(in srgb, var(--couleur-soleil) 14%, white);
  }
  .bloc-bonus h3{ text-align:center; font-size:1rem; color:color-mix(in srgb, var(--couleur-soleil) 55%, black 25%); margin-bottom:.15rem; }
  .bloc-bonus .note-palier{ margin:.1rem 0 .7rem; }

  /* Paquet cadeau : première révélation d'un palier bonus (CHARTE §15,
     pattern générique "paquet cadeau" — cf. section « Palier bonus »).
     Recouvre grille-bonus tant que l'enfant n'a pas cliqué dessus. */
  .paquet-cadeau{
    display:flex; flex-direction:column; align-items:center; gap:.7rem;
    width:100%; border:none; background:transparent; padding:1rem .5rem; cursor:pointer; min-height:44px;
  }
  .paquet-cadeau-boite{
    position:relative; width:5.6rem; height:4.6rem; border-radius:14px;
    background:linear-gradient(180deg, var(--couleur-corail), color-mix(in srgb, var(--couleur-corail) 70%, black 15%));
    border:3px solid color-mix(in srgb, var(--couleur-corail) 55%, black 20%);
    box-shadow:0 5px 0 color-mix(in srgb, var(--couleur-corail) 50%, black 25%);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .paquet-cadeau:active .paquet-cadeau-boite{
    transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--couleur-corail) 50%, black 25%);
  }
  .paquet-cadeau-ruban-v{ position:absolute; left:50%; top:0; bottom:0; width:14px; margin-left:-7px; background:var(--couleur-soleil); }
  .paquet-cadeau-ruban-h{ position:absolute; top:50%; left:0; right:0; height:14px; margin-top:-7px; background:var(--couleur-soleil); }
  .paquet-cadeau-noeud{ position:absolute; left:50%; top:-1rem; transform:translateX(-50%); font-size:1.9rem; line-height:1; }
  .paquet-cadeau-texte{ font-weight:700; font-size:.88rem; text-align:center; color:color-mix(in srgb, var(--couleur-encre) 85%, white); }
  @keyframes paquet-cadeau-pop{
    0%{ transform:scale(1) rotate(0deg); opacity:1; }
    35%{ transform:scale(1.18) rotate(-5deg); opacity:1; }
    100%{ transform:scale(.25) rotate(10deg); opacity:0; }
  }
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{ animation:paquet-cadeau-pop .45s ease forwards; }
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-texte{ opacity:0; transition:opacity .2s ease; }
  @media (prefers-reduced-motion:reduce){
    .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{ animation:none; opacity:0; transition:opacity .3s ease; }
  }

  /* Pavé numérique diégétique (palier CE1, saisie de conversions) — même
     pattern que jeux/M99-boss-des-tables.html et jeux/M01-nombres-jusqu-9-cp.html. */
  .pave-numerique{ max-width:250px; margin:.9rem auto 0; }
  .pave-ecran{
    background:color-mix(in srgb, var(--couleur-encre) 88%, black 8%);
    color:color-mix(in srgb, var(--couleur-menthe) 70%, white 20%);
    border-radius:12px; font-size:1.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:flex-end;
    height:2.9rem; padding:0 .9rem; letter-spacing:2px;
    font-variant-numeric:tabular-nums; box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
  }
  .pave-grille{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px; }
  .touche-pave{
    min-height:48px; border:none; border-radius:12px; font-size:1.25rem; font-weight:700;
    background:color-mix(in srgb, var(--couleur-soleil) 22%, white); color:var(--couleur-encre);
    box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-encre) 20%, white); touch-action:manipulation;
  }
  .touche-pave:active{ transform:translateY(2px); box-shadow:0 1px 0 color-mix(in srgb, var(--couleur-encre) 20%, white); }
  .touche-pave:disabled{ opacity:.6; }
  .touche-valider{ background:var(--couleur-menthe); color:#ffffff; box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-menthe) 60%, black 10%); }
  .touche-effacer{ background:var(--couleur-corail); color:#ffffff; box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-corail) 60%, black 10%); }

  /* Correction affichée après une MAUVAISE réponse (CHARTE §18) : la réponse
     donnée en rouge, la bonne en vert. Mêmes teintes que .feedback-succes /
     .feedback-erreur, assombries pour rester lisibles sur blanc. */
  .bloc-correction{ text-align:center; font-weight:700; font-size:.98rem; margin:.7rem 0 .2rem; }
  .correction-donnee{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .correction-attendue{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }

  #ecran-jeu{ max-width:640px; margin:0 auto; padding:.8rem 1rem 2.5rem; }
  .entete-jeu{ display:flex; align-items:center; gap:.6rem; margin-bottom:.8rem; }
  .bouton-retour{
    flex:0 0 auto; min-height:44px; min-width:44px; border-radius:14px; border:none;
    background:var(--couleur-encre); color:var(--couleur-fond); font-size:1.2rem; font-weight:600; padding:0 .9rem;
    touch-action:manipulation;
  }
  .entete-jeu-titres{ flex:1; min-width:0; }
  .entete-jeu-titres h2{ font-size:1.1rem; color:var(--couleur-mandarine); }
  .entete-jeu-titres .progression{ font-size:.85rem; font-weight:500; opacity:.75; }
  #zone-jeu{
    background:#ffffff; border-radius:20px;
    border:3px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
    padding:1.1rem .9rem; min-height:40vh;
  }
  .consigne{ text-align:center; font-size:1.05rem; font-weight:600; margin:0; }
  .legende{ text-align:center; font-size:.85rem; font-weight:400; opacity:.85; margin-top:.7rem; }

  .bloc-consigne{ display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .bouton-son{
    min-width:44px; min-height:44px; border-radius:50%;
    border:2.5px solid var(--couleur-mandarine); background:#ffffff;
    font-size:1.3rem; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    touch-action:manipulation;
  }
  .bouton-son:active{ transform:translateY(2px); }

  .bouton-principal{
    display:block; margin:.8rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; padding:0 1.3rem; font-size:1rem;
    touch-action:manipulation;
  }
  .bouton-principal:disabled{ opacity:.45; }
  .bouton-secondaire{
    display:block; margin:0 auto; min-height:44px; border-radius:14px; border:2.5px solid var(--couleur-encre);
    background:#ffffff; padding:0 1.1rem; font-weight:500; touch-action:manipulation;
  }
  /* Filet de sécurité de la règle mobile : discret (il ne doit pas concurrencer
     les boutons de réponse), mais toujours là. */
  .bouton-recentrer{ margin-top:.5rem; font-size:.86rem; min-height:40px; padding:0 .9rem;
    border-width:2px; border-color:color-mix(in srgb, var(--couleur-encre) 35%, white);
    color:color-mix(in srgb, var(--couleur-encre) 75%, white); }

  /* Retour à la coquille (CHARTE §7) : bouton discret + confirmation */
  .barre-accueil{ display:flex; margin-bottom:.6rem; }
  .bouton-menu{
    min-height:44px; border-radius:14px; padding:0 .9rem;
    border:2px solid color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:#ffffff; color:var(--couleur-encre); font-weight:600; font-size:.95rem;
    display:inline-flex; align-items:center; gap:.35rem; touch-action:manipulation;
  }
  .bouton-menu:active{ transform:translateY(2px); }
  .modale-fond{
    position:fixed; inset:0; z-index:1000; padding:1.2rem;
    background:color-mix(in srgb, var(--couleur-encre) 55%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .modale-boite{
    background:#ffffff; border-radius:20px; padding:1.4rem 1.2rem; max-width:20rem; width:100%;
    text-align:center; box-shadow:0 12px 34px rgba(43,43,43,.28);
  }
  .modale-boite p{ font-size:1.05rem; font-weight:600; margin:0 0 1.1rem; }
  .modale-boutons{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .modale-boutons .bouton-principal, .modale-boutons .bouton-secondaire{ margin:0; }

  .feedback{ text-align:center; font-weight:700; font-size:1.05rem; min-height:1.6rem; margin:.8rem 0 .2rem; }
  .feedback-succes{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }
  .feedback-erreur{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .bouton-suivant{
    display:block; margin:.6rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; font-size:1rem; padding:0 1.4rem;
    touch-action:manipulation;
  }

  .bloc-resultats{ text-align:center; }
  .bloc-resultats .etoiles{ font-size:2.6rem; margin:.6rem 0; }
  .bloc-resultats .score-texte{ font-size:1.1rem; font-weight:500; margin-bottom:1rem; }
  .boutons-resultats{ display:flex; justify-content:center; gap:.7rem; flex-wrap:wrap; margin-top:.6rem; }

  /* ---- Lecture (QCM) ---- */
  .grille-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-top:.7rem; }
  @media (max-width:340px){ .grille-options{ grid-template-columns:1fr; } }
  .bouton-option{
    min-height:3.2rem; border-radius:16px; border:2.5px solid var(--couleur-encre); background:#ffffff;
    display:flex; align-items:center; justify-content:center; padding:.5rem; font-size:.95rem; font-weight:600; text-align:center;
    touch-action:manipulation;
  }
  .bouton-option:disabled{ opacity:.6; }
  .bouton-option.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .bouton-option.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }
  .bouton-option-bonus{ min-height:2.7rem; font-size:.85rem; }

  .bonus-estimation{ margin-top:1rem; padding-top:.8rem; border-top:2px dashed color-mix(in srgb, var(--couleur-soleil) 55%, white); }
  .grille-options-bonus{ margin-top:.5rem; }

  /* ---- Règle graduée virtuelle (composant réutilisé par plusieurs mini-jeux) ---- */
  .regle-scroll{ overflow-x:auto; margin:.9rem 0; padding-bottom:.3rem; }
  .regle-graduee{
    position:relative; height:64px; overflow:hidden;
    background:linear-gradient(180deg, color-mix(in srgb, var(--couleur-mandarine) 16%, white), color-mix(in srgb, var(--couleur-encre) 6%, white));
    border:2.5px solid color-mix(in srgb, var(--couleur-encre) 25%, white); border-radius:10px;
  }
  .regle-tick{ position:absolute; bottom:0; width:2px; height:12px; background:var(--couleur-encre); opacity:.55; }
  .regle-tick-forte{ height:20px; width:2.5px; opacity:.9; }
  .regle-label{ position:absolute; bottom:22px; transform:translateX(-50%); font-size:.66rem; font-weight:700; opacity:.8; }
  .regle-unite{ position:absolute; bottom:22px; font-size:.7rem; font-weight:700; opacity:.7; }
  .regle-barre{
    position:absolute; top:8px; left:0; height:13px; border-radius:4px;
    background:var(--couleur-corail); border:2px solid color-mix(in srgb, var(--couleur-corail) 60%, black 10%);
  }
  .regle-zone{ position:absolute; top:0; height:100%; background:transparent; border:none; padding:0; }
  .regle-zone.selectionnee{ background:color-mix(in srgb, var(--couleur-soleil) 45%, transparent); border-radius:4px; }

  /* Variante « grande » : fenêtre de graduations agrandie et recentrée,
     réservée à l'exercice d'encadrement (genererEncadrer) — chaque zone
     cliquable entre deux graduations doit être une cible tactile d'au
     moins 44px (CHARTE), ce qu'une règle de 20 cm affichée en entier ne
     permet pas. Ticks, étiquettes et zones plus grands en conséquence. */
  .regle-graduee-grande{ height:92px; border-radius:14px; border-width:3px; }
  .regle-graduee-grande .regle-tick{ height:16px; width:3px; }
  .regle-graduee-grande .regle-tick-forte{ height:26px; width:3.5px; }
  .regle-graduee-grande .regle-label{ bottom:30px; font-size:1.05rem; }
  .regle-graduee-grande .regle-unite{ bottom:30px; font-size:1rem; }
  .regle-graduee-grande .regle-barre{ top:12px; height:18px; }
  .regle-graduee-grande .regle-zone.selectionnee{ border-radius:8px; }

  /* ---- Comparaison directe (corde/chemin alignés) ---- */
  .comparaison-objets{ display:flex; flex-direction:column; gap:.9rem; margin:.9rem 0; overflow-x:auto; }
  .rangee-brindille{ display:flex; }
  .brindille-btn{ border:none; background:transparent; padding:.3rem; display:flex; align-items:center; min-height:44px; }

  /* Corde : texture torsadée simple (rayures obliques en pilule). */
  .balade-corde{ display:block; height:18px; border-radius:999px;
    background-image:repeating-linear-gradient(135deg, #E8B24D 0 7px, #C9971C 7px 14px);
    border:2px solid #8A6A17; }

  /* Chemin : texture de terrain (semis de graviers sur fond brun/ocre). */
  .balade-chemin{ display:block; height:16px; border-radius:8px;
    background-image:radial-gradient(circle, rgba(0,0,0,.28) 1.4px, transparent 1.6px), linear-gradient(180deg, #A9764B, #7C5734);
    background-size:9px 9px, 100% 100%;
    border:2px solid #5B3F28; }

  /* ---- Report indirect (arbres figuratifs : tronc + feuillage) ----
     Jusqu'à 4 arbres côte à côte : sur un écran étroit (iPhone SE...), 4 ×
     min-width + les gaps peuvent dépasser la largeur du cadre. `gap` réduit
     via clamp() pour que le cas courant (jusqu'à 4 arbres) tienne SANS
     défiler sur les petits écrans, et `overflow-x:auto` en filet de
     sécurité : si un cas extrême ne tient toujours pas, le contenu défile
     À L'INTÉRIEUR du cadre blanc plutôt que de déborder par-dessus. */
  .comparaison-report{ display:flex; justify-content:center; align-items:flex-end;
    gap:clamp(.5rem, 3vw, 1.8rem); margin:1rem 0; min-height:9.5rem;
    overflow-x:auto; padding:0 .1rem; }
  .arbre-col.correct, .brindille-btn.correct, .clairiere-btn.correct{ outline:3px solid var(--couleur-menthe); outline-offset:2px; border-radius:12px; background:color-mix(in srgb, var(--couleur-menthe) 25%, transparent); }
  .arbre-col.incorrect, .brindille-btn.incorrect, .clairiere-btn.incorrect{ outline:3px solid var(--couleur-corail); outline-offset:2px; border-radius:12px; background:color-mix(in srgb, var(--couleur-corail) 22%, transparent); }
  .arbre-col{ border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:.15rem;
    min-width:52px; flex:0 0 auto; min-height:44px; }
  .balade-arbre{ display:flex; flex-direction:column; align-items:center; }
  .arbre-feuillage{ display:block; border-radius:60% 60% 50% 50% / 70% 70% 40% 40%;
    background:radial-gradient(circle at 35% 30%, #8BD17E, #2E7D32); border:2px solid #1B5E20; margin-bottom:-4px; }
  .arbre-tronc{ display:block; width:14px; border-radius:4px;
    background:linear-gradient(180deg, #B98657, #6D4C33); border:2px solid #5B3F28; }

  /* ---- Distances sur le sentier, depuis le repère « lac » ----
     Les repères (.clairiere-btn) sont positionnés en % de la piste, plafonnés
     via calc()/min() dans le JS pour ne jamais s'approcher du bord droit ;
     overflow-x:auto reste un filet de sécurité supplémentaire. */
  .sentier{ position:relative; margin:1.1rem .5rem 1.8rem; height:3rem; overflow-x:auto; }
  .sentier-depart{ position:absolute; left:0; top:-.1rem; display:flex; flex-direction:column; align-items:center; }
  .sentier-depart-nom{ font-size:.65rem; font-weight:700; opacity:.75; }
  .sentier-piste{ position:relative; margin-left:2.4rem; height:100%; border-bottom:3px dashed color-mix(in srgb, var(--couleur-encre) 25%, white); }
  .clairiere-btn{ position:absolute; bottom:-.15rem; min-width:44px; min-height:44px; border:none; background:transparent;
    font-size:1.6rem; display:flex; align-items:center; justify-content:center; }

  /* Lac : simple forme figurative (ovale bleu), repère fixe des comparaisons
     de distance du niveau 2. */
  .mini-lac{ display:block; width:2.2rem; height:1.5rem; border-radius:50%;
    background:radial-gradient(ellipse at 38% 32%, #8FD3F4, #1E88E5); border:2px solid #0B5D8A; }

  /* Clairière : vue semi-aérienne — herbe claire cernée d'un anneau de 6
     arbres, disposés en cercle par rotation régulière à 60° (--i = 0..5). */
  .mini-clairiere{ position:relative; display:block; width:2.3rem; height:2.3rem; }
  .mini-clairiere-herbe{ position:absolute; inset:26%; border-radius:50%;
    background:radial-gradient(circle, #EFE6B8, #D9CE86); border:2px solid #B8AC5E; }
  .mini-clairiere-arbre{ position:absolute; width:.5rem; height:.5rem; border-radius:50%;
    background:#2E7D32; border:2px solid #1B5E20; top:50%; left:50%; margin:-.28rem 0 0 -.28rem;
    transform:rotate(calc(var(--i) * 60deg)) translate(1rem) rotate(calc(var(--i) * -60deg)); }

  /* ---- Palier CP : « Le Bois » — lisière (vocabulaire, texte à trou) ----
     Objets concrets colorés (pas de lettre abstraite ni de pastille rapportée
     à côté d'un dessin identique) : pour la corde/le chemin/la branche, la
     couleur est directement celle de la barre. Pour le champignon et la
     cabane, la couleur est intégrée AU DESSIN lui-même (chapeau, toit) via
     creerLisiereChampignon/creerLisiereCabane — cf. plus bas dans le JS. */
  /* Comparaison longueur (corde/chemin/branche) : les deux objets sont dans
     des RANGÉES séparées (empilées), jamais côte à côte — aucun risque de
     chevauchement entre eux. overflow-x:auto reste un filet de sécurité si
     une barre très longue dépassait un écran très étroit. */
  .lisiere-comparaison{ display:flex; flex-direction:column; gap:1rem; margin:.9rem 0; overflow-x:auto; }
  .lisiere-rangee{ display:flex; align-items:center; gap:.6rem; min-height:44px; }
  .lisiere-pastille{ width:1.3rem; height:1.3rem; border-radius:50%; border:2px solid rgba(0,0,0,.35); flex-shrink:0; }
  .lisiere-icone{ font-size:1.7rem; }
  .lisiere-barre{ height:20px; border-radius:10px; border:2px solid rgba(0,0,0,.3); }
  .lisiere-nom{ font-weight:700; font-size:.9rem; }

  /* Comparaison distance (cabane/champignon) : repère + deux objets en FLUX
     FLEXBOX normal (plus de positionnement absolu en %), avec un `gap`
     garanti entre chaque paire d'éléments — deux objets flexbox ne peuvent
     structurellement jamais se chevaucher, quelle que soit leur taille
     effective (icônes agrandies comprises), contrairement à un calcul de
     position qui pourrait se tromper selon la largeur réelle de l'écran.
     Marge basse généreuse pour laisser la place aux dessins sans chevaucher
     le QCM en dessous ; overflow-x:auto en filet de sécurité supplémentaire. */
  .lisiere-sentier{ margin:1.1rem .5rem 4.4rem; }
  .lisiere-piste{ display:flex; align-items:flex-end; gap:1.5rem;
    border-bottom:3px dashed color-mix(in srgb, var(--couleur-encre) 25%, white);
    padding-bottom:.35rem; overflow-x:auto; overflow-y:visible; }
  .lisiere-repere{ display:flex; flex-direction:column; align-items:center; gap:.15rem; flex-shrink:0; }
  .lisiere-repere-nom{ font-size:.7rem; font-weight:700; opacity:.75; }
  .lisiere-point{ display:flex; flex-direction:column; align-items:center; gap:.15rem; flex-shrink:0; min-width:48px; }

  /* Clairière (repère fixe des questions de distance) : vue semi-aérienne —
     herbe claire cernée d'un anneau de 6 arbres stylisés, plutôt qu'un
     soleil/nuage qui n'évoque pas une clairière. Anneau construit en CSS pur
     par rotation régulière à 60° (--i = 0..5). */
  .lisiere-mini-clairiere{ position:relative; display:block; width:2.9rem; height:2.9rem; }
  .lisiere-mini-clairiere-herbe{ position:absolute; inset:24%; border-radius:50%;
    background:radial-gradient(circle, #EFE6B8, #D9CE86); border:2px solid #B8AC5E; }
  .lisiere-mini-clairiere-arbre{ position:absolute; width:.65rem; height:.65rem; border-radius:50%;
    background:#2E7D32; border:2px solid #1B5E20; top:50%; left:50%; margin:-.35rem 0 0 -.35rem;
    transform:rotate(calc(var(--i) * 60deg)) translate(1.25rem) rotate(calc(var(--i) * -60deg)); }

  /* Champignon : la couleur du chapeau varie directement dans le dessin
     (plus de pastille séparée). La variante rouge ajoute des pois blancs
     façon amanite, pour une distinction visuelle au-delà de la seule
     couleur (cf. FAMILLES_LISIERE, familles « champignon »). */
  .lisiere-champi{ display:flex; flex-direction:column; align-items:center; }
  .lisiere-champi-chapeau{ width:2.3rem; height:1.3rem; border-radius:50% 50% 8% 8% / 100% 100% 15% 15%;
    border:2px solid rgba(0,0,0,.35); margin-bottom:-3px; background-size:100% 100%; }
  .lisiere-champi-chapeau.pois{
    background-image:
      radial-gradient(circle at 26% 35%, #fff 0 3px, transparent 3.2px),
      radial-gradient(circle at 58% 22%, #fff 0 2.6px, transparent 2.8px),
      radial-gradient(circle at 76% 48%, #fff 0 2.2px, transparent 2.4px),
      radial-gradient(circle at 42% 55%, #fff 0 2px, transparent 2.2px); }
  .lisiere-champi-pied{ width:.9rem; height:1.05rem; border-radius:0 0 45% 45% / 0 0 65% 65%;
    background:#F3E9D2; border:2px solid #C9B98B; }

  /* Cabane : la couleur du toit varie directement dans le dessin (triangle
     CSS), plus de pastille séparée. */
  .lisiere-cabane{ display:flex; flex-direction:column; align-items:center; }
  .lisiere-cabane-toit{ width:0; height:0; border-left:1.3rem solid transparent; border-right:1.3rem solid transparent;
    border-bottom-width:1.1rem; border-bottom-style:solid; filter:drop-shadow(0 -2px 0 rgba(0,0,0,.25)); }
  .lisiere-cabane-mur{ position:relative; width:2.2rem; height:1.5rem; background:#D9B382;
    border:2px solid #8B5E3C; border-top:none; border-radius:0 0 4px 4px; }
  .lisiere-cabane-porte{ position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:.6rem; height:.95rem; background:#6D4C33; border-radius:2px 2px 0 0; }

  /* ---- Palier CP : « Le Bois » — balade (ranger 5 bâtons en pyramide) ----
     5 « étagères » EMPILÉES verticalement, chaque bâton posé À PLAT et
     ANCRÉ À GAUCHE sur la même ligne (seule l'extrémité droite varie avec
     la longueur) : les longueurs se comparent d'un coup d'œil, sans geste
     préalable. Glisser un bâton vers une autre rangée ÉCHANGE leur place —
     le DOM des 5 rangées ne bouge jamais pendant le geste, seule la valeur
     affichée (largeur de la barre) est échangée — cf. commentaire dans
     genererOrdonnerBatons (js) : sous Chromium, reparenter l'élément capturé
     PENDANT le glisser fait perdre la capture du pointeur et casse le
     pointerup final. Une fois trié, les bouts droits dessinent une diagonale
     nette (effet pyramide). */
  .bande-batons{ display:flex; flex-direction:column; gap:.55rem; margin:1rem 0; }
  .baton-case{ position:relative; display:flex; align-items:center; padding:.3rem .4rem; border-radius:12px; }
  .baton-case.case-selectionnee{ background:color-mix(in srgb, var(--couleur-soleil) 40%, transparent); }
  .baton-case.correct{ background:color-mix(in srgb, var(--couleur-menthe) 30%, transparent); }
  .baton-case.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 26%, transparent); }
  .baton-btn{ position:relative; border:none; background:transparent; padding:.2rem; min-height:44px;
    display:flex; align-items:center; touch-action:none; cursor:grab; }
  .baton-btn.baton-glisse{ z-index:5; cursor:grabbing; }
  .baton-barre{ display:block; height:20px; border-radius:999px;
    background-image:radial-gradient(circle, rgba(0,0,0,.2) 1.5px, transparent 1.6px), linear-gradient(180deg, #D3A67B, #8B5E3C);
    background-size:12px 12px, 100% 100%;
    border:2px solid #6D4C33; }

  /* Transition d'ÉCHANGE : un « fantôme » CLONÉ de chaque barre impliquée
     (donc de largeur IDENTIQUE, figée — jamais de transition sur width/
     height/scale) glisse en pure TRANSLATION verticale de sa rangée de
     départ vers sa rangée d'arrivée, pendant que les vraies barres —
     déjà mises à jour à leur valeur finale — restent invisibles le temps du
     geste (cf. echanger()/animerEchangeBatons() dans le JS). Les deux
     bâtons se croisent ainsi visiblement, quelle que soit la proximité de
     leurs longueurs. position:fixed + coordonnées écran (getBoundingClientRect)
     : le fantôme n'a pas besoin d'un ancêtre positionné particulier. */
  .baton-fantome{ position:fixed; margin:0; pointer-events:none; z-index:80; transition:transform .25s ease; will-change:transform; }
  @media (prefers-reduced-motion:reduce){ .baton-fantome{ transition:none; } }

  /* ---- Palier CP : « Le Bois » — cabane (règle à déplacer) ---- */
  .piste-alignement{ position:relative; margin:.9rem 0; overflow-x:hidden; border-radius:10px; min-height:90px;
    background:color-mix(in srgb, var(--couleur-mandarine) 8%, white); border:2px solid color-mix(in srgb, var(--couleur-encre) 12%, white); }
  .planche-fixe{ position:absolute; top:38px; height:16px; border-radius:4px; background:#B08968; border:2px solid color-mix(in srgb, #B08968 60%, black 15%); }
  /* Règle DÉPLAÇABLE : semi-transparente pour que la planche à mesurer reste
     visible PAR-TRANSPARENCE une fois la règle glissée dessus (sinon elle la
     cache entièrement, cf. bug ergonomie). Les graduations/chiffres reçoivent
     une opacité propre plus élevée (et un léger halo pour les chiffres) afin
     de rester lisibles malgré l'opacité globale réduite de la règle. */
  .regle-graduee.regle-glissable{ position:absolute; top:8px; touch-action:none; cursor:grab; opacity:.68; }
  .regle-graduee.regle-glissable .regle-tick{ opacity:.95; }
  .regle-graduee.regle-glissable .regle-tick-forte{ opacity:1; }
  .regle-graduee.regle-glissable .regle-label,
  .regle-graduee.regle-glissable .regle-unite{ opacity:1; text-shadow:0 0 3px #fff, 0 0 3px #fff; }

  /* Règle FIXE mais semi-transparente (palier CE2, mini-jeu « L'exploration ») :
     même traitement d'opacité que la règle déplaçable ci-dessus, sans le
     positionnement/glissement (cette règle reste dans le flux normal). */
  .regle-graduee.regle-graduee-semi-transparente{ opacity:.68; }
  .regle-graduee.regle-graduee-semi-transparente .regle-tick{ opacity:.95; }
  .regle-graduee.regle-graduee-semi-transparente .regle-tick-forte{ opacity:1; }
  .regle-graduee.regle-graduee-semi-transparente .regle-label,
  .regle-graduee.regle-graduee-semi-transparente .regle-unite{ opacity:1; text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  .regle-graduee.regle-graduee-semi-transparente .regle-barre{ opacity:.9; }

  /* ---- Palier CE1 : « La Forêt » — comparaison chiffrée (m/cm/km) ----
     Même langage visuel que la lisière du CP (pastille + barre colorées,
     jamais de désignation abstraite), dupliqué sous un préfixe dédié
     (« foret- ») plutôt que réutilisé tel quel : garde CP et CE1 découplés,
     un ajustement de taille/espacement sur l'un ne risque pas de casser
     l'autre (cf. leçon des corrections de recouvrement du palier CP). */
  .foret-comparaison{ display:flex; flex-direction:column; gap:1rem; margin:.9rem 0; overflow-x:auto; }
  .foret-rangee{ display:flex; align-items:center; gap:.6rem; min-height:44px; }
  .foret-pastille{ width:1.3rem; height:1.3rem; border-radius:50%; border:2px solid rgba(0,0,0,.35); flex-shrink:0; }
  .foret-icone{ font-size:1.7rem; }
  .foret-barre{ height:20px; border-radius:10px; border:2px solid rgba(0,0,0,.3); }
  .foret-nom{ font-weight:700; font-size:.9rem; }

  /* ---- Palier CE1 : « La Forêt » — ranger 5 arbres en pyramide, À 90° par
     rapport aux bâtons du CP : COLONNES côte à côte (gauche → droite) au
     lieu de rangées empilées, ANCRAGE EN BAS (comme des arbres plantés sur
     le sol) au lieu d'un ancrage à gauche. Même mécanique d'échange par
     paire (glisser vers une autre colonne) et même transition en pure
     TRANSLATION (translateX ici, jamais de changement de taille pendant le
     geste) que genererOrdonnerBatons/echanger — cf. commentaire JS de
     genererTriArbresCE1. */
  .bande-arbres{ display:flex; justify-content:center; align-items:flex-end; gap:.9rem; margin:1rem 0; min-height:12.5rem; overflow-x:auto; }
  .arbre-col-case{ position:relative; display:flex; align-items:flex-end; padding:.3rem .2rem; border-radius:12px; }
  .arbre-col-case.case-selectionnee{ background:color-mix(in srgb, var(--couleur-soleil) 40%, transparent); }
  .arbre-col-case.correct{ background:color-mix(in srgb, var(--couleur-menthe) 30%, transparent); }
  .arbre-col-case.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 26%, transparent); }
  .arbre-col-btn{ position:relative; border:none; background:transparent; padding:.2rem; min-height:44px; min-width:44px;
    display:flex; align-items:flex-end; justify-content:center; touch-action:none; cursor:grab; }
  .arbre-col-btn.arbre-col-glisse{ z-index:5; cursor:grabbing; }
  .arbre-col-contenu{ display:flex; align-items:flex-end; }
  .arbre-fantome{ position:fixed; pointer-events:none; z-index:80; transition:transform .25s ease; will-change:transform; }
  @media (prefers-reduced-motion:reduce){ .arbre-fantome{ transition:none; } }

  /* ---- Palier CE2 : « Forêt amazonienne » — classement des unités ----
     Tableau à 5 colonnes d'unité réparties sur DEUX RANGÉES (3 puis 2)
     avec une marge verticale généreuse entre elles : les zones de dépôt
     ne se chevauchent jamais et restent des cibles tactiles confortables
     même sur un écran de téléphone étroit. */
  .decouverte-grille{ display:flex; flex-direction:column; gap:1.6rem; margin:1rem 0; }
  .decouverte-rangee{ display:flex; justify-content:center; gap:.9rem; flex-wrap:wrap; }
  .decouverte-colonne{ display:flex; flex-direction:column; align-items:center; gap:.4rem; min-width:5.2rem; }
  .decouverte-entete{ font-weight:700; font-size:1rem; color:color-mix(in srgb, var(--couleur-encre) 85%, white); }
  .decouverte-depot.correct{ border-style:solid; border-color:var(--couleur-menthe); background:color-mix(in srgb, var(--couleur-menthe) 25%, transparent); }
  .decouverte-depot.incorrect{ border-style:solid; border-color:var(--couleur-corail); background:color-mix(in srgb, var(--couleur-corail) 22%, transparent); }
  .decouverte-depot{ min-height:6.8rem; width:5.2rem; border-radius:14px; border:2.5px dashed color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:color-mix(in srgb, var(--couleur-menthe) 8%, white); display:flex; align-items:center; justify-content:center; }
  /* Bloc SOLIDAIRE nombre + image + nom : les 3 éléments empilés forment
     UNE SEULE vignette déplaçable (jamais 3 cibles séparées). Le nombre
     n'affiche jamais l'unité (elle est la colonne cible). */
  .decouverte-plateau{ display:flex; justify-content:center; gap:.8rem; flex-wrap:wrap; margin-top:1.2rem; padding-top:.8rem;
    border-top:2px dashed color-mix(in srgb, var(--couleur-soleil) 45%, white); min-height:6.8rem; }
  .decouverte-vignette{ width:5rem; min-height:6.4rem; border-radius:14px; background:#ffffff;
    border:2.5px solid color-mix(in srgb, var(--couleur-encre) 18%, white); box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-encre) 12%, white);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; padding:.4rem .2rem;
    touch-action:none; cursor:grab; user-select:none; }
  .decouverte-vignette.decouverte-vignette-glisse{ z-index:10; cursor:grabbing; box-shadow:0 6px 14px rgba(0,0,0,.18); }
  .decouverte-nombre{ font-weight:700; font-size:1.15rem; color:var(--couleur-mandarine); }
  .decouverte-image{ width:2.6rem; height:2.6rem; }
  .decouverte-nom{ font-size:.72rem; font-weight:700; text-align:center; line-height:1.1; }

  /* Exercice 1 « Ranger les unités » : disposition verticale à deux colonnes
     — colonne de gauche la pioche en désordre, colonne de droite 5
     emplacements pré-marqués en pointillés, classement de haut (plus
     petite unité) en bas (plus grande). */
  .rangerunites-colonnes{ display:flex; gap:1rem; justify-content:center; margin:1rem auto 0; max-width:20rem; }
  .rangerunites-colonne{ flex:1; min-width:0; display:flex; flex-direction:column; gap:.6rem; }
  .rangerunites-colonne-titre{ text-align:center; font-size:.78rem; font-weight:600; opacity:.7; margin:0 0 .1rem; }
  .rangerunites-colonne-pioche{ display:flex; flex-direction:column; gap:.6rem; align-items:center; }
  .rangerunites-slot.correct{ border-style:solid; border-color:var(--couleur-menthe); background:color-mix(in srgb, var(--couleur-menthe) 25%, transparent); }
  .rangerunites-slot.incorrect{ border-style:solid; border-color:var(--couleur-corail); background:color-mix(in srgb, var(--couleur-corail) 22%, transparent); }
  .rangerunites-slot{ min-height:3.8rem; border-radius:14px; border:2.5px dashed color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:color-mix(in srgb, var(--couleur-menthe) 8%, white); display:flex; align-items:center; justify-content:center; }
  /* Largeur FIXE (pas en %) : la taille de l'étiquette ne doit pas changer
     selon qu'elle est dans la pioche ou déposée dans un emplacement, alors
     que ces deux conteneurs n'ont pas la même boîte (l'emplacement a une
     bordure en pointillés, pas la pioche). */
  .unite-etiquette{ box-sizing:border-box; width:8.4rem; max-width:100%; display:flex; align-items:center; justify-content:center; min-height:3.6rem;
    padding:.4rem .6rem; border-radius:14px; background:#ffffff; border:2.5px solid color-mix(in srgb, var(--couleur-encre) 18%, white);
    box-shadow:0 3px 0 color-mix(in srgb, var(--couleur-encre) 12%, white); font-weight:700; font-size:1.15rem;
    color:var(--couleur-mandarine); user-select:none; touch-action:none; cursor:grab; }
  .unite-etiquette.unite-etiquette-glisse{ z-index:10; cursor:grabbing; box-shadow:0 6px 14px rgba(0,0,0,.18); }

  /* Exercice 3 « QCM d'unités » : illustration de l'animal + définition
     révélée après validation. */
  .qcm-animal-image{ width:6rem; height:6rem; margin:.6rem auto; }
  .qcm-animal-definition{ margin-top:.8rem; padding-top:.7rem; border-top:2px dashed color-mix(in srgb, var(--couleur-soleil) 45%, white); }

  /* ---- Périmètre CE2 « L'arpentage » — polygones irréguliers dont on
     additionne les côtés. Les étiquettes de longueur portent un halo blanc
     (paint-order) pour rester lisibles où qu'elles tombent, y compris sur le
     remplissage de la figure ou par-dessus un trait. */
  .arpentage-scene{ overflow-x:auto; margin:.9rem 0; }
  .arpentage-scene svg{ display:block; margin:0 auto; }
  .arpentage-etiquette{ font-family:inherit; font-size:.82rem; font-weight:700;
    fill:var(--couleur-encre); stroke:#ffffff; stroke-width:3.5px; paint-order:stroke fill; }
  .arpentage-etiquette-inconnue{ fill:var(--couleur-corail); font-size:1rem; }

  /* ---- Périmètre CE2 « La cartographie » — report au compas (manches 1-2) :
     deux polygones dont on reporte les côtés, un à un, sur une droite, pour
     comparer les périmètres SANS jamais lire de mesure. */
  .compas-bloc{ margin:1rem 0 .4rem; }
  .compas-titre{ text-align:center; font-weight:700; margin-bottom:.2rem; }
  .compas-scene{ overflow-x:auto; }
  .compas-scene svg{ display:block; margin:0 auto; }
  .compas-cote-zone{ cursor:pointer; }

  /* ---- Périmètre CE2 « La cartographie » — étapes A/B : la figure SVG dont
     le contour se déplie charnière par charnière en un segment posé sur une
     droite (rotations pures, longueurs des côtés préservées pendant toute
     l'animation), puis mesuré à la règle glissée dessous. */
  .cartographie-scene{ overflow-x:auto; margin:.9rem 0; padding:.3rem 0; }
  .cartographie-scene svg{ display:block; }
  /* La règle qui vient SE POSER sur le segment déplié pour le mesurer
     (positionnée dans la scène, animée en translation par le JS). */
  .cartographie-regle-posee{ position:absolute; }

  /* ---- Périmètre CE2 « La cartographie » — étape C : mesure sans dépliage,
     règle mobile (glisser + pivoter à deux doigts, accroche magnétique à 90°),
     avec repli « deux règles indépendantes » (perpendiculaires, pas de
     rotation à faire) accessible par bouton. */
  .perimetre-scene{ position:relative; margin:1rem 0; min-height:200px; border-radius:14px; overflow:hidden;
    background:color-mix(in srgb, var(--couleur-menthe) 12%, white); border:2px solid color-mix(in srgb, var(--couleur-encre) 12%, white); }
  .perimetre-rectangle{ position:absolute; border:4px solid var(--couleur-mandarine); border-radius:4px; background:transparent; }
  .regle-graduee.regle-mobile{ position:absolute; top:0; left:0; touch-action:none; cursor:grab; opacity:.78; transform-origin:0 50%; }
  .regle-graduee.regle-mobile .regle-tick{ opacity:.95; }
  .regle-graduee.regle-mobile .regle-tick-forte{ opacity:1; }
  .regle-graduee.regle-mobile .regle-label,
  .regle-graduee.regle-mobile .regle-label-haut,
  .regle-graduee.regle-mobile .regle-unite{ opacity:1; text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  .regle-graduee.regle-mobile.regle-mobile-accrochee{ border-color:var(--couleur-menthe); }
  /* Double décimètre : barres de mesure COURTES, pour dégager de l'espace
     entre les deux séries de chiffres — elles-mêmes en police un peu plus
     grande, donc plus lisibles. La seconde échelle (bord du haut, numérotée
     à rebours) est en corail pour la distinguer au premier coup d'œil de
     l'échelle principale, en encre. */
  .regle-mobile .regle-tick{ height:7px; }
  .regle-mobile .regle-tick-forte{ height:11px; }
  .regle-mobile .regle-label{ bottom:12px; font-size:.78rem; }
  .regle-mobile .regle-tick-haut{ top:0; bottom:auto;
    background:color-mix(in srgb, var(--couleur-corail) 80%, black 10%); }
  .regle-mobile .regle-label-haut{ position:absolute; top:12px; transform:translateX(-50%);
    font-size:.78rem; font-weight:700; opacity:.85;
    color:color-mix(in srgb, var(--couleur-corail) 80%, black 15%); }

  /* ---- Saisies numériques (conversions décomposées) ---- */
  .saisie-decomposition{ display:flex; gap:.7rem; justify-content:center; margin:.9rem 0; flex-wrap:wrap; }
  .champ-decomposition{ display:flex; flex-direction:column; align-items:center; gap:.3rem; font-size:.82rem; font-weight:700; }
  .champ-decomposition input{ width:4.4rem; min-height:2.6rem; border-radius:10px; border:2px solid var(--couleur-mandarine); text-align:center; font-family:inherit; font-size:1.05rem; }
  .champ-decomposition input.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .champ-decomposition input.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }

  /* confettis */
  #confettis-conteneur{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
  .confetti{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
    animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards; }
  @keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
  @media (prefers-reduced-motion:reduce){ .confetti{ display:none; animation:none; } }

  [hidden]{ display:none !important; }
</style>
</head>

<script>
(function () {
  'use strict';

  const donnees = JSON.parse(document.getElementById('donnees-jeu').textContent);
  const ORDRE_PALIERS = ['CP', 'CE1', 'CE2'];

  /* ---------- Utilitaires génériques ---------- */

  function nombreAleatoire(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function choisir(tableau) { return tableau[Math.floor(Math.random() * tableau.length)]; }
  function melanger(tableau) {
    const copie = [...tableau];
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }
  function melangerOptions(options, indexCorrect) {
    const enveloppes = options.map((valeur, i) => ({ valeur, estCorrecte: i === indexCorrect }));
    const melangees = melanger(enveloppes);
    return {
      options: melangees.map((e) => e.valeur),
      indexCorrect: melangees.findIndex((e) => e.estCorrecte)
    };
  }

  /* ---------- Étoiles : stockage sûr (mémoire + localStorage best-effort) ---------- */

  const CLE_STOCKAGE = 'mayeutik-m23-foret-etoiles';
  let memoireEtoiles = null;

  function lireEtoiles() {
    if (memoireEtoiles === null) {
      memoireEtoiles = {};
      try {
        const brut = window.localStorage.getItem(CLE_STOCKAGE);
        if (brut) memoireEtoiles = JSON.parse(brut);
      } catch (e) {
        memoireEtoiles = {};
      }
    }
    return memoireEtoiles;
  }
  function enregistrerEtoiles(jeuId, valeur) {
    const tout = lireEtoiles();
    tout[jeuId] = Math.max(tout[jeuId] || 0, valeur);
    memoireEtoiles = tout;
    try {
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : les étoiles restent valables pour la session en cours.
    }
  }

  /* ---------- Palier bonus : révélation "paquet cadeau" (CHARTE §15, pattern
     générique réutilisable — cf. section « Palier bonus » du standard
     "Modules adaptatifs par niveau"). Une clé par module (comme les
     étoiles), un indicateur par PROFIL puis par PALIER CIBLE à l'intérieur :
     { [profilId]: { [palierCible]: true } }. Un module à 3 paliers (CP/CE1/
     CE2) a DEUX transitions bonus possibles (CP→CE1 puis CE1→CE2) : sans
     l'indexation par palier cible, ouvrir le premier paquet marquait le
     profil comme "déjà révélé" pour le module entier, et le second paquet
     (CE1→CE2) n'apparaissait plus jamais — bug corrigé ici.
     Stockage sûr (mémoire + localStorage best-effort, CHARTE §9). ---------- */
  const CLE_BONUS_REVELE = 'mayeutik-m23-bonus-revele';
  let memoireBonusRevele = null;
  function lireBonusRevele() {
    if (memoireBonusRevele === null) {
      memoireBonusRevele = {};
      try {
        const brut = window.localStorage.getItem(CLE_BONUS_REVELE);
        if (brut) memoireBonusRevele = JSON.parse(brut);
      } catch (e) {
        memoireBonusRevele = {};
      }
    }
    return memoireBonusRevele;
  }
  function bonusDejaRevele(profilId, palierCible) {
    const entree = lireBonusRevele()[profilId];
    return !!(entree && typeof entree === 'object' && entree[palierCible]);
  }
  function marquerBonusRevele(profilId, palierCible) {
    const tout = lireBonusRevele();
    if (!tout[profilId] || typeof tout[profilId] !== 'object') tout[profilId] = {};
    tout[profilId][palierCible] = true;
    memoireBonusRevele = tout;
    try {
      window.localStorage.setItem(CLE_BONUS_REVELE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : le paquet cadeau réapparaîtra à la prochaine visite.
    }
  }
  function creerEtoiles(valeur, max) {
    max = max || 3;
    const cont = document.createElement('span');
    cont.className = 'etoiles';
    for (let i = 1; i <= max; i++) {
      const s = document.createElement('span');
      s.className = 'etoile' + (i <= valeur ? ' pleine' : '');
      s.textContent = '★';
      cont.appendChild(s);
    }
    return cont;
  }
  function calculerEtoiles(score, total) {
    const pct = score / total;
    if (pct >= 1) return 3;
    if (pct >= 0.66) return 2;
    if (pct >= 0.33) return 1;
    return 0;
  }

  /* ---------- Profil actif : lecture du niveau (CHARTE §15) ---------- */
  /* Un jeu autonome ne peut pas importer js/profils.js de la coquille : il relit
     directement les mêmes clés partagées localStorage, en lecture seule. */

  const CLE_PROFILS = 'mayeutik-profils';
  const CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';

  function lireProfilActifId() {
    try {
      return window.localStorage.getItem(CLE_PROFIL_ACTIF) || 'p1';
    } catch (e) {
      return 'p1';
    }
  }
  function niveauDuProfilActif() {
    try {
      const brut = window.localStorage.getItem(CLE_PROFILS);
      if (!brut) return null;
      const profils = JSON.parse(brut);
      const actif = profils.find((p) => p.id === lireProfilActifId());
      return (actif && actif.niveau) || null;
    } catch (e) {
      return null;
    }
  }
  /* Lancement paramétré (CHARTE §16) : `?palier=ce1` dans l'URL — le niveau
     du POINT D'ENTRÉE cliqué dans la coquille (ex. carte affichée dans une
     section de niveau du menu, cf. js/app.js) prime sur le niveau du profil
     actif. Insensible à la casse ; absent, invalide, ou ne correspondant à
     aucun palier du module -> null, retombe silencieusement sur le
     comportement par défaut (jamais d'erreur visible). */
  function palierDepuisURL() {
    try {
      const brut = new URLSearchParams(window.location.search).get('palier');
      if (!brut) return null;
      const majuscule = brut.toUpperCase();
      return donnees.paliers[majuscule] ? majuscule : null;
    } catch (e) {
      return null;
    }
  }
  function palierParDefaut() {
    const palierURL = palierDepuisURL();
    if (palierURL) return palierURL;
    const niveau = niveauDuProfilActif();
    if (niveau && donnees.paliers[niveau]) return niveau;
    // Niveau absent/non couvert par ce module : on retombe sur le palier le plus bas (CHARTE §15).
    return ORDRE_PALIERS.find((n) => donnees.paliers[n]) || ORDRE_PALIERS[0];
  }

  /* ---------- Sessions : contrat de données v1 (CHARTE.md, section 11) ---------- */

  const CLE_SESSIONS = 'mayeutik-sessions';
  const MODULE_ID = 'M23';
  const MAX_SESSIONS_PAR_PROFIL = 500;

  let memoireSessions = null;

  function lireSessions() {
    if (memoireSessions === null) {
      memoireSessions = [];
      try {
        const brut = window.localStorage.getItem(CLE_SESSIONS);
        if (brut) memoireSessions = JSON.parse(brut);
      } catch (e) {
        memoireSessions = [];
      }
    }
    return memoireSessions;
  }
  function enregistrerSession(competence, score, total, duree) {
    const profilId = lireProfilActifId();
    const toutes = lireSessions();
    toutes.push({ profilId, module: MODULE_ID, competence, score, total, date: new Date().toISOString(), duree });
    let compteur = 0;
    for (let i = toutes.length - 1; i >= 0; i--) {
      if (toutes[i].profilId === profilId) {
        compteur++;
        if (compteur > MAX_SESSIONS_PAR_PROFIL) toutes.splice(i, 1);
      }
    }
    memoireSessions = toutes;
    try {
      window.localStorage.setItem(CLE_SESSIONS, JSON.stringify(toutes));
    } catch (e) {
      // localStorage indisponible : la session reste valable pour la session en cours.
    }
  }

  /*
   * Maîtrise locale d'un palier (CHARTE §15) : heuristique SIMPLIFIÉE propre à ce
   * jeu, pas le calcul officiel LSU (qui reste propriété de la coquille, cf.
   * js/statuts.js). Un mini-jeu est considéré « maîtrisé » si sa DERNIÈRE
   * session enregistrée atteint au moins 80 %. Le palier est maîtrisé quand
   * TOUS ses mini-jeux le sont.
   */
  const SEUIL_MAITRISE_LOCALE = 0.8;
  function palierMaitrise(palierNom) {
    const palier = donnees.paliers[palierNom];
    if (!palier) return false;
    const profilId = lireProfilActifId();
    const sessions = lireSessions().filter((s) => s.profilId === profilId && s.module === MODULE_ID);
    return palier.miniJeux.every((mj) => {
      const dernieres = sessions.filter((s) => s.competence === mj.id);
      if (!dernieres.length) return false;
      const derniere = dernieres[dernieres.length - 1];
      return derniere.total > 0 && (derniere.score / derniere.total) >= SEUIL_MAITRISE_LOCALE;
    });
  }
  function palierSuivant(palierNom) {
    const i = ORDRE_PALIERS.indexOf(palierNom);
    if (i === -1 || i === ORDRE_PALIERS.length - 1) return null;
    const suivant = ORDRE_PALIERS[i + 1];
    return donnees.paliers[suivant] ? suivant : null;
  }

  /* ---------- Confettis (CHARTE.md, section 4) ---------- */

  function lancerConfettis() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const conteneur = document.getElementById('confettis-conteneur');
    const couleurs = ['var(--couleur-mandarine)', 'var(--couleur-menthe)', 'var(--couleur-corail)', 'var(--couleur-soleil)'];
    const total = 36;
    for (let i = 0; i < total; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.backgroundColor = couleurs[Math.floor(Math.random() * couleurs.length)];
      p.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      p.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      conteneur.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
      setTimeout(() => p.remove(), 2500);
    }
  }

  /* ---------- Feedback sonore (Web Audio) ---------- */

  let contexteAudio = null;
  function obtenirContexteAudio() {
    if (!contexteAudio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      contexteAudio = new Ctx();
    }
    if (contexteAudio.state === 'suspended') contexteAudio.resume();
    return contexteAudio;
  }
  function jouerSon(type) {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const maintenant = ctx.currentTime;
    const notes = type === 'bravo' ? [523.25, 659.25, 783.99, 1046.5] : [392.0, 293.66];
    const duree = type === 'bravo' ? 0.11 : 0.17;
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const debut = maintenant + i * duree;
      gain.gain.setValueAtTime(0.0001, debut);
      gain.gain.exponentialRampToValueAtTime(0.22, debut + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
      osc.connect(gain).connect(ctx.destination);
      osc.start(debut); osc.stop(debut + duree + 0.02);
    });
  }

  /* ---------- Consigne lue à voix haute (SpeechSynthesis) ---------- */

  function lireAVoixHaute(texte) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (e) {
      // synthèse vocale indisponible : la consigne reste lisible à l'écran.
    }
  }
  function creerBlocConsigne(texte, texteVoix) {
    const cont = document.createElement('div');
    cont.className = 'bloc-consigne';
    const p = document.createElement('p');
    p.className = 'consigne';
    p.textContent = texte;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bouton-son';
    btn.setAttribute('aria-label', 'Écouter la consigne');
    btn.textContent = '🔊';
    const texteALire = texteVoix || texte;
    btn.addEventListener('click', () => lireAVoixHaute(texteALire));
    cont.appendChild(p);
    cont.appendChild(btn);
    lireAVoixHaute(texteALire);
    return cont;
  }

  /* ================================================================
     Primitives d'affichage réutilisées par plusieurs mini-jeux
     ================================================================ */

  /* Règle graduée virtuelle : ticks, étiquettes, barre d'objet mesuré (optionnelle),
     zones cliquables entre deux graduations entières (mode « encadrer »).
     `uniteDebut` (défaut 0) et `pxUnite` (défaut : calcul automatique via
     pxParUniteRegle) permettent d'afficher une FENÊTRE agrandie centrée sur
     une plage d'unités plutôt que toute la règle depuis 0 — cf.
     genererEncadrer, dont les zones tactiles (44px CHARTE) seraient sinon
     bien trop étroites sur une règle de 20 cm affichée en entier. Les
     positions restent relatives à `uniteDebut` (left = (i - uniteDebut) *
     px) mais les étiquettes et les zones renvoyées à `onZoneClic` gardent
     leur valeur ABSOLUE, pour rester compatibles avec les appelants qui ne
     passent pas `uniteDebut` (comportement inchangé, uniteDebut = 0). */
  function pxParUniteRegle(longueurUnites) {
    return Math.max(9, Math.min(30, Math.floor(280 / longueurUnites)));
  }
  function construireRegle(options) {
    const { longueurUnites, objetLongueur, unite, zonesCliquables, onZoneClic, zoneSelectionnee, uniteDebut, pxUnite } = options;
    const debut = uniteDebut || 0;
    const px = pxUnite || pxParUniteRegle(longueurUnites);
    const wrap = document.createElement('div');
    wrap.className = 'regle-scroll';
    const regle = document.createElement('div');
    regle.className = 'regle-graduee' + (pxUnite ? ' regle-graduee-grande' : '');
    regle.style.width = (longueurUnites * px + 24) + 'px';

    if (objetLongueur != null) {
      const barre = document.createElement('div');
      barre.className = 'regle-barre';
      barre.style.left = (-debut * px) + 'px';
      barre.style.width = Math.max(2, objetLongueur * px) + 'px';
      regle.appendChild(barre);
    }

    const espacementLabel = px < 16 ? 5 : (px < 22 ? 2 : 1);
    for (let i = 0; i <= longueurUnites; i++) {
      const valeurAbsolue = debut + i;
      const tick = document.createElement('div');
      tick.className = 'regle-tick' + (i % espacementLabel === 0 ? ' regle-tick-forte' : '');
      tick.style.left = (i * px) + 'px';
      regle.appendChild(tick);
      if (i % espacementLabel === 0) {
        const lab = document.createElement('div');
        lab.className = 'regle-label';
        lab.style.left = (i * px) + 'px';
        lab.textContent = String(valeurAbsolue);
        regle.appendChild(lab);
      }
    }
    const uniteLab = document.createElement('div');
    uniteLab.className = 'regle-unite';
    uniteLab.textContent = unite || 'cm';
    uniteLab.style.left = (longueurUnites * px + 6) + 'px';
    regle.appendChild(uniteLab);

    if (zonesCliquables) {
      for (let i = 0; i < longueurUnites; i++) {
        const valeurAbsolue = debut + i;
        const zone = document.createElement('button');
        zone.type = 'button';
        zone.className = 'regle-zone' + (zoneSelectionnee === valeurAbsolue ? ' selectionnee' : '');
        zone.style.left = (i * px) + 'px';
        zone.style.width = px + 'px';
        zone.setAttribute('aria-label', 'Entre ' + valeurAbsolue + ' et ' + (valeurAbsolue + 1) + ' ' + (unite || 'cm'));
        zone.addEventListener('click', () => onZoneClic(valeurAbsolue));
        regle.appendChild(zone);
      }
    }

    wrap.appendChild(regle);
    return wrap;
  }

  /* ================================================================
     Banques du palier CP — univers « Le Bois » (lisière, balade, cabane)
     ================================================================ */

  function nombresDistincts(n, min, max) {
    const valeurs = [];
    let garde = 0;
    while (valeurs.length < n && garde < 300) {
      garde++;
      const v = nombreAleatoire(min, max);
      if (valeurs.indexOf(v) === -1) valeurs.push(v);
    }
    return valeurs;
  }
  // Comme nombresDistincts, mais garantit un écart minimal entre valeurs
  // triées : nécessaire pour les éléments positionnés en absolu le long d'un
  // sentier (axe distance), où deux valeurs trop proches produiraient des
  // cibles tactiles qui se chevauchent (zones de 44px minimum, CHARTE §accessibilité).
  function valeursEspacees(n, min, max, ecartMin) {
    let valeurs;
    let garde = 0;
    do {
      valeurs = nombresDistincts(n, min, max).sort((a, b) => a - b);
      garde++;
    } while (garde < 60 && valeurs.some((v, i) => i > 0 && v - valeurs[i - 1] < ecartMin));
    return melanger(valeurs);
  }

  /* Niveau 1 — « L'orée du bois » (vocabulaire long/court/près/loin), en
     texte à trou : des objets CONCRETS du bois, jamais de désignation
     abstraite « objet A »/« objet B ». Chaque famille d'objet est déclinée
     en 3 couleurs ; les couleurs sont combinées deux à deux (C(3,2) = 3
     paires par famille) pour fournir les deux objets comparés d'une
     question (ex. « la corde rouge » / « la corde verte »). 5 familles × 3
     paires = 15 gabarits (> 6 manches par partie, CHARTE §13), un tirage
     sans redondance par partie via construireSequenceJeu. Pour l'axe
     distance, le repère fixe est toujours « la clairière » (cf.
     genererLisiereCP) : elle n'a donc pas besoin de déclinaison couleur.
     Pas d'« arbre » ici : en langage courant, un arbre se qualifie par
     « grand »/« petit », jamais par « long »/« court » — la « branche »
     couvre l'axe longueur à sa place. */
  const FAMILLES_LISIERE = [
    { nom: 'corde', genre: 'f', axe: 'longueur', icone: '🪢', couleurs: [
      { id: 'rouge', nom: 'rouge', hex: '#E5484D' },
      { id: 'verte', nom: 'verte', hex: '#30A46C' },
      { id: 'bleue', nom: 'bleue', hex: '#0091FF' }
    ] },
    { nom: 'chemin', genre: 'm', axe: 'longueur', icone: '🥾', couleurs: [
      { id: 'brun', nom: 'brun', hex: '#8B5E3C' },
      { id: 'ocre', nom: 'ocre', hex: '#C9971C' },
      { id: 'gris', nom: 'gris', hex: '#8A8578' }
    ] },
    { nom: 'branche', genre: 'f', axe: 'longueur', icone: '🪵', couleurs: [
      { id: 'claire', nom: 'claire', hex: '#D8B88A' },
      { id: 'brune', nom: 'brune', hex: '#8B5E3C' },
      { id: 'foncee', nom: 'foncée', hex: '#4E342E' }
    ] },
    { nom: 'cabane', genre: 'f', axe: 'distance', icone: '🛖', couleurs: [
      { id: 'rouge', nom: 'rouge', expression: 'au toit rouge', hex: '#E5484D' },
      { id: 'jaune', nom: 'jaune', expression: 'au toit jaune', hex: '#F5B700' },
      { id: 'verte', nom: 'verte', expression: 'au toit vert', hex: '#30A46C' }
    ] },
    { nom: 'champignon', genre: 'm', axe: 'distance', icone: '🍄', couleurs: [
      { id: 'rouge', nom: 'rouge', hex: '#E5484D' },
      { id: 'brun', nom: 'brun', hex: '#8B5E3C' },
      { id: 'orange', nom: 'orange', hex: '#FF8C42' }
    ] }
  ];

  function pairesCouleurs(couleurs) {
    const paires = [];
    for (let i = 0; i < couleurs.length; i++) {
      for (let j = i + 1; j < couleurs.length; j++) paires.push([couleurs[i], couleurs[j]]);
    }
    return paires;
  }

  const GABARITS_LISIERE = FAMILLES_LISIERE.flatMap((famille) =>
    pairesCouleurs(famille.couleurs).map(([couleurA, couleurB]) => ({
      nom: famille.nom, genre: famille.genre, axe: famille.axe, icone: famille.icone, couleurA, couleurB
    }))
  );

  /* Niveau 2 — « En balade » (comparaison) : les 5 gabarits officiels du
     programme, chacun dans les deux sens (grand/petit, proche/loin…) = 10
     combinaisons (> 4 manches par partie), un tirage sans redondance par
     partie. La 5ᵉ et dernière manche est toujours l'ordonnancement des
     bâtons (cf. genererBaladeCP), pas tirée de cette banque.
     Les consignes ne sont plus figées ici : elles sont générées par
     construireConsigneBalade (cf. plus bas) pour garantir l'accord de genre
     et nommer explicitement le repère de distance (« du lac »). */
  const GABARITS_BALADE = [
    { axe: 'hauteur', nom: 'arbre', genre: 'm', cible: 'max' },
    { axe: 'hauteur', nom: 'arbre', genre: 'm', cible: 'min' },
    { axe: 'longueur', nom: 'corde', genre: 'f', cible: 'min' },
    { axe: 'longueur', nom: 'corde', genre: 'f', cible: 'max' },
    { axe: 'longueur', nom: 'chemin', genre: 'm', cible: 'min' },
    { axe: 'longueur', nom: 'chemin', genre: 'm', cible: 'max' },
    { axe: 'distance', nom: 'cabane', genre: 'f', icone: '🛖', cible: 'min' },
    { axe: 'distance', nom: 'cabane', genre: 'f', icone: '🛖', cible: 'max' },
    { axe: 'distance', nom: 'clairière', genre: 'f', cible: 'min' },
    { axe: 'distance', nom: 'clairière', genre: 'f', cible: 'max' }
  ];

  // Tirage SANS REDONDANCE, précalculé une seule fois par partie (cf.
  // demarrerJeu) : un mini-jeu à banque déclare ici sa séquence de gabarits ;
  // les autres types (procéduraux, sans banque figée) renvoient null.
  function construireSequenceJeu(cfg) {
    if (cfg.type === 'vocabulaire-cp') return melanger(GABARITS_LISIERE).slice(0, cfg.nbTours);
    if (cfg.type === 'balade-cp') return melanger(GABARITS_BALADE).slice(0, cfg.nbTours - 1);
    return null;
  }

  /* Palier CE1 — « La Forêt » : banque « quelle unité choisir ? » (mini-jeu
     « La lisière de la forêt », et réutilisée comme un des sous-types de « La règle du
     garde forestier »). Formulation déclarative (« La hauteur… s'exprime
     en… ») plutôt qu'interrogative directe sur l'unité, avec « distance »
     réservé aux trajets et « hauteur »/« largeur »/« longueur » aux objets
     mesurés — cohérent avec le contexte de chaque item. 12 items (> 2× les
     6 manches par partie, CHARTE §13), un tirage sans redondance par
     partie (etat.uniteVues, comme genererEstimation). */
  const OBJETS_UNITES_CE1 = [
    { texte: "La hauteur du chêne s'exprime en…", icone: '🌳', unite: 'm' },
    { texte: "La hauteur du sapin s'exprime en…", icone: '🌲', unite: 'm' },
    { texte: "La largeur du pont de bois s'exprime en…", icone: '🌉', unite: 'm' },
    { texte: "La longueur de la chaussure de marche s'exprime en…", icone: '🥾', unite: 'cm' },
    { texte: "La longueur du lapin s'exprime en…", icone: '🐇', unite: 'cm' },
    { texte: "La largeur du champignon s'exprime en…", icone: '🍄', unite: 'cm' },
    { texte: "La longueur de la pomme de pin s'exprime en…", icone: '🌰', unite: 'cm' },
    { texte: "La longueur de la boussole s'exprime en…", icone: '🧭', unite: 'cm' },
    { texte: "La distance pour traverser toute la forêt s'exprime en…", icone: '🥾', unite: 'km' },
    { texte: "La distance jusqu'au village voisin s'exprime en…", icone: '🏘️', unite: 'km' },
    { texte: "La distance d'un sentier de randonnée s'exprime en…", icone: '🛤️', unite: 'km' },
    { texte: "La distance d'un bout à l'autre de la forêt s'exprime en…", icone: '🧭', unite: 'km' }
  ];

  /* Palier CE1 — « La Forêt » : familles pour la comparaison chiffrée
     (mini-jeu « La règle du garde forestier », sous-type comparaison).
     Chaque famille précise son unité (m/cm/km), l'adjectif approprié
     (grand/petit pour une hauteur d'arbre, long/court pour une distance),
     et exactement 2 couleurs (jamais de désignation abstraite « objet
     A »/« objet B »). 3 familles (> 2× le nombre de tirages probable de ce
     sous-type par partie), un tirage sans redondance par partie
     (etat.comparaisonVues). */
  const FAMILLES_COMPARAISON_CE1 = [
    { nom: 'chêne', genre: 'm', unite: 'm', min: 4, max: 20, pxParUnite: 8, icone: '🌳', adjectif: 'grandPetit',
      couleurA: { id: 'clair', nom: 'clair', hex: '#8BC98F' }, couleurB: { id: 'fonce', nom: 'foncé', hex: '#2E7D32' } },
    { nom: 'sentier', genre: 'm', unite: 'km', min: 2, max: 15, pxParUnite: 10, icone: '🥾', adjectif: 'longCourt',
      couleurA: { id: 'sableux', nom: 'sableux', hex: '#C9971C' }, couleurB: { id: 'boueux', nom: 'boueux', hex: '#6D4C33' } },
    { nom: 'branche', genre: 'f', unite: 'cm', min: 10, max: 90, pxParUnite: 1.8, icone: '🪵', adjectif: 'longCourt',
      couleurA: { id: 'claire', nom: 'claire', hex: '#D8B88A' }, couleurB: { id: 'foncee', nom: 'foncée', hex: '#4E342E' } }
  ];

  /* ================================================================
     Contrôleur général de jeu
     ================================================================ */

  let etatPalierAffiche = palierParDefaut();
  let etat = null; // { miniJeuId, palier, index, score, verrouille, demarreLe, ... }

  function trouverMiniJeu(id) {
    for (const nom of ORDRE_PALIERS) {
      const palier = donnees.paliers[nom];
      if (!palier) continue;
      const trouve = palier.miniJeux.find((mj) => mj.id === id);
      if (trouve) return { cfg: trouve, palier: nom };
    }
    return null;
  }

  function construireCarteJeu(cfg) {
    const carte = document.createElement('button');
    carte.className = 'carte-jeu carte-' + cfg.couleur;
    carte.dataset.jeu = cfg.id;
    const icone = document.createElement('div');
    icone.className = 'icone';
    icone.textContent = cfg.icone;
    const titre = document.createElement('h2');
    titre.textContent = cfg.titre;
    const desc = document.createElement('p');
    desc.textContent = cfg.description;
    const tout = lireEtoiles();
    const etoiles = creerEtoiles(tout[cfg.id] || 0);
    carte.appendChild(icone);
    carte.appendChild(titre);
    carte.appendChild(desc);
    carte.appendChild(etoiles);
    carte.addEventListener('click', () => demarrerJeu(cfg.id));
    return carte;
  }

  /* Remonte en haut à chaque changement d'écran (CHARTE §17) : sans cela, le
     nouvel écran hérite du défilement de l'écran précédent — l'enfant qui
     vient de valider en bas de page se retrouverait au milieu de la manche
     suivante. Repositionnement instantané (jamais « smooth » : un glissement
     animé pendant une transition est parasite). */
  function remonterEnHaut() {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) {
      window.scrollTo(0, 0); // navigateurs sans l'API à options
    }
  }

  /* Correction après une MAUVAISE réponse (CHARTE §18) : ce que l'enfant a
     répondu en rouge, ce qu'il fallait répondre en vert. N'est jamais appelée
     sur une bonne réponse (elle brouillerait la récompense). */
  function afficherCorrection(zone, donnee, attendue) {
    const bloc = document.createElement('p');
    bloc.className = 'bloc-correction';
    if (donnee !== null && donnee !== undefined && donnee !== '') {
      const d = document.createElement('span');
      d.className = 'correction-donnee';
      d.textContent = 'Ta réponse : ' + donnee;
      bloc.appendChild(d);
      bloc.appendChild(document.createTextNode(' — '));
    }
    const a = document.createElement('span');
    a.className = 'correction-attendue';
    a.textContent = 'La bonne réponse : ' + attendue;
    bloc.appendChild(a);
    zone.appendChild(bloc);
    return bloc;
  }

  /* Révélation du bon rangement après une erreur de tri (CHARTE §18) : on
     marque d'abord en rouge les places occupées par le mauvais élément (et en
     vert celles déjà bonnes), puis la bande se remet d'elle-même dans l'ordre
     attendu, tout en vert — l'enfant voit à la fois SON erreur et la réponse.
     `ordre` est muté en place : c'est le modèle que `rendreCase` relit. */
  function revelerRangement(cases, ordre, attendu, rendreCase) {
    cases.forEach((caseDiv, i) => {
      caseDiv.classList.remove('case-selectionnee');
      caseDiv.classList.add(ordre[i] === attendu[i] ? 'correct' : 'incorrect');
    });
    setTimeout(() => {
      if (!cases[0] || !cases[0].isConnected) return; // manche déjà quittée
      attendu.forEach((v, i) => { ordre[i] = v; });
      cases.forEach((caseDiv, i) => {
        rendreCase(i);
        caseDiv.classList.remove('incorrect');
        caseDiv.classList.add('correct');
      });
    }, 900);
  }

  /* Révélation de la bonne répartition d'un glisser-déposer (CHARTE §18) :
     chaque emplacement passe au vert s'il contenait déjà le bon élément, au
     rouge sinon ; après une pause, l'élément attendu vient de lui-même s'y
     placer et tout passe au vert. `depots` = [{ el, attendu }], `elements` =
     la liste complète des étiquettes/vignettes (attribut data-unite). */
  function revelerDepots(depots, elements) {
    depots.forEach(({ el, attendu }) => {
      const present = el.firstElementChild;
      el.classList.add(present && present.dataset.unite === attendu ? 'correct' : 'incorrect');
    });
    setTimeout(() => {
      if (!depots[0] || !depots[0].el.isConnected) return; // manche déjà quittée
      depots.forEach(({ el, attendu }) => {
        const bon = elements.find((e) => e.dataset.unite === attendu);
        if (bon && bon.parentElement !== el) el.appendChild(bon); // appendChild déplace
        el.classList.remove('incorrect');
        el.classList.add('correct');
      });
    }, 900);
  }

  /* Marquage d'un choix parmi des vignettes illustrées (arbres, brindilles,
     clairières) : vert sur la bonne, rouge sur celle qui a été touchée à tort
     (CHARTE §18). Sur une bonne réponse, seule la vignette choisie verdit. */
  function marquerChoix(boutons, choisi, correct, attendu) {
    choisi.classList.add(correct ? 'correct' : 'incorrect');
    if (!correct && attendu && attendu !== choisi) attendu.classList.add('correct');
  }

  function construireAccueil() {
    // Sous-titre : par défaut celui du module, mais un palier peut définir le
    // sien (ex. CP : univers « Le Bois », volontairement distinct de « La
    // Forêt aux Cent Arbres » des paliers CE1/CE2 — cf. task M23 CP refonte).
    const palierAffiche = donnees.paliers[etatPalierAffiche];
    document.getElementById('sous-titre-accueil').textContent =
      (palierAffiche && palierAffiche.sousTitre) || donnees.sousTitre;

    const rangee = document.getElementById('rangee-paliers');
    rangee.innerHTML = '';
    ORDRE_PALIERS.filter((n) => donnees.paliers[n]).forEach((n) => {
      const puce = document.createElement('button');
      puce.type = 'button';
      puce.className = 'puce-palier' + (n === etatPalierAffiche ? ' actif' : '');
      puce.textContent = n;
      puce.addEventListener('click', () => { etatPalierAffiche = n; construireAccueil(); });
      rangee.appendChild(puce);
    });
    const niveauProfil = niveauDuProfilActif();
    document.getElementById('note-palier').textContent = niveauProfil
      ? 'Niveau de ' + (niveauProfil === etatPalierAffiche ? 'ton profil' : 'ton profil : ' + niveauProfil + ' — tu regardes le palier ' + etatPalierAffiche)
      : '';

    const grille = document.getElementById('grille-jeux');
    grille.innerHTML = '';
    (donnees.paliers[etatPalierAffiche] ? donnees.paliers[etatPalierAffiche].miniJeux : [])
      .forEach((cfg) => grille.appendChild(construireCarteJeu(cfg)));

    /* Palier bonus (CHARTE §15) : uniquement si le palier courant est maîtrisé
       ET qu'un palier suivant existe. Première apparition du bonus pour ce
       profil : habillé en « paquet cadeau » tant qu'il n'a pas été ouvert
       (cf. ouvrirPaquetCadeau) ; ensuite affiché normalement à chaque visite. */
    const suivant = palierSuivant(etatPalierAffiche);
    const blocBonus = document.getElementById('bloc-bonus');
    const paquetCadeau = document.getElementById('paquet-cadeau');
    const grilleBonus = document.getElementById('grille-bonus');
    if (suivant && palierMaitrise(etatPalierAffiche)) {
      blocBonus.hidden = false;
      document.getElementById('note-bonus').textContent =
        'Tu maîtrises tout le palier ' + etatPalierAffiche + ' : essaie un aperçu du palier ' + suivant + ' !';
      grilleBonus.innerHTML = '';
      donnees.paliers[suivant].miniJeux.forEach((cfg) => grilleBonus.appendChild(construireCarteJeu(cfg)));

      const profilId = lireProfilActifId();
      if (bonusDejaRevele(profilId, suivant)) {
        paquetCadeau.hidden = true;
        grilleBonus.hidden = false;
      } else {
        paquetCadeau.hidden = false;
        paquetCadeau.disabled = false;
        paquetCadeau.classList.remove('paquet-cadeau-ouverture');
        grilleBonus.hidden = true;
        paquetCadeau.onclick = () => ouvrirPaquetCadeau(profilId, suivant, paquetCadeau, grilleBonus);
      }
    } else {
      blocBonus.hidden = true;
    }
  }

  /* Ouverture du paquet cadeau (une seule fois par profil ET par palier
     cible, cf. marquerBonusRevele) : confettis + petite animation
     d'explosion douce, puis le contenu du palier bonus est révélé
     normalement. */
  function ouvrirPaquetCadeau(profilId, palierCible, paquetCadeau, grilleBonus) {
    if (paquetCadeau.disabled) return;
    paquetCadeau.disabled = true;
    marquerBonusRevele(profilId, palierCible);
    lancerConfettis();
    jouerSon('bravo');
    paquetCadeau.classList.add('paquet-cadeau-ouverture');
    setTimeout(() => {
      paquetCadeau.hidden = true;
      grilleBonus.hidden = false;
    }, 480);
  }

  function retourAccueil() {
    if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
    document.getElementById('ecran-jeu').hidden = true;
    document.getElementById('ecran-accueil').hidden = false;
    construireAccueil();
    remonterEnHaut();
  }

  function demarrerJeu(miniJeuId) {
    const trouve = trouverMiniJeu(miniJeuId);
    if (!trouve) return;
    etat = { miniJeuId, cfg: trouve.cfg, palier: trouve.palier, index: 0, score: 0, verrouille: false, demarreLe: Date.now(), dernierSousType: null };
    // Tirage SANS REDONDANCE dans une banque plus large que le nombre de
    // manches (CHARTE §13) : précalculé une seule fois au démarrage de la
    // partie plutôt que redessiné à chaque manche, pour garantir qu'aucun
    // gabarit ne revient deux fois dans la même partie.
    etat.sequence = construireSequenceJeu(trouve.cfg);
    document.getElementById('ecran-accueil').hidden = true;
    document.getElementById('ecran-jeu').hidden = false;
    document.getElementById('titre-jeu-courant').textContent = trouve.cfg.titre;
    tourSuivant();
    remonterEnHaut();
  }

  function majProgression() {
    document.getElementById('progression-jeu').textContent = 'Manche ' + etat.index + ' / ' + etat.cfg.nbTours;
  }

  function tourSuivant() {
    if (etat.index >= etat.cfg.nbTours) { afficherResultats(); return; }
    etat.index++;
    etat.verrouille = false;
    majProgression();
    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    document.getElementById('zone-feedback').textContent = '';
    document.getElementById('zone-feedback').className = 'feedback';
    document.getElementById('bouton-suivant').hidden = true;
    const type = etat.cfg.type;
    if (type === 'vocabulaire-cp') genererLisiereCP(zone, etat.cfg);
    else if (type === 'balade-cp') genererBaladeCP(zone, etat.cfg);
    else if (type === 'cabane-cp') genererCabaneCP(zone, etat.cfg);
    else if (type === 'unites-conversion-ce1') genererUnitesConversionCE1(zone, etat.cfg);
    else if (type === 'comparer-ranger-ce1') genererComparerRangerCE1(zone, etat.cfg);
    else if (type === 'decouverte-ce2') genererDecouverteCE2(zone, etat.cfg);
    else if (type === 'exploration-ce2') genererExplorationCE2(zone, etat.cfg);
    else if (type === 'perimetre') genererPerimetre(zone, etat.cfg);
    else if (type === 'perimetre-calcul') genererArpentage(zone, etat.cfg);
    remonterEnHaut();
  }

  /* « Presque » ne se dit QUE d'une réponse voisine de la bonne : appliqué à
     un résultat complètement faux, le mot sonne faux et brouille le repère que
     l'enfant se construit sur son propre écart. On compare donc les deux
     valeurs quand elles sont chiffrées : voisines = écart d'une unité, ou de
     moins de 10 % de la valeur attendue (une mesure à 34 mm au lieu de 36 est
     « presque », 3 m au lieu de 300 cm ne l'est pas). Les réponses non
     chiffrées (unité à choisir, objet à désigner…) ne sont jamais « presque » :
     on y est juste ou on n'y est pas.
     `correction.nombres = [donnee, attendue]` permet de fournir directement
     les valeurs quand le texte affiché ne s'y prête pas. */
  function extraireNombre(texte) {
    if (typeof texte === 'number') return texte;
    if (typeof texte !== 'string') return null;
    const m = texte.match(/-?\d+(?:[.,]\d+)?/);
    return m ? parseFloat(m[0].replace(',', '.')) : null;
  }

  function memeUnite(a, b) {
    const unite = (t) => (typeof t === 'string' ? (t.replace(/-?\d+(?:[.,]\d+)?/g, '').trim()) : '');
    return unite(a) === unite(b);
  }

  function reponseVoisine(correction) {
    if (!correction) return false;
    let donnee, attendue;
    if (correction.nombres) {
      donnee = correction.nombres[0]; attendue = correction.nombres[1];
    } else {
      if (!memeUnite(correction.donnee, correction.attendue)) return false;
      donnee = extraireNombre(correction.donnee);
      attendue = extraireNombre(correction.attendue);
    }
    if (donnee === null || attendue === null || isNaN(donnee) || isNaN(attendue)) return false;
    const ecart = Math.abs(donnee - attendue);
    return ecart > 0 && (ecart <= 1 || ecart <= Math.abs(attendue) * 0.1);
  }

  /* `correction` (facultatif) = { donnee, attendue } : affiché uniquement en cas
     d'erreur, sous le message de feedback (CHARTE §18). */
  function validerTour(estCorrecte, boutonAValider, correction) {
    if (etat.verrouille) return;
    etat.verrouille = true;
    if (boutonAValider) boutonAValider.disabled = true;
    const zoneFeedback = document.getElementById('zone-feedback');
    if (estCorrecte) {
