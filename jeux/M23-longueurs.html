<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>Longueurs – Mayeutik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --couleur-fond: #FFF8EF;
    --couleur-encre: #2B2B2B;
    --couleur-mandarine: #FF8C42;
    --couleur-menthe: #4ECDC4;
    --couleur-corail: #FF6B6B;
    --couleur-soleil: #FFD93D;
    color-scheme: light only;
  }
  @media (prefers-color-scheme: dark) {
    html { background-color: var(--couleur-fond); }
    body { background-color: var(--couleur-fond); color: var(--couleur-encre); }
    input, select, textarea, button { background-color: #FFFFFF; color: var(--couleur-encre); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--couleur-fond); color:var(--couleur-encre); overflow-x:hidden; }
  body { font-family:'Fredoka', system-ui, sans-serif; min-height:100vh; padding-bottom:2rem; }
  button { font-family:inherit; cursor:pointer; }
  h1,h2,h3{ font-weight:700; margin:0 0 .4rem; }

  #ecran-accueil { max-width:640px; margin:0 auto; padding:1.2rem 1rem 2rem; }
  .entete-accueil { text-align:center; margin-bottom:.8rem; }
  .entete-accueil h1 { font-size:1.5rem; color:var(--couleur-mandarine); }
  .entete-accueil p { margin:0; font-size:1rem; font-weight:500; opacity:.85; }

  /* Sélecteur de palier (CHARTE §15 : niveau du profil actif par défaut, changement possible) */
  .rangee-paliers{ display:flex; justify-content:center; gap:.5rem; margin:.9rem 0 1rem; flex-wrap:wrap; }
  .puce-palier{
    min-height:40px; padding:.35rem 1rem; border-radius:999px; font-weight:700; font-size:.92rem;
    border:2.5px solid color-mix(in srgb, var(--couleur-encre) 22%, white); background:#ffffff; color:var(--couleur-encre);
  }
  .puce-palier.actif{ background:var(--couleur-mandarine); border-color:var(--couleur-mandarine); color:#ffffff; }
  .note-palier{ text-align:center; font-size:.82rem; opacity:.7; margin:-.3rem 0 .8rem; }

  .grille-jeux { display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem; }
  @media (max-width:360px){ .grille-jeux{ grid-template-columns:1fr; } }
  .carte-jeu {
    --c: var(--couleur-mandarine);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center; gap:.3rem;
    background: color-mix(in srgb, var(--c) 16%, white);
    border:3px solid var(--c); border-radius:20px; padding:.8rem .6rem;
    max-height:34vh; min-height:9.5rem;
    box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, black 6%);
  }
  .carte-jeu:active { transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, black 6%); }
  .carte-jeu.carte-menthe{ --c:var(--couleur-menthe); }
  .carte-jeu.carte-corail{ --c:var(--couleur-corail); }
  .carte-jeu.carte-soleil{ --c:var(--couleur-soleil); }
  .carte-jeu .icone{ font-size:1.9rem; line-height:1; }
  .carte-jeu h2{ font-size:1rem; }
  .carte-jeu p{ font-size:.76rem; font-weight:400; margin:0; opacity:.85; }
  .etoiles{ display:inline-flex; gap:2px; font-size:1.1rem; letter-spacing:-1px; }
  .etoile{ color:rgba(43,43,43,.2); }
  .etoile.pleine{ color:var(--couleur-soleil); text-shadow:0 0 1px rgba(43,43,43,.35); }

  /* Palier bonus : présenté comme une récompense, distinct visuellement (CHARTE §15) */
  .bloc-bonus{
    margin-top:1.3rem; border-radius:20px; padding:.9rem .8rem;
    border:3px dashed var(--couleur-soleil); background:color-mix(in srgb, var(--couleur-soleil) 14%, white);
  }
  .bloc-bonus h3{ text-align:center; font-size:1rem; color:color-mix(in srgb, var(--couleur-soleil) 55%, black 25%); margin-bottom:.15rem; }
  .bloc-bonus .note-palier{ margin:.1rem 0 .7rem; }

  #ecran-jeu{ max-width:640px; margin:0 auto; padding:.8rem 1rem 2.5rem; }
  .entete-jeu{ display:flex; align-items:center; gap:.6rem; margin-bottom:.8rem; }
  .bouton-retour{
    flex:0 0 auto; min-height:44px; min-width:44px; border-radius:14px; border:none;
    background:var(--couleur-encre); color:var(--couleur-fond); font-size:1.2rem; font-weight:600; padding:0 .9rem;
  }
  .entete-jeu-titres{ flex:1; min-width:0; }
  .entete-jeu-titres h2{ font-size:1.1rem; color:var(--couleur-mandarine); }
  .entete-jeu-titres .progression{ font-size:.85rem; font-weight:500; opacity:.75; }
  #zone-jeu{
    background:#ffffff; border-radius:20px;
    border:3px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
    padding:1.1rem .9rem; min-height:40vh;
  }
  .consigne{ text-align:center; font-size:1.05rem; font-weight:600; margin:0; }
  .legende{ text-align:center; font-size:.85rem; font-weight:400; opacity:.85; margin-top:.7rem; }

  .bloc-consigne{ display:flex; align-items:center; justify-content:center; gap:.6rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .bouton-son{
    min-width:44px; min-height:44px; border-radius:50%;
    border:2.5px solid var(--couleur-mandarine); background:#ffffff;
    font-size:1.3rem; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .bouton-son:active{ transform:translateY(2px); }

  .bouton-principal{
    display:block; margin:.8rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; padding:0 1.3rem; font-size:1rem;
  }
  .bouton-principal:disabled{ opacity:.45; }
  .bouton-secondaire{
    display:block; margin:0 auto; min-height:44px; border-radius:14px; border:2.5px solid var(--couleur-encre);
    background:#ffffff; padding:0 1.1rem; font-weight:500;
  }

  /* Retour à la coquille (CHARTE §7) : bouton discret + confirmation */
  .barre-accueil{ display:flex; margin-bottom:.6rem; }
  .bouton-menu{
    min-height:44px; border-radius:14px; padding:0 .9rem;
    border:2px solid color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:#ffffff; color:var(--couleur-encre); font-weight:600; font-size:.95rem;
    display:inline-flex; align-items:center; gap:.35rem;
  }
  .bouton-menu:active{ transform:translateY(2px); }
  .modale-fond{
    position:fixed; inset:0; z-index:1000; padding:1.2rem;
    background:color-mix(in srgb, var(--couleur-encre) 55%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .modale-boite{
    background:#ffffff; border-radius:20px; padding:1.4rem 1.2rem; max-width:20rem; width:100%;
    text-align:center; box-shadow:0 12px 34px rgba(43,43,43,.28);
  }
  .modale-boite p{ font-size:1.05rem; font-weight:600; margin:0 0 1.1rem; }
  .modale-boutons{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .modale-boutons .bouton-principal, .modale-boutons .bouton-secondaire{ margin:0; }

  .feedback{ text-align:center; font-weight:700; font-size:1.05rem; min-height:1.6rem; margin:.8rem 0 .2rem; }
  .feedback-succes{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }
  .feedback-erreur{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .bouton-suivant{
    display:block; margin:.6rem auto 0; min-height:44px; border-radius:14px; border:none;
    background:var(--couleur-mandarine); color:#ffffff; font-weight:700; font-size:1rem; padding:0 1.4rem;
  }

  .bloc-resultats{ text-align:center; }
  .bloc-resultats .etoiles{ font-size:2.6rem; margin:.6rem 0; }
  .bloc-resultats .score-texte{ font-size:1.1rem; font-weight:500; margin-bottom:1rem; }
  .boutons-resultats{ display:flex; justify-content:center; gap:.7rem; flex-wrap:wrap; margin-top:.6rem; }

  /* ---- Lecture (QCM) ---- */
  .grille-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-top:.7rem; }
  @media (max-width:340px){ .grille-options{ grid-template-columns:1fr; } }
  .bouton-option{
    min-height:3.2rem; border-radius:16px; border:2.5px solid var(--couleur-encre); background:#ffffff;
    display:flex; align-items:center; justify-content:center; padding:.5rem; font-size:.95rem; font-weight:600; text-align:center;
  }
  .bouton-option:disabled{ opacity:.6; }
  .bouton-option.correct{ background:color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color:var(--couleur-menthe); }
  .bouton-option.incorrect{ background:color-mix(in srgb, var(--couleur-corail) 35%, white); border-color:var(--couleur-corail); }
  .bouton-option-bonus{ min-height:2.7rem; font-size:.85rem; }

  .bonus-estimation{ margin-top:1rem; padding-top:.8rem; border-top:2px dashed color-mix(in srgb, var(--couleur-soleil) 55%, white); }
  .grille-options-bonus{ margin-top:.5rem; }

  /* ---- Règle graduée virtuelle (composant réutilisé par plusieurs mini-jeux) ---- */
  .regle-scroll{ overflow-x:auto; margin:.9rem 0; padding-bottom:.3rem; }
  .regle-graduee{
    position:relative; height:64px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--couleur-mandarine) 16%, white), color-mix(in srgb, var(--couleur-encre) 6%, white));
    border:2.5px solid color-mix(in srgb, var(--couleur-encre) 25%, white); border-radius:10px;
  }
  .regle-tick{ position:absolute; bottom:0; width:2px; height:12px; background:var(--couleur-encre); opacity:.55; }
  .regle-tick-forte{ height:20px; width:2.5px; opacity:.9; }
  .regle-label{ position:absolute; bottom:22px; transform:translateX(-50%); font-size:.66rem; font-weight:700; opacity:.8; }
  .regle-unite{ position:absolute; bottom:22px; font-size:.7rem; font-weight:700; opacity:.7; }
  .regle-barre{
    position:absolute; top:8px; left:0; height:13px; border-radius:4px;
    background:var(--couleur-corail); border:2px solid color-mix(in srgb, var(--couleur-corail) 60%, black 10%);
  }
  .regle-zone{ position:absolute; top:0; height:100%; background:transparent; border:none; padding:0; }
  .regle-zone.selectionnee{ background:color-mix(in srgb, var(--couleur-soleil) 45%, transparent); border-radius:4px; }

  /* ---- Comparaison directe (corde/chemin alignés) ---- */
  .comparaison-objets{ display:flex; flex-direction:column; gap:.9rem; margin:.9rem 0; }
  .rangee-brindille{ display:flex; }
  .brindille-btn{ border:none; background:transparent; padding:.3rem; display:flex; align-items:center; min-height:44px; }

  /* Corde : texture torsadée simple (rayures obliques en pilule). */
  .balade-corde{ display:block; height:18px; border-radius:999px;
    background-image:repeating-linear-gradient(135deg, #E8B24D 0 7px, #C9971C 7px 14px);
    border:2px solid #8A6A17; }

  /* Chemin : texture de terrain (semis de graviers sur fond brun/ocre). */
  .balade-chemin{ display:block; height:16px; border-radius:8px;
    background-image:radial-gradient(circle, rgba(0,0,0,.28) 1.4px, transparent 1.6px), linear-gradient(180deg, #A9764B, #7C5734);
    background-size:9px 9px, 100% 100%;
    border:2px solid #5B3F28; }

  /* ---- Report indirect (arbres figuratifs : tronc + feuillage) ---- */
  .comparaison-report{ display:flex; justify-content:center; gap:1.8rem; align-items:flex-end; margin:1rem 0; min-height:9.5rem; }
  .arbre-col{ border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:.15rem; min-width:64px; min-height:44px; }
  .balade-arbre{ display:flex; flex-direction:column; align-items:center; }
  .arbre-feuillage{ display:block; border-radius:60% 60% 50% 50% / 70% 70% 40% 40%;
    background:radial-gradient(circle at 35% 30%, #8BD17E, #2E7D32); border:2px solid #1B5E20; margin-bottom:-4px; }
  .arbre-tronc{ display:block; width:14px; border-radius:4px;
    background:linear-gradient(180deg, #B98657, #6D4C33); border:2px solid #5B3F28; }

  /* ---- Distances sur le sentier, depuis le repère « lac » ---- */
  .sentier{ position:relative; margin:1.1rem .5rem 1.8rem; height:3rem; }
  .sentier-depart{ position:absolute; left:0; top:-.1rem; display:flex; flex-direction:column; align-items:center; }
  .sentier-depart-nom{ font-size:.65rem; font-weight:700; opacity:.75; }
  .sentier-piste{ position:relative; margin-left:2.4rem; height:100%; border-bottom:3px dashed color-mix(in srgb, var(--couleur-encre) 25%, white); }
  .clairiere-btn{ position:absolute; bottom:-.15rem; min-width:44px; min-height:44px; border:none; background:transparent;
    font-size:1.6rem; display:flex; align-items:center; justify-content:center; }

  /* Lac : simple forme figurative (ovale bleu), repère fixe des comparaisons
     de distance du niveau 2. */
  .mini-lac{ display:block; width:2.2rem; height:1.5rem; border-radius:50%;
    background:radial-gradient(ellipse at 38% 32%, #8FD3F4, #1E88E5); border:2px solid #0B5D8A; }

  /* Clairière : vue semi-aérienne — herbe claire cernée d'un anneau de 6
     arbres, disposés en cercle par rotation régulière à 60° (--i = 0..5). */
  .mini-clairiere{ position:relative; display:block; width:2.3rem; height:2.3rem; }
  .mini-clairiere-herbe{ position:absolute; inset:26%; border-radius:50%;
    background:radial-gradient(circle, #EFE6B8, #D9CE86); border:2px solid #B8AC5E; }
  .mini-clairiere-arbre{ position:absolute; width:.5rem; height:.5rem; border-radius:50%;
    background:#2E7D32; border:2px solid #1B5E20; top:50%; left:50%; margin:-.28rem 0 0 -.28rem;
    transform:rotate(calc(var(--i) * 60deg)) translate(1rem) rotate(calc(var(--i) * -60deg)); }

  /* ---- Palier CP : « Le Bois » — lisière (vocabulaire, texte à trou) ---- */

  /* Objets concrets colorés (pas de lettre abstraite) : chaque couleur a sa
     pastille + sa barre/son repère teintés en couleur.hex (cf. GABARITS_LISIERE). */
  .lisiere-comparaison{ display:flex; flex-direction:column; gap:.9rem; margin:.9rem 0; }
  .lisiere-rangee{ display:flex; align-items:center; gap:.5rem; min-height:44px; }
  .lisiere-pastille{ width:1.15rem; height:1.15rem; border-radius:50%; border:2px solid rgba(0,0,0,.35); flex-shrink:0; }
  .lisiere-icone{ font-size:1.2rem; }
  .lisiere-barre{ height:16px; border-radius:8px; border:2px solid rgba(0,0,0,.3); }
  .lisiere-nom{ font-weight:700; font-size:.85rem; }
  .lisiere-sentier{ position:relative; margin:1.1rem .5rem 2.4rem; height:1.6rem; }
  .lisiere-repere{ position:absolute; left:0; top:-1.5rem; display:flex; flex-direction:column; align-items:center; font-size:1.3rem; }
  .lisiere-repere-nom{ font-size:.65rem; font-weight:700; opacity:.75; }
  .lisiere-piste{ position:relative; margin-left:2.6rem; height:100%; border-bottom:3px dashed color-mix(in srgb, var(--couleur-encre) 25%, white); }
  .lisiere-point{ position:absolute; bottom:-.2rem; min-width:44px; display:flex; flex-direction:column; align-items:center; gap:.15rem; }

  /* ---- Palier CP : « Le Bois » — balade (ordonner 5 bâtons) ----
     Emplacements FIXES : glisser un bâton sur un autre échange leur place
     (aucune case ne reste jamais vide). Le DOM des 5 boutons ne bouge jamais
     pendant le geste, seule la valeur affichée (largeur de la barre) est
     échangée — cf. commentaire dans genererOrdonnerBatons (js). */
  .bande-batons{ display:flex; gap:.6rem; justify-content:center; align-items:flex-end; margin:1rem 0; flex-wrap:wrap; }
  .baton-case{ position:relative; display:flex; align-items:flex-end; justify-content:center; padding:.3rem; border-radius:12px; }
  .baton-case.case-selectionnee{ background:color-mix(in srgb, var(--couleur-soleil) 40%, transparent); }
  .baton-btn{ position:relative; border:none; background:transparent; padding:.2rem; min-height:44px; min-width:44px;
    display:flex; align-items:flex-end; touch-action:none; cursor:grab; }
  .baton-btn.baton-glisse{ z-index:5; cursor:grabbing; }
  .baton-barre{ display:block; height:16px; border-radius:8px; background:var(--couleur-corail); border:2px solid color-mix(in srgb, var(--couleur-corail) 60%, black 10%); }

  /* ---- Palier CP : « Le Bois » — cabane (règle à déplacer) ---- */
  .piste-alignement{ position:relative; margin:.9rem 0; overflow-x:hidden; border-radius:10px; min-height:90px;
    background:color-mix(in srgb, var(--couleur-mandarine) 8%, white); border:2px solid color-mix(in srgb, var(--couleur-encre) 12%, white); }
  .planche-fixe{ position:absolute; top:38px; height:16px; border-radius:4px; background:#B08968; border:2px solid color-mix(in srgb, #B08968 60%, black 15%); }
  .regle-graduee.regle-glissable{ position:absolute; top:8px; touch-action:none; cursor:grab; }

  /* ---- Périmètre : côtés à reporter au compas ---- */
  .bloc-polygone{ text-align:center; font-weight:700; margin-bottom:.3rem; }
  .rangee-cotes{ display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; margin:.4rem 0 .7rem; }
  .cote-rod{ min-height:44px; min-width:44px; border-radius:10px; border:2px solid color-mix(in srgb, var(--couleur-encre) 15%, white); background:#ffffff; display:flex; align-items:center; justify-content:center; padding:0 .5rem; }
  .cote-rod:disabled{ opacity:.3; }
  .rod-barre{ display:block; height:14px; border-radius:4px; }
  .ligne-report{ display:flex; align-items:center; min-height:30px; padding:.4rem; border-radius:10px;
    background:color-mix(in srgb, var(--couleur-fond) 100%, white); border:2px dashed color-mix(in srgb, var(--couleur-encre) 22%, white); margin-bottom:.8rem; }
  .segment-report{ display:block; height:16px; }
  .segment-report:first-child{ border-top-left-radius:8px; border-bottom-left-radius:8px; }
  .segment-report:last-child{ border-top-right-radius:8px; border-bottom-right-radius:8px; }

  /* ---- Saisies numériques (conversions, périmètre mesuré) ---- */
  .saisie-longueur{ display:block; margin:.9rem auto; width:6.5rem; min-height:2.8rem; border-radius:10px; border:2px solid var(--couleur-mandarine); text-align:center; font-family:inherit; font-size:1.1rem; }
  .saisie-decomposition{ display:flex; gap:.7rem; justify-content:center; margin:.9rem 0; flex-wrap:wrap; }
  .champ-decomposition{ display:flex; flex-direction:column; align-items:center; gap:.3rem; font-size:.82rem; font-weight:700; }
  .champ-decomposition input{ width:4.4rem; min-height:2.6rem; border-radius:10px; border:2px solid var(--couleur-mandarine); text-align:center; font-family:inherit; font-size:1.05rem; }

  /* confettis */
  #confettis-conteneur{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
  .confetti{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
    animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards; }
  @keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
  @media (prefers-reduced-motion:reduce){ .confetti{ display:none; animation:none; } }

  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="confettis-conteneur" aria-hidden="true"></div>

<main id="ecran-accueil">
  <div class="barre-accueil">
    <button type="button" class="bouton-menu" id="bouton-menu">← Menu</button>
  </div>
  <div class="entete-accueil">
    <h1>Longueurs 🌳</h1>
    <p id="sous-titre-accueil"></p>
  </div>
  <div class="rangee-paliers" id="rangee-paliers"></div>
  <p class="note-palier" id="note-palier"></p>
  <div class="grille-jeux" id="grille-jeux"></div>
  <div class="bloc-bonus" id="bloc-bonus" hidden>
    <h3 id="titre-bonus">Palier bonus 🎁</h3>
    <p class="note-palier" id="note-bonus"></p>
    <div class="grille-jeux" id="grille-bonus"></div>
  </div>
</main>

<main id="ecran-jeu" hidden>
  <div class="entete-jeu">
    <button class="bouton-retour" id="bouton-retour" aria-label="Retour à l'accueil">←</button>
    <div class="entete-jeu-titres">
      <h2 id="titre-jeu-courant"></h2>
      <div class="progression" id="progression-jeu"></div>
    </div>
  </div>
  <div id="zone-jeu"></div>
  <div class="feedback" id="zone-feedback" aria-live="polite"></div>
  <button class="bouton-suivant" id="bouton-suivant" hidden>Suivant →</button>
</main>

<div class="modale-fond" id="modale-menu" hidden>
  <div class="modale-boite" role="dialog" aria-modal="true" aria-labelledby="modale-menu-texte">
    <p id="modale-menu-texte">Revenir au menu principal ? Ta partie en cours sera perdue.</p>
    <div class="modale-boutons">
      <button type="button" class="bouton-secondaire" id="modale-menu-rester">Rester</button>
      <button type="button" class="bouton-principal" id="modale-menu-revenir">Revenir au menu</button>
    </div>
  </div>
</div>

<script type="application/json" id="donnees-jeu">
{
  "titre": "Longueurs",

        { "id": "comparer-longueurs-cp", "titre": "En balade", "icone": "🥾", "couleur": "mandarine", "description": "Compare des longueurs, puis range 5 bâtons.", "type": "balade-cp", "nbTours": 5 },
        { "id": "mesurer-longueurs-cp", "titre": "La cabane", "icone": "🛖", "couleur": "soleil", "description": "Estime des tailles, puis mesure avec la règle.", "type": "cabane-cp", "nbTours": 6, "capCm": 16 }
      ]
    },
    "CE1": {

        { "id": "mesurer-ce1", "titre": "La règle du garde forestier", "icone": "🧭", "couleur": "soleil", "description": "Mesure, convertis et estime des longueurs.", "type": "garde-forestier", "nbTours": 6, "capCm": 30 },
        { "id": "encadrer-ce1", "titre": "Entre deux graduations", "icone": "📍", "couleur": "corail", "description": "Trouve entre quels nombres se situe la longueur.", "type": "encadrer", "nbTours": 6, "capCm": 20 }
      ]
    },
    "CE2": {
      "miniJeux": [
        { "id": "conversions-ce2", "titre": "Le décimètre du bûcheron", "icone": "🪓", "couleur": "menthe", "description": "Convertis des longueurs de troncs et de sentiers.", "type": "conversions", "nbTours": 6 },
        { "id": "perimetre-ce2", "titre": "Le tour de la clairière", "icone": "📐", "couleur": "mandarine", "description": "Compare et mesure le tour de figures.", "type": "perimetre", "nbTours": 6 }

    }
