<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>Fractions CE2 – Mayeutik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --couleur-fond: #FFF8EF;
    --couleur-encre: #2B2B2B;
    --couleur-mandarine: #FF8C42;
    --couleur-menthe: #4ECDC4;
    --couleur-corail: #FF6B6B;
    --couleur-soleil: #FFD93D;
    color-scheme: light only;
  }

  @media (prefers-color-scheme: dark) {
    html { background-color: var(--couleur-fond); }
    body { background-color: var(--couleur-fond); color: var(--couleur-encre); }
    input, select, textarea, button {
      background-color: #FFFFFF;
      color: var(--couleur-encre);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--couleur-fond);
    color: var(--couleur-encre);
    overflow-x: hidden;
  }

  body {
    font-family: 'Fredoka', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 2rem;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  h1, h2, h3 { font-weight: 700; margin: 0 0 0.4rem; }

  /* ---------- Écran d'accueil ---------- */

  #ecran-accueil {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.2rem 1rem 2rem;
  }

  .entete-accueil {
    text-align: center;
    margin-bottom: 1.2rem;
  }

  .entete-accueil h1 {
    font-size: 1.7rem;
    color: var(--couleur-mandarine);
  }

  .entete-accueil p {
    margin: 0;
    font-size: 1rem;
    font-weight: 500;
    opacity: 0.85;
  }

  .grille-jeux {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem;
  }

  @media (max-width: 360px) {
    .grille-jeux { grid-template-columns: 1fr; }
  }

  .carte-jeu {
    --c: var(--couleur-mandarine);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    gap: 0.3rem;
    background: color-mix(in srgb, var(--c) 16%, white);
    border: 3px solid var(--c);
    border-radius: 20px;
    padding: 0.8rem 0.6rem;
    max-height: 34vh;
    min-height: 9.5rem;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 55%, black 6%);
  }

  .carte-jeu:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 55%, black 6%); }

  .carte-jeu.carte-menthe { --c: var(--couleur-menthe); }
  .carte-jeu.carte-corail { --c: var(--couleur-corail); }
  .carte-jeu.carte-soleil { --c: var(--couleur-soleil); }

  .carte-jeu .icone { font-size: 1.9rem; line-height: 1; }
  .carte-jeu h2 { font-size: 1.02rem; }
  .carte-jeu p {
    font-size: 0.78rem;
    font-weight: 400;
    margin: 0;
    opacity: 0.85;
  }

  .etoiles { display: inline-flex; gap: 2px; font-size: 1.1rem; letter-spacing: -1px; }
  .etoile { color: rgba(43,43,43,0.2); }
  .etoile.pleine { color: var(--couleur-soleil); text-shadow: 0 0 1px rgba(43,43,43,0.35); }

  /* ---------- Écran de jeu ---------- */

  #ecran-jeu { max-width: 640px; margin: 0 auto; padding: 0.8rem 1rem 2.5rem; }

  .entete-jeu {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
  }

  .bouton-retour {
    flex: 0 0 auto;
    min-height: 44px;
    min-width: 44px;
    border-radius: 14px;
    border: none;
    background: var(--couleur-encre);
    color: var(--couleur-fond);
    font-size: 1.2rem;
    font-weight: 600;
    padding: 0 0.9rem;
  }

  .entete-jeu-titres { flex: 1; min-width: 0; }
  .entete-jeu-titres h2 { font-size: 1.15rem; color: var(--couleur-mandarine); }
  .entete-jeu-titres .progression { font-size: 0.85rem; font-weight: 500; opacity: 0.75; }

  #zone-jeu {
    background: #ffffff;
    border-radius: 20px;
    border: 3px solid color-mix(in srgb, var(--couleur-encre) 12%, white);
    padding: 1.1rem 0.9rem;
    min-height: 40vh;
  }

  .consigne {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 1rem;
  }

  .legende, .legende-petite {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 0.9rem;
  }

  .legende-petite { font-size: 0.8rem; margin-bottom: 0.4rem; }

  .bloc-representation-alt { margin-top: 1rem; text-align: center; }

  /* Formes de représentation */

  .forme-principale, .forme-secondaire { margin: 0 auto; }

  .forme-bande {
    display: flex;
    width: 100%;
    max-width: 20rem;
    height: 2.4rem;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--couleur-encre);
    margin: 0 auto;
  }
  .segment-bande {
    flex: 1;
    border-right: 2px solid var(--couleur-encre);
    background: #ffffff;
  }
  .segment-bande:last-child { border-right: none; }
  .segment-bande.rempli { background: var(--couleur-mandarine); }

  .forme-disque {
    width: 7.5rem;
    height: 7.5rem;
    border-radius: 50%;
    border: 2px solid var(--couleur-encre);
    margin: 0 auto;
  }

  .forme-quadrillage {
    display: grid;
    gap: 3px;
    width: 9.5rem;
    height: 6.4rem;
    margin: 0 auto;
    border: 2px solid var(--couleur-encre);
    padding: 3px;
    border-radius: 10px;
  }
  .cellule-quadrillage { background: #ffffff; border: 1px solid var(--couleur-encre); border-radius: 3px; }
  .cellule-quadrillage.rempli { background: var(--couleur-mandarine); }

  /* Fraction affichée n/d */

  .fraction-affichage {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    font-weight: 600;
    line-height: 1.1;
    font-size: 1.15rem;
  }
  .fraction-affichage .fr-barre {
    width: 1.5em;
    height: 2px;
    background: currentColor;
    margin: 2px 0;
  }
  .fraction-affichage.grande { font-size: 1.6rem; }

  /* Options QCM */

  .grille-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.6rem;
    margin-top: 0.5rem;
  }

  .bouton-option {
    min-height: 3.4rem;
    border-radius: 16px;
    border: 2.5px solid var(--couleur-encre);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.4rem;
  }
  .bouton-option:disabled { opacity: 0.6; }
  .bouton-option.correct { background: color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color: var(--couleur-menthe); }
  .bouton-option.incorrect { background: color-mix(in srgb, var(--couleur-corail) 35%, white); border-color: var(--couleur-corail); }

  /* Droite graduée */

  /* La droite ne défile JAMAIS horizontalement : un enfant qui doit faire
     glisser la page pour voir « 1 » perd le sens même de la droite graduée
     (voir d'un coup d'œil où se situe la fraction entre 0 et 1). Elle tient
     donc toujours dans la largeur disponible ; c'est la TAILLE des repères qui
     s'adapte au dénominateur, pas la longueur de la droite. */
  .droite-scroll {
    width: 100%;
    overflow: visible;
  }
  .droite-graduee {
    position: relative;
    height: 6rem;
    width: 100%;
    margin: 1.8rem 0 1rem;
    /* Marge interne réservée pour que les graduations, les labels et la moitié
       du repère des extrémités (0 et 1) ne débordent jamais du cadre. Valeur
       par défaut ; le JS la resserre quand les repères sont petits, pour rendre
       la largeur gagnée aux cibles tactiles. */
    padding: 0 1.8rem;
    box-sizing: border-box;
  }
  .piste-graduation {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .ligne-droite {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 4px;
    background: var(--couleur-encre);
    border-radius: 2px;
  }
  .graduation {
    position: absolute;
    top: calc(50% - 11px);
    width: 2px;
    height: 22px;
    background: var(--couleur-encre);
    transform: translateX(-1px);
  }
  .graduation-label {
    position: absolute;
    top: calc(50% + 16px);
    transform: translateX(-50%);
    font-size: 0.85rem;
    font-weight: 600;
  }
  .marqueur-droite {
    position: absolute;
    top: calc(50% - 40px);
    transform: translateX(-50%);
    font-size: 1.5rem;
    color: var(--couleur-mandarine);
  }
  /* Chaque repère est une BANDE tactile pleine hauteur, large d'un intervalle
     (largeur posée en ligne par le JS) : les bandes sont jointives, donc un
     appui approximatif tombe toujours sur le repère le plus proche — pas de
     zone morte entre deux cibles, même avec un dénominateur 12. La pastille
     visible, elle, se contente de la place disponible. */
  .tick-interactive {
    position: absolute;
    top: calc(50% - 27px);
    transform: translateX(-50%);
    height: 54px;
    max-width: 3.4rem;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .tick-pastille {
    width: 100%;
    max-width: 2.7rem;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2.5px solid var(--couleur-encre);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .tick-interactive.correct .tick-pastille { background: color-mix(in srgb, var(--couleur-menthe) 45%, white); border-color: var(--couleur-menthe); }
  .tick-interactive.incorrect .tick-pastille { background: color-mix(in srgb, var(--couleur-corail) 35%, white); border-color: var(--couleur-corail); }

  /* Fractions égales : cartes de comparaison */

  .carte-fraction-visuelle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
  }
  /* Largeur fixe (non pourcentage) pour éviter un effondrement de taille
     quand la carte est elle-même un enfant flex centré sans largeur définie. */
  .bouton-option .forme-bande { width: 6.5rem; height: 1.6rem; }

  /* Comparer : cartes + slots */

  .rangee-cartes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem;
    margin: 0.6rem 0 1.1rem;
  }

  .carte-comparaison {
    border: 2.5px solid var(--couleur-encre);
    border-radius: 16px;
    background: #ffffff;
    padding: 0.5rem 0.6rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    min-width: 5.6rem;
  }
  .carte-comparaison.selectionnee { opacity: 0.4; }
  .carte-comparaison .forme-bande { width: 5rem; height: 1.4rem; }

  .rangee-slots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
    flex-wrap: wrap;
  }
  .slot-ordre {
    min-width: 3.4rem;
    min-height: 3.4rem;
    border: 2.5px dashed var(--couleur-encre);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    background: color-mix(in srgb, var(--couleur-soleil) 12%, white);
  }
  .slot-ordre.rempli { border-style: solid; background: color-mix(in srgb, var(--couleur-soleil) 30%, white); }
  /* Étiquette posée dans une case : elle reste MOBILE (glisser vers une autre
     case pour échanger, appuyer pour la reprendre) tant que le rangement n'est
     pas validé. */
  .etiquette-ordre {
    display: flex; align-items: center; justify-content: center;
    min-width: 2.8rem; min-height: 2.8rem; padding: 0 .2rem;
    border-radius: 10px; background: #ffffff;
    border: 2px solid color-mix(in srgb, var(--couleur-encre) 30%, white);
    cursor: grab; user-select: none;
  }
  .etiquette-ordre.etiquette-glisse { z-index: 5; cursor: grabbing; box-shadow: 0 6px 14px rgba(0,0,0,.18); }
  .slot-ordre.correct .etiquette-ordre { border-color: var(--couleur-menthe); }
  .slot-ordre.incorrect .etiquette-ordre { border-color: var(--couleur-corail); }
  .slot-ordre.correct { border-color: var(--couleur-menthe); background: color-mix(in srgb, var(--couleur-menthe) 40%, white); }
  .slot-ordre.incorrect { border-color: var(--couleur-corail); background: color-mix(in srgb, var(--couleur-corail) 30%, white); }
  .fleche-ordre { font-size: 1.1rem; opacity: 0.6; }

  .bouton-secondaire {
    display: block;
    margin: 0 auto;
    min-height: 44px;
    border-radius: 14px;
    border: 2.5px solid var(--couleur-encre);
    background: #ffffff;
    padding: 0 1.1rem;
    font-weight: 500;
  }

  /* Retour à la coquille (CHARTE §7) : bouton discret + confirmation */
  .barre-accueil{ display:flex; margin-bottom:.6rem; }
  .bouton-menu{
    min-height:44px; border-radius:14px; padding:0 .9rem;
    border:2px solid color-mix(in srgb, var(--couleur-encre) 25%, white);
    background:#ffffff; color:var(--couleur-encre); font-weight:600; font-size:.95rem;
    display:inline-flex; align-items:center; gap:.35rem;
  }
  .bouton-menu:active{ transform:translateY(2px); }
  .modale-fond{
    position:fixed; inset:0; z-index:1000; padding:1.2rem;
    background:color-mix(in srgb, var(--couleur-encre) 55%, transparent);
    display:flex; align-items:center; justify-content:center;
  }
  .modale-boite{
    background:#ffffff; border-radius:20px; padding:1.4rem 1.2rem; max-width:20rem; width:100%;
    text-align:center; box-shadow:0 12px 34px rgba(43,43,43,.28);
  }
  .modale-boite p{ font-size:1.05rem; font-weight:600; margin:0 0 1.1rem; }
  .modale-boutons{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .modale-boutons .bouton-principal, .modale-boutons .bouton-secondaire{ margin:0; }

  /* Calculer */

  .bloc-calcul-consigne {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .symbole-calcul { font-size: 1.4rem; font-weight: 700; color: var(--couleur-mandarine); }

  .apercu-calcul {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .apercu-fraction { text-align: center; }
  .apercu-fraction .forme-bande { width: 8.5rem; height: 1.7rem; }
  .apercu-fraction .legende-petite { margin-top: 0.3rem; margin-bottom: 0; }
  .apercu-fraction.op-a .segment-bande.rempli { background: var(--couleur-mandarine); }
  .apercu-fraction.op-b .segment-bande.rempli { background: var(--couleur-menthe); }

  .forme-bande-interactive {
    display: flex;
    width: 100%;
    max-width: 22rem;
    height: 2.6rem;
    border-radius: 10px;
    overflow: hidden;
    border: 2.5px solid var(--couleur-encre);
    margin: 0.6rem auto 1rem;
  }
  .cellule-interactive {
    flex: 1;
    border-right: 2px solid var(--couleur-encre);
    background: #ffffff;
    padding: 0;
  }
  .cellule-interactive:last-child { border-right: none; }
  /* Le zoom au double-tap est un parasite ici : deux appuis rapprochés sur une
     même case sont un geste NORMAL du jeu (remplir puis vider). */
  button, .cellule-interactive, .tick-interactive, .carte-comparaison,
  .slot-ordre, .etiquette-ordre { touch-action: manipulation; }
  .cellule-interactive.rempli { background: var(--couleur-soleil); }
  .forme-bande-interactive.verrouille-correct .cellule-interactive.rempli { background: var(--couleur-menthe); }
  .forme-bande-interactive.verrouille-correct { border-color: var(--couleur-menthe); }
  .forme-bande-interactive.verrouille-incorrect .cellule-interactive.rempli { background: var(--couleur-corail); }
  .forme-bande-interactive.verrouille-incorrect { border-color: var(--couleur-corail); }
  /* Correction GRAPHIQUE du mini-jeu « Calculer » : même gabarit que la bande
     manipulée juste au-dessus, remplie en vert (couleur de la bonne réponse). */
  .bande-correction { margin: .4rem auto 0; max-width: 22rem; }
  .bande-correction .forme-bande {
    width: 100%; height: 2.6rem; border-radius: 10px; overflow: hidden;
    border: 2.5px solid var(--couleur-menthe);
  }
  .bande-correction .segment-bande.rempli { background: var(--couleur-menthe); }
  .bande-correction .legende-petite { margin: 0 0 .25rem; font-weight: 700; }

  /* Correction affichée après une MAUVAISE réponse (CHARTE §18) : la réponse
     donnée en rouge, la bonne en vert. Mêmes teintes que .feedback-succes /
     .feedback-erreur, assombries pour rester lisibles sur blanc. */
  .bloc-correction{ text-align:center; font-weight:700; font-size:.98rem; margin:.7rem 0 .2rem; }
  .correction-donnee{ color:color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }
  .correction-attendue{ color:color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }

  /* Feedback + navigation */

  .feedback {
    text-align: center;
    font-weight: 600;
    font-size: 1.05rem;
    min-height: 1.6rem;
    margin: 0.8rem 0 0.2rem;
  }
  .feedback-succes { color: color-mix(in srgb, var(--couleur-menthe) 70%, black 20%); }
  .feedback-erreur { color: color-mix(in srgb, var(--couleur-corail) 70%, black 20%); }

  .bouton-suivant {
    display: block;
    margin: 0.6rem auto 0;
    min-height: 44px;
    border-radius: 14px;
    border: none;
    background: var(--couleur-mandarine);
    color: #ffffff;
    font-weight: 600;
    font-size: 1rem;
    padding: 0 1.4rem;
  }

  /* Résultats */

  .bloc-resultats { text-align: center; }
  .bloc-resultats .etoiles { font-size: 2.6rem; margin: 0.6rem 0; }
  .bloc-resultats .score-texte { font-size: 1.1rem; font-weight: 500; margin-bottom: 1rem; }
  .boutons-resultats { display: flex; justify-content: center; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.6rem; }
  .bouton-principal {
    min-height: 44px;
    border-radius: 14px;
    border: none;
    background: var(--couleur-mandarine);
    color: #ffffff;
    font-weight: 600;
    padding: 0 1.2rem;
  }

  /* Confettis */

  #confettis-conteneur {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }
  .confetti {
    position: absolute;
    top: -12px;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    animation-name: chute-confetti;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes chute-confetti {
    to { transform: translateY(105vh) rotate(340deg); opacity: 0.75; }
  }

  /* Filet de sécurité CSS : même si lancerConfettis() était appelée malgré
     tout, aucune particule ne s'affiche ni ne s'anime avec le mouvement réduit. */
  @media (prefers-reduced-motion: reduce) {
    .confetti { display: none; animation: none; }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="confettis-conteneur" aria-hidden="true"></div>

<!-- ---------- Écran d'accueil ---------- -->
<main id="ecran-accueil">
  <div class="barre-accueil">
    <button type="button" class="bouton-menu" id="bouton-menu">← Menu</button>
  </div>
  <div class="entete-accueil">
    <h1>Fractions CE2</h1>
    <p id="sous-titre-accueil"></p>
  </div>
  <div class="grille-jeux" id="grille-jeux"></div>
</main>

<!-- ---------- Écran de jeu ---------- -->
<main id="ecran-jeu" hidden>
  <div class="entete-jeu">
    <button class="bouton-retour" id="bouton-retour" aria-label="Retour à l'accueil">←</button>
    <div class="entete-jeu-titres">
      <h2 id="titre-jeu-courant"></h2>
      <div class="progression" id="progression-jeu"></div>
    </div>
  </div>
  <div id="zone-jeu"></div>
  <div class="feedback" id="zone-feedback" aria-live="polite"></div>
  <button class="bouton-suivant" id="bouton-suivant" hidden>Suivant →</button>
</main>

<div class="modale-fond" id="modale-menu" hidden>
  <div class="modale-boite" role="dialog" aria-modal="true" aria-labelledby="modale-menu-texte">
    <p id="modale-menu-texte">Revenir au menu principal ? Ta partie en cours sera perdue.</p>
    <div class="modale-boutons">
      <button type="button" class="bouton-secondaire" id="modale-menu-rester">Rester</button>
      <button type="button" class="bouton-principal" id="modale-menu-revenir">Revenir au menu</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const donnees = JSON.parse(document.getElementById('donnees-jeu').textContent);
  const D = donnees.denominateursAutorises;
  const CLE_STOCKAGE = 'mayeutik-fractions-ce2-etoiles';

  /* ---------- Utilitaires génériques ---------- */

  function nombreAleatoire(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }
  function choisir(tableau) {
    return tableau[Math.floor(Math.random() * tableau.length)];
  }
  function melanger(tableau) {
    for (let i = tableau.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tableau[i], tableau[j]] = [tableau[j], tableau[i]];
    }
    return tableau;
  }
  function memeValeur(n1, d1, n2, d2) {
    return n1 * d2 === n2 * d1;
  }

  /* ---------- Étoiles : stockage sûr (mémoire + localStorage best-effort) ---------- */

  // La variable en mémoire est toujours la source de vérité pour la session
  // en cours. localStorage n'est qu'une tentative de persistance en plus :
  // il est absent/bloqué dans certains environnements (Safari en navigation
  // privée, artefacts Claude en iframe sandboxée, etc.), et y accéder peut
  // lever une exception rien qu'en le lisant — jamais en dehors d'un try/catch.
  let memoireEtoiles = null;

  function lireEtoiles() {
    if (memoireEtoiles === null) {
      memoireEtoiles = {};
      try {
        const brut = window.localStorage.getItem(CLE_STOCKAGE);
        if (brut) memoireEtoiles = JSON.parse(brut);
      } catch (e) {
        memoireEtoiles = {};
      }
    }
    return memoireEtoiles;
  }
  function enregistrerEtoiles(jeuId, valeur) {
    const tout = lireEtoiles();
    tout[jeuId] = Math.max(tout[jeuId] || 0, valeur);
    memoireEtoiles = tout;
    try {
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(tout));
    } catch (e) {
      // localStorage indisponible : les étoiles restent valables pour la session en cours.
    }
  }
  function creerEtoiles(valeur, max) {
    max = max || 3;
    const cont = document.createElement('span');
    cont.className = 'etoiles';
    for (let i = 1; i <= max; i++) {
      const s = document.createElement('span');
      s.className = 'etoile' + (i <= valeur ? ' pleine' : '');
      s.textContent = '★';
      cont.appendChild(s);
    }
    return cont;
  }
  function calculerEtoiles(score, total) {
    const pct = score / total;
    if (pct >= 1) return 3;
    if (pct >= 0.66) return 2;
    if (pct >= 0.33) return 1;
    return 0;
  }

  /* ---------- Sessions : contrat de données v1 (CHARTE.md, section 11) ---------- */
  // Implémentation de référence du contrat de données v1

  const CLE_SESSIONS = 'mayeutik-sessions';
  const CLE_PROFIL_ACTIF = 'mayeutik-profil-actif';
  const MODULE_ID = 'M17';
  const MAX_SESSIONS_PAR_PROFIL = 500;

  // Même pattern « stockage sûr » que les étoiles : mémoire = source de
  // vérité, localStorage en best-effort via try/catch, jamais de plantage.
  let memoireProfilActif = null;
  let memoireSessions = null;

  function lireProfilActif() {
    if (memoireProfilActif === null) {
      memoireProfilActif = 'p1';
      try {
        const brut = window.localStorage.getItem(CLE_PROFIL_ACTIF);
        if (brut) memoireProfilActif = brut;
      } catch (e) {
        memoireProfilActif = 'p1';
      }
    }
    return memoireProfilActif;
  }

  function lireSessions() {
    if (memoireSessions === null) {
      memoireSessions = [];
      try {
        const brut = window.localStorage.getItem(CLE_SESSIONS);
        if (brut) memoireSessions = JSON.parse(brut);
      } catch (e) {
        memoireSessions = [];
      }
    }
    return memoireSessions;
  }

  // Écrit une session brute à la fin d'un mini-jeu TERMINÉ (jamais pour une
  // partie abandonnée). `competence` = id du mini-jeu (granularité fine).
  // Aucune intelligence ici (pas de statut, pas de recommandation) : c'est le
  // rôle de la coquille, jamais des jeux, conformément au contrat v1.
  function enregistrerSession(competence, score, total, duree) {
    const profilId = lireProfilActif();
    const toutes = lireSessions();
    toutes.push({
      profilId,
      module: MODULE_ID,
      competence,
      score,
      total,
      date: new Date().toISOString(),
      duree
    });

    // Plafond : au maximum les 500 dernières sessions par profil. On parcourt
    // à l'envers (du plus récent au plus ancien) et on supprime les sessions
    // de CE profil qui dépassent le plafond ; les autres profils ne sont
    // jamais comptés ni touchés.
    let compteur = 0;
    for (let i = toutes.length - 1; i >= 0; i--) {
      if (toutes[i].profilId === profilId) {
        compteur++;
        if (compteur > MAX_SESSIONS_PAR_PROFIL) {
          toutes.splice(i, 1);
        }
      }
    }

    memoireSessions = toutes;
    try {
      window.localStorage.setItem(CLE_SESSIONS, JSON.stringify(toutes));
    } catch (e) {
      // localStorage indisponible : la session reste valable pour la session en cours.
    }
  }

  /* ---------- Confettis ---------- */

  function lancerConfettis() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const conteneur = document.getElementById('confettis-conteneur');
    const couleurs = [
      'var(--couleur-mandarine)', 'var(--couleur-menthe)',
      'var(--couleur-corail)', 'var(--couleur-soleil)'
    ];
    const total = 36;
    for (let i = 0; i < total; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.backgroundColor = couleurs[Math.floor(Math.random() * couleurs.length)];
      p.style.animationDuration = (0.9 + Math.random() * 0.9) + 's';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      p.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      conteneur.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
      setTimeout(() => p.remove(), 2500);
    }
  }

  /* ---------- Feedback sonore (Web Audio) ---------- */

  let contexteAudio = null;
  function obtenirContexteAudio() {
    if (!contexteAudio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      contexteAudio = new Ctx();
    }
    if (contexteAudio.state === 'suspended') contexteAudio.resume();
    return contexteAudio;
  }
  /* ---------- Composant sonore partagé (CHARTE §5) ----------
     Mêmes sons dans toute la série, générés à l'oscillateur : aucun fichier
     audio, donc aucune dépendance réseau. */

  /* Une note pure, avec une attaque douce et une extinction exponentielle —
     un créneau brutal « claquerait » sur les petits haut-parleurs. */
  function jouerNote(ctx, freq, debut, duree, volume, forme) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = forme || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, debut);
    gain.gain.exponentialRampToValueAtTime(volume, debut + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
    osc.connect(gain).connect(ctx.destination);
    osc.start(debut);
    osc.stop(debut + duree + 0.02);
  }

  /* SON DE RÉFÉRENCE de la bonne réponse : arpège de do majeur, quatre notes
     brèves qui montent (~0.45 s). Court et enjoué, il accompagne les confettis
     sans les retarder. */
  const NOTES_BONNE_REPONSE = [523.25, 659.25, 783.99, 1046.5]; // do5 mi5 sol5 do6

  function sonBonneReponse() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    NOTES_BONNE_REPONSE.forEach((f, i) => jouerNote(ctx, f, t0 + i * 0.11, 0.11, 0.22));
  }

  /* FIN DE NIVEAU PARFAITE (3 étoiles) : même famille sonore, pour qu'on la
     reconnaisse, mais nettement plus ample — l'arpège monte deux notes plus
     haut, puis se pose sur un accord tenu (~1.4 s en tout). C'est la durée et
     l'accord final, plus que la hauteur, qui le rendent perceptiblement plus
     marquant que la bonne réponse ponctuelle. */
  const NOTES_NIVEAU_PARFAIT = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98];
  const ACCORD_NIVEAU_PARFAIT = [523.25, 659.25, 783.99, 1046.5]; // do majeur tenu

  function sonNiveauParfait() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    const pas = 0.1;
    NOTES_NIVEAU_PARFAIT.forEach((f, i) => jouerNote(ctx, f, t0 + i * pas, 0.12, 0.2));
    // Accord final, plus doux que les notes de l'arpège pour ne pas saturer :
    // quatre voix simultanées s'additionnent.
    const tAccord = t0 + NOTES_NIVEAU_PARFAIT.length * pas + 0.04;
    ACCORD_NIVEAU_PARFAIT.forEach((f) => jouerNote(ctx, f, tAccord, 0.75, 0.12, 'triangle'));
  }

  function sonErreur() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    const t0 = ctx.currentTime;
    [392.0, 293.66].forEach((f, i) => jouerNote(ctx, f, t0 + i * 0.17, 0.17, 0.22));
  }

  /* Clic discret de manipulation (pose d'un jeton, d'un lien...). */
  function sonTic() {
    let ctx;
    try { ctx = obtenirContexteAudio(); } catch (e) { return; }
    jouerNote(ctx, 880, ctx.currentTime, 0.08, 0.12);
  }

  /* Aiguillage historique conservé : les modules appellent jouerSon('bravo'),
     ('rate'), ('tic') en de nombreux endroits. */
  function jouerSon(type) {
    if (type === 'bravo') return sonBonneReponse();
    if (type === 'parfait') return sonNiveauParfait();
    if (type === 'tic') return sonTic();
    return sonErreur();
  }

  /* ---------- Représentations visuelles de fractions ---------- */

  function creerBande(denom, numRempli) {
    const cont = document.createElement('div');
    cont.className = 'forme-bande';
    for (let i = 0; i < denom; i++) {
      const seg = document.createElement('div');
      seg.className = 'segment-bande' + (i < numRempli ? ' rempli' : '');
      cont.appendChild(seg);
    }
    return cont;
  }

  function degradeConique(denom, numRempli) {
    const gap = Math.min(2.2, (360 / denom) * 0.08);
    let angle = 0;
    const seg = 360 / denom;
    const parts = [];
    for (let i = 0; i < denom; i++) {
      const couleur = i < numRempli ? 'var(--couleur-mandarine)' : '#ffffff';
      parts.push(couleur + ' ' + angle + 'deg ' + (angle + seg - gap) + 'deg');
      parts.push('var(--couleur-encre) ' + (angle + seg - gap) + 'deg ' + (angle + seg) + 'deg');
      angle += seg;
    }
    return 'conic-gradient(' + parts.join(',') + ')';
  }
  function creerDisque(denom, numRempli) {
    const cont = document.createElement('div');
    cont.className = 'forme-disque';
    cont.style.background = degradeConique(denom, numRempli);
    return cont;
  }

  function creerQuadrillage(denom, numRempli) {
    // Grille la plus carrée possible (distincte visuellement d'une bande), y compris pour les dénominateurs premiers.
    const colonnes = Math.ceil(Math.sqrt(denom));
    const lignes = Math.ceil(denom / colonnes);
    const cont = document.createElement('div');
    cont.className = 'forme-quadrillage';
    cont.style.gridTemplateColumns = 'repeat(' + colonnes + ',1fr)';
    cont.style.gridTemplateRows = 'repeat(' + lignes + ',1fr)';
    for (let i = 0; i < denom; i++) {
      const cell = document.createElement('div');
      cell.className = 'cellule-quadrillage' + (i < numRempli ? ' rempli' : '');
      cont.appendChild(cell);
    }
    return cont;
  }

  function creerForme(type, denom, numRempli) {
    if (type === 'disque') return creerDisque(denom, numRempli);
    if (type === 'quadrillage') return creerQuadrillage(denom, numRempli);
    return creerBande(denom, numRempli);
  }

  function creerFractionLabel(n, d, grande) {
    const el = document.createElement('span');
    el.className = 'fraction-affichage' + (grande ? ' grande' : '');
    const num = document.createElement('span');
    num.textContent = n;
    const barre = document.createElement('span');
    barre.className = 'fr-barre';
    const den = document.createElement('span');
    den.textContent = d;
    el.appendChild(num);
    el.appendChild(barre);
    el.appendChild(den);
    return el;
  }

  /* ---------- Génération de distracteurs pour les QCM ---------- */

  function genererOptions(nCorrect, dCorrect) {
    const options = [{ n: nCorrect, d: dCorrect }];
    const candidats = [];
    [-2, -1, 1, 2].forEach((delta) => {
      const n2 = nCorrect + delta;
      if (n2 >= 1 && n2 < dCorrect) candidats.push({ n: n2, d: dCorrect });
    });
    [-2, -1, 1, 2].forEach((delta) => {
      const d2 = dCorrect + delta;
      if (d2 >= 2 && nCorrect < d2) candidats.push({ n: nCorrect, d: d2 });
    });
    if (nCorrect >= 1 && dCorrect - nCorrect >= 1) {
      candidats.push({ n: dCorrect - nCorrect, d: dCorrect });
    }
    if (nCorrect !== dCorrect && nCorrect >= 1) {
      candidats.push({ n: dCorrect, d: nCorrect });
    }
    const uniques = [];
    candidats.forEach((c) => {
      if (c.n < 1 || c.d < 2) return;
      if (memeValeur(c.n, c.d, nCorrect, dCorrect)) return;
      if (uniques.some((u) => memeValeur(u.n, u.d, c.n, c.d))) return;
      uniques.push(c);
    });
    melanger(uniques);
    options.push(...uniques.slice(0, 3));
    let garde = 0;
    while (options.length < 4 && garde < 100) {
      garde++;
      const d2 = choisir(D);
      const n2 = nombreAleatoire(1, d2 - 1);
      if (!options.some((o) => memeValeur(o.n, o.d, n2, d2))) {
        options.push({ n: n2, d: d2 });
      }
    }
    return melanger(options);
  }

  /* ---------- État global ---------- */

  let etat = { jeuId: null, index: 0, score: 0, verrouille: false, demarreLe: 0 };

  const configJeux = donnees.jeux;

  /* ---------- Écran d'accueil ---------- */

  /* Remonte en haut à chaque changement d'écran (CHARTE §17) : sans cela, le
     nouvel écran hérite du défilement de l'écran précédent — l'enfant qui
     vient de valider en bas de page se retrouverait au milieu de la manche
     suivante. Repositionnement instantané (jamais « smooth » : un glissement
     animé pendant une transition est parasite). */
  function remonterEnHaut() {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) {
      window.scrollTo(0, 0); // navigateurs sans l'API à options
    }
  }

  /* Correction après une MAUVAISE réponse (CHARTE §18) : ce que l'enfant a
     répondu en rouge, ce qu'il fallait répondre en vert. N'est jamais appelée
     sur une bonne réponse (elle brouillerait la récompense). */
  function afficherCorrection(zone, donnee, attendue) {
    const bloc = document.createElement('p');
    bloc.className = 'bloc-correction';
    if (donnee !== null && donnee !== undefined && donnee !== '') {
      const d = document.createElement('span');
      d.className = 'correction-donnee';
      d.textContent = 'Ta réponse : ' + donnee;
      bloc.appendChild(d);
      bloc.appendChild(document.createTextNode(' — '));
    }
    const a = document.createElement('span');
    a.className = 'correction-attendue';
    a.textContent = 'La bonne réponse : ' + attendue;
    bloc.appendChild(a);
    zone.appendChild(bloc);
    return bloc;
  }

  function construireAccueil() {
    document.getElementById('sous-titre-accueil').textContent = donnees.sousTitre;
    const grille = document.getElementById('grille-jeux');
    grille.innerHTML = '';
    configJeux.forEach((cfg) => {
      const carte = document.createElement('button');
      carte.className = 'carte-jeu carte-' + cfg.couleur;
      carte.dataset.jeu = cfg.id;

      const icone = document.createElement('div');
      icone.className = 'icone';
      icone.textContent = cfg.icone;

      const titre = document.createElement('h2');
      titre.textContent = cfg.titre;

      const desc = document.createElement('p');
      desc.textContent = cfg.description;

      const tout = lireEtoiles();
      const etoiles = creerEtoiles(tout[cfg.id] || 0);

      carte.appendChild(icone);
      carte.appendChild(titre);
      carte.appendChild(desc);
      carte.appendChild(etoiles);
      carte.addEventListener('click', () => demarrerJeu(cfg.id));
      grille.appendChild(carte);
    });
  }

  function retourAccueil() {
    document.getElementById('ecran-jeu').hidden = true;
    document.getElementById('ecran-accueil').hidden = false;
    construireAccueil();
    remonterEnHaut();
  }

  /* ---------- Contrôleur de jeu ---------- */

  function trouverConfig(jeuId) {
    return configJeux.find((j) => j.id === jeuId);
  }

  function demarrerJeu(jeuId) {
    etat = { jeuId, index: 0, score: 0, verrouille: false, demarreLe: Date.now() };
    document.getElementById('ecran-accueil').hidden = true;
    document.getElementById('ecran-jeu').hidden = false;
    document.getElementById('titre-jeu-courant').textContent = trouverConfig(jeuId).titre;
    questionSuivante();
    remonterEnHaut();
  }

  function majProgression() {
    const cfg = trouverConfig(etat.jeuId);
    document.getElementById('progression-jeu').textContent =
      'Question ' + etat.index + ' / ' + cfg.nbQuestions;
  }

  function questionSuivante() {
    const cfg = trouverConfig(etat.jeuId);
    if (etat.index >= cfg.nbQuestions) {
      afficherResultats(cfg);
      return;
    }
    etat.index++;
    etat.verrouille = false;
    majProgression();
    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    document.getElementById('zone-feedback').textContent = '';
    document.getElementById('zone-feedback').className = 'feedback';
    document.getElementById('bouton-suivant').hidden = true;
    if (cfg.id === 'decouverte') genererDecouverte(zone, cfg);
    else if (cfg.id === 'droite') genererDroite(zone, cfg);
    else if (cfg.id === 'egales') genererEgales(zone, cfg);
    else if (cfg.id === 'comparer') genererComparer(zone, cfg);
    else if (cfg.niveauCalcul) genererCalculer(zone, cfg);
    remonterEnHaut();
  }

  function validerReponse(estCorrecte) {
    if (etat.verrouille) return;
    etat.verrouille = true;
    const zoneFeedback = document.getElementById('zone-feedback');
    if (estCorrecte) {
      etat.score++;
      zoneFeedback.textContent = choisir(donnees.messagesFeedback.bravo);
      zoneFeedback.className = 'feedback feedback-succes';
      lancerConfettis();
      jouerSon('bravo');
    } else {
      zoneFeedback.textContent = choisir(donnees.messagesFeedback.rate);
      zoneFeedback.className = 'feedback feedback-erreur';
      jouerSon('rate');
    }
    document.getElementById('bouton-suivant').hidden = false;
  }

  function afficherResultats(cfg) {
    document.getElementById('progression-jeu').textContent = 'Résultats';
    document.getElementById('bouton-suivant').hidden = true;
    document.getElementById('zone-feedback').textContent = '';
    const etoilesGagnees = calculerEtoiles(etat.score, cfg.nbQuestions);
    enregistrerEtoiles(cfg.id, etoilesGagnees);
    const dureeSecondes = Math.max(0, Math.round((Date.now() - etat.demarreLe) / 1000));
    enregistrerSession(cfg.id, etat.score, cfg.nbQuestions, dureeSecondes);
    // Résultat parfait : un son plus ample que celui d'une bonne réponse
    // ponctuelle, pour souligner ce qui est rare (CHARTE §5).
    if (etoilesGagnees === 3) sonNiveauParfait();

    const zone = document.getElementById('zone-jeu');
    zone.innerHTML = '';
    const bloc = document.createElement('div');
    bloc.className = 'bloc-resultats';

    const titre = document.createElement('h3');
    titre.textContent = 'Fin du jeu !';

    const score = document.createElement('p');
    score.className = 'score-texte';
    score.textContent = etat.score + ' / ' + cfg.nbQuestions + ' bonnes réponses';

    const etoiles = creerEtoiles(etoilesGagnees);

    const boutons = document.createElement('div');
    boutons.className = 'boutons-resultats';

    const rejouer = document.createElement('button');
    rejouer.className = 'bouton-principal';
    rejouer.textContent = 'Rejouer';
    rejouer.addEventListener('click', () => demarrerJeu(cfg.id));

    const accueilBtn = document.createElement('button');
    accueilBtn.className = 'bouton-secondaire';
    accueilBtn.textContent = "Retour à l'accueil";
    accueilBtn.addEventListener('click', retourAccueil);

    boutons.appendChild(rejouer);
    boutons.appendChild(accueilBtn);

    bloc.appendChild(titre);
    bloc.appendChild(etoiles);
    bloc.appendChild(score);
    bloc.appendChild(boutons);
    zone.appendChild(bloc);

    if (etoilesGagnees === 3) {
      lancerConfettis();
      jouerSon('bravo');
    }
    remonterEnHaut();
  }

  /* ---------- Mini-jeu 2 : Droite graduée ---------- */

  function creerDroiteGraduee(d, opts) {
    opts = opts || {};
    const scroll = document.createElement('div');
    scroll.className = 'droite-scroll';
    const cont = document.createElement('div');
    cont.className = 'droite-graduee';
    scroll.appendChild(cont);
    /* Les extrémités (0 et 1) ne débordent que de la MOITIÉ de leur repère :
       réserver 1.8rem de chaque côté quels que soient les repères gaspillerait
       de la largeur, et donc de la précision tactile, là où on en manque le
       plus (dénominateur 12 sur un petit écran). On ajuste donc la marge à ce
       dont les repères ont réellement besoin. */
    if (opts.interactif) {
      requestAnimationFrame(() => {
        if (!cont.isConnected) return;
        const style = getComputedStyle(cont);
        const margeParDefaut = parseFloat(style.paddingLeft) || 0; // 1.8rem, quelle que soit la taille de police
        const dispo = cont.clientWidth + 2 * margeParDefaut;       // largeur brute, marges comprises
        // C'est la BANDE tactile (plus large que la pastille, plafonnée à
        // 3.4rem par le CSS) qui déborde le plus aux extrémités : c'est donc
        // sa demi-largeur qui fixe la marge à réserver.
        const bandeMax = 3.4 * parseFloat(getComputedStyle(document.documentElement).fontSize);
        const bande = Math.min(bandeMax, dispo / d);
        const marge = Math.min(margeParDefaut, bande / 2 + 2);
        cont.style.paddingLeft = marge + 'px';
        cont.style.paddingRight = marge + 'px';
      });
    }
    // La piste interne (position:relative) devient le repère à 100% pour les
    // graduations : leurs positions en pourcentage restent donc bien à
    // l'intérieur de la marge réservée par .droite-graduee, et ne sont jamais
    // rognées par le défilement horizontal du conteneur.
    const piste = document.createElement('div');
    piste.className = 'piste-graduation';
    cont.appendChild(piste);
    const ligne = document.createElement('div');
    ligne.className = 'ligne-droite';
    piste.appendChild(ligne);

    for (let i = 0; i <= d; i++) {
      const pct = (i / d) * 100;
      if (opts.interactif) {
        const btn = document.createElement('button');
        btn.className = 'tick-interactive';
        btn.style.left = pct + '%';
        // Largeur = un intervalle : les bandes tactiles sont jointives et
        // couvrent toute la droite, sans jamais la faire déborder.
        btn.style.width = (100 / d) + '%';
        btn.dataset.index = i;
        const pastille = document.createElement('span');
        pastille.className = 'tick-pastille';
        pastille.textContent = i === 0 ? '0' : (i === d ? '1' : '');
        btn.appendChild(pastille);
        btn.addEventListener('click', () => opts.onTick(i, btn, piste));
        piste.appendChild(btn);
      } else {
        const g = document.createElement('div');
        g.className = 'graduation';
        g.style.left = pct + '%';
        piste.appendChild(g);
        if (i === 0 || i === d) {
          const lbl = document.createElement('div');
          lbl.className = 'graduation-label';
          lbl.style.left = pct + '%';
          lbl.textContent = i === 0 ? '0' : '1';
          piste.appendChild(lbl);
        }
      }
    }
    if (typeof opts.marqueur === 'number') {
      const m = document.createElement('div');
      m.className = 'marqueur-droite';
      m.style.left = (opts.marqueur / d) * 100 + '%';
      m.textContent = '▼';
      piste.appendChild(m);
    }
    return scroll;
  }

  function genererDroite(zone, cfg) {
    const d = choisir(D);
    const k = nombreAleatoire(1, d - 1);
    const modeLire = Math.random() < 0.5;

    const consigne = document.createElement('p');

    if (modeLire) {

        const estCorrecte = memeValeur(opt.n, opt.d, k, d);
        const btn = document.createElement('button');
        btn.className = 'bouton-option';
        btn.appendChild(creerFractionLabel(opt.n, opt.d));
        if (estCorrecte) boutonCorrect = btn;
        btn.addEventListener('click', () => {
          if (etat.verrouille) return;
          Array.from(optionsCont.children).forEach((b) => (b.disabled = true));
          btn.classList.add(estCorrecte ? 'correct' : 'incorrect');
          if (!estCorrecte && boutonCorrect) boutonCorrect.classList.add('correct');
          validerReponse(estCorrecte);
        });
        optionsCont.appendChild(btn);
      });
      zone.appendChild(optionsCont);
    } else {
      consigne.textContent = cfg.consignePlacer;
      zone.appendChild(consigne);

      const cible = document.createElement('div');
      cible.style.textAlign = 'center';
      cible.appendChild(creerFractionLabel(k, d, true));
      zone.appendChild(cible);

      const ligne = creerDroiteGraduee(d, {
        interactif: true,
        onTick: (i, btn, cont) => {
          if (etat.verrouille) return;
          const estCorrecte = i === k;
          Array.from(cont.querySelectorAll('.tick-interactive')).forEach((b) => (b.disabled = true));
          btn.classList.add(estCorrecte ? 'correct' : 'incorrect');
          if (!estCorrecte) {
            const bonTick = cont.querySelector('.tick-interactive[data-index="' + k + '"]');
            if (bonTick) bonTick.classList.add('correct');
          }
          validerReponse(estCorrecte);
        }
      });
      zone.appendChild(ligne);
    }
  }

  /* ---------- Mini-jeu 3 : Fractions égales ---------- */

  function trouverPaireEquivalente() {
    // L'espace de fractions de BASE valides est en réalité restreint (15
    // fractions distinctes possibles avec ce jeu de dénominateurs) : on garde
    // la trace des bases déjà affichées dans cette partie et on les rejette
    // — sinon la même fraction de base pourrait réapparaître avec juste une
    // équivalente différente, ce qui reste perçu comme la même question par
    // l'enfant (CHARTE §13, sans redondance tant que l'espace n'est pas épuisé).
    if (!etat.egalesVues) etat.egalesVues = [];
    for (let tentative = 0; tentative < 60; tentative++) {
      const d0 = choisir(D);
      const n0 = nombreAleatoire(1, d0 - 1);
      const cleBase = n0 + '/' + d0;
      if (etat.egalesVues.indexOf(cleBase) !== -1) continue;
      const multiples = D.filter((dd) => dd !== d0 && dd % d0 === 0).map((dd) => ({
        n: n0 * (dd / d0), d: dd
      }));
      if (multiples.length > 0) {
        etat.egalesVues.push(cleBase);
        return { base: { n: n0, d: d0 }, equivalente: choisir(multiples) };
      }
    }
    return { base: { n: 1, d: 2 }, equivalente: { n: 2, d: 4 } };
  }

  function genererEgales(zone, cfg) {
    const { base, equivalente } = trouverPaireEquivalente();

    const consigne = document.createElement('p');
    consigne.className = 'consigne';
    consigne.textContent = cfg.consigne;
    zone.appendChild(consigne);

    const cibleWrap = document.createElement('div');
    cibleWrap.className = 'carte-fraction-visuelle';
    cibleWrap.appendChild(creerBande(base.d, base.n));
    cibleWrap.appendChild(creerFractionLabel(base.n, base.d));
    zone.appendChild(cibleWrap);

    const optionsCont = document.createElement('div');
    optionsCont.className = 'grille-options';
    const options = genererOptions(equivalente.n, equivalente.d);
    let boutonCorrect = null;
    const resultatEgalite = document.createElement('p');
    resultatEgalite.className = 'legende';

    options.forEach((opt) => {
      const estCorrecte = memeValeur(opt.n, opt.d, equivalente.n, equivalente.d);
      const btn = document.createElement('button');
      btn.className = 'bouton-option';
      const contenu = document.createElement('div');
      contenu.className = 'carte-fraction-visuelle';
      contenu.appendChild(creerBande(opt.d, opt.n));
      contenu.appendChild(creerFractionLabel(opt.n, opt.d));
      btn.appendChild(contenu);
      if (estCorrecte) boutonCorrect = btn;
      btn.addEventListener('click', () => {
        if (etat.verrouille) return;
        Array.from(optionsCont.children).forEach((b) => (b.disabled = true));
        btn.classList.add(estCorrecte ? 'correct' : 'incorrect');
        if (!estCorrecte && boutonCorrect) boutonCorrect.classList.add('correct');
        resultatEgalite.innerHTML =
          '<strong>' + base.n + '/' + base.d + '</strong> = <strong>' + equivalente.n + '/' + equivalente.d + '</strong> : ' +
          donnees.vocabulaire.egalite.toLowerCase();
        validerReponse(estCorrecte);
      });
      optionsCont.appendChild(btn);
    });
    zone.appendChild(optionsCont);
    zone.appendChild(resultatEgalite);
  }

  /* ---------- Mini-jeu 4 : Comparer ---------- */

  function genererFractionsComparaison() {
    // Programme CE2 (BO n°41, rentrée 2025) : comparaison à dénominateurs
    // identiques uniquement. Comparer des dénominateurs différents relève du CM.
    const candidatsD = D.filter((d) => d >= 4);
    const d = choisir(candidatsD);
    const numerateurs = melanger(Array.from({ length: d - 1 }, (_, i) => i + 1)).slice(0, 3);
    return numerateurs.map((n) => ({ n, d }));
  }

  function genererComparer(zone, cfg) {
    const fractions = genererFractionsComparaison();
    const ordreCorrect = fractions
      .map((f, i) => i)
      .sort((i, j) => fractions[i].n / fractions[i].d - fractions[j].n / fractions[j].d);

    const consigne = document.createElement('p');
    consigne.className = 'consigne';
    consigne.textContent = cfg.consigne;
    zone.appendChild(consigne);

    const rangeeCartes = document.createElement('div');
    rangeeCartes.className = 'rangee-cartes';
    const rangeeSlots = document.createElement('div');
    rangeeSlots.className = 'rangee-slots';

    const ordreAffiche = melanger(fractions.map((f, i) => i));
    const slots = [];
    const cartes = {};              // index de fraction -> carte de la pioche
    const contenu = new Array(fractions.length).fill(null); // slot -> index, ou null

    fractions.forEach((f, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot-ordre';
      slot.dataset.rang = i;
      slots.push(slot);
      rangeeSlots.appendChild(slot);
      if (i < fractions.length - 1) {
        const fleche = document.createElement('span');
        fleche.className = 'fleche-ordre';
        fleche.textContent = '→';
        rangeeSlots.appendChild(fleche);
      }
    });

    const boutonValider = document.createElement('button');
    boutonValider.className = 'bouton-principal';
    boutonValider.style.display = 'block';
    boutonValider.style.margin = '0.4rem auto 0';
    boutonValider.textContent = 'Valider mon rangement';
    boutonValider.disabled = true;

    const aide = document.createElement('p');
    aide.className = 'legende-petite';
    aide.textContent = 'Tu peux déplacer une étiquette d\'une case à l\'autre, ou la toucher pour la retirer.';

    function majValider() {
      boutonValider.disabled = contenu.some((v) => v === null);
    }

    /* Une étiquette posée dans un slot : elle se DÉPLACE (glisser-déposer vers
       une autre case, qui échange les deux contenus) et se REPREND (simple
       appui, l'étiquette retourne dans la pioche). Rien n'est validé tant que
       l'enfant n'a pas appuyé sur « Valider » : il peut se reprendre autant de
       fois qu'il veut, ce que l'ancien enchaînement automatique interdisait. */
    function creerEtiquette(idxFraction) {
      const f = fractions[idxFraction];
      const etq = document.createElement('div');
      etq.className = 'etiquette-ordre';
      etq.dataset.fraction = idxFraction;
      etq.appendChild(creerFractionLabel(f.n, f.d));

      let enGlissement = false;
      let departX = 0, departY = 0, aBouge = false;

      etq.addEventListener('pointerdown', (e) => {
        if (etat.verrouille) return;
        enGlissement = true; aBouge = false;
        departX = e.clientX; departY = e.clientY;
        try { etq.setPointerCapture(e.pointerId); } catch (err) { /* pointeur déjà relâché */ }
      });
      etq.addEventListener('pointermove', (e) => {
        if (!enGlissement) return;
        e.preventDefault();
        const dx = e.clientX - departX, dy = e.clientY - departY;
        if (!aBouge && Math.hypot(dx, dy) < 8) return; // simple appui, pas un glissement
        aBouge = true;
        etq.classList.add('etiquette-glisse');
        etq.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      });
      function relacher(e) {
        if (!enGlissement) return;
        enGlissement = false;
        etq.style.transform = '';
        etq.classList.remove('etiquette-glisse');
        const rangDepart = Number(etq.parentElement.dataset.rang);
        if (!aBouge) { retirer(rangDepart); return; } // appui simple : on reprend l'étiquette
        const cible = slots.findIndex((s) => {
          const r = s.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        });
        if (cible !== -1 && cible !== rangDepart) echanger(rangDepart, cible);
      }
      etq.addEventListener('pointerup', relacher);
      etq.addEventListener('pointercancel', relacher);
      return etq;
    }

    function rendreSlot(rang) {
      const slot = slots[rang];
      slot.innerHTML = '';
      const idx = contenu[rang];
      slot.classList.toggle('rempli', idx !== null);
      if (idx !== null) slot.appendChild(creerEtiquette(idx));
    }

    function poser(idxFraction, rang) {
      contenu[rang] = idxFraction;
      cartes[idxFraction].classList.add('selectionnee');
      cartes[idxFraction].disabled = true;
      rendreSlot(rang);
      majValider();
    }

    function retirer(rang) {
      const idx = contenu[rang];
      if (idx === null) return;
      contenu[rang] = null;
      cartes[idx].classList.remove('selectionnee');
      cartes[idx].disabled = false;
      rendreSlot(rang);
      majValider();
    }

    function echanger(a, b) {
      const tmp = contenu[a]; contenu[a] = contenu[b]; contenu[b] = tmp;
      rendreSlot(a); rendreSlot(b);
      majValider();
    }

    ordreAffiche.forEach((idx) => {
      const f = fractions[idx];
      const carte = document.createElement('button');
      carte.className = 'carte-comparaison';
      carte.appendChild(creerBande(f.d, f.n));
      carte.appendChild(creerFractionLabel(f.n, f.d));
      carte.addEventListener('click', () => {
        if (etat.verrouille || carte.disabled) return;
        const libre = contenu.indexOf(null);
        if (libre === -1) return;
        poser(idx, libre);
      });
      cartes[idx] = carte;
      rangeeCartes.appendChild(carte);
    });

    // Les slots aussi acceptent le dépôt d'une étiquette venue d'une autre
    // case : le geste est intercepté par l'étiquette elle-même (ci-dessus),
    // mais un appui sur une case VIDE avec une carte en attente ne fait rien —
    // c'est la carte de la pioche qui reste le point d'entrée.
    boutonValider.addEventListener('click', () => {
      if (etat.verrouille || contenu.some((v) => v === null)) return;
      const estCorrecte = contenu.every((v, i) => v === ordreCorrect[i]);
      boutonValider.disabled = true;
      boutonValider.hidden = true;
      aide.hidden = true;
      // CHARTE §18 : d'abord SON rangement, chaque case en vert ou en rouge
      // selon qu'elle est bien placée ; puis, après une pause, la solution
      // vient s'y écrire — en VERT, jamais en rouge.
      slots.forEach((s, i) => {
        s.classList.add(contenu[i] === ordreCorrect[i] ? 'correct' : 'incorrect');
      });
      if (!estCorrecte) {
        setTimeout(() => {
          if (!slots[0].isConnected) return; // question déjà quittée
          slots.forEach((s, i) => {
            const bonneFraction = fractions[ordreCorrect[i]];
            s.innerHTML = '';
            const etq = document.createElement('div');
            etq.className = 'etiquette-ordre';
            etq.appendChild(creerFractionLabel(bonneFraction.n, bonneFraction.d));
            s.appendChild(etq);
            s.classList.remove('incorrect');
            s.classList.add('correct');
          });
        }, 900);
      }
      validerReponse(estCorrecte);
    });

    zone.appendChild(rangeeCartes);
    zone.appendChild(rangeeSlots);
    zone.appendChild(aide);
    zone.appendChild(boutonValider);
  }

  /* ---------- Mini-jeu 5 : Calculer (facile = petits dénominateurs, difficile = grands dénominateurs) ---------- */

  function genererCalcul(niveau) {
    // Programme CE2 (BO n°41, rentrée 2025) : addition/soustraction à
    // dénominateur identique uniquement. La conversion entre dénominateurs
    // différents relève du CM. La difficulté vient donc de la taille du
    // dénominateur, pas d'une conversion : facile = petits dénominateurs
    // (≤ 5), difficile = grands dénominateurs (6, 8, 10 ou 12).
    const candidatsD = niveau === 'facile' ? D.filter((x) => x <= 5) : D.filter((x) => x >= 6);

    // Le plus petit dénominateur candidat (ex. d=2 pour « facile ») n'admet
    // parfois qu'un seul calcul valide : on garde la trace des calculs déjà
    // tirés dans cette partie et on les rejette, pour éviter de reposer
    // exactement le même calcul deux fois dans les 6 manches (CHARTE §13).
    if (!etat.calculsVus) etat.calculsVus = [];

    for (let t = 0; t < 80; t++) {
      const d = choisir(candidatsD);
      const n1 = nombreAleatoire(1, d - 1);
      const n2 = nombreAleatoire(1, d - 1);
      const operation = Math.random() < 0.5 ? '+' : '-';

      let resultatCalcul = null;
      if (operation === '+') {
        if (n1 + n2 <= d && n1 + n2 >= 2) {
          resultatCalcul = { a: { n: n1, d }, b: { n: n2, d }, dGrand: d, operation, resultat: { n: n1 + n2, d } };
        }
      } else if (n1 !== n2) {
        const grand = n1 > n2 ? { n: n1, d } : { n: n2, d };
        const petit = n1 > n2 ? { n: n2, d } : { n: n1, d };
        resultatCalcul = { a: grand, b: petit, dGrand: d, operation, resultat: { n: grand.n - petit.n, d } };
      }
      if (!resultatCalcul) continue;
      const cle = resultatCalcul.a.n + '/' + d + operation + resultatCalcul.b.n + '/' + d;
      if (etat.calculsVus.indexOf(cle) !== -1) continue;
      etat.calculsVus.push(cle);
      return resultatCalcul;
    }
    return { a: { n: 1, d: 4 }, b: { n: 2, d: 4 }, dGrand: 4, operation: '+', resultat: { n: 3, d: 4 } };
  }

  function genererCalculer(zone, cfg) {
    const calc = genererCalcul(cfg.niveauCalcul);
    const dGrand = calc.dGrand;
    const aConv = calc.a.n * (dGrand / calc.a.d);
    const bConv = calc.b.n * (dGrand / calc.b.d);

    const consigne = document.createElement('p');
    consigne.className = 'consigne';
    consigne.textContent = calc.operation === '+'
      ? 'Touche les cases pour ajouter la deuxième fraction.'
      : 'Touche les cases pour retirer la deuxième fraction.';
    zone.appendChild(consigne);

    const blocCalcul = document.createElement('div');
    blocCalcul.className = 'bloc-calcul-consigne';
    blocCalcul.appendChild(creerFractionLabel(calc.a.n, calc.a.d, true));
    const symbole = document.createElement('span');
    symbole.className = 'symbole-calcul';
    symbole.textContent = calc.operation;
    blocCalcul.appendChild(symbole);
    blocCalcul.appendChild(creerFractionLabel(calc.b.n, calc.b.d, true));
    const egal = document.createElement('span');
    egal.className = 'symbole-calcul';
    egal.textContent = '=';
    blocCalcul.appendChild(egal);
    const point = document.createElement('span');
    point.className = 'symbole-calcul';
    point.textContent = '?';
    blocCalcul.appendChild(point);
    zone.appendChild(blocCalcul);

    const apercu = document.createElement('div');
    apercu.className = 'apercu-calcul';

    const apercuA = document.createElement('div');
    apercuA.className = 'apercu-fraction op-a';
    apercuA.appendChild(creerBande(dGrand, aConv));
    const legA = document.createElement('p');
    legA.className = 'legende-petite';
    legA.textContent = calc.a.d === dGrand
      ? calc.a.n + '/' + calc.a.d
      : calc.a.n + '/' + calc.a.d + ' = ' + aConv + '/' + dGrand;
    apercuA.appendChild(legA);

    const apercuB = document.createElement('div');
    apercuB.className = 'apercu-fraction op-b';
    apercuB.appendChild(creerBande(dGrand, bConv));
    const legB = document.createElement('p');
    legB.className = 'legende-petite';
    legB.textContent = calc.b.d === dGrand
      ? calc.b.n + '/' + calc.b.d
      : calc.b.n + '/' + calc.b.d + ' = ' + bConv + '/' + dGrand;
    apercuB.appendChild(legB);

    apercu.appendChild(apercuA);
    apercu.appendChild(apercuB);
    zone.appendChild(apercu);

    const rempli = new Array(dGrand).fill(false).map((_, i) => i < aConv);
    const interactive = document.createElement('div');
    interactive.className = 'forme-bande-interactive';
    const cellules = [];
    for (let i = 0; i < dGrand; i++) {
      const cell = document.createElement('button');
      cell.className = 'cellule-interactive' + (rempli[i] ? ' rempli' : '');
      cell.addEventListener('click', () => {
        if (etat.verrouille) return;
        rempli[i] = !rempli[i];
        cell.classList.toggle('rempli', rempli[i]);
      });
      cellules.push(cell);
      interactive.appendChild(cell);
    }
    zone.appendChild(interactive);

    const compteur = document.createElement('p');
    compteur.className = 'legende';
    zone.appendChild(compteur);

    const boutonValider = document.createElement('button');
    boutonValider.className = 'bouton-principal';
    boutonValider.style.display = 'block';
    boutonValider.style.margin = '0.4rem auto 0';
    boutonValider.textContent = 'Valider';
    boutonValider.addEventListener('click', () => {
      if (etat.verrouille) return;
      const total = rempli.filter(Boolean).length;
      const estCorrecte = total === calc.resultat.n;
      // CHARTE §18 : la bande que l'enfant a construite prend la couleur de SA
      // réponse — verte si elle est juste, rouge sinon. Elle ne doit jamais
      // verdir sur une erreur : le vert est réservé à la bonne réponse, montrée
      // séparément ci-dessous.
      interactive.classList.add(estCorrecte ? 'verrouille-correct' : 'verrouille-incorrect');
      cellules.forEach((c) => (c.disabled = true));
      boutonValider.disabled = true;
      boutonValider.hidden = true;
      if (estCorrecte) {
        compteur.innerHTML = 'Résultat : <strong>' + calc.resultat.n + '/' + dGrand + '</strong>';
      } else {
        // CHARTE §18 : sa réponse en rouge, la bonne en vert.
        compteur.textContent = '';
        afficherCorrection(compteur, total + '/' + dGrand, calc.resultat.n + '/' + dGrand);
        // Le mini-jeu se joue sur une BANDE : la correction doit donc être
        // graphique elle aussi, sinon l'enfant doit traduire mentalement un
        // écart de nombres en écart de cases. On montre la bande attendue,
        // sous celle qu'il a construite, à la même échelle.
        const bonne = document.createElement('div');
        bonne.className = 'bande-correction';
        const titre = document.createElement('p');
        titre.className = 'legende-petite correction-attendue';
        titre.textContent = 'La bonne réponse : ' + calc.resultat.n + '/' + dGrand;
        bonne.appendChild(titre);
        bonne.appendChild(creerBande(dGrand, calc.resultat.n));
        zone.insertBefore(bonne, compteur);
      }
      validerReponse(estCorrecte);
    });
    zone.appendChild(boutonValider);
  }

  /* ---------- Initialisation ---------- */

  document.getElementById('bouton-retour').addEventListener('click', retourAccueil);
  document.getElementById('bouton-suivant').addEventListener('click', questionSuivante);

  construireAccueil();
})();
</script>
<script>
  /* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7).
     Script isolé du moteur de jeu : il n'agit que sur les éléments statiques
     de la page (le « ← Menu » ne s'affiche que sur l'écran d'accueil). */
  (function () {
    var bouton = document.getElementById('bouton-menu');
    var modale = document.getElementById('modale-menu');
    if (!bouton || !modale) return;
    function fermer() { modale.hidden = true; }
    bouton.addEventListener('click', function () { modale.hidden = false; });
    document.getElementById('modale-menu-rester').addEventListener('click', fermer);
    document.getElementById('modale-menu-revenir').addEventListener('click', function () {
      window.location.href = '../index.html';
    });
    modale.addEventListener('click', function (e) { if (e.target === modale) fermer(); });
  })();
</script>
</body>
</html>
