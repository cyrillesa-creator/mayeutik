/* ============================================================
   LA ROSACE (CE2) — recyclée telle quelle par M41.
   Duplication assumée : la charte impose des fichiers autonomes, on ne
   peut pas partager de module. Toute retouche ici est à reporter dans M41.
   ============================================================ */
function construireRosace(){
  const R = 130, cx = 0, cy = 0, n = 6;
  const petales = [], sommetsHex = [];
  for (let i = 0; i < n; i++) {
    const th = -Math.PI/2 + i * TAU / n;
    sommetsHex.push([cx + Math.cos(th) * R * 0.42, cy + Math.sin(th) * R * 0.42]);
  }
  for (let i = 0; i < n; i++) {
    const a = sommetsHex[i], b = sommetsHex[(i + 1) % n];
    const th = -Math.PI/2 + (i + 0.5) * TAU / n;
    const loin = [cx + Math.cos(th) * R * 0.93, cy + Math.sin(th) * R * 0.93];
    petales.push({id:'pet' + i, forme:'quadrilatere',
      pts:[a, [ (a[0]+loin[0])/2 - (b[1]-a[1])*0.16, (a[1]+loin[1])/2 + (b[0]-a[0])*0.16 ], loin, b],
      couleur:VERRES[i % VERRES.length]});
  }
  return {R, cx, cy, sommetsHex, petales,
    hexagone:{id:'hex', forme:'hexagone', pts:sommetsHex, couleur:'#FFC93C'}};
}

/* ============================================================
   GÉNÉRATEURS DE MANCHES — un par mini-jeu
   ============================================================ */
function qReconnaitre(cfg, palier){
  const simples = palier.formes.filter(f => f !== 'cercle');
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    // Progression : une seule forme demandée, puis deux ensemble.
    const deux = i >= 3;
    let dem = melanger(simples).slice(0, deux ? 2 : 1);
    /* On ne demande JAMAIS « les rectangles et les carrés » ensemble : la
       consigne obligerait alors à trancher l’inclusion carré ⊂ rectangle,
       hors programme au cycle 2. On remplace le carré par une autre forme. */
    if (dem.includes('rectangle') && dem.includes('carre')) {
      const remplacant = melanger(simples.filter(f => f !== 'rectangle' && f !== 'carre'))[0];
      dem = remplacant ? ['rectangle', remplacant] : ['rectangle'];
    }
    // Au CE1, on ménage une manche cercle/disque : la distinction est
    // abstraite sur papier, évidente en vitrail.
    if (palier.formes.includes('cercle') && i === 2) dem.splice(0, dem.length, 'cercle');
    const pieces = dem[0] === 'cercle'
      ? poserEnGrille(['cercle','cercle','disque','disque','carre','triangle'], {cols:3, taille:76})
      : assemblageCommande(palier, dem);
    return {mode:'reconnaitre', pieces, demandees:dem,
      q: 'Touche ' + (dem.length === 1
            ? 'tous les ' + plurDe(dem[0])
            : 'tous les ' + plurDe(dem[0]) + ' et tous les ' + plurDe(dem[1])) + ' !',
      sous:'Sélectionne les pièces, puis Vérifier.'};
  });
}

function qRelations(cfg){
  return Array.from({length: cfg.nbQuestions}, () => {
    const sc = scenarioRelation();
    if (sc.multi) {
      return {mode:'relations', pieces:sc.pieces, props:sc.props, multi:true,
        q:'Touche toutes les phrases vraies.',
        sous:'Coche-les toutes, puis Vérifier.'};
    }
    const props = melanger([{e:sc.vrai, bon:true}, ...distracteursRelation(sc.vrai).map(e => ({e, bon:false}))]);
    return {mode:'relations', pieces:sc.pieces, props,
      q:'Quelle phrase est vraie ?',
      sous:'Choisis la bonne phrase. 🔊 pour l’écouter.'};
  });
}

function qDecrire(cfg, palier){
  /* CHARTE §13 — pas de redondance : les nombres à trouver sont TOUS
     DIFFÉRENTS au fil de la partie. Une version antérieure tirait forme et
     question au hasard et pouvait demander « combien de côtés » trois fois
     de suite pour la réponse 4. On fixe donc le squelette : un nom, puis
     un comptage à 3, un à 4, puis les deux formes que le CP ne nomme pas,
     à 5 et à 6 côtés. */
  const nommables = palier.formes.filter(f => f !== 'cercle');
  const troisCotes = nommables.filter(f => f === 'triangle' || f === 'triangleRect');
  const quatreCotes = nommables.filter(f => ['carre','rectangle','losange'].includes(f));
  const petits = melanger([
    troisCotes.length ? {f:pioche(troisCotes)} : null,
    quatreCotes.length ? {f:pioche(quatreCotes)} : null
  ].filter(Boolean));
  const grands = melanger(['pentagone','hexagone']);

  const plan = [];
  plan.push({type:'nom', f:tirerSansRepetition('decrire-nom', nommables, 1)[0]});
  petits.forEach(x => plan.push({type:'compte', f:x.f, connue:true}));
  grands.forEach(f => plan.push({type:'compte', f, connue:false}));
  while (plan.length < cfg.nbQuestions) plan.push({type:'nom', f:tirerSansRepetition('decrire-nom', nommables, 1)[0]});

  const quoiUtilise = [];
  return plan.slice(0, cfg.nbQuestions).map((etape, i) => {
    const piece = creerPiece(etape.f, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
    const p = proprietes(piece);
    if (etape.type === 'nom') {
      const autres = melanger(nommables.filter(f => f !== etape.f)).slice(0, 3);
      return {mode:'decrire', pieces:[piece],
        q:'Comment s’appelle cette pièce ?', sous:'',
        opts:melanger([etape.f, ...autres].map(nomDe)), ans:nomDe(etape.f)};
    }
    /* Côtés et sommets alternent, pour que la partie ne soit pas une suite
       de « combien de côtés ». */
    const quoi = quoiUtilise.filter(x => x === 'cotes').length > quoiUtilise.filter(x => x === 'sommets').length
      ? 'sommets' : (quoiUtilise.length ? 'cotes' : pioche(['cotes','sommets']));
    quoiUtilise.push(quoi);
    const bon = quoi === 'cotes' ? p.nbCotes : p.nbSommets;
    const q = etape.connue
      ? 'Combien ' + leDe(etape.f) + ' a-t-il ' + (quoi === 'cotes' ? 'de côtés' : 'de sommets') + ' ?'
      : 'Combien cette forme a-t-elle ' + (quoi === 'cotes' ? 'de côtés' : 'de sommets') + ' ?';
    return {mode:'decrire', pieces:[piece], compte:quoi, bonNombre:bon,
      q, sous:'Compte bien tout autour.',
      opts:melanger([bon, bon + 1, bon - 1, bon + 2].map(String)), ans:String(bon)};
  });
}

/* Assertions candidates pour « pourquoi ce n’est pas un carré ? ». Chacune
   porte son PRÉDICAT : c’est la figure qui décide si l’assertion est vraie,
   pas une liste écrite à la main. Un distracteur est une assertion FAUSSE
   sur la pièce affichée — « l’un de ses angles n’est pas droit » était
   proposé comme faux devant un triangle, où il est manifestement vrai. */
const ASSERTIONS_CARRE = [
  {t:'elle n’a que trois côtés',                    vrai:p => p.nbCotes === 3},
  {t:'ses quatre côtés n’ont pas la même longueur', vrai:p => p.nbCotes === 4 && !p.tousCotesEgaux},
  {t:'l’un de ses angles n’est pas droit',          vrai:p => !p.rond && !p.tousAnglesDroits},
  {t:'elle a plus de quatre côtés',                 vrai:p => p.nbCotes > 4},
  {t:'elle n’a aucun sommet',                       vrai:p => p.nbSommets === 0},
  {t:'elle a quatre sommets',                       vrai:p => p.nbSommets === 4}
];

function qJustifier(cfg, palier){
  /* CHARTE §13 : les pièces ne se répètent pas d’une manche à l’autre. */
  /* La réfutation a besoin du rectangle et du triangle : la phase « nommer »
     se sert donc dans le reste, sans quoi la même pièce reviendrait deux
     fois dans la partie. La variété inter-sessions (§13) vient de l’ordre,
     des rotations, des proportions et des couleurs, pas du tirage des
     formes — elles sont cinq pour cinq manches. */
  const aRefuter = melanger(['rectangle','triangle']);
  const aNommer = melanger(['carre','triangleRect','disque']);
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    // Manches 1-3 : nommer puis prouver. Manches 4-5 : réfuter.
    const refutation = i >= 3;
    const forme = refutation ? aRefuter[(i - 3) % aRefuter.length] : aNommer[i % aNommer.length];
    const piece = creerPiece(forme, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
    const p = proprietes(piece);
    const autres = melanger(palier.formes.filter(f => f !== forme)).slice(0, 3);
    const etape1 = {q: refutation
        ? 'Le client dit : « c’est un carré. » Il se trompe. Qu’est-ce que c’est vraiment ?'
        : 'Comment s’appelle cette pièce ?',
      opts:melanger([forme, ...autres].map(nomDe)), ans:nomDe(forme)};
    let etape2;
    if (refutation) {
      const motif = forme === 'rectangle'
        ? 'ses quatre côtés n’ont pas la même longueur'
        : 'elle n’a que trois côtés';
      /* Les deux distracteurs sont RELUS sur la pièce : seules des
         assertions fausses ici peuvent être proposées. */
      const faux = melanger(ASSERTIONS_CARRE.filter(x => x.t !== motif && !x.vrai(p)).map(x => x.t)).slice(0, 2);
      etape2 = {q:'Pourquoi ce n’est pas un carré ?', opts:melanger([motif, ...faux]), ans:motif};
    } else {
      const bonne = PROP[forme] || PROP.triangle;
      const faux = melanger(Object.keys(PROP).filter(k => k !== forme).map(k => PROP[k])).slice(0, 2);
      etape2 = {q:'Qu’est-ce qui le prouve ?', opts:melanger([bonne, ...faux]), ans:bonne};
    }
    return {mode:'justifier', pieces:[piece], etape1, etape2, etape:1,
      q:etape1.q, sous:'D’abord le nom, ensuite la preuve.'};
  });
}

function qAngles(cfg){
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    /* On tire une figure jusqu’à trouver un angle FRANC de la classe
       voulue : jamais de cas limite, la vérification à l’équerre relève
       de M35. */
    const vise = ['droit','aigu','obtus'][i % 3];
    let piece = null, idx = -1;
    for (let essai = 0; essai < 400 && idx === -1; essai++) {
      const f = vise === 'droit' ? pioche(['carre','rectangle','triangleRect'])
        : pioche(['triangle','losange','pentagone','triangleRect']);
      const cand = creerPiece(f, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
      const a = anglesDeg(cand.pts);
      const j = a.findIndex(x => classeAngle(x) === vise && angleFranc(x));
      if (j !== -1) { piece = cand; idx = j; }
    }
    if (!piece) { piece = creerPiece('carre', {cx:0, cy:0, taille:150}); idx = 0; }
    return {mode:'angles', pieces:[piece], sommet:idx,
      q:'Regarde l’angle marqué sur la pièce. Comment est-il ?',
      sous:'À l’œil : pas besoin d’équerre ici.',
      opts:melanger(['droit','aigu','obtus'].map(x => 'un angle ' + x)),
      ans:'un angle ' + classeAngle(anglesDeg(piece.pts)[idx])};
  });
}

function qVocabulaire(cfg){
  /* Banque de onze notions pour cinq manches : la variété inter-sessions
     du §13 vient du tirage, pas d’une rallonge du mini-jeu. */
  const banque = ['centre','rayon','diametre','diagonale','longueur','largeur',
                  'triangle','quadrilatere','pentagone','hexagone','polygone'];
  return tirerSansRepetition('voc-notions', banque, cfg.nbQuestions).map(notion => ({
    mode:'vocabulaire', notion, q:consigneVocabulaire(notion),
    /* Deux écrans distincts sous une même compétence : la rosace pour le
       vocabulaire du cercle, un présentoir de pièces pour le classement
       par nombre de côtés. La sous-consigne doit dire lequel on regarde. */
    sous: notion === 'polygone' ? 'Le mot qui les englobe toutes.'
      : ['triangle','quadrilatere','pentagone','hexagone'].includes(notion)
        ? 'Compte les côtés de chaque pièce.'
        : ['diagonale','longueur','largeur'].includes(notion)
          ? 'Le quadrilatère éclairé. Plusieurs réponses conviennent.'
          : 'Sur le cercle éclairé. Plusieurs réponses peuvent convenir.'
  }));
}
function consigneVocabulaire(n){
  /* « la rosace » n’est pas un cercle : c’est l’assemblage de pétales. Le
     centre, le rayon et le diamètre appartiennent au CERCLE qui la
     délimite, et la consigne doit le dire. De même, la diagonale se
     demande sur un quadrilatère IDENTIFIÉ — le rectangle posé sous la
     rosace — et non sur « ce quadrilatère », qui ne désignait rien. */
  const m = {
    centre:'Touche le centre du cercle qui délimite la rosace.',
    rayon:'Touche un rayon du cercle qui délimite la rosace.',
    /* Un cercle a une infinité de diamètres : « LE diamètre » n’existe pas. */
    diametre:'Touche un diamètre du cercle qui délimite la rosace.',
    diagonale:'Touche une diagonale du quadrilatère en surbrillance.',
    longueur:'Touche une longueur du quadrilatère en surbrillance.',
    largeur:'Touche une largeur du quadrilatère en surbrillance.',
    triangle:'Touche le triangle.',
    quadrilatere:'Touche un quadrilatère.',
    pentagone:'Touche le pentagone.',
    hexagone:'Touche l’hexagone.',
    polygone:'Quel mot désigne toutes ces formes à la fois ?'
  };
  return m[n];
}

function qPortrait(cfg){
  const cibles = ['losange','carre','rectangle','triangleRect','disque','cercle'];
  return tirerSansRepetition('portrait-cibles', cibles, cfg.nbQuestions).map((cible, i) => {
    const autres = melanger(cibles.filter(f => f !== cible)).slice(0, 3);
    const toutes = melanger([cible, ...autres]);
    const pieces = toutes.map((f, j) => creerPiece(f, {cx:0, cy:0, taille:120, couleur:VERRES[(i + j) % VERRES.length]}));
    return {mode:'portrait', pieces, cible, choix:toutes, piecesChoix:pieces,
      q:'Le client demande : « ' + PORTRAITS[cible] + ' »',
      sous:'Touche la pièce qui correspond.'};
  });
}
const PORTRAITS = {
  losange:'Quatre côtés de même longueur, mais aucun angle droit.',
  carre:'Quatre côtés de même longueur et quatre angles droits.',
  rectangle:'Quatre angles droits, mais ses côtés ne sont pas tous de même longueur.',
  triangleRect:'Trois côtés, et un angle droit.',
  disque:'Tout rond, et le verre remplit tout.',
  cercle:'Tout rond, mais seulement le tour : pas de verre au milieu.'
};

function qLitige(cfg){
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    /* Le client affirme « carré » ; la pièce n’en est pas un. Deux cas :
       elle a bien quatre angles droits mais des côtés inégaux (rectangle),
       ou quatre côtés égaux mais des angles non droits (losange). C’est ce
       qui décide de ce qu’il faut toucher, et de la sous-consigne. */
    const cas = i % 2 === 0 ? 'rectangle' : 'losange';
    const piece = creerPiece(cas, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
    const p = proprietes(piece);
    const angles = p.angles.map(classeAngle);
    const cotes = p.cotes;
    /* PLUSIEURS DÉSIGNATIONS SONT JUSTES, et les refuser serait faux : un
       losange a QUATRE angles non droits, n’importe lequel dénonce le
       défaut ; un rectangle a deux longs côtés et deux courts, et toute
       paire « un long + un court » montre l’inégalité. On décrit donc des
       EXIGENCES — tant de zones à prendre dans tel groupe — et non une
       liste unique de bonnes cases. */
    let exigences, sous, motif, faux;
    if (cas === 'losange') {
      const nonDroits = angles.map((a, j) => a !== 'droit' ? 'a' + j : null).filter(Boolean);
      exigences = [{parmi:nonDroits, nb:1}];
      sous = 'Touche UN angle qui ne va pas, puis appuie sur Vérifier.';
      motif = 'Or un carré a ses quatre angles droits.';
      faux = ['Or un carré a quatre côtés.', 'Or un carré a ses côtés de même longueur.'];
    } else {
      const maxi = Math.max(...cotes), mini = Math.min(...cotes);
      const longs = cotes.map((l, j) => presqueEgal(l, maxi) ? 'c' + j : null).filter(Boolean);
      const courts = cotes.map((l, j) => presqueEgal(l, mini) ? 'c' + j : null).filter(Boolean);
      exigences = [{parmi:longs, nb:1}, {parmi:courts, nb:1}];
      sous = 'Touche UN grand côté ET UN petit côté, puis appuie sur Vérifier.';
      motif = 'Or un carré a ses quatre côtés de même longueur.';
      faux = ['Or un carré a ses quatre angles droits.', 'Or un carré a quatre sommets.'];
    }
    return {mode:'litige', pieces:[piece], cas, exigences, etape:1,
      q:'Le client dit : « cette pièce est un carré. » Montre où ça coince.',
      sous, etape2:{q:'Et pourquoi ce n’est pas un carré ?', opts:melanger([motif, ...faux]), ans:motif}};
  });
}

/* ============================================================
   VALIDATION PARTAGÉE DES ITEMS (A1)
   ------------------------------------------------------------
   Deux invariants, vérifiés sur la FIGURE réellement engendrée :
     1. tout distracteur doit être rigoureusement FAUX ;
     2. la cible d’un toucher est l’ENSEMBLE des zones valables.
   Chaque item passe ici À LA GÉNÉRATION, et un auto-test en engendre des
   centaines par mini-jeu. Le défaut le plus coûteux de la première
   production venait de là : des propositions vraies présentées comme
   fausses, et des réponses justes refusées.
   ============================================================ */
function veriteRelation(e, pieces){
  const carre = pieces.find(p => p.forme === 'carre');
  const tri = pieces.find(p => p.forme === 'triangle');
  const familleTriCarre = pieces.length === 2 && carre && tri;
  if (familleTriCarre) {
    const c = contactsTriangleCarre(tri.pts, carre.pts);
    if (e.modele === 'dans') return e.a === 'triangle' && e.b === 'carre';
    if (e.modele === 'sommets-sur') return c.surSommet === e.k;
    if (e.modele === 'sommet-sur-cote') return c.surCote >= 1;
    return false;               // une seule pièce de chaque : rien d’autre n’est vrai
  }
  if (pieces.length !== 2) return null;
  const [p1, p2] = pieces;
  if (e.modele === 'cote-commun')
    return e.n === 2 && p1.forme === e.a && p2.forme === e.a && cotesPartages(p1.pts, p2.pts) >= 1;
  if (e.modele === 'sommet-commun')
    return e.n === 2 && p1.forme === e.a && p2.forme === e.a && sommetsPartages(p1.pts, p2.pts) >= 1;
  if (e.modele === 'forment') {
    if (e.n !== pieces.length) return false;
    if (p1.forme !== e.a || p2.forme !== e.a) return false;
    const h = enveloppeConvexe(p1.pts.concat(p2.pts));
    const nom = nommerCalcule({forme:'x', pts:h}, ['carre','rectangle','losange','triangle','forme']);
    return nom === nomDe(e.b);
  }
  return null;
}
const VALIDATEURS = {
  relations(q){
    const pb = [];
    const textes = q.props.map(p => texteRelation(p.e));
    if (new Set(textes).size !== textes.length) pb.push('deux propositions au texte identique');
    if (!q.props.some(p => p.bon)) pb.push('aucune proposition vraie');
    q.props.forEach((p, i) => {
      const v = veriteRelation(p.e, q.pieces);
      if (v === null) return;
      if (v !== p.bon) pb.push((p.bon ? 'donnée vraie mais fausse' : 'distracteur VRAI') + ' : ' + textes[i]);
    });
    return pb;
  },
  justifier(q){
    const pb = [];
    const p = proprietes(q.pieces[0]);
    if (/Pourquoi/.test(q.etape2.q)) {
      q.etape2.opts.forEach(o => {
        const a = ASSERTIONS_CARRE.find(x => x.t === o);
        if (!a) { pb.push('assertion inconnue : ' + o); return; }
        if (a.vrai(p) !== (o === q.etape2.ans)) pb.push('assertion mal étiquetée : ' + o);
      });
    }
    if (q.etape1.ans !== nomDe(q.pieces[0].forme)) pb.push('le nom attendu ne décrit pas la pièce');
    if (new Set(q.etape2.opts).size !== q.etape2.opts.length) pb.push('deux options identiques');
    return pb;
  },
  decrire(q){
    const pb = [];
    if (q.compte) {
      const p = proprietes(q.pieces[0]);
      const vrai = q.compte === 'cotes' ? p.nbCotes : p.nbSommets;
      if (vrai !== q.bonNombre) pb.push('le nombre attendu ne correspond pas à la figure');
      if (q.opts.filter(o => o === q.ans).length !== 1) pb.push('la bonne réponse figure deux fois');
    } else if (q.ans !== nomDe(q.pieces[0].forme)) pb.push('le nom attendu ne décrit pas la pièce');
    if (new Set(q.opts).size !== q.opts.length) pb.push('deux options identiques');
    return pb;
  },
  angles(q){
    const pb = [];
    const a = anglesDeg(q.pieces[0].pts)[q.sommet];
    if (q.ans !== 'un angle ' + classeAngle(a)) pb.push('la classe annoncée ne correspond pas à l’angle');
    if (!angleFranc(a)) pb.push('angle limite : la classe se discute à l’œil');
    return pb;
  },
  portrait(q){
    const pb = [];
    if (q.choix.filter(f => f === q.cible).length !== 1) pb.push('la pièce demandée figure deux fois');
    /* La description ne doit convenir qu’à UNE pièce du présentoir. */
    q.choix.forEach((f, i) => {
      if (f === q.cible) return;
      if (PORTRAITS[f] === PORTRAITS[q.cible]) pb.push('deux pièces répondent à la description');
    });
    return pb;
  },
  litige(q){
    const pb = [];
    const p = proprietes(q.pieces[0]);
    if (!q.exigences || !q.exigences.length) { pb.push('aucune cible'); return pb; }
    q.exigences.forEach(e => {
      if (!e.parmi.length) pb.push('groupe de cibles vide');
      e.parmi.forEach(id => {
        const i = +id.slice(1);
        if (id[0] === 'a' && classeAngle(p.angles[i]) === 'droit') pb.push('un angle droit proposé comme fautif');
      });
    });
    /* Invariant 2 : TOUTES les cibles équivalentes sont acceptées. */
    if (q.cas === 'rectangle') {
      const maxi = Math.max(...p.cotes), mini = Math.min(...p.cotes);
      const longs = p.cotes.filter(l => presqueEgal(l, maxi)).length;
      const courts = p.cotes.filter(l => presqueEgal(l, mini)).length;
      if (q.exigences[0].parmi.length !== longs || q.exigences[1].parmi.length !== courts)
        pb.push('des côtés équivalents sont refusés');
    } else {
      const nonDroits = p.angles.filter(a => classeAngle(a) !== 'droit').length;
      if (q.exigences[0].parmi.length !== nonDroits) pb.push('des angles équivalents sont refusés');
    }
    return pb;
  },
  reconnaitre(q){
    const pb = [];
    if (!q.pieces.some(p => q.demandees.includes(p.forme))) pb.push('aucune pièce demandée n’est présente');
    if (q.demandees.includes('rectangle') && q.demandees.includes('carre'))
      pb.push('rectangle et carré demandés ensemble (inclusion hors programme)');
    return pb;
  },
  vocabulaire(q){ return []; }   // ses cibles naissent au rendu, testées à part
};
function verifierItem(q){
  const f = VALIDATEURS[q.mode];
  return f ? f(q) : [];
}
function verifierFile(f){
  return f.map((q, i) => ({i, mode:q.mode, pb:verifierItem(q)})).filter(x => x.pb.length);
}

/* Une sélection convient si elle prend exactement le nombre voulu de zones
   dans CHAQUE groupe, et rien d’autre. */
function selectionSatisfait(choisies, exigences){
  const total = exigences.reduce((n, e) => n + e.nb, 0);
  if (choisies.length !== total) return false;
  const restantes = choisies.slice();
  for (const e of exigences) {
    let pris = 0;
    for (let i = restantes.length - 1; i >= 0; i--) {
      if (e.parmi.includes(restantes[i]) && pris < e.nb) { pris++; restantes.splice(i, 1); }
    }
    if (pris !== e.nb) return false;
  }
  return restantes.length === 0;
}

function engendrerFile(cfg, palier){
  if (cfg.mode === 'reconnaitre') return qReconnaitre(cfg, palier);
  if (cfg.mode === 'relations')   return qRelations(cfg);
  if (cfg.mode === 'decrire')     return qDecrire(cfg, palier);
  if (cfg.mode === 'justifier')   return qJustifier(cfg, palier);
  if (cfg.mode === 'angles')      return qAngles(cfg);
  if (cfg.mode === 'vocabulaire') return qVocabulaire(cfg);
  if (cfg.mode === 'portrait')    return qPortrait(cfg);
  return qLitige(cfg);
}
/* Aucune partie ne démarre sur un item que la validation partagée refuse.
   En pratique les générateurs sont construits pour ne pas en produire ; ce
   filet existe pour que l’ajout d’un scénario demain ne réintroduise pas en
   silence le défaut qui a coûté le plus cher. */
function construireFile(cfg, palier){
  let f = engendrerFile(cfg, palier);
  for (let essai = 0; essai < 25 && verifierFile(f).length; essai++) f = engendrerFile(cfg, palier);
  const restants = verifierFile(f);
  if (restants.length) console.warn('M34 : items non conformes', restants);
  return f;
}
/* Barème : la justification et la réfutation pèsent DOUBLE — c’est
   l’objectif du module, nommer ne suffit pas. */
const POINTS_ETAPE1 = 1, POINTS_ETAPE2 = 2;
const enDeuxTemps = mode => mode === 'justifier' || mode === 'litige';
function pointsParManche(mode){ return enDeuxTemps(mode) ? POINTS_ETAPE1 + POINTS_ETAPE2 : 1; }

/* ============================================================
   ÉCRANS ET DÉROULÉ
   ============================================================ */
const ecrans = {home:$('home'), game:$('game'), end:$('end')};
let etatPalierAffiche = palierParDefaut();
let miniJeuCourant = null, file = [], pos = 0, score = 0, total = 0, demarreLe = 0;
let selection = new Set(), verrouille = false;

function remonterEnHaut(){
  try { window.scrollTo({top:0, left:0, behavior:'auto'}); } catch(e){ window.scrollTo(0, 0); }
}
function montreEcran(nom){
  desarmerAutoSuivant(); stopperVoix();
  Object.values(ecrans).forEach(e => e.hidden = true);
  ecrans[nom].hidden = false;
  $('btnBack').hidden = (nom === 'home');
  if (nom === 'home') $('dots').innerHTML = '';
  remonterEnHaut();
}
function retourAccueil(){
  desarmerAutoSuivant(); stopperVoix();
  montreEcran('home'); construireAccueil();
}
$('btnBack').addEventListener('click', retourAccueil);

/* Navigation automatique (CHARTE §20) : 2 s après l’affichage du bouton. */
const DELAI_AUTO_SUIVANT = 2000;
let minuteurAutoSuivant = null;
function armerAutoSuivant(){
  clearTimeout(minuteurAutoSuivant);
  const b = $('btnNext');
  minuteurAutoSuivant = setTimeout(() => {
    if (b.style.display === 'none' || b.disabled || !b.isConnected) return;
    b.click();
  }, DELAI_AUTO_SUIVANT);
}
function desarmerAutoSuivant(){ clearTimeout(minuteurAutoSuivant); }

function creerCarte(cfg){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'card'; b.dataset.jeu = cfg.id;
  const ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = cfg.icone;
  const nom = document.createElement('span'); nom.className = 'nom'; nom.textContent = cfg.titre;
  const det = document.createElement('span'); det.className = 'det'; det.textContent = cfg.description;
  const st = document.createElement('span'); st.className = 'stars';
  const n = lireEtoiles()[cfg.id] || 0;
  st.textContent = n ? '⭐'.repeat(n) : '';
  b.append(ico, nom, det, st);
  b.addEventListener('click', () => lance(cfg.id));
  return b;
}

function construireAccueil(){
  $('hdrTitle').textContent = 'L’atelier du vitrail';
  const palier = CONTENU.paliers[etatPalierAffiche];
  $('sous-titre-accueil').textContent = (palier && palier.sousTitre) || CONTENU.sousTitre;

  const rangee = $('rangee-paliers');
  rangee.innerHTML = '';
  const niveauProfil = niveauDuProfilActif();
  /* Verrouillage des onglets (CHARTE §15) : un palier au-delà du niveau du
     profil actif reste verrouillé tant que son paquet cadeau n’a pas été
     ouvert — sinon le sélecteur contournerait la mécanique de déblocage. */
  let indexNiveauProfil = ORDRE_PALIERS.indexOf(niveauProfil);
  if (indexNiveauProfil === -1) indexNiveauProfil = 0;
  const profilIdPourVerrou = lireProfilActifId();
  ORDRE_PALIERS.filter(n => CONTENU.paliers[n]).forEach(n => {
    const verr = ORDRE_PALIERS.indexOf(n) > indexNiveauProfil && !bonusDejaRevele(profilIdPourVerrou, n);
    const puce = document.createElement('button');
    puce.type = 'button';
    puce.className = 'puce-palier' + (n === etatPalierAffiche ? ' actif' : '') + (verr ? ' verrouille' : '');
    puce.textContent = verr ? n + ' 🔒' : n;
    puce.disabled = verr;
    if (!verr) puce.addEventListener('click', () => { etatPalierAffiche = n; construireAccueil(); });
    rangee.appendChild(puce);
  });
  $('note-palier').textContent = niveauProfil
    ? 'Niveau de ' + (niveauProfil === etatPalierAffiche
        ? 'ton profil'
        : 'ton profil : ' + niveauProfil + ' — tu regardes le palier ' + etatPalierAffiche)
    : '';

  const grille = $('grille-jeux');
  grille.innerHTML = '';
  (palier ? palier.miniJeux : []).forEach(cfg => grille.appendChild(creerCarte(cfg)));

  const suivant = palierSuivant(etatPalierAffiche);
  const blocBonus = $('bloc-bonus'), paquet = $('paquet-cadeau'), grilleBonus = $('grille-bonus');
  if (suivant && palierMaitrise(etatPalierAffiche)) {
    blocBonus.hidden = false;
    $('note-bonus').textContent =
      'Tu maîtrises tout le palier ' + etatPalierAffiche + ' : essaie un aperçu du palier ' + suivant + ' !';
    grilleBonus.innerHTML = '';
    CONTENU.paliers[suivant].miniJeux.forEach(cfg => grilleBonus.appendChild(creerCarte(cfg)));
    const profilId = lireProfilActifId();
    if (bonusDejaRevele(profilId, suivant)) { paquet.hidden = true; grilleBonus.hidden = false; }
    else {
      paquet.hidden = false; paquet.disabled = false;
      paquet.classList.remove('paquet-cadeau-ouverture');
      grilleBonus.hidden = true;
      /* Propriété `onclick` et non addEventListener : ce bouton est un
         élément fixe réutilisé à chaque rendu (CHARTE §15). */
      paquet.onclick = () => ouvrirPaquetCadeau(profilId, suivant, paquet, grilleBonus);
    }
  } else blocBonus.hidden = true;
}
function ouvrirPaquetCadeau(profilId, cible, paquet, grilleBonus){
  if (paquet.disabled) return;
  paquet.disabled = true;
  marquerBonusRevele(profilId, cible);
  lancerConfettis(50); sonBonneReponse();
  paquet.classList.add('paquet-cadeau-ouverture');
  setTimeout(() => { paquet.hidden = true; grilleBonus.hidden = false; }, 480);
}

function trouverMiniJeu(id){
  for (const nom of ORDRE_PALIERS) {
    const p = CONTENU.paliers[nom];
    if (!p) continue;
    const cfg = p.miniJeux.find(mj => mj.id === id);
    if (cfg) return {cfg, palier:p, palierNom:nom};
  }
  return null;
}
function lance(id){
  const t = trouverMiniJeu(id);
  if (!t) return;
  miniJeuCourant = t;
  file = construireFile(t.cfg, t.palier);
  pos = 0; score = 0;
  total = file.reduce((s, q) => s + pointsParManche(q.mode), 0);
  demarreLe = Date.now();
  $('hdrTitle').textContent = t.cfg.titre;
  montreEcran('game');
  question();
}

function majDots(){
  $('dots').innerHTML = file.map((q, i) =>
    `<span class="dot ${i < pos ? (q._ok ? 'ok' : 'ko') : i === pos ? 'cur' : ''}"></span>`).join('');
}
function message(txt, cl, correction){
  const f = $('feedback');
  f.textContent = txt || '';
  f.className = cl || '';
  if (correction) {
    const s = document.createElement('span');
    s.className = 'correction-attendue';
    s.textContent = ' ' + correction;
    f.appendChild(s);
  }
}

/* ---- Rendu d’une manche ---- */
function question(){
  desarmerAutoSuivant(); stopperVoix();
  const q = file[pos];
  verrouille = false; selection = new Set();
  $('feedback').textContent = ''; $('feedback').className = '';
  $('btnNext').style.display = 'none';
  $('btnValider').style.display = 'none';
  $('answers').innerHTML = ''; $('answers').className = '';
  $('vitrail').hidden = true;
  $('sousConsigne').textContent = q.sous || '';
  poserConsigne(q.q);
  majDots();

  if (q.mode === 'reconnaitre') rendreReconnaitre(q);
  else if (q.mode === 'relations') rendreRelations(q);
  else if (q.mode === 'decrire') rendreDecrire(q);
  else if (q.mode === 'justifier') rendreJustifier(q);
  else if (q.mode === 'angles') rendreAngles(q);
  else if (q.mode === 'vocabulaire') rendreVocabulaire(q);
  else if (q.mode === 'portrait') rendrePortrait(q);
  else rendreLitige(q);
}
/* La consigne est lue à voix haute et réécoutable : au CP surtout, elle ne
   doit pas dépendre de la lecture. */
function poserConsigne(texte){
  $('qText').innerHTML = '';
  const t = document.createElement('span');
  t.textContent = texte;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn-voix'; b.textContent = '🔊';
  b.setAttribute('aria-label', 'Écouter la consigne');
  b.addEventListener('click', () => lireAVoixHaute(texte));
  $('qText').append(t, b);
  lireAVoixHaute(texte);
}

function boutonRep(libelle, onClick, opts){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'rep' + ((opts && opts.centre) ? ' centre' : '');
  if (opts && opts.schema) {
    const d = document.createElement('span');
    d.innerHTML = opts.schema;
    b.appendChild(d.firstChild);
  }
  const t = document.createElement('span');
  t.className = 'txt'; t.textContent = libelle;
  b.appendChild(t);
  if (opts && opts.voix) {
    const r = document.createElement('button');
    r.type = 'button'; r.className = 'relire'; r.textContent = '🔊';
    r.setAttribute('aria-label', 'Réécouter cette phrase');
    r.addEventListener('click', (ev) => { ev.stopPropagation(); lireAVoixHaute(libelle); });
    b.appendChild(r);
  }
  b.addEventListener('click', onClick);
  return b;
}

/* QCM générique : une seule bonne réponse, mélangée (§13), correction en
   vert même si elle n’a pas été touchée (§18). */
function rendreQcm(opts, ans, apres, extra){
  const zone = $('answers');
  /* `classList.add` et non `className = …` : l’appelant a pu poser
     `compact` avant nous, et l’écraser ferait défiler l’écran. */
  if (opts.every(o => String(o).length < 16)) zone.classList.add('duo');
  opts.forEach(o => {
    const b = boutonRep(String(o), () => {
      if (verrouille) return;
      verrouille = true;
      const bon = String(o) === String(ans);
      zone.querySelectorAll('.rep').forEach(x => {
        x.disabled = true;
        if (x !== b) x.classList.add('dim');
      });
      b.classList.add(bon ? 'ok' : 'ko');
      if (!bon) {
        const cible = [...zone.querySelectorAll('.rep')].find(x => x.querySelector('.txt').textContent === String(ans));
        if (cible) { cible.classList.remove('dim'); cible.classList.add('ok'); }
      }
      apres(bon);
    }, Object.assign({centre:true}, extra || {}));
    zone.appendChild(b);
  });
}

function rendreQcmSurFigure(q){
  afficherScene(q.pieces);
  rendreQcm(q.opts, q.ans, bon => terminerManche(bon, bon ? null : 'La bonne réponse était : ' + q.ans));
}

/* ---- cp-decrire : sur une erreur de comptage, on COMPTE devant l’enfant ----
   Annoncer « c’était 5 » n’apprend rien. Un compteur s’allume dans un coin
   du plan — hors de la figure, qui est logée dans le reste du cadre — puis
   s’incrémente pendant que les côtés se colorent un à un, ou que les
   sommets se marquent d’un point. Le passage automatique à la manche
   suivante (§20) est neutralisé le temps du décompte, comme dans « Je
   compte » de M36. */
const PAS_COMPTAGE = 460;
function rendreDecrire(q){
  if (!q.compte) { rendreQcmSurFigure(q); return; }
  const H = SCENE_H_DEFAUT;
  const chip = `<g id="compteur" opacity="0">`
    + `<rect x="12" y="14" width="52" height="46" rx="12" fill="#fff" stroke="#12233C" stroke-width="2.5"/>`
    + `<text id="compteurTxt" x="38" y="47" text-anchor="middle" font-size="30" font-weight="700" fill="#12233C">0</text></g>`;
  afficherScene(q.pieces, '', H, {x:78, y:0, l:SCENE_L - 78, h:H});
  $('svgScene').insertAdjacentHTML('beforeend', chip + `<g id="decompte"></g>`);
  rendreQcm(q.opts, q.ans, bon => {
    terminerManche(bon, bon ? null : 'La bonne réponse était : ' + q.ans);
    if (bon) return;
    desarmerAutoSuivant();          // on laisse le temps de regarder compter
    animerComptage(q);
  });
}
function animerComptage(q){
  const svg = $('svgScene');
  const chip = svg.querySelector('#compteur'), txt = svg.querySelector('#compteurTxt');
  const g = svg.querySelector('#decompte');
  if (!chip || !g) return;
  chip.setAttribute('opacity', '1');
  /* Les marques se posent dans le MÊME groupe transformé que la figure :
     elles suivent la mise à l’échelle de la scène sans calcul supplémentaire. */
  const hote = svg.querySelector('#scenePieces') || g;
  const pts = q.pieces[0].pts || [];
  const n = pts.length;
  let k = 0;
  const pas = () => {
    if (!svg.isConnected || k >= n) return;
    const i = k;
    if (q.compte === 'cotes') {
      const a = pts[i], b = pts[(i + 1) % n];
      hote.insertAdjacentHTML('beforeend',
        `<line class="trait-compte" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`);
    } else {
      const a = pts[i];
      hote.insertAdjacentHTML('beforeend', `<circle class="point-compte" cx="${a[0]}" cy="${a[1]}" r="7"/>`);
    }
    k++;
    txt.textContent = String(k);
    if (k < n) setTimeout(pas, PAS_COMPTAGE);
  };
  setTimeout(pas, 320);
}

/* ---- cp/ce1-reconnaitre : sélection multiple puis validation ---- */
function rendreReconnaitre(q){
  const dem = q.demandees;
  const attendues = q.pieces.filter(p => dem.includes(p.forme)).map(p => p.id);
  /* Jusqu’à sept pièces sur quatre rangées : c’est la HAUTEUR qui limite
     leur taille, et un cadre de 236 les réduisait à des vignettes que le
     doigt d’un CP rate. L’écran n’a pas d’autre contenu qu’un bouton, on
     peut donc s’étendre. */
  afficherScene(q.pieces, '', 306);
  $('btnValider').style.display = 'block';
  $('svgScene').querySelectorAll('.piece').forEach(g => {
    g.addEventListener('click', () => {
      if (verrouille) return;
      const id = g.dataset.piece;
      if (selection.has(id)) { selection.delete(id); g.classList.remove('sel'); }
      else { selection.add(id); g.classList.add('sel'); sonClic(); }
    });
  });
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    const choisies = [...selection];
    const bon = choisies.length === attendues.length && choisies.every(id => attendues.includes(id));
    /* §18 : on montre l’état complet — ce qui était juste, ce qui était de
       trop, et ce qui manquait (en pointillé vert). */
    $('svgScene').querySelectorAll('.piece').forEach(g => {
      const id = g.dataset.piece, att = attendues.includes(id), pris = selection.has(id);
      g.classList.remove('sel');
      if (pris && att) g.classList.add('bon');
      else if (pris && !att) g.classList.add('faux');
      else if (!pris && att) g.classList.add('manque');
    });
    terminerManche(bon, bon ? null : 'Les pièces entourées en vert étaient les bonnes.');
  };
}

/* ---- cp-relations : phrases courtes TOUJOURS illustrées ---- */
function rendreRelations(q){
  if (q.multi) { rendreRelationsMulti(q); return; }
  /* Jusqu’à quatre propositions illustrées : la scène est raccourcie
     d’autant, et à la MÊME hauteur que la variante à choix multiple —
     l’encombrement ne doit pas bouger d’une manche à l’autre (A3). */
  afficherScene(q.pieces, '', HAUTEUR_RELATIONS);
  const zone = $('answers');
  zone.className = 'compact';
  q.props.forEach(p => {
    const texte = texteRelation(p.e);
    const b = boutonRep(texte, () => {
      if (verrouille) return;
      verrouille = true;
      zone.querySelectorAll('.rep').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
      b.classList.add(p.bon ? 'ok' : 'ko');
      if (!p.bon) {
        const cible = [...zone.querySelectorAll('.rep')][q.props.findIndex(x => x.bon)];
        if (cible) { cible.classList.remove('dim'); cible.classList.add('ok'); }
      }
      terminerManche(p.bon, p.bon ? null : 'La phrase vraie est en vert.');
    }, {schema:schemaRelation(p.e), voix:true});
    zone.appendChild(b);
  });
}

/* Choix MULTIPLE : la description officielle du programme est cumulative,
   plusieurs phrases sont vraies à la fois sur la même figure. On coche, puis
   on vérifie ; la réponse n’est juste que si l’ENSEMBLE coché est exactement
   l’ensemble des phrases vraies. */
function rendreRelationsMulti(q){
  afficherScene(q.pieces, '', HAUTEUR_RELATIONS);
  const zone = $('answers');
  zone.className = 'compact';
  const choisies = new Set();
  q.props.forEach((p, i) => {
    const b = boutonRep(texteRelation(p.e), () => {
      if (verrouille) return;
      if (choisies.has(i)) { choisies.delete(i); b.classList.remove('coche'); }
      else { choisies.add(i); b.classList.add('coche'); sonClic(); }
    }, {schema:schemaRelation(p.e), voix:true});
    zone.appendChild(b);
  });
  $('btnValider').style.display = 'block';
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    const attendues = q.props.map((p, i) => p.bon ? i : -1).filter(i => i >= 0);
    const bon = choisies.size === attendues.length && attendues.every(i => choisies.has(i));
    /* §18 : toutes les phrases vraies passent au vert, y compris celles que
       l’enfant a oubliées ; le rouge ne marque que ce qu’il a coché à tort. */
    zone.querySelectorAll('.rep').forEach((el, i) => {
      el.disabled = true;
      el.classList.remove('coche');
      if (q.props[i].bon) el.classList.add('ok');
      else if (choisies.has(i)) el.classList.add('ko');
      else el.classList.add('dim');
    });
    terminerManche(bon, bon ? null : 'Les phrases vraies sont en vert : il y en avait '
      + attendues.length + '.');
  };
}

/* ---- ce1-justifier : deux temps, la preuve compte double ---- */
function rendreJustifier(q){
  /* Les propriétés énoncées sont longues (« ses quatre angles sont droits
     et ses quatre côtés ont la même longueur ») : sans mise en page
     compacte, trois options de trois lignes font défiler l’écran. */
  afficherScene(q.pieces, '', 168);
  $('answers').classList.add('compact');
  const e = q.etape === 1 ? q.etape1 : q.etape2;
  poserConsigne(e.q);
  rendreQcm(e.opts, e.ans, bon => {
    if (q.etape === 1) {
      q._pts = (q._pts || 0) + (bon ? POINTS_ETAPE1 : 0);
      q._ok1 = bon;
      message(bon ? 'Bien vu !' : 'Presque !', bon ? 'bon' : 'mauvais',
        bon ? null : 'C’était ' + e.ans + '.');
      if (bon) sonBonneReponse(); else sonErreur();
      $('btnNext').style.display = 'block';
      $('btnNext').textContent = 'Et maintenant ? ➜';
      $('btnNext').onclick = () => {
        q.etape = 2; verrouille = false;
        $('answers').innerHTML = ''; $('answers').className = '';
        $('btnNext').style.display = 'none';
        message('');
        $('sousConsigne').textContent = 'Cette réponse compte double.';
        rendreJustifier(q);
      };
      armerAutoSuivant();
    } else {
      q._pts = (q._pts || 0) + (bon ? POINTS_ETAPE2 : 0);
      terminerManche(q._ok1 && bon, bon ? null : 'La bonne raison est en vert.', q._pts);
    }
  });
}

/* ---- ce1-angles : l’angle visé est marqué sur la figure ---- */
function rendreAngles(q){
  const p = q.pieces[0], pts = p.pts, i = q.sommet, n = pts.length;
  const s = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
  const vers = (u, v, d) => {
    const L = hyp(u, v);
    return [u[0] + (v[0] - u[0]) / L * d, u[1] + (v[1] - u[1]) / L * d];
  };
  const m1 = vers(s, a, 26), m2 = vers(s, b, 26);
  /* L’arc doit être CENTRÉ SUR LE SOMMET et balayer l’angle INTÉRIEUR —
     c’est la convention des manuels. Le drapeau de balayage était figé à 1 :
     selon le sens de parcours du polygone, l’arc partait alors de l’autre
     côté et se refermait à l’envers. On le déduit maintenant du signe de
     l’écart angulaire, ce qui place le centre de l’arc sur le sommet quelle
     que soit l’orientation de la pièce. */
  const d1 = Math.atan2(m1[1] - s[1], m1[0] - s[0]);
  const d2 = Math.atan2(m2[1] - s[1], m2[0] - s[0]);
  let ecart = d2 - d1;
  while (ecart <= -Math.PI) ecart += TAU;
  while (ecart > Math.PI) ecart -= TAU;
  const chemin = `M ${m1[0]} ${m1[1]} A 26 26 0 0 ${ecart > 0 ? 1 : 0} ${m2[0]} ${m2[1]}`;
  /* Le marqueur ne peut pas être orange : le verre l’est aussi. Halo blanc
     sous un trait d’encre — lisible sur les huit teintes. */
  const marque = `<path class="marque-angle-halo" d="${chemin}"/>`
    + `<path class="marque-angle" d="${chemin}"/>`
    + `<circle class="sommet-angle" cx="${s[0]}" cy="${s[1]}" r="5"/>`;
  afficherScene(q.pieces, marque);
  rendreQcm(q.opts, q.ans, bon => terminerManche(bon, bon ? null : 'C’était ' + q.ans + '.'));
}

/* ============================================================
   CHOISIR LA CIBLE TOUCHÉE (A2)
   ------------------------------------------------------------
   Des bandes transparentes empilées attribuent le toucher au dernier
   élément DESSINÉ, pas au plus proche : une largeur se voyait comptée
   comme une longueur près d’un coin, et le centre comme le diamètre, qui
   passe par lui. On mesure donc la distance à CHAQUE cible et on tranche —
   avec une règle de priorité : un POINT l’emporte toujours sur une LIGNE
   qui passe dessus, parce qu’un point est plus difficile à viser et qu’on
   ne le désigne jamais par accident.
   ============================================================ */
function distanceAuSegment(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx*dx + dy*dy;
  if (L2 < 1e-9) return hyp(p, a);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return hyp(p, [a[0] + dx*t, a[1] + dy*t]);
}
const SEUIL_TOUCHER = 26, BONUS_POINT = 14;
function cibleTouchee(p, cibles){
  let meilleure = null, meilleurScore = Infinity;
  cibles.forEach(c => {
    const d = c.type === 'point' ? hyp(p, c.p) : distanceAuSegment(p, c.a, c.b);
    if (d > SEUIL_TOUCHER) return;
    /* Le bonus donne la priorité au point sans écraser la distance : une
       ligne franchement plus proche l’emporte quand même. */
    const score = d - (c.type === 'point' ? BONUS_POINT : 0);
    if (score < meilleurScore) { meilleurScore = score; meilleure = c; }
  });
  return meilleure;
}
/* Capte les touchers sur toute la scène et les attribue à la bonne cible.
   L’écouteur est posé sur le <svg> lui-même, qui SURVIT au changement de
   manche : sans retrait explicite, ils s’empilent, et le plus ancien —
   avec ses cibles périmées — répond en premier. C’est le même piège que le
   `onclick` du paquet cadeau (§15). */
function brancherCibles(svg, cibles, surChoix, repere){
  if (svg._ecouteurCibles) svg.removeEventListener('click', svg._ecouteurCibles);
  const handler = (ev) => {
    if (verrouille) return;
    /* Le toucher doit être converti dans L’ESPACE OÙ VIVENT LES CIBLES, et
       non dans celui de la racine : depuis que la scène est logée par
       homothétie dans un cadre fixe, ses pièces habitent le repère du
       groupe `#scenePieces`. Passer par la matrice de la racine décalait
       tout du facteur d’échelle, et plus rien ne répondait au litige. */
    const cadre = repere && repere.isConnected ? repere : svg;
    const m = cadre.getScreenCTM();
    if (!m) return;
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const q = pt.matrixTransform(m.inverse());
    const c = cibleTouchee([q.x, q.y], cibles);
    if (c) surChoix(c);
  };
  svg._ecouteurCibles = handler;
  svg.addEventListener('click', handler);
}

/* ---- ce2-vocabulaire : la rosace, désignation ou classement ----
   PLUSIEURS RÉPONSES SONT JUSTES et le jeu les accepte toutes : un
   rectangle a deux longueurs, deux largeurs et deux diagonales, un cercle
   une infinité de rayons. Refuser la seconde longueur serait faux ; la
   consigne dit donc « touche UNE longueur », au singulier indéfini.
   Les cibles ne se recouvrent plus : chaque zone est RÉTRÉCIE loin des
   coins et des extrémités, et le centre est dessiné en DERNIER, donc
   au-dessus — toucher le centre était auparavant lu comme un toucher du
   diamètre, qui passe par lui. */
const VOC_VB = '-150 -110 300 246';
function rendreVocabulaire(q){
  const svg = $('svgScene');
  $('vitrail').hidden = false;
  svg.setAttribute('viewBox', VOC_VB);

  if (['triangle','quadrilatere','pentagone','hexagone'].includes(q.notion)) {
    const formes = melanger(['triangle','quadrilatere','pentagone','hexagone']);
    const pieces = formes.map((f, i) => creerPiece(
      f === 'quadrilatere' ? 'rectangle' : f,
      {cx:-105 + i * 70, cy:0, taille:64, couleur:VERRES[i % VERRES.length]}));
    svg.innerHTML = pieces.map((p, i) =>
      svgPiece(p, formes[i] === q.notion ? 'cible' : '')).join('');
    svg.querySelectorAll('.piece').forEach((g, i) => {
      g.addEventListener('click', () => {
        if (verrouille) return;
        verrouille = true;
        const bon = formes[i] === q.notion;
        g.classList.add(bon ? 'bon' : 'faux');
        if (!bon) svg.querySelectorAll('.piece')[formes.indexOf(q.notion)].classList.add('bon');
        terminerManche(bon, bon ? null : 'La bonne pièce est entourée en vert.');
      });
    });
    return;
  }

  const R = construireRosace(), CY = -18, RR = 86;
  const petales = R.petales.map(p => ({...p, pts:p.pts.map(([x, y]) => [x * RR / R.R, y * RR / R.R + CY])}));
  const hex = {...R.hexagone, pts:R.hexagone.pts.map(([x, y]) => [x * RR / R.R, y * RR / R.R + CY])};

  if (q.notion === 'polygone') {
    svg.innerHTML = petales.map(p => svgPiece(p)).join('') + svgPiece(hex);
    rendreQcm(melanger(['polygone','quadrilatère','hexagone','triangle']), 'polygone',
      bon => terminerManche(bon, bon ? null : 'Le mot juste était : polygone.'));
    return;
  }

  /* Le quadrilatère de référence, MIS EN SURBRILLANCE quand la question
     porte sur lui : « ce quadrilatère » ne désignait rien à l’écran. */
  const RX = 78, RY0 = 74, RY1 = 118;
  const rect = {id:'rect', forme:'rectangle',
    pts:[[-RX, RY0], [RX, RY0], [RX, RY1], [-RX, RY1]], couleur:'#5AB4DC'};
  const surRect = ['diagonale','longueur','largeur'].includes(q.notion);
  const halo = surRect
    ? `<rect class="surbrillance" x="${-RX-12}" y="${RY0-12}" width="${2*RX+24}" height="${RY1-RY0+24}" rx="14"/>`
    : '';
  const anneau = `<circle class="${['centre','rayon','diametre'].includes(q.notion) ? 'anneau-vise' : ''}"
      cx="0" cy="${CY}" r="${RR}" fill="none" stroke="#2B3A55" stroke-width="4"/>`;
  const fond = petales.map(p => svgPiece(p)).join('') + svgPiece(hex) + halo + svgPiece(rect) + anneau;

  /* Les CIBLES sont des objets géométriques, pas des bandes empilées : le
     toucher est attribué à la plus proche (cf. `cibleTouchee`). Un cercle a
     une infinité de rayons et de diamètres, un rectangle deux longueurs,
     deux largeurs et deux diagonales : on en trace plusieurs, et TOUS sont
     acceptés quand la question les vise. */
  const surCercle = (a) => [RR * Math.cos(a), CY + RR * Math.sin(a)];
  const r = rect.pts;
  const cibles = [
    {id:'rayon-1', type:'segment', a:[0, CY], b:surCercle(-1.05), notion:'rayon'},
    {id:'rayon-2', type:'segment', a:[0, CY], b:surCercle(-2.30), notion:'rayon'},
    {id:'diam-1', type:'segment', a:surCercle(0), b:surCercle(Math.PI), notion:'diametre'},
    {id:'diam-2', type:'segment', a:surCercle(1.05), b:surCercle(1.05 + Math.PI), notion:'diametre'},
    {id:'long-h', type:'segment', a:r[0], b:r[1], notion:'longueur'},
    {id:'long-b', type:'segment', a:r[3], b:r[2], notion:'longueur'},
    {id:'larg-d', type:'segment', a:r[1], b:r[2], notion:'largeur'},
    {id:'larg-g', type:'segment', a:r[0], b:r[3], notion:'largeur'},
    {id:'diag-1', type:'segment', a:r[0], b:r[2], notion:'diagonale'},
    {id:'diag-2', type:'segment', a:r[1], b:r[3], notion:'diagonale'},
    {id:'centre', type:'point', p:[0, CY], notion:'centre'}
  ];
  cibles.forEach(c => { c.bon = c.notion === q.notion; });

  /* Le repère fin qui dit « il y a là quelque chose à toucher ». La cible,
     elle, n’est plus un élément du DOM : c’est de la géométrie. */
  const trace = cibles.map(c => c.type === 'point'
    ? `<circle class="indice" data-c="${c.id}" cx="${c.p[0]}" cy="${c.p[1]}" r="5"/>`
    : `<line class="indice-trait" data-c="${c.id}" x1="${c.a[0]}" y1="${c.a[1]}" x2="${c.b[0]}" y2="${c.b[1]}"/>`).join('');
  svg.innerHTML = fond + trace;

  brancherCibles(svg, cibles, (c) => {
    verrouille = true;
    const marquer = (id, cl) => {
      const e = svg.querySelector(`[data-c="${id}"]`);
      if (e) e.classList.add(cl);
    };
    marquer(c.id, c.bon ? 'trace-bon' : 'trace-faux');
    /* §18 : toutes les réponses qui convenaient passent au vert. */
    if (!c.bon) cibles.filter(x => x.bon).forEach(x => marquer(x.id, 'trace-bon'));
    const n = cibles.filter(x => x.bon).length;
    terminerManche(c.bon, c.bon ? null : (n > 1
      ? 'Les ' + n + ' réponses possibles sont en vert.'
      : 'Ce qu’il fallait toucher est en vert.'));
  });
}

/* ---- ce2-portrait : le présentoir ---- */
function rendrePortrait(q){
  $('vitrail').hidden = true;
  const zone = $('answers');
  zone.className = 'presentoir';
  q.piecesChoix.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'rep';
    const bb = boiteEnglobante([p]), m = 12;
    b.innerHTML = `<svg viewBox="${bb.x1 - m} ${bb.y1 - m} ${bb.x2 - bb.x1 + 2*m} ${bb.y2 - bb.y1 + 2*m}">${svgPiece(p)}</svg>`;
    b.addEventListener('click', () => {
      if (verrouille) return;
      verrouille = true;
      const bon = q.choix[i] === q.cible;
      zone.querySelectorAll('.rep').forEach((x, j) => {
        x.disabled = true;
        if (j !== i) x.classList.add('dim');
      });
      b.classList.add(bon ? 'ok' : 'ko');
      if (!bon) {
        const c = zone.querySelectorAll('.rep')[q.choix.indexOf(q.cible)];
        if (c) { c.classList.remove('dim'); c.classList.add('ok'); }
      }
      /* La description ne nomme jamais la figure — c’est tout son intérêt.
         Mais une fois la réponse vérifiée, le mot doit être donné : sans
         lui, l’enfant reconnaît sans apprendre à nommer. */
      /* « un » comme « une » commencent par une voyelle : l’élision est
         systématique, et se calcule au lieu de s’écrire. */
      const nom = 'Il s’agit d’' + avecArt(q.cible) + '.';
      terminerManche(bon, bon ? nom : 'C’était ' + avecArt(q.cible) + '.', undefined, bon ? nom : null);
    });
    zone.appendChild(b);
  });
}

/* ---- ce2-litige : désigner le défaut, puis l’énoncer (compte double) ---- */
function rendreLitige(q){
  if (q.etape === 2) { rendreLitigeEtape2(q); return; }
  /* Chaque côté porte un petit tiret en son milieu, chaque sommet un point :
     ce sont les poignées qui disent « ici, ça se touche ». Les cibles
     réelles, elles, sont larges et transparentes par-dessus. */
  const p = q.pieces[0], n = p.pts.length;
  /* Cibles GÉOMÉTRIQUES, comme sur la rosace : près d’un coin, la bande du
     côté et celle du sommet se recouvrent, et c’est le dernier élément
     dessiné qui gagnait. Un sommet est un POINT et l’emporte donc sur les
     côtés qui y aboutissent. */
  const cibles = [];
  let indices = '';
  p.pts.forEach((a, i) => {
    const b = p.pts[(i + 1) % n];
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const L = hyp(a, b), ux = (b[0]-a[0]) / L, uy = (b[1]-a[1]) / L, d = 11;
    indices += `<line class="indice-trait" data-c="c${i}" x1="${mx - ux*d}" y1="${my - uy*d}" x2="${mx + ux*d}" y2="${my + uy*d}"/>`;
    indices += `<circle class="indice" data-c="a${i}" cx="${a[0]}" cy="${a[1]}" r="4.5"/>`;
    cibles.push({id:'c' + i, type:'segment', a, b});
  });
  p.pts.forEach((a, i) => cibles.push({id:'a' + i, type:'point', p:a}));
  afficherScene(q.pieces, indices, 210);
  $('btnValider').style.display = 'block';
  const svg = $('svgScene');
  brancherCibles(svg, cibles, (c) => {
    const e = svg.querySelector(`[data-c="${c.id}"]`);
    if (selection.has(c.id)) { selection.delete(c.id); if (e) e.classList.remove('trace-choisi'); }
    else { selection.add(c.id); if (e) e.classList.add('trace-choisi'); sonClic(); }
  }, svg.getElementById('scenePieces'));
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    const ch = [...selection];
    const bon = selectionSatisfait(ch, q.exigences);
    /* §18 : on montre UNE désignation valable — montrer les quatre côtés
       d’un rectangle en vert laisserait croire qu’il fallait tous les
       prendre, alors qu’il en fallait deux. */
    const attendues = q.exigences.map(e => e.parmi.slice(0, e.nb)).reduce((a, b) => a.concat(b), []);
    svg.querySelectorAll('[data-c]').forEach(z => {
      const id = z.dataset.c, pris = selection.has(id);
      z.classList.remove('trace-choisi');
      if (bon && pris) z.classList.add('trace-bon');
      else if (!bon && attendues.includes(id)) z.classList.add('trace-bon');
      else if (pris) z.classList.add('trace-faux');
    });
    q._pts = (bon ? POINTS_ETAPE1 : 0);
    q._ok1 = bon;
    if (bon) sonBonneReponse(); else sonErreur();
    message(bon ? 'Bien vu, c’est là que ça coince !' : 'Presque !', bon ? 'bon' : 'mauvais',
      bon ? null : 'Ce qu’il fallait montrer est marqué en vert.');
    $('btnNext').style.display = 'block';
    $('btnNext').textContent = 'Et pourquoi ? ➜';
    $('btnNext').onclick = () => {
      q.etape = 2; verrouille = false;
      $('answers').innerHTML = ''; $('answers').className = '';
      $('btnNext').style.display = 'none';
      message('');
      rendreLitigeEtape2(q);
    };
    armerAutoSuivant();
  };
}
function rendreLitigeEtape2(q){
  afficherScene(q.pieces, '', 182);
  poserConsigne(q.etape2.q);
  $('sousConsigne').textContent = 'Cette réponse compte double.';
  rendreQcm(q.etape2.opts, q.etape2.ans, bon => {
    q._pts = (q._pts || 0) + (bon ? POINTS_ETAPE2 : 0);
    terminerManche(q._ok1 && bon, bon ? null : 'La bonne raison est en vert.', q._pts);
  });
}

/* ---- Fin de manche ---- */
function terminerManche(bon, correction, ptsForces, precision){
  const q = file[pos];
  const pts = ptsForces !== undefined ? ptsForces : (bon ? 1 : 0);
  score += pts;
  q._ok = bon;
  if (bon) { sonBonneReponse(); lancerConfettis(28); message(precision ? 'Bravo ! ' + precision : 'Bravo !', 'bon'); }
  else { sonErreur(); message('Presque ! ', 'mauvais', correction || ''); }
  majDots();
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  $('btnNext').onclick = () => {
    pos++;
    if (pos < file.length) question(); else fin();
  };
  armerAutoSuivant();
}

function fin(){
  desarmerAutoSuivant(); stopperVoix();
  const ratio = total ? score / total : 0;
  const n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  enregistrerEtoiles(miniJeuCourant.cfg.id, n);
  enregistrerSession(miniJeuCourant.cfg.id, score, total, Math.round((Date.now() - demarreLe) / 1000));
  $('hdrTitle').textContent = 'Résultat';
  $('endStars').innerHTML = '⭐'.repeat(n).split('').map(s => `<span>${s}</span>`).join('');
  $('endMsg').textContent = n === 3 ? 'Magnifique vitrail !' : n === 2 ? 'Bien joué !' : 'Continue, tu progresses !';
  $('endScore').textContent = score + ' point' + (score > 1 ? 's' : '') + ' sur ' + total + '.';
  if (n === 3) sonNiveauParfait(); else sonBonneReponse();
  lancerConfettis(n === 3 ? 90 : 40);
  montreEcran('end');
}
$('bRejouer').addEventListener('click', () => lance(miniJeuCourant.cfg.id));
$('bMenu').addEventListener('click', retourAccueil);

/* ============================================================
   DÉMARRAGE
   ============================================================ */
construireAccueil();
montreEcran('home');
