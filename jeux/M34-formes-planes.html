<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>L’atelier du vitrail — Mayeutik</title>
<!-- ============================================================
     JEU M34 — Formes planes (CP, CE1, CE2)
     Backlog : pilotage/backlog.json — sous-thème « La géométrie plane »
     Univers : l’atelier du vitrail, table de tri. On regarde, on nomme,
     on justifie, on réfute — on ne trace RIEN et on ne pose AUCUN
     instrument (c’est le domaine de M35).

     Mécanique propre au module : la justification par propriété, qui
     mûrit en trois temps —
       CP  : décrire ce qu’on voit, y compris les RELATIONS entre pièces
       CE1 : nommer ne suffit plus, il faut désigner la propriété
       CE2 : réfuter, en montrant d’abord OÙ l’affirmation se casse

     Principe d’écriture : les propriétés d’une figure (nombre de côtés,
     longueurs, angles, égalités) sont TOUJOURS calculées depuis ses
     sommets, jamais déclarées à côté du dessin. Une donnée écrite à la
     main finit par mentir sur ce qui est affiché.
     ============================================================ -->
<style>
:root{
  color-scheme: light only;
  --ciel:#EAF2FC; --carte:#FFFFFF; --encre:#1D3354; --encre2:#41577A;
  --mandarine:#FF8A3D; --mandarine-f:#E5701F;
  --menthe:#2EC4A6; --menthe-t:#0B8A70; --corail:#FF5D5D; --corail-t:#D93636; --soleil:#FFC93C;
  --plomb:#2B3A55;
  /* La sélection : violet franc, ni vert ni rouge (§18), doublé d’un halo
     blanc — les huit verres sont saturés et aucune teinte seule n’y tient. */
  --selection:#6D28D9;
  --r:20px; --ombre:0 4px 0 rgba(29,51,84,.12);
  font-size:16px;
}

/* ---------- Protections tactiles (CHARTE §19) ----------
   `touch-action` ne s’hérite PAS : le sélecteur universel est le seul
   moyen de couvrir toute l’interface. `pan-y` conserve le défilement
   vertical de la page sur iPhone. */
*{ box-sizing:border-box; touch-action:pan-y; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--ciel); color-scheme:light only; }
html,body{margin:0; padding:0; min-height:100%;}
body{
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  font-family:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  background:var(--ciel); color:var(--encre);
  background-image:radial-gradient(rgba(29,51,84,.05) 1.5px, transparent 1.5px);
  background-size:26px 26px;
  display:flex; justify-content:center;
}
img, svg{ -webkit-user-drag:none; }
#app{width:100%; max-width:520px; min-height:100dvh; display:flex; flex-direction:column; padding:10px 14px 18px;}

/* ---------- Header ---------- */
header{display:flex; align-items:center; gap:10px; padding:6px 0 10px; min-height:54px;}
#btnBack{
  width:42px; height:42px; border-radius:14px; border:none; flex:none;
  background:var(--carte); color:var(--encre); font-size:20px; font-weight:700;
  box-shadow:var(--ombre); cursor:pointer;
}
#btnBack:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(29,51,84,.12);}
#hdrTitle{font-weight:600; font-size:1.15rem; flex:1; line-height:1.1;}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:46%;}
.dot{width:10px; height:10px; border-radius:50%; background:#C9D6E8;}
.dot.ok{background:var(--menthe);} .dot.ko{background:var(--corail);} .dot.cur{background:var(--mandarine);}

/* ---------- Accueil ---------- */
#home h1{font-size:1.7rem; margin:4px 0 2px; font-weight:700;}
#home .sub{color:var(--encre2); margin:0 0 12px; font-size:.95rem;}
.rangee-paliers{display:flex; justify-content:center; gap:8px; margin:6px 0 8px; flex-wrap:wrap;}
.puce-palier{
  min-height:40px; padding:6px 18px; border-radius:999px; font-family:inherit;
  font-weight:700; font-size:.92rem; cursor:pointer;
  border:2.5px solid color-mix(in srgb, var(--encre) 22%, white); background:var(--carte); color:var(--encre);
}
.puce-palier.actif{background:var(--mandarine); border-color:var(--mandarine); color:#fff;}
/* Palier verrouillé (CHARTE §15) : au-delà du niveau du profil actif, tant
   que son paquet cadeau n’a pas été ouvert une première fois. */
.puce-palier.verrouille{opacity:.5; cursor:not-allowed;}
.note-palier{text-align:center; font-size:.82rem; color:var(--encre2); opacity:.85; margin:0 0 12px;}

.cards{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.card{
  background:var(--carte); border:none; border-radius:var(--r); padding:16px 12px 14px;
  box-shadow:var(--ombre); cursor:pointer; text-align:center; font-family:inherit; color:var(--encre);
  display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .08s;
}
.card:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(29,51,84,.12);}
.card .ico{font-size:2rem; line-height:1;}
.card .nom{font-weight:600; font-size:1.02rem;}
.card .det{font-size:.78rem; color:var(--encre2);}
.card .stars{font-size:.85rem; letter-spacing:2px; min-height:1.1em;}

/* Palier bonus (CHARTE §15) */
.bloc-bonus{
  margin-top:18px; border-radius:var(--r); padding:14px 12px;
  border:3px dashed var(--soleil); background:color-mix(in srgb, var(--soleil) 14%, white);
}
.bloc-bonus h3{text-align:center; font-size:1rem; margin:0 0 2px; color:color-mix(in srgb, var(--soleil) 55%, black 30%);}
.bloc-bonus .note-palier{margin:2px 0 10px;}
.paquet-cadeau{
  display:flex; flex-direction:column; align-items:center; gap:.7rem;
  width:100%; border:none; background:transparent; padding:1rem .5rem; cursor:pointer;
  min-height:44px; font-family:inherit;
}
.paquet-cadeau-boite{
  position:relative; width:5.6rem; height:4.6rem; border-radius:14px;
  background:linear-gradient(180deg, var(--corail), color-mix(in srgb, var(--corail) 70%, black 15%));
  border:3px solid color-mix(in srgb, var(--corail) 55%, black 20%);
  box-shadow:0 5px 0 color-mix(in srgb, var(--corail) 50%, black 25%);
  transition:transform .15s ease, box-shadow .15s ease;
}
.paquet-cadeau:active .paquet-cadeau-boite{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--corail) 50%, black 25%);}
.paquet-cadeau-ruban-v{position:absolute; left:50%; top:0; bottom:0; width:14px; margin-left:-7px; background:var(--soleil);}
.paquet-cadeau-ruban-h{position:absolute; top:50%; left:0; right:0; height:14px; margin-top:-7px; background:var(--soleil);}
.paquet-cadeau-noeud{position:absolute; left:50%; top:-1rem; transform:translateX(-50%); font-size:1.9rem; line-height:1;}
.paquet-cadeau-texte{font-weight:700; font-size:.88rem; text-align:center; color:color-mix(in srgb, var(--encre) 85%, white);}
@keyframes paquet-cadeau-pop{
  0%{ transform:scale(1) rotate(0deg); opacity:1; }
  35%{ transform:scale(1.18) rotate(-5deg); opacity:1; }
  100%{ transform:scale(.25) rotate(10deg); opacity:0; }
}
.paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{animation:paquet-cadeau-pop .45s ease forwards;}
.paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-texte{opacity:0; transition:opacity .2s ease;}
@media (prefers-reduced-motion:reduce){
  .paquet-cadeau.paquet-cadeau-ouverture .paquet-cadeau-boite{animation:none; opacity:0; transition:opacity .3s ease;}
}

/* ---------- Écran de jeu ---------- */
#qText{
  font-size:1.05rem; font-weight:600; text-align:center; margin:4px 4px 3px;
  line-height:1.35; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
}
.sous-consigne{text-align:center; font-size:.85rem; color:var(--encre2); margin:0 0 10px; line-height:1.35;}
.btn-voix{
  border:none; background:var(--carte); box-shadow:var(--ombre); border-radius:12px;
  min-width:40px; min-height:40px; font-size:1.05rem; cursor:pointer; font-family:inherit; padding:0 10px;
}
.btn-voix:active{transform:translateY(2px);}

/* Le vitrail : verre saturé, plomb sombre, sur un fond clair de table lumineuse. */
.vitrail{
  background:var(--carte); border-radius:var(--r); box-shadow:var(--ombre);
  padding:8px; margin-bottom:10px;
}
.vitrail svg{display:block; width:100%; height:auto;}
.piece{cursor:pointer;}
.piece .verre{stroke:var(--plomb); stroke-width:3; stroke-linejoin:round; transition:fill-opacity .12s;
  vector-effect:non-scaling-stroke;}
/* La sélection ne peut PAS être orange : le verre l’est aussi (VERRES[0]
   vaut exactement --mandarine), et le marqueur disparaissait sur les pièces
   orange. Elle ne peut pas non plus être verte ni rouge, réservés au juste et
   au faux (§18). L’encre foncée seule, essayée d’abord, se lisait mal sur le
   violet et le bleu ; on double donc le trait d’un HALO BLANC, exactement
   comme le marqueur d’angle — c’est le halo qui fait tenir la couleur sur
   n’importe quel fond, pas la couleur elle-même.
   Le halo est un second contour dessiné SOUS le verre : invisible tant que la
   pièce n’est pas choisie, il n’encombre rien. */
.piece .halo{fill:none; stroke:transparent; stroke-width:12; stroke-linejoin:round;
  vector-effect:non-scaling-stroke; pointer-events:none;}
.piece.sel .halo{stroke:#FFFFFF;}
.piece.sel .verre{stroke:var(--selection); stroke-width:6; stroke-dasharray:13 8;}
.piece.bon .verre{stroke:var(--menthe); stroke-width:6;}
.piece.faux .verre{stroke:var(--corail); stroke-width:6;}

/* ---- LE CONVOYEUR ----
   `touch-action:none` sur la SEULE zone du tapis : ailleurs la page défile
   normalement (charte §19, et `touch-action` ne s’hérite pas — les pièces
   sont donc visées explicitement). Sans cela, viser une pièce qui bouge
   ferait défiler la page une fois sur deux. */
.convoyeur, .convoyeur *{touch-action:none;}
.convoyeur{-webkit-user-select:none; user-select:none;}
.tapis-fond{fill:#E4EAF3;}
.tapis-bande{fill:#D2DCEA;}
.tapis-rail{stroke:#B9C7DA; stroke-width:3; stroke-linecap:round;}
.piece-tapis{cursor:pointer;}
.piece-tapis .verre{transition:none;}
.piece-tapis.ratee .verre{opacity:.4;}
/* LA HAUTEUR DU BLOC DE CONSIGNE EST RÉSERVÉE. Sans cela le tapis SAUTE d’une
   consigne à l’autre : « Attrape les triangles rectangles ! » passe sur deux
   lignes quand « Attrape les carrés ! » tient sur une, et la sous-consigne
   n’existe que pour certaines formes. Mesuré avant correction : jusqu’à 52 px
   d’écart au CE1, sur un jeu où l’enfant vise une cible en mouvement — un
   tapis qui se déplace sous le doigt entre deux phases est inacceptable. */
/* Hauteurs FIXES, pas des minimums : un minimum laisse encore grandir, et
   c’est la croissance qui déplace le tapis. Les valeurs viennent de la
   mesure — 74 px pour la consigne la plus longue (« Attrape les triangles
   rectangles ! », deux lignes) et 37 px pour une sous-consigne de deux
   lignes — arrondies vers le haut et exprimées en rem pour suivre la taille
   de police du système. */
#game.tapis-en-cours #qText{height:5rem; margin:0; display:flex; align-items:center;
  justify-content:center; gap:6px; flex-wrap:wrap;}
#game.tapis-en-cours .sous-consigne{height:2.8rem; margin:0 0 10px;
  display:flex; align-items:center; justify-content:center;}

/* La manette de l’atelier. Trois crans qui se DISTINGUENT au premier coup
   d’œil — l’enfant ne lit pas « Moyen », il voit le lièvre — et une couleur
   par cran, du calme à l’urgence. */
.barre-convoyeur{display:flex; gap:10px; justify-content:center; align-items:center;
  flex-wrap:wrap; margin:12px 0 4px;}
.barre-convoyeur .manette{display:flex; gap:5px; background:#E1E9F5; border-radius:16px;
  padding:5px; box-shadow:inset 0 2px 4px rgba(29,51,84,.10);}
.cran{border:0; background:transparent; border-radius:12px; padding:7px 11px; font:inherit;
  font-weight:700; font-size:.82rem; color:var(--encre2); cursor:pointer;
  display:flex; align-items:center; gap:5px; transition:transform .12s, background .12s;}
.cran .emo{font-size:1.15rem; line-height:1;}
.cran:active{transform:scale(.94);}
.cran.on{color:#fff; box-shadow:0 3px 0 rgba(29,51,84,.16);}
.cran.on[data-cran="0"]{background:var(--menthe-t);}
.cran.on[data-cran="1"]{background:var(--mandarine);}
.cran.on[data-cran="2"]{background:var(--corail-t);}
.btn-pause{border:0; background:var(--soleil); border-radius:16px; padding:9px 16px; font:inherit;
  font-weight:800; font-size:.9rem; color:var(--encre); cursor:pointer;
  display:flex; align-items:center; gap:6px;
  box-shadow:0 3px 0 rgba(29,51,84,.16); transition:transform .12s;}
.btn-pause:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(29,51,84,.16);}
.btn-pause.reprend{background:var(--menthe);}
.btn-pause .emo{font-size:1.05rem; line-height:1;}
.compteur-prises{display:flex; align-items:center; gap:5px; font-weight:800;
  color:var(--encre); font-size:.95rem; background:#fff; border-radius:14px;
  padding:7px 13px; box-shadow:0 2px 6px rgba(29,51,84,.10);}

/* L’ANNONCE DU CHANGEMENT DE CONSIGNE. Les enfants le rataient : ils
   continuaient sur la forme précédente et cumulaient les erreurs sans
   comprendre pourquoi. Deux réponses complémentaires — la consigne GROSSIT
   et change de couleur au moment du changement, ce qui attrape l’œil ; et
   une étiquette courte reste POSÉE SUR LE TAPIS, là où l’enfant regarde
   pendant qu’il joue, parce que l’en-tête sort du champ dès que la partie
   reprend. */
/* LA CONSIGNE NE GROSSIT PAS, ELLE CHANGE DE COULEUR. Une première version
   l’agrandissait de 16 % : sur un écran de 375 px, « Attrape les triangles
   rectangles ! » occupe déjà toute la largeur, et le texte débordait des deux
   côtés. Le mouvement est donc porté par l’ÉTIQUETTE DU TAPIS, qui est courte
   et a de la place — et qui a l’avantage d’être là où l’enfant regarde. */
#game.tapis-en-cours #qText.annonce{color:var(--mandarine-f);}
@keyframes annonce-etiquette{
  0%{transform:scale(1);}
  26%{transform:scale(1.12);}
  100%{transform:scale(1);}
}
.etiquette-tapis{fill:#fff; stroke:#C3D0E2; stroke-width:2;}
.etiquette-texte{font-size:17px; font-weight:800; fill:var(--encre); dominant-baseline:middle;}
.etiquette-oeil{font-size:15px; fill:var(--encre2); dominant-baseline:middle;}
/* L’étiquette grandit depuis son bord GAUCHE : depuis son centre, une
   étiquette large sortirait du tapis par la droite. */
#etiquetteTapis{transform-box:fill-box; transform-origin:left center;}
#etiquetteTapis.annonce{animation:annonce-etiquette .9s ease-out;}
#etiquetteTapis.annonce .etiquette-tapis{fill:#FFF3E6; stroke:var(--mandarine);}
@media (prefers-reduced-motion:reduce){
  /* Le mouvement disparaît, la couleur reste : le signal ne doit jamais
     dépendre d’une animation. */
  #etiquetteTapis.annonce{animation:none;}
}
.voile-pause{fill:rgba(29,51,84,.55);}
.texte-pause{fill:#fff; font-size:22px; font-weight:800; text-anchor:middle;}
#endBilan{margin:10px auto 18px; max-width:320px;}
#endBilan table{width:100%; border-collapse:collapse; font-size:.86rem;}
#endBilan th{font-weight:700; color:var(--encre2); padding:3px 6px; text-align:center;}
#endBilan th:first-child{text-align:left;}
#endBilan td{padding:3px 6px; text-align:center; color:var(--encre);}
#endBilan td:first-child{text-align:left; font-weight:600;}
#endBilan tr+tr{border-top:1px solid #E3EAF4;}
.piece.manque .verre{stroke:var(--menthe); stroke-width:6; stroke-dasharray:9 6;}
/* Repères tactiles (litige, rosace). La CIBLE n’est plus un élément du DOM
   mais de la géométrie : on mesure la distance du toucher à chaque cible et
   on tranche (cf. `cibleTouchee`). Ne restent ici que les REPÈRES visibles,
   fins — sans eux l’enfant taperait au hasard, trop épais ils
   étoufferaient la figure.
   (Une déclaration orpheline traînait ici, reste d’une règle supprimée : sans
   sélecteur ni accolade ouvrante, le parseur CSS l’avalait AVEC la règle
   suivante — `.indice` était donc sans effet, et les repères de sommet
   s’affichaient en noir par défaut. Une erreur de syntaxe CSS ne se signale
   nulle part : elle se voit à l’écran, ou pas du tout.) */
/* Le réseau de plomb de la verrière CE1 : un décor, jamais une cible. */
.serti{fill:none; stroke:var(--plomb); stroke-width:5; stroke-linejoin:round;
  pointer-events:none; vector-effect:non-scaling-stroke; opacity:.55;}
.indice{fill:rgba(29,51,84,.30); stroke:rgba(29,51,84,.30); stroke-width:3.5; stroke-linecap:round; pointer-events:none; vector-effect:non-scaling-stroke;}
.indice-trait{fill:none; stroke:rgba(29,51,84,.34); stroke-width:3.5; stroke-dasharray:7 6; stroke-linecap:round; pointer-events:none; vector-effect:non-scaling-stroke;}
/* Le quadrilatère visé est ÉCLAIRÉ : « ce quadrilatère » ne désignait rien. */
.surbrillance{fill:rgba(255,201,60,.42); stroke:var(--soleil); stroke-width:3; vector-effect:non-scaling-stroke;}
.anneau-vise{stroke:var(--soleil) !important; stroke-width:6 !important;}
.trace-bon{stroke:var(--menthe-t) !important; fill:var(--menthe-t) !important; stroke-width:6 !important; stroke-dasharray:none !important; opacity:1 !important;}
.trace-faux{stroke:var(--corail) !important; fill:var(--corail) !important; stroke-width:6 !important; stroke-dasharray:none !important; opacity:1 !important;}
.trace-choisi{stroke:var(--selection) !important; fill:var(--selection) !important; stroke-width:6 !important; stroke-dasharray:none !important; opacity:1 !important;}
.trace-halo{fill:none; stroke:transparent; stroke-width:13; stroke-linecap:round; pointer-events:none; vector-effect:non-scaling-stroke;}
/* Le halo reste BLANC quoi qu’il porte : sélection, juste ou faux. Sans
   cette règle il héritait de la couleur du verdict et redoublait le trait au
   lieu de le détacher du verre. */
.trace-halo.trace-choisi, .trace-halo.trace-bon, .trace-halo.trace-faux{
  stroke:#FFFFFF !important; fill:none !important; stroke-width:13 !important;}
/* Le décompte animé de cp-decrire : côtés colorés un à un, sommets pointés. */
.trait-compte{stroke:var(--corail); stroke-width:6; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.point-compte{fill:var(--corail); stroke:#fff; stroke-width:2; vector-effect:non-scaling-stroke;}
.marque-angle-halo{fill:none; stroke:#fff; stroke-width:7.5; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.marque-angle{fill:none; stroke:#12233C; stroke-width:3.4; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.sommet-angle{fill:#fff; stroke:#12233C; stroke-width:2.2; vector-effect:non-scaling-stroke;}

/* Réponses : QCM texte, QCM illustré (relations), présentoir de pièces */
#answers{display:grid; grid-template-columns:1fr; gap:10px;}
#answers.compact{gap:7px;}
#answers.duo{grid-template-columns:1fr 1fr;}
.rep{
  border:none; border-radius:16px; padding:13px 12px; font-family:inherit;
  font-size:1rem; font-weight:600; background:var(--carte); color:var(--encre);
  box-shadow:var(--ombre); cursor:pointer; min-height:44px; text-align:left;
  display:flex; align-items:center; gap:10px;
}
.rep.centre{text-align:center; justify-content:center;}
.rep:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(29,51,84,.12);}
.rep.ok{background:var(--menthe); color:#fff;}
.rep.ok .schema rect, .rep.ok .schema polygon{stroke:#fff;}
.rep.ko{background:var(--corail); color:#fff; animation:shake .35s;}
.rep.dim{opacity:.5;}
.rep .schema{flex:none; width:58px; height:48px;}
/* Choix multiple : une case cochée, avant validation. */
.rep.coche{outline:3px solid #12233C; outline-offset:-3px; background:color-mix(in srgb, #12233C 8%, white);}
/* CHARTE §13/A3 : la hauteur d’un bloc de réponse ne dépend pas de la
   longueur du texte — sinon l’écran se met à défiler dès qu’une phrase
   passe sur trois lignes. */
#answers.compact .rep{padding:7px 9px; font-size:.9rem; gap:8px;}
#answers.compact .rep .txt{line-height:1.2;}
#answers.compact .rep .schema{width:50px; height:42px;}
#answers.compact .rep .relire{min-width:34px; min-height:34px;}
.rep .txt{flex:1; line-height:1.3;}
.rep .relire{
  flex:none; border:none; background:color-mix(in srgb, var(--encre) 8%, white);
  border-radius:10px; min-width:38px; min-height:38px; font-size:.95rem; cursor:pointer; font-family:inherit;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Présentoir (portrait-robot) : les pièces candidates, en grand */
.presentoir{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.presentoir .rep{justify-content:center; padding:5px;}
.presentoir svg{width:100%; height:66px;}

#feedback{
  text-align:center; font-weight:700; margin-top:9px; min-height:1.8em;
  font-size:1.02rem; line-height:1.35; padding:0 6px;
}
#feedback.bon{color:var(--menthe-t);} #feedback.mauvais{color:var(--corail-t);}
/* CHARTE §18 : dans un message d’erreur, la BONNE réponse reste en vert. */
#feedback .correction-attendue{color:var(--menthe-t);}

#btnValider, #btnNext{
  display:none; margin:9px auto 0; border:none; border-radius:18px;
  padding:11px 32px; font-family:inherit; font-size:1.05rem; font-weight:700;
  color:#fff; cursor:pointer;
}
#btnValider{background:var(--menthe); box-shadow:0 4px 0 var(--menthe-t);}
#btnNext{background:var(--mandarine); box-shadow:0 4px 0 var(--mandarine-f);}
#btnValider:active, #btnNext:active{transform:translateY(3px);}
/* RETOUR ARRIÈRE AVANT VALIDATION (B4.2). Le §18 interdit l’essai-erreur
   APRÈS la réponse, pas la relecture de son propre brouillon avant de la
   rendre : c’est le raisonnement déjà retenu en M38 pour la pose des
   sommets. Discret — c’est un outil, pas la réponse — et verrouillé avec le
   reste à la validation. */
#btnEffacer{
  display:block; margin:8px auto 0; border:2px solid var(--encre2); border-radius:14px;
  background:transparent; color:var(--encre2); font-family:inherit; font-size:.85rem;
  font-weight:700; padding:7px 18px; cursor:pointer; min-height:40px;
}
#btnEffacer[hidden]{display:none;}
#btnEffacer:active{transform:translateY(2px);}

/* ---------- Fin ---------- */
#end{text-align:center; padding-top:8vh;}
#endStars{font-size:3.4rem; letter-spacing:8px; margin:10px 0;}
#endStars span{display:inline-block; animation:pop .5s backwards;}
#endStars span:nth-child(2){animation-delay:.25s;} #endStars span:nth-child(3){animation-delay:.5s;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
#endMsg{font-size:1.3rem; font-weight:700;}
#endScore{color:var(--encre2); margin:6px 0 22px;}
#end .actions-fin{display:flex; gap:12px; justify-content:center;}
#end .actions-fin button{
  border:none; border-radius:18px; padding:13px 26px; font-family:inherit;
  font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:var(--ombre); min-height:44px;
}
#bRejouer{background:var(--mandarine); color:#fff; box-shadow:0 4px 0 var(--mandarine-f);}

/* ---------- Retour à la coquille (CHARTE §7) ---------- */
.barre-accueil{display:flex; margin:0 0 8px;}
.bouton-menu{
  min-height:44px; border-radius:14px; padding:0 14px; cursor:pointer; font-family:inherit;
  border:2px solid color-mix(in srgb, var(--encre) 25%, white);
  background:var(--carte); color:var(--encre); font-weight:600; font-size:.95rem;
  display:inline-flex; align-items:center; gap:6px;
}
.bouton-menu:active{transform:translateY(2px);}
.modale-fond{

  display:flex; align-items:center; justify-content:center;

  text-align:center; box-shadow:0 12px 34px rgba(29,51,84,.3);
}
.modale-boite p{font-size:1.05rem; font-weight:600; margin:0 0 18px; color:var(--encre);}
.modale-boutons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  border:none; border-radius:16px; padding:12px 20px; font-family:inherit;
  font-size:1rem; font-weight:700; cursor:pointer; min-height:44px;
}
.modale-boutons .m-rester{background:var(--carte); color:var(--encre); border:2px solid var(--encre);}
.modale-boutons .m-revenir{background:var(--mandarine); color:#fff; box-shadow:0 4px 0 var(--mandarine-f);}

/* ---------- Confettis (CHARTE §4) ---------- */
#confettis-conteneur{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
.confetti{position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
  animation-name:chute-confetti; animation-timing-function:ease-in; animation-fill-mode:forwards;}
@keyframes chute-confetti{ to{ transform:translateY(105vh) rotate(340deg); opacity:.75; } }
@media (prefers-reduced-motion:reduce){ .confetti{display:none; animation:none;} }

[hidden]{display:none !important;}
@media (prefers-color-scheme: dark){
  html, body{background:var(--ciel) !important; color:var(--encre) !important;}
  .card, .rep, .vitrail, #btnBack, .puce-palier, .btn-voix{background:var(--carte) !important; color:var(--encre) !important;}

}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;} }

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ============================================================
   OUTILS DE LANGUE (cf. CLAUDE.md)
   Les énoncés sont ASSEMBLÉS : élision et accord se calculent, ne
   s’écrivent jamais en dur.
   ============================================================ */
function deElision(mot){
  return /^[aeiouyàâäéèêëïîôöùûü]/i.test(mot) ? 'd’' + mot : 'de ' + mot;
}
function accordePluriel(base, genre){ return base + (genre === 'f' ? 'es' : 's'); }
const maj = s => s.charAt(0).toUpperCase() + s.slice(1);

/* Noms des formes. `genre` sert aux accords, `pluriel` aux consignes
   « touche tous les… ». Le mot POLYGONE n’apparaît qu’au CE2 : au CP et
   au CE1, une pièce à 5 ou 6 côtés se dit simplement « une forme ». */
const NOMS = {
  disque:      {sing:'disque',      plur:'disques',      genre:'m', art:'un'},
  cercle:      {sing:'cercle',      plur:'cercles',      genre:'m', art:'un'},
  carre:       {sing:'carré',       plur:'carrés',       genre:'m', art:'un'},
  rectangle:   {sing:'rectangle',   plur:'rectangles',   genre:'m', art:'un'},
  triangle:    {sing:'triangle',    plur:'triangles',    genre:'m', art:'un'},
  triangleRect:{sing:'triangle rectangle', plur:'triangles rectangles', genre:'m', art:'un'},
  losange:     {sing:'losange',     plur:'losanges',     genre:'m', art:'un'},
  quadrilatere:{sing:'quadrilatère',plur:'quadrilatères',genre:'m', art:'un'},
  pentagone:   {sing:'pentagone',   plur:'pentagones',   genre:'m', art:'un'},
  hexagone:    {sing:'hexagone',    plur:'hexagones',    genre:'m', art:'un'},
  polygone:    {sing:'polygone',    plur:'polygones',    genre:'m', art:'un'},
  forme:       {sing:'forme',       plur:'formes',       genre:'f', art:'une'}
};
const nomDe   = k => (NOMS[k] || NOMS.forme).sing;
const plurDe  = k => (NOMS[k] || NOMS.forme).plur;
const artDe   = k => (NOMS[k] || NOMS.forme).art;
const avecArt = k => artDe(k) + ' ' + nomDe(k);
const leDe    = k => ((NOMS[k] || NOMS.forme).genre === 'f' ? 'la ' : 'le ') + nomDe(k);

/* ============================================================
   GÉOMÉTRIE — tout se calcule depuis les sommets
   ============================================================ */
const TAU = Math.PI * 2;
const degres = r => r * 180 / Math.PI;
const hyp = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);

function tournerPts(pts, theta){
  const c = Math.cos(theta), s = Math.sin(theta);
  return pts.map(([x, y]) => [x * c - y * s, x * s + y * c]);
}
function placerPts(pts, cx, cy, echelle){
  return pts.map(([x, y]) => [cx + x * echelle, cy + y * echelle]);
}
function centre(pts){
  const n = pts.length;
  return [pts.reduce((s, p) => s + p[0], 0) / n, pts.reduce((s, p) => s + p[1], 0) / n];
}
function longueursCotes(pts){
  return pts.map((p, i) => hyp(p, pts[(i + 1) % pts.length]));
}
/* Angle intérieur au sommet i, en degrés. */
function anglesDeg(pts){
  const n = pts.length;
  return pts.map((p, i) => {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const u = [a[0] - p[0], a[1] - p[1]], v = [b[0] - p[0], b[1] - p[1]];
    const cos = (u[0] * v[0] + u[1] * v[1]) / (Math.hypot(...u) * Math.hypot(...v));
    return degres(Math.acos(Math.max(-1, Math.min(1, cos))));
  });
}
/* Classement d’un angle À L’ŒIL (CE1). Le programme autorise de conclure
   sans équerre « quand il n’y a aucun doute » : on ne produit donc jamais
   d’angle entre 75° et 105° hors de la tolérance du droit — la
   vérification instrumentée appartient à M35. */
const TOL_DROIT = 3, AIGU_FRANC = 75, OBTUS_FRANC = 105;
function classeAngle(a){
  if (Math.abs(a - 90) <= TOL_DROIT) return 'droit';
  return a < 90 ? 'aigu' : 'obtus';
}
const angleFranc = a => Math.abs(a - 90) <= TOL_DROIT || a <= AIGU_FRANC || a >= OBTUS_FRANC;

const presqueEgal = (a, b, tol) => Math.abs(a - b) <= (tol === undefined ? 0.06 : tol) * Math.max(a, b);

/* Propriétés d’une pièce, CALCULÉES. C’est cette fonction qui fait
   autorité partout : nommage, justification, réfutation et corrections
   en découlent, si bien qu’aucune ne peut contredire le dessin. */
function proprietes(piece){
  if (piece.forme === 'disque' || piece.forme === 'cercle') {
    return {rond:true, nbCotes:0, nbSommets:0, angles:[], cotes:[],
            tousAnglesDroits:false, tousCotesEgaux:false, opposesEgaux:false};
  }
  const pts = piece.pts;
  const cotes = longueursCotes(pts), angles = anglesDeg(pts);
  const tousAnglesDroits = angles.every(a => classeAngle(a) === 'droit');
  const tousCotesEgaux = cotes.every(l => presqueEgal(l, cotes[0]));
  const opposesEgaux = cotes.length === 4 &&
    presqueEgal(cotes[0], cotes[2]) && presqueEgal(cotes[1], cotes[3]);
  return {rond:false, nbCotes:pts.length, nbSommets:pts.length, angles, cotes,
          tousAnglesDroits, tousCotesEgaux, opposesEgaux};
}

/* Nom déduit des propriétés — jamais lu sur une étiquette posée à côté du
   dessin. `vocabulaire` borne ce que le palier sait dire. */
function nommerCalcule(piece, vocabulaire){
  const p = proprietes(piece);
  if (piece.forme === 'cercle') return 'cercle';
  if (piece.forme === 'disque') return 'disque';
  if (p.nbCotes === 3) {
    if (vocabulaire.includes('triangleRect') && p.angles.some(a => classeAngle(a) === 'droit')) return 'triangleRect';
    return 'triangle';
  }
  if (p.nbCotes === 4) {
    if (p.tousAnglesDroits && p.tousCotesEgaux) return 'carre';
    if (p.tousAnglesDroits) return 'rectangle';
    if (p.tousCotesEgaux && vocabulaire.includes('losange')) return 'losange';
    return vocabulaire.includes('quadrilatere') ? 'quadrilatere' : 'forme';
  }
  if (p.nbCotes === 5) return vocabulaire.includes('pentagone') ? 'pentagone' : 'forme';
  if (p.nbCotes === 6) return vocabulaire.includes('hexagone') ? 'hexagone' : 'forme';
  return 'forme';
}

/* ---- Constructeurs : sommets en repère unité, centrés sur l’origine ----
   Toute figure reçoit ensuite une rotation LIBRE : le programme parle de
   reconnaissance, pas de prototypes en position canonique. Un carré posé
   sur un sommet reste un carré. */
const C = {
  carre: () => [[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]],
  rectangle: (r) => { const l = .5, h = .5 / (r || 1.7); return [[-l,-h],[l,-h],[l,h],[-l,h]]; },
  losange: (r) => { const a = .58, b = a / (r || 1.8); return [[0,-b],[a,0],[0,b],[-a,0]]; },
  triangleRect: (r) => { const a = .8, b = a / (r || 1.4); return recentre([[0,0],[a,0],[0,b]]); },
  triangleIso: (r) => { const b = .8, h = b * (r || 1.0); return recentre([[-b/2,0],[b/2,0],[0,-h]]); },
  /* Triangle scalène à angles francs : on tire jusqu’à en obtenir un dont
     aucun angle n’est ambigu (ni proche de 90°, ni entre 75° et 105°). */
  triangleQuelconque: () => {
    for (let essai = 0; essai < 200; essai++) {
      const p = recentre([[0,0],[0.9,0],[0.15 + Math.random()*0.6, -(0.35 + Math.random()*0.5)]]);
      const a = anglesDeg(p);
      if (a.every(angleFranc) && a.every(x => classeAngle(x) !== 'droit')) return p;
    }
    return recentre([[0,0],[0.9,0],[0.66,-0.42]]);
  },
  /* Un quadrilatère qui n’est RIEN d’autre : ni carré, ni rectangle, ni
     losange. Le convoyeur du CE2 en a besoin — reconnaître un quadrilatère
     quelconque comme quadrilatère est justement ce qui distingue la
     catégorie de la forme. Il est tiré puis RELU (cf. `piecePourNom`) :
     on ne se fie pas au nom qu’on a voulu lui donner. */
  quadrilatereQuelconque: () => recentre([
    [-0.5 + Math.random()*0.12, -0.42 - Math.random()*0.12],
    [ 0.46 + Math.random()*0.12, -0.30 + Math.random()*0.14],
    [ 0.34 - Math.random()*0.14,  0.46 + Math.random()*0.10],
    [-0.44 - Math.random()*0.10,  0.28 + Math.random()*0.16]
  ]),
  polygoneRegulier: (n, irregularite) => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const th = -Math.PI/2 + i * TAU / n;
      const r = 0.55 * (1 + (irregularite || 0) * (Math.random() - 0.5));
      pts.push([Math.cos(th) * r, Math.sin(th) * r]);
    }
    return recentre(pts);
  }
};
function recentre(pts){ const [cx, cy] = centre(pts); return pts.map(([x, y]) => [x - cx, y - cy]); }

/* Fabrique une pièce posée : forme + rotation libre + position + couleur. */
const VERRES = ['#FF8A3D','#5AB4DC','#2EC4A6','#FFC93C','#FF5D5D','#9B5DE5','#4D96FF','#F76BA4'];
/* LE JAUNE DU REPÈRE EST RÉSERVÉ. Depuis que les consignes de la rosace
   désignent l’objet visé par sa couleur — « le cercle jaune », « entouré en
   jaune » —, ce jaune ne doit plus rien désigner d’autre à l’écran. Or la
   rosace en portait deux : son hexagone central ET son quatrième pétale, tous
   deux exactement `--soleil`. La liste des verres utilisables se DÉDUIT donc
   du jaune du repère au lieu d’être recopiée à la main, pour qu’une couleur
   ajoutée demain ne réintroduise pas la collision en silence. */
const JAUNE_REPERE = '#FFC93C';
const VERRES_HORS_REPERE = VERRES.filter(c => c.toUpperCase() !== JAUNE_REPERE);
let compteurPiece = 0;
function creerPiece(forme, opts){
  const o = opts || {};
  const theta = o.theta !== undefined ? o.theta : Math.random() * TAU;
  const taille = o.taille || 70;
  const p = {id:'p' + (++compteurPiece), forme, couleur:o.couleur || pioche(VERRES)};
  if (forme === 'disque' || forme === 'cercle') {
    p.centre = [o.cx || 0, o.cy || 0];
    p.rayon = taille * 0.5;
  } else {
    let base;
    if (forme === 'carre') base = C.carre();
    else if (forme === 'rectangle') base = C.rectangle(o.rapport || (1.5 + Math.random() * 0.8));
    else if (forme === 'losange') base = C.losange(o.rapport || (1.5 + Math.random() * 0.7));
    else if (forme === 'triangleRect') base = C.triangleRect(o.rapport);
    else if (forme === 'triangle') base = Math.random() < 0.5 ? C.triangleIso(0.9) : C.triangleQuelconque();
    else if (forme === 'quadrilatere') base = C.quadrilatereQuelconque();
    else if (forme === 'pentagone') base = C.polygoneRegulier(5, 0.35);
    else if (forme === 'hexagone') base = C.polygoneRegulier(6, 0.35);
    else base = C.carre();
    p.pts = placerPts(tournerPts(base, theta), o.cx || 0, o.cy || 0, taille);
  }
  return p;
}

/* ---- Rendu SVG ---- */
function svgPiece(p, classes){
  const cl = 'piece' + (classes ? ' ' + classes : '');
  if (p.forme === 'disque')
    return `<g class="${cl}" data-piece="${p.id}">`
      + `<circle class="halo" cx="${p.centre[0]}" cy="${p.centre[1]}" r="${p.rayon}"/>`
      + `<circle class="verre" cx="${p.centre[0]}" cy="${p.centre[1]}" r="${p.rayon}" fill="${p.couleur}"/></g>`;
  if (p.forme === 'cercle')
    /* Le cercle est le fil de plomb qui fait le tour ; le disque est le
       verre coloré à l’intérieur. Un trait fin étant une cible tactile
       exécrable, un anneau transparent de 24 px double le trait visible. */
    return `<g class="${cl}" data-piece="${p.id}">`
      + `<circle cx="${p.centre[0]}" cy="${p.centre[1]}" r="${p.rayon}" fill="none" stroke="transparent" stroke-width="24"/>`
      + `<circle class="halo" cx="${p.centre[0]}" cy="${p.centre[1]}" r="${p.rayon}"/>`
      + `<circle class="verre" cx="${p.centre[0]}" cy="${p.centre[1]}" r="${p.rayon}" fill="none"/></g>`;
  const pts = p.pts.map(q => q.join(',')).join(' ');
  return `<g class="${cl}" data-piece="${p.id}">`
    + `<polygon class="halo" points="${pts}"/>`
    + `<polygon class="verre" points="${pts}" fill="${p.couleur}"/></g>`;
}
function boiteEnglobante(pieces){
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  pieces.forEach(p => {
    const pts = p.pts || [[p.centre[0] - p.rayon, p.centre[1] - p.rayon], [p.centre[0] + p.rayon, p.centre[1] + p.rayon]];
    pts.forEach(([x, y]) => { x1 = Math.min(x1, x); x2 = Math.max(x2, x); y1 = Math.min(y1, y); y2 = Math.max(y2, y); });
  });
  return {x1, y1, x2, y2};
}
/* viewBox ajustée au contenu : les pièces sont posées en coordonnées
   libres, c’est le cadre qui vient à elles. */
function cadrer(pieces, marge){
  const b = boiteEnglobante(pieces), m = marge === undefined ? 26 : marge;
  return [b.x1 - m, b.y1 - m, (b.x2 - b.x1) + 2 * m, (b.y2 - b.y1) + 2 * m].join(' ');
}
/* La scène a une TAILLE CONSTANTE. Une viewBox ajustée au contenu, comme
   dans une première version, faisait varier la hauteur rendue d’une manche
   à l’autre — deux carrés partageant un sommet occupaient deux fois plus de
   place que deux rectangles accolés, et l’écran finissait par défiler. On
   fixe donc le cadre et c’est la figure qui vient s’y loger, mise à
   l’échelle uniformément : les proportions sont intactes, l’encombrement
   ne bouge plus. Les traits (plomb, cibles tactiles, repères) sont en
   `non-scaling-stroke` pour garder leur épaisseur À L’ÉCRAN, sans quoi une
   petite figure verrait ses cibles tactiles rétrécir avec elle. */
const SCENE_L = 400, SCENE_H_DEFAUT = 236, HAUTEUR_RELATIONS = 104;
function afficherScene(pieces, extra, hauteur, cadre){
  const svg = $('svgScene');
  const H = hauteur || SCENE_H_DEFAUT;
  svg.setAttribute('viewBox', `0 0 ${SCENE_L} ${H}`);
  const c = cadre || {x:0, y:0, l:SCENE_L, h:H};
  svg.innerHTML = `<g id="scenePieces" transform="${ajusterA(pieces, c)}">`
    + pieces.map(p => svgPiece(p)).join('') + (extra || '') + `</g>`;
  $('vitrail').hidden = false;
}
/* Translation + homothétie qui logent un contenu dans un cadre donné. */
function ajusterA(pieces, cadre, marge){
  const b = boiteEnglobante(pieces), m = marge === undefined ? 20 : marge;
  const k = Math.min((cadre.l - 2*m) / Math.max(1, b.x2 - b.x1), (cadre.h - 2*m) / Math.max(1, b.y2 - b.y1));
  const tx = cadre.x + cadre.l/2 - (b.x1 + b.x2)/2 * k;
  const ty = cadre.y + cadre.h/2 - (b.y1 + b.y2)/2 * k;
  return `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(4)})`;
}

/* ---- Petit schéma illustrant une proposition (CP) ----
   Décision de conception : les propositions de `cp-relations` portent
   TOUJOURS un schéma, pas seulement quand la voix manque. Un enfant de CP
   ne lit pas ces phrases ; sans image, le mini-jeu deviendrait un test de
   lecture. La voix redevient alors un plus et non un pré-requis, ce que
   la charte §5 exige. */
function schemaRelation(e){
  const T = (pts, fill) => `<polygon points="${pts.map(q => q.join(',')).join(' ')}" fill="${fill}" stroke="#2B3A55" stroke-width="2.5" stroke-linejoin="round"/>`;
  const A = '#FF8A3D', B = '#5AB4DC', ACC = '#2EC4A6';
  const cadre = inner => `<svg class="schema" viewBox="0 0 80 64" aria-hidden="true">${inner}</svg>`;
  const carre = (x, y, c, f) => T([[x,y],[x+c,y],[x+c,y+c],[x,y+c]], f);
  const dot = ([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="${ACC}" stroke="#2B3A55" stroke-width="2"/>`;
  if (e.modele === 'forment') {
    const n = e.n;
    if (n === 2) return cadre(T([[10,10],[70,10],[10,54]], A) + T([[70,10],[70,54],[10,54]], B));
    return cadre(T([[10,10],[40,10],[10,54]], A) + T([[40,10],[70,10],[40,54]], B) + T([[40,10],[70,54],[40,54]], ACC));
  }
  if (e.modele === 'cote-commun') {
    const f = e.a === 'carre' ? [carre(8,16,28,A), carre(36,16,28,B)]
      : [T([[8,18],[42,18],[42,46],[8,46]], A), T([[42,18],[76,18],[76,46],[42,46]], B)];
    return cadre(f.join('') + `<line x1="${e.a==='carre'?36:42}" y1="${e.a==='carre'?16:18}" x2="${e.a==='carre'?36:42}" y2="${e.a==='carre'?44:46}" stroke="${ACC}" stroke-width="5"/>`);
  }
  if (e.modele === 'sommet-commun') {
    const f = e.a === 'carre' ? [carre(6,6,26,A), carre(32,32,26,B)]
      : [T([[6,10],[36,10],[36,30],[6,30]], A), T([[36,30],[70,30],[70,52],[36,52]], B)];
    return cadre(f.join('') + dot(e.a === 'carre' ? [32,32] : [36,30]));
  }
  /* La famille « triangle et carré » : le schéma est construit à partir des
     MÊMES sommets que ceux qui décident du texte, et les pastilles vertes
     marquent EXACTEMENT les points dont la phrase parle. Une première
     version marquait un coin du carré qui n’était même pas un sommet du
     triangle, sous une phrase parlant d’un côté. */
  const cc = [[14,6],[66,6],[66,58],[14,58]];         // le carré, en clair
  const ext = carre(14,6,52,B);
  if (e.modele === 'dans') {
    /* Le schéma illustre CE QUE DIT LA PHRASE, y compris quand elle est
       fausse : « un carré est dans le triangle » montre donc un carré dans
       un triangle, et l’enfant compare cette image à la figure réelle. */
    if (e.b === 'triangle') return cadre(T([[8,58],[72,58],[40,6]], B) + carre(30,34,20,A));
    return cadre(ext + T([[28,48],[56,48],[42,22]], A));
  }
  if (e.modele === 'sommets-sur') {
    if (e.k === 1) {
      const tri = [[14,58],[52,48],[38,22]];
      return cadre(ext + T(tri, A) + dot(tri[0]));
    }
    if (e.k === 2) {
      const tri = [[14,58],[66,58],[40,26]];
      return cadre(ext + T(tri, A) + dot(tri[0]) + dot(tri[1]));
    }
    const tri = [[14,58],[66,58],[66,6]];
    return cadre(ext + T(tri, A) + tri.map(dot).join(''));
  }
  // sommet-sur-cote : le sommet marqué est bien SUR un côté, pas à un coin.
  const tri = [[28,48],[56,44],[44,6]];
  return cadre(ext + T(tri, A) + dot(tri[2]));
}

/* ---- Énoncés STRUCTURÉS ----
   Une proposition n’est pas une chaîne mais un objet : c’est ce qui permet
   de fabriquer un distracteur en ne changeant QU’UN SEUL terme (spec §3.2),
   et de rendre le texte comme le schéma depuis la même source. */
function texteRelation(e){
  /* Aucune phrase ne commence par « Il y a » ni « Je vois » : ces amorces
     n’apportent rien et allongent la lecture d’un CP. On dit ce qu’on voit,
     directement. */
  const n = e.n === 2 ? 'Deux' : 'Trois';
  if (e.modele === 'forment')
    return `${n} ${plurDe(e.a)} forment ${avecArt(e.b)}.`;
  if (e.modele === 'cote-commun')
    return `${n} ${plurDe(e.a)} ont un côté en commun.`;
  if (e.modele === 'sommet-commun')
    return `${n} ${plurDe(e.a)} ont un sommet en commun.`;
  if (e.modele === 'dans')
    return `${maj(avecArt(e.a))} est dans ${leDe(e.b)}.`;
  /* « du triangle », et non « de triangle » : c’est l’article DÉFINI
     contracté qu’il faut ici, la figure étant celle qu’on a sous les yeux. */
  if (e.modele === 'sommets-sur') {
    if (e.k === 1) return `Un seul sommet ${deArticle(e.a)} est un sommet ${deArticle(e.b)}.`;
    const q = e.k === 2 ? 'Deux' : 'Trois';
    return `${q} sommets ${deArticle(e.a)} sont des sommets ${deArticle(e.b)}.`;
  }
  return `Un sommet ${deArticle(e.a)} est sur un côté ${deArticle(e.b)}.`;
}
/* « du carré », « de la forme » : contraction de l’article défini. */
function deArticle(k){
  return ((NOMS[k] || NOMS.forme).genre === 'f' ? 'de la ' : 'du ') + nomDe(k);
}

/* ============================================================
   OUTILS COMMUNS (CHARTE §13)
   ============================================================ */
function melanger(tableau){
  const copie = [...tableau];
  for (let i = copie.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copie[i], copie[j]] = [copie[j], copie[i]];
  }
  return copie;
}
const pioche = a => a[Math.floor(Math.random() * a.length)];
/* CHARTE §13 (A4) — tirage SANS RÉPÉTITION à mémoire de session : ni la
   même figure, ni le même nombre attendu, ni la même formulation ne
   reviennent tant que le stock n’est pas épuisé, y compris d’une partie à
   la suivante. Le mélange ne reprend qu’une fois le stock vidé. */
const memoireTirages = {};
function tirerSansRepetition(cle, stock, n){
  let reste = memoireTirages[cle];
  const sortie = [];
  for (let i = 0; i < n; i++) {
    if (!reste || !reste.length) {
      /* Au remélange, ce qui vient d’être tiré part EN FIN de pioche :
         sinon un élément servi en début de partie pourrait revenir dès la
         partie suivante, et « sans répétition » ne vaudrait qu’à
         l’intérieur d’un cycle. */
      const dejaVus = sortie.slice();
      reste = melanger(stock.filter(x => dejaVus.indexOf(x) === -1)).concat(melanger(dejaVus));
    }
    sortie.push(reste.shift());
  }
  memoireTirages[cle] = reste;
  return sortie;
}
const entre = (a, b) => a + Math.random() * (b - a);

let actx = null;
function jouerNote(freq, debut, duree, volume, forme){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = forme || 'sine'; o.frequency.value = freq;
    const t = actx.currentTime + debut;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + duree + 0.02);
  } catch(e){}
}
