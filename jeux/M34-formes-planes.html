/* ============================================================
   GÉNÉRATION DES ASSEMBLAGES
   Les pièces sont posées sur une grille lâche, chacune avec sa rotation
   libre : aucun chevauchement, et jamais deux vitraux identiques (§13).
   ============================================================ */
function poserEnGrille(formes, opts){
  const o = opts || {};
  const cols = o.cols || 3, taille = o.taille || 78, pas = taille * 1.5;
  return melanger(formes).map((f, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    return creerPiece(f, {
      cx: c * pas + entre(-8, 8),
      cy: r * pas + entre(-8, 8),
      taille: taille * entre(0.82, 1.0),
      couleur: VERRES[i % VERRES.length]
    });
  });
}

/* ============================================================
   LE VITRAIL : UN VRAI ASSEMBLAGE, PAS UNE GRILLE (B1)
   ------------------------------------------------------------
   SPEC §3.1 : « le vitrail est monté à l’écran ; l’enfant touche DANS
   L’ASSEMBLAGE toutes les pièces demandées. » La fonction s’appelait
   `assemblageCommande` mais finissait par `poserEnGrille` : les pièces
   étaient posées isolées, côte à côte. Le mini-jeu refaisait donc le travail
   du convoyeur en plus lent, et l’exigence la plus riche du programme CP —
   reconnaître une forme DANS un assemblage — n’était couverte nulle part.

   Le vitrail se construit sur un quadrillage de mailles : des rangées, des
   cellules dans chaque rangée, et certaines cellules recoupées en triangles.
   Le pavage est donc exact par construction — pas de trou, pas de
   recouvrement — et chaque pièce touche ses voisines par un BORD.

   L’INVARIANT VÉRIFIÉ est celui que M38 applique réellement à ses
   assemblages CP : aucun recouvrement, et un graphe de contacts par bords
   CONNEXE — donc aucune pièce accrochée au reste par un seul point, qui
   était l’un des deux défauts corrigés là-bas. Deux pièces peuvent en
   revanche se toucher par un coin, comme deux cases en diagonale d’un
   quadrillage : l’interdire rendrait tout pavage impossible.
   ============================================================ */

/* Découpe un entier en `n` parts entières non nulles. */
function decouper(total, n){
  const parts = Array.from({length: Math.max(1, Math.min(n, total))}, () => 1);
  for (let k = parts.length; k < total; k++) parts[Math.floor(Math.random() * parts.length)]++;
  return melanger(parts);
}

/* Une cellule devient un rectangle, deux triangles rectangles (une
   diagonale), ou trois triangles dont un NON RECTANGLE (un éventail depuis
   un point du bord haut) — c’est le seul moyen d’obtenir sur un quadrillage
   un triangle que le CE1 nomme « triangle » et non « triangle rectangle ». */
function decoupeCellule(x, y, w, h, o){
  const carree = w === h;
  const r = Math.random();
  const eventail = o.triangles && w >= 2 && (r < o.pEventail);
  const diagonale = o.triangles && !eventail && (r < o.pEventail + o.pDiagonale || (o.sansCarre && carree));
  if (eventail) {
    const a = 1 + Math.floor(Math.random() * (w - 1));
    return [[[x, y+h], [x+w, y+h], [x+a, y]],
            [[x, y], [x+a, y], [x, y+h]],
            [[x+a, y], [x+w, y], [x+w, y+h]]];
  }
  if (diagonale)
    return Math.random() < 0.5
      ? [[[x, y], [x+w, y], [x+w, y+h]], [[x, y], [x+w, y+h], [x, y+h]]]
      : [[[x, y], [x+w, y], [x, y+h]], [[x+w, y], [x+w, y+h], [x, y+h]]];
  return [[[x, y], [x+w, y], [x+w, y+h], [x, y+h]]];
}

function decoupeVitrail(o){
  const contours = [];
  let y = 0;
  decouper(o.H, o.rangees).forEach(h => {
    let x = 0;
    decouper(o.W, o.colonnes()).forEach(w => {
      contours.push(...decoupeCellule(x, y, w, h, o));
      x += w;
    });
    y += h;
  });
  return contours;
}

/* ---- Contacts, recouvrement, connexité : relus sur la GÉOMÉTRIE ---- */
function longueurCommune(a1, a2, b1, b2){
  const dx = a2[0]-a1[0], dy = a2[1]-a1[1], L = Math.hypot(dx, dy);
  if (L < 1e-9) return 0;
  const croix = (p) => ((p[0]-a1[0])*dy - (p[1]-a1[1])*dx) / L;
  if (Math.abs(croix(b1)) > 0.5 || Math.abs(croix(b2)) > 0.5) return 0;
  const t = (p) => ((p[0]-a1[0])*dx + (p[1]-a1[1])*dy) / (L*L);
  const t1 = t(b1), t2 = t(b2);
  const lo = Math.max(0, Math.min(t1, t2)), hi = Math.min(1, Math.max(t1, t2));
  return hi > lo ? (hi - lo) * L : 0;
}
function contactBords(A, B){
  let total = 0;
  for (let i = 0; i < A.length; i++)
    for (let j = 0; j < B.length; j++)
      total += longueurCommune(A[i], A[(i+1)%A.length], B[j], B[(j+1)%B.length]);
  return total;
}
/* Théorème des axes séparateurs — les pièces d’un vitrail sont convexes
   (rectangles et triangles). Deux pièces qui se TOUCHENT ont un écart nul,
   et ne se recouvrent donc pas. */
function seChevauchent(A, B){
  const normales = P => P.map((p, i) => {
    const q = P[(i+1)%P.length];
    return [-(q[1]-p[1]), q[0]-p[0]];
  });
  for (const n of normales(A).concat(normales(B))) {
    const L = Math.hypot(n[0], n[1]);
    if (L < 1e-9) continue;
    const u = [n[0]/L, n[1]/L];
    const pa = A.map(p => p[0]*u[0] + p[1]*u[1]);
    const pb = B.map(p => p[0]*u[0] + p[1]*u[1]);
    if (Math.min(...pa) >= Math.max(...pb) - 0.5 || Math.min(...pb) >= Math.max(...pa) - 0.5) return false;
  }
  return true;
}
/* Chaque pièce doit tenir au vitrail par un BORD, pas par un coin. */
function assemblageConnexe(pieces){
  const n = pieces.length;
  if (!n) return false;
  const parent = Array.from({length:n}, (_, i) => i);
  const racine = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
  for (let i = 0; i < n; i++)
    for (let j = i+1; j < n; j++)
      if (contactBords(pieces[i].pts, pieces[j].pts) > 1) parent[racine(i)] = racine(j);
  return pieces.every((_, i) => racine(i) === racine(0));
}

/* Les pièces voisines ne portent JAMAIS le même verre : sur une grille les
   couleurs n’avaient qu’à être variées, dans un assemblage elles portent la
   frontière. Coloration gloutonne sur le graphe des contacts. */
function colorierVitrail(pieces){
  pieces.forEach((p, i) => {
    const prises = new Set();
    pieces.slice(0, i).forEach(q => {
      if (contactBords(p.pts, q.pts) > 1) prises.add(q.couleur);
    });
    p.couleur = VERRES.find(c => !prises.has(c)) || VERRES[i % VERRES.length];
  });
  return pieces;
}

/* Du quadrillage à la scène : mise à l’échelle, rotation libre de TOUT
   l’assemblage — un carré posé sur un sommet reste un carré —, puis lecture
   du nom de chaque pièce sur ses sommets. */
const MAILLE = 46;
function piecesDuVitrail(contours, vocabulaire){
  const theta = Math.random() * TAU;
  const tous = contours.reduce((a, c) => a.concat(c), []);
  const cx = (Math.min(...tous.map(p => p[0])) + Math.max(...tous.map(p => p[0]))) / 2;
  const cy = (Math.min(...tous.map(p => p[1])) + Math.max(...tous.map(p => p[1]))) / 2;
  return contours.map(c => {
    const pts = tournerPts(c.map(([x, y]) => [(x - cx) * MAILLE, (y - cy) * MAILLE]), theta);
    const p = {id:'p' + (++compteurPiece), pts, couleur:VERRES[0]};
    p.forme = nommerCalcule(p, vocabulaire);
    return p;
  });
}

/* LA COMMANDE SE LIT SUR LE VITRAIL, elle ne lui est pas imposée. On monte
   d’abord l’assemblage, on relit le nom de chaque pièce, et on demande une
   forme qui s’y trouve vraiment — c’est le seul ordre qui garantisse que la
   commande ait des réponses. `preferences` porte l’anti-redondance (§13) :
   on prend la première forme non encore servie qui soit présente.

   L’inclusion carré ⊂ rectangle reste évitée ACTIVEMENT : dès que la commande
   porte sur les rectangles, on remonte un vitrail où aucune cellule carrée ne
   subsiste — les carrées sont recoupées en triangles. Le cycle 2 n’enseigne
   pas cette inclusion, et la trancher n’est pas l’exercice. */
function monterVitrail(palier, o){
  const contours = decoupeVitrail({
    W: 5 + Math.floor(Math.random() * 3),
    H: 4 + Math.floor(Math.random() * 2),
    rangees: 2 + Math.floor(Math.random() * 2),
    colonnes: () => 2 + Math.floor(Math.random() * 2),
    triangles: true, pEventail: 0.14, pDiagonale: 0.22,
    sansCarre: !!(o && o.sansCarre)
  });
  return colorierVitrail(piecesDuVitrail(contours, palier.vocabulaire));
}

function assemblageCommande(palier, preferences, nb){
  let secours = null;
  for (let essai = 0; essai < 120; essai++) {
    /* Un vitrail sur deux est monté sans cellule carrée : c’est ce qui rend
       la commande « les rectangles » possible. Ce n’est PAS un état qui se
       verrouille — une première version le latchait dès la première collision
       et ne produisait plus que deux formes, si bien qu’une commande à deux
       termes n’avait plus jamais d’intrus et ne se résolvait pas. */
    const pieces = monterVitrail(palier, {sansCarre: essai % 2 === 1});
    const noms = pieces.map(p => p.forme);
    /* L’inclusion carré ⊂ rectangle est hors programme au cycle 2 : tant
       qu’un carré est présent, on ne demande pas les rectangles. Le carré,
       lui, reste demandable — un rectangle n’est pas un carré, et les
       distinguer est justement l’exercice. */
    let candidates = preferences.filter(f => noms.includes(f));
    if (noms.includes('carre')) candidates = candidates.filter(f => f !== 'rectangle');
    const dem = candidates.slice(0, nb);
    if (!dem.length) continue;
    /* Un vitrail se REGARDE avant de se fouiller. Au-delà d’une dizaine de
       pièces le CP ne lit plus l’assemblage, il balaie ; et « touche tous les
       triangles » quand il y en a neuf devient une corvée d’endurance, pas un
       exercice de reconnaissance. */
    if (pieces.length < 5 || pieces.length > 10) continue;
    const cibles = noms.filter(n => dem.includes(n)).length;
    if (cibles > 5) continue;
    /* Il faut des intrus : un vitrail dont TOUTES les pièces conviennent ne
       demande plus de reconnaître quoi que ce soit. */
    if (!noms.some(n => !dem.includes(n))) continue;
    if (dem.length === nb) return {pieces, demandees:dem};
    if (!secours) secours = {pieces, demandees:dem};
  }
  return secours;
}

/* ============================================================
   SCÉNARIOS DE RELATIONS (CP)
   Chaque scénario CONSTRUIT la géométrie et l’énoncé structuré ensemble :
   la phrase vraie l’est parce que la figure a été bâtie ainsi, pas parce
   qu’on l’a affirmé à côté.
   ============================================================ */
function scenarioRelation(){
  const type = pioche(['forment','cote-commun','sommet-commun',
                       'triangle-carre','triangle-carre']);
  const th = entre(0, TAU), T = pts => tournerPts(pts, th);
  const co = [VERRES[0], VERRES[1], VERRES[2]];
  const A = 100;

  if (type === 'forment') {
    // Un rectangle coupé selon sa diagonale : deux triangles qui le forment.
    const l = A * 1.5, h = A;
    const q = [[-l/2,-h/2],[l/2,-h/2],[l/2,h/2],[-l/2,h/2]];
    const t1 = T([q[0], q[1], q[2]]), t2 = T([q[0], q[2], q[3]]);
    return {
      pieces:[{id:'r1', forme:'triangle', pts:placerPts(t1, 0, 0, 1), couleur:co[0]},
              {id:'r2', forme:'triangle', pts:placerPts(t2, 0, 0, 1), couleur:co[1]}],
      vrai:{modele:'forment', n:2, a:'triangle', b:'rectangle'}
    };
  }
  if (type === 'cote-commun') {
    const a = pioche(['carre','rectangle']);
    const l = a === 'carre' ? A : A * 1.4, h = A;
    const g = T([[-l,-h/2],[0,-h/2],[0,h/2],[-l,h/2]]);
    const d = T([[0,-h/2],[l,-h/2],[l,h/2],[0,h/2]]);
    return {
      pieces:[{id:'r1', forme:a, pts:placerPts(g, 0, 0, 1), couleur:co[0]},
              {id:'r2', forme:a, pts:placerPts(d, 0, 0, 1), couleur:co[1]}],
      vrai:{modele:'cote-commun', n:2, a:a}
    };
  }
  if (type === 'sommet-commun') {
    const a = pioche(['carre','rectangle']);
    const l = a === 'carre' ? A : A * 1.4, h = A;
    const g = T([[-l,-h],[0,-h],[0,0],[-l,0]]);
    const d = T([[0,0],[l,0],[l,h],[0,h]]);
    return {
      pieces:[{id:'r1', forme:a, pts:placerPts(g, 0, 0, 1), couleur:co[0]},
              {id:'r2', forme:a, pts:placerPts(d, 0, 0, 1), couleur:co[1]}],
      vrai:{modele:'sommet-commun', n:2, a:a}
    };
  }
  /* LA FAMILLE « TRIANGLE ET CARRÉ ». Le programme en donne une DESCRIPTION
     CUMULATIVE : « il y a un triangle dans un carré ; deux sommets du
     triangle sont des sommets du carré ; un sommet du triangle est sur un
     côté du carré ». Ces trois phrases sont vraies EN MÊME TEMPS sur la
     même figure. En faire des réponses concurrentes d’un QCM à réponse
     unique était une erreur de lecture : la manche est un CHOIX MULTIPLE,
     « touche toutes les phrases vraies », ce qui est à la fois fidèle au
     texte et plus formateur. */
  const c = A * 1.2;
  const q = [[-c/2, c/2], [c/2, c/2], [c/2, -c/2], [-c/2, -c/2]];
  // Deux sommets sur deux coins, le troisième franchement SUR un côté.
  const tri = [q[0], q[1], [c * entre(-0.24, 0.24), -c/2]];
  const pieces = [
    {id:'r1', forme:'carre', pts:placerPts(T(q), 0, 0, 1), couleur:co[1]},
    {id:'r2', forme:'triangle', pts:placerPts(T(tri), 0, 0, 1), couleur:co[0]}
  ];
  const vraies = [
    {modele:'dans', a:'triangle', b:'carre'},
    {modele:'sommets-sur', k:2, a:'triangle', b:'carre'},
    {modele:'sommet-sur-cote', a:'triangle', b:'carre'}
  ];
  /* Une seule fausse : à quatre propositions l’écran tient encore, et les
     trois vraies restent l’essentiel de la manche. */
  const fausse = pioche([
    {modele:'sommets-sur', k:3, a:'triangle', b:'carre'},
    {modele:'dans', a:'carre', b:'triangle'},
    {modele:'cote-commun', n:2, a:'carre'}
  ]);
  return {pieces, multi:true,
    props: melanger(vraies.map(e => ({e, bon:true})).concat([{e:fausse, bon:false}]))};
}

/* Enveloppe convexe (parcours monotone d’Andrew) : sert à savoir quelle
   figure DEUX pièces composent, sans le déclarer à côté du dessin. */
function enveloppeConvexe(pts){
  const P = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const croix = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const bas = [], haut = [];
  for (const p of P) { while (bas.length >= 2 && croix(bas[bas.length-2], bas[bas.length-1], p) <= 1e-6) bas.pop(); bas.push(p); }
  for (let i = P.length - 1; i >= 0; i--) { const p = P[i];
    while (haut.length >= 2 && croix(haut[haut.length-2], haut[haut.length-1], p) <= 1e-6) haut.pop(); haut.push(p); }
  bas.pop(); haut.pop();
  const h = bas.concat(haut);
  /* On fusionne les sommets alignés résiduels. */
  return h.filter((p, i) => hyp(p, h[(i+1) % h.length]) > 1.2);
}
function sommetsPartages(a, b){
  let n = 0;
  a.forEach(p => { if (b.some(x => hyp(p, x) <= 1.2)) n++; });
  return n;
}
function cotesPartages(a, b){
  let n = 0;
  for (let i = 0; i < a.length; i++) {
    const p = a[i], q = a[(i+1) % a.length];
    for (let j = 0; j < b.length; j++) {
      const r = b[j], t = b[(j+1) % b.length];
      if ((hyp(p, r) <= 1.2 && hyp(q, t) <= 1.2) || (hyp(p, t) <= 1.2 && hyp(q, r) <= 1.2)) n++;
    }
  }
  return n;
}

/* Combien de sommets du triangle tombent sur un sommet du carré, combien
   sur un côté (coins exclus) ? Sert à la fabrication ET aux tests : c’est
   ce comptage, et non le nom du scénario, qui dit ce qui est vrai. */
function contactsTriangleCarre(tri, carre){
  const TOL = 1.2;
  let surSommet = 0, surCote = 0;
  tri.forEach(p => {
    if (carre.some(v => hyp(p, v) <= TOL)) { surSommet++; return; }
    const n = carre.length;
    for (let i = 0; i < n; i++) {
      const a = carre[i], b = carre[(i + 1) % n];
      const L = hyp(a, b);
      const t = ((p[0]-a[0])*(b[0]-a[0]) + (p[1]-a[1])*(b[1]-a[1])) / (L*L);
      if (t <= 0.02 || t >= 0.98) continue;
      const proj = [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
      if (hyp(p, proj) <= TOL) { surCote++; return; }
    }
  });
  return {surSommet, surCote};
}

function distracteursRelation(vrai){
  const out = [];
  const clone = () => JSON.parse(JSON.stringify(vrai));
  const autreForme = f => f === 'carre' ? 'rectangle' : 'carre';
  if (vrai.modele === 'forment') {
    let d = clone(); d.b = 'carre'; out.push(d);
    d = clone(); d.n = 3; out.push(d);
  } else if (vrai.modele === 'cote-commun') {
    /* PAS « sommet en commun » : deux pièces qui partagent un côté en
       partagent aussi les deux extrémités, la phrase serait VRAIE. */
    let d = clone(); d.a = autreForme(vrai.a); out.push(d);
    d = clone(); d.n = 3; out.push(d);
  } else if (vrai.modele === 'sommet-commun') {
    let d = clone(); d.a = autreForme(vrai.a); out.push(d);
    d = clone(); d.modele = 'cote-commun'; out.push(d);
  } else if (vrai.modele === 'dans') {
    let d = clone(); d.a = 'carre'; d.b = 'triangle'; out.push(d);
    d = clone(); d.a = 'rectangle'; out.push(d);
  } else if (vrai.modele === 'sommets-sur') {
    /* On ne propose JAMAIS « un sommet est sur un côté » face à un triangle
       dont des sommets occupent des coins du carré : un coin appartient à
       deux côtés, la phrase serait défendable et la manche aurait deux
       bonnes réponses. On reste donc sur le COMPTAGE, qui tranche. */
    [1, 2, 3].filter(k => k !== vrai.k).slice(0, 2).forEach(k => {
      const d = clone(); d.k = k; out.push(d);
    });
  } else {
    let d = clone(); d.modele = 'sommets-sur'; d.k = 1; out.push(d);
    d = clone(); d.modele = 'sommets-sur'; d.k = 2; out.push(d);
  }
  return out;
}

/* ============================================================
   PROPRIÉTÉS ÉNONÇABLES (CE1/CE2)
   ============================================================ */
const PROP = {
  carre:      'ses quatre angles sont droits et ses quatre côtés ont la même longueur',
  rectangle:  'ses quatre angles sont droits et ses côtés opposés ont la même longueur',
  losange:    'ses quatre côtés ont la même longueur, mais aucun angle n’est droit',
  triangleRect:'il a trois côtés et l’un de ses angles est droit',
  triangle:   'il a trois côtés et trois sommets',
  disque:     'c’est le verre tout rond, sans aucun côté',
  cercle:     'c’est le fil de plomb qui fait le tour, sans le verre au milieu'
};
const MOTIFS_REFUS = {
  carre: ['ses quatre côtés n’ont pas la même longueur', 'l’un de ses angles n’est pas droit'],
  rectangle: ['l’un de ses angles n’est pas droit', 'ses côtés opposés n’ont pas la même longueur']
};

/* ============================================================
   LA ROSACE (CE2) — recyclée telle quelle par M41.
   Duplication assumée : la charte impose des fichiers autonomes, on ne
   peut pas partager de module. Toute retouche ici est à reporter dans M41.
   ============================================================ */
function construireRosace(){
  const R = 130, cx = 0, cy = 0, n = 6;
  const petales = [], sommetsHex = [];
  for (let i = 0; i < n; i++) {
    const th = -Math.PI/2 + i * TAU / n;
    sommetsHex.push([cx + Math.cos(th) * R * 0.42, cy + Math.sin(th) * R * 0.42]);
  }
  for (let i = 0; i < n; i++) {
    const a = sommetsHex[i], b = sommetsHex[(i + 1) % n];
    const th = -Math.PI/2 + (i + 0.5) * TAU / n;
    const loin = [cx + Math.cos(th) * R * 0.93, cy + Math.sin(th) * R * 0.93];
    petales.push({id:'pet' + i, forme:'quadrilatere',
      pts:[a, [ (a[0]+loin[0])/2 - (b[1]-a[1])*0.16, (a[1]+loin[1])/2 + (b[0]-a[0])*0.16 ], loin, b],
      couleur:VERRES_HORS_REPERE[i % VERRES_HORS_REPERE.length]});
  }
  /* Sept verres pour six pétales et un cœur : le cœur prend le septième, donc
     aucune couleur n’est répétée dans la rosace. */
  return {R, cx, cy, sommetsHex, petales,
    hexagone:{id:'hex', forme:'hexagone', pts:sommetsHex,
              couleur:VERRES_HORS_REPERE[6 % VERRES_HORS_REPERE.length]}};
}

/* ============================================================
   GÉNÉRATEURS DE MANCHES — un par mini-jeu
   ============================================================ */
function qReconnaitre(cfg, palier){
  const simples = palier.formes.filter(f => f !== 'cercle' && f !== 'disque');
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    // Progression : une seule forme demandée, puis deux ensemble.
    const nb = i >= 3 ? 2 : 1;
    /* Au CE1, on ménage une manche cercle/disque : la distinction est
       abstraite sur papier, évidente en vitrail. ELLE RESTE HORS ASSEMBLAGE,
       et c’est une exception assumée : un disque ne pave pas. Le vitrail y
       prend la forme d’une VERRIÈRE — des ronds sertis dans un réseau de
       plomb, chacun dans sa case. */
    if (palier.formes.includes('cercle') && i === 2) return mancheSertie();
    const monte = assemblageCommande(palier, tirerSansRepetition('reco-formes', simples, simples.length), nb);
    const dem = monte.demandees;
    return {mode:'reconnaitre', pieces:monte.pieces, demandees:dem, assemblage:true,
      _vocabulaire:palier.vocabulaire,
      q: 'Touche ' + (dem.length === 1
            ? 'tous les ' + plurDe(dem[0])
            : 'tous les ' + plurDe(dem[0]) + ' et tous les ' + plurDe(dem[1])) + ' !',
      /* AUCUN COMPTE N’EST ANNONCÉ : l’exhaustivité fait partie de la
         compétence, et dire « il y en a trois » la remplacerait par un
         décompte. Le bouton Vérifier suffit, et le retour §18 montre déjà en
         pointillé vert ce qui manquait. */
      sous:'Sélectionne les pièces dans le vitrail, puis Vérifier.'};
  });
}

/* La verrière du CE1 : des cercles et des disques sertis dans les cases d’un
   réseau de plomb. Les cases sont un DÉCOR — seules les pièces rondes se
   touchent, et l’invariant d’assemblage ne s’y applique pas. */
function mancheSertie(){
  const rondes = melanger(['cercle','cercle','cercle','disque','disque','disque']);
  const cols = 3, pas = 104, r = 38;
  const pieces = rondes.map((f, i) => {
    const c = i % cols, l = Math.floor(i / cols);
    return creerPiece(f, {cx:c * pas, cy:l * pas, taille:r * 2,
      couleur:VERRES_HORS_REPERE[i % VERRES_HORS_REPERE.length]});
  });
  const reseau = rondes.map((_, i) => {
    const c = i % cols, l = Math.floor(i / cols);
    return `<rect class="serti" x="${c*pas - pas/2}" y="${l*pas - pas/2}" width="${pas}" height="${pas}"/>`;
  }).join('');
  const dem = pioche(['cercle','disque']);
  return {mode:'reconnaitre', pieces, demandees:[dem], serti:reseau,
    q:'Touche tous les ' + plurDe(dem) + ' !',
    sous:'Sélectionne les pièces, puis Vérifier.'};
}

function qRelations(cfg){
  return Array.from({length: cfg.nbQuestions}, () => {
    const sc = scenarioRelation();
    if (sc.multi) {
      return {mode:'relations', pieces:sc.pieces, props:sc.props, multi:true,
        q:'Touche toutes les phrases vraies.',
        sous:'Coche-les toutes, puis Vérifier.'};
    }
    const props = melanger([{e:sc.vrai, bon:true}, ...distracteursRelation(sc.vrai).map(e => ({e, bon:false}))]);
    return {mode:'relations', pieces:sc.pieces, props,
      q:'Quelle phrase est vraie ?',
      sous:'Choisis la bonne phrase. 🔊 pour l’écouter.'};
  });
}

function qDecrire(cfg, palier){
  /* CHARTE §13 — pas de redondance : les nombres à trouver sont TOUS
     DIFFÉRENTS au fil de la partie. Une version antérieure tirait forme et
     question au hasard et pouvait demander « combien de côtés » trois fois
     de suite pour la réponse 4. On fixe donc le squelette : un nom, puis
     un comptage à 3, un à 4, puis les deux formes que le CP ne nomme pas,
     à 5 et à 6 côtés. */
  const nommables = palier.formes.filter(f => f !== 'cercle');
  const troisCotes = nommables.filter(f => f === 'triangle' || f === 'triangleRect');
  const quatreCotes = nommables.filter(f => ['carre','rectangle','losange'].includes(f));
  const petits = melanger([
    troisCotes.length ? {f:pioche(troisCotes)} : null,
    quatreCotes.length ? {f:pioche(quatreCotes)} : null
  ].filter(Boolean));
  const grands = melanger(['pentagone','hexagone']);

  /* B2 — huit manches. Les COMPTAGES restent quatre, un par nombre attendu
     (3, 4, 5, 6) : c’est ce qui garantit que deux questions n’aient jamais la
     même réponse. Le reste est du nommage, et les noms sont tirés EN UNE SEULE
     FOIS — `tirerSansRepetition` ne garantit l’absence de doublon qu’à
     l’intérieur d’un appel, si bien que quatre appels d’un élément pouvaient
     servir deux fois la même forme dès que la pioche se rechargeait en cours
     de file. */
  const comptes = petits.map(x => ({type:'compte', f:x.f, connue:true}))
    .concat(grands.map(f => ({type:'compte', f, connue:false})));
  const nbNoms = Math.max(1, cfg.nbQuestions - comptes.length);
  const plan = melanger(tirerSansRepetition('decrire-nom', nommables, Math.min(nbNoms, nommables.length))
    .map(f => ({type:'nom', f})).concat(comptes));

  const quoiUtilise = [];
  return plan.slice(0, cfg.nbQuestions).map((etape, i) => {
    const piece = creerPiece(etape.f, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
    const p = proprietes(piece);
    if (etape.type === 'nom') {
      const autres = melanger(nommables.filter(f => f !== etape.f)).slice(0, 3);
      return {mode:'decrire', pieces:[piece], _signature:'nom:' + etape.f,
        q:'Comment s’appelle cette pièce ?', sous:'',
        opts:melanger([etape.f, ...autres].map(nomDe)), ans:nomDe(etape.f)};
    }
    /* Côtés et sommets alternent, pour que la partie ne soit pas une suite
       de « combien de côtés ». */
    const quoi = quoiUtilise.filter(x => x === 'cotes').length > quoiUtilise.filter(x => x === 'sommets').length
      ? 'sommets' : (quoiUtilise.length ? 'cotes' : pioche(['cotes','sommets']));
    quoiUtilise.push(quoi);
    const bon = quoi === 'cotes' ? p.nbCotes : p.nbSommets;
    const q = etape.connue
      ? 'Combien ' + leDe(etape.f) + ' a-t-il ' + (quoi === 'cotes' ? 'de côtés' : 'de sommets') + ' ?'
      : 'Combien cette forme a-t-elle ' + (quoi === 'cotes' ? 'de côtés' : 'de sommets') + ' ?';
    return {mode:'decrire', pieces:[piece], compte:quoi, bonNombre:bon,
      _signature:'compte:' + etape.f + '/' + quoi,
      q, sous:'Compte bien tout autour.',
      opts:melanger([bon, bon + 1, bon - 1, bon + 2].map(String)), ans:String(bon)};
  });
}

/* Assertions candidates pour « pourquoi ce n’est pas un carré ? ». Chacune
   porte son PRÉDICAT : c’est la figure qui décide si l’assertion est vraie,
   pas une liste écrite à la main. Un distracteur est une assertion FAUSSE
   sur la pièce affichée — « l’un de ses angles n’est pas droit » était
   proposé comme faux devant un triangle, où il est manifestement vrai. */
/* `refute` distingue une raison d’un simple constat : « elle a quatre
   sommets » peut être VRAIE de la pièce sans être un motif — un carré en a
   quatre lui aussi. Sans ce départage, choisir la raison parmi les assertions
   vraies aurait pu désigner un fait compatible avec le carré. */
const ASSERTIONS_CARRE = [
  {t:'elle n’a que trois côtés',                    vrai:p => p.nbCotes === 3,                       refute:true},
  {t:'ses quatre côtés n’ont pas la même longueur', vrai:p => p.nbCotes === 4 && !p.tousCotesEgaux,  refute:true},
  {t:'l’un de ses angles n’est pas droit',          vrai:p => !p.rond && !p.tousAnglesDroits,        refute:true},
  {t:'elle a plus de quatre côtés',                 vrai:p => p.nbCotes > 4,                         refute:true},
  {t:'elle n’a aucun sommet',                       vrai:p => p.nbSommets === 0,                     refute:true},
  {t:'elle a quatre sommets',                       vrai:p => p.nbSommets === 4}
];

function qJustifier(cfg, palier){
  /* B3 — huit manches, moitié « nommer puis prouver », moitié « réfuter ».
     Les deux listes sont tirées SANS RÉPÉTITION dans les formes du palier
     (§13), en un seul appel chacune : une liste écrite en dur — deux formes à
     réfuter, trois à nommer — n’allait pas au-delà de cinq manches et faisait
     revenir le rectangle une manche sur deux.
     Une même forme peut apparaître dans les deux phases : la nommer et
     réfuter qu’elle soit un carré sont deux tâches distinctes, et c’est la
     redondance la moins coûteuse quand huit manches se partagent six formes. */
  const nbRefut = Math.floor(cfg.nbQuestions / 2);
  const aRefuter = tirerSansRepetition('justif-refuter',
    palier.formes.filter(f => f !== 'carre'), nbRefut);
  const aNommer = tirerSansRepetition('justif-nommer', palier.formes, cfg.nbQuestions - nbRefut);
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    const refutation = i >= aNommer.length;
    const forme = refutation ? aRefuter[(i - aNommer.length) % aRefuter.length] : aNommer[i % aNommer.length];
    const piece = creerPiece(forme, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
    const p = proprietes(piece);
    const autres = melanger(palier.formes.filter(f => f !== forme)).slice(0, 3);
    const etape1 = {q: refutation
        ? 'Le client dit : « c’est un carré. » Il se trompe. Qu’est-ce que c’est vraiment ?'
        : 'Comment s’appelle cette pièce ?',
      opts:melanger([forme, ...autres].map(nomDe)), ans:nomDe(forme)};
    let etape2;
    if (refutation) {
      /* LA RAISON EST LUE SUR LA PIÈCE, pas associée à un nom de forme : une
         table écrite à la main ne couvrait que le rectangle et le triangle, et
         toute forme ajoutée à la phase de réfutation y aurait reçu la raison
         du triangle. Plusieurs assertions peuvent être vraies — un triangle
         rectangle n’a ni quatre côtés ni quatre angles droits — et celles qui
         ne sont pas retenues sortent d’office des distracteurs, filtrés sur
         `!vrai(p)`. */
      const motif = pioche(ASSERTIONS_CARRE.filter(x => x.refute && x.vrai(p))).t;
      /* Les deux distracteurs sont RELUS sur la pièce : seules des
         assertions fausses ici peuvent être proposées. */
      const faux = melanger(ASSERTIONS_CARRE.filter(x => x.t !== motif && !x.vrai(p)).map(x => x.t)).slice(0, 2);
      etape2 = {q:'Pourquoi ce n’est pas un carré ?', opts:melanger([motif, ...faux]), ans:motif};
    } else {
      const bonne = PROP[forme] || PROP.triangle;
      const faux = melanger(Object.keys(PROP).filter(k => k !== forme).map(k => PROP[k])).slice(0, 2);
      etape2 = {q:'Qu’est-ce qui le prouve ?', opts:melanger([bonne, ...faux]), ans:bonne};
    }
    return {mode:'justifier', pieces:[piece], etape1, etape2, etape:1,
      _signature:(refutation ? 'refuter:' : 'nommer:') + forme,
      q:etape1.q, sous:'D’abord le nom, ensuite la preuve.'};
  });
}

function qAngles(cfg){
  return Array.from({length: cfg.nbQuestions}, (_, i) => {
    /* On tire une figure jusqu’à trouver un angle FRANC de la classe
       voulue : jamais de cas limite, la vérification à l’équerre relève
       de M35. */
    const vise = ['droit','aigu','obtus'][i % 3];
    let piece = null, idx = -1;
    for (let essai = 0; essai < 400 && idx === -1; essai++) {
      const f = vise === 'droit' ? pioche(['carre','rectangle','triangleRect'])
        : pioche(['triangle','losange','pentagone','triangleRect']);
      const cand = creerPiece(f, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
      const a = anglesDeg(cand.pts);
      const j = a.findIndex(x => classeAngle(x) === vise && angleFranc(x));
      if (j !== -1) { piece = cand; idx = j; }
    }
    if (!piece) { piece = creerPiece('carre', {cx:0, cy:0, taille:150}); idx = 0; }
    return {mode:'angles', pieces:[piece], sommet:idx,
      q:'Regarde l’angle marqué sur la pièce. Comment est-il ?',
      sous:'À l’œil : pas besoin d’équerre ici.',
      opts:melanger(['droit','aigu','obtus'].map(x => 'un angle ' + x)),
      ans:'un angle ' + classeAngle(anglesDeg(piece.pts)[idx])};
  });
}

function qVocabulaire(cfg){
  /* PÉRIMÈTRE RESSERRÉ SUR LES ÉLÉMENTS DE FIGURE. La rosace portait aussi
     le classement par nombre de côtés — triangle, quadrilatère, pentagone,
     hexagone, polygone. Ce classement est parti au CONVOYEUR, où il est
     mieux servi : classer des figures ENTIÈRES par catégorie y est la tâche
     même, pièce après pièce, au lieu d’être une question isolée posée sur un
     présentoir. Il reste ici ce que la rosace sait faire et que rien d’autre
     ne fait : DÉSIGNER DES ÉLÉMENTS d’une figure — centre, rayon, diamètre,
     diagonale, longueur, largeur. Les deux mini-jeux ne se recouvrent plus. */
  const banque = ['centre','rayon','diametre','diagonale','longueur','largeur'];
  return tirerSansRepetition('voc-notions', banque, cfg.nbQuestions).map(notion => ({
    mode:'vocabulaire', notion, q:consigneVocabulaire(notion),
    /* La consigne nomme déjà l’objet visé et sa couleur : la sous-consigne
       n’a plus qu’à prévenir que plusieurs réponses conviennent — un cercle
       a une infinité de rayons, un rectangle deux longueurs. */
    sous:'Plusieurs réponses conviennent : touches-en une.'
  }));
}
function consigneVocabulaire(n){
  /* DIRE CE QUI SE VOIT, PAS COMMENT ON L’A CODÉ. « En surbrillance » n’est
     pas compris — c’est un mot d’écran, pas un mot d’enfant, et « éclairé »
     ne vaut guère mieux. Le repère est jaune à l’écran : la consigne dit
     donc « jaune », qui se vérifie d’un coup d’œil. Le mot à APPRENDRE reste
     entier — « quadrilatère », « rayon », « diamètre » —, c’est la façon de
     DÉSIGNER l’objet visé qui devient concrète.

     « La rosace » n’est pas un cercle : c’est l’assemblage de pétales. Le
     centre, le rayon et le diamètre appartiennent au CERCLE qui l’entoure,
     et la consigne doit le dire. De même, la diagonale se demande sur un
     quadrilatère IDENTIFIÉ — celui qui est entouré de jaune — et non sur
     « ce quadrilatère », qui ne désignait rien. */
  const m = {
    centre:'Touche le centre du cercle jaune qui entoure la rosace.',
    rayon:'Touche un rayon du cercle jaune qui entoure la rosace.',
    /* Un cercle a une infinité de diamètres : « LE diamètre » n’existe pas. */
    diametre:'Touche un diamètre du cercle jaune qui entoure la rosace.',
    diagonale:'Touche une diagonale du quadrilatère entouré en jaune.',
    longueur:'Touche une longueur du quadrilatère entouré en jaune.',
    largeur:'Touche une largeur du quadrilatère entouré en jaune.'
  };
  return m[n];
}

/* ============================================================
   LE CONVOYEUR — génération du flux (SPEC-M34-convoyeur §3, §4)
   ============================================================ */
/* Une consigne, et ce que le mot RECOUVRE.

   `accepte` — les formes qui comptent. Le seul cas d’inclusion LÉGITIME du
   cycle 2 y figure en toutes lettres : un triangle rectangle EST un
   triangle, donc « attrape les triangles » l’accepte, alors que « attrape
   les triangles rectangles » n’accepte que lui.

   `bannis` — les formes qu’on n’envoie PAS sur le tapis pendant cette
   consigne, parce qu’un enfant qui les toucherait aurait mathématiquement
   raison sans que le programme l’y ait outillé : pas de carré quand on
   demande les rectangles, pas de carré non plus quand on demande les
   losanges. L’inclusion carré ⊂ rectangle est hors programme au cycle 2 ;
   on ne la contredit pas, on évite la situation. */
const CONVOYEUR_CONSIGNES = {
  CP: [
    {mot:'disque',       accepte:['disque'],       bannis:[]},
    {mot:'carre',        accepte:['carre'],        bannis:[]},
    {mot:'rectangle',    accepte:['rectangle'],    bannis:['carre']},
    {mot:'triangle',     accepte:['triangle'],     bannis:[]}
  ],
  CE1: [
    {mot:'disque',       accepte:['disque'],       bannis:[]},
    {mot:'cercle',       accepte:['cercle'],       bannis:[]},
    {mot:'carre',        accepte:['carre'],        bannis:[]},
    {mot:'rectangle',    accepte:['rectangle'],    bannis:['carre']},
    {mot:'triangle',     accepte:['triangle','triangleRect'], bannis:[]},
    {mot:'triangleRect', accepte:['triangleRect'], bannis:[]}
  ],
  /* Au CE2 la consigne ne désigne plus une forme mais une CATÉGORIE : il
     faut ranger quatre formes différentes sous le mot « quadrilatère ».
     C’est un changement de nature, pas d’inventaire. */
  CE2: [
    {mot:'quadrilatere', accepte:['carre','rectangle','losange','quadrilatere'], bannis:[]},
    {mot:'triangle',     accepte:['triangle','triangleRect'], bannis:[]},
    {mot:'pentagone',    accepte:['pentagone'],    bannis:[]},
    {mot:'hexagone',     accepte:['hexagone'],     bannis:[]},
    {mot:'losange',      accepte:['losange'],      bannis:['carre']},
    {mot:'disque',       accepte:['disque'],       bannis:[]}
  ]
};
const CONVOYEUR_N = 3;             // pièces cibles par consigne
const CONVOYEUR_PAR_PHASE = 8;     // pièces envoyées : 3 cibles, 5 distracteurs

/* Une pièce dont le nom CALCULÉ est bien celui qu’on voulait. On ne se fie
   jamais à l’intention : un « losange » tiré avec un rapport proche de 1
   serait un carré, et le tapis mentirait. Même principe que partout dans
   M34 — les propriétés se relisent sur les sommets. */
function piecePourNom(nom, vocabulaire){
  let p = null;
  for (let essai = 0; essai < 120; essai++) {
    p = creerPiece(nom, {cx:0, cy:0, taille:CONVOYEUR_TAILLE});
    p._nomCalcule = nommerCalcule(p, vocabulaire);
    if (p._nomCalcule === nom) return p;
  }
  return p;   // le validateur refusera la file, et `construireFile` regénérera
}

/* Le flux d’une phase. Il n’est pas aléatoire pur : il GARANTIT que N pièces
   cibles passeront, entrelacées de distracteurs — sans quoi une phase
   pourrait n’en présenter aucune et devenir impossible à finir. */
function fluxDePhase(consigne, pool, vocabulaire){
  const interdits = consigne.accepte.concat(consigne.bannis);
  const autres = pool.filter(f => interdits.indexOf(f) < 0);
  const cibles = Array.from({length: CONVOYEUR_N},
    () => piecePourNom(pioche(consigne.accepte), vocabulaire));
  const distracteurs = Array.from({length: CONVOYEUR_PAR_PHASE - CONVOYEUR_N},
    () => piecePourNom(pioche(autres), vocabulaire));
  cibles.forEach(p => { p._cible = true; });
  distracteurs.forEach(p => { p._cible = false; });
  /* On mélange, mais on refuse un début sans aucune cible : trois
     distracteurs d’affilée en ouverture, et l’enfant croit s’être trompé
     de consigne. */
  let flux = cibles.concat(distracteurs);
  for (let essai = 0; essai < 40; essai++) {
    flux = melanger(flux);
    if (flux.slice(0, 3).some(p => p._cible)) break;
  }
  return flux;
}

function qConvoyeur(cfg, palier){
  const consignes = CONVOYEUR_CONSIGNES[palier._nom] || CONVOYEUR_CONSIGNES.CP;
  const pool = palier.formesConvoyeur || palier.formes;
  /* Ordre des consignes tiré SANS REMISE (§13) : chaque type est demandé une
     fois et une seule, et la partie s’arrête quand ils l’ont tous été. */
  return melanger(consignes.slice()).map(c => ({
    mode:'convoyeur', consigne:c, points:CONVOYEUR_N,
    flux:fluxDePhase(c, pool, palier.vocabulaire),
    palier:palier._nom,
    q:'Attrape ' + lesDe(c.mot) + ' !',
    sous:sousConvoyeur(c.mot, palier._nom)
  }));
}
/* « les triangles », « les disques » — l’article défini pluriel se calcule,
   il ne s’écrit pas à côté de chaque mot. */
function lesDe(k){ return 'les ' + plurDe(k); }
/* CHAQUE consigne en a une. La place lui est réservée pour que le tapis ne
   bouge pas d’une phase à l’autre ; la laisser vide reviendrait à réserver un
   blanc, autant qu’elle dise quelque chose d’utile.

   MAIS ELLE EST INDEXÉE SUR LE PALIER, PAS SEULEMENT SUR LA FORME (A1). Une
   table unique servait les trois niveaux, et le CP lisait donc « quatre angles
   droits » — notion CE1. Le cas du triangle était doublement fautif : « même
   celles qui ont un angle droit » renvoyait, au CP, à des pièces ABSENTES du
   tapis, puisque `formesConvoyeur` n’y contient pas de triangle rectangle.

   Le module connaissait déjà le principe et l’appliquait ailleurs — « polygone »
   est réservé au CE2. Il n’avait simplement pas été appliqué ici.

   Au CP, le programme demande « une première description du carré, du
   rectangle, du triangle en utilisant les termes SOMMET et CÔTÉ » : la
   sous-consigne y travaille au lieu de gêner. */
const SOUS_CONVOYEUR_AVANCE = {
  quadrilatere:'Toutes les pièces à quatre côtés, quelle que soit leur allure.',
  triangle:    'Toutes les pièces à trois côtés, même celles qui ont un angle droit.',
  cercle:      'Le cercle est un anneau de plomb vide ; le disque est plein.',
  disque:      'Le disque est plein ; le cercle n’est qu’un anneau.',
  triangleRect:'Ceux-là seulement : un angle droit dans le triangle.',
  losange:     'Quatre côtés de même longueur, mais pas d’angle droit.',
  rectangle:   'Quatre angles droits, et des côtés de deux longueurs.',
  carre:       'Quatre angles droits et quatre côtés de même longueur.',
  pentagone:   'Cinq côtés — compte-les avant d’attraper.',
  hexagone:    'Six côtés — compte-les avant d’attraper.'
};
const SOUS_CONVOYEUR = {
  CP: {
    triangle: 'Toutes les pièces à trois côtés et trois sommets.',
    carre:    'Quatre côtés de la même longueur.',
    rectangle:'Quatre côtés et quatre sommets, comme une porte.',
    disque:   'Il est tout rond, sans côté ni sommet.'
  },
  CE1: SOUS_CONVOYEUR_AVANCE,
  CE2: SOUS_CONVOYEUR_AVANCE
};
function sousConvoyeur(mot, palierNom){
  return (SOUS_CONVOYEUR[palierNom] || SOUS_CONVOYEUR_AVANCE)[mot] || 'Laisse passer les autres.';
}

/* LE LEXIQUE QUE LE PALIER N’A PAS ENCORE. Un garde-fou vaut mieux que la
   vigilance : c’est la leçon du codage CE1 de M35, où la palette était bien
   bornée mais la correction ne l’était pas. Le contrôle porte sur les textes
   RÉELLEMENT produits, relus par le validateur d’items. */
const TERMES_HORS_PALIER = {
  CP:  ['angle', 'angle droit', 'polygone', 'quadrilatère', 'diagonale'],
  CE1: ['polygone', 'quadrilatère', 'diagonale']
};
function motsHorsPalier(texte, palierNom){
  const interdits = TERMES_HORS_PALIER[palierNom] || [];
  const t = (texte || '').toLowerCase();
  /* Frontière de mot des deux côtés : « triangle » ne doit pas déclencher sur
     « angle », ni « rectangle » sur « angle ». */
  return interdits.filter(m => new RegExp('(^|[^a-zàâäéèêëïîôöùûüç])'
    + m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    + '(s?)([^a-zàâäéèêëïîôöùûüç]|$)', 'i').test(t));
}

function qPortrait(cfg){
  const cibles = ['losange','carre','rectangle','triangleRect','disque','cercle'];
  return tirerSansRepetition('portrait-cibles', cibles, cfg.nbQuestions).map((cible, i) => {
    const autres = melanger(cibles.filter(f => f !== cible)).slice(0, 3);
    const toutes = melanger([cible, ...autres]);
    const pieces = toutes.map((f, j) => creerPiece(f, {cx:0, cy:0, taille:120, couleur:VERRES[(i + j) % VERRES.length]}));
    return {mode:'portrait', pieces, cible, choix:toutes, piecesChoix:pieces,
      q:'Le client demande : « ' + PORTRAITS[cible] + ' »',
      sous:'Touche la pièce qui correspond.'};
  });
}
const PORTRAITS = {
  losange:'Quatre côtés de même longueur, mais aucun angle droit.',
  carre:'Quatre côtés de même longueur et quatre angles droits.',
  rectangle:'Quatre angles droits, mais ses côtés ne sont pas tous de même longueur.',
  triangleRect:'Trois côtés, et un angle droit.',
  disque:'Tout rond, et le verre remplit tout.',
  cercle:'Tout rond, mais seulement le tour : pas de verre au milieu.'
};

/* ---- LE LITIGE : une banque de COUPLES (pièce réelle, forme affirmée) ----
   L’anti-redondance (§13) ne portait sur rien : `cas = i % 2` alternait
   rectangle et losange, et le client affirmait TOUJOURS « c’est un carré ».
   Sur cinq manches, trois étaient identiques dans leur structure. Le tirage
   sans répétition, employé partout ailleurs dans le module, ne l’était pas
   ici. Il porte désormais sur le COUPLE, seule unité qui décrive vraiment
   une manche. */
const LITIGES = [
  {affirme:'carre',        reel:'rectangle'},
  {affirme:'carre',        reel:'losange'},
  {affirme:'rectangle',    reel:'losange'},
  {affirme:'losange',      reel:'rectangle'},
  {affirme:'triangleRect', reel:'triangle'},
  {affirme:'quadrilatere', reel:'pentagone'}
];

/* Les raisons possibles. Chacune porte SON PRÉDICAT — c’est la figure qui
   décide, jamais une étiquette posée à côté. Et `cible` dit ce qu’il faut
   MONTRER pour l’établir : la désignation de l’étape 1 et la raison de
   l’étape 2 parlent ainsi forcément de la même chose. */
const CLAUSES_LITIGE = [
  {t:'a trois côtés',                       ok:p => p.nbCotes === 3,                       cible:'tous-cotes'},
  {t:'a quatre côtés',                      ok:p => p.nbCotes === 4,                       cible:'tous-cotes'},
  {t:'a quatre sommets',                    ok:p => p.nbSommets === 4,                     cible:'tous-sommets'},
  {t:'a ses quatre côtés de même longueur', ok:p => p.nbCotes === 4 && p.tousCotesEgaux,   cible:'cotes-inegaux'},
  {t:'a ses quatre angles droits',          ok:p => p.nbCotes === 4 && p.tousAnglesDroits, cible:'angle-non-droit'},
  {t:'a un angle droit',
   ok:p => !p.rond && p.angles.some(a => classeAngle(a) === 'droit'),                      cible:'tous-angles'}
];

/* EST-CE UNE PROPRIÉTÉ DU MODÈLE ANNONCÉ ? On ne l’écrit pas : on la LIT sur
   des pièces témoins de ce modèle. Une clause n’est retenue que si elle tient
   sur toutes — un quadrilatère quelconque tiré au hasard peut naître presque
   régulier, et une seule pièce témoin ferait passer « a ses quatre côtés de
   même longueur » pour une propriété du quadrilatère. */
const TEMOINS = 24;
const memoireModele = {};
function clausesDuModele(forme){
  if (memoireModele[forme]) return memoireModele[forme];
  const temoins = Array.from({length: TEMOINS},
    () => proprietes(creerPiece(forme, {cx:0, cy:0, taille:150})));
  return (memoireModele[forme] = CLAUSES_LITIGE.filter(c => temoins.every(p => c.ok(p))));
}

/* PLUSIEURS PROPRIÉTÉS PEUVENT MANQUER À LA FOIS, parce que les clauses ne
   sont pas indépendantes : « a ses quatre angles droits » entraîne « a un
   angle droit », et un pentagone manque aussi bien les quatre côtés que les
   quatre sommets. Ce ne sont pas des raisons concurrentes mais une raison et
   ses conséquences — le QCM n’en propose donc qu’UNE, les autres n’étant
   offertes ni comme réponse ni comme distracteur.

   Reste à savoir laquelle nommer. La plus EXIGEANTE : c’est celle qui apprend
   le plus. On ne la classe pas à la main, on la mesure — la clause satisfaite
   par le moins de pièces, sur une population tirée dans toutes les formes du
   module. « Quatre angles droits » passe ainsi devant « un angle droit »
   sans qu’aucun ordre ait été écrit. */
const FORMES_CONNUES = ['disque','cercle','carre','rectangle','triangle','triangleRect',
                        'losange','quadrilatere','pentagone','hexagone'];
let memoireRarete = null;
function rarete(clause){
  if (!memoireRarete) {
    const population = [];
    FORMES_CONNUES.forEach(f => { for (let i = 0; i < 12; i++)
      population.push(proprietes(creerPiece(f, {cx:0, cy:0, taille:150}))); });
    memoireRarete = new Map(CLAUSES_LITIGE.map(c =>
      [c, population.filter(p => c.ok(p)).length / population.length]));
  }
  return memoireRarete.get(clause);
}
/* La raison à énoncer, et les clauses qu’elle rend redondantes. */
function raisonDuLitige(duModele, p){
  const manquantes = duModele.filter(c => !c.ok(p));
  if (!manquantes.length) return null;
  const motif = manquantes.slice().sort((a, b) => rarete(a) - rarete(b)
    || CLAUSES_LITIGE.indexOf(a) - CLAUSES_LITIGE.indexOf(b))[0];
  return {motif, manquantes};
}

/* Ce qu’il faut désigner pour établir la raison. PLUSIEURS DÉSIGNATIONS SONT
   JUSTES et toutes sont acceptées (cf. `selectionSatisfait`) : un losange a
   quatre angles non droits, n’importe lequel dénonce le défaut. */
function cibleLitige(genre, p){
  const idsAngles = p.angles.map((_, j) => 'a' + j);
  const idsCotes = p.cotes.map((_, j) => 'c' + j);
  if (genre === 'cotes-inegaux') {
    const maxi = Math.max(...p.cotes), mini = Math.min(...p.cotes);
    return {exigences:[{parmi:idsCotes.filter((_, j) => presqueEgal(p.cotes[j], maxi)), nb:1},
                       {parmi:idsCotes.filter((_, j) => presqueEgal(p.cotes[j], mini)), nb:1}],
            sous:'Touche au moins un grand côté ET un petit côté, puis appuie sur Vérifier.'};
  }
  if (genre === 'angle-non-droit')
    return {exigences:[{parmi:idsAngles.filter((_, j) => classeAngle(p.angles[j]) !== 'droit'), nb:1}],
            sous:'Touche au moins un angle qui ne va pas, puis appuie sur Vérifier.'};
  if (genre === 'tous-angles')
    return {exigences:[{parmi:idsAngles, nb:idsAngles.length}],
            sous:'Touche tous les angles : pas un seul n’est droit.'};
  if (genre === 'tous-sommets')
    return {exigences:[{parmi:idsAngles, nb:idsAngles.length}],
            sous:'Touche tous les sommets pour les compter, puis appuie sur Vérifier.'};
  return {exigences:[{parmi:idsCotes, nb:idsCotes.length}],
          sous:'Touche tous les côtés pour les compter, puis appuie sur Vérifier.'};
}

function qLitige(cfg){
  const couples = tirerSansRepetition('litige-couples', LITIGES, cfg.nbQuestions);
  return couples.map((couple, i) => {
    /* La pièce est tirée jusqu’à porter une raison ET deux distracteurs
       tenables. Un distracteur est une clause qui N’EST PAS une raison : soit
       elle n’est pas une propriété du modèle annoncé, soit la pièce la
       respecte déjà. Le validateur relit exactement ce départage. */
    let piece = null, p = null, motif = null, tenues = [];
    const duModele = clausesDuModele(couple.affirme);
    for (let essai = 0; essai < 60; essai++) {
      piece = creerPiece(couple.reel, {cx:0, cy:0, taille:150, couleur:VERRES[i % VERRES.length]});
      p = proprietes(piece);
      const r = raisonDuLitige(duModele, p);
      if (!r) continue;
      tenues = CLAUSES_LITIGE.filter(c => !r.manquantes.includes(c));
      if (tenues.length >= 2) { motif = r.motif; break; }
    }
    const phrase = c => 'Or ' + avecArt(couple.affirme) + ' ' + c.t + '.';
    const cible = cibleLitige(motif.cible, p);
    return {mode:'litige', pieces:[piece], affirme:couple.affirme, reel:couple.reel,
      motif:motif.t, exigences:cible.exigences, etape:1,
      _signature:'litige:' + couple.affirme + '/' + couple.reel,
      q:'Le client dit : « cette pièce est ' + avecArt(couple.affirme) + '. » Montre où ça coince.',
      sous:cible.sous,
      etape2:{q:'Et pourquoi ce n’est pas ' + avecArt(couple.affirme) + ' ?',
              opts:melanger([phrase(motif), ...melanger(tenues).slice(0, 2).map(phrase)]),
              ans:phrase(motif)}};
  });
}

/* ============================================================
   VALIDATION PARTAGÉE DES ITEMS (A1)
   ------------------------------------------------------------
   Deux invariants, vérifiés sur la FIGURE réellement engendrée :
     1. tout distracteur doit être rigoureusement FAUX ;
     2. la cible d’un toucher est l’ENSEMBLE des zones valables.
   Chaque item passe ici À LA GÉNÉRATION, et un auto-test en engendre des
   centaines par mini-jeu. Le défaut le plus coûteux de la première
   production venait de là : des propositions vraies présentées comme
   fausses, et des réponses justes refusées.
   ============================================================ */
function veriteRelation(e, pieces){
  const carre = pieces.find(p => p.forme === 'carre');
  const tri = pieces.find(p => p.forme === 'triangle');
  const familleTriCarre = pieces.length === 2 && carre && tri;
  if (familleTriCarre) {
    const c = contactsTriangleCarre(tri.pts, carre.pts);
    if (e.modele === 'dans') return e.a === 'triangle' && e.b === 'carre';
    if (e.modele === 'sommets-sur') return c.surSommet === e.k;
    if (e.modele === 'sommet-sur-cote') return c.surCote >= 1;
    return false;               // une seule pièce de chaque : rien d’autre n’est vrai
  }
  if (pieces.length !== 2) return null;
  const [p1, p2] = pieces;
  if (e.modele === 'cote-commun')
    return e.n === 2 && p1.forme === e.a && p2.forme === e.a && cotesPartages(p1.pts, p2.pts) >= 1;
  if (e.modele === 'sommet-commun')
    return e.n === 2 && p1.forme === e.a && p2.forme === e.a && sommetsPartages(p1.pts, p2.pts) >= 1;
  if (e.modele === 'forment') {
    if (e.n !== pieces.length) return false;
    if (p1.forme !== e.a || p2.forme !== e.a) return false;
    const h = enveloppeConvexe(p1.pts.concat(p2.pts));
    const nom = nommerCalcule({forme:'x', pts:h}, ['carre','rectangle','losange','triangle','forme']);
    return nom === nomDe(e.b);
  }
  return null;
}
const VALIDATEURS = {
  relations(q){
    const pb = [];
    const textes = q.props.map(p => texteRelation(p.e));
    if (new Set(textes).size !== textes.length) pb.push('deux propositions au texte identique');
    if (!q.props.some(p => p.bon)) pb.push('aucune proposition vraie');
    q.props.forEach((p, i) => {
      const v = veriteRelation(p.e, q.pieces);
      if (v === null) return;
      if (v !== p.bon) pb.push((p.bon ? 'donnée vraie mais fausse' : 'distracteur VRAI') + ' : ' + textes[i]);
    });
    return pb;
  },
  justifier(q){
    const pb = [];
    const p = proprietes(q.pieces[0]);
    if (/Pourquoi/.test(q.etape2.q)) {
      q.etape2.opts.forEach(o => {
        const a = ASSERTIONS_CARRE.find(x => x.t === o);
        if (!a) { pb.push('assertion inconnue : ' + o); return; }
        if (a.vrai(p) !== (o === q.etape2.ans)) pb.push('assertion mal étiquetée : ' + o);
      });
    }
    if (q.etape1.ans !== nomDe(q.pieces[0].forme)) pb.push('le nom attendu ne décrit pas la pièce');
    if (new Set(q.etape2.opts).size !== q.etape2.opts.length) pb.push('deux options identiques');
    return pb;
  },
  decrire(q){
    const pb = [];
    if (q.compte) {
      const p = proprietes(q.pieces[0]);
      const vrai = q.compte === 'cotes' ? p.nbCotes : p.nbSommets;
      if (vrai !== q.bonNombre) pb.push('le nombre attendu ne correspond pas à la figure');
      if (q.opts.filter(o => o === q.ans).length !== 1) pb.push('la bonne réponse figure deux fois');
    } else if (q.ans !== nomDe(q.pieces[0].forme)) pb.push('le nom attendu ne décrit pas la pièce');
    if (new Set(q.opts).size !== q.opts.length) pb.push('deux options identiques');
    return pb;
  },
  angles(q){
    const pb = [];
    const a = anglesDeg(q.pieces[0].pts)[q.sommet];
    if (q.ans !== 'un angle ' + classeAngle(a)) pb.push('la classe annoncée ne correspond pas à l’angle');
    if (!angleFranc(a)) pb.push('angle limite : la classe se discute à l’œil');
    return pb;
  },
  portrait(q){
    const pb = [];
    if (q.choix.filter(f => f === q.cible).length !== 1) pb.push('la pièce demandée figure deux fois');
    /* La description ne doit convenir qu’à UNE pièce du présentoir. */
    q.choix.forEach((f, i) => {
      if (f === q.cible) return;
      if (PORTRAITS[f] === PORTRAITS[q.cible]) pb.push('deux pièces répondent à la description');
    });
    return pb;
  },
  litige(q){
    const pb = [];
    const p = proprietes(q.pieces[0]);
    if (!q.exigences || !q.exigences.length) { pb.push('aucune cible'); return pb; }
    q.exigences.forEach(e => { if (!e.parmi.length) pb.push('groupe de cibles vide'); });

    /* La pièce doit VRAIMENT manquer la propriété annoncée. */
    const duModele = clausesDuModele(q.affirme);
    const r = raisonDuLitige(duModele, p);
    if (!r) pb.push('la pièce satisfait toutes les propriétés du modèle : il n’y a pas de litige');
    else if (r.motif.t !== q.motif)
      pb.push('la raison annoncée (' + q.motif + ') n’est pas celle à nommer (' + r.motif.t + ')');

    /* UNE SEULE OPTION DOIT ÊTRE UNE RAISON. Les propriétés qui manquent par
       voie de conséquence — « un angle droit » quand « quatre angles droits »
       manque déjà — sont des raisons elles aussi : les proposer comme
       distracteurs donnerait deux bonnes réponses. */
    const manquantes = r ? r.manquantes : [];
    q.etape2.opts.forEach(o => {
      const c = CLAUSES_LITIGE.find(x => o.indexOf(x.t) >= 0);
      if (!c) { pb.push('option hors banque : ' + o); return; }
      if (manquantes.includes(c) !== (o === q.etape2.ans)) pb.push('option mal étiquetée : ' + o);
    });
    if (new Set(q.etape2.opts).size !== q.etape2.opts.length) pb.push('deux options identiques');

    /* Invariant 2 : TOUTES les cibles équivalentes sont acceptées. On le
       relit sur la figure, sans refaire le chemin du générateur — les groupes
       posés doivent recouvrir exactement les zones qui conviennent. */
    const attendu = cibleLitige((CLAUSES_LITIGE.find(c => c.t === q.motif) || {}).cible, p);
    const signature = ex => ex.map(e => e.parmi.slice().sort().join(',') + '#' + e.nb).sort().join(' | ');
    if (signature(attendu.exigences) !== signature(q.exigences))
      pb.push('les cibles acceptées ne recouvrent pas toutes les zones équivalentes');
    return pb;
  },
  reconnaitre(q){
    const pb = [];
    if (!q.pieces.some(p => q.demandees.includes(p.forme))) pb.push('aucune pièce demandée n’est présente');
    if (!q.pieces.some(p => !q.demandees.includes(p.forme))) pb.push('toutes les pièces conviennent : rien à reconnaître');
    if (q.demandees.includes('rectangle') && q.demandees.includes('carre'))
      pb.push('rectangle et carré demandés ensemble (inclusion hors programme)');
    if (q.demandees.includes('rectangle') && q.pieces.some(p => p.forme === 'carre'))
      pb.push('un carré dans un vitrail où l’on demande les rectangles');
    /* Le nom de chaque pièce est RELU sur ses sommets — jamais sur
       l’étiquette posée à la fabrication. */
    q.pieces.forEach(p => {
      if (!p.pts) return;
      const calcule = nommerCalcule(p, q._vocabulaire || []);
      if (q._vocabulaire && calcule !== p.forme)
        pb.push('pièce étiquetée ' + p.forme + ' mais dessinée en ' + calcule);
    });
    /* B1 : l’invariant d’assemblage, sur la géométrie réelle. La verrière
       sertie du CE1 en est explicitement dispensée — un disque ne pave pas. */
    if (q.assemblage) {
      const poly = q.pieces.filter(p => p.pts);
      if (poly.length !== q.pieces.length) pb.push('une pièce ronde dans un assemblage');
      for (let i = 0; i < poly.length; i++)
        for (let j = i+1; j < poly.length; j++)
          if (seChevauchent(poly[i].pts, poly[j].pts))
            pb.push('les pièces ' + (i+1) + ' et ' + (j+1) + ' se chevauchent');
      if (!assemblageConnexe(poly))
        pb.push('une pièce ne tient au vitrail que par un point, ou pas du tout');
    }
    return pb;
  },
  vocabulaire(q){ return []; },  // ses cibles naissent au rendu, testées à part
  /* Le tapis est RELU pièce par pièce, sur le nom calculé depuis les
     sommets — jamais sur la forme demandée à la fabrique. C’est ce qui
     attrape le losange né carré, ou le rectangle né trop régulier. */
  convoyeur(q){
    const pb = [];
    const noms = q.flux.map(p => p._nomCalcule);
    const cibles = noms.filter(n => q.consigne.accepte.indexOf(n) >= 0).length;
    if (cibles !== CONVOYEUR_N)
      pb.push(cibles + ' pièces cibles sur le tapis, il en faut ' + CONVOYEUR_N);
    noms.forEach((n, i) => {
      if (q.consigne.bannis.indexOf(n) >= 0)
        pb.push('pièce ' + (i+1) + ' : ' + n + ' interdit quand on demande ' + q.consigne.mot);
      if (q.flux[i]._cible !== (q.consigne.accepte.indexOf(n) >= 0))
        pb.push('pièce ' + (i+1) + ' : son étiquette de cible contredit sa géométrie');
    });
    /* A1 : le vocabulaire des DEUX lignes de consigne est borné par le
       palier. On relit le texte affiché, pas la table dont il sort. */
    [q.q, q.sous].forEach(texte => motsHorsPalier(texte, q.palier).forEach(m =>
      pb.push('« ' + m +' » n’est pas au programme du ' + q.palier + ' : ' + texte)));
    return pb;
  }
};
function verifierItem(q){
  const f = VALIDATEURS[q.mode];
  return f ? f(q) : [];
}
function verifierFile(f){
  const pb = f.map((q, i) => ({i, mode:q.mode, pb:verifierItem(q)})).filter(x => x.pb.length);
  /* ANTI-REDONDANCE À L’ÉCHELLE DE LA FILE (§13). Un item peut être
     irréprochable et la partie répétitive : c’est ce qui arrivait au litige,
     dont les cinq manches posaient toutes la même question.

     Le contrôle est DÉCLARÉ, pas deviné : chaque générateur qui promet des
     manches distinctes pose une `_signature`. Déduire l’identité d’une manche
     de son seul énoncé serait faux ici — `cp-relations` demande exprès
     « Quelle phrase est vraie ? » à chaque fois, et `ce1-angles` « Droit, aigu
     ou obtus ? » : leur variété est dans la figure, pas dans le texte. */
  const vues = new Map();
  f.forEach((q, i) => {
    if (!q._signature) return;
    if (vues.has(q._signature))
      pb.push({i, mode:q.mode, pb:['manche identique à la n° ' + (vues.get(q._signature) + 1)]});
    else vues.set(q._signature, i);
  });
  return pb;
}

/* UNE EXIGENCE EST UN MINIMUM, PAS UN COMPTE EXACT (A2). La version
   précédente refusait toute sélection dont la taille n’était pas exactement
   la somme des `nb` : sur le losange, désigner DEUX angles non droits était
   compté faux alors que chacun est un contre-exemple valable et qu’en montrer
   plusieurs est irréprochable. C’est le défaut déjà corrigé sur les cibles de
   la rosace, sous une autre forme — l’ensemble des réponses était bien décrit,
   mais la QUANTITÉ restait figée.

   Trois règles, et aucun plafond :
     1. toute zone choisie appartient à AU MOINS UN groupe d’exigence ;
     2. chaque exigence reçoit AU MOINS `nb` zones ;
     3. rien d’autre n’est imposé.

   Les deux cas se traitent sans être distingués : sur le losange, un à quatre
   angles non droits conviennent ; sur le rectangle, deux longs sans aucun
   court restent refusés — l’exigence « au moins un court » n’est pas
   satisfaite, et c’est juste : deux côtés égaux ne prouvent rien. */
function selectionSatisfait(choisies, exigences){
  if (!choisies.length) return false;
  if (!choisies.every(id => exigences.some(e => e.parmi.includes(id)))) return false;
  return exigences.every(e => choisies.filter(id => e.parmi.includes(id)).length >= e.nb);
}

function engendrerFile(cfg, palier){
  if (cfg.mode === 'convoyeur')   return qConvoyeur(cfg, palier);
  if (cfg.mode === 'reconnaitre') return qReconnaitre(cfg, palier);
  if (cfg.mode === 'relations')   return qRelations(cfg);
  if (cfg.mode === 'decrire')     return qDecrire(cfg, palier);
  if (cfg.mode === 'justifier')   return qJustifier(cfg, palier);
  if (cfg.mode === 'angles')      return qAngles(cfg);
  if (cfg.mode === 'vocabulaire') return qVocabulaire(cfg);
  if (cfg.mode === 'portrait')    return qPortrait(cfg);
  return qLitige(cfg);
}
/* Aucune partie ne démarre sur un item que la validation partagée refuse.
   En pratique les générateurs sont construits pour ne pas en produire ; ce
   filet existe pour que l’ajout d’un scénario demain ne réintroduise pas en
   silence le défaut qui a coûté le plus cher. */
function construireFile(cfg, palier){
  let f = engendrerFile(cfg, palier);
  for (let essai = 0; essai < 25 && verifierFile(f).length; essai++) f = engendrerFile(cfg, palier);
  const restants = verifierFile(f);
  if (restants.length) console.warn('M34 : items non conformes', restants);
  return f;
}
/* Barème : la justification et la réfutation pèsent DOUBLE — c’est
   l’objectif du module, nommer ne suffit pas. */
const POINTS_ETAPE1 = 1, POINTS_ETAPE2 = 2;
const enDeuxTemps = mode => mode === 'justifier' || mode === 'litige';
function pointsParManche(mode){ return enDeuxTemps(mode) ? POINTS_ETAPE1 + POINTS_ETAPE2 : 1; }
