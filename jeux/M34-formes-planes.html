  return b;
}

function construireAccueil(){
  $('hdrTitle').textContent = 'L’atelier du vitrail';
  const palier = CONTENU.paliers[etatPalierAffiche];
  $('sous-titre-accueil').textContent = (palier && palier.sousTitre) || CONTENU.sousTitre;

  const rangee = $('rangee-paliers');
  rangee.innerHTML = '';
  const niveauProfil = niveauDuProfilActif();
  /* Verrouillage des onglets (CHARTE §15) : un palier au-delà du niveau du
     profil actif reste verrouillé tant que son paquet cadeau n’a pas été
     ouvert — sinon le sélecteur contournerait la mécanique de déblocage. */
  let indexNiveauProfil = ORDRE_PALIERS.indexOf(niveauProfil);
  if (indexNiveauProfil === -1) indexNiveauProfil = 0;
  const profilIdPourVerrou = lireProfilActifId();
  ORDRE_PALIERS.filter(n => CONTENU.paliers[n]).forEach(n => {
    const verr = ORDRE_PALIERS.indexOf(n) > indexNiveauProfil && !bonusDejaRevele(profilIdPourVerrou, n);
    const puce = document.createElement('button');
    puce.type = 'button';
    puce.className = 'puce-palier' + (n === etatPalierAffiche ? ' actif' : '') + (verr ? ' verrouille' : '');
    puce.textContent = verr ? n + ' 🔒' : n;
    puce.disabled = verr;
    if (!verr) puce.addEventListener('click', () => { etatPalierAffiche = n; construireAccueil(); });
    rangee.appendChild(puce);
  });
  $('note-palier').textContent = niveauProfil
    ? 'Niveau de ' + (niveauProfil === etatPalierAffiche
        ? 'ton profil'
        : 'ton profil : ' + niveauProfil + ' — tu regardes le palier ' + etatPalierAffiche)
    : '';

  const grille = $('grille-jeux');
  grille.innerHTML = '';
  (palier ? palier.miniJeux : []).forEach(cfg => grille.appendChild(creerCarte(cfg)));

  const suivant = palierSuivant(etatPalierAffiche);
  const blocBonus = $('bloc-bonus'), paquet = $('paquet-cadeau'), grilleBonus = $('grille-bonus');
  if (suivant && palierMaitrise(etatPalierAffiche)) {
    blocBonus.hidden = false;
    $('note-bonus').textContent =
      'Tu maîtrises tout le palier ' + etatPalierAffiche + ' : essaie un aperçu du palier ' + suivant + ' !';
    grilleBonus.innerHTML = '';
    CONTENU.paliers[suivant].miniJeux.forEach(cfg => grilleBonus.appendChild(creerCarte(cfg)));
    const profilId = lireProfilActifId();
    if (bonusDejaRevele(profilId, suivant)) { paquet.hidden = true; grilleBonus.hidden = false; }
    else {
      paquet.hidden = false; paquet.disabled = false;
      paquet.classList.remove('paquet-cadeau-ouverture');
      grilleBonus.hidden = true;
      /* Propriété `onclick` et non addEventListener : ce bouton est un
         élément fixe réutilisé à chaque rendu (CHARTE §15). */
      paquet.onclick = () => ouvrirPaquetCadeau(profilId, suivant, paquet, grilleBonus);
    }
  } else blocBonus.hidden = true;
}
function ouvrirPaquetCadeau(profilId, cible, paquet, grilleBonus){
  if (paquet.disabled) return;
  paquet.disabled = true;
  marquerBonusRevele(profilId, cible);
  lancerConfettis(50); sonBonneReponse();
  paquet.classList.add('paquet-cadeau-ouverture');
  setTimeout(() => { paquet.hidden = true; grilleBonus.hidden = false; }, 480);
}

function trouverMiniJeu(id){
  for (const nom of ORDRE_PALIERS) {
    const p = CONTENU.paliers[nom];
    if (!p) continue;
    const cfg = p.miniJeux.find(mj => mj.id === id);
    if (cfg) return {cfg, palier:p, palierNom:nom};
  }
  return null;
}
function lance(id){
  const t = trouverMiniJeu(id);
  if (!t) return;
  miniJeuCourant = t;
  file = construireFile(t.cfg, t.palier);
  pos = 0; score = 0;
  /* Une manche déclare son propre poids quand il n’est pas celui de son
     mode : une phase de convoyeur vaut ses N prises. */
  total = file.reduce((s, q) => s + (q.points !== undefined ? q.points : pointsParManche(q.mode)), 0);
  demarreLe = Date.now();
  $('hdrTitle').textContent = t.cfg.titre;
  montreEcran('game');
  question();
}

/* La pastille reflète LES POINTS OBTENUS, pas le seul verdict de la dernière
   étape (B4.3). Depuis que le retour de l’étape 2 ne juge que l’étape 2, une
   manche en deux temps où seule la désignation était juste rapportait 1 point
   et affichait pourtant une pastille rouge. */
function majDots(){
  $('dots').innerHTML = file.map((q, i) => {
    const acquis = q._pts !== undefined ? q._pts > 0 : q._ok;
    return `<span class="dot ${i < pos ? (acquis ? 'ok' : 'ko') : i === pos ? 'cur' : ''}"></span>`;
  }).join('');
}
function message(txt, cl, correction){
  const f = $('feedback');
  f.textContent = txt || '';
  f.className = cl || '';
  if (correction) {
    const s = document.createElement('span');
    s.className = 'correction-attendue';
    s.textContent = ' ' + correction;
    f.appendChild(s);
  }
}

/* ---- Rendu d’une manche ---- */
function question(){
  desarmerAutoSuivant(); stopperVoix(); arreterConvoyeur();
  const q = file[pos];
  verrouille = false; selection = new Set();
  $('feedback').textContent = ''; $('feedback').className = '';
  $('btnNext').style.display = 'none';
  $('btnValider').style.display = 'none';
  $('btnEffacer').hidden = true;
  $('answers').innerHTML = ''; $('answers').className = '';
  $('vitrail').hidden = true;
  $('svgScene').classList.remove('convoyeur');
  $('sousConsigne').textContent = q.sous || '';
  poserConsigne(q.q);
  majDots();

  if (q.mode === 'convoyeur') rendreConvoyeur(q);
  else if (q.mode === 'reconnaitre') rendreReconnaitre(q);
  else if (q.mode === 'relations') rendreRelations(q);
  else if (q.mode === 'decrire') rendreDecrire(q);
  else if (q.mode === 'justifier') rendreJustifier(q);
  else if (q.mode === 'angles') rendreAngles(q);
  else if (q.mode === 'vocabulaire') rendreVocabulaire(q);
  else if (q.mode === 'portrait') rendrePortrait(q);
  else rendreLitige(q);
}
/* La consigne est lue à voix haute et réécoutable : au CP surtout, elle ne
   doit pas dépendre de la lecture. */
function poserConsigne(texte){
  $('qText').innerHTML = '';
  const t = document.createElement('span');
  t.textContent = texte;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn-voix'; b.textContent = '🔊';
  b.setAttribute('aria-label', 'Écouter la consigne');
  b.addEventListener('click', () => lireAVoixHaute(texte));
  $('qText').append(t, b);
  lireAVoixHaute(texte);
}

function boutonRep(libelle, onClick, opts){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'rep' + ((opts && opts.centre) ? ' centre' : '');
  if (opts && opts.schema) {
    const d = document.createElement('span');
    d.innerHTML = opts.schema;
    b.appendChild(d.firstChild);
  }
  const t = document.createElement('span');
  t.className = 'txt'; t.textContent = libelle;
  b.appendChild(t);
  if (opts && opts.voix) {
    const r = document.createElement('button');
    r.type = 'button'; r.className = 'relire'; r.textContent = '🔊';
    r.setAttribute('aria-label', 'Réécouter cette phrase');
    r.addEventListener('click', (ev) => { ev.stopPropagation(); lireAVoixHaute(libelle); });
    b.appendChild(r);
  }
  b.addEventListener('click', onClick);
  return b;
}

/* QCM générique : une seule bonne réponse, mélangée (§13), correction en
   vert même si elle n’a pas été touchée (§18). */
function rendreQcm(opts, ans, apres, extra){
  const zone = $('answers');
  /* `classList.add` et non `className = …` : l’appelant a pu poser
     `compact` avant nous, et l’écraser ferait défiler l’écran. */
  if (opts.every(o => String(o).length < 16)) zone.classList.add('duo');
  opts.forEach(o => {
    const b = boutonRep(String(o), () => {
      if (verrouille) return;
      verrouille = true;
      const bon = String(o) === String(ans);
      zone.querySelectorAll('.rep').forEach(x => {
        x.disabled = true;
        if (x !== b) x.classList.add('dim');
      });
      b.classList.add(bon ? 'ok' : 'ko');
      if (!bon) {
        const cible = [...zone.querySelectorAll('.rep')].find(x => x.querySelector('.txt').textContent === String(ans));
        if (cible) { cible.classList.remove('dim'); cible.classList.add('ok'); }
      }
      apres(bon);
    }, Object.assign({centre:true}, extra || {}));
    zone.appendChild(b);
  });
}

function rendreQcmSurFigure(q){
  afficherScene(q.pieces);
  rendreQcm(q.opts, q.ans, bon => terminerManche(bon, bon ? null : 'La bonne réponse était : ' + q.ans));
}

/* ---- cp-decrire : sur une erreur de comptage, on COMPTE devant l’enfant ----
   Annoncer « c’était 5 » n’apprend rien. Un compteur s’allume dans un coin
   du plan — hors de la figure, qui est logée dans le reste du cadre — puis
   s’incrémente pendant que les côtés se colorent un à un, ou que les
   sommets se marquent d’un point. Le passage automatique à la manche
   suivante (§20) est neutralisé le temps du décompte, comme dans « Je
   compte » de M36. */
const PAS_COMPTAGE = 460;
function rendreDecrire(q){
  if (!q.compte) { rendreQcmSurFigure(q); return; }
  const H = SCENE_H_DEFAUT;
  const chip = `<g id="compteur" opacity="0">`
    + `<rect x="12" y="14" width="52" height="46" rx="12" fill="#fff" stroke="#12233C" stroke-width="2.5"/>`
    + `<text id="compteurTxt" x="38" y="47" text-anchor="middle" font-size="30" font-weight="700" fill="#12233C">0</text></g>`;
  afficherScene(q.pieces, '', H, {x:78, y:0, l:SCENE_L - 78, h:H});
  $('svgScene').insertAdjacentHTML('beforeend', chip + `<g id="decompte"></g>`);
  rendreQcm(q.opts, q.ans, bon => {
    terminerManche(bon, bon ? null : 'La bonne réponse était : ' + q.ans);
    if (bon) return;
    desarmerAutoSuivant();          // on laisse le temps de regarder compter
    animerComptage(q);
  });
}
function animerComptage(q){
  const svg = $('svgScene');
  const chip = svg.querySelector('#compteur'), txt = svg.querySelector('#compteurTxt');
  const g = svg.querySelector('#decompte');
  if (!chip || !g) return;
  chip.setAttribute('opacity', '1');
  /* Les marques se posent dans le MÊME groupe transformé que la figure :
     elles suivent la mise à l’échelle de la scène sans calcul supplémentaire. */
  const hote = svg.querySelector('#scenePieces') || g;
  const pts = q.pieces[0].pts || [];
  const n = pts.length;
  let k = 0;
  const pas = () => {
    if (!svg.isConnected || k >= n) return;
    const i = k;
    if (q.compte === 'cotes') {
      const a = pts[i], b = pts[(i + 1) % n];
      hote.insertAdjacentHTML('beforeend',
        `<line class="trait-compte" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`);
    } else {
      const a = pts[i];
      hote.insertAdjacentHTML('beforeend', `<circle class="point-compte" cx="${a[0]}" cy="${a[1]}" r="7"/>`);
    }
    k++;
    txt.textContent = String(k);
    if (k < n) setTimeout(pas, PAS_COMPTAGE);
  };
  setTimeout(pas, 320);
}

/* ---- cp/ce1-reconnaitre : sélection multiple puis validation ---- */
function rendreReconnaitre(q){
  const dem = q.demandees;
  const attendues = q.pieces.filter(p => dem.includes(p.forme)).map(p => p.id);
  /* Jusqu’à sept pièces sur quatre rangées : c’est la HAUTEUR qui limite
     leur taille, et un cadre de 236 les réduisait à des vignettes que le
     doigt d’un CP rate. L’écran n’a pas d’autre contenu qu’un bouton, on
     peut donc s’étendre. */
  afficherScene(q.pieces, q.serti || '', 306);
  $('btnValider').style.display = 'block';
  brancherEffacer();
  $('svgScene').querySelectorAll('.piece').forEach(g => {
    g.addEventListener('click', () => {
      if (verrouille) return;
      const id = g.dataset.piece;
      if (selection.has(id)) { selection.delete(id); g.classList.remove('sel'); }
      else { selection.add(id); g.classList.add('sel'); sonClic(); }
    });
  });
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    $('btnEffacer').hidden = true;
    const choisies = [...selection];
    const bon = choisies.length === attendues.length && choisies.every(id => attendues.includes(id));
    /* §18 : on montre l’état complet — ce qui était juste, ce qui était de
       trop, et ce qui manquait (en pointillé vert). */
    $('svgScene').querySelectorAll('.piece').forEach(g => {
      const id = g.dataset.piece, att = attendues.includes(id), pris = selection.has(id);
      g.classList.remove('sel');
      if (pris && att) g.classList.add('bon');
      else if (pris && !att) g.classList.add('faux');
      else if (!pris && att) g.classList.add('manque');
    });
    terminerManche(bon, bon ? null : 'Les pièces entourées en vert étaient les bonnes.');
  };
}

/* ---- cp-relations : phrases courtes TOUJOURS illustrées ---- */
function rendreRelations(q){
  if (q.multi) { rendreRelationsMulti(q); return; }
  /* Jusqu’à quatre propositions illustrées : la scène est raccourcie
     d’autant, et à la MÊME hauteur que la variante à choix multiple —
     l’encombrement ne doit pas bouger d’une manche à l’autre (A3). */
  afficherScene(q.pieces, '', HAUTEUR_RELATIONS);
  const zone = $('answers');
  zone.className = 'compact';
  q.props.forEach(p => {
    const texte = texteRelation(p.e);
    const b = boutonRep(texte, () => {
      if (verrouille) return;
      verrouille = true;
      zone.querySelectorAll('.rep').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
      b.classList.add(p.bon ? 'ok' : 'ko');
      if (!p.bon) {
        const cible = [...zone.querySelectorAll('.rep')][q.props.findIndex(x => x.bon)];
        if (cible) { cible.classList.remove('dim'); cible.classList.add('ok'); }
      }
      terminerManche(p.bon, p.bon ? null : 'La phrase vraie est en vert.');
    }, {schema:schemaRelation(p.e), voix:true});
    zone.appendChild(b);
  });
}

/* Choix MULTIPLE : la description officielle du programme est cumulative,
   plusieurs phrases sont vraies à la fois sur la même figure. On coche, puis
   on vérifie ; la réponse n’est juste que si l’ENSEMBLE coché est exactement
   l’ensemble des phrases vraies. */
function rendreRelationsMulti(q){
  afficherScene(q.pieces, '', HAUTEUR_RELATIONS);
  const zone = $('answers');
  zone.className = 'compact';
  const choisies = new Set();
  q.props.forEach((p, i) => {
    const b = boutonRep(texteRelation(p.e), () => {
      if (verrouille) return;
      if (choisies.has(i)) { choisies.delete(i); b.classList.remove('coche'); }
      else { choisies.add(i); b.classList.add('coche'); sonClic(); }
    }, {schema:schemaRelation(p.e), voix:true});
    zone.appendChild(b);
  });
  $('btnValider').style.display = 'block';
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    const attendues = q.props.map((p, i) => p.bon ? i : -1).filter(i => i >= 0);
    const bon = choisies.size === attendues.length && attendues.every(i => choisies.has(i));
    /* §18 : toutes les phrases vraies passent au vert, y compris celles que
       l’enfant a oubliées ; le rouge ne marque que ce qu’il a coché à tort. */
    zone.querySelectorAll('.rep').forEach((el, i) => {
      el.disabled = true;
      el.classList.remove('coche');
      if (q.props[i].bon) el.classList.add('ok');
      else if (choisies.has(i)) el.classList.add('ko');
      else el.classList.add('dim');
    });
    terminerManche(bon, bon ? null : 'Les phrases vraies sont en vert : il y en avait '
      + attendues.length + '.');
  };
}

/* ---- ce1-justifier : deux temps, la preuve compte double ---- */
function rendreJustifier(q){
  /* Les propriétés énoncées sont longues (« ses quatre angles sont droits
     et ses quatre côtés ont la même longueur ») : sans mise en page
     compacte, trois options de trois lignes font défiler l’écran. */
  afficherScene(q.pieces, '', 168);
  $('answers').classList.add('compact');
  const e = q.etape === 1 ? q.etape1 : q.etape2;
  poserConsigne(e.q);
  rendreQcm(e.opts, e.ans, bon => {
    if (q.etape === 1) {
      q._pts = (q._pts || 0) + (bon ? POINTS_ETAPE1 : 0);
      q._ok1 = bon;
      message(bon ? 'Bien vu !' : 'Presque !', bon ? 'bon' : 'mauvais',
        bon ? null : 'C’était ' + e.ans + '.');
      if (bon) sonBonneReponse(); else sonErreur();
      $('btnNext').style.display = 'block';
      $('btnNext').textContent = 'Et maintenant ? ➜';
      $('btnNext').onclick = () => {
        q.etape = 2; verrouille = false;
        $('answers').innerHTML = ''; $('answers').className = '';
        $('btnNext').style.display = 'none';
        message('');
        $('sousConsigne').textContent = 'Cette réponse compte double.';
        rendreJustifier(q);
      };
      armerAutoSuivant();
    } else {
      q._pts = (q._pts || 0) + (bon ? POINTS_ETAPE2 : 0);
      /* Même correctif qu’au litige (B4.3) : la preuve se juge seule. */
      terminerManche(bon, bon ? null : 'La bonne raison est en vert.', q._pts,
        bon && !q._ok1 ? 'Mais le nom, lui, restait à trouver.' : null);
    }
  });
}

/* ---- ce1-angles : l’angle visé est marqué sur la figure ---- */
function rendreAngles(q){
  const p = q.pieces[0], pts = p.pts, i = q.sommet, n = pts.length;
  const s = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
  const vers = (u, v, d) => {
    const L = hyp(u, v);
    return [u[0] + (v[0] - u[0]) / L * d, u[1] + (v[1] - u[1]) / L * d];
  };
  const m1 = vers(s, a, 26), m2 = vers(s, b, 26);
  /* L’arc doit être CENTRÉ SUR LE SOMMET et balayer l’angle INTÉRIEUR —
     c’est la convention des manuels. Le drapeau de balayage était figé à 1 :
     selon le sens de parcours du polygone, l’arc partait alors de l’autre
     côté et se refermait à l’envers. On le déduit maintenant du signe de
     l’écart angulaire, ce qui place le centre de l’arc sur le sommet quelle
     que soit l’orientation de la pièce. */
  const d1 = Math.atan2(m1[1] - s[1], m1[0] - s[0]);
  const d2 = Math.atan2(m2[1] - s[1], m2[0] - s[0]);
  let ecart = d2 - d1;
  while (ecart <= -Math.PI) ecart += TAU;
  while (ecart > Math.PI) ecart -= TAU;
  const chemin = `M ${m1[0]} ${m1[1]} A 26 26 0 0 ${ecart > 0 ? 1 : 0} ${m2[0]} ${m2[1]}`;
  /* Le marqueur ne peut pas être orange : le verre l’est aussi. Halo blanc
     sous un trait d’encre — lisible sur les huit teintes. */
  const marque = `<path class="marque-angle-halo" d="${chemin}"/>`
    + `<path class="marque-angle" d="${chemin}"/>`
    + `<circle class="sommet-angle" cx="${s[0]}" cy="${s[1]}" r="5"/>`;
  afficherScene(q.pieces, marque);
  rendreQcm(q.opts, q.ans, bon => terminerManche(bon, bon ? null : 'C’était ' + q.ans + '.'));
}

/* ============================================================
   CHOISIR LA CIBLE TOUCHÉE (A2)
   ------------------------------------------------------------
   Des bandes transparentes empilées attribuent le toucher au dernier
   élément DESSINÉ, pas au plus proche : une largeur se voyait comptée
   comme une longueur près d’un coin, et le centre comme le diamètre, qui
   passe par lui. On mesure donc la distance à CHAQUE cible et on tranche —
   avec une règle de priorité : un POINT l’emporte toujours sur une LIGNE
   qui passe dessus, parce qu’un point est plus difficile à viser et qu’on
   ne le désigne jamais par accident.
   ============================================================ */
function distanceAuSegment(p, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx*dx + dy*dy;
  if (L2 < 1e-9) return hyp(p, a);
  let t = ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return hyp(p, [a[0] + dx*t, a[1] + dy*t]);
}
const SEUIL_TOUCHER = 26, BONUS_POINT = 14;
function cibleTouchee(p, cibles){
  let meilleure = null, meilleurScore = Infinity;
  cibles.forEach(c => {
    const d = c.type === 'point' ? hyp(p, c.p) : distanceAuSegment(p, c.a, c.b);
    if (d > SEUIL_TOUCHER) return;
    /* Le bonus donne la priorité au point sans écraser la distance : une
       ligne franchement plus proche l’emporte quand même. */
    const score = d - (c.type === 'point' ? BONUS_POINT : 0);
    if (score < meilleurScore) { meilleurScore = score; meilleure = c; }
  });
  return meilleure;
}
/* Capte les touchers sur toute la scène et les attribue à la bonne cible.
   L’écouteur est posé sur le <svg> lui-même, qui SURVIT au changement de
   manche : sans retrait explicite, ils s’empilent, et le plus ancien —
   avec ses cibles périmées — répond en premier. C’est le même piège que le
   `onclick` du paquet cadeau (§15). */
function brancherCibles(svg, cibles, surChoix, repere){
  if (svg._ecouteurCibles) svg.removeEventListener('click', svg._ecouteurCibles);
  const handler = (ev) => {
    if (verrouille) return;
    /* Le toucher doit être converti dans L’ESPACE OÙ VIVENT LES CIBLES, et
       non dans celui de la racine : depuis que la scène est logée par
       homothétie dans un cadre fixe, ses pièces habitent le repère du
       groupe `#scenePieces`. Passer par la matrice de la racine décalait
       tout du facteur d’échelle, et plus rien ne répondait au litige. */
    const cadre = repere && repere.isConnected ? repere : svg;
    const m = cadre.getScreenCTM();
    if (!m) return;
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const q = pt.matrixTransform(m.inverse());
    const c = cibleTouchee([q.x, q.y], cibles);
    if (c) surChoix(c);
  };
  svg._ecouteurCibles = handler;
  svg.addEventListener('click', handler);
}

/* ---- ce2-vocabulaire : la rosace, désignation ou classement ----
   PLUSIEURS RÉPONSES SONT JUSTES et le jeu les accepte toutes : un
   rectangle a deux longueurs, deux largeurs et deux diagonales, un cercle
   une infinité de rayons. Refuser la seconde longueur serait faux ; la
   consigne dit donc « touche UNE longueur », au singulier indéfini.
   Les cibles ne se recouvrent plus : chaque zone est RÉTRÉCIE loin des
   coins et des extrémités, et le centre est dessiné en DERNIER, donc
   au-dessus — toucher le centre était auparavant lu comme un toucher du
   diamètre, qui passe par lui. */
const VOC_VB = '-150 -110 300 246';
function rendreVocabulaire(q){
  const svg = $('svgScene');
  $('vitrail').hidden = false;
  svg.setAttribute('viewBox', VOC_VB);

  /* Le présentoir de pièces et l’écran « quel mot les englobe toutes ? » ont
     disparu avec le classement par catégorie, parti au CONVOYEUR : la rosace
     ne porte plus que la désignation d’éléments. Du code qu’aucune notion
     n’atteignait plus se lit comme du code vivant, et se maintient comme
     tel — on le retire. */
  const R = construireRosace(), CY = -18, RR = 86;
  const petales = R.petales.map(p => ({...p, pts:p.pts.map(([x, y]) => [x * RR / R.R, y * RR / R.R + CY])}));
  const hex = {...R.hexagone, pts:R.hexagone.pts.map(([x, y]) => [x * RR / R.R, y * RR / R.R + CY])};

  /* Le quadrilatère de référence, ENTOURÉ DE JAUNE quand la question porte
     sur lui : « ce quadrilatère » ne désignait rien à l’écran. */
  const RX = 78, RY0 = 74, RY1 = 118;
  const rect = {id:'rect', forme:'rectangle',
    pts:[[-RX, RY0], [RX, RY0], [RX, RY1], [-RX, RY1]], couleur:'#5AB4DC'};
  const surRect = ['diagonale','longueur','largeur'].includes(q.notion);
  const halo = surRect
    ? `<rect class="surbrillance" x="${-RX-12}" y="${RY0-12}" width="${2*RX+24}" height="${RY1-RY0+24}" rx="14"/>`
    : '';
  const anneau = `<circle class="${['centre','rayon','diametre'].includes(q.notion) ? 'anneau-vise' : ''}"
      cx="0" cy="${CY}" r="${RR}" fill="none" stroke="#2B3A55" stroke-width="4"/>`;
  const fond = petales.map(p => svgPiece(p)).join('') + svgPiece(hex) + halo + svgPiece(rect) + anneau;

  /* Les CIBLES sont des objets géométriques, pas des bandes empilées : le
     toucher est attribué à la plus proche (cf. `cibleTouchee`). Un cercle a
     une infinité de rayons et de diamètres, un rectangle deux longueurs,
     deux largeurs et deux diagonales : on en trace plusieurs, et TOUS sont
     acceptés quand la question les vise. */
  const surCercle = (a) => [RR * Math.cos(a), CY + RR * Math.sin(a)];
  const r = rect.pts;
  const cibles = [
    {id:'rayon-1', type:'segment', a:[0, CY], b:surCercle(-1.05), notion:'rayon'},
    {id:'rayon-2', type:'segment', a:[0, CY], b:surCercle(-2.30), notion:'rayon'},
    {id:'diam-1', type:'segment', a:surCercle(0), b:surCercle(Math.PI), notion:'diametre'},
    {id:'diam-2', type:'segment', a:surCercle(1.05), b:surCercle(1.05 + Math.PI), notion:'diametre'},
    {id:'long-h', type:'segment', a:r[0], b:r[1], notion:'longueur'},
    {id:'long-b', type:'segment', a:r[3], b:r[2], notion:'longueur'},
    {id:'larg-d', type:'segment', a:r[1], b:r[2], notion:'largeur'},
    {id:'larg-g', type:'segment', a:r[0], b:r[3], notion:'largeur'},
    {id:'diag-1', type:'segment', a:r[0], b:r[2], notion:'diagonale'},
    {id:'diag-2', type:'segment', a:r[1], b:r[3], notion:'diagonale'},
    {id:'centre', type:'point', p:[0, CY], notion:'centre'}
  ];
  cibles.forEach(c => { c.bon = c.notion === q.notion; });

  /* Le repère fin qui dit « il y a là quelque chose à toucher ». La cible,
     elle, n’est plus un élément du DOM : c’est de la géométrie. */
  const trace = cibles.map(c => c.type === 'point'
    ? `<circle class="indice" data-c="${c.id}" cx="${c.p[0]}" cy="${c.p[1]}" r="5"/>`
    : `<line class="indice-trait" data-c="${c.id}" x1="${c.a[0]}" y1="${c.a[1]}" x2="${c.b[0]}" y2="${c.b[1]}"/>`).join('');
  svg.innerHTML = fond + trace;

  brancherCibles(svg, cibles, (c) => {
    verrouille = true;
    const marquer = (id, cl) => {
      const e = svg.querySelector(`[data-c="${id}"]`);
      if (e) e.classList.add(cl);
    };
    marquer(c.id, c.bon ? 'trace-bon' : 'trace-faux');
    /* §18 : toutes les réponses qui convenaient passent au vert. */
    if (!c.bon) cibles.filter(x => x.bon).forEach(x => marquer(x.id, 'trace-bon'));
    const n = cibles.filter(x => x.bon).length;
    terminerManche(c.bon, c.bon ? null : (n > 1
      ? 'Les ' + n + ' réponses possibles sont en vert.'
      : 'Ce qu’il fallait toucher est en vert.'));
  });
}

/* ---- ce2-portrait : le présentoir ---- */
/* ============================================================
   LE CONVOYEUR — le moteur (SPEC-M34-convoyeur §2, §3, §6)
   ============================================================

   LE RISQUE PRINCIPAL est de mesurer la dextérité au lieu de la géométrie.
   Toucher un objet en mouvement est une tâche MOTRICE avant d’être une tâche
   géométrique : trop vite ou trop petit, le jeu pénalise l’enfant lent à
   reconnaître exactement comme l’enfant maladroit. D’où trois garde-fous qui
   ne se négocient pas — vitesse par défaut la plus LENTE des trois, pièces
   d’au moins 80 px apparents (le double des 44 px d’une cible fixe : une
   cible mobile en demande davantage), et AUCUNE pénalité d’oubli au CP.

   TROIS PIÈGES TECHNIQUES, et ce qu’on en fait :

   1. La position se calcule à partir du TEMPS ÉCOULÉ, jamais d’un incrément
      par image — sinon la vitesse dépend de la fréquence de l’écran et le jeu
      n’a pas la même difficulté sur deux appareils.

   2. Le toucher se résout à l’instant du `pointerdown`, pas sur la dernière
      image rendue. À 120 unités/s, une image de retard, c’est deux unités
      d’écart ; sur un appareil qui rame, bien davantage. On avance donc les
      pièces jusqu’à l’instant exact du doigt avant de chercher laquelle il
      désigne.

   3. `touch-action:none` sur la seule zone du tapis, posé sur les pièces
      comme sur le fond : la propriété ne s’hérite pas, et sans elle viser une
      pièce ferait défiler la page.

   LE CHANGEMENT DE CONSIGNE est le moment critique : si l’enfant ne le
   remarque pas, il continue sur l’ancienne forme et accumule des erreurs sans
   comprendre. On vide donc le tapis — plus aucune pièce nouvelle dès la
   N-ième prise, les autres finissent leur course — puis on marque une
   respiration et la nouvelle consigne arrive, lue à voix haute. Le tapis vide
   fait la ponctuation : chaque pièce appartient sans équivoque à une seule
   consigne, et la vitesse n’a jamais eu à varier.
   ============================================================ */
const CONVOYEUR_VB_L = 340, CONVOYEUR_VB_H = 208;
const CONVOYEUR_TAILLE = 78;          // ≈ 80 px apparents sur un téléphone
const CONVOYEUR_ESPACEMENT = 122;     // entre deux pièces : plus large qu’une pièce tournée
const CONVOYEUR_MARGE = 62;           // demi-encombrement maximal d’une pièce tournée
const CONVOYEUR_TOL = 10;             // rattrapage : à 10 unités du bord, c’est touché
const CONVOYEUR_GEL = 850;            // ms d’immobilisation d’une pièce touchée à tort
const CONVOYEUR_RESPIRATION = 1000;   // ms de tapis vide entre deux consignes
const CONVOYEUR_COEF = [1, 1.1, 1.2];
const CLE_VITESSE = 'mayeutik-m34-convoyeur-vitesse';

function mouvementReduit(){
  try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}
/* Le cran de vitesse est un CHOIX de l’enfant, mémorisé par profil, et il ne
   conditionne aucune progression : on termine le jeu au cran le plus lent. */
function lireCranVitesse(){
  if (mouvementReduit()) return 0;
  try {
    const t = JSON.parse(localStorage.getItem(CLE_VITESSE) || '{}');
    const v = t[lireProfilActifId()];
    return (v === 1 || v === 2) ? v : 0;
  } catch(e){ return 0; }
}
function ecrireCranVitesse(c){
  try {
    const t = JSON.parse(localStorage.getItem(CLE_VITESSE) || '{}');
    t[lireProfilActifId()] = c;
    localStorage.setItem(CLE_VITESSE, JSON.stringify(t));
  } catch(e){}
}

/* Le doigt est-il sur cette pièce ? On mesure une DISTANCE à la géométrie,
   avec un rattrapage : viser une cible qui bouge n’est pas viser un bouton. */
function distanceAPiece(p, x, y){
  if (p.forme === 'disque' || p.forme === 'cercle')
    return Math.max(0, Math.hypot(x - p.centre[0], y - p.centre[1]) - p.rayon);
  const pts = p.pts, n = pts.length;
  let dedans = false, d = 1e9;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    if ((pts[i][1] > y) !== (pts[j][1] > y) &&
        x < (pts[j][0] - pts[i][0]) * (y - pts[i][1]) / (pts[j][1] - pts[i][1]) + pts[i][0]) dedans = !dedans;
    d = Math.min(d, distanceAuSegment([x, y], pts[i], pts[j]));
  }
  return dedans ? 0 : d;
}

/* L’ÉTIQUETTE POSÉE SUR LE TAPIS. L’en-tête sort du champ dès que la partie
   reprend : l’enfant regarde le tapis, pas le titre. La consigne courte reste
   donc là où sont ses yeux, du début à la fin de la phase — elle ne remplace
   pas l’annonce, elle prend le relais quand l’annonce s’est éteinte.

   Le cartouche est dimensionné sur le texte RÉELLEMENT rendu (`getBBox`) et
   non sur une estimation au nombre de caractères : « les triangles rectangles »
   et « les carrés » n’ont pas la même largeur, et une largeur devinée déborde
   ou flotte. */
function poserEtiquetteTapis(svg, mot){
  const g = svg.querySelector('#etiquetteTapis');
  const texte = 'les ' + plurDe(mot);
  g.innerHTML = `<rect class="etiquette-tapis" x="10" y="8" rx="13" height="30" width="10"/>`
    + `<text class="etiquette-oeil" x="24" y="24">👀</text>`
    + `<text class="etiquette-texte" x="46" y="24">${texte}</text>`;
  const t = g.querySelector('.etiquette-texte');
  const l = t.getBBox().width;
  g.querySelector('.etiquette-tapis').setAttribute('width', Math.round(l + 52));
}

/* L’annonce : la consigne grossit et vire à l’orange le temps d’un souffle.
   C’est le moment que les enfants rataient — ils poursuivaient sur la forme
   précédente et accumulaient les erreurs sans comprendre. */
function annoncerConsigne(svg){
  const cibles = [$('qText'), svg && svg.querySelector('#etiquetteTapis')].filter(Boolean);
  cibles.forEach(e => {
    e.classList.remove('annonce');
    void e.getBoundingClientRect();   // on relance l’animation même si elle vient de jouer
    e.classList.add('annonce');
  });
  setTimeout(() => cibles.forEach(e => e.classList.remove('annonce')), 1400);
}

let convoyeur = null;
function arreterConvoyeur(){
  if (convoyeur) { convoyeur.detruire(); convoyeur = null; }
}

function rendreConvoyeur(q){
  const palier = miniJeuCourant.palier;
  const vitesses = palier.vitesses || [35, 55, 80];
  let cran = lireCranVitesse();

  const svg = $('svgScene');
  svg.setAttribute('viewBox', `0 0 ${CONVOYEUR_VB_L} ${CONVOYEUR_VB_H}`);
  /* Bandeau du haut réservé à l’étiquette de consigne, bande du tapis en
     dessous : la hauteur totale ne bouge pas, seul le partage change. */
  const yBande = 46, hBande = CONVOYEUR_VB_H - yBande - 22;
  svg.innerHTML =
      `<rect class="tapis-fond" x="0" y="0" width="${CONVOYEUR_VB_L}" height="${CONVOYEUR_VB_H}" rx="10"/>`
    + `<rect class="tapis-bande" x="0" y="${yBande}" width="${CONVOYEUR_VB_L}" height="${hBande}"/>`
    + `<line class="tapis-rail" x1="6" y1="${yBande}" x2="${CONVOYEUR_VB_L-6}" y2="${yBande}"/>`
    + `<line class="tapis-rail" x1="6" y1="${yBande+hBande}" x2="${CONVOYEUR_VB_L-6}" y2="${yBande+hBande}"/>`
    + `<g id="etiquetteTapis"></g>`
    + `<g id="tapisPieces"></g>`
    + `<g id="voilePause" style="display:none">`
    + `<rect class="voile-pause" x="0" y="0" width="${CONVOYEUR_VB_L}" height="${CONVOYEUR_VB_H}" rx="10"/>`
    + `<text class="texte-pause" x="${CONVOYEUR_VB_L/2}" y="${CONVOYEUR_VB_H/2+8}">Pause</text></g>`;
  svg.classList.add('convoyeur');
  $('game').classList.add('tapis-en-cours');
  $('vitrail').hidden = false;
  const gPieces = svg.querySelector('#tapisPieces');
  poserEtiquetteTapis(svg, q.consigne.mot);
  annoncerConsigne(svg);

  /* ---- La barre de l’atelier : manette de vitesse, pause, compteur ---- */
  const barre = document.createElement('div');
  barre.className = 'barre-convoyeur';
  const manette = document.createElement('div');
  manette.className = 'manette';
  /* Un enfant ne lit pas « Moyen » : il voit le lièvre. L’emoji porte le
     sens, le mot le confirme, et la couleur du cran actif dit où l’on est. */
  [['🐢','Lent'], ['🐇','Moyen'], ['⚡','Rapide']].forEach(([emo, nom], i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cran' + (i === cran ? ' on' : '');
    b.innerHTML = `<span class="emo" aria-hidden="true">${emo}</span>${nom}`;
    b.setAttribute('aria-label', 'Vitesse ' + nom.toLowerCase());
    b.dataset.cran = i;
    b.addEventListener('click', () => {
      cran = i; ecrireCranVitesse(i); sonClic();
      manette.querySelectorAll('.cran').forEach(x => x.classList.toggle('on', x === b));
    });
    manette.appendChild(b);
  });
  const btnPause = document.createElement('button');
  btnPause.type = 'button'; btnPause.className = 'btn-pause';
  btnPause.innerHTML = '<span class="emo" aria-hidden="true">⏸️</span>Pause';
  btnPause.setAttribute('aria-label', 'Mettre le convoyeur en pause');
  const compteur = document.createElement('span');
  compteur.className = 'compteur-prises';
  barre.append(manette, btnPause, compteur);
  $('answers').innerHTML = '';
  $('answers').appendChild(barre);

  /* ---- État de la phase ---- */
  const vivantes = [];            // pièces sur le tapis
  let suivante = 0;               // index dans le flux
  let prises = 0, erreurs = 0, oublis = 0;
  let emissionClose = false, phaseFinie = false, enPause = false;
  let anim = null, dernierTemps = 0;

  const vitesse = () => vitesses[cran];
  const majCompteur = () => {
    compteur.innerHTML = '<span class="emo" aria-hidden="true">🧺</span>'
      + prises + ' / ' + CONVOYEUR_N;
  };
  majCompteur();

  function poserPiece(p){
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'piece piece-tapis');
    g.innerHTML = svgPiece(p).replace(/^<g[^>]*>/, '').replace(/<\/g>$/, '');
    gPieces.appendChild(g);
    const e = {p, g, x:CONVOYEUR_VB_L + CONVOYEUR_MARGE,
               y:yBande + hBande/2 + (Math.random() - 0.5) * 16,
               fige:0, touchee:false};
    vivantes.push(e);
    placer(e);
    return e;
  }
  const placer = (e) => e.g.setAttribute('transform',
    `translate(${e.x.toFixed(2)},${e.y.toFixed(2)})`);

  /* Émission : une pièce nouvelle dès que la précédente a parcouru
     l’espacement. Aucune pièce n’est donc hors de portée pendant qu’une autre
     est touchée, et deux pièces ne se recouvrent jamais. */
  function emettre(){
    if (emissionClose || suivante >= q.flux.length) return;
    const derniere = vivantes.length ? vivantes[vivantes.length - 1] : null;
    if (derniere && derniere.x > CONVOYEUR_VB_L + CONVOYEUR_MARGE - CONVOYEUR_ESPACEMENT) return;
    poserPiece(q.flux[suivante++]);
  }

  function sortir(e){
    /* Une cible sortie sans avoir été touchée est un OUBLI — mais seulement
       tant que la phase est ouverte : une fois la N-ième prise faite, ce qui
       reste sur le tapis appartient déjà au passé (§3). */
    if (e.p._cible && !e.touchee && !emissionClose) {
      oublis++;
      score -= MALUS_OUBLI[palier._nom] || 0;
    }
    e.g.remove();
  }

  function avancer(dt){
    const v = vitesse();
    for (let i = vivantes.length - 1; i >= 0; i--) {
      const e = vivantes[i];
      if (e.fige > 0) { e.fige -= dt; if (e.fige <= 0) e.g.classList.remove('faux'); continue; }
      e.x -= v * dt;
      placer(e);
      if (e.x < -CONVOYEUR_MARGE) { sortir(e); vivantes.splice(i, 1); }
    }
  }

  function boucle(t){
    if (!convoyeur || phaseFinie) return;
    const dt = Math.min(0.05, (t - dernierTemps) / 1000);   // un onglet réveillé ne téléporte rien
    dernierTemps = t;
    if (!enPause) { avancer(dt); emettre(); verifierFinDePhase(); }
    anim = requestAnimationFrame(boucle);
  }

  function verifierFinDePhase(){
    if (phaseFinie) return;
    const plusRienAEnvoyer = emissionClose || suivante >= q.flux.length;
    if (!plusRienAEnvoyer || vivantes.length) return;
    phaseFinie = true;
    q._bilan = {mot:q.consigne.mot, prises, erreurs, oublis};
    q._ok = (erreurs === 0 && prises === CONVOYEUR_N);
    /* Respiration sur tapis vide, puis la consigne suivante — sans action de
       l’enfant, et sans bouton « Suivant » : le jeu ne s’interrompt pas. */
    setTimeout(() => {
      if (!convoyeur) return;
      pos++;
      if (pos < file.length) question();
      else finConvoyeur();
    }, CONVOYEUR_RESPIRATION);
  }

  /* ---- Le toucher, résolu à l’instant du doigt ---- */
  function surAppui(ev){
    if (enPause || phaseFinie || !convoyeur) return;
    ev.preventDefault();
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const m = svg.getScreenCTM();
    if (!m) return;
    const c = pt.matrixTransform(m.inverse());
    /* On rattrape le temps écoulé depuis la dernière image AVANT de chercher
       la pièce visée : c’est là que se logent les touchers « à côté ». */
    const retard = Math.max(0, Math.min(0.05, (performance.now() - dernierTemps) / 1000));
    const v = vitesse();
    let vise = null, dMin = CONVOYEUR_TOL;
    vivantes.forEach(e => {
      if (e.touchee) return;
      const x = e.x - (e.fige > 0 ? 0 : v * retard);
      const d = distanceAPiece(e.p, c.x - x, c.y - e.y);
      if (d <= dMin) { dMin = d; vise = e; }
    });
    if (!vise) return;
    vise.touchee = true;
    if (vise.p._cible) {
      prises++; score += 1; majCompteur();
      sonClic();
      vise.g.classList.add('bon');
      vise.g.style.transition = 'opacity .25s';
      vise.g.style.opacity = '0';
      const i = vivantes.indexOf(vise);
      if (i >= 0) vivantes.splice(i, 1);
      setTimeout(() => vise.g.remove(), 260);
      if (prises >= CONVOYEUR_N) { emissionClose = true; sonBonneReponse(); }
      return;
    }
    /* Erreur : la pièce s’immobilise, se marque, et SON NOM EST ANNONCÉ —
       §18, on montre toujours ce qu’il fallait voir. Elle repart ensuite, et
       ne peut plus être touchée : pas d’essai-erreur sur place. */
    erreurs++; score -= 1;
    sonErreur();
    vise.g.classList.add('faux', 'ratee');
    vise.fige = CONVOYEUR_GEL / 1000;
    const nom = vise.p._nomCalcule;
    message('C’était ' + avecArt(nom) + '.', 'mauvais');
    lireAVoixHaute('C’était ' + avecArt(nom) + '.');
    setTimeout(() => { if (convoyeur) message(''); }, CONVOYEUR_GEL + 400);
  }

  function basculerPause(){
    enPause = !enPause;
    svg.querySelector('#voilePause').style.display = enPause ? '' : 'none';
    btnPause.innerHTML = enPause
      ? '<span class="emo" aria-hidden="true">▶️</span>Reprendre'
      : '<span class="emo" aria-hidden="true">⏸️</span>Pause';
    btnPause.classList.toggle('reprend', enPause);
    btnPause.setAttribute('aria-label', enPause ? 'Reprendre le convoyeur'
                                                : 'Mettre le convoyeur en pause');
    if (enPause) stopperVoix();
  }
  btnPause.addEventListener('click', basculerPause);
  svg.addEventListener('pointerdown', surAppui);

  convoyeur = {
    detruire(){
      phaseFinie = true;
      if (anim) cancelAnimationFrame(anim);
      svg.removeEventListener('pointerdown', surAppui);
      svg.classList.remove('convoyeur');
      $('game').classList.remove('tapis-en-cours');
      $('qText').classList.remove('annonce');
    },
    /* Exposé pour les tests et le débogage : ce qui roule sur le tapis ne se
       devine pas depuis le DOM, où une pièce n’est qu’un `transform`. */
    etat(){ return {prises, erreurs, oublis, vivantes:vivantes.length,
                    emises:suivante, emissionClose, enPause, cran, phaseFinie,
                    pieces:vivantes.map(e => ({cible:e.p._cible, nom:e.p._nomCalcule,
                                               x:e.x, y:e.y, touchee:e.touchee, fige:e.fige}))}; }
  };
  dernierTemps = performance.now();
  anim = requestAnimationFrame(boucle);
}

/* L’oubli ne se paie pas au CP. Un enfant de six ans qui hésite est un enfant
   qui RÉFLÉCHIT : pénaliser l’hésitation à cet âge enseigne la précipitation,
   exactement le contraire de ce que vise la reconnaissance des formes. La
   contrainte de temps suffit à créer l’enjeu. L’erreur, elle, se paie
   partout, et plus cher que l’oubli. */
const MALUS_OUBLI = {CP:0, CE1:0.25, CE2:0.25};

function finConvoyeur(){
  /* Les crans rapides valent un léger coefficient favorable — récompenser la
     prise de risque — mais le score est BORNÉ par le total : jamais la
     vitesse lente ne devient perdante, et le contrat de session du §11 garde
     un rapport score/total lisible. */
  score = Math.max(0, Math.min(total, Math.round(score * CONVOYEUR_COEF[lireCranVitesse()])));
  arreterConvoyeur();
  fin();
}

/* Bilan PAR FORME DEMANDÉE : c’est l’information utile à l’enfant comme au
   parent — quelle forme pose problème — et non le score global. */
function bilanConvoyeur(){
  const lignes = file.filter(q => q._bilan).map(q => q._bilan);
  if (!lignes.length) return '';
  return '<table><tr><th>Consigne</th><th>Prises</th><th>Erreurs</th><th>Oublis</th></tr>'
    + lignes.map(b => `<tr><td>${plurDe(b.mot)}</td><td>${b.prises} / ${CONVOYEUR_N}</td>`
        + `<td>${b.erreurs}</td><td>${b.oublis}</td></tr>`).join('')
    + '</table>';
}

function rendrePortrait(q){
  $('vitrail').hidden = true;
  const zone = $('answers');
  zone.className = 'presentoir';
  q.piecesChoix.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'rep';
    const bb = boiteEnglobante([p]), m = 12;
    b.innerHTML = `<svg viewBox="${bb.x1 - m} ${bb.y1 - m} ${bb.x2 - bb.x1 + 2*m} ${bb.y2 - bb.y1 + 2*m}">${svgPiece(p)}</svg>`;
    b.addEventListener('click', () => {
      if (verrouille) return;
      verrouille = true;
      const bon = q.choix[i] === q.cible;
      zone.querySelectorAll('.rep').forEach((x, j) => {
        x.disabled = true;
        if (j !== i) x.classList.add('dim');
      });
      b.classList.add(bon ? 'ok' : 'ko');
      if (!bon) {
        const c = zone.querySelectorAll('.rep')[q.choix.indexOf(q.cible)];
        if (c) { c.classList.remove('dim'); c.classList.add('ok'); }
      }
      /* La description ne nomme jamais la figure — c’est tout son intérêt.
         Mais une fois la réponse vérifiée, le mot doit être donné : sans
         lui, l’enfant reconnaît sans apprendre à nommer. */
      /* « un » comme « une » commencent par une voyelle : l’élision est
         systématique, et se calcule au lieu de s’écrire. */
      const nom = 'Il s’agit d’' + avecArt(q.cible) + '.';
      terminerManche(bon, bon ? nom : 'C’était ' + avecArt(q.cible) + '.', undefined, bon ? nom : null);
    });
    zone.appendChild(b);
  });
}

/* ---- ce2-litige : désigner le défaut, puis l’énoncer (compte double) ---- */
function rendreLitige(q){
  if (q.etape === 2) { rendreLitigeEtape2(q); return; }
  /* Chaque côté porte un petit tiret en son milieu, chaque sommet un point :
     ce sont les poignées qui disent « ici, ça se touche ». Les cibles
     réelles, elles, sont larges et transparentes par-dessus. */
  const p = q.pieces[0], n = p.pts.length;
  /* Cibles GÉOMÉTRIQUES, comme sur la rosace : près d’un coin, la bande du
     côté et celle du sommet se recouvrent, et c’est le dernier élément
     dessiné qui gagnait. Un sommet est un POINT et l’emporte donc sur les
     côtés qui y aboutissent. */
  const cibles = [];
  let halos = '', indices = '';
  p.pts.forEach((a, i) => {
    const b = p.pts[(i + 1) % n];
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const L = hyp(a, b), ux = (b[0]-a[0]) / L, uy = (b[1]-a[1]) / L, d = 11;
    /* Le halo porte le MÊME `data-c` que le repère : marquer une zone les
       marque tous les deux, sans que le code de sélection ait à connaître
       leur nombre. */
    halos += `<line class="trace-halo" data-c="c${i}" x1="${mx - ux*d}" y1="${my - uy*d}" x2="${mx + ux*d}" y2="${my + uy*d}"/>`;
    halos += `<circle class="trace-halo" data-c="a${i}" cx="${a[0]}" cy="${a[1]}" r="4.5"/>`;
    indices += `<line class="indice-trait" data-c="c${i}" x1="${mx - ux*d}" y1="${my - uy*d}" x2="${mx + ux*d}" y2="${my + uy*d}"/>`;
    indices += `<circle class="indice" data-c="a${i}" cx="${a[0]}" cy="${a[1]}" r="4.5"/>`;
    cibles.push({id:'c' + i, type:'segment', a, b});
  });
  indices = halos + indices;
  p.pts.forEach((a, i) => cibles.push({id:'a' + i, type:'point', p:a}));
  afficherScene(q.pieces, indices, 210);
  $('btnValider').style.display = 'block';
  brancherEffacer();
  const svg = $('svgScene');
  brancherCibles(svg, cibles, (c) => {
    const zone = svg.querySelectorAll(`[data-c="${c.id}"]`);
    if (selection.has(c.id)) { selection.delete(c.id); zone.forEach(e => e.classList.remove('trace-choisi')); }
    else { selection.add(c.id); zone.forEach(e => e.classList.add('trace-choisi')); sonClic(); }
  }, svg.getElementById('scenePieces'));
  $('btnValider').onclick = () => {
    if (verrouille) return;
    verrouille = true;
    $('btnValider').style.display = 'none';
    $('btnEffacer').hidden = true;
    const ch = [...selection];
    const bon = selectionSatisfait(ch, q.exigences);
    /* §18 : on montre UNE désignation valable — montrer les quatre côtés
       d’un rectangle en vert laisserait croire qu’il fallait tous les
       prendre, alors qu’il en fallait deux. */
    const attendues = q.exigences.map(e => e.parmi.slice(0, e.nb)).reduce((a, b) => a.concat(b), []);
    svg.querySelectorAll('[data-c]').forEach(z => {
      const id = z.dataset.c, pris = selection.has(id);
      z.classList.remove('trace-choisi');
      if (bon && pris) z.classList.add('trace-bon');
      else if (!bon && attendues.includes(id)) z.classList.add('trace-bon');
      else if (pris) z.classList.add('trace-faux');
    });
    q._pts = (bon ? POINTS_ETAPE1 : 0);
    q._ok1 = bon;
    if (bon) sonBonneReponse(); else sonErreur();
    message(bon ? 'Bien vu, c’est là que ça coince !' : 'Presque !', bon ? 'bon' : 'mauvais',
      bon ? null : 'Ce qu’il fallait montrer est marqué en vert.');
    $('btnNext').style.display = 'block';
    $('btnNext').textContent = 'Et pourquoi ? ➜';
    $('btnNext').onclick = () => {
      q.etape = 2; verrouille = false;
      $('answers').innerHTML = ''; $('answers').className = '';
      $('btnNext').style.display = 'none';
      message('');
      rendreLitigeEtape2(q);
    };
    armerAutoSuivant();
  };
}
function rendreLitigeEtape2(q){
  afficherScene(q.pieces, '', 182);
  poserConsigne(q.etape2.q);
  $('sousConsigne').textContent = 'Cette réponse compte double.';
  rendreQcm(q.etape2.opts, q.etape2.ans, bon => {
    q._pts = (q._pts || 0) + (bon ? POINTS_ETAPE2 : 0);
    /* LE RETOUR DE L’ÉTAPE 2 NE JUGE QUE L’ÉTAPE 2 (B4.3). `terminerManche`
       affiche « Presque ! » dès que son premier argument est faux : passer
       `q._ok1 && bon` faisait donc lire « Presque ! » à l’enfant qui avait
       désigné au mauvais endroit mais donné la BONNE raison. C’est l’erreur
       corrigée en M35 B10 — mêler deux compétences dans un seul retour
       empêche de savoir laquelle a manqué. Elles sont ici explicitement
       distinctes, et déjà notées séparément (1 point + 2 points).
       Le score, lui, reste la somme des deux. */
    terminerManche(bon, bon ? null : 'La bonne raison est en vert.', q._pts,
      bon && !q._ok1 ? 'Mais l’endroit qui coince, lui, était ailleurs.' : null);
  });
}

/* EFFACER SA SÉLECTION (B4.2). Les deux mini-jeux à sélection multiple —
   le vitrail et le litige — partagent le même geste : retoucher une zone la
   retire, et ce bouton remet tout à zéro. Il vit tant que la réponse n’est
   pas rendue, et disparaît avec le bouton Vérifier. */
function brancherEffacer(){
  const b = $('btnEffacer');
  b.hidden = false;
  b.onclick = () => {
    if (verrouille) return;
    selection.clear();
    $('svgScene').querySelectorAll('.sel, .trace-choisi')
      .forEach(e => e.classList.remove('sel', 'trace-choisi'));
    sonClic();
  };
}

/* ---- Fin de manche ---- */
function terminerManche(bon, correction, ptsForces, precision){
  const q = file[pos];
  const pts = ptsForces !== undefined ? ptsForces : (bon ? 1 : 0);
  score += pts;
  q._ok = bon;
  if (bon) { sonBonneReponse(); lancerConfettis(28); message(precision ? 'Bravo ! ' + precision : 'Bravo !', 'bon'); }
  else { sonErreur(); message('Presque ! ', 'mauvais', correction || ''); }
  majDots();
  $('btnNext').style.display = 'block';
  $('btnNext').textContent = pos === file.length - 1 ? 'Voir mon score ⭐' : 'Suivant ➜';
  $('btnNext').onclick = () => {
    pos++;
    if (pos < file.length) question(); else fin();
  };
  armerAutoSuivant();
}

function fin(){
  desarmerAutoSuivant(); stopperVoix();
  const ratio = total ? score / total : 0;
  const n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  enregistrerEtoiles(miniJeuCourant.cfg.id, n);
  enregistrerSession(miniJeuCourant.cfg.id, score, total, Math.round((Date.now() - demarreLe) / 1000));
  $('hdrTitle').textContent = 'Résultat';
  $('endStars').innerHTML = '⭐'.repeat(n).split('').map(s => `<span>${s}</span>`).join('');
  $('endMsg').textContent = n === 3 ? 'Magnifique vitrail !' : n === 2 ? 'Bien joué !' : 'Continue, tu progresses !';
  $('endScore').textContent = score + ' point' + (score > 1 ? 's' : '') + ' sur ' + total + '.';
  $('endBilan').innerHTML = bilanConvoyeur();
  if (n === 3) sonNiveauParfait(); else sonBonneReponse();
  lancerConfettis(n === 3 ? 90 : 40);
  montreEcran('end');
}
$('bRejouer').addEventListener('click', () => lance(miniJeuCourant.cfg.id));
$('bMenu').addEventListener('click', retourAccueil);

/* ============================================================
   DÉMARRAGE
   ============================================================ */
construireAccueil();
montreEcran('home');

/* Lancement paramétré (CHARTE §16) : `?competence=<id>&palier=<cp|ce1|ce2>`.
   Un paramètre inconnu est ignoré en silence — ce n’est qu’un raccourci. */
(function(){
  const demande = parametreURL('competence');
  if (!demande) return;
  const t = trouverMiniJeu(demande);
  if (!t) return;
  etatPalierAffiche = t.palierNom;
  construireAccueil();
  lance(demande);
})();

/* Bouton « ← Menu » : retour à la coquille avec confirmation (CHARTE §7). */
(function(){
  const bouton = $('bouton-menu'), modale = $('modale-menu');
  if (!bouton || !modale) return;
  const fermer = () => { modale.hidden = true; };
  bouton.addEventListener('click', () => { modale.hidden = false; });
  $('modale-menu-rester').addEventListener('click', fermer);
  $('modale-menu-revenir').addEventListener('click', () => {
    fermer();
    window.location.href = '../index.html';
  });
})();
</script>
